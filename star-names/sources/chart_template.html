<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanskrit Star Names — Sky Chart</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1e;
    --panel: #121a30;
    --panel-t: rgba(16, 23, 43, 0.88);
    --ink: #e9eef8;
    --ink-2: #9aa6c0;
    --ink-3: #5d6a88;
    --line: #232f4d;
    --grid: #1b2540;
    --grid-strong: #263454;
    --c-nakshatra: #c98500;
    --c-individual: #3987e5;
    --c-saptarshi: #d55181;
    --c-vedic: #008300;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --deva: "Noto Sans Devanagari", "Devanagari MT", "Mangal", var(--sans);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 20;
    max-width: min(430px, calc(100vw - 32px));
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  #hud h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  #hud h1 .dev { font-family: var(--deva); font-weight: 600; }
  #hud .sub {
    color: var(--ink-2);
    font-size: 11.5px;
    margin-top: 3px;
    line-height: 1.45;
  }
  #legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3.5px 10px 3.5px 7px;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color 120ms, color 120ms, opacity 120ms;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip:focus-visible, button:focus-visible, .marker:focus-visible { outline: 2px solid var(--c-individual); outline-offset: 2px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(0.92); }
  .chip .dot.ring { background: transparent !important; border: 1.6px solid; }
  .chip.off { opacity: 0.38; }
  .chip.off .dot { background: var(--ink-3) !important; }
  .chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #tools .chip { padding: 3.5px 10px; }
  #tools .chip.active { border-color: var(--ink-2); color: var(--ink); }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: absolute; z-index: 30; pointer-events: none;
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 11px;
    max-width: 260px;
    opacity: 0; transition: opacity 90ms;
    box-shadow: 0 6px 22px rgba(0,0,0,0.5);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tdev { font-family: var(--deva); font-size: 16px; line-height: 1.3; }
  #tooltip .tiast { color: var(--ink-2); font-size: 11.5px; font-style: italic; }
  #tooltip .tmod { font-size: 12px; margin-top: 3px; }
  #tooltip .tmore { color: var(--ink-3); font-size: 10.5px; margin-top: 3px; }
  #tooltip .cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---------- drawer ---------- */
  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(430px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    transform: translateX(102%);
    transition: transform 200ms ease;
    display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(0,0,0,0.5);
  }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #drawer { transition: none; }
    #tooltip { transition: none; }
  }
  #drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  #drawer header .htitle { font-family: var(--serif); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  #drawer header button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #drawer header button:hover { color: var(--ink); border-color: var(--ink-3); }
  #drawer .body { overflow-y: auto; padding: 4px 16px 28px; }

  .entry { padding: 14px 0 18px; }
  .entry + .entry { border-top: 1px solid var(--line); }
  .entry h2 { font-family: var(--deva); font-size: 26px; font-weight: 600; line-height: 1.25; }
  .entry .iast { color: var(--ink-2); font-style: italic; font-size: 14px; }
  .entry .modline { margin-top: 8px; font-size: 13.5px; }
  .entry .modline b { font-weight: 600; }
  .entry .modline .sep { color: var(--ink-3); padding: 0 5px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .badge {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: 4px; padding: 2.5px 7px; border: 1px solid var(--line); color: var(--ink-2);
  }
  .badge.cat { border: none; color: #0a0f1e; font-weight: 600; }
  .badge.conf-disputed { border-style: dashed; }
  .plotnote { margin-top: 8px; color: var(--ink-3); font-size: 11.5px; font-style: italic; }
  .ref { margin-top: 14px; }
  .ref .cite { font-weight: 600; font-size: 13px; }
  .ref .links { margin: 2px 0 6px; font-size: 11.5px; }
  .ref .links a { color: var(--c-individual); text-decoration: none; }
  .ref .links a:hover { text-decoration: underline; }
  .ref .links .lsep { color: var(--ink-3); padding: 0 4px; }
  .shloka {
    font-family: var(--deva);
    font-size: 14.5px; line-height: 1.85;
    background: rgba(201, 133, 0, 0.06);
    border-left: 2px solid var(--c-nakshatra);
    border-radius: 0 6px 6px 0;
    padding: 9px 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  /* Buddhist Sanskrit is edited in IAST; the Devanagari face has nothing to set. */
  .shloka.roman { font-family: inherit; font-size: 13px; line-height: 1.7; }
  /* Stands where a verse would, for sources that have none (al-Bīrūnī's Arabic). */
  .noshloka {
    font-size: 12px; line-height: 1.6; color: var(--ink-3); font-style: italic;
    border-left: 2px dashed var(--ink-3);
    border-radius: 0 6px 6px 0;
    padding: 8px 12px;
  }
  .trans { margin-top: 7px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); font-style: italic; }
  .transby { margin-top: 3px; font-size: 11px; color: var(--ink-3); }
  .ref details { margin-top: 6px; }
  .ref summary { font-size: 11px; color: var(--ink-3); cursor: pointer; letter-spacing: 0.04em; }
  .ref details p { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; margin-top: 5px; }
  .seealso { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seealso .lbl { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; }

  /* index list */
  .ix-cat { margin-top: 14px; }
  .ix-cat h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .ix-cat h3 .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ix-row {
    display: flex; align-items: baseline; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 5px 4px; border-radius: 6px;
    font-family: var(--sans); color: var(--ink);
  }
  .ix-row:hover { background: rgba(255,255,255,0.05); }
  .ix-row .dev { font-family: var(--deva); font-size: 14.5px; }
  .ix-row .im { color: var(--ink-3); font-size: 11.5px; margin-left: auto; text-align: right; }
  .about p { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; margin-top: 10px; }
  .about p b { color: var(--ink); }
  .about a { color: var(--c-individual); text-decoration: none; }
  .about a:hover { text-decoration: underline; }

  /* credits */
  #credits {
    position: absolute; right: 16px; bottom: 6px; z-index: 10;
    font-size: 10px; color: var(--ink-3);
    text-align: right; pointer-events: none; line-height: 1.4;
  }

  /* svg text */
  .axis-lab { fill: var(--ink-3); font-size: 10.5px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .line-lab { fill: var(--ink-3); font-size: 10px; font-family: var(--sans); letter-spacing: 0.06em; }
  .star-lab {
    font-family: var(--deva); font-size: 11px;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .road-lab {
    font-family: var(--deva); font-size: 10px; opacity: 0.9;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .marker { cursor: pointer; }

  @media (max-width: 700px) {
    #hud { max-width: calc(100vw - 24px); left: 12px; top: 10px; padding: 9px 10px 7px; }
    #hud .sub { display: none; }
    #hud h1 { font-size: 15px; }
    #credits { display: none; }
    /* keep the legend to one scrollable row instead of seven stacked ones */
    #legend {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #legend::-webkit-scrollbar { display: none; }
    #legend .chip { flex: 0 0 auto; font-size: 11px; padding: 3px 8px; }
    #legend .chip .n { display: none; }
  }
</style>

<div id="app">
  <svg id="sky" role="img" aria-label="Sky chart of Sanskrit star names on a rectangular right-ascension / declination grid"></svg>

  <header id="hud">
    <h1><span class="dev">तारानामानि</span> · Sanskrit Star Names, Charted</h1>
    <div class="sub" id="subline"></div>
    <div id="legend" role="group" aria-label="Category filters"></div>
    <div id="tools">
      <button class="chip active" id="btn-labels" aria-pressed="true">Labels</button>
      <button class="chip" id="btn-index">Index</button>
      <button class="chip" id="btn-about">About &amp; caveats</button>
    </div>
  </header>

  <div id="tooltip" role="status"></div>

  <aside id="drawer" aria-hidden="true">
    <header>
      <span class="htitle" id="drawer-title">Details</span>
      <button id="drawer-close" aria-label="Close panel">✕</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <footer id="credits">
    J2000 positions · marker size ∝ apparent brightness · equirectangular RA/Dec grid<br>
    Sanskrit: sa.wikisource.org &amp; GRETIL · translations: Burgess 1860, Iyer 1884, Keith, Eggeling, Whitney, Oldenberg
  </footer>
</div>

<script>
"use strict";
const DB = __DATA__;

/* ---------- constants ---------- */
const CAT_META = {
  "nakshatra":       { color: "var(--c-nakshatra)", hex: "#c98500", label: "Nakshatra yogatārā", shape: "circle" },
  "nakshatra-alias": { color: "var(--c-nakshatra)", hex: "#c98500", label: "Other nakshatra names", shape: "ring" },
  "individual-star": { color: "var(--c-individual)", hex: "#3987e5", label: "Named stars",        shape: "circle" },
  "saptarshi":       { color: "var(--c-saptarshi)", hex: "#d55181", label: "Saptarṣi & Arundhatī", shape: "circle" },
  "vedic-asterism":  { color: "var(--c-vedic)",     hex: "#008300", label: "Vedic asterisms",     shape: "diamond" },
  "sky-figure":      { color: "var(--c-individual)", hex: "#3987e5", label: "Sky-figures",        shape: "circle" },
  "star-road":       { color: "var(--c-nakshatra)", hex: "#c98500", label: "Star-roads (vīthī)",  shape: "circle" },
  "milky-way":       { color: "var(--c-saptarshi)", hex: "#d55181", label: "Milky Way",           shape: "circle" },
  "shishumara-position": { color: "var(--ink-3)",   hex: "#5d6a88", label: "Śiśumāra positions",  shape: "circle" },
  "sky-region":      { color: "var(--ink-3)",       hex: "#5d6a88", label: "Sky-regions",         shape: "circle" },
  "collective":      { color: "var(--ink-3)",       hex: "#5d6a88", label: "Collective catalog",  shape: "circle" }
};
const EPS = 23.4393 * Math.PI / 180;   // obliquity, J2000
const MARGIN = { top: 16, right: 18, bottom: 62, left: 52 };

/* Point/figure markers, the star-roads (drawn through their own nakshatras) and
   the Milky Way names (pinned to the galactic equator) are three different kinds
   of plottable thing; everything else is Index-only. */
const plotted   = DB.items.filter(d => d.ra !== null);
const roads     = DB.items.filter(d => d.road);
const galactic  = DB.items.filter(d => d.galacticL !== undefined && d.galacticL !== null);
const unplotted = DB.items.filter(d => d.ra === null && !d.road && (d.galacticL === undefined || d.galacticL === null));
const state = {
  on: { "nakshatra": true, "nakshatra-alias": true, "individual-star": true,
        "saptarshi": true, "vedic-asterism": true, "sky-figure": true,
        "star-road": true, "milky-way": true },
  labels: true,
  pinnedIds: null
};
const byId = id => DB.items.find(i => i.id === id);

/* J2000 galactic → equatorial (Wikipedia, Galactic coordinate system) */
const NGP_RA = 192.85948 * Math.PI / 180, NGP_DEC = 27.12825 * Math.PI / 180,
      L_NCP = 122.93192 * Math.PI / 180;
function galToEq(lDeg, bDeg) {
  const l = lDeg * Math.PI / 180, b = bDeg * Math.PI / 180;
  const sd = Math.sin(NGP_DEC) * Math.sin(b) + Math.cos(NGP_DEC) * Math.cos(b) * Math.cos(L_NCP - l);
  const dec = Math.asin(Math.max(-1, Math.min(1, sd)));
  const y = Math.cos(b) * Math.sin(L_NCP - l);
  const x = Math.cos(NGP_DEC) * Math.sin(b) - Math.sin(NGP_DEC) * Math.cos(b) * Math.cos(L_NCP - l);
  let ra = NGP_RA + Math.atan2(y, x);
  ra = ((ra * 180 / Math.PI) % 360 + 360) % 360;
  return { ra, dec: dec * 180 / Math.PI };
}

/* ---------- svg helpers ---------- */
const svg = document.getElementById("sky");
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
let W = 0, H = 0, PW = 0, PH = 0;
// Standard equatorial map: RA increases right→left (0h at right, 24h at left);
// Dec +90° at top, −90° at bottom.
const xOf = ra => MARGIN.left + ((360 - ra) / 360) * PW;
const yOf = dec => MARGIN.top + (90 - dec) / 180 * PH;

function magR(d) {
  if (d.kind === "figure") return 8.5;
  return Math.min(11, Math.max(2.3, 7.6 - 1.3 * d.mag));
}
/* Roughly one label per 9000 px² of plot area; every label fits on a big screen,
   and a phone-sized pane shows only the brightest handful. */
function labelBudget() { return Math.max(6, Math.floor(PW * PH / 9000)); }
/* Roads and Milky Way names only get labels once there is comfortable room. */
function roomForExtras() { return PW * PH > 220000; }
/* Polyline that lifts the pen wherever the path would wrap across the RA seam. */
function wrapPath(pts) {
  let d = "", prev = null;
  for (const p of pts) {
    d += (prev === null || Math.abs(p.x - prev) > PW / 2)
      ? `M${p.x.toFixed(1)},${p.y.toFixed(1)}` : `L${p.x.toFixed(1)},${p.y.toFixed(1)}`;
    prev = p.x;
  }
  return d;
}

/* ---------- render ---------- */
function render() {
  W = window.innerWidth; H = window.innerHeight;
  PW = W - MARGIN.left - MARGIN.right;
  PH = H - MARGIN.top - MARGIN.bottom;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";

  const g = el("g", {}, svg);

  /* graticule */
  for (let dec = -60; dec <= 60; dec += 30) {
    if (dec === 0) continue;
    el("line", { x1: MARGIN.left, x2: MARGIN.left + PW, y1: yOf(dec), y2: yOf(dec),
                 stroke: "var(--grid)", "stroke-width": 1 }, g);
  }
  // thin the RA ticks out when there isn't room for a label every two hours
  const raStep = PW < 760 ? 4 : 2;
  for (let h = 0; h <= 24; h += raStep) {
    const x = xOf(h * 15);
    el("line", { x1: x, x2: x, y1: MARGIN.top, y2: MARGIN.top + PH,
                 stroke: "var(--grid)", "stroke-width": 1 }, g);
    const t = el("text", { x: x, y: MARGIN.top + PH + 16, "text-anchor": "middle", class: "axis-lab" }, g);
    t.textContent = h + "h";
  }
  for (let dec = -60; dec <= 60; dec += 30) {
    const t = el("text", { x: MARGIN.left - 7, y: yOf(dec) + 3.5, "text-anchor": "end", class: "axis-lab" }, g);
    t.textContent = (dec > 0 ? "+" : "") + dec + "°";
  }
  /* frame + equator */
  el("rect", { x: MARGIN.left, y: MARGIN.top, width: PW, height: PH, fill: "none",
               stroke: "var(--grid-strong)", "stroke-width": 1 }, g);
  el("line", { x1: MARGIN.left, x2: MARGIN.left + PW, y1: yOf(0), y2: yOf(0),
               stroke: "var(--grid-strong)", "stroke-width": 1 }, g);
  const eqLab = el("text", { x: MARGIN.left + 6, y: yOf(0) - 5, class: "line-lab" }, g);
  eqLab.textContent = "CELESTIAL EQUATOR";

  /* ecliptic */
  let dEcl = "", prevX = null;
  for (let lam = 0; lam <= 360; lam += 2) {
    const L = lam * Math.PI / 180;
    let ra = Math.atan2(Math.sin(L) * Math.cos(EPS), Math.cos(L)) * 180 / Math.PI;
    if (ra < 0) ra += 360;
    const dec = Math.asin(Math.sin(EPS) * Math.sin(L)) * 180 / Math.PI;
    const x = xOf(ra), y = yOf(dec);
    dEcl += (prevX === null || Math.abs(x - prevX) > PW / 2) ? `M${x.toFixed(1)},${y.toFixed(1)}` : `L${x.toFixed(1)},${y.toFixed(1)}`;
    prevX = x;
  }
  el("path", { d: dEcl, fill: "none", stroke: "var(--c-nakshatra)", "stroke-width": 1.2,
               "stroke-dasharray": "1 5", "stroke-linecap": "round", opacity: 0.75 }, g);
  // label sits in the empty patch below the equator around 21h
  const ecLab = el("text", { x: xOf(318), y: yOf(-16), class: "line-lab", fill: "var(--c-nakshatra)", opacity: 0.85,
                             "text-anchor": "middle" }, g);
  ecLab.textContent = "क्रान्तिवृत्त · ECLIPTIC";
  ecLab.setAttribute("style", "font-family: var(--deva)");

  /* Every label placed so far, so later ones can avoid them. */
  const labelBoxes = [];

  /* ---- Milky Way: the galactic equator, drawn as a soft band ---- */
  if (state.on["milky-way"] && galactic.length) {
    const pts = [];
    for (let l = 0; l <= 360; l += 2) { const e = galToEq(l, 0); pts.push({ x: xOf(e.ra), y: yOf(e.dec) }); }
    const gw = el("g", {}, g);
    el("path", { d: wrapPath(pts), fill: "none", stroke: CAT_META["milky-way"].color,
                 "stroke-width": 30, opacity: 0.11, "stroke-linecap": "round" }, gw);
    el("path", { d: wrapPath(pts), fill: "none", stroke: CAT_META["milky-way"].color,
                 "stroke-width": 1.2, opacity: 0.5, "stroke-dasharray": "6 5" }, gw);
    for (const d of galactic) {
      const e = galToEq(d.galacticL, 0);
      const x = xOf(e.ra), y = yOf(e.dec);
      const mg = el("g", { class: "marker", tabindex: 0, role: "button",
                           "aria-label": `${d.iast} — ${d.modern.common_name}` }, gw);
      el("circle", { cx: x, cy: y, r: 4.6, fill: CAT_META["milky-way"].color, opacity: 0.95 }, mg);
      el("circle", { cx: x, cy: y, r: 15, fill: "transparent" }, mg);
      if (state.labels && roomForExtras()) {
        const t = el("text", { x: x + 9, y: y + 3.5, class: "star-lab", fill: "var(--ink-2)" }, mg);
        t.textContent = d.label;
        labelBoxes.push({ x: x + 9, y: y - 8, w: d.label.length * 7.4 + 4, h: 15 });
      }
      mg.addEventListener("mouseenter", () => showTip(d, x, y));
      mg.addEventListener("mouseleave", hideTip);
      mg.addEventListener("focus", () => showTip(d, x, y));
      mg.addEventListener("blur", hideTip);
      mg.addEventListener("click", ev => { ev.stopPropagation(); openEntries([d]); });
      mg.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openEntries([d]); } });
    }
  }

  /* ---- star-roads: a dashed line through the road's own nakshatras ---- */
  if (state.on["star-road"]) {
    const gr = el("g", {}, g);
    for (const d of roads) {
      const stops = d.road.map(byId).filter(Boolean).filter(s => s.ra !== null);
      if (stops.length < 2) continue;
      const pts = stops.map(s => ({ x: xOf(s.ra), y: yOf(s.dec) }));
      const mg = el("g", { class: "marker", tabindex: 0, role: "button",
                           "aria-label": `${d.iast} — star-road` }, gr);
      el("path", { d: wrapPath(pts), fill: "none", stroke: CAT_META["star-road"].color,
                   "stroke-width": 1.5, "stroke-dasharray": "7 4", opacity: 0.55,
                   "stroke-linecap": "round" }, mg);
      el("path", { d: wrapPath(pts), fill: "none", stroke: "transparent", "stroke-width": 14 }, mg);
      const mid = pts[Math.floor(pts.length / 2)];
      if (state.labels && roomForExtras()) {
        const t = el("text", { x: mid.x, y: mid.y - 9, class: "road-lab",
                               fill: CAT_META["star-road"].color, "text-anchor": "middle" }, mg);
        t.textContent = d.label;
        const rw = d.label.length * 6.8 + 4;
        labelBoxes.push({ x: mid.x - rw / 2, y: mid.y - 20, w: rw, h: 15 });
      }
      mg.addEventListener("mouseenter", () => showTip(d, mid.x, mid.y));
      mg.addEventListener("mouseleave", hideTip);
      mg.addEventListener("focus", () => showTip(d, mid.x, mid.y));
      mg.addEventListener("blur", hideTip);
      mg.addEventListener("click", ev => { ev.stopPropagation(); openEntries([d]); });
      mg.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openEntries([d]); } });
    }
  }

  /* markers: bright first so faint neighbours stay on top */
  const shown = plotted.filter(d => state.on[d.cat]);
  const seen = [];
  const order = shown.slice().sort((a, b) => (a.mag ?? 9) - (b.mag ?? 9));
  const gm = el("g", {}, svg);
  /* A small plot can't hold 60-odd Devanagari labels. Budget them by area and
     spend the budget on the brightest stars, which are the ones worth naming. */
  let labelsLeft = labelBudget();

  for (const d of order) {
    const x = xOf(d.ra), y = yOf(d.dec), r = magR(d);
    const meta = CAT_META[d.cat];
    const dup = seen.some(p => Math.hypot(p.x - x, p.y - y) < 4);
    seen.push({ x, y });
    const mg = el("g", { class: "marker", tabindex: 0, role: "button",
                         "aria-label": `${d.iast} — ${d.modern.common_name}` }, gm);
    mg.dataset.id = d.id;

    if (d.kind === "figure") {
      el("circle", { cx: x, cy: y, r: r + 2, fill: "none", stroke: meta.color,
                     "stroke-width": 1.4, "stroke-dasharray": "3 3", opacity: 0.95 }, mg);
      if (meta.shape === "diamond")
        el("rect", { x: x - 2.6, y: y - 2.6, width: 5.2, height: 5.2, fill: meta.color,
                     transform: `rotate(45 ${x} ${y})` }, mg);
      else
        el("circle", { cx: x, cy: y, r: 2.6, fill: meta.color }, mg);
    } else if (dup || meta.shape === "ring") {
      /* second name on the same star: open ring so both categories stay visible */
      el("circle", { cx: x, cy: y, r: r + 3.5, fill: "none", stroke: meta.color, "stroke-width": 1.6 }, mg);
    } else {
      if (r > 6.5) el("circle", { cx: x, cy: y, r: r * 1.9, fill: meta.color, opacity: 0.13 }, mg);
      if (meta.shape === "diamond") {
        const s = r * 1.6;
        el("rect", { x: x - s / 2, y: y - s / 2, width: s, height: s, fill: meta.color,
                     transform: `rotate(45 ${x} ${y})` }, mg);
      } else {
        el("circle", { cx: x, cy: y, r: r, fill: meta.color }, mg);
      }
    }
    /* hit target */
    el("circle", { cx: x, cy: y, r: Math.max(13, r + 6), fill: "transparent" }, mg);

    if (state.labels && labelsLeft > 0) {
      /* Try a ring of candidate slots and take the first that collides with
         nothing already placed; if every slot is taken, drop this label rather
         than stack it on a neighbour's. */
      const wEst = d.label.length * 7.4 + 4, hEst = 12;
      const cands = [
        { x: x + r + 6, y: y + 3.5,      a: "start" },
        { x: x - r - 6, y: y + 3.5,      a: "end"   },
        { x: x,         y: y - r - 7,    a: "middle" },
        { x: x,         y: y + r + 13,   a: "middle" },
        { x: x + r + 6, y: y - r - 7,    a: "start" },
        { x: x - r - 6, y: y + r + 13,   a: "end"   },
        { x: x + r + 6, y: y + r + 13,   a: "start" },
        { x: x - r - 6, y: y - r - 7,    a: "end"   }
      ];
      const boxOf = c => {
        const left = c.a === "start" ? c.x : c.a === "end" ? c.x - wEst : c.x - wEst / 2;
        return { x: left, y: c.y - hEst, w: wEst, h: hEst + 3 };
      };
      const fits = b =>
        b.x > MARGIN.left - 4 && b.x + b.w < MARGIN.left + PW + 4 &&
        b.y > MARGIN.top && b.y + b.h < MARGIN.top + PH + 6 &&
        !labelBoxes.some(o => b.x < o.x + o.w && o.x < b.x + b.w &&
                              b.y < o.y + o.h && o.y < b.y + b.h);
      const pick = cands.map(c => ({ c, b: boxOf(c) })).find(p => fits(p.b));
      if (pick) {
        labelsLeft--;
        labelBoxes.push(pick.b);
        const t = el("text", { x: pick.c.x, y: pick.c.y, class: "star-lab",
                               fill: "var(--ink-2)", "text-anchor": pick.c.a }, gm);
        t.textContent = d.label;
      }
    }

    mg.addEventListener("mouseenter", ev => showTip(d, x, y));
    mg.addEventListener("mouseleave", hideTip);
    mg.addEventListener("focus", () => showTip(d, x, y));
    mg.addEventListener("blur", hideTip);
    mg.addEventListener("click", ev => { ev.stopPropagation(); openGroup(d); });
    mg.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openGroup(d); } });
  }
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tooltip");
function groupOf(d) {
  if (d.ra === null) return [d];
  return plotted.filter(o => state.on[o.cat] && Math.hypot(o.ra - d.ra, o.dec - d.dec) < 1.3);
}
function showTip(d, x, y) {
  const grp = groupOf(d);
  const meta = CAT_META[d.cat];
  const bayer = d.modern.bayer && d.modern.bayer !== "—" ? " · " + d.modern.bayer : "";
  const extra = d.road
    ? `<div class="tmore">${d.road.map(r => (byId(r) || {}).dev_short).filter(Boolean).join(" – ")}</div>` : "";
  tip.innerHTML =
    `<div class="tdev">${grp.map(g => g.dev_short).join(" · ")}</div>` +
    `<div class="tiast">${grp.map(g => g.iast).join(" · ")}</div>` +
    `<div class="tmod"><span class="cat" style="background:${meta.color}"></span>` +
    `${d.modern.common_name}${bayer}</div>` + extra +
    `<div class="tmore">${grp.length > 1 ? grp.length + " names here — " : ""}click for shloka &amp; sources</div>`;
  tip.classList.add("show");
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = x + 16, ty = y - th - 10;
  if (tx + tw > W - 10) tx = x - tw - 16;
  if (ty < 8) ty = y + 16;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
}
function hideTip() { tip.classList.remove("show"); }

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer");
const dBody = document.getElementById("drawer-body");
const dTitle = document.getElementById("drawer-title");
function openDrawer(title, html) {
  dTitle.textContent = title;
  dBody.innerHTML = html;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  dBody.scrollTop = 0;
  dBody.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => { const t = DB.items.find(i => i.id === b.dataset.open); if (t) openEntries([t]); }));
}
function closeDrawer() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }

function linkRow(links, label) {
  return links.map((u, i) => `<a href="${u}" target="_blank" rel="noopener">${label}${links.length > 1 ? " " + (i + 1) : ""}</a>`)
              .join('<span class="lsep">·</span>');
}
function entryHTML(d) {
  const meta = CAT_META[d.cat];
  const refs = d.refs.map(r => `
    <div class="ref">
      <div class="cite">${r.citation}</div>
      <div class="links">${linkRow(r.shloka_links, "Sanskrit e-text")}${r.trans_links.length ? '<span class="lsep">·</span>' + linkRow(r.trans_links, "translation") : ""}</div>
      ${r.shloka
        ? `<div class="shloka${r.shloka_script === "iast" ? " roman" : ""}">${r.shloka}</div>` +
          (r.shloka_note ? `<div class="noshloka">${r.shloka_note}</div>` : "")
        : `<div class="noshloka">${r.shloka_note}</div>`}
      <div class="trans">${r.translation}</div>
      <div class="transby">— ${r.translator}</div>
      <details><summary>Identification notes (${r.text})</summary><p>${r.notes}</p></details>
    </div>`).join("");
  const seeAlso = d.see_also.length
    ? `<div class="seealso"><span class="lbl">See also</span>` +
      d.see_also.map(s => { const t = DB.items.find(i => i.id === s); return t ? `<button class="chip" data-open="${s}"><span class="dot" style="background:${CAT_META[t.cat].color}"></span>${t.dev_short}</button>` : ""; }).join("") + `</div>`
    : "";
  return `
    <div class="entry">
      <h2>${d.dev}</h2>
      <div class="iast">${d.iast}</div>
      <div class="modline"><b>${d.modern.common_name}</b>${
        [d.modern.bayer, d.modern.constellation]
          .filter(v => v && v !== "—")
          .map(v => `<span class="sep">·</span>${v}`).join("")}</div>
      <div class="badges">
        <span class="badge cat" style="background:${meta.color}">${meta.label}</span>
        <span class="badge conf-${d.conf}">${d.conf}</span>
      </div>
      ${d.plotnote ? `<div class="plotnote">${d.plotnote}</div>` : ""}
      ${refs}
      ${seeAlso}
    </div>`;
}
function openEntries(list) {
  openDrawer(list.length > 1 ? list.length + " names at this point" : "Star detail",
             list.map(entryHTML).join(""));
}
function openGroup(d) { openEntries(groupOf(d)); }

/* ---------- index & about ---------- */
function openIndex() {
  const cats = ["nakshatra", "nakshatra-alias", "individual-star", "saptarshi", "vedic-asterism", "sky-figure",
                "star-road", "milky-way", "shishumara-position", "sky-region",
                "star-word", "collective"];
  let html = "";
  for (const c of cats) {
    const items = DB.items.filter(i => i.cat === c);
    if (!items.length) continue;
    html += `<div class="ix-cat"><h3><span class="dot" style="background:${CAT_META[c].color}"></span>${CAT_META[c].label} <span class="n">(${items.length})</span></h3>` +
      items.map(i => `<button class="ix-row" data-open="${i.id}"><span class="dev">${i.dev_short}</span><span>${i.iast}</span><span class="im">${i.modern.common_name}</span></button>`).join("") +
      `</div>`;
  }
  openDrawer("Index — all " + DB.items.length + " names", html);
}
function openAbout() {
  openDrawer("About & caveats", `<div class="about">${DB.about}</div>`);
}

/* ---------- HUD wiring ---------- */
const legend = document.getElementById("legend");
const LEGEND_CATS = ["nakshatra", "nakshatra-alias", "individual-star", "saptarshi",
                     "vedic-asterism", "sky-figure", "star-road", "milky-way"];
for (const c of LEGEND_CATS) {
  const n = DB.items.filter(d => d.cat === c &&
    (d.ra !== null || d.road || (d.galacticL !== undefined && d.galacticL !== null))).length;
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true");
  const sh = CAT_META[c].shape;
  const swatch = sh === "ring"
    ? `<span class="dot ring" style="border-color:${CAT_META[c].color}"></span>`
    : `<span class="dot ${sh === "diamond" ? "diamond" : ""}" style="background:${CAT_META[c].color}"></span>`;
  b.innerHTML = `${swatch}${CAT_META[c].label} <span class="n">${n}</span>`;
  b.addEventListener("click", () => {
    state.on[c] = !state.on[c];
    b.classList.toggle("off", !state.on[c]);
    b.setAttribute("aria-pressed", String(state.on[c]));
    render();
  });
  legend.appendChild(b);
}
document.getElementById("subline").innerHTML =
  `${DB.items.length} names from the Ṛgveda and Atharvaveda, the Brāhmaṇas, the Vedāṅga Jyotiṣa, the Purāṇas, ` +
  `the Bṛhat Saṃhitā, the Sūrya Siddhānta and the Siddhānta Śiromaṇi — ` +
  `${plotted.length + roads.length + galactic.length} plotted, ${unplotted.length} named sky-positions with no ` +
  `identified star in the <button class="chip" style="display:inline" id="link-unplotted">Index</button>. ` +
  `Hover for a name; click for the shloka and sources.`;
document.getElementById("link-unplotted").addEventListener("click", openIndex);
document.getElementById("btn-index").addEventListener("click", openIndex);
document.getElementById("btn-about").addEventListener("click", openAbout);
const btnLabels = document.getElementById("btn-labels");
btnLabels.addEventListener("click", () => {
  state.labels = !state.labels;
  btnLabels.classList.toggle("active", state.labels);
  btnLabels.setAttribute("aria-pressed", String(state.labels));
  render();
});
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
svg.addEventListener("click", closeDrawer);
window.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

let rT = null;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 120); });
render();
</script>
