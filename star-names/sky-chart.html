: "α Canis Majoris", "constellation": "Canis Major"}, "conf": "disputed", "see_also": ["mrigavyadha"], "label": "लुब्धक", "kind": "star", "ra": 101.29, "dec": -16.72, "mag": -1.46, "road": null, "galacticL": null, "plotnote": "Same star as Mṛgavyādha (Sirius): the classical &#x27;hunter&#x27; synonym.", "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Not in Bṛhat Saṃhitā; Kathāsaritsāgara 6.2.88 (lubdhaka); Sūrya-siddhānta 8.10 (as Mṛgavyādha)", "shloka": "दत्त्वायुषोऽर्धं मुनिना न भार्या रुरुणा कृता ।\nत्रिशङ्कुः किं न नीतो द्यां विश्वामित्रेण लुब्धकः ।। ८८", "shloka_script": "devanagari", "shloka_note": "The word is absent from the Bṛhat Saṃhitā itself; the verse quoted is the Kathāsaritsāgara&#x27;s, which the citation names.", "shloka_links": ["https://sa.wikisource.org/wiki/कथासरित्सागरः/लम्बकः_६/तरङ्गः_२"], "translation": "Was not the Chandala Trisanku carried to heaven by Visvamitra?", "translator": "C. H. Tawney (1880), Katha Sarit Sagara vol. 1, ch. XXVIII, p. 251; Sūrya-siddhānta rendering: E. Burgess (1860)", "trans_links": ["https://archive.org/details/kathsaritsga01somauoft"], "notes": "Lubdhaka (&#x27;the Hunter&#x27;) = Sirius is standard in Sanskrit lexica (Monier-Williams, s.v. lubdhaka: &#x27;the star Sirius&#x27;, citing the Gaṇitādhyāya and Kathāsaritsāgara) — but the word does NOT occur in the Bṛhat Saṃhitā: a search of the complete GRETIL e-text (Yano–Sugita, Tripathi ed.) finds no lubdhaka and no mṛgavyādha as a star. Classical attestations verified online: (1) Sūrya-siddhānta 8.10 locates the star under its synonym Mṛgavyādha (&#x27;deer-hunter&#x27;): अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः (https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः); Burgess: &#x27;Mrgavyadha, deer-hunter — it is also called Lubdhaka, hunter — is α Canis Majoris, or Sirius, the brightest of the fixed stars&#x27; (pp. 245–246). (2) Kathāsaritsāgara 6.2.88 (= taraṅga 28.88) is MW&#x27;s literary citation for lubdhaka = Sirius (Triśaṅku raised to the sky), but Tawney (1880, vol. 1 p. 251) translates &#x27;Was not the Chandala Trisanku carried to heaven by Visvamitra?&#x27;, taking lubdhaka as &#x27;outcaste hunter&#x27; — so the star sense in KSS is a lexicographers&#x27; reading, not undisputed. No Kālidāsa attestation of Lubdhaka as Sirius was found online."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra vv.7-8 (also vv.12, 16)", "shloka": "अगस्त्यस्य नाडीद्वयं प्रोक्तमिष्टं सषड्भागनाडीद्वयं लुब्धकस्य । त्रिभागाधिकं स्थूलभानामणूना ततश्वाधिकं तारतम्येन कल्प्यम् ॥८॥ [verbatim from unproofread OCR]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[paraphrase] The iṣṭa-nāḍīs (arc of visibility for heliacal rising) are two nāḍīs for Agastya, two nāḍīs and a sixth for Lubdhaka, a third more for the large stars, and progressively more for the fainter ones.", "translator": "Paraphrased from D. Arkasomayaji (copyrighted); Bhāskara&#x27;s own Vāsanābhāṣya glosses: Agastya 12 kālāṃśas, Lubdhaka 13, gross stars 14, faint ones 15-16.", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Bhāskara&#x27;s mūla uses &#x27;Lubdhaka&#x27; (the Hunter) in vv.7-8 and &#x27;mṛgaripu&#x27; (enemy of the deer) in v.12 (&#x27;भाना मुनेर्मृगरिपोरुदयास्तलग्ने&#x27;); the name Mṛgavyādha for the same star appears on the same page only in Nṛsiṃha Daivajña&#x27;s Vārttika quoting Sūrya Siddhānta 9.12 (&#x27;स्वात्यगस्त्यमृगव्याधचित्राज्येष्ठाः पुनर्वसुः&#x27;, sa.wikisource page 347). Values: polar longitude 86° (ṣaḍ-aṣṭau), polar latitude 40° south (nabho&#x27;mbhodhi). Iṣṭanāḍīs 2 1/6 nāḍī = 13 kālāṃśas per the Vāsanābhāṣya (&#x27;तत्र त्रयोदशा १३ कालांशाः&#x27;). 1861 PD volume: &#x27;Mrigavyādha (Sirius)&#x27; (p.63)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 2.10.1437 (Śūdra-varga)", "shloka": "व्याधो मृगवधाजीवो मृगयुर्लुब्धकोऽपि सः ।। २.१०.१४३७ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/द्वितीयकाण्डम्"], "translation": "Literal rendering: &#x27;A hunter (vyādha) — one who lives by killing deer, mṛgayu, and lubdhaka likewise.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://sa.wikisource.org/wiki/अमरकोशः/द्वितीयकाण्डम्"], "notes": "IMPORTANT NEGATIVE RESULT: the Amarakośa does NOT list Lubdhaka or Mṛgavyādha among stars. Its only entry for lubdhaka is in the Śūdra-varga, where it is one of four synonyms for &#x27;hunter&#x27; (vyādha, mṛgavadhājīva, mṛgayu, lubdhaka). The classical thesaurus therefore supplies the lexical basis of the Sirius-name — hunter of the Deer — but does not itself attest the astronomical use, which comes instead from the siddhāntas."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 40 with Pṛthūdakasvāmin's commentary", "shloka": "भानां ग्रहस्य लुब्धकस्य मुनेरगस्त्यस्य चोदयास्तादिसाधनम् ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;the determination of the risings, settings and so forth of the asterisms, of a planet, of Lubdhaka, and of the sage Agastya.&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "Lubdhaka and Mṛgavyādha are strictly synonymous in Brahmagupta&#x27;s tradition: the heading of the verse in this edition reads &#x27;idānīṃ lubdhakasya dhruvaśarāṃśān āha&#x27; — &#x27;now he states the polar longitude and latitude degrees OF LUBDHAKA&#x27; — introducing the verse whose subject-word is mṛgavyādhaḥ. Pṛthūdaka&#x27;s gloss on the chapter-scope verse likewise lists &#x27;the risings and settings of the asterisms, of a planet, of Lubdhaka, and of the sage Agastya&#x27;. Śrīpati&#x27;s Siddhāntaśekhara also uses Lubdhaka. This is the astronomical attestation the Amarakośa conspicuously lacks."}]}, {"id": "agni", "cat": "individual-star", "dev": "अग्नि (हुतभुज्)", "dev_short": "अग्नि", "iast": "Agni (Hutabhuj)", "modern": {"common_name": "Elnath", "bayer": "β Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": [], "label": "अग्नि", "kind": "star", "ra": 81.57, "dec": 28.61, "mag": 1.65, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.11–12", "shloka": "विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ // अष्टाभिस् त्रिम्शता चैव विक्षिप्ताव् उत्तरेण तौ / गोलम् लब्ध्वा परीक्षेत विक्षेपम् ध्रुवकम् स्फुटम् //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "11. ... Agni (hutabhuj) and Brahmahrdaya are in Taurus, the twenty-second degree; 12. And they are removed in latitude (vikshipta), northward, eight and thirty degrees respectively. . . .", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star named after the god of fire, Agni, and called in the text by one of his frequent epithets, hutabhuj, &quot;devourer of the sacrifice,&quot; is the one which is situated at the extremity of the northern horn of the Bull, or β Tauri&#x27;; he notes &#x27;the very gross error in the determination of the longitude of this star&#x27;."}]}, {"id": "brahmahridaya", "cat": "individual-star", "dev": "ब्रह्महृदय", "dev_short": "ब्रह्महृदय", "iast": "Brahmahṛdaya", "modern": {"common_name": "Capella", "bayer": "α Aurigae", "constellation": "Auriga"}, "conf": "certain", "see_also": [], "label": "ब्रह्महृदय", "kind": "star", "ra": 79.17, "dec": 46.0, "mag": 0.08, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.11–12", "shloka": "विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ // अष्टाभिस् त्रिम्शता चैव विक्षिप्ताव् उत्तरेण तौ / गोलम् लब्ध्वा परीक्षेत विक्षेपम् ध्रुवकम् स्फुटम् //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "11. ... Agni (hutabhuj) and Brahmahrdaya are in Taurus, the twenty-second degree; 12. And they are removed in latitude (vikshipta), northward, eight and thirty degrees respectively. . . .", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Brahmahrdaya, &quot;Brahma&#x27;s heart,&quot; is α Aurigae or Capella&#x27;."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.12 and 9.18; al-Bīrūnī, India ch. LVI", "shloka": "अभिजिद् ब्रह्महृदयम् स्वातीवैष्णववासवाः / अहिर्बुध्न्यम् उदक्स्थत्वान् न लुप्यन्ते ऽर्करश्मिभिः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "18. Abhijit, Brahmahrdaya, Svati, Çravana (vāishnava), Çravishtha (vāsava), and Uttara-Bhādrapadā (ahirbudhnya), owing to their northern situation, are not extinguished by the sun&#x27;s rays. — Al-Bīrūnī (Sachau): &#x27;They are, according to the author of the Ghurrat-alzījāt, the following:—13° for Suhail, Alyamāniya, Alwāki&#x27;, Alayyūk, Alsimākān, Kalb-al-akrab...&#x27; and, from Vijayanandin: &#x27;Some stars are not covered by the rays nor impaired in their shining by the sun, viz. Alayyūk, Alsimāk, Alrāmiḥ, the two Eagles, Dhanishtha, and Uttarabhādrapadā, because they have so much northern latitude.&#x27;", "translator": "E. Burgess (1860); E. Sachau (1910) for al-Bīrūnī", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Named twice in SS ch. 9: at 9.12 among the 13°-visibility stars, and at 9.18 among the six never extinguished by the sun&#x27;s rays &#x27;owing to their northern situation&#x27;. Burgess adds that Prajāpati (δ Aurigae) is not counted here &#x27;since it is 8° north of Brahmahrdaya, and consequently can not become invisible where the latter does not&#x27;. DECISIVE INDEPENDENT CONFIRMATION: al-Bīrūnī reproduces both lists in Arabic star names, and al-Ayyūq is unambiguously Capella in Arabic astronomy — so the identification is settled without relying on the Hindu coordinate data at all. The same passage settles Svātī = Arcturus (al-Simāk al-Rāmiḥ) the same way."}]}, {"id": "prajapati", "cat": "individual-star", "dev": "प्रजापति", "dev_short": "प्रजापति", "iast": "Prajāpati", "modern": {"common_name": "Prijipati", "bayer": "δ Aurigae", "constellation": "Auriga"}, "conf": "likely", "see_also": ["prajapati-circumpolar"], "label": "प्रजापति", "kind": "star", "ra": 89.88, "dec": 54.28, "mag": 3.72, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.20", "shloka": "पूर्वस्याम् ब्रह्महृदयाद् अम्शकैः पञ्चभिः स्थितः / प्रजापतिर् वृषान्ते +असौ सौम्ये +अष्टत्रिम्शदम्शकैः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "20. Situated five degrees eastward from Brahmahrdaya is Prajapati: it is at the end of Taurus, and thirty-eight degrees north.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star referred to can hardly be any other than that in the head of the Wagoner, or δ Aurigae (4)&#x27;, wondering &#x27;why so faint and inconspicuous a star&#x27; was singled out. He also doubts the authenticity of vv. 20-21 and notes the two definitions of its longitude (v. 11 + v. 20 vs &#x27;end of Taurus&#x27;) do not quite agree."}]}, {"id": "apamvatsa", "cat": "individual-star", "dev": "अपांवत्स", "dev_short": "अपांवत्स", "iast": "Apāṃvatsa", "modern": {"common_name": "θ Virginis", "bayer": "θ Virginis", "constellation": "Virgo"}, "conf": "likely", "see_also": [], "label": "अपांवत्स", "kind": "star", "ra": 197.49, "dec": -5.54, "mag": 4.38, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.21", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Colebrooke gave &#x27;the nebulous stars marked b 1, 2, 3 in Virgo&#x27;, which Burgess could find in no map or catalogue; Burgess: &#x27;There is, on the other hand, a star, θ Virginis (4), situated directly between Spica and δ, and at such a distance from each as shows almost beyond question that it is the star intended&#x27; (so also his index: &#x27;Apamvatsa, name of star (θ Virginis)&#x27;)."}]}, {"id": "apas", "cat": "individual-star", "dev": "आपस् (आपः)", "dev_short": "आपः", "iast": "Āpas", "modern": {"common_name": "Minelauva (Auva)", "bayer": "δ Virginis", "constellation": "Virgo"}, "conf": "certain", "see_also": [], "label": "आपः", "kind": "star", "ra": 193.9, "dec": 3.4, "mag": 3.39, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.21", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Apas, &quot;Waters&quot;... is put 6° north of Apamvatsa, or in lat. 9° N. It is identified by Colebrooke with δ Virginis (3), and doubtless correctly&#x27;. Noticed in the Sūrya-Siddhānta alone among his authorities."}]}, {"id": "dhruva", "cat": "individual-star", "dev": "ध्रुवः", "dev_short": "ध्रुवः", "iast": "Dhruva", "modern": {"common_name": "Polaris (the pole star)", "bayer": "α Ursae Minoris", "constellation": "Ursa Minor"}, "conf": "disputed", "see_also": ["saptarshi", "arundhati", "shishumara", "medhi", "suniti", "vishnupada"], "label": "ध्रुवः", "kind": "star", "ra": 37.95, "dec": 89.26, "mag": 1.98, "road": null, "galacticL": null, "plotnote": "The pole star sits at the very top of any RA/Dec chart (Dec +89°); RA is nearly meaningless there.", "refs": [{"text": "Vedic corpus", "citation": "Āśvalāyana Gṛhya Sūtra 1.7.22", "shloka": "ध्रुवमरुन्धतीं सप्तऋषीनिति दृष्ट्वा वाचं विसृजेत जीवपत्नीं प्रजां विन्देयेति २२", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/आश्वलायनगृह्यसूत्रम्/अध्यायः_१"], "translation": "When she sees the polar-star, the star Arundhati, and the seven Rishis (ursa major), let her break the silence (and say), &#x27;May my husband live and I get offspring.&#x27;", "translator": "Hermann Oldenberg, SBE vol. 29 (1886)", "trans_links": ["https://sacred-texts.com/hin/sbe29/sbe29.txt", "https://web.archive.org/web/20080113225826/http://sacred-texts.com/hin/sbe29/sbe29.txt"], "notes": "&#x27;The fixed one&#x27;, shown to the bride on the wedding night (dhruva-darśana) as an emblem of constancy. In the historical period Dhruva = Polaris, but scholars note that at plausible dates of the ritual&#x27;s origin (2nd-1st millennium BCE) no bright star stood at the pole: α Draconis (Thuban) was pole star c. 2800 BCE, and Polaris only closed on the pole in the last ~1500 years. Dhruva may therefore be an idealized &#x27;fixed point&#x27; of the sky, an earlier pole star remembered, or a faint near-polar star. Parallel rite with the mantra dhruvám asi: Śāṅkhāyana GS 1.17.2-4, tr. Oldenberg: &#x27;Let them sit silent, when the sun has set, until the polar-star appears. He shows her the polar-star with the words, Firm be thou, thriving with me! Let her say, I see the polar-star; may I obtain offspring&#x27; (same source URL)."}, {"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 1.12.90-92; Bhāgavata Purāṇa 5.23.1 and 5.23.5; Viṣṇu Purāṇa 2.7.10, 2.9.1", "shloka": "त्रैलोक्यादधिके स्थाने सर्वताराग्रहाश्रयः । भविष्यति न संदेहो मत्प्रसादाद्भावन्ध्रुव ॥ १,१२.९० ॥ सूर्यात्सोमात्तथा भौमात्सोमपुत्राद्बृहस्पतेः । सितार्कतनयादीनां सर्वर्क्षाणां तथा ध्रुवः ॥ १,१२.९१ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/प्रथमांशः/अध्यायः_१२"], "translation": "A station shall be assigned to thee, Dhruva, above the three worlds; one in which thou shalt sustain the stars and the planets; a station above those of the sun, the moon, Mars, the son of Soma (Mercury), Venus, the son of Súrya (Saturn), and all the other constellations; above the regions of the seven Rishis, and the divinities who traverse the atmosphere.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp047.htm"], "notes": "New Purāṇic attestations, each adding something: (a) BP 5.23.1 places Dhruva 1.3 million yojanas above Saturn&#x27;s region, circled by five star-deities — the fullest positional statement; (b) BP 5.23.5 fixes him at the tail-TIP (pucchāgra) of the Śiśumāra, more precise than Viṣṇu P. 2.9&#x27;s &#x27;in the tail&#x27;; (c) VP 1.12.90-92 grants him a station above Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, all asterisms and the Saptarṣis. On identification, note honestly that Polaris was NOT at the pole when these texts were composed — precession puts Thuban near the pole c. 3000-2500 BCE and Polaris only in the last few centuries; R.N. Iyengar and R.S. Hariharan argue the figure preserves a memory of Thuban, which remains a reconstruction."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.215 (Dig-varga); second sense at 3.3.792 (Nānārtha-varga)", "shloka": "ध्रुव औत्तानपादिः स्यातगस्त्यः कुम्भसम्भवः ॥ १.३.२१५ ॥ — cf. ध्रुवो भभेदे क्लीबे तु निश्चिते शाश्वते त्रिषु ॥ ३.३.७९२ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The pole.&#x27; Footnote: &#x27;Or the north pole itself. In mythology, Dhruva is son of Uttānapāda, and consequently grandson of the first Manu. In Astronomy, Uttānapāda is Ursa minor.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Amarakośa gives Dhruva one synonym, the patronymic Auttānapādi. Colebrooke&#x27;s gloss is &#x27;The pole&#x27;, and his footnote is explicit that it may mean &#x27;the north pole itself&#x27;, distinguishing the mythological Dhruva son of Uttānapāda from the astronomical usage in which &#x27;Uttānapāda is Ursa minor&#x27; — which is direct support for the caveat already on file that Dhruva may name the pole rather than a star. Separately, the Nānārtha-varga (3.3.792) records a second technical sense: dhruva also denotes a class of asterism (bha-bheda), the dhruva/sthira group used in muhūrta."}]}, {"id": "kumbhasambhava", "cat": "individual-star", "dev": "कुम्भसम्भवः", "dev_short": "कुम्भसम्भवः", "iast": "Kumbhasambhava", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": ["agastya", "maitravaruni"], "label": "कुम्भसम्भवः", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.215 (Dig-varga)", "shloka": "ध्रुव औत्तानपादिः स्यातगस्त्यः कुम्भसम्भवः ॥ १.३.२१५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "Colebrooke glosses the group as &#x27;regent of the star Canopus&#x27;.", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "&#x27;Jar-born&#x27; — synonym of Agastya in the same lexical entry, from the legend of the sage&#x27;s birth in a water-jar. A name of the sage transferred to the star by the lexicon&#x27;s own equation of the two. Note that Sūrya Siddhānta 9.16 independently uses kumbhabhava (&#x27;pot-born&#x27;) for the same star."}]}, {"id": "maitravaruni", "cat": "individual-star", "dev": "मैत्रावरुणिः", "dev_short": "मैत्रावरुणिः", "iast": "Maitrāvaruṇi", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": ["agastya", "kumbhasambhava"], "label": "मैत्रावरुणिः", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.216 (Dig-varga)", "shloka": "मैत्रावरुणिरस्यैव लोपामुद्रा सधर्मिणी ॥ १.३.२१६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;His consort&#x27; [Lopāmudrā] follows; Colebrooke glosses the preceding names as &#x27;regent of the star Canopus&#x27;.", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "&#x27;Son of Mitra and Varuṇa&#x27; — third synonym of Agastya/Canopus in the lexicon&#x27;s entry, an old Vedic patronymic of the sage. NOTE: Lopāmudrā, named in the same verse, is EXCLUDED from this database as a star name — Colebrooke glosses her only as &#x27;His consort&#x27;, and the lexicon does not treat her as a star."}]}, {"id": "muni", "cat": "individual-star", "dev": "मुनि", "dev_short": "मुनि", "iast": "Muni", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": ["agastya", "lopamudravallabha"], "label": "मुनि", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 13–14 (also 41)", "shloka": "कृत्वापि दृष्टिकर्म श्रीषेणार्यभटविष्णुचन्द्रोक्तम् । प्रतिदिनमुदयेऽस्ते वा न भवति दृग्गणितयोरैक्यम् ॥१३॥ भमुनिमृगव्याधानां यतस्ततो दृष्टिकर्म वक्ष्यामि । दृग्गणितसमं देयं शिष्याय चिरोषितायेदम् ॥१४॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;Even after performing the visibility-correction stated by Śrīṣeṇa, Āryabhaṭa and Viṣṇucandra, there is daily no agreement between observation and computation, at rising or at setting. Therefore I shall state a visibility-correction for the asterisms, the Sage and the Deer-hunter; this, being in accord with observation, is to be given to a long-tested pupil.&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "&#x27;The Sage&#x27; used absolutely as a name for Canopus. At Bhagrahayutyadhikāra 13–14 Brahmagupta writes of the dṛkkarma &#x27;of the asterisms, the Sage, and the Deer-hunter&#x27; (bha-muni-mṛgavyādhānām), and the commentary glosses the compound word for word as nakṣatra-agastya-lubdhakānām. Bhāskara II inherits the usage — &#x27;bhānāṃ muner mṛgaripor udayāstalagne&#x27;. The verses are also notable for naming the predecessors whose dṛkkarma Brahmagupta rejects: Śrīṣeṇa, Āryabhaṭa and Viṣṇucandra."}]}, {"id": "mrigahartri", "cat": "individual-star", "dev": "मृगहर्तृ", "dev_short": "मृगहर्तृ", "iast": "Mṛgahartṛ", "modern": {"common_name": "Sirius", "bayer": "α Canis Majoris", "constellation": "Canis Major"}, "conf": "certain", "see_also": ["mrigavyadha", "lubdhaka"], "label": "मृगहर्तृ", "kind": "star", "ra": 101.29, "dec": -16.72, "mag": -1.46, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 37", "shloka": "षड्भयुतमूनमुदयैः षड्राशियुतं तदस्तमयसूर्यः । घटिकाद्वितयेनैवं षड्भागयुतेन मृगहर्तुः ॥ ३७ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;...that, increased by six signs and diminished by the oblique ascensions, is the sun of his setting; and in the same way, by two ghaṭikās increased by a sixth, for the Deer-snatcher (Sirius).&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "&#x27;The deer-snatcher&#x27; — a fourth Sanskrit name for Sirius, alongside Mṛgavyādha (&#x27;deer-hunter&#x27;), Lubdhaka (&#x27;hunter&#x27;) and Bhāskara&#x27;s Mṛgaripu (&#x27;the deer&#x27;s enemy&#x27;). It occurs in the closing pāda of Bhagrahayutyadhikāra 37, and the edition&#x27;s commentary glosses it in parentheses as (vyādhasya) and quotes the phrase back as Brahmagupta&#x27;s own wording: &#x27;ghaṭikādvitayenaiva ṣaḍbhāgayutena mṛgahartuḥ&#x27; — &#x27;for the Deer-snatcher, by the same two ghaṭikās increased by a sixth&#x27; (= 13 kālāṃśas, versus 12 for Agastya)."}]}, {"id": "lopamudravallabha", "cat": "individual-star", "dev": "लोपामुद्रावल्लभ", "dev_short": "लोपामुद्रावल्लभ", "iast": "Lopāmudrāvallabha", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": ["agastya", "muni"], "label": "लोपामुद्रावल्लभ", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Siddhāntaśekhara of Śrīpati, as quoted in the commentary on Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 35–37", "shloka": "नक्षत्रांशः संयुतं राशियुगमं ८७ लोपामुद्रावल्लभस्य ध्रुवः स्यात् । ... विक्षिप्तोऽयं दक्षिणे स्वापमाग्रात् ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;Two signs plus the degrees of a nakshatra (= 87°) would be the dhruva of Lopāmudrā&#x27;s beloved; ... he is displaced to the south of his own declination-limit by seventy-seven degrees.&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "&#x27;The beloved of Lopāmudrā&#x27; — Śrīpati&#x27;s kenning for Agastya/Canopus, Lopāmudrā being the sage&#x27;s wife. Śrīpati gives the star dhruva 87° and śara 77° S, identical to Brahmagupta&#x27;s figures; the commentary concludes &#x27;Śrīpati&#x27;s statement conforms exactly to Brahmagupta&#x27;s&#x27;. Recovered at second hand — these Siddhāntaśekhara verses are quoted inside the modern commentary on the Brāhmasphuṭasiddhānta and their OCR is poor, so the NAME is unambiguous but the verse wording needs checking against a published Siddhāntaśekhara edition."}]}, {"id": "auttanapadi", "cat": "individual-star", "dev": "औत्तानपादिः", "dev_short": "औत्तानपादिः", "iast": "Auttānapādi", "modern": {"common_name": "Pole Star", "bayer": "α Ursae Minoris / the celestial pole", "constellation": "Ursa Minor"}, "conf": "certain", "see_also": ["dhruva", "uttanapada"], "label": "औत्तानपादिः", "kind": "star", "ra": 37.95, "dec": 89.26, "mag": 1.98, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.215 (Dig-varga)", "shloka": "ध्रुव औत्तानपादिः स्यातगस्त्यः कुम्भसम्भवः ॥ १.३.२१५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The pole.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Distinct from the Purāṇic Uttānapāda already on file (a position on the Śiśumāra&#x27;s upper jaw): this is the patronymic &#x27;son of Uttānapāda&#x27; used by the lexicon as a full synonym of the pole star itself."}]}, {"id": "shula", "cat": "individual-star", "dev": "शूल (?)", "dev_short": "शूल", "iast": "Śūla", "modern": {"common_name": "unidentified red star reported south of Canopus", "bayer": "—", "constellation": "far southern sky"}, "conf": "disputed", "see_also": [], "label": "शूल", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A red star south of Canopus, reported to al-Bīrūnī from Multan and identified with nothing since. Left off the chart because no position can honestly be assigned: nothing prominent, red and south of Canopus is visible from Multan&#x27;s latitude.", "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Al-Bīrūnī, India ch. XXII (Sachau 1910, vol. 1, p. 240; note at vol. 2, p. 309)", "shloka": "", "shloka_script": "devanagari", "shloka_note": "No Sanskrit text: al-Bīrūnī wrote in Arabic, and the passage survives here only in Sachau&#x27;s English.", "shloka_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "translation": "So Śrīpāla says that the people of Multan see in summer time a red star a little below the meridian of Canopus, which they call Sūla, i.e. the beam of crucifixion, and that the Hindus consider it as unlucky. Therefore, when the moon stands in the station Pūrvabhādrapada, the Hindus do not travel towards the south, because this star stands in the south.", "translator": "E. Sachau (1910)", "trans_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "notes": "A star otherwise unrecorded in the Sanskrit tradition, preserved only because al-Bīrūnī heard of it from Śrīpāla, a scholar of Multan contemporary with him. Data: red; seen in summer; a little BELOW the meridian of Canopus; considered unlucky; standing in the south when the moon is in Pūrvabhādrapadā, on which account Hindus avoided southward travel then. Sachau translates the name as &#x27;the beam of crucifixion&#x27;, pointing to Sanskrit śūla (&#x27;stake, impaling-post&#x27;) — but the Devanagari above is a reconstruction from Sachau&#x27;s transliteration of an Arabic-script word and is NOT attested in any Sanskrit source; Sachau himself declines to identify the star. The identification is genuinely open: nothing prominent, red and south of Canopus is visible from Multan (30°12&#x27;N), so either the report is garbled, or &#x27;below the meridian of Canopus&#x27; means something other than &#x27;further south&#x27;, or the object was transient."}]}, {"id": "saptarshi", "cat": "saptarshi", "dev": "सप्तर्षयः / ऋक्षाः", "dev_short": "सप्तर्षयः", "iast": "Saptarṣayaḥ / Ṛkṣāḥ", "modern": {"common_name": "the Big Dipper - seven bright stars of Ursa Major (Dubhe, Merak, Phecda, Megrez, Alioth, Mizar, Alkaid)", "bayer": "α, β, γ, δ, ε, ζ, η Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["marichi", "vasishtha", "angiras", "atri", "pulastya", "pulaha", "kratu", "arundhati", "rksha"], "label": "सप्तर्षयः", "kind": "figure", "ra": 185.0, "dec": 56.0, "mag": 2.0, "road": null, "galacticL": null, "plotnote": "The whole Big Dipper; plotted at the group&#x27;s centre, with its seven rishi-stars around it.", "refs": [{"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.4", "shloka": "अथ यस्मान्न कृत्तिकास्वादधीत । ऋक्षाणां ह वा एता अग्रे पत्न्य आसुः सप्तर्षीनु ह स्म वै पुरर्क्षा इत्याचक्षते ता मिथुनेन व्यार्ध्यन्तामी ह्युत्तरा हि सप्तर्षय उद्यन्ति पुर एता अशमिव वै तद्यो मिथुनेन व्यृद्धः स नेन्मिथुनेन व्यृध्या इति तस्मान्न कृत्तिकास्वादधीत - २.१.२.४", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "On the other hand (it is argued) why he should not set up the fires under the Krittikas. Originally, namely, the latter were the wives of the Bears (riksha); for the seven Rishis were in former times called the Rikshas (bears). They were, however, precluded from intercourse (with their husbands), for the latter, the seven Rishis, rise in the north, and they (the Krittikas) in the east. Now it is a misfortune for one to be precluded from intercourse (with his wife): he should therefore not set up his fires under the Krittikas, lest he should thereby be precluded from intercourse.", "translator": "Julius Eggeling, SBE vol. 12 (1882), pp. 282-283", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The ŚB states that the Seven Rishis &#x27;were in former times called the Rkshas (bears)&#x27; - preserving the older name ṛkṣāḥ &#x27;bears&#x27; (cf. RV 1.24.10) that matches the Greco-Roman Bear, and notes they rise in the north while the Krittikas rise in the east - exactly true of the circumpolar Dipper vs. the equatorial Pleiades. Also shown to the bride in ĀGS 1.7.22."}, {"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 4.24.105-106 (vulgate; = 4.24.25-26 in Pathak's critical ed.); Bhāgavata Purāṇa 12.2.27-28; Matsya Purāṇa 273.39-43; Vāyu Purāṇa uttarārdha 37.413-417; Brahmāṇḍa Purāṇa 2,74.230-235", "shloka": "सप्तर्षीणां तु यौ पूर्वौ दृश्येते ह्युदितौ दिवि ।\nतयोस्तु मध्ये नक्षत्रं दृश्यते यत्समं निशि १०५ ।\nतेन सप्तर्षयो युक्तास्तिष्ठंत्यब्दशतं नृणाम् ।\nते तु पारीक्षिते काले मघास्वासन्द्विजोत्तम १०६ ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/चतुर्थांशः/अध्यायः_२४"], "translation": "When the two first stars of the seven Rishis (the great Bear) rise in the heavens, and some lunar asterism is seen at night at an equal distance between them, then the seven Rishis continue stationary in that conjunction for a hundred years of men. At the birth of Paríkshit they were in Maghá...", "translator": "H.H. Wilson (1840; public domain), Viṣṇu Purāṇa Book IV ch. XXIV, pp. 484-486", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp117.htm"], "notes": "New attestation carrying a distinct astronomical doctrine: the SAPTARṢI CYCLE, in which the seven sages occupy each nakṣatra for 100 human years, completing 27 × 100 = 2700 years. The method is observational and stated: take the two leading ṛṣis visible in the north, and the asterism seen midway between them on the meridian is the one they &#x27;occupy&#x27;. Attested in four recensions. Śrīdhara Svāmī&#x27;s commentary maps the sages onto Ursa Major and notes that the two that rise first are Pulaha and Kratu — i.e. the Pointers, Merak and Dubhe. Whether the cycle tracks any real motion is disputed; the 1916 Matsya editor calls it &#x27;a contrivance of historians&#x27;, and the sages&#x27; proper motion is far too small to produce it."}, {"text": "Purāṇas", "citation": "Matsya Purāṇa 273.39-43 (Wikisource numbering; = 40-44 in Taluqdar/Pargiter)", "shloka": "सप्तर्षयस्तु वर्त्तन्ते यत्र नक्षत्रमण्डले।\nसप्तर्षयस्तु तिष्ठन्ति पर्य्यायेण शतं शतम्।।  २७३.३९\nसप्तर्षीणाञ्च यौ पूर्वौ दृश्येते ह्युदितौ निशि ।।  २७३.४१\nतयोर्मध्ये तु नक्षत्रं दृश्यते यत्समं दिवि।\nतेन सप्तर्षयो ज्ञेया युक्ता व्योम्नि शतं समाः ।।  २७३.४२\nनक्षत्राणामृषीणाञ्च योगस्यैतन्निदर्शनम्।\nसप्तर्षयो मघायुक्ताः काले पारिक्षिते शतम् ।।  २७३.४३", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_२७३"], "translation": "&quot;In the circle of the lunar constellations, wherein the Great Bear revolves, and which contains 27 constellations in its circumstance, the Great Bear remains 100 years in (conjoined with) each in turn.&quot; ... The two front stars of the Great Bear, which are seen when risen at night, the lunar constellation which is seen situated equally between them in the sky, the Great Bear is to be known as conjoined with that constellation 100 years in the sky. ... This is the exposition of the conjunction of the lunar constellations and the Great Bear. The Great Bear was conjoined with the Maghâs in Parikṣit&#x27;s time 100 years.", "translator": "&#x27;A Taluqdar of Oudh&#x27;, The Matsya Puranam Part II (Sacred Books of the Hindus, Allahabad, 1917), p. 344, rendering Pargiter&#x27;s emended text; public domain. Transcribed from the page images, the archive.org OCR of these pages being badly garbled.", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.283501"], "notes": "The Matsya recension of the Saptarṣi cycle, independently verified. Its text is corrupt at 273.38-39 (the vulgate repeats सप्तर्षयस्तु where the Brahmāṇḍa/Vāyu have सप्तविंशतिपर्यन्ते कृत्स्ने नक्षत्रमण्डले); both Wilson (1840) and the 1917 Taluqdar edition flag this, and Pargiter emended the passage. NOTE the verse-number offset: the Taluqdar/Pargiter numbering runs one higher than the Wikisource text (Taluqdar 44 = Wikisource 273.43). Wilson&#x27;s note 81 records the manuscript spread for the Parīkṣit-to-Nanda interval: 1015 years in all his Viṣṇu copies, 1050 in three Vāyu copies and five Matsya copies, 1500 in one Matsya copy — and the Viṣṇu critical edition indeed reads pañcadaśottaram (1015) where the vulgate has pañcāśaduttaram (1050)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.229 (Dig-varga)", "shloka": "सप्तर्षयो मरीच्यत्रिमुखाश्चित्रशिखण्डिनः ॥ १.३.२२९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Ursa major.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Lexicon attestation adding Colebrooke&#x27;s explicit roll-call of the seven stars as the seven sages, and the alternative collective Citraśikhaṇḍinaḥ. Note Amarakośa&#x27;s ordering &#x27;headed by Marīci and Atri&#x27; (marīcy-atri-mukhāḥ)."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 13.8–9; cf. al-Bīrūnī, India ch. XLV", "shloka": "याम्योदग्गोलसम्स्थानाम् भानाम् अभिजितस् तथा // सप्तर्षीणाम् अगस्त्यस्य ब्रह्मादीनाम् च कल्पयेत् /", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_ज्यौतिषोपनिषदध्यायः"], "translation": "8. ... Those likewise of the asterisms (bha) situated in the southern and northern hemispheres, of Abhijit, 9. Of the Seven Sages (saptarshayas), of Agastya, of Brahma etc., are to be fixed ....", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "SS 13.8–9 (the armillary-sphere chapter) directs that day-circles be fixed for the asterisms of both hemispheres, for Abhijit, for the Seven Sages, for Agastya, and for &#x27;Brahmā etc.&#x27; — confirming that the treatise treats the Saptarṣayaḥ as observable stars with definite declinations, not merely as myth. Burgess computes this would burden the instrument with forty-two extra circles and remarks that &#x27;such impracticable directions... cannot but inspire the suspicion that the instrument may never have been constructed except upon paper.&#x27; Al-Bīrūnī separately gives Ptolemaic Ursa Major catalogue numbers for the seven rishis (Marīci 27th, Vasiṣṭha 26th, Aṅgiras 25th, Atri 18th, Kratu 16th, Pulaha 17th, Pulastya 19th), broadly consistent with the east-to-west mapping on file, and demolishes the Saptarṣi-cycle chronology: &#x27;The words of Garga are without any foundation.&#x27;"}]}, {"id": "marichi", "cat": "saptarshi", "dev": "मरीचि", "dev_short": "मरीचि", "iast": "Marīci", "modern": {"common_name": "Alkaid (Benetnash)", "bayer": "η Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "मरीचि", "kind": "star", "ra": 206.89, "dec": 49.31, "mag": 1.85, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "BS 13.5 makes Marīci the easternmost of the seven (pūrve bhāge bhagavān marīciḥ). The BS itself gives only this east-to-west ORDER, not star-by-star identifications; reading the order onto the Big Dipper (Alkaid is the easternmost star, and the next, Vasiṣṭha, is anchored to Mizar by Arundhatī = Alcor) yields Marīci = Alkaid. The Bayer assignment is thus conventional but consistent with the classical order."}]}, {"id": "vasishtha", "cat": "saptarshi", "dev": "वसिष्ठ", "dev_short": "वसिष्ठ", "iast": "Vasiṣṭha", "modern": {"common_name": "Mizar", "bayer": "ζ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["arundhati"], "label": "वसिष्ठ", "kind": "star", "ra": 200.98, "dec": 54.93, "mag": 2.23, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5–6", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।\nपुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; ... The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII vv. 5–6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Anchored by the text itself: BS 13.6 places the faithful Arundhatī right beside Vasiṣṭha, matching the naked-eye pair Mizar–Alcor; BS 13.5 places Vasiṣṭha second from the east, matching Mizar&#x27;s position next to Alkaid. The Mizar/Alcor = Vasiṣṭha/Arundhatī pairing is the standard identification in Indian astronomy."}]}, {"id": "angiras", "cat": "saptarshi", "dev": "अङ्गिरस्", "dev_short": "अङ्गिरस्", "iast": "Aṅgiras", "modern": {"common_name": "Alioth", "bayer": "ε Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "अङ्गिरस्", "kind": "star", "ra": 193.51, "dec": 55.96, "mag": 1.76, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Third from the east in the order given by BS 13.5 (after Marīci and Vasiṣṭha); reading that order onto the Dipper with Mizar anchored by Arundhatī gives Alioth. Conventional assignment consistent with, but not explicitly stated in, the classical text."}]}, {"id": "atri", "cat": "saptarshi", "dev": "अत्रि", "dev_short": "अत्रि", "iast": "Atri", "modern": {"common_name": "Megrez", "bayer": "δ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "अत्रि", "kind": "star", "ra": 183.86, "dec": 57.03, "mag": 3.31, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Fourth from the east in the BS 13.5 order; conventional mapping onto the Dipper gives Megrez. Same caveat as the other rishis: BS gives the order, not the star-by-star assignment."}]}, {"id": "pulastya", "cat": "saptarshi", "dev": "पुलस्त्य", "dev_short": "पुलस्त्य", "iast": "Pulastya", "modern": {"common_name": "Phecda", "bayer": "γ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "पुलस्त्य", "kind": "star", "ra": 178.46, "dec": 53.69, "mag": 2.44, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Fifth from the east in the BS 13.5 order; conventional mapping gives Phecda. BS gives the order only."}]}, {"id": "pulaha", "cat": "saptarshi", "dev": "पुलह", "dev_short": "पुलह", "iast": "Pulaha", "modern": {"common_name": "Merak", "bayer": "β Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "पुलह", "kind": "star", "ra": 165.46, "dec": 56.38, "mag": 2.37, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The next in order are the Rishis Pulaha and Kratu. The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Sixth from the east in the BS 13.5–6 order; conventional mapping gives Merak. BS gives the order only."}]}, {"id": "kratu", "cat": "saptarshi", "dev": "क्रतु", "dev_short": "क्रतु", "iast": "Kratu", "modern": {"common_name": "Dubhe", "bayer": "α Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "क्रतु", "kind": "star", "ra": 165.93, "dec": 61.75, "mag": 1.79, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The next in order are the Rishis Pulaha and Kratu. The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Last (westernmost) in the BS 13.5–6 east-to-west order; conventional mapping gives Dubhe, the western &#x27;pointer&#x27;. BS gives the order only."}]}, {"id": "arundhati", "cat": "saptarshi", "dev": "अरुन्धती", "dev_short": "अरुन्धती", "iast": "Arundhatī", "modern": {"common_name": "Alcor, the faint companion of Mizar in the Big Dipper's handle", "bayer": "80 Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["vasishtha"], "label": "अरुन्धती", "kind": "star", "ra": 201.31, "dec": 54.99, "mag": 3.99, "road": null, "galacticL": null, "plotnote": "Alcor, the naked-eye companion of Mizar (Vasiṣṭha) — the classic eyesight test.", "refs": [{"text": "Vedic corpus", "citation": "Āśvalāyana Gṛhya Sūtra 1.7.22", "shloka": "ध्रुवमरुन्धतीं सप्तऋषीनिति दृष्ट्वा वाचं विसृजेत जीवपत्नीं प्रजां विन्देयेति २२", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/आश्वलायनगृह्यसूत्रम्/अध्यायः_१"], "translation": "When she sees the polar-star, the star Arundhati, and the seven Rishis (ursa major), let her break the silence (and say), &#x27;May my husband live and I get offspring.&#x27;", "translator": "Hermann Oldenberg, SBE vol. 29 (1886)", "trans_links": ["https://sacred-texts.com/hin/sbe29/sbe29.txt", "https://web.archive.org/web/20080113225826/http://sacred-texts.com/hin/sbe29/sbe29.txt"], "notes": "Wife of the rishi Vasiṣṭha (= Mizar, ζ UMa), shown to the bride as the model of conjugal fidelity; the pan-Indian tradition of arundhatī-darśana fixes the identification with Alcor securely."}, {"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6 (cf. 13.4, Kern's variant)", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "They rise in the North-East and are accompanied by the chaste Arundhati, the consort of Vasishtha. ... The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII vv. 4 and 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "BS 13.6 states that the chaste Arundhatī closely attends Vasiṣṭha, best of sages — exactly the naked-eye companion Alcor beside Mizar; the pair is the classic Indian eyesight test. Kern&#x27;s variant of BS 13.4 (recorded in the e-text apparatus as क्. प्रागुत्तरतश्च एते सदा उदयन्ते ससाध्वीकाः) says the rishis rise in the north-east &#x27;accompanied by the sādhvī&#x27;, i.e. Arundhatī, which Iyer&#x27;s v. 4 translates. Note: Utpala&#x27;s tradition (Iyer p. 81 n.) holds the visible star is not the &#x27;real&#x27; Arundhatī, said to be a sūkṣma-tārā (minute star) very close to Vasiṣṭha."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Al-Bīrūnī, India ch. XLV, 'On the constellation of the Great Bear' (Sachau 1910, vol. 1, pp. 389–391)", "shloka": "", "shloka_script": "devanagari", "shloka_note": "No Sanskrit text: al-Bīrūnī wrote in Arabic, and the passage survives here only in Sachau&#x27;s English.", "shloka_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "translation": "The Great Bear is in the Indian language called Saptarshayas, i.e. the Seven Rishis. They are said to have been anchorites who nourished themselves only with what it is allowable to eat, and with them there was a pious woman, Al-suhā (Ursa Major, star 80 by Ptolemy). ... Marici is the 27th star of this constellation. Vasishtha, 26th; Angiras, 25th; Atri, 18th; Kratu, 16th; Pulaha, 17th; Pulastya, 19th.", "translator": "E. Sachau (1910)", "trans_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "notes": "A DECISIVE INDEPENDENT CROSS-CHECK. Al-Bīrūnī equates Arundhatī with al-Suhā and pins it by Ptolemaic catalogue number: &#x27;a pious woman, Al-suhā (Ursa Major, star 80 by [Ptolemy])&#x27;. Al-Suhā is the standard Arabic name for Alcor and 80 UMa is Alcor&#x27;s designation — so an eleventh-century Central Asian observer independently arrives at the identification on file, without recourse to the Indian coordinate tradition."}]}, {"id": "rksha", "cat": "vedic-asterism", "dev": "ऋक्षाः", "dev_short": "ऋक्षाः", "iast": "Ṛkṣāḥ", "modern": {"common_name": "Ursa Major (the Seven Ṛṣis / Big Dipper)", "bayer": "α–η Ursae Majoris", "constellation": "Ursa Major"}, "conf": "disputed", "see_also": ["saptarshi"], "label": "ऋक्षाः", "kind": "figure", "ra": 185.0, "dec": 56.0, "mag": 2.0, "road": null, "galacticL": null, "plotnote": "The Ṛgvedic &#x27;Bears&#x27; = the same seven stars as the Saptarṣi; plotted at the group&#x27;s centre.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Ṛgveda 1.24.10", "shloka": "अमी य ऋक्षा निहितास उच्चा नक्तं ददृश्रे कुह चिद्दिवेयुः ।\nअदब्धानि वरुणस्य व्रतानि विचाकशच्चन्द्रमा नक्तमेति ॥१०॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१.२४"], "translation": "Whither by day depart the constellations that shine at night, set high in heaven above us? Varuna&#x27;s holy laws remain unweakened, and through the night the Moon moves on in splendor", "translator": "R.T.H. Griffith (1896)", "trans_links": ["https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_1/Hymn_24"], "notes": "The oldest Indian reference to Ursa Major, and the only plural ṛkṣāḥ in the Ṛgveda (verified by exhaustive search of the Aufrecht text). Griffith renders it generically as &#x27;constellations&#x27; and does NOT translate &#x27;Bears&#x27; — the identification rests on etymology (ṛkṣa cognate with Greek ἄρκτος, Latin ursa) and on Macdonell &amp; Keith, Vedic Index (1912) i.114: &#x27;Rksa, &quot;bear,&quot; is found only once in the Rigveda... Not more frequent is the use of the word in the plural to denote the &quot;seven bears,&quot; later called the &quot;seven Rsis,&quot; the constellation of the &quot;Great Bear&quot;&#x27;, citing precisely RV 1.24.10, Śatapatha Brāhmaṇa 2.1.2.4, and Taittirīya Āraṇyaka 1.11.2."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Taittirīya Āraṇyaka 1.11.2", "shloka": "ऋषयः सप्तात्रिश्च यत् । सर्वेऽत्रयो अगस्त्यश्च । नक्षत्रैः शंकृतोऽवसन्, इति । अथ सवितुः श्यावाश्वस्यावर्तिकामस्य, इति । अमी य ऋक्षा निहितास उच्चा । नक्तं ददृश्रे कुहचिद्दिवेयुः । अदब्धानि वरुणस्य व्रतानि । विचाकशच्चन्द्रमा नक्षत्रमेति, इति ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयारण्यकम्(विस्वर"], "translation": "The seven Ṛṣis and Atri; all the Atris and Agastya; they dwelt blessed among the asterisms. — Then, of Savitṛ, of Śyāvāśva who desires... — Those Bears that are set on high, seen at night: whither by day have they gone? Unimpaired are Varuṇa&#x27;s ordinances; surveying all, the moon goes to the asterism.", "translator": "No public-domain English translation of the Taittirīya Āraṇyaka located; literal rendering supplied by the compiler", "trans_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयारण्यकम्(विस्वर"], "notes": "This is the passage that makes the Bear identification defensible. TĀ 1.11 names the Seven Ṛṣis, Atri and Agastya as dwelling &#x27;with/among the nakṣatras&#x27; and then, in the very next breath, quotes the Ṛgvedic ṛkṣāḥ verse. It also transmits a significant variant: where RV 1.24.10 ends नक्तमेति (&#x27;goes by night&#x27;), the Āraṇyaka reads नक्षत्रमेति (&#x27;goes to the asterism&#x27;). Macdonell &amp; Keith cite exactly this passage under their &#x27;Rksa = Great Bear&#x27; entry."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Nirukta 3.20; Amarakośa 1.3.217 (Dig-varga)", "shloka": "ऋक्षा उदीर्णानीव ख्यायन्ते । स्तृभिस्तीर्णानीव ख्यायन्ते । अमी य ऋक्षा निहितास उच्चा । पश्यन्तो द्यामिव स्तृभिः । इत्यपि निगमौ भवतः ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/निरुक्तशास्त्रम्/तृतीयोध्यायः"], "translation": "&#x27;Rkṣāh (stars) appear to be raised up. Strbhih (stars) appear to be scattered (in the sky). &quot;These stars which are placed on high.&quot; &quot;Looking at the sky with stars, as it were.&quot; These are two Vedic quotations.&#x27;", "translator": "Lakshman Sarup (1921)", "trans_links": ["https://archive.org/download/nighantuniruktao00yaskuoft/nighantuniruktao00yaskuoft_djvu.txt"], "notes": "DECISIVE FOR THE BEAR CONTROVERSY, and against it. Yāska explains ṛkṣāḥ NOT from ṛkṣa &#x27;bear&#x27; but as &#x27;they appear as if raised up&#x27; (udīrṇāni iva khyāyante), and quotes exactly the verse RV 1.24.10 already on file. So the oldest Indian etymologist reads ṛkṣa as a general word for star, derived from height, and knows nothing of the Bear — a point directly against the Indo-European ṛkṣa/ἄρκτος/ursa equation. The Amarakośa confirms the flattening: by the 6th century ṛkṣa is a plain neuter synonym of nakṣatra, &#x27;a star&#x27;."}]}, {"id": "krittika-seven", "cat": "vedic-asterism", "dev": "अम्बा, दुला, नितत्नी, अभ्रयन्ती, मेघयन्ती, वर्षयन्ती, चुपुणीका", "dev_short": "सप्त कृत्तिकाः", "iast": "Ambā, Dulā, Nitatnī, Abhrayantī, Meghayantī, Varṣayantī, Cupuṇīkā", "modern": {"common_name": "the seven individual stars of the Pleiades", "bayer": "brightest members: η, 27, 17, 20, 23, 19, 28 Tauri (no secure one-to-one mapping)", "constellation": "Taurus"}, "conf": "likely", "see_also": ["krittika"], "label": "सप्त कृत्तिकाः", "kind": "figure", "ra": 56.75, "dec": 24.12, "mag": 1.6, "road": null, "galacticL": null, "plotnote": "The seven individually-named Kṛttikās = the stars of the Pleiades cluster.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 3.1.4.1", "shloka": "अग्निर्वा अकामयत । अन्नादो देवानाꣳ स्यामिति । स एतमग्नये कृत्तिकाभ्यः पुरोडाशमष्टाकपालं निरवपत् । ततो वै सोऽन्नादो देवानामभवत् । अग्निर्वै देवानामन्नादः । यथा ह वा अग्निर्देवनामन्नादः । एवꣳ ह वा एष मनुष्याणां भवति । य एतेन हविषा यजते । य उ चैनदेवं वेद । सोऽत्र जुहोति । अग्नये स्वाहा कृत्तिकाभ्यः स्वाहा । अम्बायै स्वाहा दुलायै स्वाहा । नितत्न्यै स्वाहाभ्रयन्त्यै स्वाहा । मेघयन्त्यै स्वाहा वर्षयन्त्यै स्वाहा । चुपुणीकायै स्वाहेति १", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase] Agni desired: &#x27;May I be the eater of food of the gods.&#x27; He offered an eight-potsherd cake to Agni of the Krittikas, and thereby became the food-eater of the gods... He makes offering with: &#x27;To Agni svaha! To the Krittikas svaha! To Amba svaha! To Dula svaha! To Nitatni svaha! To Abhrayanti svaha! To Meghayanti svaha! To Varshayanti svaha! To Cupunika svaha!&#x27; No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont, &#x27;The Ishtis to the Nakshatras (or Oblations to the Lunar Mansions) of the Taittiriya-Brahmana&#x27;, Proceedings of the American Philosophical Society 98.3 (1954), pp. 204-223 (copyrighted, not quoted).", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "The Taittirīya Brāhmaṇa names seven individual Kṛttikās in the svāhā-calls of the Agni-Kṛttikā offering; several names are rain/cloud words (Abhrayantī &#x27;bringing clouds&#x27;, Meghayantī &#x27;making clouds&#x27;, Varṣayantī &#x27;raining&#x27;). The group = Pleiades is certain; which Vedic name maps to which star cannot be determined."}]}, {"id": "mriga", "cat": "vedic-asterism", "dev": "मृगः (प्रजापतिः)", "dev_short": "मृगः", "iast": "Mṛga (Prajāpati)", "modern": {"common_name": "the celestial deer = Orion", "bayer": "constellation Orion (head λ Ori; body the Belt region)", "constellation": "Orion"}, "conf": "likely", "see_also": ["mrigashirsha", "mrigavyadha", "ishus-trikanda"], "label": "मृगः", "kind": "figure", "ra": 83.0, "dec": 1.0, "mag": 1.7, "road": null, "galacticL": null, "plotnote": "The celestial deer = the whole figure of Orion (Aitareya Brāhmaṇa 3.33); plotted at its centre.", "refs": [{"text": "Vedic corpus", "citation": "Aitareya Brāhmaṇa 3.33", "shloka": "प्रजापतिर्वै स्वां दुहितरमभ्यध्यायद्दिवमित्यन्य आहुरुषसमित्यन्ये तामृश्यो भूत्वा रोहितं भूतामभ्यैत् ... तमभ्यायत्याविध्यत्स विद्ध ऊर्ध्व उदप्रपतत्तमेतं मृग इत्याचक्षते य उ एव मृगव्याधः स उ एव स या रोहित्सा रोहिणी यो एवेषुस्त्रिकाण्डा सो एवेषुस्त्रिकाण्डा।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऐतरेय_ब्राह्मणम्/पञ्चिका_३_(तृतीय_पञ्चिका"], "translation": "Prajapati felt love towards his own daughter, the sky some say, Usas others. Having become a stag he approached her in the form of a deer. ... Having aimed at him he pierced him; being pierced he flew upwards; him they call &#x27;the deer&#x27;. The piercer of the deer is he of that name. The female deer is Rohini; the three-pointed arrow is the three-pointed arrow.", "translator": "A.B. Keith, Rigveda Brahmanas, HOS 25 (1920), pp. 185-186", "trans_links": ["https://archive.org/details/rigvedabrahmana00keitgoog", "https://archive.org/download/rigvedabrahmana00keitgoog/rigvedabrahmana00keitgoog_djvu.txt"], "notes": "The Prajapati-Rudra myth read astronomically: Prajapati, become a deer pursuing his daughter (Rohiṇī, the red doe = Aldebaran), is pierced and &#x27;they call him the deer (mṛga)&#x27; in the sky. The astronomical reading (Orion) is standard scholarship since Weber; Keith&#x27;s own footnote records that &#x27;the astronomical data here given afford Tilak the source of his work Orion.&#x27; The text names the asterisms but not the modern stars, hence &#x27;likely&#x27;. Cf. ŚB 2.1.2.8-9 where Mṛgaśīrṣa is the pierced Prajapati&#x27;s head/body."}]}, {"id": "ishus-trikanda", "cat": "vedic-asterism", "dev": "इषुस्त्रिकाण्डा", "dev_short": "इषुस्त्रिकाण्डा", "iast": "Iṣus trikāṇḍā", "modern": {"common_name": "Orion's Belt - Mintaka, Alnilam, Alnitak - as the 'three-jointed arrow'", "bayer": "δ, ε, ζ Orionis", "constellation": "Orion"}, "conf": "likely", "see_also": ["mriga"], "label": "इषुस्त्रिकाण्डा", "kind": "figure", "ra": 84.05, "dec": -1.2, "mag": 1.69, "road": null, "galacticL": null, "plotnote": "The &#x27;three-jointed arrow&#x27; = Orion&#x27;s Belt (Mintaka, Alnilam, Alnitak); plotted at Alnilam.", "refs": [{"text": "Vedic corpus", "citation": "Aitareya Brāhmaṇa 3.33; cf. Śatapatha Brāhmaṇa 2.1.2.9", "shloka": "तमभ्यायत्याविध्यत्स विद्ध ऊर्ध्व उदप्रपतत्तमेतं मृग इत्याचक्षते य उ एव मृगव्याधः स उ एव स या रोहित्सा रोहिणी यो एवेषुस्त्रिकाण्डा सो एवेषुस्त्रिकाण्डा।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऐतरेय_ब्राह्मणम्/पञ्चिका_३_(तृतीय_पञ्चिका"], "translation": "The female deer is Rohini; the three-pointed arrow is the three-pointed arrow. [ŚB 2.1.2.9, tr. Eggeling: &#x27;when they (the gods) on that occasion pierced him with what is called the three-knotted arrow, he abandoned that body&#x27;.]", "translator": "A.B. Keith, Rigveda Brahmanas, HOS 25 (1920); Julius Eggeling, SBE 12 (1882)", "trans_links": ["https://archive.org/details/rigvedabrahmana00keitgoog", "https://archive.org/download/rigvedabrahmana00keitgoog/rigvedabrahmana00keitgoog_djvu.txt", "https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The &#x27;three-parted arrow&#x27; shot at Prajapati; the three aligned Belt stars piercing the deer&#x27;s body. The same arrow appears in ŚB 2.1.2.9 (&#x27;iṣuṇā trikāṇḍena&#x27; - Eggeling: &#x27;the three-knotted arrow&#x27;) as the reason Prajapati abandoned the body that is Mṛgaśīrṣa&#x27;s vicinity. Standard astronomical reading (Weber, Tilak); the text does not name the stars."}]}, {"id": "vichritau", "cat": "vedic-asterism", "dev": "विचृतौ", "dev_short": "विचृतौ", "iast": "Vicṛtau", "modern": {"common_name": "Shaula and Lesath (the Scorpion's sting)", "bayer": "λ & υ Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": ["mula", "mulabarhana"], "label": "विचृतौ", "kind": "figure", "ra": 263.05, "dec": -37.2, "mag": 1.6, "road": null, "galacticL": null, "plotnote": "&#x27;The two Unfasteners&#x27; = Shaula (λ Sco) and Lesath (υ Sco); plotted between the pair.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Atharvaveda (Śaunaka) 2.8.1", "shloka": "उदगातां भगवती विचृतौ नाम तारके ।\nवि क्षेत्रियस्य मुञ्चतामधमं पाशमुत्तमम् ॥१॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_२/सूक्तम्_०८"], "translation": "Arisen are the (two) blessed stars called the Unfasteners (vicṛ́t); let them unfasten (vi-muc) of the kṣetriyá the lowest, the highest fetter.", "translator": "W.D. Whitney, rev. C.R. Lanman (1905)", "trans_links": ["https://en.wikisource.org/wiki/Atharva-Veda_Samhita/Book_II/Hymn_8"], "notes": "&#x27;The two Unfasteners.&#x27; The single most important find in this cluster: unlike the nakshatra lists, which name asterisms, the Atharvaveda here calls Vicṛtau explicitly तारके — &#x27;the two stars&#x27; — the earliest Indian passage to name individual stars as stars. It occurs in four separate AV hymns (2.8.1, 3.7.4, 6.110.2, 6.121.3); in AV 3.7 and 6.121 the Wikisource sūkta headers give the deity of the verse as तारके. Macdonell &amp; Keith, Vedic Index (1912) ii.295: &#x27;Vicṛtau, &quot;the two releasers&quot;; Mula, &quot;root&quot;; or Mulabarhani, &quot;uprooting,&quot; denote primarily λ and υ at the extremity of the tail of the Scorpion.&#x27; Sāyaṇa&#x27;s bhāṣya on this verse glosses एतन्नाम्न्यौ तारके मूलनक्षत्रम्. Note that Vicṛtau also stands in the Mūla slot of the Taittirīya Saṃhitā 4.4.10 list itself."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Atharvaveda (Śaunaka) 3.7.4", "shloka": "अमू ये दिवि सुभगे विचृतौ नाम तारके ।\nवि क्षेत्रियस्य मुञ्चतामधमं पाशमुत्तमम् ॥४॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_३/सूक्तम्_०७"], "translation": "The two blessed stars named Unfasteners (vicṛ́t), that are yonder in the sky—let them unfasten of the kṣetriyá the lowest, the highest fetter.", "translator": "W.D. Whitney, rev. C.R. Lanman (1905)", "trans_links": ["https://en.wikisource.org/wiki/Atharva-Veda_Samhita/Book_III/Hymn_7"], "notes": "The Sanskrit Wikisource sūkta header for AV 3.7 assigns the deity of verse 4 literally as तारके (&#x27;the two stars&#x27;) — &#x27;दे. १-३ हरिणः, ४ तारके, ५ आपः&#x27;. Whitney&#x27;s note on the passage discusses the identification with the Scorpion&#x27;s sting."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Taittirīya Āraṇyaka 2.6", "shloka": "अमी ये सुभगे दिवि विचृतौ नाम तारके । प्रेहामृतस्य यच्छतामेतद्बद्धकमोचनम, इति ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयारण्यकम्(विस्वर"], "translation": "Those two blessed stars in the sky named the Unfasteners — may they come forth and grant immortality; this is the loosing of the bound one.", "translator": "No public-domain English translation of the Taittirīya Āraṇyaka located; literal rendering supplied by the compiler (cf. Whitney&#x27;s rendering of the near-identical AV 6.121.3)", "trans_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयारण्यकम्(विस्वर"], "notes": "The āraṇyaka attestation, in the Yajurvedic tradition rather than the Atharvavedic. Sāyaṇa quotes this exact verse (as तैआ २,६,१) in his commentary on AV 2.8.1 to prove that vicṛt is a synonym of the Mūla nakshatra. The same verse also stands at AV 6.121.3, and in the Paippalāda Saṃhitā kāṇḍas 1, 3 and 16."}]}, {"id": "shishumara", "cat": "sky-figure", "dev": "शिशुमार", "dev_short": "शिशुमार", "iast": "Śiśumāra", "modern": {"common_name": "the celestial porpoise/dolphin — a whole star-figure, not a single star", "bayer": "—", "constellation": "Draco (+ Ursa Minor) on the dominant reading; the Bhāgavata's expanded version spans the entire sky"}, "conf": "disputed", "see_also": ["dhruva", "dhata-vidhata", "indra-mahendra", "kashyapa", "marichi-tail", "uttanapada", "yajna-group", "yama-shishumara", "prajapati-circumpolar", "akashaganga"], "label": "शिशुमार", "kind": "figure", "ra": 262.5, "dec": 62.0, "mag": 2.2, "road": null, "galacticL": null, "plotnote": "The celestial porpoise. Plotted over Draco, which is the strongest reading of the older 14-star figure (and al-Bīrūnī&#x27;s own gloss). The Bhāgavata&#x27;s expanded version is a whole-sky figure and cannot be placed at one point at all.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.4 (also 5.23.5); parallels Viṣṇu P. 2.9.1, 2.9.5; Vāyu P. 52.90-95; Matsya P. 125.5, 127.19-25; Brahmāṇḍa P. 1,23.99-105", "shloka": "केचनैतज्ज्योतिरनीकं शिशुमारसंस्थानेन भगवतो वासुदेवस्य योगधारणायामनुवर्णयन्ति ॥ ४ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "According to the doctrine of some, the celestial system, assuming the shape of a porpoise (Sisumara) is stationed [in] the Reverend Vasudeva&#x27;s region of contemplation (Dhyana).", "translator": "J.M. Sanyal (Srimad-Bhagabatam vol. II, 1930s; public domain)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Two quite different figures share the name. (a) The older, compact Śiśumāra of Viṣṇu P. 2.9/2.12, Vāyu 52, Matsya 125/127 and Brahmāṇḍa 1,23 is explicitly a FOURTEEN-star figure (Matsya 125.5 caturdaśarkṣeṣu) with Dhruva in the tail; R.N. Iyengar and R.S. Hariharan identify it with Draco, and al-Bīrūnī (c. 1030 CE) independently reports that Hindus placed the pole star in a four-footed aquatic animal called Śiśumāra, glossing it with Persian susumār, the Great Lizard = Draco. (b) The Bhāgavata&#x27;s Śiśumāra (5.23.4-7) carries all 28 nakṣatras and all the planets along its flanks, so it cannot be a compact circumpolar constellation — it is the whole celestial sphere given porpoise shape. Interpreters who identify it with Ursa Minor alone are reading (a) into (b). The one structural fact both share, and the strongest argument for the Draco/Ursa Minor core, is the run from the tail-tip inward: Dhruva → Agni/Indra/Prajāpati/Dharma → Dhātā/Vidhātā → Saptarṣi (Ursa Major), which traces exactly the path from the pole down the Draco/UMi tail to the Big Dipper."}]}, {"id": "sakvara", "cat": "sky-figure", "dev": "सक्वर (?)", "dev_short": "शाक्वर", "iast": "Sakvara", "modern": {"common_name": "the circumpolar 14-star figure (a second name for the Śiśumāra)", "bayer": "—", "constellation": "Ursa Minor / Draco"}, "conf": "disputed", "see_also": ["shishumara"], "label": "शाक्वर", "kind": "figure", "ra": 262.5, "dec": 62.0, "mag": 2.2, "road": null, "galacticL": null, "plotnote": "Al-Bīrūnī&#x27;s second name for the Śiśumāra, plotted with it over Draco — the reading his own Persian gloss (susmār, &#x27;great lizard&#x27;) supports.", "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Al-Bīrūnī, India ch. XXII (Sachau 1910, vol. 1, pp. 241–242)", "shloka": "", "shloka_script": "devanagari", "shloka_note": "No Sanskrit text: al-Bīrūnī wrote in Arabic, and the passage survives here only in Sachau&#x27;s English.", "shloka_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "translation": "The Hindus tell rather ludicrous tales when speaking of the figure in which they represent this group of stars, viz. the figure of a four-footed aquatic animal, which they call Sakvara, and also Śiśumāra. I suppose that the latter animal is the great lizard, for in Persia it is called Susmār, which sounds much like the Indian Śiśumāra. ... The Vishnu-Dharma says: &#x27;Fourteen of these stars he placed round the pole in the shape of a śiśumāra, which drive the other stars round the pole. One of them, north of the pole, on the uppermost chin, is Uttānapāda, on the lowest chin Yajña, on the head Dharma, on the breast Nārāyaṇa, on the two hands towards the east the two stars Aśvinī the physicians, on the two feet Varuṇa, and Aryaman towards the west, on the penis Saṃwatsara, on the back Mitra, on the tail Agni, Mahendra, Marīci, and Kaśyapa.&#x27;", "translator": "E. Sachau (1910)", "trans_links": ["https://archive.org/download/alberunisindiaac01biru/alberunisindiaac01biru_djvu.txt"], "notes": "Al-Bīrūnī records TWO Sanskrit names for the circumpolar aquatic figure: &#x27;a four-footed aquatic animal, which they call Sakvara, and also Śiśumāra.&#x27; Sakvara is otherwise unattested and no Sanskrit source for it could be found; the underlying form may be śākvara (&#x27;bull-like, mighty&#x27;) or a corruption of śiśumāra itself — treat as unverified. The Devanagari above is a transliteration of Sachau&#x27;s Latin-script form, marked (?) like Śūla&#x27;s, and is NOT an attested spelling. His etymological note is the prize: &#x27;I suppose that the latter animal is the great lizard, for in Persia it is called Susmār, which sounds much like the Indian Śiśumāra&#x27; — independent support for the Draco reading already on file. He then gives the Viṣṇu-Dharma&#x27;s fourteen-star roster, which differs from the Purāṇic versions on file by putting NĀRĀYAṆA ON THE BREAST and the two Aśvins on the hands. He closes with a jab — &#x27;How simple those people are! Among us there are scholars who know between 1020 to 1030 stars&#x27; — and a methodological admission that explains why his own nakshatra guesses are weak: &#x27;If I had found a Hindu able to point out to me with his finger the single stars, I should have been able to identify them with the star-figures known among Greeks and Arabs.&#x27;"}]}, {"id": "trishanku", "cat": "sky-figure", "dev": "त्रिशङ्कु", "dev_short": "त्रिशङ्कु", "iast": "Triśaṅku", "modern": {"common_name": "Triśaṅku — a king fixed head-downward in the southern sky", "bayer": "—", "constellation": "Crux (the Southern Cross) on the usual modern gloss"}, "conf": "disputed", "see_also": [], "label": "त्रिशङ्कु", "kind": "figure", "ra": 188.0, "dec": -60.0, "mag": 1.3, "road": null, "galacticL": null, "plotnote": "Plotted at Crux, the usual modern gloss — but no Purāṇa says so; the identification comes from later lexicography.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 9.7.5-6", "shloka": "तस्य सत्यव्रत: पुत्रस्त्रिशङ्कुरिति विश्रुत: । प्राप्तश्चाण्डालतां शापाद् गुरो: कौशिकतेजसा ॥ ५ ॥ सशरीरो गत: स्वर्गमद्यापि दिवि द‍ृश्यते । पातितोऽवाक् शिरा देवैस्तेनैव स्तम्भितो बलात् ॥ ६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_09u.htm"], "translation": "His son was known as Trishanku, and he was truthful. He became a Chandala by the curse of [his] preceptor, but was transmitted to Heaven with his whole body by virtue of the powers of Kausika, and is still seen in the firmament. He was going to be thrown headlong down by the gods, but was forcibly resisted by Viswamitra&#x27;s great power of asceticism.", "translator": "J.M. Sanyal (Srimad-Bhagabatam vol. III; public domain). OCR lightly cleaned; sense unaffected.", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.186141"], "notes": "A Purāṇic sky-figure. The Bhāgavata makes an explicit observational claim: adyāpi divi dṛśyate, &#x27;even today he is seen in the sky&#x27;, hanging avākśirāḥ, head-downward — the very phrase used of the Śiśumāra at 5.23.5. The Crux/Southern Cross identification comes from later lexicography (Kittel&#x27;s Kannada-English dictionary: &#x27;a small southern constellation near the celestial pole containing Coalsack; the Southern Cross&#x27;) and is not stated in any Purāṇa; treat as disputed. Other Purāṇic loci: Brahmāṇḍa 3.63.108, Vāyu 88.108-113, Viṣṇu Purāṇa 4.3.21."}]}, {"id": "dhata-vidhata", "cat": "shishumara-position", "dev": "धाता, विधाता", "dev_short": "धाता", "iast": "Dhātā, Vidhātā", "modern": {"common_name": "two circumpolar star-positions at the root of the Śiśumāra's tail", "bayer": "—", "constellation": "Draco / Ursa Minor region"}, "conf": "disputed", "see_also": ["shishumara"], "label": "धाता", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.5", "shloka": "यस्य पुच्छाग्रेऽवाक्‌शिरस: कुण्डलीभूतदेहस्य ध्रुव उपकल्पितस्तस्य लाङ्गूले प्रजापतिरग्निरिन्द्रो धर्म इति पुच्छमूले धाता विधाता च कट्यां सप्तर्षय: ॥ ५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "At the tail of this Sisumara resting with its head lowered, and its body coiled up, is Dhruva. Under the ends of the Sisumara&#x27;s tail are Prajapati, Agni, Indra and Dharma; at the root of its tail are Dhata and Vidhata; and about its waist are the Saptarshis (the seven saints).", "translator": "J.M. Sanyal (1930s; public domain)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Unique to the Bhāgavata&#x27;s expanded recension — the older Viṣṇu/Vāyu/Matsya/Brahmāṇḍa version does not have them. Positionally they fall between the tail-group (Prajāpati, Agni, Indra, Dharma) and the Saptarṣi at the waist, so they should lie along the Draco tail toward Ursa Major. No Purāṇa identifies them with visible stars and no defensible modern equation was found."}]}, {"id": "indra-mahendra", "cat": "shishumara-position", "dev": "इन्द्र / महेन्द्र", "dev_short": "इन्द्र", "iast": "Indra / Mahendra", "modern": {"common_name": "a circumpolar star on the tail of the Śiśumāra", "bayer": "—", "constellation": "Draco / Ursa Minor region"}, "conf": "disputed", "see_also": ["shishumara", "kashyapa"], "label": "इन्द्र", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.12.34; Bhāgavata Purāṇa 5.23.5 (and 5.23.1); Vāyu Purāṇa 52.95; Matsya Purāṇa 127.25; Brahmāṇḍa Purāṇa 1,23.104", "shloka": "पुच्छ
