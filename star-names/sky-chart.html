t/sa_zArdUlakarNAvadAna.txt"], "notes": "FOUR stars, BIRD-shaped (śakuna-saṃsthāna), deity Vasu, gotra Kauṇḍinyāyanīya. Four stars in a bird-figure = the Delphinus quadrilateral (α, β, γ, δ Del), agreeing exactly with Colebrooke&#x27;s &#x27;The Dolphin&#x27; for Śraviṣṭhā. Vasu lordship agrees with the Vedic lists and the siddhāntic epithet Vāsava."}]}, {"id": "shatabhishaj", "cat": "nakshatra", "dev": "शतभिषज्", "dev_short": "शतभिषज्", "iast": "Śatabhiṣaj", "modern": {"common_name": "Hydor", "bayer": "λ Aquarii", "constellation": "Aquarius"}, "conf": "disputed", "see_also": [], "label": "शतभिषज्", "kind": "star", "ra": 343.15, "dec": -7.58, "mag": 3.74, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.3, 8.9)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8; its junction-star is the brightest of its hundred (sthūla rule, 8.19). Burgess: &#x27;This, from its defined position, can only be λ Aquarii (4)&#x27;. Some later scholars have proposed other Aquarii stars; al-Bīrūnī could not identify it."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 50", "shloka": "śatabhiṣā-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ pañca-daśa-muhūrta-yogaṃ yavāgubhojanaṃ varuṇadaivataṃ tāṇḍyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Śatabhiṣā asterism has one star, is shaped like a forehead-mark, has a fifteen-muhūrta conjunction, barley gruel for its food, Varuṇa for its deity, Tāṇḍyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped, deity Varuṇa, gotra Tāṇḍyāyanīya. The single-star count is striking against the &#x27;hundred physicians/stars&#x27; the name suggests: the Buddhist tradition evidently took only the yogatārā. Varuṇa lordship agrees with the Vedic lists. Note the name-form Śatabhiṣā rather than Śatabhiṣaj, matched by the Pali Satabhisaja."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Al-Bīrūnī, India ch. LV, table of the lunar stations (Sachau 1910, vol. 2)", "shloka": "", "shloka_script": "devanagari", "shloka_note": "No Sanskrit text: al-Bīrūnī wrote in Arabic, and the passage survives here only in Sachau&#x27;s English.", "shloka_links": ["https://archive.org/download/alberunisindia_201612/alberunisindia-color_002_djvu.txt"], "translation": "24. Śatabhishaj ... Southern. Unknown. Most likely identical with the upper part of the hip-joint of Aquarius.", "translator": "E. Sachau (1910)", "trans_links": ["https://archive.org/download/alberunisindia_201612/alberunisindia-color_002_djvu.txt"], "notes": "AL-BĪRŪNĪ COULD NOT IDENTIFY IT — independent evidence that the disputed status on file is not a modern artefact. His table leaves the note &#x27;Unknown. Most likely identical with the upper part of the hip-joint of Aquarius&#x27;, a guess that does not obviously land on λ Aquarii. He is equally defeated by Viśākhā, Pūrvabhādrapadā, Ārdrā, Āśleṣā and Dhaniṣṭhā, while being confident and correct wherever the Arabic manzil tradition gave him an anchor (Kṛttikā = al-Thurayyā, Rohiṇī = Aldabarān, Maghā = al-Jabha, Citrā = al-Simāk al-Aʿzal, Jyeṣṭhā = the Heart of Scorpio, Mūla = al-Shaula, and so on). Śatabhiṣaj sits precisely in the gap between the two systems, which is why it defeated him."}]}, {"id": "purva-bhadrapada", "cat": "nakshatra", "dev": "पूर्वभाद्रपदा", "dev_short": "पूर्वभाद्रपदा", "iast": "Pūrva-Bhādrapadā", "modern": {"common_name": "Markab", "bayer": "α Pegasi", "constellation": "Pegasus"}, "conf": "certain", "see_also": [], "label": "पूर्वभाद्रपदा", "kind": "star", "ra": 346.19, "dec": 15.21, "mag": 2.49, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Part of the Square of Pegasus. Burgess: &#x27;The junction-star of the former half-asterism is, by its defined position, clearly shown to be α Pegasi&#x27;, though the &#x27;northern&#x27; designation of v. 16 conflicts (α is the southern of the pair with β)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 50", "shloka": "pūrvabhādrapadā-nakṣatraṃ dvitāraṃ padaka-saṃsthānaṃ triṃśan-muhūrta-yogaṃ māṃsa-rudhirāhāram ahirbudhnyadaivataṃ jātūkarṇyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Pūrvabhādrapadā asterism has two stars, is padaka-shaped, has a thirty-muhūrta conjunction, flesh and blood for its food, Ahirbudhnya for its deity, Jātūkarṇya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, padaka-shaped, deity Ahirbudhnya, gotra Jātūkarṇya. Two stars = α and β Pegasi; the Ahirbudhnya lordship agrees with the Vedic lists."}]}, {"id": "uttara-bhadrapada", "cat": "nakshatra", "dev": "उत्तरभाद्रपदा", "dev_short": "उत्तरभाद्रपदा", "iast": "Uttara-Bhādrapadā", "modern": {"common_name": "Algenib / Alpheratz", "bayer": "γ Pegasi / α Andromedae", "constellation": "Pegasus / Andromeda"}, "conf": "disputed", "see_also": [], "label": "उत्तरभाद्रपदा", "kind": "star", "ra": 3.31, "dec": 15.18, "mag": 2.83, "road": null, "galacticL": null, "plotnote": "Disputed: the text mixes γ Pegasi (Algenib, plotted here) with α Andromedae; see notes.", "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the text&#x27;s position gives &#x27;a longitude... of one member of the group [γ Pegasi], and a latitude which is that of the other [α Andromedae]&#x27;; &#x27;There can be no doubt that the two stars recognized as composing the asterism are γ Pegasi and α Andromedae, but there has evidently been a blundering confusion of the two&#x27;. Modern lists usually take γ Pegasi."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 50–51", "shloka": "uttarabhādrapadā-nakṣatraṃ dvitāraṃ padaka-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ māṃsāhāram aryamādaivataṃ dhyānadrāhyāyaṇīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Uttarabhādrapadā asterism has two stars, is padaka-shaped, has a forty-five-muhūrta conjunction, flesh for its food, Aryamā for its deity, Dhyānadrāhyāyaṇīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, padaka-shaped, deity Aryamā, gotra Dhyānadrāhyāyaṇīya. The two-star count supports the pair γ Pegasi + α Andromedae that Burgess said the text confuses — evidence the confusion is his sources&#x27;, not the tradition&#x27;s. NOTE the deity Aryamā where the Brahmanical lists have Ahirbudhnya, duplicating Uttaraphalgunī&#x27;s deity."}]}, {"id": "revati", "cat": "nakshatra", "dev": "रेवती", "dev_short": "रेवती", "iast": "Revatī", "modern": {"common_name": "Revati", "bayer": "ζ Piscium", "constellation": "Pisces"}, "conf": "likely", "see_also": [], "label": "रेवती", "kind": "star", "ra": 18.44, "dec": 7.57, "mag": 5.21, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star intended is... the faint star ζ Piscium, of about the fifth magnitude, situated in the band which connects the two Fishes&#x27;; nearly all authorities make it mark the initial point of the sidereal sphere. It &#x27;coincided in longitude with the vernal equinox in the year 572 of our era&#x27;."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra, Vāsanābhāṣya (upapatti) on vv.4-6", "shloka": "…रात्रौ गोलमध्यगचिहुगतया दृष्ट्या रेवतो.तारां विलोक्य क्रान्तिवृत्ते यो मीनान्तस्तं रेवतीतारायां निवेश्य मध्यगतयैव दृष्टच्याश्चिन्यादेर्नक्षत्रस्य योगतारां विलोक्य तस्योपरिवेधवलयं निवेश्यम् । [prose bhāṣya, verbatim from unproofread OCR with visible OCR slips]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[own rendering, no PD translation exists] At night, sighting through the mark at the centre of the sphere, one observes the star of Revatī and places upon it the end of Pisces on the ecliptic ring; then, sighting the yogatārā of Aśvinī and the other nakshatras, the sighting-ring is laid over each; the degrees from the end of Pisces to the intersection give that asterism&#x27;s dhruva, and the degrees between the intersection and the yogatārā give its śara, north or south.", "translator": "Own literal rendering (clearly marked) of Bhāskara&#x27;s Vāsanābhāṣya.", "trans_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "notes": "In the upapatti to Bhagrahayuti vv.4-6 Bhāskara himself describes the observational procedure: at night one sights the Revatī star through the armillary sphere and sets the end of Pisces (Mīnānta, i.e. longitude 360°) on it, then reads off each yogatārā&#x27;s dhruva and śara on the sighting-ring. Bhāskara assigns Revatī dhruva 0 and śara 0. The traditional identification ζ Piscium is printed in the 1861 PD volume (&#x27;Revati (ζ Piscium)&#x27;, p.63); some modern scholars debate whether the faint ζ Psc can be the intended zero star, hence &#x27;likely&#x27; rather than &#x27;certain&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 51", "shloka": "revatī-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ triśan-muhūrta-yogaṃ dadhyāhāraṃ pūṣadaivatam aṣṭabhaginīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Revatī asterism has one star, is shaped like a forehead-mark, has a thirty-muhūrta conjunction, curds for its food, Pūṣan for its deity, Aṣṭabhaginīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped, deity Pūṣa, gotra Aṣṭabhaginīya (&#x27;of the eight sisters&#x27;). The single-star count matches the siddhāntic use of Revatī&#x27;s yogatārā as the zero-point of the sphere; Pūṣan lordship agrees with the Vedic lists."}]}, {"id": "agha", "cat": "nakshatra-alias", "dev": "अघा", "dev_short": "अघा", "iast": "Aghā", "modern": {"common_name": "Regulus", "bayer": "α Leonis", "constellation": "Leo"}, "conf": "likely", "see_also": ["magha"], "label": "अघा", "kind": "star", "ra": 152.09, "dec": 11.97, "mag": 1.36, "road": null, "galacticL": null, "plotnote": "The archaic Ṛgvedic form of Maghā, at Regulus.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Ṛgveda 10.85.13", "shloka": "सूर्याया वहतुः प्रागात्सविता यमवासृजत्।\nअघासु हन्यन्ते गावोऽर्जुन्योः पर्युह्यते ॥१३॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.८५"], "translation": "The bridal pomp of Surya, which Savitar started, moved along. In Magha days are oxen slain, in Arjuris they wed the bride.", "translator": "R.T.H. Griffith (1896)", "trans_links": ["https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_10/Hymn_85"], "notes": "The archaic Ṛgvedic form of Maghā, occurring exactly once in the Ṛgveda. Griffith silently normalises it to &#x27;Magha&#x27;. Macdonell &amp; Keith, Vedic Index (1912) i.10: &#x27;In the wedding hymn of the Rigveda it is said that cows are slain in the Aghas, and the wedding takes place at the Arjunis (dual). The Atharvaveda has the ordinary Maghas instead. It is impossible to resist the conclusion that the reading of the Rigveda was deliberately altered because of the connection of the slaughter of kine with sin (agha).&#x27; The parallel Atharvaveda recension of the same hymn (AV 14.1.13) reads Maghā."}]}, {"id": "arjuni", "cat": "nakshatra-alias", "dev": "अर्जुन्यौ", "dev_short": "अर्जुन्यौ", "iast": "Arjunyau (Arjunī)", "modern": {"common_name": "the two Phalgunīs — Zosma/Chertan group and Denebola", "bayer": "δ & θ Leonis; β Leonis", "constellation": "Leo"}, "conf": "likely", "see_also": ["purva-phalguni", "uttara-phalguni"], "label": "अर्जुन्यौ", "kind": "figure", "ra": 172.9, "dec": 17.5, "mag": 2.3, "road": null, "galacticL": null, "plotnote": "A dual: both Phalgunīs (δ/θ Leonis and β Leonis); plotted between them.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Ṛgveda 10.85.13", "shloka": "सूर्याया वहतुः प्रागात्सविता यमवासृजत्।\nअघासु हन्यन्ते गावोऽर्जुन्योः पर्युह्यते ॥१३॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.८५"], "translation": "The bridal pomp of Surya, which Savitar started, moved along. In Magha days are oxen slain, in Arjuris they wed the bride.", "translator": "R.T.H. Griffith (1896)", "trans_links": ["https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_10/Hymn_85"], "notes": "The archaic Ṛgvedic dual for the two Phalgunīs. The dual arjunyoḥ occurs only here in the Ṛgveda (other forms of arjuna in the RV are the ordinary adjective &#x27;bright/white&#x27;). Macdonell &amp; Keith, Vedic Index (1912) i.36: &#x27;Arjuni is, in the Rigveda, the name of the Naksatra (&quot;lunar mansion&quot;), elsewhere called Phalguni. It occurs in the marriage hymn, with Agha for Magha, and, like that word, is apparently a deliberate modification.&#x27; AV 14.1.13 has the normalised Phalgunī."}]}, {"id": "nishtya", "cat": "nakshatra-alias", "dev": "निष्ट्यम् / निस्त्या", "dev_short": "निष्ट्य", "iast": "Niṣṭya / Nistyā", "modern": {"common_name": "Arcturus", "bayer": "α Boötis", "constellation": "Boötes"}, "conf": "likely", "see_also": ["svati"], "label": "निष्ट्य", "kind": "star", "ra": 213.92, "dec": 19.18, "mag": -0.05, "road": null, "galacticL": null, "plotnote": "The Maitrāyaṇī/Kāṭhaka name for Svāti, at Arcturus.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Maitrāyaṇī Saṃhitā 2.13.20 (also Kāṭhaka Saṃhitā 39.13)", "shloka": "... hasto nakṣatraṃ savitā devatā citrā nakṣatraṃ tvaṣṭā devatā niṣṭyaṃ nakṣatraṃ vāyur devatā viśākhaṃ nakṣatram indrāgnī devatānūrādhā nakṣatraṃ mitro devatā jyeṣṭhā nakṣatraṃ varuṇo devatā mūlaṃ nakṣatraṃ nirṛtir devatā ... //MS_2,13.20//", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/maitrs_pu.htm"], "translation": "Niṣṭya is the asterism, Vāyu the deity.", "translator": "No public-domain English translation of the Maitrāyaṇī Saṃhitā located; literal rendering supplied by the compiler (name forms corroborated by Macdonell &amp; Keith, Vedic Index, 1912, i.413)", "trans_links": ["https://archive.org/stream/vedicindexofname01macduoft/vedicindexofname01macduoft_djvu.txt"], "notes": "The Maitrāyaṇī and Kāṭhaka name for the asterism the Taittirīya Saṃhitā calls Svāti — the most substantive divergence between the Yajurveda nakshatra lists. Note the neuter gender (निष्ट्यं नक्षत्रं) and the deity Vāyu, matching TS&#x27;s Svāti. Macdonell &amp; Keith, Vedic Index (1912) i.417: &#x27;Svati or Nistya is later clearly the brilliant star Arcturus or α Bootis, its place in the north being assured by the notice in the Santikalpa&#x27;; their comparative table gives slot 13 as &#x27;Svati | Nistya (neut.) | Nistya&#x27; for TS | MS | KS. The same form Nistyā stands in the Taittirīya Brāhmaṇa 1.5.1 list. SCRIPT NOTE: the GRETIL Maitrāyaṇī e-text is romanised IAST, not Devanagari; the Devanagari headword is supplied by the compiler and is NOT copied from an e-text."}]}, {"id": "sarpa", "cat": "nakshatra-alias", "dev": "सार्प", "dev_short": "सार्प", "iast": "Sārpa", "modern": {"common_name": "Āśleṣā (head of Hydra)", "bayer": "ε Hydrae (with δ, η, ρ, σ Hydrae)", "constellation": "Hydra"}, "conf": "likely", "see_also": ["ashlesha"], "label": "सार्प", "kind": "star", "ra": 130.8, "dec": 6.42, "mag": 3.38, "road": null, "galacticL": null, "plotnote": "The Vedāṅga Jyotiṣa names this nakshatra only by its deity (the Serpents) = Āśleṣā.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Vedāṅga Jyotiṣa, Ārca-jyotiṣa 6 (= Yājuṣa-jyotiṣa 7)", "shloka": "प्रपद्येते श्रविष्ठादौ सूर्याचन्द्रमसावुदक्।\nसार्पार्धे दक्षिणाऽर्कस्य माघश्रावणयोः सदा॥६॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदाङ्गज्योतिषं_सुधाकरभाष्यसहितम्"], "translation": "The sun and moon turn towards the north at the beginning of &#x27;Sravish&#x27;ṭhā: but the sun turns towards the south in the middle of the constellation over which the serpents preside; and this [his turn towards the south, and towards the north], always [happens] in [the months of] Mág&#x27;ha and &#x27;Srávaṇa.", "translator": "H.T. Colebrooke (1805; repr. Essays on the Religion and Philosophy of the Hindus, 1858, p. 66)", "trans_links": ["https://archive.org/details/essaysonreligion00coleiala"], "notes": "The Vedāṅga Jyotiṣa never uses the name Āśleṣā. It marks the summer solstice as falling in &#x27;the middle of Sārpa&#x27; — the asterism of the Serpents — identifying the nakshatra only by its presiding deity. The equation Sārpa = Āśleṣā comes from the text&#x27;s own deity list (Ārca 25 / Yājuṣa 32, where Sarpāḥ presides over the 7th asterism) and is made explicit by Colebrooke. This verse, paired with Śraviṣṭhā for the winter solstice, is the basis for dating the text&#x27;s astronomical epoch to roughly the 14th–12th century BCE."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.14", "shloka": "कृत्तिकामैत्रमूलानि सार्पम् रौद्रर्क्षम् एव च / दृश्यन्ते पञ्चदशभिर् आषाढाद् द्वितयम् तथा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "14. Krttikā, Anurādhā (māitra), and Mūla, and likewise Açleshā and Ārdrā (rāudrarksha), are seen at fifteen degrees; so, too, the pair of Āshādhās.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Already on file from the Vedāṅga Jyotiṣa; this is a siddhāntic re-attestation, used in place of Āśleṣā at SS 9.14 (the nakshatra&#x27;s divinities being the Sarpas). Al-Bīrūnī could not identify this asterism: his table notes &#x27;Unknown, Most likely identical with two stars of Cancer and four stars outside of it&#x27; — independent evidence that the disputed status recorded here is not a modern artefact."}]}, {"id": "jyeshthaghni", "cat": "nakshatra-alias", "dev": "ज्येष्ठघ्नी", "dev_short": "ज्येष्ठघ्नी", "iast": "Jyeṣṭhaghnī", "modern": {"common_name": "Antares (Cor Scorpionis)", "bayer": "α Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": ["jyeshtha"], "label": "ज्येष्ठघ्नी", "kind": "star", "ra": 247.35, "dec": -26.43, "mag": 1.06, "road": null, "galacticL": null, "plotnote": "The archaic ill-omened name of Jyeṣṭhā, at Antares.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Atharvaveda (Śaunaka) 6.110.2", "shloka": "ज्येष्ठघ्न्यां जातो विचृतोर्यमस्य मूलबर्हणात्परि पाह्येनम् ।\nअत्येनं नेषद्दुरितानि विश्वा दीर्घायुत्वाय शतशारदाय ॥२॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_६/सूक्तम्_११०"], "translation": "Born in jyeṣṭhaghnī́, in Yama&#x27;s two Unfasteners (vicṛ́t)—do thou protect him from the Uprooter (mūlabárhaṇa); may he conduct him across all difficulties unto long life, of a hundred autumns.", "translator": "W.D. Whitney, rev. C.R. Lanman (1905)", "trans_links": ["https://en.wikisource.org/wiki/Atharva-Veda_Samhita/Book_VI/Hymn_110"], "notes": "&#x27;She that slays the eldest&#x27; — the archaic, ill-omened name of Jyeṣṭhā, occurring exactly once in the Atharvaveda. AV 6.110 is a birth-star charm: a rite for a child born under a malevolent asterism. Whitney&#x27;s note: &#x27;Antares or Cor Scorpionis (either alone or with σ, τ) is usually called jyeṣṭhā &quot;oldest,&quot; but also (more anciently?), as an asterism of ill omen, jyeṣṭhaghnī &quot;she that slays the oldest&quot;&#x27;. Note the hymn does NOT mention Tiṣya, contrary to a common secondary-literature claim — the three asterisms named are all in Scorpius."}]}, {"id": "mulabarhana", "cat": "nakshatra-alias", "dev": "मूलबर्हण", "dev_short": "मूलबर्हण", "iast": "Mūlabarhaṇa (fem. Mūlabarhaṇī)", "modern": {"common_name": "the Scorpion's tail (Mūla)", "bayer": "λ, υ and the chain ε–υ Scorpii", "constellation": "Scorpius"}, "conf": "likely", "see_also": ["mula", "vichritau"], "label": "मूलबर्हण", "kind": "figure", "ra": 263.4, "dec": -37.1, "mag": 1.62, "road": null, "galacticL": null, "plotnote": "&#x27;The Uprooter&#x27; = the Scorpion&#x27;s tail as a whole; plotted at λ Scorpii.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Atharvaveda (Śaunaka) 6.110.2", "shloka": "ज्येष्ठघ्न्यां जातो विचृतोर्यमस्य मूलबर्हणात्परि पाह्येनम् ।\nअत्येनं नेषद्दुरितानि विश्वा दीर्घायुत्वाय शतशारदाय ॥२॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_६/सूक्तम्_११०"], "translation": "Born in jyeṣṭhaghnī́, in Yama&#x27;s two Unfasteners (vicṛ́t)—do thou protect him from the Uprooter (mūlabárhaṇa); may he conduct him across all difficulties unto long life, of a hundred autumns.", "translator": "W.D. Whitney, rev. C.R. Lanman (1905)", "trans_links": ["https://en.wikisource.org/wiki/Atharva-Veda_Samhita/Book_VI/Hymn_110"], "notes": "&#x27;The Uprooter&#x27; / &#x27;root-wrencher&#x27; — an archaic name for Mūla, distinguished from Vicṛtau in the same verse: Macdonell &amp; Keith, Vedic Index (1912) i.416 treat &#x27;Vicṛtau&#x27;, &#x27;Mula&#x27; and &#x27;Mulabarhani&#x27; as three names for the same region, with Vicṛtau denoting the two sting-stars specifically and Mūla/Mūlabarhaṇī the tail as a whole. The name also occurs at AV 6.112.1 and AV 12.5.33, and stands in the Mūla slot of the Taittirīya Brāhmaṇa 1.5.1 nakshatra list."}]}, {"id": "invaka", "cat": "nakshatra-alias", "dev": "इन्वकाः (इन्वगाः)", "dev_short": "इन्वकाः", "iast": "Invakāḥ (Invagāḥ)", "modern": {"common_name": "alternative Taittirīya name of Mṛgaśīrṣa - the stars of Orion's head", "bayer": "λ, φ1, φ2 Orionis", "constellation": "Orion"}, "conf": "likely", "see_also": ["mrigashirsha"], "label": "इन्वकाः", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "road": null, "galacticL": null, "plotnote": "Taittirīya name for the stars of Orion&#x27;s head = Mṛgaśīrṣa (λ Orionis).", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 1.5.1.1; 3.1.4.3", "shloka": "अग्नेः कृत्तिकाः । शुक्रं परस्ताज्ज्योतिरवस्तात् । प्रजापते रोहिणी ।आपः परस्तादोषधयोऽवस्तात् । सोमस्येन्वका । विततानि परस्ताद्वयन्तोऽवस्तात् । रुद्रस्य बाहू ।मृगयवः परस्ताद्विक्षारोऽवस्तात् । अदित्यै पुनर्वसू ।वातः परस्तादार्द्रमवस्तात् १ || सोमो वा अकामयत । ओषधीनाꣳ राज्यमभिजयेयमिति । स एतꣳ सोमाय मृगशीर्षाय श्यामाकं चरुं पयसि निरवपत् । ततो वै स ओषधीनाꣳ राज्यमभ्यजयत् । समानानाꣳ ह वै राज्यमभिजयति । य एतेन हविषा यजते । य उ चैनदेवं वेद । सोऽत्र जुहोति । सोमाय स्वाहा मृगशीर्षाय स्वाहा । इन्वकाभ्यः स्वाहौषधीभ्यः स्वाहा । राज्याय स्वाहाभिजित्यै स्वाहेति ३", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः", "https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase of TB 1.5.1.1] The Krittikas are Agni&#x27;s; brightness above, light below. Rohini is Prajapati&#x27;s; the waters above, the plants below. The Invakas are Soma&#x27;s; things spread out above, the weavers below. The Bahu (the two Arms) are Rudra&#x27;s; hunters above, ... below. The two Punarvasus are Aditi&#x27;s; wind above, moisture below. [TB 3.1.4.3] Soma desired: &#x27;May I win the kingship of the plants&#x27;; he offered a caru of millet in milk to Soma of Mrgasirsha... &#x27;To Soma svaha! To Mrgasirsha svaha! To the Invakas svaha! To the plants svaha!&#x27; No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont (1954), copyrighted, not quoted.", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "In the Taittirīya tradition Soma&#x27;s nakshatra is called Invakā where other lists have Mṛgaśīrṣa: TB 1.5.1.1 &#x27;somasyenvakā&#x27;, and TB 3.1.4.3 invokes Mṛgaśīrṣa and the Invakās side by side in the same offering, proving the equation."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Maitrāyaṇī Saṃhitā 2.13.20", "shloka": "kṛttikā nakṣatram agnir devatā ... rohiṇī nakṣatraṃ prajāpatir devatā invagā nakṣatraṃ maruto devatā bāhur nakṣatraṃ rudro devatā punarvasur nakṣatram aditir devatā tiṣyo nakṣatraṃ bṛhaspatir devatā ... //MS_2,13.20//", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/maitrs_pu.htm"], "translation": "Invagā is the asterism, the Maruts the deity; Bāhu is the asterism, Rudra the deity.", "translator": "No public-domain English translation of the Maitrāyaṇī Saṃhitā located; literal rendering supplied by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/maitrs_pu.htm"], "notes": "The Maitrāyaṇī spelling of Invakā, with the deity Maruts, standing where the Taittirīya list has Mṛgaśīrṣa. Macdonell &amp; Keith&#x27;s comparative table gives slot 3 as &#x27;Mrgasirsa (neut.) | Invaga | Invaka&#x27; for TS | MS | KS — the g/k variation is a real recensional difference, not an e-text error. Invakā also survives into the Atharvaveda Nakṣatra Kalpa (avparis_1,6.5, &#x27;invakāsu&#x27;). SCRIPT NOTE: source e-text is romanised IAST; the Devanagari headword is supplied by the compiler."}]}, {"id": "ilvala", "cat": "nakshatra-alias", "dev": "इल्वलाः", "dev_short": "इल्वलाः", "iast": "Ilvalāḥ", "modern": {"common_name": "the stars of Orion's head", "bayer": "λ, φ¹, φ² Orionis", "constellation": "Orion"}, "conf": "likely", "see_also": ["mrigashirsha", "invaka", "agrahayani"], "label": "इल्वलाः", "kind": "figure", "ra": 83.78, "dec": 9.93, "mag": 3.39, "road": null, "galacticL": null, "plotnote": "The Amarakośa defines these as &#x27;the stars that dwell in the head-region&#x27; of the Deer — so the group, λ/φ¹/φ² Orionis, is stated by the lexicon itself.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.222 (Dig-varga)", "shloka": "इल्वलास्तच्छिरोदेशे तारका निवसन्ति याः ॥ १.३.२२२ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Stars in his head.&#x27; (Literally: &#x27;The stars which dwell in the head-region of that [deer] are the Ilvalās.&#x27;)", "translator": "H.T. Colebrooke (1808), with a literal rendering of the relative clause added", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "One of the most valuable lexicon finds: Amarakośa defines Ilvalāḥ by a relative clause — &#x27;the stars which dwell in the head-region of that [Deer]&#x27; — so the anatomy is stated by the lexicon itself, not inferred. Colebrooke glosses &#x27;Stars in his head&#x27;, following directly on &#x27;Orion&#x27;. Cognate/variant of Invakā already on file (the Vedic Invakā/Ilvalā alternation); this is the classical form with an explicit definition attached, and the Śārdūlakarṇāvadāna&#x27;s &#x27;three stars, deer&#x27;s-head-shaped&#x27; independently confirms the group."}]}, {"id": "tishya", "cat": "nakshatra-alias", "dev": "तिष्यः", "dev_short": "तिष्यः", "iast": "Tiṣya", "modern": {"common_name": "the later Puṣya: the Asellus stars and Praesepe region", "bayer": "γ, δ, θ Cancri (δ Cancri = Asellus Australis nearest the ecliptic), with the Praesepe cluster M44", "constellation": "Cancer"}, "conf": "disputed", "see_also": ["pushya"], "label": "तिष्यः", "kind": "star", "ra": 131.17, "dec": 18.15, "mag": 3.94, "road": null, "galacticL": null, "plotnote": "Archaic name for the later Puṣya (δ Cancri region).", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "तिष्यो नक्षत्रम् बृहस्पतिर् देवता", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Tisya the Naksatra, Brhaspati the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "Tiṣya, deity Bṛhaspati, is the archaic name that the AV (19.7.2) and all later lists call Puṣya; Whitney&#x27;s note to AV 19.7 flags this TS/AV name difference explicitly. A faint asterism: identification rests on its fixed position between Punarvasū (Castor/Pollux) and Āśleṣā, hence &#x27;likely&#x27; rather than &#x27;certain&#x27;. Also TB 3.1.1.5, TB 3.1.4.6 (Bṛhaspati-Tiṣya offering)."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Ṛgveda 5.54.13", "shloka": "युष्माद्त्तस्य मरुतो विचेतसो रायः स्याम रथ्यो वयस्वतः।\nन यो युच्छति तिष्यो यथा दिवोऽस्मे रारन्त मरुतः सहस्रिणम् ॥१३॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_५.५४"], "translation": "Sage Maruts, may we be the drivers of the car of riches full of life that have been given by you. O Maruts, let that wealth in thousands dwell with us which never vanishes like Tisya from the sky.", "translator": "R.T.H. Griffith (1896)", "trans_links": ["https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_5/Hymn_54"], "notes": "One of only two occurrences of tiṣya in the whole Ṛgveda. Macdonell &amp; Keith, Vedic Index (1912) i.312: &#x27;Tisya occurs twice in the Rigveda, apparently as the name of a star, though Sayana takes it to mean the sun. It is doubtless identical with the Avestan Tistrya. Later it is the name of a lunar mansion&#x27;, citing 5.54.13 and 10.64.8. Here Tiṣya is a byword for a star that never fails to appear — an observational, not a calendrical, use."}, {"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Ṛgveda 10.64.8", "shloka": "त्रिः सप्त सस्रा नद्यो महीरपो वनस्पतीन्पर्वताँ अग्निमूतये।\nकृशानुमस्तॄन्तिष्यं सधस्थ आ रुद्रं रुद्रेषु रुद्रियं हवामहे ॥८॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदः_सूक्तं_१०.६४"], "translation": "The thrice-seven wandering Rivers, yea, the mighty floods, the forest trees, the mountains, Agni to our aid, Krsanu, Tisya, archers to our gathering-place, and Rudra strong amid the Rudras we invoke.", "translator": "R.T.H. Griffith (1896)", "trans_links": ["https://en.wikisource.org/wiki/The_Hymns_of_the_Rigveda/Book_10/Hymn_64"], "notes": "The second and last Ṛgvedic occurrence. Notable because Tiṣya is invoked here alongside Kṛśānu the archer (कृशानु, astṛ &#x27;archer&#x27;), which Macdonell &amp; Keith flag explicitly: &#x27;5.54.13; 10.64.8 (with Krsanu as an archer)&#x27;. Kṛśānu is the celestial bowman who shoots at the soma-eagle in RV 4.27.3; Tilak and others connected this archer-and-target tableau with the Orion/Sirius myth complex (Mṛgavyādha), but NO Vedic text calls Kṛśānu a star, so that link is speculation, not attestation."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.219 (Dig-varga)", "shloka": "राधाविशाखा पुष्ये तु सिध्यतिष्यौ श्रविष्ठया ॥ १.३.२१९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Stars in Cancer.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "The classical lexicon still preserves the Vedic Tiṣya as a live synonym of Puṣya, some 1500 years after the Ṛgvedic attestation on file — and Colebrooke&#x27;s gloss &#x27;Stars in Cancer&#x27; fixes it in Cancer, not (as sometimes proposed for the Vedic form) at Sirius."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.15", "shloka": "भरणीतिष्यसौम्यानि सौक्ष्म्यात् त्रिःसप्तकाम्शकैः / शेषाणि सप्तदशभिर् दृश्यादृश्यानि भानि तु //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "15. Bharani, Pushya, and Mrgaçirsha, owing to their faintness, are seen at twenty-one degrees; the rest of the asterisms become visible and invisible at seventeen degrees.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Already on file from the Ṛgveda and the Amarakośa; SS 9.15 shows the archaic name surviving in a siddhānta, placed in the faintest class (21°) &#x27;owing to their faintness&#x27; (saukṣmyāt). Al-Bīrūnī&#x27;s parallel list likewise puts Alnathra (the Praesepe region of Cancer) in his faintest 20° class."}]}, {"id": "sidhya", "cat": "nakshatra-alias", "dev": "सिध्यः", "dev_short": "सिध्यः", "iast": "Sidhya", "modern": {"common_name": "Asellus Australis", "bayer": "δ Cancri", "constellation": "Cancer"}, "conf": "certain", "see_also": ["pushya", "tishya"], "label": "सिध्यः", "kind": "star", "ra": 131.17, "dec": 18.15, "mag": 3.94, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.219 (Dig-varga)", "shloka": "राधाविशाखा पुष्ये तु सिध्यतिष्यौ श्रविष्ठया ॥ १.३.२१९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Stars in Cancer.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Third name of Puṣya alongside Tiṣya, &#x27;the auspicious/successful one&#x27;. Colebrooke glosses the trio &#x27;Stars in Cancer&#x27;. The Śārdūlakarṇāvadāna gives Puṣya three stars in a vardhamāna (auspicious-mark) figure, matching δ, γ and θ Cancri."}]}, {"id": "bahu", "cat": "nakshatra-alias", "dev": "बाहू (रुद्रस्य)", "dev_short": "बाहू", "iast": "Bāhū (Rudrasya)", "modern": {"common_name": "'the two Arms' of the deer/Orion: usually taken as Betelgeuse and Bellatrix", "bayer": "α Orionis and γ Orionis", "constellation": "Orion"}, "conf": "disputed", "see_also": ["ardra"], "label": "बाहू", "kind": "figure", "ra": 85.0, "dec": 6.9, "mag": 1.6, "road": null, "galacticL": null, "plotnote": "&#x27;The two Arms&#x27; of the celestial deer: usually Betelgeuse + Bellatrix; plotted between them.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 1.5.1.1", "shloka": "रुद्रस्य बाहू ।मृगयवः परस्ताद्विक्षारोऽवस्तात्", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase] Of Rudra are the two Arms (Bahu); the hunters above, ... below. No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont (1954), copyrighted, not quoted.", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "TB 1.5.1 gives Rudra&#x27;s nakshatra as the dual Bāhū &#x27;the two arms&#x27; in place of Ārdrā, fitting the picture of the celestial deer (Orion): the two bright shoulder stars Betelgeuse + Bellatrix. Which two stars are meant is not stated in the text; Betelgeuse-Bellatrix is the common scholarly reading, and the mention of &#x27;hunters&#x27; (mṛgayavaḥ) alongside is part of the same Orion tableau."}]}, {"id": "rohini-indra", "cat": "nakshatra-alias", "dev": "रोहिणी (द्वितीया; = ज्येष्ठा)", "dev_short": "रोहिणी (इन्द्र)", "iast": "Rohiṇī (second; = Jyeṣṭhā)", "modern": {"common_name": "Antares", "bayer": "α Scorpii", "constellation": "Scorpius"}, "conf": "likely", "see_also": ["jyeshtha", "rohini"], "label": "रोहिणी (इन्द्र)", "kind": "star", "ra": 247.35, "dec": -26.43, "mag": 1.06, "road": null, "galacticL": null, "plotnote": "The archaic second &#x27;Rohiṇī&#x27; of the Taittirīya Saṃhitā = Antares, later renamed Jyeṣṭhā.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.2", "shloka": "अनूराधा नक्षत्रम् मित्रो देवता रोहिणी नक्षत्रम् इन्द्रो देवता विचृतौ नक्षत्रम् पितरो देवता", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Anruradha the Naksatra, Mitra the deity; Rohini the Naksatra, Indra the deity; the two Viçrts the Naksatra; the fathers the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "TS 4.4.10 lists a SECOND Rohini with deity Indra, standing between Anuradha and Vicrtau (= Mula) - i.e. in the position of the later Jyestha. Antares, the other great red star of the zodiacal belt, evidently also bore the name &#x27;the red one&#x27;; later lists rename it Jyeṣṭhā (so already TB 1.5.1 and AV 19.7.3)."}]}, {"id": "ashvayuj", "cat": "nakshatra-alias", "dev": "अश्वयुक्", "dev_short": "अश्वयुक्", "iast": "Aśvayuj", "modern": {"common_name": "Sheratan", "bayer": "β Arietis", "constellation": "Aries"}, "conf": "certain", "see_also": ["ashvini"], "label": "अश्वयुक्", "kind": "star", "ra": 28.66, "dec": 20.81, "mag": 2.64, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.218 (Dig-varga)", "shloka": "दाक्षायिण्योऽश्विनीत्यादितारा अश्वयुगश्विनी ॥ १.३.२१८ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The head of Aries.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Alternative name of Aśvinī, &#x27;the horse-yoker&#x27;. Colebrooke glosses the pair as &#x27;The head of Aries&#x27;. The form survives in the Arthaśāstra&#x27;s month-name Āśvayuja and in the Pali Assayuja — a genuinely pan-Indic variant."}]}, {"id": "radha", "cat": "nakshatra-alias", "dev": "राधा", "dev_short": "राधा", "iast": "Rādhā", "modern": {"common_name": "Zubenelgenubi", "bayer": "α Librae", "constellation": "Libra"}, "conf": "certain", "see_also": ["vishakha"], "label": "राधा", "kind": "star", "ra": 222.72, "dec": -16.04, "mag": 2.75, "road": null, "galacticL": null, "plotnote": "Plotted at α Librae (Zubenelgenubi), the star Colebrooke&#x27;s &#x27;Southern scale&#x27; gloss and the Buddhist two-star count both point to — not at the faint ι Librae that the Sūrya Siddhānta&#x27;s coordinates forced on Burgess for Viśākhā.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.219 (Dig-varga)", "shloka": "राधाविशाखा पुष्ये तु सिध्यतिष्यौ श्रविष्ठया ॥ १.३.२१९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Stars in the Southern scale.&#x27; Footnote: &#x27;Properly dual, as indicating two stars, which compose this constellation according to ancient authors. But astronomers now recken [sic] four.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Amarakośa&#x27;s synonym for Viśākhā. Colebrooke glosses it &#x27;Stars in the Southern scale&#x27; — α Librae — and his footnote records exactly the dispute this database tracks: &#x27;Properly dual, as indicating two stars, which compose this constellation according to ancient authors. But astronomers now reckon four.&#x27; The Buddhist Śārdūlakarṇāvadāna independently gives Viśākhā two stars, siding with the &#x27;ancient authors&#x27; — and against the faint ι Librae that Burgess derived from the Sūrya Siddhānta&#x27;s coordinates."}]}, {"id": "shravishtha", "cat": "nakshatra-alias", "dev": "श्रविष्ठा", "dev_short": "श्रविष्ठा", "iast": "Śraviṣṭhā", "modern": {"common_name": "Rotanev (Dhaniṣṭhā)", "bayer": "β Delphini (with α–δ Delphini)", "constellation": "Delphinus"}, "conf": "likely", "see_also": ["dhanishtha", "vasava"], "label": "श्रविष्ठा", "kind": "star", "ra": 309.4, "dec": 14.6, "mag": 3.63, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Vedāṅga Jyotiṣa, Ārca-jyotiṣa 6 (= Yājuṣa-jyotiṣa 7); also Ārca 5, 19, 34", "shloka": "प्रपद्येते श्रविष्ठादौ सूर्याचन्द्रमसावुदक्।\nसार्पार्धे दक्षिणाऽर्कस्य माघश्रावणयोः सदा॥६॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऋग्वेदाङ्गज्योतिषं_सुधाकरभाष्यसहितम्"], "translation": "The sun and moon turn towards the north at the beginning of &#x27;Sravish&#x27;ṭhā: but the sun turns towards the south in the middle of the constellation over which the serpents preside; and this [his turn towards the south, and towards the north], always [happens] in [the months of] Mág&#x27;ha and &#x27;Srávaṇa.", "translator": "H.T. Colebrooke (1805; repr. Essays on the Religion and Philosophy of the Hindus, 1858, p. 66)", "trans_links": ["https://archive.org/details/essaysonreligion00coleiala"], "notes": "The asterism at which the Vedāṅga Jyotiṣa begins the year and places the winter solstice — the oldest datable astronomical statement in Indian literature. Verified in two independent e-texts: the Sudhākara Dvivedī recension on Sanskrit Wikisource (Devanagari, cited here) and GRETIL&#x27;s romanised Lagadha text, which reads &#x27;prapadyete śraviṣṭhādau sūryācandramasāv udak / sārpārdhe dakṣiṇārkas tu māghaśrāvaṇayoḥ sadā // 6&#x27;. Colebrooke, Essays (1858) pp. 66–67: &#x27;Sravish&#x27;ṭhā is given, in all the dictionaries of the Sanscrit language, as another name of D&#x27;haniṣh&#x27;ṭhā... Hence it is clear, that D&#x27;haniṣh&#x27;ṭhā and Aslesha are the constellations meant; and that when this Hindu calendar was regulated, the solstitial points were reckoned to be at the beginning of the one, and in the middle of the other: and such was the situation of those cardinal points, in the fourteenth century before the Christian era.&#x27; IMPORTANT: the name धनिष्ठा never appears in the Vedāṅga Jyotiṣa itself — only श्रविष्ठा; Dhaniṣṭhā enters solely through Sudhākara&#x27;s 19th-century gloss."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.219–220 (Dig-varga)", "shloka": "राधाविशाखा पुष्ये तु सिध्यतिष्यौ श्रविष्ठया ॥ १.३.२१९ ॥ समा धनिष्ठाः स्युः प्रोष्ठपदा भाद्रपदाः स्त्रियः ॥ १.३.२२० ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The Dolphin.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "The older name of Dhaniṣṭhā, expressly equated with it by the lexicon (&#x27;Dhaniṣṭhāḥ are the same as Śraviṣṭhā&#x27;). Colebrooke&#x27;s gloss &#x27;The Dolphin&#x27; is decisive for Delphinus, and the Śārdūlakarṇāvadāna&#x27;s four stars in a śakuna (bird) figure agrees with the Delphinus quadrilateral. This is the name the Vedāṅga Jyotiṣa uses for the asterism that begins its year — Dhaniṣṭhā never appears in that text at all."}]}, {"id": "proshthapada", "cat": "nakshatra-alias", "dev": "प्रोष्ठपदा", "dev_short": "प्रोष्ठपदा", "iast": "Proṣṭhapadā", "modern": {"common_name": "Markab / Algenib", "bayer": "α and γ Pegasi", "constellation": "Pegasus"}, "conf": "certain", "see_also": ["purva-bhadrapada", "uttara-bhadrapada"], "label": "प्रोष्ठपदा", "kind": "figure", "ra": 346.19, "dec": 15.21, "mag": 2.49, "road": null, "galacticL": null, "plotnote": "A dual covering both Bhādrapadās (α Pegasi and γ Pegasi); plotted at α Pegasi, since the pair straddles 0h and cannot share one point on this projection.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.220 (Dig-varga); Arthaśāstra 2.20.55", "shloka": "समा धनिष्ठाः स्युः प्रोष्ठपदा भाद्रपदाः स्त्रियः ॥ १.३.२२० ॥ — cf. (IAST) śrāvaṇaḥ prauṣṭhapadaś ca varṣāḥ // kaz02.20.55", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The wing of Pegasus.&#x27; — Arthaśāstra: &#x27;Śrāvaṇa and Prauṣṭhapada are the rains.&#x27;", "translator": "H.T. Colebrooke (1808); the Arthaśāstra line rendered literally by the compiler", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Older feminine form of Bhādrapadā, expressly equated with it. Colebrooke&#x27;s gloss &#x27;The wing of Pegasus&#x27; fixes the asterism on the Pegasus square. The archaic form underlies Kauṭilya&#x27;s month-name Prauṣṭhapada (Arthaśāstra 2.20.55), confirming it was still standard when the Arthaśāstra&#x27;s calendar was compiled; the Atharvaveda Nakṣatra Kalpa also uses Proṣṭhapadā rather than Bhādrapadā."}]}, {"id": "agrahayani", "cat": "nakshatra-alias", "dev": "आग्रहायणी", "dev_short": "आग्रहायणी", "iast": "Āgrahāyaṇī", "modern": {"common_name": "Meissa", "bayer": "λ Orionis", "constellation": "Orion"}, "conf": "certain", "see_also": ["mrigashirsha", "ilvala"], "label": "आग्रहायणी", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.221 (Dig-varga)", "shloka": "मृगशीर्षं मृगशिरस्तस्मिन्नेवाग्रहायणी ॥ १.३.२२१ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Orion.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Third name of Mṛgaśiras, &#x27;she who begins the year&#x27; — a fossil of the era when the year opened at the Mṛgaśiras full moon, and so a chronological datum in its own right. Amarakośa&#x27;s tasminn eva (&#x27;in that very asterism&#x27;) makes the equation explicit. Source of the month-name Mārgaśīrṣa/Agrahāyaṇa."}]}, {"id": "ashvattha", "cat": "nakshatra-alias", "dev": "अश्वत्थ", "dev_short": "अश्वत्थ", "iast": "Aśvattha", "modern": {"common_name": "Altair (Śravaṇa/Śroṇā)", "bayer": "α Aquilae", "constellation": "Aquila"}, "conf": "disputed", "see_also": ["shravana"], "label": "अश्वत्थ", "kind": "star", "ra": 297.7, "dec": 8.87, "mag": 0.76, "road": null, "galacticL": null, "plotnote": "The Kāṭhaka name in the Śravaṇa slot, at Altair. The verse itself could not be found online — this rests on Macdonell &amp; Keith&#x27;s comparative table alone.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Kāṭhaka Saṃhitā 39.13", "shloka": "", "shloka_script": "devanagari", "shloka_note": "No e-text of the Kāṭhaka Saṃhitā is online; the name is attested here through Macdonell &amp; Keith&#x27;s comparative table of the nakṣatra lists.", "shloka_links": ["https://archive.org/stream/vedicindexofname01macduoft/vedicindexofname01macduoft_djvu.txt"], "translation": "[Attested only via the secondary comparative table] &#x27;21. Srona .. Srona. .. Asvattha&#x27;", "translator": "A.A. Macdonell &amp; A.B. Keith, Vedic Index of Names and Subjects (1912), i.413", "trans_links": ["https://archive.org/stream/vedicindexofname01macduoft/vedicindexofname01macduoft_djvu.txt"], "notes": "A name unique to the Kāṭhaka Saṃhitā, standing in slot 21 where the Taittirīya and Maitrāyaṇī lists both read Śroṇā. Attested in Macdonell &amp; Keith&#x27;s comparative table of the three Yajurveda lists, Vedic Index (1912) i.413: &#x27;21. Srona .. Srona. .. Asvattha&#x27; for TS | MS | KS. The word otherwise means the pipal tree (Ficus religiosa). NOT verified against a primary Kāṭhaka e-text — GRETIL does not host it and the TITUS URL returned only a frame stub — so confidence is marked disputed on that ground alone, not because the scholarly attestation is weak."}]}, {"id": "brahmana-nakshatra", "cat": "nakshatra-alias", "dev": "ब्राह्मण", "dev_short": "ब्राह्मण", "iast": "Brāhmaṇa", "modern": {"common_name": "unidentified", "bayer": "—", "constellation": "—"}, "conf": "disputed", "see_also": [], "label": "ब्राह्मण", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "An extra nakshatra name with no identified star; almost certainly a ritual category rather than an observed asterism.", "refs": [{"text": "Ṛgveda & Vedāṅga Jyotiṣa", "citation": "Maitrāyaṇī Saṃhitā 2.13.20", "shloka": "... revatī nakṣatraṃ pūṣā devatāśvayujau nakṣatram aśvinau devatā bharaṇīr nakṣatraṃ yamo devatā brāhmaṇo nakṣatraṃ somo devatā ... //MS_2,13.20//", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/maitrs_pu.htm"], "translation": "Bharaṇī is the asterism, Yama the deity; Brāhmaṇa is the asterism, Soma the deity.", "translator": "No public-domain English translation of the Maitrāyaṇī Saṃhitā located; literal rendering supplied by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/maitrs_pu.htm"], "notes": "An anomalous extra nakshatra appended after Bharaṇī at the very end of the Maitrāyaṇī list, with Soma as its deity — &#x27;brāhmaṇo nakṣatraṃ somo devatā&#x27;. The MS list already contains 28 including Abhijit, so Brāhmaṇa is a 29th. Macdonell &amp; Keith, Vedic Index (1912) i.414 confirm: &#x27;the list in the Maitrayani Samhita contains 28 Naksatras, including Abhijit, and adds Brahmana at the end as another&#x27;, noting that Taittirīya Brāhmaṇa 3.1.4 likewise &#x27;mentions Brahmana as the 28th Naksatra&#x27; — a point Weber used to argue Abhijit was an interpolation. Almost certainly a ritual or classificatory category rather than an observed asterism; recorded because it is a genuine textual name, not because it is identifiable in the sky. SCRIPT NOTE: source e-text is romanised IAST."}]}, {"id": "vaishnava", "cat": "nakshatra-alias", "dev": "वैष्णव", "dev_short": "वैष्णव", "iast": "Vaiṣṇava", "modern": {"common_name": "Altair", "bayer": "α Aquilae", "constellation": "Aquila"}, "conf": "certain", "see_also": ["shravana"], "label": "वैष्णव", "kind": "star", "ra": 297.7, "dec": 8.87, "mag": 0.76, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.18", "shloka": "अभिजिद् ब्रह्महृदयम् स्वातीवैष्णववासवाः / अहिर्बुध्न्यम् उदक्स्थत्वान् न लुप्यन्ते ऽर्करश्मिभिः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "18. Abhijit, Brahmahrdaya, Svati, Çravana (vāishnava), Çravishtha (vāsava), and Uttara-Bhādrapadā (ahirbudhnya), owing to their northern situation, are not extinguished by the sun&#x27;s rays.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Deity-epithet name for Śravaṇa, whose presiding divinity is Viṣṇu, used in place of the ordinary name at SS 9.18. Corroborated by al-Bīrūnī, whose never-setting list includes &#x27;the two Eagles&#x27; — al-Nasr al-Ṭāʾir (Altair) and al-Nasr al-Wāqiʿ (Vega) — matching Vaiṣṇava and Abhijit exactly. The Buddhist Śārdūlakarṇāvadāna independently gives Śravaṇā the deity Viṣṇu."}]}, {"id": "vasava", "cat": "nakshatra-alias", "dev": "वासव", "dev_short": "वासव", "iast": "Vāsava", "modern": {"common_name": "Rotanev", "bayer": "β Delphini", "constellation": "Delphinus"}, "conf": "likely", "see_also": ["dhanishtha", "shravishtha"], "label": "वासव", "kind": "star", "ra": 309.4, "dec": 14.6, "mag": 3.63, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.18", "shloka": "अभिजिद् ब्रह्महृदयम् स्वातीवैष्णववासवाः / अहिर्बुध्न्यम् उदक्स्थत्वान् न लुप्यन्ते ऽर्करश्मिभिः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "18. ... Çravishtha (vāsava) ... owing to their northern situation, are not extinguished by the sun&#x27;s rays.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Deity-epithet name for Śraviṣṭhā/Dhaniṣṭhā, whose divinities are the Vasus, used at SS 9.18. Al-Bīrūnī&#x27;s independent never-setting list also has Dhaniṣṭhā, and his nakshatra table remarks of it: &#x27;Unknown. Most likely it is the Dolphin&#x27; — an independent arrival at Delphinus, matching Colebrooke&#x27;s gloss on the Amarakośa."}]}, {"id": "ahirbudhnya", "cat": "nakshatra-alias", "dev": "अहिर्बुध्न्य", "dev_short": "अहिर्बुध्न्य", "iast": "Ahirbudhnya", "modern": {"common_name": "Algenib / Alpheratz", "bayer": "γ Pegasi / α Andromedae", "constellation": "Pegasus / Andromeda"}, "conf": "certain", "see_also": ["uttara-bhadrapada"], "label": "अहिर्बुध्न्य", "kind": "star", "ra": 3.31, "dec": 15.18, "mag": 2.83, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.18", "shloka": "अभिजिद् ब्रह्महृदयम् स्वातीवैष्णववासवाः / अहिर्बुध्न्यम् उदक्स्थत्वान् न लुप्यन्ते ऽर्करश्मिभिः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "18. ... and Uttara-Bhādrapadā (ahirbudhnya), owing to their northern situation, are not extinguished by the sun&#x27;s rays.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Deity-epithet name for Uttara-Bhādrapadā, whose divinity is Ahir Budhnya, &#x27;the serpent of the deep&#x27;, used at SS 9.18. Burgess notes the internal tension that this star, of the second magnitude, is left in the unspecified 17° class at 9.15 yet appears here among those never obscured. Al-Bīrūnī&#x27;s never-setting list likewise ends with Uttarabhādrapadā."}]}, {"id": "ashvinidaivata", "cat": "nakshatra-alias", "dev": "अश्विनिदैवत", "dev_short": "अश्विनिदैवत", "iast": "Aśvinidaivata", "modern": {"common_name": "Sheratan", "bayer": "β Arietis", "constellation": "Aries"}, "conf": "certain", "see_also": ["ashvini"], "label": "अश्विनिदैवत", "kind": "star", "ra": 28.66, "dec": 20.81, "mag": 2.64, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.13", "shloka": "हस्तश्रवणफाल्गुन्यः श्रविष्टा रोहिणीमघाः / चतुर्दशाम्शकैर् दृश्या विशाखाश्विनिदैवतम् //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "13. Hasta, Çravana, the Phalgunis, Çravishthā, Rohini, and Maghā become visible at fourteen degrees; also Viçākhā and Açvini.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Periphrastic name for Aśvinī at SS 9.13 — literally &#x27;that whose deity is the Aśvins&#x27;. Burgess renders the compound simply as &#x27;Açvini&#x27;. Note that the Buddhist tradition gives this asterism the deity Gandharva instead."}]}, {"id": "maitra", "cat": "nakshatra-alias", "dev": "मैत्र", "dev_short": "मैत्र", "iast": "Maitra", "modern": {"common_name": "Dschubba", "bayer": "δ Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": ["anuradha"], "label": "मैत्र", "kind": "star", "ra": 240.08, "dec": -22.62, "mag": 2.29, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.14; Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 9", "shloka": "कृत्तिकामैत्रमूलानि सार्पम् रौद्रर्क्षम् एव च / दृश्यन्ते पञ्चदशभिर् आषाढाद् द्वितयम् तथा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "14. Krttikā, Anurādhā (māitra), and Mūla, and likewise Açleshā and Ārdrā (rāudrarksha), are seen at fifteen degrees; so, too, the pair of Āshādhās.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Deity-epithet name for Anurādhā, whose divinity is Mitra. Used at SS 9.14 and also by Brahmagupta at Bhagrahayutyadhikāra 9 (maitrasya) in the yogatārā table, so the usage is standard across the siddhāntas rather than peculiar to one text. The Buddhist Śārdūlakarṇāvadāna independently gives Anurādhā the deity Mitra."}]}, {"id": "raudrarksha", "cat": "nakshatra-alias", "dev": "रौद्रर्क्ष", "dev_short": "रौद्रर्क्ष", "iast": "Raudrarkṣa", "modern": {"common_name": "Betelgeuse", "bayer": "α Orionis", "constellation": "Orion"}, "conf": "disputed", "see_also": ["ardra"], "label": "रौद्रर्क्ष", "kind": "star", "ra": 88.79, "dec": 7.41, "mag": 0.45, "road": null, "galacticL": null, "plotnote": "Plotted at Betelgeuse with the tradition — but al-Bīrūnī twice dissents, offering Procyon in one place and Sirius in another.", "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.14; cf. al-Bīrūnī, India ch. LV", "shloka": "कृत्तिकामैत्रमूलानि सार्पम् रौद्रर्क्षम् एव च / दृश्यन्ते पञ्चदशभिर् आषाढाद् द्वितयम् तथा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "14. ... and likewise Açleshā and Ārdrā (rāudrarksha), are seen at fifteen degrees. — Al-Bīrūnī, quoting Mārkaṇḍeya via Varāhamihira: &#x27;Abhijit, the Falling Eagle; Ārdrā, the Sirius Yemenicus; Rohiṇī, or Aldabarān; Punarvasu, i.e. the Two Heads of the Twins; Puṣya, Revatī, Agastya or Canopus, the Great Bear, the master of Vāyu, the master of Ahirbudhnya, and the master of Śraviṣṭhā, each of these stars has a circumference of five yojanas.&#x27;", "translator": "E. Burgess (1860); E. Sachau (1910) for al-Bīrūnī", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "&#x27;The asterism of Rudra&#x27; = Ārdrā, whose divinity is Rudra. Burgess flags the classification as anomalous: α Orionis &#x27;though a variable star, does not fall below the first to second magnitude&#x27;, yet is ranked with six third-magnitude stars in the 15° class. Al-Bīrūnī dissents twice over: his nakshatra table says &#x27;Unknown. Most likely identical with Canis Minor&#x27; (Procyon), while his rendering of Varāhamihira&#x27;s Saṃhitā ch. 4 glosses &#x27;Ārdrā, the Sirius Yemenicus&#x27; (Sirius). The two Arabic names differ only in epithet (al-yamāniyya = Sirius, al-shāmiyya = Procyon), so the likeliest reading is that the Saṃhitā gloss is corrupt and Procyon was his settled view — but as the text stands he assigns Sirius twice, since he uses &#x27;Sirius Yemenicus&#x27; for Mṛgavyādha too. An independent ancient dissent from Ārdrā = Betelgeuse, worth recording."}]}, {"id": "saumya", "cat": "nakshatra-alias", "dev": "सौम्य", "dev_short": "सौम्य", "iast": "Saumya", "modern": {"common_name": "Meissa", "bayer": "λ Orionis", "constellation": "Orion"}, "conf": "certain", "see_also": ["mrigashirsha"], "label": "सौम्य", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.15", "shloka": "भरणीतिष्यसौम्यानि सौक्ष्म्यात् त्रिःसप्तकाम्शकैः / शेषाणि सप्तदशभिर् दृश्यादृश्यानि भानि तु //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "15. Bharani, Pushya, and Mrgaçirsha, owing to their faintness, are seen at twenty-one degrees; the rest of the asterisms become visible and invisible at seventeen degrees.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Deity-epithet name for Mṛgaśīrṣa, whose divinity is Soma; the same epithet is used at SS 8.16. Al-Bīrūnī&#x27;s parallel faint-class list gives Alhakʿa (al-Haqʿa, the head of Orion, λ/φ¹/φ² Orionis), an exact independent match — and the Buddhist tradition also gives Mṛgaśirā the deity Soma and three head-stars."}]}, {"id": "prajesha", "cat": "nakshatra-alias", "dev": "प्राजेश", "dev_short": "प्राजेश", "iast": "Prājeśa", "modern": {"common_name": "Aldebaran", "bayer": "α Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": ["rohini", "prajapati"], "label": "प्राजेश", "kind": "star", "ra": 68.98, "dec": 16.51, "mag": 0.85, "road": null, "galacticL": null, "plotnote": "Brahmagupta&#x27;s name for ROHIṆĪ (Aldebaran) — not for the fixed star Prajāpati (δ Aurigae), which is a different point on this chart.", "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 8", "shloka": "प्राजेशयोगतारा विक्षेपाः कला त्रिघनहीनः । आग्नेयस्य कलानामेकोनत्रिंशता हीनैः ॥ ८ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;The junction-star of Prājeśa (Rohiṇī) stands with its latitudes diminished by twenty-seven minutes; that of Āgneya (Kṛttikā), by twenty-nine minutes.&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "&#x27;That of the Lord of Creatures&#x27; — Brahmagupta&#x27;s name for ROHIṆĪ, whose divinity is Prajāpati, in the yogatārā table; its latitude is to be reduced by 27 minutes. NAME-COLLISION WARNING: Prājeśa/Prajāpati here denotes Rohiṇī = α Tauri, NOT the separate fixed star Prajāpati = δ Aurigae of Sūrya Siddhānta 8.20–21 already on file. The two must not be merged."}]}, {"id": "agneya", "cat": "nakshatra-alias", "dev": "आग्नेय", "dev_short": "आग्नेय", "iast": "Āgneya", "modern": {"common_name": "Alcyone", "bayer": "η Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": ["krittika", "agni"], "label": "आग्नेय", "kind": "star", "ra": 56.87, "dec": 24.11, "mag": 2.87, "road": null, "galacticL": null, "plotnote": "Brahmagupta&#x27;s name for KṚTTIKĀ (Alcyone) — not for the fixed star Agni (β Tauri, Elnath), which is a different point on this chart.", "refs": [{"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 8–9", "shloka": "पञ्चदशकलाहीनैश्चित्रायाः सप्तभिर्विशाखायाः । षट्सप्तत्या मैत्रस्यैन्द्रस्य त्रिंशता हीनैः ॥ ९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation exists. Sense: &#x27;(the junction-star) of Citrā with fifteen minutes deducted, of Viśākhā with seven, of Maitra (Anurādhā) with seventy-six, of Aindra (Jyeṣṭhā) with thirty deducted.&#x27;", "translator": "Paraphrase by the compiler", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "&#x27;That of Agni&#x27; — Brahmagupta&#x27;s name for KṚTTIKĀ, whose divinity is Agni, in the yogatārā table; its polar latitude is reduced by 29 minutes. Cited together with Aindra (Jyeṣṭhā, reduced by 30&#x27;) and Maitra (Anurādhā, by 76&#x27;). NAME-COLLISION WARNING: Āgneya here is Kṛttikā = η Tauri, NOT the separate fixed star Agni/Hutabhuj = β Tauri of Sūrya Siddhānta 8.20 already on file."}]}, {"id": "agastya", "cat": "individual-star", "dev": "अगस्त्य", "dev_short": "अगस्त्य", "iast": "Agastya", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": [], "label": "अगस्त्य", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "road": null, "galacticL": null, "plotnote": "Deep-south star; lies low on the horizon from India — the theme of Bṛhat Saṃhitā ch. 12.", "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.10", "shloka": "अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "10. Agastya is at the end of Gemini, and eighty degrees south; and Mrgavyadha is situated in the twentieth degree of Gemini;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Agastya is α Navis, or Canopus, a star of the first magnitude, and one of the most brilliant in the southern heavens&#x27; (his &#x27;α Argūs/α Navis&#x27; = modern α Carinae); identification &#x27;correctly pointed out by Colebrooke&#x27;."}, {"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 12.7 (chapter title: अगस्त्यचाराध्यायः)", "shloka": "उदये च मुनेरगस्त्यनाम्नः कुसमायोगमलप्रदूषितानि ।\nहृदयानि सतां इव स्वभावात्पुनरम्बूनि भवन्ति निर्मलानि ।। १२.०७ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१२"], "translation": "When star Canopus reappears after its conjunction with the Sun, waters muddled by their contact with the earth will resume their original clearness just in the same way as the minds of the Sadhus naturally recover their original purity after contact with the wicked.", "translator": "N. Chidambaram Iyer (1884), ch. XII v. 7, p. 77", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Agastya = Canopus is universally accepted (Colebrooke, As. Res. IX; Burgess&#x27;s Sūrya-siddhānta notes p. 245: &#x27;Agastya is α Navis, or Canopus&#x27;). Bṛhat Saṃhitā ch. 12 (Agastyacārādhyāya) is devoted to its heliacal rising; Agastya is named in BS 12.7, 12.11, 12.12, 12.13, 12.19; BS 12.14 fixes its heliacal rising at Ujjayinī, and 12.21 its rising/setting against Hastā/Rohiṇī. Iyer translates the name throughout as &#x27;Canopus&#x27;."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra v.7 (also vv.8, 12, 16)", "shloka": "अगस्त्यध्रुवः सप्तनागास्तु भागास्तुरखाद्यस्तस्य यम्यः शरांशः । षडष्टौ लवा लुब्धकस्य ध्रुवोऽयं नभोऽम्भोधिभागाः शरस्तस्य याम्यः ॥७॥ [verbatim from unproofread OCR; expected readings याम्यः for यम्यः, तुरगाद्रयस् for तुरखाद्यस्]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[paraphrase] The polar longitude (dhruva) of Agastya is 87 degrees and its polar latitude (śara) 77 degrees south; the polar longitude of Lubdhaka is 86 degrees and its polar latitude 40 degrees south.", "translator": "Paraphrased from D. Arkasomayaji, Siddhānta Śiromaṇi Gaṇitādhyāya (Kendriya Sanskrit Vidyapeetha, Tirupati; copyrighted, not quoted verbatim). No public-domain English translation of the Gaṇitādhyāya exists online.", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Universal identification in the Siddhanta tradition. Bhāskara gives polar longitude 87° (sapta-nāga), polar latitude 77° south (turaga-adri); his Vāsanābhāṣya on v.16 adds that Agastya is invisible where the terrestrial latitude exceeds 37° (&#x27;यस्मिन् देशे सप्तत्रिशदधिकाः पलांशास्तत्रागस्त्यो न दृश्यते&#x27;). Verse 12 calls it &#x27;muni&#x27; (the sage). The 1861 public-domain volume (Sūrya Siddhānta portion, same tradition) prints &#x27;Agastya (Canopus)&#x27; explicitly (p.63, 68). D. Arkasomayaji&#x27;s translation of this very verse also glosses &#x27;Agastya (Canopus)&#x27;."}, {"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.7; Viṣṇu Purāṇa 2.8.85; Vāyu Purāṇa 50.208; Matsya Purāṇa 124.97", "shloka": "उत्तराहनावगस्तिरधराहनौ यमो ... ॥ ७ ॥ — cf. विष्णुपुराण २.८.८५: उत्तरं [य]दगस्त्यस्य अजवीथ्याश्च दक्षिणम्।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "And on the upper jaw of the Sisumara is Agastya, and on its lower jaw is Yama. / On the north of Agastya, and south of the line of the Goat, exterior to the Vaiswánara path, lies the road of the Pitris.", "translator": "J.M. Sanyal (1930s) and H.H. Wilson (1840); both public domain", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Two new Purāṇic attestations with distinct content: (a) Bhāgavata 5.23.7 places Agasti on the UPPER JAW of the Śiśumāra — a body-part assignment; (b) Viṣṇu P. 2.8.85 and Vāyu 50.208 use Agastya as the SOUTHERN LATITUDE MARKER bounding the Pitṛyāṇa, which is astronomically apt for Canopus, the brightest star of the far south. Neither text states the Canopus equation; it rests on universal later tradition."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.215–216 (Dig-varga)", "shloka": "ध्रुव औत्तानपादिः स्यातगस्त्यः कुम्भसम्भवः ॥ १.३.२१५ ॥ मैत्रावरुणिरस्यैव लोपामुद्रा सधर्मिणी ॥ १.३.२१६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "Footnote: &#x27;Agastya [is] regent of the star Canopus.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "The lexicon groups Agastya immediately after Dhruva, i.e. it treats the two as the paired southern and northern markers. Colebrooke&#x27;s footnote calls Agastya &#x27;regent of the star Canopus&#x27; — the earliest public-domain English statement of the identification."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.12; also Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 35–37; Pañcasiddhāntikā XIV.39–41; Graha-Lāghava (per Burgess)", "shloka": "स्वात्यगस्त्यमृगव्याधचित्राज्येष्ठाः पुनर्वसुः / अभिजिद् ब्रह्महृदयम् त्रयोदशभिर् अम्शकैः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "12. Svati, Agastya, Mrgavyadha, Citra, Jyeshtha, Punarvasu, Abhijit, and Brahmahrdaya rise and set at thirteen degrees.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Listed among the stars needing only 13 kālāṃśas of distance from the sun to be visible — i.e. the brightest class. Burgess notes this class &#x27;is, indeed, almost wholly composed of stars of the first magnitude&#x27;. Independently corroborated by al-Bīrūnī, who gives 13° for Suhail (Canopus) heading the identical list. THREE FURTHER WITNESSES with coordinates: Brahmagupta (Bhagrahayutyadhikāra 35–37) gives dhruva 27° Gemini = 87°, śara 77° S, arc 12° — far better than SS 8.11&#x27;s 90°/80° S (true c. 85°04&#x27;/75°50&#x27; S); Varāhamihira&#x27;s Pañcasiddhāntikā XIV.39–41 implies 75°30&#x27; S, which Thibaut reverse-engineered from the rule and which is the best ancient figure of all; and the Graha-Lāghava (1520) has 80°/76° S, correct in latitude but as wrong in longitude as the Sūrya Siddhānta, in the opposite direction. Burgess: &#x27;The Siddhanta-Çiromani and (according to Colebrooke) the Brahma-Siddhanta give Agastya 87° of polar longitude, and 77° of latitude, which is a fair approximation to the truth.&#x27;"}]}, {"id": "mrigavyadha", "cat": "individual-star", "dev": "मृगव्याध", "dev_short": "मृगव्याध", "iast": "Mṛgavyādha", "modern": {"common_name": "Sirius", "bayer": "α Canis Majoris", "constellation": "Canis Major"}, "conf": "likely", "see_also": ["lubdhaka"], "label": "मृगव्याध", "kind": "star", "ra": 101.29, "dec": -16.72, "mag": -1.46, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.10–11", "shloka": "अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः // विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "10. Agastya is at the end of Gemini, and eighty degrees south; and Mrgavyadha is situated in the twentieth degree of Gemini; 11. His latitude (vikshepa), reckoned from his point of declination (apakrama), is forty degrees south:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Mrgavyadha, &quot;deer-hunter&quot; — it is also called Lubdhaka, &quot;hunter&quot; — is α Canis Majoris, or Sirius, the brightest of the fixed stars&#x27;."}, {"text": "Vedic corpus", "citation": "Aitareya Brāhmaṇa 3.33", "shloka": "तमभ्यायत्याविध्यत्स विद्ध ऊर्ध्व उदप्रपतत्तमेतं मृग इत्याचक्षते य उ एव मृगव्याधः स उ एव स या रोहित्सा रोहिणी यो एवेषुस्त्रिकाण्डा सो एवेषुस्त्रिकाण्डा।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/ऐतरेय_ब्राह्मणम्/पञ्चिका_३_(तृतीय_पञ्चिका"], "translation": "Having aimed at him he pierced him; being pierced he flew upwards; him they call &#x27;the deer&#x27;. The piercer of the deer is he of that name. The female deer is Rohini; the three-pointed arrow is the three-pointed arrow.", "translator": "A.B. Keith, Rigveda Brahmanas, HOS 25 (1920), pp. 185-186", "trans_links": ["https://archive.org/details/rigvedabrahmana00keitgoog", "https://archive.org/download/rigvedabrahmana00keitgoog/rigvedabrahmana00keitgoog_djvu.txt"], "notes": "The piercer is the dread archer-god (Rudra/Bhūtapati). Identification with Sirius - the brilliant star &#x27;aiming&#x27; along the line of Orion&#x27;s belt - is the standard scholarly and later Indian tradition (Sirius = Lubdhaka &#x27;the hunter&#x27; in classical astronomy); the AB itself does not name the star, hence &#x27;likely&#x27;."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.12; Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 40", "shloka": "षड्विंशे मिथुनांशेंऽशकचत्वारिंशच्छरदाता मृगव्याधः । तत्क्रान्तेर्दक्षिणतो विक्षिप्तोऽगस्त्यवच्छेषम् ॥ ४० ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation of this chapter exists — Colebrooke (1817) rendered only BSS chs. 12 and 18, both purely mathematical. Sense: &#x27;Mṛgavyādha stands in the twenty-sixth degree of Gemini, displaced forty degrees to the south of the declination-circle there; the rest (the finding of the suns of his rising and setting) is as for Agastya.&#x27;", "translator": "Paraphrase by the compiler; Sanskrit normalised from the OCR of Ram Swarup Sharma&#x27;s edition", "trans_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "notes": "Same 13° visibility class as Agastya at SS 9.12. Brahmagupta (Bhagrahayutyadhikāra 40) gives dhruva 26° Gemini = 86°, śara 40° S, arc 13°; his commentary notes the latitude matches the Sūrya Siddhānta&#x27;s but the longitude differs (SS: 80°) &#x27;and that difference is directly visible to the eye&#x27; — i.e. Brahmagupta corrected it by observation. Burgess agrees: &#x27;while all authorities agree with the correct determination of the latitude of Sirius presented by our text, the Siddhanta-Çiromani etc. greatly reduce its error of longitude, by giving the star 86°, instead of 80°.&#x27; Al-Bīrūnī&#x27;s quotation of Brahmagupta&#x27;s Uttara-Khaṇḍakhādyaka matches exactly: &#x27;26° Orion, its southern latitude 40 parts... 13&#x27; for the heliacal-rising arc."}]}, {"id": "lubdhaka", "cat": "individual-star", "dev": "लुब्धक", "dev_short": "लुब्धक", "iast": "Lubdhaka", "modern": {"common_name": "Sirius", "bayer"
