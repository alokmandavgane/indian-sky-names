<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanskrit Star Names — Sky Chart</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1e;
    --panel: #121a30;
    --panel-t: rgba(16, 23, 43, 0.88);
    --ink: #e9eef8;
    --ink-2: #9aa6c0;
    --ink-3: #5d6a88;
    --line: #232f4d;
    --grid: #1b2540;
    --grid-strong: #263454;
    --c-nakshatra: #c98500;
    --c-individual: #3987e5;
    --c-saptarshi: #d55181;
    --c-vedic: #008300;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --deva: "Noto Sans Devanagari", "Devanagari MT", "Mangal", var(--sans);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 20;
    max-width: min(430px, calc(100vw - 32px));
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  #hud h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  #hud h1 .dev { font-family: var(--deva); font-weight: 600; }
  #hud .sub {
    color: var(--ink-2);
    font-size: 11.5px;
    margin-top: 3px;
    line-height: 1.45;
  }
  #legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3.5px 10px 3.5px 7px;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color 120ms, color 120ms, opacity 120ms;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip:focus-visible, button:focus-visible, .marker:focus-visible { outline: 2px solid var(--c-individual); outline-offset: 2px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(0.92); }
  .chip.off { opacity: 0.38; }
  .chip.off .dot { background: var(--ink-3) !important; }
  .chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #tools .chip { padding: 3.5px 10px; }
  #tools .chip.active { border-color: var(--ink-2); color: var(--ink); }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: absolute; z-index: 30; pointer-events: none;
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 11px;
    max-width: 260px;
    opacity: 0; transition: opacity 90ms;
    box-shadow: 0 6px 22px rgba(0,0,0,0.5);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tdev { font-family: var(--deva); font-size: 16px; line-height: 1.3; }
  #tooltip .tiast { color: var(--ink-2); font-size: 11.5px; font-style: italic; }
  #tooltip .tmod { font-size: 12px; margin-top: 3px; }
  #tooltip .tmore { color: var(--ink-3); font-size: 10.5px; margin-top: 3px; }
  #tooltip .cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---------- drawer ---------- */
  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(430px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    transform: translateX(102%);
    transition: transform 200ms ease;
    display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(0,0,0,0.5);
  }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #drawer { transition: none; }
    #tooltip { transition: none; }
  }
  #drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  #drawer header .htitle { font-family: var(--serif); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  #drawer header button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #drawer header button:hover { color: var(--ink); border-color: var(--ink-3); }
  #drawer .body { overflow-y: auto; padding: 4px 16px 28px; }

  .entry { padding: 14px 0 18px; }
  .entry + .entry { border-top: 1px solid var(--line); }
  .entry h2 { font-family: var(--deva); font-size: 26px; font-weight: 600; line-height: 1.25; }
  .entry .iast { color: var(--ink-2); font-style: italic; font-size: 14px; }
  .entry .modline { margin-top: 8px; font-size: 13.5px; }
  .entry .modline b { font-weight: 600; }
  .entry .modline .sep { color: var(--ink-3); padding: 0 5px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .badge {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: 4px; padding: 2.5px 7px; border: 1px solid var(--line); color: var(--ink-2);
  }
  .badge.cat { border: none; color: #0a0f1e; font-weight: 600; }
  .badge.conf-disputed { border-style: dashed; }
  .plotnote { margin-top: 8px; color: var(--ink-3); font-size: 11.5px; font-style: italic; }
  .ref { margin-top: 14px; }
  .ref .cite { font-weight: 600; font-size: 13px; }
  .ref .links { margin: 2px 0 6px; font-size: 11.5px; }
  .ref .links a { color: var(--c-individual); text-decoration: none; }
  .ref .links a:hover { text-decoration: underline; }
  .ref .links .lsep { color: var(--ink-3); padding: 0 4px; }
  .shloka {
    font-family: var(--deva);
    font-size: 14.5px; line-height: 1.85;
    background: rgba(201, 133, 0, 0.06);
    border-left: 2px solid var(--c-nakshatra);
    border-radius: 0 6px 6px 0;
    padding: 9px 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .trans { margin-top: 7px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); font-style: italic; }
  .transby { margin-top: 3px; font-size: 11px; color: var(--ink-3); }
  .ref details { margin-top: 6px; }
  .ref summary { font-size: 11px; color: var(--ink-3); cursor: pointer; letter-spacing: 0.04em; }
  .ref details p { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; margin-top: 5px; }
  .seealso { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seealso .lbl { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; }

  /* index list */
  .ix-cat { margin-top: 14px; }
  .ix-cat h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .ix-cat h3 .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ix-row {
    display: flex; align-items: baseline; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 5px 4px; border-radius: 6px;
    font-family: var(--sans); color: var(--ink);
  }
  .ix-row:hover { background: rgba(255,255,255,0.05); }
  .ix-row .dev { font-family: var(--deva); font-size: 14.5px; }
  .ix-row .im { color: var(--ink-3); font-size: 11.5px; margin-left: auto; text-align: right; }
  .about p { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; margin-top: 10px; }
  .about p b { color: var(--ink); }
  .about a { color: var(--c-individual); text-decoration: none; }
  .about a:hover { text-decoration: underline; }

  /* credits */
  #credits {
    position: absolute; right: 16px; bottom: 6px; z-index: 10;
    font-size: 10px; color: var(--ink-3);
    text-align: right; pointer-events: none; line-height: 1.4;
  }

  /* svg text */
  .axis-lab { fill: var(--ink-3); font-size: 10.5px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .line-lab { fill: var(--ink-3); font-size: 10px; font-family: var(--sans); letter-spacing: 0.06em; }
  .star-lab {
    font-family: var(--deva); font-size: 11px;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .marker { cursor: pointer; }

  @media (max-width: 620px) {
    #hud { max-width: calc(100vw - 24px); left: 12px; top: 10px; padding: 10px 12px 8px; }
    #hud .sub { display: none; }
    #credits { display: none; }
  }
</style>

<div id="app">
  <svg id="sky" role="img" aria-label="Sky chart of Sanskrit star names on a rectangular right-ascension / declination grid"></svg>

  <header id="hud">
    <h1><span class="dev">तारानामानि</span> · Sanskrit Star Names, Charted</h1>
    <div class="sub" id="subline"></div>
    <div id="legend" role="group" aria-label="Category filters"></div>
    <div id="tools">
      <button class="chip active" id="btn-labels" aria-pressed="true">Labels</button>
      <button class="chip" id="btn-index">Index</button>
      <button class="chip" id="btn-about">About &amp; caveats</button>
    </div>
  </header>

  <div id="tooltip" role="status"></div>

  <aside id="drawer" aria-hidden="true">
    <header>
      <span class="htitle" id="drawer-title">Details</span>
      <button id="drawer-close" aria-label="Close panel">✕</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <footer id="credits">
    J2000 positions · marker size ∝ apparent brightness · equirectangular RA/Dec grid<br>
    Sanskrit: sa.wikisource.org &amp; GRETIL · translations: Burgess 1860, Iyer 1884, Keith, Eggeling, Whitney, Oldenberg
  </footer>
</div>

const DB = {"items": [{"id": "ashvini", "cat": "nakshatra", "dev": "अश्विनी", "dev_short": "अश्विनी", "iast": "Aśvinī", "modern": {"common_name": "Sheratan", "bayer": "β Arietis", "constellation": "Aries"}, "conf": "certain", "see_also": [], "label": "अश्विनी", "kind": "star", "ra": 28.66, "dec": 20.81, "mag": 2.64, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16 (also 8.5, 8.9)", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the northern of the pair β and γ Arietis; &#x27;this is the star β Arietis (magn. 3.2), and not α Arietis (magn. 2), as assumed by Colebrooke&#x27;, shown by comparison of longitudes."}]}, {"id": "bharani", "cat": "nakshatra", "dev": "भरणी", "dev_short": "भरणी", "iast": "Bharaṇī", "modern": {"common_name": "35 Arietis (Musca Borealis)", "bayer": "35 Arietis", "constellation": "Aries"}, "conf": "disputed", "see_also": [], "label": "भरणी", "kind": "star", "ra": 40.86, "dec": 27.71, "mag": 4.66, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Group = 35, 39, 41 Arietis (obsolete Musca Borealis). Burgess: the &#x27;southern&#x27; designation is ambiguous; 41 Ari (brighter, nearer ecliptic) &#x27;would seem more likely&#x27;, but &#x27;the defined position, however, agrees better with 35&#x27;, which he adopts. Many modern lists prefer 41 Arietis."}]}, {"id": "krittika", "cat": "nakshatra", "dev": "कृत्तिका", "dev_short": "कृत्तिका", "iast": "Kṛttikā", "modern": {"common_name": "Alcyone (Pleiades)", "bayer": "η Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": ["krittika-seven"], "label": "कृत्तिका", "kind": "star", "ra": 56.87, "dec": 24.11, "mag": 2.87, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: if &#x27;southern&#x27; (v. 18) were strict it would be Atlas (27 Tau) or Merope (23 Tau), but &#x27;the defined position agrees best with Alcyone, nor can we hesitate to regard this as actually the junction-star&#x27;."}, {"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "कृत्तिका नक्षत्रम् अग्निर् देवताऽग्ने रुचः स्थ प्रजापतेर् धातुः सोमस्यर्चे त्वा रुचे त्वा द्युते त्वा भासे त्वा ज्योतिषे त्वा रोहिणी नक्षत्रम् प्रजापतिर् देवता मृगशीर्षं नक्षत्रꣳ सोमो देवताऽऽर्द्रा नक्षत्रꣳ रुद्रो देवता पुनर्वसू नक्षत्रम् अदितिर् देवता तिष्यो नक्षत्रम् बृहस्पतिर् देवताऽऽश्रेषा नक्षत्रꣳ सर्पा देवता मघा नक्षत्रम् पितरो देवता", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "(Thou art) Krttikas, the Naksatra, Agni, the deity; ye are the radiances of Agni, of Prajapati, of the creator, of Soma; to the Re thee, to radiance thee, to the shining thee, to the blaze thee, to the light thee. (Thou art) Rohini the Naksatra, Prajapati the deity; Mrgaçirsa the Naksatra, Soma the deity; Ardra the Naksatra, Rudra the deity; the two Punarvasus the Naksatra, Aditi the deity; Tisya the Naksatra, Brhaspati the deity; the Açresas the Naksatra, the serpents the deity; the Maghas the Naksatra, the fathers the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "Heads the oldest nakshatra list; deity Agni. Universally identified with the Pleiades. Eggeling and Whitney both gloss Krittikas = Pleiades. Also attested TB 1.5.1.1 (&#x27;agneḥ kṛttikāḥ&#x27;), TB 3.1.1.1, ŚB 2.1.2.1-5, AV 19.7.2."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.3", "shloka": "एता ह वै प्राच्यै दिशो न च्यवन्ते । सर्वाणि ह वा अन्यानि नक्षत्राणि प्राच्यै दिशश्च्यवन्ते तत्प्राच्यामेवास्यैतद्दिश्याहितौ भवतस्तस्मात्कृत्तिकास्वादधीत - २.१.२.३", "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "And again, they do not move away from the eastern quarter, whilst the other asterisms do move from the eastern quarter. Thus his (two fires) are established in the eastern quarter: for this reason he may set up his fires under the Krittikas.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The famous archaeoastronomical passage: the Krittikas &#x27;do not swerve from the eastern quarter&#x27;. The Pleiades rose due east (on the celestial equator) c. 3000-2500 BCE, which S.B. Dikshit (1895) used to date the ŚB; the dating argument (not the star identification) is disputed, since &#x27;not swerving from the east&#x27; may be an approximation. ŚB 2.1.2.2 also notes they are the most numerous asterism (other nakshatras have 1-4 stars)."}]}, {"id": "rohini", "cat": "nakshatra", "dev": "रोहिणी", "dev_short": "रोहिणी", "iast": "Rohiṇī", "modern": {"common_name": "Aldebaran", "bayer": "α Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": [], "label": "रोहिणी", "kind": "star", "ra": 68.98, "dec": 16.51, "mag": 0.85, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (also 8.13)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the Hyades group (ε, δ, γ, ν, α Tauri); α &#x27;the most easterly (v. 19) and the brightest of the group — being the brilliant star of the first magnitude known as Aldebaran — is the junction-star&#x27;. Verse 8.13 concerns splitting Rohiṇī&#x27;s wain (śakaṭa)."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.6", "shloka": "रोहिण्यामग्नी आदधीत । रोहिण्यां ह वै प्रजापतिः प्रजाकामोऽग्नी आदधे स प्रजा असृजत ता अस्य प्रजाः सृष्टा एकरूपा उपस्तब्धास्तस्थू रोहिण्य इवैव तद्वै रोहिण्यै रोहिणीत्वं बहुर्हैव प्रजया पशुभिर्भवति य एवं विद्वान्रोहिण्यामाधत्ते - २.१.२.६", "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "He may also set up his fires under (the asterism of) Rohini. For under Rohini it was that Pragapati, when desirous of progeny (or creatures), set up his fires. He created beings, and the creatures produced by him remained invariable and constant, like (red) cows (rohini): hence the cow-like nature of Rohini. Rich in cattle and offspring therefore he becomes whosoever, knowing this, sets up his fires under Rohini.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "&#x27;The red one&#x27;, deity Prajāpati; universally identified with the bright red star Aldebaran. Also TS 4.4.10.1, TB 1.5.1.1, TB 3.1.1.1-2 (&#x27;rohiṇī devy udagāt purastāt&#x27; - the goddess Rohini has risen in the east), AV 19.7.2, and AB 3.33 where the female deer (rohit) of the Prajāpati myth is Rohiṇī."}]}, {"id": "mrigashirsha", "cat": "nakshatra", "dev": "मृगशीर्ष", "dev_short": "मृगशीर्ष", "iast": "Mṛgaśīrṣa", "modern": {"common_name": "Meissa", "bayer": "λ Orionis", "constellation": "Orion"}, "conf": "certain", "see_also": ["invaka", "mriga"], "label": "मृगशीर्ष", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the faint cluster in Orion&#x27;s head, λ φ¹ φ² Orionis; the northern (v. 16), λ Orionis, is the junction-star, &#x27;although the Hindu measurement... is far from accurate, especially as regards its latitude&#x27;."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.8-9", "shloka": "मृगशीर्षेऽग्नी आदधीत । एतद्वै प्रजापतेः शिरो यन्मृगशीर्षं श्रीर्वै शिरः श्रीर्हि वै शिरस्तस्माद्योऽर्धस्य श्रेष्ठो भवत्यसावमुष्यार्धस्य शिर इत्याहुः श्रियं ह गच्छति य एवं विद्वान्मृगशीर्ष आधत्ते - २.१.२.८ अथ यस्मान्ना मृगशीर्ष आदधीत । प्रजापतेर्वा एतच्छरीरं यत्र वा एनं तदावेध्यंस्तदिषुणा त्रिकाण्डेनेत्याहुः स एतच्छरीरमजहाद्वास्तु वै शरीरमयज्ञियं निर्वीर्यं तस्मान्न मृगशीर्ष आदधीत - २.१.२.९", "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "He may also set up his fires under (the asterism of) Mrigasirsha. For Mrigasirsha, indeed, is the head of Pragapati; and the head (siras) means excellence (sri)... On the other hand (it is argued) why one should not set up his fire under Mrigasirsha. The latter, indeed, is Pragapati&#x27;s body. Now, when they (the gods) on that occasion pierced him with what is called &#x27;the three-knotted arrow,&#x27; he abandoned that body, for the body is a mere relic (or dwelling, vastu), unholy and sapless. He should therefore not set up his fires under Mrigasirsha.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "&#x27;The deer&#x27;s head&#x27; = the compact triangle of faint stars forming Orion&#x27;s head, chief star λ Orionis. The ŚB explicitly makes it &#x27;the head of Prajapati&#x27;, whose body (Orion) was pierced by the three-jointed arrow (Orion&#x27;s belt) - see ŚB 2.1.2.9 and AB 3.33. Also TS 4.4.10.1 (deity Soma), AV 19.7.2 (mṛgaśiraḥ), TB 1.5.1.1 (called Invakā)."}]}, {"id": "ardra", "cat": "nakshatra", "dev": "आर्द्रा", "dev_short": "आर्द्रा", "iast": "Ārdrā", "modern": {"common_name": "Betelgeuse", "bayer": "α Orionis", "constellation": "Orion"}, "conf": "disputed", "see_also": ["bahu"], "label": "आर्द्रा", "kind": "star", "ra": 88.79, "dec": 7.41, "mag": 0.45, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.2, 8.6)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8; single-star asterism covered by the position sequence (8.2, 8.6) and the sthūla rule (8.19). Burgess: &#x27;impossible not to regard... α Orionis as the one here meant&#x27;, despite &#x27;very grave errors in the definition of its position&#x27;; the only star nearly matching the stated position is 135 Tauri (6th mag)."}, {"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "मृगशीर्षं नक्षत्रꣳ सोमो देवताऽऽर्द्रा नक्षत्रꣳ रुद्रो देवता", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Mrgaçirsa the Naksatra, Soma the deity; Ardra the Naksatra, Rudra the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "&#x27;The moist one&#x27;, deity Rudra. Standard identification is Betelgeuse (the bright reddish star adjoining Mṛgaśīrṣa in the ecliptic sequence); a minority of older scholars (e.g. Weber) proposed Sirius because of the Rudra connection. The Taittirīya Brāhmaṇa (1.5.1.1) substitutes the dual name Bāhū &#x27;the two Arms (of Rudra)&#x27;. Also AV 19.7.2, TB 3.1.1.3 (&#x27;ārdrayā rudraḥ prathamānaḥ eti&#x27;)."}]}, {"id": "punarvasu", "cat": "nakshatra", "dev": "पुनर्वसु", "dev_short": "पुनर्वसु", "iast": "Punarvasu", "modern": {"common_name": "Pollux", "bayer": "β Geminorum", "constellation": "Gemini"}, "conf": "certain", "see_also": [], "label": "पुनर्वसु", "kind": "star", "ra": 116.33, "dec": 28.03, "mag": 1.14, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;the two bright stars in the heads of the Twins, or α and β Geminorum, and the latter (1.2) is the junction-star&#x27; (the eastern, per v. 19)."}]}, {"id": "pushya", "cat": "nakshatra", "dev": "पुष्य", "dev_short": "पुष्य", "iast": "Puṣya", "modern": {"common_name": "Asellus Australis", "bayer": "δ Cancri", "constellation": "Cancer"}, "conf": "likely", "see_also": ["tishya"], "label": "पुष्य", "kind": "star", "ra": 131.17, "dec": 18.15, "mag": 3.94, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the middle of three (with γ and θ Cancri) is the junction-star, &#x27;shown by the position assigned to it to be δ Cancri (4)&#x27;; hypothetically, under the arrow figure alone, θ Cancri could be meant."}, {"text": "Vedic corpus", "citation": "Atharvaveda (Śaunaka) 19.7 (nakṣatra hymn, esp. v. 2)", "shloka": "चित्राणि साकं दिवि रोचनानि सरीसृपाणि भुवने जवानि । तुर्मिशं सुमतिमिच्छमानो अहानि गीर्भिः सपर्यामि नाकम् ॥१॥ सुहवमग्ने कृत्तिका रोहिणी चास्तु भद्रं मृगशिरः शमार्द्रा । पुनर्वसू सूनृता चारु पुष्यो भानुराश्लेषा अयनं मघा मे ॥२॥ पुण्यं पूर्वा फल्गुन्यौ चात्र हस्तश्चित्रा शिवा स्वाति सुखो मे अस्तु । राधे विशाखे सुहवानुराधा ज्येष्ठा सुनक्षत्रमरिष्ट मूलम् ॥३॥ अन्नं पूर्वा रासतां मे अषाढा ऊर्जं देव्युत्तरा आ वहन्तु । अभिजिन् मे रासतां पुण्यमेव श्रवणः श्रविष्ठाः कुर्वतां सुपुष्टिम् ॥४॥ आ मे महच्छतभिषग्वरीय आ मे द्वया प्रोष्ठपदा सुशर्म । आ रेवती चाश्वयुजौ भगं म आ मे रयिं भरण्य आ वहन्तु ॥५॥", "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_१९/सूक्तम्_००७"], "translation": "1. Seeking favor of the twenty-eight-fold (?) wondrous ones, shining in the sky together, ever-moving, hasting in the creation (bhuvana), I worship (sapary) with songs the days, the firmament (naka). 2. Easy of invocation for me [be] the Krittikas and Rohini; be Mriga-çiras excellent, [and] Ardra healthful (çam); be the two Punarvasus pleasantness, Pushya what is agreeable, the Açleshas light (bhanu), the Maghas progress (ayana) [for me]. ... 5. Let Çatabhishaj [bring] to me what is great widely; let the double Proshthapadas [bring] to me good protection (suçarman); let Revati and the two Açvayuj [bring] fortune to me; let the Bharanis bring to me wealth.", "translator": "W.D. Whitney, Atharva-Veda Samhita, HOS 8 (1905), p. 907", "trans_links": ["https://archive.org/details/atharvavedasamhi02whituoft", "https://archive.org/download/atharvavedasamhi02whituoft/atharvavedasamhi02whituoft_djvu.txt"], "notes": "AV nakshatra hymn, verse 2; the AV series begins with the Krittikas (Pleiades) like the TS but comprises 28 asterisms including Abhijit (Vega). Whitney emends the corrupt turmiśaṁ of AV 19.7.1 to aṣṭāviṅśáṁ &#x27;twenty-eight-fold&#x27;."}]}, {"id": "ashlesha", "cat": "nakshatra", "dev": "आश्लेषा", "dev_short": "आश्लेषा", "iast": "Āśleṣā", "modern": {"common_name": "Ashlesha", "bayer": "ε Hydrae", "constellation": "Hydra"}, "conf": "disputed", "see_also": [], "label": "आश्लेषा", "kind": "star", "ra": 130.8, "dec": 6.42, "mag": 3.38, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Colebrooke pointed to α Cancri; Burgess rejects this (&#x27;α Cancri is not the eastern member of any group of five stars&#x27;) and places the asterism in the circular group in Hydra&#x27;s head, &#x27;and ε Hydrae, its brightest star... is the junction-star&#x27;, while conceding the latitude error is &#x27;very considerable&#x27;."}]}, {"id": "magha", "cat": "nakshatra", "dev": "मघा", "dev_short": "मघा", "iast": "Maghā", "modern": {"common_name": "Regulus", "bayer": "α Leonis", "constellation": "Leo"}, "conf": "certain", "see_also": [], "label": "मघा", "kind": "star", "ra": 152.09, "dec": 11.97, "mag": 1.36, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: of the Sickle group, &#x27;the star α Leonis, or Regulus, the most brilliant of the group, is the junction-star, and its position is defined with unusual precision&#x27;."}]}, {"id": "purva-phalguni", "cat": "nakshatra", "dev": "पूर्वफल्गुनी", "dev_short": "पूर्वफल्गुनी", "iast": "Pūrva-Phalgunī", "modern": {"common_name": "Zosma", "bayer": "δ Leonis", "constellation": "Leo"}, "conf": "likely", "see_also": [], "label": "पूर्वफल्गुनी", "kind": "star", "ra": 168.53, "dec": 20.52, "mag": 2.56, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: of the pair δ and θ Leonis, &#x27;the first group is, then, clearly identifiable as δ and θ Leonis, the former and brighter being the distinctive star&#x27;; he notes the Siddhānta-Śiromaṇi and Graha-Lāghava data may instead point to θ Leonis (the southern)."}]}, {"id": "uttara-phalguni", "cat": "nakshatra", "dev": "उत्तरफल्गुनी", "dev_short": "उत्तरफल्गुनी", "iast": "Uttara-Phalgunī", "modern": {"common_name": "Denebola", "bayer": "β Leonis", "constellation": "Leo"}, "conf": "certain", "see_also": [], "label": "उत्तरफल्गुनी", "kind": "star", "ra": 177.26, "dec": 14.57, "mag": 2.11, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;In the latter group, the junction-star is evidently β Leonis&#x27;; the text&#x27;s calling it &#x27;northern&#x27; he regards &#x27;as simply an error&#x27; of the describers."}]}, {"id": "hasta", "cat": "nakshatra", "dev": "हस्त", "dev_short": "हस्त", "iast": "Hasta", "modern": {"common_name": "Gienah", "bayer": "γ Corvi", "constellation": "Corvus"}, "conf": "disputed", "see_also": [], "label": "हस्त", "kind": "star", "ra": 183.95, "dec": -17.54, "mag": 2.59, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.17", "shloka": "पश्चिमोत्तरताराया द्वितीया पश्चिमे स्थिता / हस्तस्य योगतारा सा श्रविष्ठायाश् च पश्चिमा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "17. That which is the western northern star, being the second situated westward, that is the junction-star of Hasta; of Çravishtha it is the western:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Five stars of Corvus. Burgess: v. 17&#x27;s special description is &#x27;quite hard to understand and apply: we regard it as most probable... that γ (3) is the star intended: the defined position... would point rather to δ (3)&#x27;. Colebrooke gave &#x27;γ or δ Corvi&#x27;."}]}, {"id": "chitra", "cat": "nakshatra", "dev": "चित्रा", "dev_short": "चित्रा", "iast": "Citrā", "modern": {"common_name": "Spica", "bayer": "α Virginis", "constellation": "Virgo"}, "conf": "certain", "see_also": [], "label": "चित्रा", "kind": "star", "ra": 201.3, "dec": -11.16, "mag": 0.98, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (named in 8.21)", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;This is the beautiful star of the first magnitude α Virginis, or Spica, constituting an asterism by itself.&#x27; Named again in 8.21 as the reference star for Apāṃvatsa."}]}, {"id": "svati", "cat": "nakshatra", "dev": "स्वाती", "dev_short": "स्वाती", "iast": "Svātī", "modern": {"common_name": "Arcturus", "bayer": "α Boötis", "constellation": "Boötes"}, "conf": "certain", "see_also": [], "label": "स्वाती", "kind": "star", "ra": 213.92, "dec": 19.18, "mag": -0.05, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.2, 8.7)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8 (single-star asterism; sthūla rule 8.19; positions 8.2/8.7). Burgess: &#x27;The star intended is plainly α Bootis, or Arcturus&#x27;."}]}, {"id": "vishakha", "cat": "nakshatra", "dev": "विशाखा", "dev_short": "विशाखा", "iast": "Viśākhā", "modern": {"common_name": "ι Librae", "bayer": "ι Librae", "constellation": "Libra"}, "conf": "disputed", "see_also": [], "label": "विशाखा", "kind": "star", "ra": 222.72, "dec": -19.79, "mag": 4.54, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;the identification of Viçakha [is] in some respects more doubtful than that of any other asterism in the series&#x27;; the defined position identifies the junction-star with faint ι Librae, though he believes the asterism &#x27;was originally composed of the two stars α and β Librae&#x27;. Colebrooke suggested o or χ Librae; modern lists often use α Librae (Zubenelgenubi)."}]}, {"id": "anuradha", "cat": "nakshatra", "dev": "अनुराधा", "dev_short": "अनुराधा", "iast": "Anurādhā", "modern": {"common_name": "Dschubba", "bayer": "δ Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": [], "label": "अनुराधा", "kind": "star", "ra": 240.08, "dec": -22.62, "mag": 2.29, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the row β, δ, π Scorpionis, &#x27;δ (2.3) being the junction-star&#x27; (the middle, per v. 18)."}]}, {"id": "jyeshtha", "cat": "nakshatra", "dev": "ज्येष्ठा", "dev_short": "ज्येष्ठा", "iast": "Jyeṣṭhā", "modern": {"common_name": "Antares", "bayer": "α Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": ["rohini-indra"], "label": "ज्येष्ठा", "kind": "star", "ra": 247.35, "dec": -26.43, "mag": 1.06, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the central of three (with σ and τ Scorpionis) is &#x27;the brilliant star of the first magnitude α Scorpionis, or Antares&#x27;."}]}, {"id": "mula", "cat": "nakshatra", "dev": "मूल", "dev_short": "मूल", "iast": "Mūla", "modern": {"common_name": "Shaula", "bayer": "λ Scorpii", "constellation": "Scorpius"}, "conf": "likely", "see_also": [], "label": "मूल", "kind": "star", "ra": 263.4, "dec": -37.1, "mag": 1.62, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Stars of the Scorpion&#x27;s tail. Burgess: &#x27;if, as seems probable, λ is the star pointed out by the definition of position&#x27;, the &#x27;eastern&#x27; designation is strictly true only of the pair λ and ν (the Vedic vicṛtāu); ι, κ, and θ lie farther east."}]}, {"id": "purva-ashadha", "cat": "nakshatra", "dev": "पूर्वाषाढा", "dev_short": "पूर्वाषाढा", "iast": "Pūrvāṣāḍhā", "modern": {"common_name": "Kaus Media", "bayer": "δ Sagittarii", "constellation": "Sagittarius"}, "conf": "certain", "see_also": [], "label": "पूर्वाषाढा", "kind": "star", "ra": 275.25, "dec": -29.83, "mag": 2.7, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16 (also 8.4)", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The former group must comprise δ (3.4) and ε (3.2) Sagittarii, the former being the junction-star; this is shown by the... comparison of positions&#x27;. Called āpya (of the Waters) in 8.4."}]}, {"id": "uttara-ashadha", "cat": "nakshatra", "dev": "उत्तराषाढा", "dev_short": "उत्तराषाढा", "iast": "Uttarāṣāḍhā", "modern": {"common_name": "Nunki", "bayer": "σ Sagittarii", "constellation": "Sagittarius"}, "conf": "likely", "see_also": [], "label": "उत्तराषाढा", "kind": "star", "ra": 283.82, "dec": -26.3, "mag": 2.05, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16 (also 8.4)", "shloka": "मनवो +अथ रसा वेदा वैश्वम् आप्यार्धभोगगम् / आप्यस्यैवाभिजित् प्रान्ते वैश्वान्ते श्रवणस्थितिः /", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "4. Fourteen, six, four: Uttara-Ashadha (vaiçva) is at the middle of the portion (bhoga) of Purva-Ashadha (apya); Abhijit, likewise, is at the end of Purva-Ashadha; the position of Çravana is at the end of Uttara-Ashadha;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;its northern and junction-star can be no other than σ (2.3)... notwithstanding the error in the Hindu determination of its latitude, which led Colebrooke to regard τ (4.3) as the star intended&#x27;. Called vaiśva (of the Viśve Devāḥ) in 8.4."}]}, {"id": "abhijit", "cat": "nakshatra", "dev": "अभिजित्", "dev_short": "अभिजित्", "iast": "Abhijit", "modern": {"common_name": "Vega", "bayer": "α Lyrae", "constellation": "Lyra"}, "conf": "certain", "see_also": [], "label": "अभिजित्", "kind": "star", "ra": 279.23, "dec": 38.78, "mag": 0.03, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.4", "shloka": "मनवो +अथ रसा वेदा वैश्वम् आप्यार्धभोगगम् / आप्यस्यैवाभिजित् प्रान्ते वैश्वान्ते श्रवणस्थितिः /", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "4. Fourteen, six, four: Uttara-Ashadha (vaiçva) is at the middle of the portion (bhoga) of Purva-Ashadha (apya); Abhijit, likewise, is at the end of Purva-Ashadha; the position of Çravana is at the end of Uttara-Ashadha;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The position assigned to its junction-star, which is described as the brightest... in a group of three, identifies it with α Lyrae or Vega, a star which is exceeded in brilliancy by only one or two others in the heavens&#x27; (triangle with ε and ζ Lyrae)."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra vv.1-6 with Vāsanābhāṣya; Vāsanābhāṣya on v.16", "shloka": "यस्य स्फुटा क्रान्तिरुदक् च यत्र लम्बाधिका तत्र सदोदितं तत् । न दृश्यते तत् खलु यस्य याम्या भं लुब्धकः कुम्भभवो ग्रहो वा ।।१६।। — with Bhāskara&#x27;s own bhāṣya: &#x27;यत्र द्विपश्चाशदधिकाः पलांशास्तत्राभिजित् सदोदितमेव&#x27; [verbatim from unproofread OCR; द्विपञ्चाशद् expected]", "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/351"], "translation": "[own rendering, no PD translation exists] (v.16) A star whose true declination is north and exceeds the co-latitude is ever-visible there; one whose declination is south (by that amount) is never seen — be it Lubdhaka, the pot-born (Agastya), or even a planet. (Bhāṣya) Where the degrees of latitude exceed 52, Abhijit is ever-risen (circumpolar).", "translator": "Own literal rendering (clearly marked), checked against Arkasomayaji&#x27;s paraphrase (&#x27;where the latitude is greater than 52°, there Abhijit is always above the horizon&#x27;).", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Included by Bhāskara among the 28 asterisms whose dhruvas he lists (Vāsanābhāṣya on vv.1-3: &#x27;अष्टौ नखा इत्यादयोऽश्विन्यादीनां साभिजितां ध्रुवभागा वेदितव्याः&#x27; — the dhruvas of Aśvinī etc. together with Abhijit). Its śara is 62° north (largest in the list, per the Bhagrahayuti latitude table), matching Vega&#x27;s ecliptic latitude of about +61.7°. Bhāskara&#x27;s Vāsanābhāṣya on v.16 makes it circumpolar above latitude 52°. The 1861 PD volume identifies &#x27;Abhijit (α Lyrae)&#x27; (pp.63, 68)."}]}, {"id": "shravana", "cat": "nakshatra", "dev": "श्रवण", "dev_short": "श्रवण", "iast": "Śravaṇa", "modern": {"common_name": "Altair", "bayer": "α Aquilae", "constellation": "Aquila"}, "conf": "certain", "see_also": [], "label": "श्रवण", "kind": "star", "ra": 297.7, "dec": 8.87, "mag": 0.76, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18 (also 8.4)", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: three stars &#x27;in the back and neck of the Eagle, namely α, γ, and β Aquilae; α, the determinative [middle star, v. 18], is a star of the first to second magnitude&#x27;."}]}, {"id": "dhanishtha", "cat": "nakshatra", "dev": "श्रविष्ठा", "dev_short": "श्रविष्ठा", "iast": "Śraviṣṭhā (Dhaniṣṭhā)", "modern": {"common_name": "Rotanev", "bayer": "β Delphini", "constellation": "Delphinus"}, "conf": "certain", "see_also": [], "label": "श्रविष्ठा", "kind": "star", "ra": 309.4, "dec": 14.6, "mag": 3.63, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.17 (also 8.5)", "shloka": "त्रिचतुः पादयोः सन्धौ श्रविष्ठा श्रवणस्य तु / स्वभोगतो वियन् नागाः षट्कृतिर् यमलाश्विनः //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "5. Çravishtha, on the other hand, is at the point of connection of the third and fourth quarters (pada) of Çravana: then, in their own portions, eighty, thirty-six, twenty-two,", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the diamond in the Dolphin&#x27;s head, β α γ δ Delphini; &#x27;The junction-star, which is the western (v. 17), is β&#x27;."}]}, {"id": "shatabhishaj", "cat": "nakshatra", "dev": "शतभिषज्", "dev_short": "शतभिषज्", "iast": "Śatabhiṣaj", "modern": {"common_name": "Hydor", "bayer": "λ Aquarii", "constellation": "Aquarius"}, "conf": "likely", "see_also": [], "label": "शतभिषज्", "kind": "star", "ra": 343.15, "dec": -7.58, "mag": 3.74, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.3, 8.9)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8; its junction-star is the brightest of its hundred (sthūla rule, 8.19). Burgess: &#x27;This, from its defined position, can only be λ Aquarii (4)&#x27;. Some later scholars have proposed other Aquarii stars; al-Bīrūnī could not identify it."}]}, {"id": "purva-bhadrapada", "cat": "nakshatra", "dev": "पूर्वभाद्रपदा", "dev_short": "पूर्वभाद्रपदा", "iast": "Pūrva-Bhādrapadā", "modern": {"common_name": "Markab", "bayer": "α Pegasi", "constellation": "Pegasus"}, "conf": "certain", "see_also": [], "label": "पूर्वभाद्रपदा", "kind": "star", "ra": 346.19, "dec": 15.21, "mag": 2.49, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Part of the Square of Pegasus. Burgess: &#x27;The junction-star of the former half-asterism is, by its defined position, clearly shown to be α Pegasi&#x27;, though the &#x27;northern&#x27; designation of v. 16 conflicts (α is the southern of the pair with β)."}]}, {"id": "uttara-bhadrapada", "cat": "nakshatra", "dev": "उत्तरभाद्रपदा", "dev_short": "उत्तरभाद्रपदा", "iast": "Uttara-Bhādrapadā", "modern": {"common_name": "Algenib / Alpheratz", "bayer": "γ Pegasi / α Andromedae", "constellation": "Pegasus / Andromeda"}, "conf": "disputed", "see_also": [], "label": "उत्तरभाद्रपदा", "kind": "star", "ra": 3.31, "dec": 15.18, "mag": 2.83, "plotnote": "Disputed: the text mixes γ Pegasi (Algenib, plotted here) with α Andromedae; see notes.", "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the text&#x27;s position gives &#x27;a longitude... of one member of the group [γ Pegasi], and a latitude which is that of the other [α Andromedae]&#x27;; &#x27;There can be no doubt that the two stars recognized as composing the asterism are γ Pegasi and α Andromedae, but there has evidently been a blundering confusion of the two&#x27;. Modern lists usually take γ Pegasi."}]}, {"id": "revati", "cat": "nakshatra", "dev": "रेवती", "dev_short": "रेवती", "iast": "Revatī", "modern": {"common_name": "Revati", "bayer": "ζ Piscium", "constellation": "Pisces"}, "conf": "likely", "see_also": [], "label": "रेवती", "kind": "star", "ra": 18.44, "dec": 7.57, "mag": 5.21, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star intended is... the faint star ζ Piscium, of about the fifth magnitude, situated in the band which connects the two Fishes&#x27;; nearly all authorities make it mark the initial point of the sidereal sphere. It &#x27;coincided in longitude with the vernal equinox in the year 572 of our era&#x27;."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra, Vāsanābhāṣya (upapatti) on vv.4-6", "shloka": "…रात्रौ गोलमध्यगचिहुगतया दृष्ट्या रेवतो.तारां विलोक्य क्रान्तिवृत्ते यो मीनान्तस्तं रेवतीतारायां निवेश्य मध्यगतयैव दृष्टच्याश्चिन्यादेर्नक्षत्रस्य योगतारां विलोक्य तस्योपरिवेधवलयं निवेश्यम् । [prose bhāṣya, verbatim from unproofread OCR with visible OCR slips]", "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[own rendering, no PD translation exists] At night, sighting through the mark at the centre of the sphere, one observes the star of Revatī and places upon it the end of Pisces on the ecliptic ring; then, sighting the yogatārā of Aśvinī and the other nakshatras, the sighting-ring is laid over each; the degrees from the end of Pisces to the intersection give that asterism&#x27;s dhruva, and the degrees between the intersection and the yogatārā give its śara, north or south.", "translator": "Own literal rendering (clearly marked) of Bhāskara&#x27;s Vāsanābhāṣya.", "trans_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "notes": "In the upapatti to Bhagrahayuti vv.4-6 Bhāskara himself describes the observational procedure: at night one sights the Revatī star through the armillary sphere and sets the end of Pisces (Mīnānta, i.e. longitude 360°) on it, then reads off each yogatārā&#x27;s dhruva and śara on the sighting-ring. Bhāskara assigns Revatī dhruva 0 and śara 0. The traditional identification ζ Piscium is printed in the 1861 PD volume (&#x27;Revati (ζ Piscium)&#x27;, p.63); some modern scholars debate whether the faint ζ Psc can be the intended zero star, hence &#x27;likely&#x27; rather than &#x27;certain&#x27;."}]}, {"id": "agastya", "cat": "individual-star", "dev": "अगस्त्य", "dev_short": "अगस्त्य", "iast": "Agastya", "modern": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "conf": "certain", "see_also": [], "label": "अगस्त्य", "kind": "star", "ra": 95.99, "dec": -52.7, "mag": -0.74, "plotnote": "Deep-south star; lies low on the horizon from India — the theme of Bṛhat Saṃhitā ch. 12.", "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.10", "shloka": "अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "10. Agastya is at the end of Gemini, and eighty degrees south; and Mrgavyadha is situated in the twentieth degree of Gemini;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Agastya is α Navis, or Canopus, a star of the first magnitude, and one of the most brilliant in the southern heavens&#x27; (his &#x27;α Argūs/α Navis&#x27; = modern α Carinae); identification &#x27;correctly pointed out by Colebrooke&#x27;."}, {"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 12.7 (chapter title: अगस्त्यचाराध्यायः)", "shloka": "उदये च मुनेरगस्त्यनाम्नः कुसमायोगमलप्रदूषितानि ।\nहृदयानि सतां इव स्वभावात्पुनरम्बूनि भवन्ति निर्मलानि ।। १२.०७ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१२"], "translation": "When star Canopus reappears after its conjunction with the Sun, waters muddled by their contact with the earth will resume their original clearness just in the same way as the minds of the Sadhus naturally recover their original purity after contact with the wicked.", "translator": "N. Chidambaram Iyer (1884), ch. XII v. 7, p. 77", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Agastya = Canopus is universally accepted (Colebrooke, As. Res. IX; Burgess&#x27;s Sūrya-siddhānta notes p. 245: &#x27;Agastya is α Navis, or Canopus&#x27;). Bṛhat Saṃhitā ch. 12 (Agastyacārādhyāya) is devoted to its heliacal rising; Agastya is named in BS 12.7, 12.11, 12.12, 12.13, 12.19; BS 12.14 fixes its heliacal rising at Ujjayinī, and 12.21 its rising/setting against Hastā/Rohiṇī. Iyer translates the name throughout as &#x27;Canopus&#x27;."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra v.7 (also vv.8, 12, 16)", "shloka": "अगस्त्यध्रुवः सप्तनागास्तु भागास्तुरखाद्यस्तस्य यम्यः शरांशः । षडष्टौ लवा लुब्धकस्य ध्रुवोऽयं नभोऽम्भोधिभागाः शरस्तस्य याम्यः ॥७॥ [verbatim from unproofread OCR; expected readings याम्यः for यम्यः, तुरगाद्रयस् for तुरखाद्यस्]", "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[paraphrase] The polar longitude (dhruva) of Agastya is 87 degrees and its polar latitude (śara) 77 degrees south; the polar longitude of Lubdhaka is 86 degrees and its polar latitude 40 degrees south.", "translator": "Paraphrased from D. Arkasomayaji, Siddhānta Śiromaṇi Gaṇitādhyāya (Kendriya Sanskrit Vidyapeetha, Tirupati; copyrighted, not quoted verbatim). No public-domain English translation of the Gaṇitādhyāya exists online.", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Universal identification in the Siddhanta tradition. Bhāskara gives polar longitude 87° (sapta-nāga), polar latitude 77° south (turaga-adri); his Vāsanābhāṣya on v.16 adds that Agastya is invisible where the terrestrial latitude exceeds 37° (&#x27;यस्मिन् देशे सप्तत्रिशदधिकाः पलांशास्तत्रागस्त्यो न दृश्यते&#x27;). Verse 12 calls it &#x27;muni&#x27; (the sage). The 1861 public-domain volume (Sūrya Siddhānta portion, same tradition) prints &#x27;Agastya (Canopus)&#x27; explicitly (p.63, 68). D. Arkasomayaji&#x27;s translation of this very verse also glosses &#x27;Agastya (Canopus)&#x27;."}]}, {"id": "mrigavyadha", "cat": "individual-star", "dev": "मृगव्याध", "dev_short": "मृगव्याध", "iast": "Mṛgavyādha", "modern": {"common_name": "Sirius", "bayer": "α Canis Majoris", "constellation": "Canis Major"}, "conf": "likely", "see_also": ["lubdhaka"], "label": "मृगव्याध", "kind": "star", "ra": 101.29, "dec": -16.72, "mag": -1.46, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.10–11", "shloka": "अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः // विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "10. Agastya is at the end of Gemini, and eighty degrees south; and Mrgavyadha is situated in the twentieth degree of Gemini; 11. His latitude (vikshepa), reckoned from his point of declination (apakrama), is forty degrees south:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Mrgavyadha, &quot;deer-hunter&quot; — it is also called Lubdhaka, &quot;hunter&quot; — is α Canis Majoris, or Sirius, the brightest of the fixed stars&#x27;."}, {"text": "Vedic corpus", "citation": "Aitareya Brāhmaṇa 3.33", "shloka": "तमभ्यायत्याविध्यत्स विद्ध ऊर्ध्व उदप्रपतत्तमेतं मृग इत्याचक्षते य उ एव मृगव्याधः स उ एव स या रोहित्सा रोहिणी यो एवेषुस्त्रिकाण्डा सो एवेषुस्त्रिकाण्डा।", "shloka_links": ["https://sa.wikisource.org/wiki/ऐतरेय_ब्राह्मणम्/पञ्चिका_३_(तृतीय_पञ्चिका"], "translation": "Having aimed at him he pierced him; being pierced he flew upwards; him they call &#x27;the deer&#x27;. The piercer of the deer is he of that name. The female deer is Rohini; the three-pointed arrow is the three-pointed arrow.", "translator": "A.B. Keith, Rigveda Brahmanas, HOS 25 (1920), pp. 185-186", "trans_links": ["https://archive.org/details/rigvedabrahmana00keitgoog", "https://archive.org/download/rigvedabrahmana00keitgoog/rigvedabrahmana00keitgoog_djvu.txt"], "notes": "The piercer is the dread archer-god (Rudra/Bhūtapati). Identification with Sirius - the brilliant star &#x27;aiming&#x27; along the line of Orion&#x27;s belt - is the standard scholarly and later Indian tradition (Sirius = Lubdhaka &#x27;the hunter&#x27; in classical astronomy); the AB itself does not name the star, hence &#x27;likely&#x27;."}]}, {"id": "lubdhaka", "cat": "individual-star", "dev": "लुब्धक", "dev_short": "लुब्धक", "iast": "Lubdhaka", "modern": {"common_name": "Sirius", "bayer": "α Canis Majoris", "constellation": "Canis Major"}, "conf": "certain", "see_also": ["mrigavyadha"], "label": "लुब्धक", "kind": "star", "ra": 101.29, "dec": -16.72, "mag": -1.46, "plotnote": "Same star as Mṛgavyādha (Sirius): the classical &#x27;hunter&#x27; synonym.", "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Not in Bṛhat Saṃhitā; Kathāsaritsāgara 6.2.88 (lubdhaka); Sūrya-siddhānta 8.10 (as Mṛgavyādha)", "shloka": "Bṛhat Saṃhitā: shloka not found online (word absent from the text). Kathāsaritsāgara 6.2.88: दत्त्वायुषोऽर्धं मुनिना न भार्या रुरुणा कृता ।\nत्रिशङ्कुः किं न नीतो द्यां विश्वामित्रेण लुब्धकः ।। ८८", "shloka_links": ["https://sa.wikisource.org/wiki/कथासरित्सागरः/लम्बकः_६/तरङ्गः_२"], "translation": "Was not the Chandala Trisanku carried to heaven by Visvamitra?", "translator": "C. H. Tawney (1880), Katha Sarit Sagara vol. 1, ch. XXVIII, p. 251; Sūrya-siddhānta rendering: E. Burgess (1860)", "trans_links": ["https://archive.org/details/kathsaritsga01somauoft"], "notes": "Lubdhaka (&#x27;the Hunter&#x27;) = Sirius is standard in Sanskrit lexica (Monier-Williams, s.v. lubdhaka: &#x27;the star Sirius&#x27;, citing the Gaṇitādhyāya and Kathāsaritsāgara) — but the word does NOT occur in the Bṛhat Saṃhitā: a search of the complete GRETIL e-text (Yano–Sugita, Tripathi ed.) finds no lubdhaka and no mṛgavyādha as a star. Classical attestations verified online: (1) Sūrya-siddhānta 8.10 locates the star under its synonym Mṛgavyādha (&#x27;deer-hunter&#x27;): अशीतिभागैर् याम्यायाम् अगस्त्यो मिथुनान्तगः / विम्शे च मिथुनस्याम्शे मृगव्याधो व्यवस्थितः (https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः); Burgess: &#x27;Mrgavyadha, deer-hunter — it is also called Lubdhaka, hunter — is α Canis Majoris, or Sirius, the brightest of the fixed stars&#x27; (pp. 245–246). (2) Kathāsaritsāgara 6.2.88 (= taraṅga 28.88) is MW&#x27;s literary citation for lubdhaka = Sirius (Triśaṅku raised to the sky), but Tawney (1880, vol. 1 p. 251) translates &#x27;Was not the Chandala Trisanku carried to heaven by Visvamitra?&#x27;, taking lubdhaka as &#x27;outcaste hunter&#x27; — so the star sense in KSS is a lexicographers&#x27; reading, not undisputed. No Kālidāsa attestation of Lubdhaka as Sirius was found online."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra vv.7-8 (also vv.12, 16)", "shloka": "अगस्त्यस्य नाडीद्वयं प्रोक्तमिष्टं सषड्भागनाडीद्वयं लुब्धकस्य । त्रिभागाधिकं स्थूलभानामणूना ततश्वाधिकं तारतम्येन कल्प्यम् ॥८॥ [verbatim from unproofread OCR]", "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/349"], "translation": "[paraphrase] The iṣṭa-nāḍīs (arc of visibility for heliacal rising) are two nāḍīs for Agastya, two nāḍīs and a sixth for Lubdhaka, a third more for the large stars, and progressively more for the fainter ones.", "translator": "Paraphrased from D. Arkasomayaji (copyrighted); Bhāskara&#x27;s own Vāsanābhāṣya glosses: Agastya 12 kālāṃśas, Lubdhaka 13, gross stars 14, faint ones 15-16.", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Bhāskara&#x27;s mūla uses &#x27;Lubdhaka&#x27; (the Hunter) in vv.7-8 and &#x27;mṛgaripu&#x27; (enemy of the deer) in v.12 (&#x27;भाना मुनेर्मृगरिपोरुदयास्तलग्ने&#x27;); the name Mṛgavyādha for the same star appears on the same page only in Nṛsiṃha Daivajña&#x27;s Vārttika quoting Sūrya Siddhānta 9.12 (&#x27;स्वात्यगस्त्यमृगव्याधचित्राज्येष्ठाः पुनर्वसुः&#x27;, sa.wikisource page 347). Values: polar longitude 86° (ṣaḍ-aṣṭau), polar latitude 40° south (nabho&#x27;mbhodhi). Iṣṭanāḍīs 2 1/6 nāḍī = 13 kālāṃśas per the Vāsanābhāṣya (&#x27;तत्र त्रयोदशा १३ कालांशाः&#x27;). 1861 PD volume: &#x27;Mrigavyādha (Sirius)&#x27; (p.63)."}]}, {"id": "agni", "cat": "individual-star", "dev": "अग्नि (हुतभुज्)", "dev_short": "अग्नि", "iast": "Agni (Hutabhuj)", "modern": {"common_name": "Elnath", "bayer": "β Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": [], "label": "अग्नि", "kind": "star", "ra": 81.57, "dec": 28.61, "mag": 1.65, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.11–12", "shloka": "विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ // अष्टाभिस् त्रिम्शता चैव विक्षिप्ताव् उत्तरेण तौ / गोलम् लब्ध्वा परीक्षेत विक्षेपम् ध्रुवकम् स्फुटम् //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "11. ... Agni (hutabhuj) and Brahmahrdaya are in Taurus, the twenty-second degree; 12. And they are removed in latitude (vikshipta), northward, eight and thirty degrees respectively. . . .", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star named after the god of fire, Agni, and called in the text by one of his frequent epithets, hutabhuj, &quot;devourer of the sacrifice,&quot; is the one which is situated at the extremity of the northern horn of the Bull, or β Tauri&#x27;; he notes &#x27;the very gross error in the determination of the longitude of this star&#x27;."}]}, {"id": "brahmahridaya", "cat": "individual-star", "dev": "ब्रह्महृदय", "dev_short": "ब्रह्महृदय", "iast": "Brahmahṛdaya", "modern": {"common_name": "Capella", "bayer": "α Aurigae", "constellation": "Auriga"}, "conf": "certain", "see_also": [], "label": "ब्रह्महृदय", "kind": "star", "ra": 79.17, "dec": 46.0, "mag": 0.08, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.11–12", "shloka": "विक्षेपो दक्षिणे भागैः खार्णवैः स्वाद् अपक्रमात् / हुतभुग्ब्रह्महृदयौ वृषे द्वाविम्शभागगौ // अष्टाभिस् त्रिम्शता चैव विक्षिप्ताव् उत्तरेण तौ / गोलम् लब्ध्वा परीक्षेत विक्षेपम् ध्रुवकम् स्फुटम् //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "11. ... Agni (hutabhuj) and Brahmahrdaya are in Taurus, the twenty-second degree; 12. And they are removed in latitude (vikshipta), northward, eight and thirty degrees respectively. . . .", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Brahmahrdaya, &quot;Brahma&#x27;s heart,&quot; is α Aurigae or Capella&#x27;."}]}, {"id": "prajapati", "cat": "individual-star", "dev": "प्रजापति", "dev_short": "प्रजापति", "iast": "Prajāpati", "modern": {"common_name": "Prijipati", "bayer": "δ Aurigae", "constellation": "Auriga"}, "conf": "likely", "see_also": [], "label": "प्रजापति", "kind": "star", "ra": 89.88, "dec": 54.28, "mag": 3.72, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.20", "shloka": "पूर्वस्याम् ब्रह्महृदयाद् अम्शकैः पञ्चभिः स्थितः / प्रजापतिर् वृषान्ते +असौ सौम्ये +अष्टत्रिम्शदम्शकैः //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "20. Situated five degrees eastward from Brahmahrdaya is Prajapati: it is at the end of Taurus, and thirty-eight degrees north.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The star referred to can hardly be any other than that in the head of the Wagoner, or δ Aurigae (4)&#x27;, wondering &#x27;why so faint and inconspicuous a star&#x27; was singled out. He also doubts the authenticity of vv. 20-21 and notes the two definitions of its longitude (v. 11 + v. 20 vs &#x27;end of Taurus&#x27;) do not quite agree."}]}, {"id": "apamvatsa", "cat": "individual-star", "dev": "अपांवत्स", "dev_short": "अपांवत्स", "iast": "Apāṃvatsa", "modern": {"common_name": "θ Virginis", "bayer": "θ Virginis", "constellation": "Virgo"}, "conf": "likely", "see_also": [], "label": "अपांवत्स", "kind": "star", "ra": 197.49, "dec": -5.54, "mag": 4.38, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.21", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Colebrooke gave &#x27;the nebulous stars marked b 1, 2, 3 in Virgo&#x27;, which Burgess could find in no map or catalogue; Burgess: &#x27;There is, on the other hand, a star, θ Virginis (4), situated directly between Spica and δ, and at such a distance from each as shows almost beyond question that it is the star intended&#x27; (so also his index: &#x27;Apamvatsa, name of star (θ Virginis)&#x27;)."}]}, {"id": "apas", "cat": "individual-star", "dev": "आपस् (आपः)", "dev_short": "आपः", "iast": "Āpas", "modern": {"common_name": "Minelauva (Auva)", "bayer": "δ Virginis", "constellation": "Virgo"}, "conf": "certain", "see_also": [], "label": "आपः", "kind": "star", "ra": 193.9, "dec": 3.4, "mag": 3.39, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.21", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;Apas, &quot;Waters&quot;... is put 6° north of Apamvatsa, or in lat. 9° N. It is identified by Colebrooke with δ Virginis (3), and doubtless correctly&#x27;. Noticed in the Sūrya-Siddhānta alone among his authorities."}]}, {"id": "dhruva", "cat": "individual-star", "dev": "ध्रुवः", "dev_short": "ध्रुवः", "iast": "Dhruva", "modern": {"common_name": "Polaris (the pole star)", "bayer": "α Ursae Minoris", "constellation": "Ursa Minor"}, "conf": "disputed", "see_also": ["saptarshi", "arundhati"], "label": "ध्रुवः", "kind": "star", "ra": 37.95, "dec": 89.26, "mag": 1.98, "plotnote": "The pole star sits at the very top of any RA/Dec chart (Dec +89°); RA is nearly meaningless there.", "refs": [{"text": "Vedic corpus", "citation": "Āśvalāyana Gṛhya Sūtra 1.7.22", "shloka": "ध्रुवमरुन्धतीं सप्तऋषीनिति दृष्ट्वा वाचं विसृजेत जीवपत्नीं प्रजां विन्देयेति २२", "shloka_links": ["https://sa.wikisource.org/wiki/आश्वलायनगृह्यसूत्रम्/अध्यायः_१"], "translation": "When she sees the polar-star, the star Arundhati, and the seven Rishis (ursa major), let her break the silence (and say), &#x27;May my husband live and I get offspring.&#x27;", "translator": "Hermann Oldenberg, SBE vol. 29 (1886)", "trans_links": ["https://sacred-texts.com/hin/sbe29/sbe29.txt", "https://web.archive.org/web/20080113225826/http://sacred-texts.com/hin/sbe29/sbe29.txt"], "notes": "&#x27;The fixed one&#x27;, shown to the bride on the wedding night (dhruva-darśana) as an emblem of constancy. In the historical period Dhruva = Polaris, but scholars note that at plausible dates of the ritual&#x27;s origin (2nd-1st millennium BCE) no bright star stood at the pole: α Draconis (Thuban) was pole star c. 2800 BCE, and Polaris only closed on the pole in the last ~1500 years. Dhruva may therefore be an idealized &#x27;fixed point&#x27; of the sky, an earlier pole star remembered, or a faint near-polar star. Parallel rite with the mantra dhruvám asi: Śāṅkhāyana GS 1.17.2-4, tr. Oldenberg: &#x27;Let them sit silent, when the sun has set, until the polar-star appears. He shows her the polar-star with the words, Firm be thou, thriving with me! Let her say, I see the polar-star; may I obtain offspring&#x27; (same source URL)."}]}, {"id": "saptarshi", "cat": "saptarshi", "dev": "सप्तर्षयः / ऋक्षाः", "dev_short": "सप्तर्षयः", "iast": "Saptarṣayaḥ / Ṛkṣāḥ", "modern": {"common_name": "the Big Dipper - seven bright stars of Ursa Major (Dubhe, Merak, Phecda, Megrez, Alioth, Mizar, Alkaid)", "bayer": "α, β, γ, δ, ε, ζ, η Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["marichi", "vasishtha", "angiras", "atri", "pulastya", "pulaha", "kratu", "arundhati"], "label": "सप्तर्षयः", "kind": "figure", "ra": 185.0, "dec": 56.0, "mag": 2.0, "plotnote": "The whole Big Dipper; plotted at the group&#x27;s centre, with its seven rishi-stars around it.", "refs": [{"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.4", "shloka": "अथ यस्मान्न कृत्तिकास्वादधीत । ऋक्षाणां ह वा एता अग्रे पत्न्य आसुः सप्तर्षीनु ह स्म वै पुरर्क्षा इत्याचक्षते ता मिथुनेन व्यार्ध्यन्तामी ह्युत्तरा हि सप्तर्षय उद्यन्ति पुर एता अशमिव वै तद्यो मिथुनेन व्यृद्धः स नेन्मिथुनेन व्यृध्या इति तस्मान्न कृत्तिकास्वादधीत - २.१.२.४", "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "On the other hand (it is argued) why he should not set up the fires under the Krittikas. Originally, namely, the latter were the wives of the Bears (riksha); for the seven Rishis were in former times called the Rikshas (bears). They were, however, precluded from intercourse (with their husbands), for the latter, the seven Rishis, rise in the north, and they (the Krittikas) in the east. Now it is a misfortune for one to be precluded from intercourse (with his wife): he should therefore not set up his fires under the Krittikas, lest he should thereby be precluded from intercourse.", "translator": "Julius Eggeling, SBE vol. 12 (1882), pp. 282-283", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The ŚB states that the Seven Rishis &#x27;were in former times called the Rkshas (bears)&#x27; - preserving the older name ṛkṣāḥ &#x27;bears&#x27; (cf. RV 1.24.10) that matches the Greco-Roman Bear, and notes they rise in the north while the Krittikas rise in the east - exactly true of the circumpolar Dipper vs. the equatorial Pleiades. Also shown to the bride in ĀGS 1.7.22."}]}, {"id": "marichi", "cat": "saptarshi", "dev": "मरीचि", "dev_short": "मरीचि", "iast": "Marīci", "modern": {"common_name": "Alkaid (Benetnash)", "bayer": "η Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "मरीचि", "kind": "star", "ra": 206.89, "dec": 49.31, "mag": 1.85, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "BS 13.5 makes Marīci the easternmost of the seven (pūrve bhāge bhagavān marīciḥ). The BS itself gives only this east-to-west ORDER, not star-by-star identifications; reading the order onto the Big Dipper (Alkaid is the easternmost star, and the next, Vasiṣṭha, is anchored to Mizar by Arundhatī = Alcor) yields Marīci = Alkaid. The Bayer assignment is thus conventional but consistent with the classical order."}]}, {"id": "vasishtha", "cat": "saptarshi", "dev": "वसिष्ठ", "dev_short": "वसिष्ठ", "iast": "Vasiṣṭha", "modern": {"common_name": "Mizar", "bayer": "ζ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["arundhati"], "label": "वसिष्ठ", "kind": "star", "ra": 200.98, "dec": 54.93, "mag": 2.23, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5–6", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।\nपुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_li
