nks": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; ... The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII vv. 5–6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Anchored by the text itself: BS 13.6 places the faithful Arundhatī right beside Vasiṣṭha, matching the naked-eye pair Mizar–Alcor; BS 13.5 places Vasiṣṭha second from the east, matching Mizar&#x27;s position next to Alkaid. The Mizar/Alcor = Vasiṣṭha/Arundhatī pairing is the standard identification in Indian astronomy."}]}, {"id": "angiras", "cat": "saptarshi", "dev": "अङ्गिरस्", "dev_short": "अङ्गिरस्", "iast": "Aṅgiras", "modern": {"common_name": "Alioth", "bayer": "ε Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "अङ्गिरस्", "kind": "star", "ra": 193.51, "dec": 55.96, "mag": 1.76, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Third from the east in the order given by BS 13.5 (after Marīci and Vasiṣṭha); reading that order onto the Dipper with Mizar anchored by Arundhatī gives Alioth. Conventional assignment consistent with, but not explicitly stated in, the classical text."}]}, {"id": "atri", "cat": "saptarshi", "dev": "अत्रि", "dev_short": "अत्रि", "iast": "Atri", "modern": {"common_name": "Megrez", "bayer": "δ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "अत्रि", "kind": "star", "ra": 183.86, "dec": 57.03, "mag": 3.31, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Fourth from the east in the BS 13.5 order; conventional mapping onto the Dipper gives Megrez. Same caveat as the other rishis: BS gives the order, not the star-by-star assignment."}]}, {"id": "pulastya", "cat": "saptarshi", "dev": "पुलस्त्य", "dev_short": "पुलस्त्य", "iast": "Pulastya", "modern": {"common_name": "Phecda", "bayer": "γ Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "पुलस्त्य", "kind": "star", "ra": 178.46, "dec": 53.69, "mag": 2.44, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.5", "shloka": "पूर्वे भागे भगवान्मरीचिरपरे स्थितो वसिष्ठो +अस्मात् ।\nतस्याङ्गिरास्ततो +अत्रिस्तस्यासन्नः पुलस्त्यश्च ।। १३.०५ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The eastern-most of the group is Bhagavan Marichi; the next to him is Vasishtha; the next is Angirasa and the next two are Atri and Pulastya.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 5, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Fifth from the east in the BS 13.5 order; conventional mapping gives Phecda. BS gives the order only."}]}, {"id": "pulaha", "cat": "saptarshi", "dev": "पुलह", "dev_short": "पुलह", "iast": "Pulaha", "modern": {"common_name": "Merak", "bayer": "β Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "पुलह", "kind": "star", "ra": 165.46, "dec": 56.38, "mag": 2.37, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The next in order are the Rishis Pulaha and Kratu. The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Sixth from the east in the BS 13.5–6 order; conventional mapping gives Merak. BS gives the order only."}]}, {"id": "kratu", "cat": "saptarshi", "dev": "क्रतु", "dev_short": "क्रतु", "iast": "Kratu", "modern": {"common_name": "Dubhe", "bayer": "α Ursae Majoris", "constellation": "Ursa Major"}, "conf": "likely", "see_also": [], "label": "क्रतु", "kind": "star", "ra": 165.93, "dec": 61.75, "mag": 1.79, "plotnote": null, "refs": [{"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "The next in order are the Rishis Pulaha and Kratu. The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII v. 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "Last (westernmost) in the BS 13.5–6 east-to-west order; conventional mapping gives Dubhe, the western &#x27;pointer&#x27;. BS gives the order only."}]}, {"id": "arundhati", "cat": "saptarshi", "dev": "अरुन्धती", "dev_short": "अरुन्धती", "iast": "Arundhatī", "modern": {"common_name": "Alcor, the faint companion of Mizar in the Big Dipper's handle", "bayer": "80 Ursae Majoris", "constellation": "Ursa Major"}, "conf": "certain", "see_also": ["vasishtha"], "label": "अरुन्धती", "kind": "star", "ra": 201.31, "dec": 54.99, "mag": 3.99, "plotnote": "Alcor, the naked-eye companion of Mizar (Vasiṣṭha) — the classic eyesight test.", "refs": [{"text": "Vedic corpus", "citation": "Āśvalāyana Gṛhya Sūtra 1.7.22", "shloka": "ध्रुवमरुन्धतीं सप्तऋषीनिति दृष्ट्वा वाचं विसृजेत जीवपत्नीं प्रजां विन्देयेति २२", "shloka_links": ["https://sa.wikisource.org/wiki/आश्वलायनगृह्यसूत्रम्/अध्यायः_१"], "translation": "When she sees the polar-star, the star Arundhati, and the seven Rishis (ursa major), let her break the silence (and say), &#x27;May my husband live and I get offspring.&#x27;", "translator": "Hermann Oldenberg, SBE vol. 29 (1886)", "trans_links": ["https://sacred-texts.com/hin/sbe29/sbe29.txt", "https://web.archive.org/web/20080113225826/http://sacred-texts.com/hin/sbe29/sbe29.txt"], "notes": "Wife of the rishi Vasiṣṭha (= Mizar, ζ UMa), shown to the bride as the model of conjugal fidelity; the pan-Indian tradition of arundhatī-darśana fixes the identification with Alcor securely."}, {"text": "Bṛhat Saṃhitā", "citation": "Bṛhat Saṃhitā 13.6 (cf. 13.4, Kern's variant)", "shloka": "पुलहः क्रतुरिति भगानासन्ना अनुक्रमेण *पूर्वाद्यात्[क्.पूर्वाद्याः] ।\nतत्र वसिष्ठं मुनिवरं उपाश्रितारुन्धती साध्वी ।। १३.०६ ।।", "shloka_links": ["https://sa.wikisource.org/wiki/बृहत्संहिता/अध्यायः_१३"], "translation": "They rise in the North-East and are accompanied by the chaste Arundhati, the consort of Vasishtha. ... The chaste Arundhati closely attends her husband the sage Vasishtha.", "translator": "N. Chidambaram Iyer (1884), ch. XIII vv. 4 and 6, p. 81", "trans_links": ["https://archive.org/details/bihatsahitvarah00iyergoog"], "notes": "BS 13.6 states that the chaste Arundhatī closely attends Vasiṣṭha, best of sages — exactly the naked-eye companion Alcor beside Mizar; the pair is the classic Indian eyesight test. Kern&#x27;s variant of BS 13.4 (recorded in the e-text apparatus as क्. प्रागुत्तरतश्च एते सदा उदयन्ते ससाध्वीकाः) says the rishis rise in the north-east &#x27;accompanied by the sādhvī&#x27;, i.e. Arundhatī, which Iyer&#x27;s v. 4 translates. Note: Utpala&#x27;s tradition (Iyer p. 81 n.) holds the visible star is not the &#x27;real&#x27; Arundhatī, said to be a sūkṣma-tārā (minute star) very close to Vasiṣṭha."}]}, {"id": "krittika-seven", "cat": "vedic-asterism", "dev": "अम्बा, दुला, नितत्नी, अभ्रयन्ती, मेघयन्ती, वर्षयन्ती, चुपुणीका", "dev_short": "सप्त कृत्तिकाः", "iast": "Ambā, Dulā, Nitatnī, Abhrayantī, Meghayantī, Varṣayantī, Cupuṇīkā", "modern": {"common_name": "the seven individual stars of the Pleiades", "bayer": "brightest members: η, 27, 17, 20, 23, 19, 28 Tauri (no secure one-to-one mapping)", "constellation": "Taurus"}, "conf": "likely", "see_also": ["krittika"], "label": "सप्त कृत्तिकाः", "kind": "figure", "ra": 56.75, "dec": 24.12, "mag": 1.6, "plotnote": "The seven individually-named Kṛttikās = the stars of the Pleiades cluster.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 3.1.4.1", "shloka": "अग्निर्वा अकामयत । अन्नादो देवानाꣳ स्यामिति । स एतमग्नये कृत्तिकाभ्यः पुरोडाशमष्टाकपालं निरवपत् । ततो वै सोऽन्नादो देवानामभवत् । अग्निर्वै देवानामन्नादः । यथा ह वा अग्निर्देवनामन्नादः । एवꣳ ह वा एष मनुष्याणां भवति । य एतेन हविषा यजते । य उ चैनदेवं वेद । सोऽत्र जुहोति । अग्नये स्वाहा कृत्तिकाभ्यः स्वाहा । अम्बायै स्वाहा दुलायै स्वाहा । नितत्न्यै स्वाहाभ्रयन्त्यै स्वाहा । मेघयन्त्यै स्वाहा वर्षयन्त्यै स्वाहा । चुपुणीकायै स्वाहेति १", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase] Agni desired: &#x27;May I be the eater of food of the gods.&#x27; He offered an eight-potsherd cake to Agni of the Krittikas, and thereby became the food-eater of the gods... He makes offering with: &#x27;To Agni svaha! To the Krittikas svaha! To Amba svaha! To Dula svaha! To Nitatni svaha! To Abhrayanti svaha! To Meghayanti svaha! To Varshayanti svaha! To Cupunika svaha!&#x27; No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont, &#x27;The Ishtis to the Nakshatras (or Oblations to the Lunar Mansions) of the Taittiriya-Brahmana&#x27;, Proceedings of the American Philosophical Society 98.3 (1954), pp. 204-223 (copyrighted, not quoted).", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "The Taittirīya Brāhmaṇa names seven individual Kṛttikās in the svāhā-calls of the Agni-Kṛttikā offering; several names are rain/cloud words (Abhrayantī &#x27;bringing clouds&#x27;, Meghayantī &#x27;making clouds&#x27;, Varṣayantī &#x27;raining&#x27;). The group = Pleiades is certain; which Vedic name maps to which star cannot be determined."}]}, {"id": "rohini-indra", "cat": "vedic-asterism", "dev": "रोहिणी (द्वितीया; = ज्येष्ठा)", "dev_short": "रोहिणी (इन्द्र)", "iast": "Rohiṇī (second; = Jyeṣṭhā)", "modern": {"common_name": "Antares", "bayer": "α Scorpii", "constellation": "Scorpius"}, "conf": "likely", "see_also": ["jyeshtha", "rohini"], "label": "रोहिणी (इन्द्र)", "kind": "star", "ra": 247.35, "dec": -26.43, "mag": 1.06, "plotnote": "The archaic second &#x27;Rohiṇī&#x27; of the Taittirīya Saṃhitā = Antares, later renamed Jyeṣṭhā.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.2", "shloka": "अनूराधा नक्षत्रम् मित्रो देवता रोहिणी नक्षत्रम् इन्द्रो देवता विचृतौ नक्षत्रम् पितरो देवता", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Anruradha the Naksatra, Mitra the deity; Rohini the Naksatra, Indra the deity; the two Viçrts the Naksatra; the fathers the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "TS 4.4.10 lists a SECOND Rohini with deity Indra, standing between Anuradha and Vicrtau (= Mula) - i.e. in the position of the later Jyestha. Antares, the other great red star of the zodiacal belt, evidently also bore the name &#x27;the red one&#x27;; later lists rename it Jyeṣṭhā (so already TB 1.5.1 and AV 19.7.3)."}]}, {"id": "invaka", "cat": "vedic-asterism", "dev": "इन्वकाः (इन्वगाः)", "dev_short": "इन्वकाः", "iast": "Invakāḥ (Invagāḥ)", "modern": {"common_name": "alternative Taittirīya name of Mṛgaśīrṣa - the stars of Orion's head", "bayer": "λ, φ1, φ2 Orionis", "constellation": "Orion"}, "conf": "likely", "see_also": ["mrigashirsha"], "label": "इन्वकाः", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "plotnote": "Taittirīya name for the stars of Orion&#x27;s head = Mṛgaśīrṣa (λ Orionis).", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 1.5.1.1; 3.1.4.3", "shloka": "अग्नेः कृत्तिकाः । शुक्रं परस्ताज्ज्योतिरवस्तात् । प्रजापते रोहिणी ।आपः परस्तादोषधयोऽवस्तात् । सोमस्येन्वका । विततानि परस्ताद्वयन्तोऽवस्तात् । रुद्रस्य बाहू ।मृगयवः परस्ताद्विक्षारोऽवस्तात् । अदित्यै पुनर्वसू ।वातः परस्तादार्द्रमवस्तात् १ || सोमो वा अकामयत । ओषधीनाꣳ राज्यमभिजयेयमिति । स एतꣳ सोमाय मृगशीर्षाय श्यामाकं चरुं पयसि निरवपत् । ततो वै स ओषधीनाꣳ राज्यमभ्यजयत् । समानानाꣳ ह वै राज्यमभिजयति । य एतेन हविषा यजते । य उ चैनदेवं वेद । सोऽत्र जुहोति । सोमाय स्वाहा मृगशीर्षाय स्वाहा । इन्वकाभ्यः स्वाहौषधीभ्यः स्वाहा । राज्याय स्वाहाभिजित्यै स्वाहेति ३", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः", "https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase of TB 1.5.1.1] The Krittikas are Agni&#x27;s; brightness above, light below. Rohini is Prajapati&#x27;s; the waters above, the plants below. The Invakas are Soma&#x27;s; things spread out above, the weavers below. The Bahu (the two Arms) are Rudra&#x27;s; hunters above, ... below. The two Punarvasus are Aditi&#x27;s; wind above, moisture below. [TB 3.1.4.3] Soma desired: &#x27;May I win the kingship of the plants&#x27;; he offered a caru of millet in milk to Soma of Mrgasirsha... &#x27;To Soma svaha! To Mrgasirsha svaha! To the Invakas svaha! To the plants svaha!&#x27; No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont (1954), copyrighted, not quoted.", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "In the Taittirīya tradition Soma&#x27;s nakshatra is called Invakā where other lists have Mṛgaśīrṣa: TB 1.5.1.1 &#x27;somasyenvakā&#x27;, and TB 3.1.4.3 invokes Mṛgaśīrṣa and the Invakās side by side in the same offering, proving the equation."}]}, {"id": "bahu", "cat": "vedic-asterism", "dev": "बाहू (रुद्रस्य)", "dev_short": "बाहू", "iast": "Bāhū (Rudrasya)", "modern": {"common_name": "'the two Arms' of the deer/Orion: usually taken as Betelgeuse and Bellatrix", "bayer": "α Orionis and γ Orionis", "constellation": "Orion"}, "conf": "disputed", "see_also": ["ardra"], "label": "बाहू", "kind": "figure", "ra": 85.0, "dec": 6.9, "mag": 1.6, "plotnote": "&#x27;The two Arms&#x27; of the celestial deer: usually Betelgeuse + Bellatrix; plotted between them.", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Brāhmaṇa 1.5.1.1", "shloka": "रुद्रस्य बाहू ।मृगयवः परस्ताद्विक्षारोऽवस्तात्", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयब्राह्मणम्_(विस्वरपाठः"], "translation": "[Paraphrase] Of Rudra are the two Arms (Bahu); the hunters above, ... below. No public-domain English translation of the Taittiriya Brahmana exists; rendering above is the researcher&#x27;s own paraphrase of the Sanskrit. Cf. P.-E. Dumont (1954), copyrighted, not quoted.", "translator": "Researcher&#x27;s paraphrase (no public-domain translation); cf. P.-E. Dumont (1954)", "trans_links": ["https://www.jstor.org/stable/i344439"], "notes": "TB 1.5.1 gives Rudra&#x27;s nakshatra as the dual Bāhū &#x27;the two arms&#x27; in place of Ārdrā, fitting the picture of the celestial deer (Orion): the two bright shoulder stars Betelgeuse + Bellatrix. Which two stars are meant is not stated in the text; Betelgeuse-Bellatrix is the common scholarly reading, and the mention of &#x27;hunters&#x27; (mṛgayavaḥ) alongside is part of the same Orion tableau."}]}, {"id": "tishya", "cat": "vedic-asterism", "dev": "तिष्यः", "dev_short": "तिष्यः", "iast": "Tiṣya", "modern": {"common_name": "the later Puṣya: the Asellus stars and Praesepe region", "bayer": "γ, δ, θ Cancri (δ Cancri = Asellus Australis nearest the ecliptic), with the Praesepe cluster M44", "constellation": "Cancer"}, "conf": "likely", "see_also": ["pushya"], "label": "तिष्यः", "kind": "star", "ra": 131.17, "dec": 18.15, "mag": 3.94, "plotnote": "Archaic name for the later Puṣya (δ Cancri region).", "refs": [{"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "तिष्यो नक्षत्रम् बृहस्पतिर् देवता", "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Tisya the Naksatra, Brhaspati the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "Tiṣya, deity Bṛhaspati, is the archaic name that the AV (19.7.2) and all later lists call Puṣya; Whitney&#x27;s note to AV 19.7 flags this TS/AV name difference explicitly. A faint asterism: identification rests on its fixed position between Punarvasū (Castor/Po  Weber; Keith&#x27;s own footnote records that &#x27;the astronomical data here given afford Tilak the source of his work Orion.&#x27; The text names the asterisms but not the modern stars, hence &#x27;likely&#x27;. Cf. ŚB 2.1.2.8-9 where Mṛgaśīrṣa is the pierced Prajapati&#x27;s head/body."}]}, {"id": "ishus-trikanda", "cat": "vedic-asterism", "dev": "इषुस्त्रिकाण्डा", "dev_short": "इषुस्त्रिकाण्डा", "iast": "Iṣus trikāṇḍā", "modern": {"common_name": "Orion's Belt - Mintaka, Alnilam, Alnitak - as the 'three-jointed arrow'", "bayer": "δ, ε, ζ Orionis", "constellation": "Orion"}, "conf": "likely", "see_also": ["mriga"], "label": "इषुस्त्रिकाण्डा", "kind": "figure", "ra": 84.05, "dec": -1.2, "mag": 1.69, "plotnote": "The &#x27;three-jointed arrow&#x27; = Orion&#x27;s Belt (Mintaka, Alnilam, Alnitak); plotted at Alnilam.", "refs": [{"text": "Vedic corpus", "citation": "Aitareya Brāhmaṇa 3.33; cf. Śatapatha Brāhmaṇa 2.1.2.9", "shloka": "तमभ्यायत्याविध्यत्स विद्ध ऊर्ध्व उदप्रपतत्तमेतं मृग इत्याचक्षते य उ एव मृगव्याधः स उ एव स या रोहित्सा रोहिणी यो एवेषुस्त्रिकाण्डा सो एवेषुस्त्रिकाण्डा।", "shloka_links": ["https://sa.wikisource.org/wiki/ऐतरेय_ब्राह्मणम्/पञ्चिका_३_(तृतीय_पञ्चिका"], "translation": "The female deer is Rohini; the three-pointed arrow is the three-pointed arrow. [ŚB 2.1.2.9, tr. Eggeling: &#x27;when they (the gods) on that occasion pierced him with what is called the three-knotted arrow, he abandoned that body&#x27;.]", "translator": "A.B. Keith, Rigveda Brahmanas, HOS 25 (1920); Julius Eggeling, SBE 12 (1882)", "trans_links": ["https://archive.org/details/rigvedabrahmana00keitgoog", "https://archive.org/download/rigvedabrahmana00keitgoog/rigvedabrahmana00keitgoog_djvu.txt", "https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The &#x27;three-parted arrow&#x27; shot at Prajapati; the three aligned Belt stars piercing the deer&#x27;s body. The s ttps://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/346", "https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/348"], "translation": "No public-domain translation of these Gaṇitādhyāya verses exists online. Bhāskara&#x27;s own conception of this catalog is however translated in the public-domain 1861 rendering of Golādhyāya, Dṛkkarma-vāsanā v.12: &#x27;12. As the constellations are fixed their latitudes as given in the books of these curly [read: early] astronomers are the bpasuat-b&#x27;aras [read: spashta-śaras], i.e. tho reduced values of the latitudes so as to render them fit to be added to or subtracted from the declination; and tho dhkuvas [read: dhruvas] or longitude of these constellations are given, after being corrected by tho ayana drtkkakma [read: drikkarma] so as to suit those corrected latitudes that is, the star will appear to rise at the equator at the same time with longitude found by the correction.&#x27; [verbatim from OCR of the 1861 edition, bracketed restorations of obvious OCR errors added]", "translator": "Lancelot Wilkinson, revised by Bapu Deva Sastri (1861), public domain (for Golādhyāya IX.12); Gaṇitādhyāya vv.1-6 values paraphrased from Arkasomayaji.", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.46927"], "notes": "Bhāskara gives the polar longitudes (vv.1-3) and rectified latitudes (vv.4-6) of all 28 yogatārās in bhūtasaṅkhyā word-numerals, stating (bhāṣya) that Kṛttikā and Rohiṇī are to be diminished by 32&#x27; and Viśākhā, Anurādhā, Jyeṣṭhā increased by 5&#x27;: &#x27;कृत्तिकारोहिणीनक्षत्रयोद्वत्रिशत्कलोनाः । विशाखानुराधाज्येष्ठानां कलापञ्चकेनाधिका ध्रुवकभागा वेदितव्याः&#x27; (sa.wikisource p.347). Per Arkasomayaji the base values are Brahmagupta&#x27;s, copied also by Śrīpati. Standard traditional identifications for the brightest members, as printed in the public-domain 1861 volume (Sūrya Siddhānta portion, pp.63-68): Svātī = Arcturus, Citrā = Spica, Jyeṣṭhā = Antares, Punarvasu = β Geminorum, Rohiṇī = Aldebaran (α Tauri), Maghā = Regulus, Kṛttikā = Pleiades (η Tauri), Hasta = δ Corvi, Śravaṇa = α Aquilae, Dhaniṣṭhā = α Delphini, Viśākhā = α Librae, Aśvinī = α(β) Arietis, Revatī = ζ Piscium. Individual per-star numeric values in the online OCR tables are too corrupted to transcribe reliably."}]}], "about": "<p>Every point on this chart is an entry in a hand-built database of star names drawn from primary Sanskrit texts. Positions are modern J2000 coordinates for the star each verse is understood to name; marker size grows with apparent brightness. Dashed rings mark asterisms (groups of stars) rather than single points.</p><p><b>What the texts actually give.</b> The Vedic texts name asterisms and deities but never coordinates; the siddhāntas give a position for one junction star (yogatārā) per nakshatra. Modern equations rest on those siddhāntic positions — chiefly Burgess's 1860 analysis of the Sūrya Siddhānta — and on continuous tradition. The <i>confidence</i> label on each entry records where that chain is firm and where scholars disagree.</p><p><b>Sources.</b> Sanskrit copied verbatim from Sanskrit Wikisource and GRETIL; translations are public-domain (Burgess 1860, Iyer 1884, Keith 1914/1920, Eggeling 1882, Whitney 1905, Oldenberg 1886, Wilkinson &amp; Sastri 1861). Copyrighted translations are paraphrased, never quoted.</p><p><b>A note on the Āryabhaṭīya.</b> It names no individual stars at all — verified against both W.E. Clark's 1930 translation and the full Sanskrit text — so it contributes no points here.</p><p>Full database, with every caveat: <a href=\"https://github.com\">docs/star-names/</a> in the repository (README.md and star-names.json).</p>"};

/* ---------- constants ---------- */
const CAT_META = {
  "nakshatra":       { color: "var(--c-nakshatra)", hex: "#c98500", label: "Nakshatra yogatārā", shape: "circle" },
  "individual-star": { color: "var(--c-individual)", hex: "#3987e5", label: "Named stars",        shape: "circle" },
  "saptarshi":       { color: "var(--c-saptarshi)", hex: "#d55181", label: "Saptarṣi & Arundhatī", shape: "circle" },
  "vedic-asterism":  { color: "var(--c-vedic)",     hex: "#008300", label: "Vedic asterisms",     shape: "diamond" },
  "collective":      { color: "var(--ink-3)",       hex: "#5d6a88", label: "Collective catalog",  shape: "circle" }
};
const EPS = 23.4393 * Math.PI / 180;   // obliquity, J2000
const MARGIN = { top: 16, right: 18, bottom: 62, left: 52 };

const plotted = DB.items.filter(d => d.ra !== null);
const unplotted = DB.items.filter(d => d.ra === null);
const state = {
  on: { "nakshatra": true, "individual-star": true, "saptarshi": true, "vedic-asterism": true },
  labels: true,
  pinnedIds: null
};

/* ---------- svg helpers ---------- */
const svg = document.getElementById("sky");
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
let W = 0, H = 0, PW = 0, PH = 0;
// Standard equatorial map: RA increases right→left (0h at right, 24h at left);
// Dec +90° at top, −90° at bottom.
const xOf = ra => MARGIN.left + ((360 - ra) / 360) * PW;
const yOf = dec => MARGIN.top + (90 - dec) / 180 * PH;

function magR(d) {
  if (d.kind === "figure") return 8.5;
  return Math.min(11, Math.max(2.3, 7.6 - 1.3 * d.mag));
}

/* ---------- render ---------- */
function render() {
  W = window.innerWidth; H = window.innerHeight;
  PW = W - MARGIN.left - MARGIN.right;
  PH = H - MARGIN.top - MARGIN.bottom;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";

  const g = el("g", {}, svg);

  /* graticule */
  for (let dec = -60; dec <= 60; dec += 30) {
    if (dec === 0) continue;
    el("line", { x1: MARGIN.left, x2: MARGIN.left + PW, y1: yOf(dec), y2: yOf(dec),
                 stroke: "var(--grid)", "stroke-width": 1 }, g);
  }
  for (let h = 0; h <= 24; h += 2) {
    const x = xOf(h * 15);
    el("line", { x1: x, x2: x, y1: MARGIN.top, y2: MARGIN.top + PH,
                 stroke: "var(--grid)", "stroke-width": 1 }, g);
    const t = el("text", { x: x, y: MARGIN.top + PH + 16, "text-anchor": "middle", class: "axis-lab" }, g);
    t.textContent = h + "h";
  }
  for (let dec = -60; dec <= 60; dec += 30) {
    const t = el("text", { x: MARGIN.left - 7, y: yOf(dec) + 3.5, "text-anchor": "end", class: "axis-lab" }, g);
    t.textContent = (dec > 0 ? "+" : "") + dec + "°";
  }
  /* frame + equator */
  el("rect", { x: MARGIN.left, y: MARGIN.top, width: PW, height: PH, fill: "none",
               stroke: "var(--grid-strong)", "stroke-width": 1 }, g);
  el("line", { x1: MARGIN.left, x2: MARGIN.left + PW, y1: yOf(0), y2: yOf(0),
               stroke: "var(--grid-strong)", "stroke-width": 1 }, g);
  const eqLab = el("text", { x: MARGIN.left + 6, y: yOf(0) - 5, class: "line-lab" }, g);
  eqLab.textContent = "CELESTIAL EQUATOR";

  /* ecliptic */
  let dEcl = "", prevX = null;
  for (let lam = 0; lam <= 360; lam += 2) {
    const L = lam * Math.PI / 180;
    let ra = Math.atan2(Math.sin(L) * Math.cos(EPS), Math.cos(L)) * 180 / Math.PI;
    if (ra < 0) ra += 360;
    const dec = Math.asin(Math.sin(EPS) * Math.sin(L)) * 180 / Math.PI;
    const x = xOf(ra), y = yOf(dec);
    dEcl += (prevX === null || Math.abs(x - prevX) > PW / 2) ? `M${x.toFixed(1)},${y.toFixed(1)}` : `L${x.toFixed(1)},${y.toFixed(1)}`;
    prevX = x;
  }
  el("path", { d: dEcl, fill: "none", stroke: "var(--c-nakshatra)", "stroke-width": 1.2,
               "stroke-dasharray": "1 5", "stroke-linecap": "round", opacity: 0.75 }, g);
  // label sits in the empty patch below the equator around 21h
  const ecLab = el("text", { x: xOf(318), y: yOf(-16), class: "line-lab", fill: "var(--c-nakshatra)", opacity: 0.85,
                             "text-anchor": "middle" }, g);
  ecLab.textContent = "क्रान्तिवृत्त · ECLIPTIC";
  ecLab.setAttribute("style", "font-family: var(--deva)");

  /* markers: bright first so faint neighbours stay on top */
  const shown = plotted.filter(d => state.on[d.cat]);
  const seen = [];
  const order = shown.slice().sort((a, b) => (a.mag ?? 9) - (b.mag ?? 9));
  const gm = el("g", {}, svg);
  const labelBoxes = [];

  for (const d of order) {
    const x = xOf(d.ra), y = yOf(d.dec), r = magR(d);
    const meta = CAT_META[d.cat];
    const dup = seen.some(p => Math.hypot(p.x - x, p.y - y) < 4);
    seen.push({ x, y });
    const mg = el("g", { class: "marker", tabindex: 0, role: "button",
                         "aria-label": `${d.iast} — ${d.modern.common_name}` }, gm);
    mg.dataset.id = d.id;

    if (d.kind === "figure") {
      el("circle", { cx: x, cy: y, r: r + 2, fill: "none", stroke: meta.color,
                     "stroke-width": 1.4, "stroke-dasharray": "3 3", opacity: 0.95 }, mg);
      if (meta.shape === "diamond")
        el("rect", { x: x - 2.6, y: y - 2.6, width: 5.2, height: 5.2, fill: meta.color,
                     transform: `rotate(45 ${x} ${y})` }, mg);
      else
        el("circle", { cx: x, cy: y, r: 2.6, fill: meta.color }, mg);
    } else if (dup) {
      /* second name on the same star: open ring so both categories stay visible */
      el("circle", { cx: x, cy: y, r: r + 3.5, fill: "none", stroke: meta.color, "stroke-width": 1.6 }, mg);
    } else {
      if (r > 6.5) el("circle", { cx: x, cy: y, r: r * 1.9, fill: meta.color, opacity: 0.13 }, mg);
      if (meta.shape === "diamond") {
        const s = r * 1.6;
        el("rect", { x: x - s / 2, y: y - s / 2, width: s, height: s, fill: meta.color,
                     transform: `rotate(45 ${x} ${y})` }, mg);
      } else {
        el("circle", { cx: x, cy: y, r: r, fill: meta.color }, mg);
      }
    }
    /* hit target */
    el("circle", { cx: x, cy: y, r: Math.max(13, r + 6), fill: "transparent" }, mg);

    if (state.labels) {
      let lx = x + r + 6, ly = y + 3.5, anchor = "start";
      if (x > MARGIN.left + PW - 90) { lx = x - r - 6; anchor = "end"; }
      for (const b of labelBoxes) {
        if (Math.abs(lx - b.x) < 86 && Math.abs(ly - b.y) < 12) ly = b.y + 12.5;
      }
      labelBoxes.push({ x: lx, y: ly });
      const t = el("text", { x: lx, y: ly, class: "star-lab", fill: "var(--ink-2)", "text-anchor": anchor }, gm);
      t.textContent = d.label;
    }

    mg.addEventListener("mouseenter", ev => showTip(d, x, y));
    mg.addEventListener("mouseleave", hideTip);
    mg.addEventListener("focus", () => showTip(d, x, y));
    mg.addEventListener("blur", hideTip);
    mg.addEventListener("click", ev => { ev.stopPropagation(); openGroup(d); });
    mg.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openGroup(d); } });
  }
}

/* ---------- tooltip ---------- */
const tip = document.getElementById("tooltip");
function groupOf(d) {
  return plotted.filter(o => state.on[o.cat] && Math.hypot(o.ra - d.ra, o.dec - d.dec) < 1.3);
}
function showTip(d, x, y) {
  const grp = groupOf(d);
  const meta = CAT_META[d.cat];
  tip.innerHTML =
    `<div class="tdev">${grp.map(g => g.dev_short).join(" · ")}</div>` +
    `<div class="tiast">${grp.map(g => g.iast).join(" · ")}</div>` +
    `<div class="tmod"><span class="cat" style="background:${meta.color}"></span>` +
    `${d.modern.common_name} · ${d.modern.bayer}</div>` +
    `<div class="tmore">${grp.length > 1 ? grp.length + " names here — " : ""}click for shloka &amp; sources</div>`;
  tip.classList.add("show");
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx = x + 16, ty = y - th - 10;
  if (tx + tw > W - 10) tx = x - tw - 16;
  if (ty < 8) ty = y + 16;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
}
function hideTip() { tip.classList.remove("show"); }

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer");
const dBody = document.getElementById("drawer-body");
const dTitle = document.getElementById("drawer-title");
function openDrawer(title, html) {
  dTitle.textContent = title;
  dBody.innerHTML = html;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  dBody.scrollTop = 0;
  dBody.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => { const t = DB.items.find(i => i.id === b.dataset.open); if (t) openEntries([t]); }));
}
function closeDrawer() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }

function linkRow(links, label) {
  return links.map((u, i) => `<a href="${u}" target="_blank" rel="noopener">${label}${links.length > 1 ? " " + (i + 1) : ""}</a>`)
              .join('<span class="lsep">·</span>');
}
function entryHTML(d) {
  const meta = CAT_META[d.cat];
  const refs = d.refs.map(r => `
    <div class="ref">
      <div class="cite">${r.citation}</div>
      <div class="links">${linkRow(r.shloka_links, "Sanskrit e-text")}${r.trans_links.length ? '<span class="lsep">·</span>' + linkRow(r.trans_links, "translation") : ""}</div>
      <div class="shloka">${r.shloka}</div>
      <div class="trans">${r.translation}</div>
      <div class="transby">— ${r.translator}</div>
      <details><summary>Identification notes (${r.text})</summary><p>${r.notes}</p></details>
    </div>`).join("");
  const seeAlso = d.see_also.length
    ? `<div class="seealso"><span class="lbl">See also</span>` +
      d.see_also.map(s => { const t = DB.items.find(i => i.id === s); return t ? `<button class="chip" data-open="${s}"><span class="dot" style="background:${CAT_META[t.cat].color}"></span>${t.dev_short}</button>` : ""; }).join("") + `</div>`
    : "";
  return `
    <div class="entry">
      <h2>${d.dev}</h2>
      <div class="iast">${d.iast}</div>
      <div class="modline"><b>${d.modern.common_name}</b><span class="sep">·</span>${d.modern.bayer}<span class="sep">·</span>${d.modern.constellation}</div>
      <div class="badges">
        <span class="badge cat" style="background:${meta.color}">${meta.label}</span>
        <span class="badge conf-${d.conf}">${d.conf}</span>
      </div>
      ${d.plotnote ? `<div class="plotnote">${d.plotnote}</div>` : ""}
      ${refs}
      ${seeAlso}
    </div>`;
}
function openEntries(list) {
  openDrawer(list.length > 1 ? list.length + " names at this point" : "Star detail",
             list.map(entryHTML).join(""));
}
function openGroup(d) { openEntries(groupOf(d)); }

/* ---------- index & about ---------- */
function openIndex() {
  const cats = ["nakshatra", "individual-star", "saptarshi", "vedic-asterism", "collective"];
  let html = "";
  for (const c of cats) {
    const items = DB.items.filter(i => i.cat === c);
    if (!items.length) continue;
    html += `<div class="ix-cat"><h3><span class="dot" style="background:${CAT_META[c].color}"></span>${CAT_META[c].label} <span class="n">(${items.length})</span></h3>` +
      items.map(i => `<button class="ix-row" data-open="${i.id}"><span class="dev">${i.dev_short}</span><span>${i.iast}</span><span class="im">${i.modern.common_name}</span></button>`).join("") +
      `</div>`;
  }
  openDrawer("Index — all " + DB.items.length + " names", html);
}
function openAbout() {
  openDrawer("About & caveats", `<div class="about">${DB.about}</div>`);
}

/* ---------- HUD wiring ---------- */
const legend = document.getElementById("legend");
for (const c of ["nakshatra", "individual-star", "saptarshi", "vedic-asterism"]) {
  const n = plotted.filter(d => d.cat === c).length;
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot ${CAT_META[c].shape === "diamond" ? "diamond" : ""}" style="background:${CAT_META[c].color}"></span>${CAT_META[c].label} <span class="n">${n}</span>`;
  b.addEventListener("click", () => {
    state.on[c] = !state.on[c];
    b.classList.toggle("off", !state.on[c]);
    b.setAttribute("aria-pressed", String(state.on[c]));
    render();
  });
  legend.appendChild(b);
}
document.getElementById("subline").innerHTML =
  `${DB.items.length} names from the Sūrya Siddhānta, the Vedic corpus, the Bṛhat Saṃhitā and the Siddhānta Śiromaṇi — ` +
  `${plotted.length} plotted, ${unplotted.length} catalog entry in the <button class="chip" style="display:inline" id="link-unplotted">Index</button>. ` +
  `Hover a star for its name; click for the shloka and sources.`;
document.getElementById("link-unplotted").addEventListener("click", openIndex);
document.getElementById("btn-index").addEventListener("click", openIndex);
document.getElementById("btn-about").addEventListener("click", openAbout);
const btnLabels = document.getElementById("btn-labels");
btnLabels.addEventListener("click", () => {
  state.labels = !state.labels;
  btnLabels.classList.toggle("active", state.labels);
  btnLabels.setAttribute("aria-pressed", String(state.labels));
  render();
});
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
svg.addEventListener("click", closeDrawer);
window.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

let rT = null;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 120); });
render();
</script>
