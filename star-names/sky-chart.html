ेग्निश्च महेन्द्र श्च कश्यपोथ ततो ध्रुवः । तारका शिशुमारस्य नास्तमेति चतुष्टयम् ॥ ३४ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_१२"], "translation": "Agni, Mahendra, Kaśyapa, and Dhruva, in succession, are placed in its tail; which four stars in this constellation never set.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp070.htm"], "notes": "One of the most stable elements in the whole tradition: Indra appears in the tail-group in every recension (Bhāgavata 5.23.1 and 5.23.5; Viṣṇu P. 2.12.34 and Vāyu/Matsya/Brahmāṇḍa as Mahendra), and Viṣṇu P. 2.12.34 explicitly states that the four tail-figures are stars that NEVER SET — i.e. circumpolar. That is a real, falsifiable astronomical claim in the text. Which visible star is meant is nowhere stated; proposals that make Indra a former pole star are modern reconstruction."}]}, {"id": "kashyapa", "cat": "shishumara-position", "dev": "कश्यप", "dev_short": "कश्यप", "iast": "Kaśyapa", "modern": {"common_name": "a circumpolar star on the tail of the Śiśumāra, adjacent to Dhruva", "bayer": "—", "constellation": "Draco / Ursa Minor region"}, "conf": "disputed", "see_also": ["shishumara", "indra-mahendra"], "label": "कश्यप", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.12.34; Bhāgavata Purāṇa 5.23.1; Vāyu Purāṇa 52.95; Matsya Purāṇa 127.25; Brahmāṇḍa Purāṇa 1,23.104", "shloka": "अथ तस्मात्परतस्त्रयोदशलक्षयोजनान्तरतो यत्तद्विष्णो: परमं पदमभिवदन्ति यत्र ह महाभागवतो ध्रुव औत्तानपादिरग्निनेन्द्रेण प्रजापतिना कश्यपेन धर्मेण च समकालयुग्भि: सबहुमानं दक्षिणत: क्रियमाण ... ॥ १ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "That auspicious devotee of the Lord exists there ever reverentially circled by Agni, Indra, Prajapati, Kasyapa and Dharma, all simultaneously converted into stars; and attaining equal longevity with the beings living for a Kalpa.", "translator": "J.M. Sanyal (1930s; public domain)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Distinct from Kaśyapa as a member of the Saptarṣi: here he is one of the four never-setting tail stars immediately preceding Dhruva (Viṣṇu P. 2.12.34), and one of the five who circumambulate Dhruva in Bhāgavata 5.23.1. His position next to Dhruva has led several modern writers to propose him as a former pole star. WARNING: Wilson&#x27;s note 7 to VP 2.12 suggests &#x27;in Kaśyapa we have a verbal affinity to Cassiopeia&#x27; — this is 19th-century sound-alike speculation with no textual or commentarial basis and should not be recorded as an identification."}]}, {"id": "marichi-tail", "cat": "shishumara-position", "dev": "मरीचि (पुच्छे)", "dev_short": "मरीचि", "iast": "Marīci (in the tail)", "modern": {"common_name": "a fifth circumpolar star in the Śiśumāra's tail", "bayer": "—", "constellation": "Draco / Ursa Minor region"}, "conf": "disputed", "see_also": ["shishumara", "marichi"], "label": "मरीचि", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Vāyu Purāṇa 52.95; Brahmāṇḍa Purāṇa 1,23.104 (absent from Viṣṇu Purāṇa 2.12.34)", "shloka": "पुच्छेऽग्निश्च महेन्द्रश्च मरीचिः कश्यपो ध्रुवः। तारकाः शिशुमारश्च नास्तमेति चतुष्टयम् ।। ५२.९५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_५२"], "translation": "In the tail are Agni and Mahendra and Marīci, Kaśyapa, Dhruva; four of the Śiśumāra&#x27;s stars do not set.", "translator": "Literal rendering by the compiler", "trans_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_५२"], "notes": "A recension-specific addition worth recording: Vāyu 52.95 and Brahmāṇḍa 1,23.104 insert Marīci into the tail-list (Agni, Mahendra, Marīci, Kaśyapa, Dhruva) where Viṣṇu P. 2.12.34 has only four names. Since the very next line still says only FOUR stars never set, the five-name list is in tension with its own following verse — evidence of textual growth. Distinct from Marīci as a Saptarṣi (Alkaid)."}]}, {"id": "uttanapada", "cat": "shishumara-position", "dev": "उत्तानपाद", "dev_short": "उत्तानपाद", "iast": "Uttānapāda", "modern": {"common_name": "the upper jaw of the Śiśumāra", "bayer": "—", "constellation": "Draco (head region) on the Draco identification"}, "conf": "disputed", "see_also": ["shishumara", "agastya"], "label": "उत्तानपाद", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.12.31; Vāyu Purāṇa 52.92; Matsya Purāṇa 127.22; Brahmāṇḍa Purāṇa 1,23.102", "shloka": "उत्तानपादस्तस्याधो विज्ञेयो ह्युत्तरो हनुः । यज्ञोऽधरश्च विज्ञेयो धर्मो मूर्द्धानमाश्रितः ॥ ३१ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_१२"], "translation": "Uttánapáda is to be considered as its upper jaw; Sacrifice as its lower. Dharma is situated on its brow; Náráyańa in its heart.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp070.htm"], "notes": "A genuine sky-position term, distinct from Uttānapāda as Dhruva&#x27;s father in the narrative. NOTE THE CONFLICT: the older recension puts Uttānapāda on the upper jaw, whereas Bhāgavata 5.23.7 puts Agasti (Canopus) there — the two Śiśumāra traditions are not reconcilable at this point, which is itself evidence that the Bhāgavata reworked an inherited figure."}]}, {"id": "yajna-group", "cat": "shishumara-position", "dev": "यज्ञ, धर्म, वरुण, अर्यमा, संवत्सर, मित्र", "dev_short": "यज्ञ", "iast": "Yajña, Dharma, Varuṇa, Aryaman, Saṃvatsara, Mitra", "modern": {"common_name": "six further body-positions of the Śiśumāra: lower jaw, head, the two hind thighs, the sexual organ, the anus", "bayer": "—", "constellation": "Draco / Ursa Minor region on the Draco identification"}, "conf": "disputed", "see_also": ["shishumara"], "label": "यज्ञ", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.12.31-33; Vāyu Purāṇa 52.92-94; Matsya Purāṇa 127.22-24; Brahmāṇḍa Purāṇa 1,23.102-104", "shloka": "हृदि नारायणश्चास्ते अश्विनौ पूर्वपादयोः । वरुणश्चार्यमा चैव पश्चिमे तस्य सक्थिनी ॥ ३२ ॥ शिश्नः संवत्सरस्तस्य मित्रोऽपानं समाश्रितः ॥ ३३ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_१२"], "translation": "The Áswins are its two fore feet; and Varuńa and Áryamat its two hinder legs. Samvatsara is its sexual organ; Mitra its organ of excretion.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp070.htm"], "notes": "Grouped because they share a single source-passage and an identical evidential status: each is a NAMED position on the star-figure, but no Purāṇa assigns any of them a visible star, and the older recension&#x27;s figure has only fourteen stars for far more than fourteen named positions. Dharma also appears independently in the Bhāgavata&#x27;s tail-group (5.23.5), where it is a different position on a different version of the figure. Any star-by-star mapping of these is reconstruction, not text."}]}, {"id": "yama-shishumara", "cat": "shishumara-position", "dev": "यम (अधराहनौ)", "dev_short": "यम", "iast": "Yama (on the lower jaw)", "modern": {"common_name": "a star on the lower jaw of the Śiśumāra, opposite Agasti", "bayer": "—", "constellation": "far southern sky, if paired with Canopus"}, "conf": "disputed", "see_also": ["shishumara", "agastya"], "label": "यम", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.7", "shloka": "उत्तराहनावगस्तिरधराहनौ यमो मुखेषु चाङ्गारक: शनैश्चर उपस्थे बृहस्पति: ककुदि वक्षस्यादित्यो हृदये नारायणो मनसि चन्द्रो नाभ्यामुशना स्तनयोरश्विनौ बुध: प्राणापानयो राहुर्गले केतव: सर्वाङ्गेषु रोमसु सर्वे तारागणा: ॥ ७ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "And on the upper jaw of the Sisumara is Agastya, and on its lower jaw is Yama.", "translator": "J.M. Sanyal (1930s; public domain)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Bhāgavata 5.23.7 pairs Yama on the lower jaw directly against Agasti (Canopus) on the upper. Since Agastya is securely Canopus and the two jaws are adjacent, a southern-sky star is implied, but the text names none and no reliable identification was found. Yama as an asterism-deity (of Bharaṇī) is a separate usage; this is a distinct sky-position."}]}, {"id": "prajapati-circumpolar", "cat": "shishumara-position", "dev": "प्रजापति (पुच्छे)", "dev_short": "प्रजापति", "iast": "Prajāpati (in the tail)", "modern": {"common_name": "a CIRCUMPOLAR star on the Śiśumāra's tail — not the ecliptic Prajāpati", "bayer": "—", "constellation": "Draco / Ursa Minor region"}, "conf": "disputed", "see_also": ["shishumara", "prajapati"], "label": "प्रजापति", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.5 (and 5.23.1)", "shloka": "यस्य पुच्छाग्रेऽवाक्‌शिरस: कुण्डलीभूतदेहस्य ध्रुव उपकल्पितस्तस्य लाङ्गूले प्रजापतिरग्निरिन्द्रो धर्म इति ... ॥ ५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "Under the ends of the Sisumara&#x27;s tail are Prajapati, Agni, Indra and Dharma.", "translator": "J.M. Sanyal (1930s; public domain)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "Flagged because the referent differs from the Sūrya Siddhānta&#x27;s Prajāpati already in this database. That one is the Rohiṇī-pursuer near Orion/Auriga (δ Aurigae per Burgess). The Prajāpati of Bhāgavata 5.23.1 and 5.23.5 is one of the five stars circumambulating Dhruva and sits on the tail of the Śiśumāra — necessarily circumpolar, hence a different star. Some modern writers make it a former pole star. Kept as a distinct sense rather than merged."}]}, {"id": "suniti", "cat": "shishumara-position", "dev": "सुनीति", "dev_short": "सुनीति", "iast": "Sunīti", "modern": {"common_name": "a star beside Dhruva — Dhruva's mother, placed as a star near the pole", "bayer": "—", "constellation": "Ursa Minor / circumpolar"}, "conf": "disputed", "see_also": ["dhruva", "arundhati"], "label": "सुनीति", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A named position on the body of the Śiśumāra. No Purāṇa equates it with a visible star, so it is deliberately left off the chart rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 1.12.94", "shloka": "सुनीतिरपि ते माता त्वदासन्नातिनिर्मला । विमाने तारका भूत्वा तावत्कालं निवत्स्यति ॥ १,१२.९४ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/प्रथमांशः/अध्यायः_१२"], "translation": "Thy mother Suníti, in the orb of a bright star, shall abide near thee for a similar term.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp047.htm"], "notes": "An obscure but real Purāṇic star: the mūla says only that Sunīti &#x27;shall become a star (tārakā) in a vimāna and dwell near thee&#x27; — a stellar apotheosis exactly parallel to Arundhatī&#x27;s beside Vasiṣṭha. Wilson&#x27;s note 8 to VP 1.12 records the commentator&#x27;s identification of her with a specific star at the pole, but the mūla itself names none. A companion of Polaris is structurally attractive but this is inference; the name is recorded, not an identification."}]}, {"id": "nagavithi", "cat": "star-road", "dev": "नागवीथी", "dev_short": "नागवीथी", "iast": "Nāgavīthī", "modern": {"common_name": "the Serpent-road, northernmost of the nine star-roads", "bayer": "—", "constellation": "Aries and Taurus (Aśvinī, Bharaṇī, Kṛttikā)"}, "conf": "likely", "see_also": ["margas", "pitryana-devayana"], "label": "नागवीथी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["ashvini", "bharani", "krittika"], "galacticL": null, "plotnote": null, "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.8.90; Matsya Purāṇa 124.54; Vāyu Purāṇa 50.130; Brahmāṇḍa Purāṇa 1,21.77", "shloka": "नागावीथ्युत्तरं यच्च सप्तर्षिभ्यश्च दक्षिणम् । उत्तरः सवितुः पंथा देवयानश्च स स्मृतः ॥ ९० ॥ — cf. मत्स्य १२४.५४: अश्विनीकृत्तिकायाम्या नागवीथ्यस्त्रयः स्मृताः।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_८"], "translation": "The path of the gods lies to the north of the solar sphere, north of the Nágavithi, and south of the seven Rishis.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "Matsya 124.54 states its three asterisms: Aśvinī, Kṛttikā, and yāmyā (= Bharaṇī, whose deity is Yama). Wilson&#x27;s note 23 to VP 2.8 gives the same: &#x27;The stars of the Nágavíthi are those of Aries and Taurus.&#x27; In Viṣṇu P. 2.8.90 it is a latitude marker: the Devayāna lies north of Nāgavīthī and south of the Saptarṣis. Homonym caution: Nāgavīthī is also a woman in the genealogies (daughter of Yāmī) at VP 1.15.107 — the star-road personified."}]}, {"id": "gajavithi", "cat": "star-road", "dev": "गजवीथी", "dev_short": "गजवीथी", "iast": "Gajavīthī", "modern": {"common_name": "the Elephant-road", "bayer": "—", "constellation": "Taurus/Orion (Rohiṇī, Ārdrā, Mṛgaśiras)"}, "conf": "likely", "see_also": ["margas"], "label": "गजवीथी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["rohini", "ardra", "mrigashirsha"], "galacticL": null, "plotnote": "Matsya 124.55 as transmitted repeats the name नागवीथी here; Gajavīthī is the required reading.", "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.55 (transmitted as nāgavīthī, emend to gajavīthī); named in Wilson's note 21 to Viṣṇu Purāṇa 2.8", "shloka": "रोहिण्यार्द्रा मृगशिरो नागवीथिरिति स्मृता। [transmitted reading; emend नागवीथिः → गजवीथिः]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "...those of the northern portion are termed Nágavithi, Gajavíthi, and Airávati...", "translator": "H.H. Wilson (1840; public domain), note 21 to VP 2.8", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "The second vīthī of the northern (Airāvata) mārga. TEXTUAL PROBLEM: Matsya 124.55 as transmitted reads nāgavīthī for this road, repeating the previous name — certainly corrupt for Gajavīthī. Both witnesses checked (GRETIL&#x27;s Chaukhamba text and sa.wikisource) share the error, so it is old; the 1916 translator flags it, noting the text Wilson quoted should read Gajavīthī. Wilson&#x27;s own note 21 to VP 2.8 lists Gajavíthi among the nine."}]}, {"id": "airavati", "cat": "star-road", "dev": "ऐरावती", "dev_short": "ऐरावती", "iast": "Airāvatī", "modern": {"common_name": "the road of Airāvata", "bayer": "—", "constellation": "Cancer/Gemini (Puṣya, Āśleṣā, Punarvasu)"}, "conf": "likely", "see_also": ["margas"], "label": "ऐरावती", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["pushya", "ashlesha", "punarvasu"], "galacticL": null, "plotnote": null, "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.55", "shloka": "पुष्याश्लेषा पुनर्वस्वोर्वीथी चैरावती स्मृता।। १२४.५४ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Puṣya, Āśleṣā and Punarvasu — that road is remembered as Airāvatī.", "translator": "Literal rendering by the compiler (the 1916 public-domain Matsya OCR is too corrupt to quote here)", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "Third vīthī of the northern mārga. Matsya 124.55 states the three asterisms explicitly. Homonym caution: Airāvatī is also a river name in Matsya 114.21 and 115.19, and Airāvata elsewhere is Indra&#x27;s elephant."}]}, {"id": "arshabhi", "cat": "star-road", "dev": "आर्षभी", "dev_short": "आर्षभी", "iast": "Ārṣabhī", "modern": {"common_name": "the Bull-road", "bayer": "—", "constellation": "Leo (Pūrva- and Uttara-phalgunī, Maghā)"}, "conf": "likely", "see_also": ["margas"], "label": "आर्षभी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["purva-phalguni", "uttara-phalguni", "magha"], "galacticL": null, "plotnote": null, "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.56", "shloka": "पूर्वउत्तरफल्गुन्यौ मघा चैवार्षभी भवेत्।। १२४.५५ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Pūrva- and Uttara-phalgunī and Maghā — that would be Ārṣabhī.", "translator": "Literal rendering by the compiler", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "First vīthī of the middle (Jaradgava) mārga, per Matsya 124.56."}]}, {"id": "govithi", "cat": "star-road", "dev": "गोवीथी", "dev_short": "गोवीथी", "iast": "Govīthī", "modern": {"common_name": "the Cow-road", "bayer": "—", "constellation": "Pegasus/Pisces (Pūrva- and Uttara-proṣṭhapadā, Revatī)"}, "conf": "disputed", "see_also": ["margas"], "label": "गोवीथी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["purva-bhadrapada", "uttara-bhadrapada", "revati"], "galacticL": null, "plotnote": "Drawn on the Matsya reading. Varāhamihira&#x27;s Bṛhat Saṃhitā 9 instead makes Govīthī = Hasta, Citrā, Svāti.", "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.57", "shloka": "पूर्वोत्तरप्रोष्ठपदौ गोवीथी रेवती स्मृता।। १२४.५६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Pūrva- and Uttara-proṣṭhapadā and Revatī are remembered as Govīthī.", "translator": "Literal rendering by the compiler", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "Matsya 124.57 assigns it Pūrva/Uttara-proṣṭhapadā and Revatī. But Varāhamihira&#x27;s Bṛhat Saṃhitā 9 makes Govīthī = Hasta, Citrā, Svāti — a substantive Purāṇa-vs-Siddhānta divergence, not a scribal one. Both readings recorded."}]}, {"id": "jaradgava", "cat": "star-road", "dev": "जरद्गव / जारद्गवी", "dev_short": "जरद्गव", "iast": "Jaradgava / Jāradgavī", "modern": {"common_name": "the Old-Ox road", "bayer": "—", "constellation": "Aquila/Delphinus/Aquarius (Śravaṇa, Dhaniṣṭhā, Vāruṇa = Śatabhiṣaj)"}, "conf": "disputed", "see_also": ["margas"], "label": "जरद्गव", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["shravana", "dhanishtha", "shatabhishaj"], "galacticL": null, "plotnote": "Drawn on the Matsya reading (vāruṇa = Śatabhiṣaj). Bṛhat Saṃhitā 9 instead makes Jāradgavī = Viśākhā, Anurādhā, Jyeṣṭhā.", "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.52 (as mārga) and 124.57 (as vīthī)", "shloka": "श्रवणञ्च धनिष्ठा च वारुणञ्च जरद्‌गवम्।। १२४.५६ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Śravaṇa and Dhaniṣṭhā and Vāruṇa — that is Jaradgava.", "translator": "Literal rendering by the compiler", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "The name does double duty: Jaradgava is both the MIDDLE of the three great mārgas and the third vīthī within it (Matsya 124.57). Bṛhat Saṃhitā 9 instead makes Jāradgavī = Viśākhā, Anurādhā, Jyeṣṭhā. Note vāruṇa here is the asterism whose deity is Varuṇa, i.e. Śatabhiṣaj."}]}, {"id": "ajavithi", "cat": "star-road", "dev": "अजवीथी", "dev_short": "अजवीथी", "iast": "Ajavīthī", "modern": {"common_name": "the Goat-road — a three-nakṣatra segment of the ecliptic belt", "bayer": "—", "constellation": "Scorpius–Sagittarius (Mūla + both Aṣāḍhās) on one reading; Corvus–Virgo–Boötes (Hasta, Citrā, Svāti) on the other"}, "conf": "disputed", "see_also": ["vaishvanari", "margas", "pitryana-devayana"], "label": "अजवीथी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["mula", "purva-ashadha", "uttara-ashadha"], "galacticL": null, "plotnote": "Drawn on the Matsya 124.53 / Viṣṇu 2.8.85 reading (Mūla + both Aṣāḍhās). Matsya 124.58, in the same chapter, instead gives Hasta, Citrā and Svātī — the text contradicts itself.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.5; Viṣṇu Purāṇa 2.8.85; Matsya Purāṇa 124.53 and 124.58; Vāyu Purāṇa 50.130; Brahmāṇḍa Purāṇa 1,21.76", "shloka": "उत्तरं [य]दगस्त्यस्य अजवीथ्याश्च दक्षिणम् । पितृयानः स वै पन्था वैश्वानरपथाद्बहिः ॥ ८५ ॥ — cf. मत्स्य १२४.५८: हस्त चित्रा तथा स्वाती ह्यजवीथिरितिस्मृता।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_८"], "translation": "On the north of Agastya, and south of the line of the Goat, exterior to the Vaiswánara path, lies the road of the Pitris.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "A star-road, not a star. Brahmāṇḍa 2.21.76 &amp; 159, Matsya 124.53 and Viṣṇu P. 2.8.85 make it Mūla, Pūrvāṣāḍhā, Uttarāṣāḍhā — part of the Pitṛyāṇa. But Matsya 124.58, in the SAME chapter, makes it Hasta, Citrā, Svāti and reassigns Mūla + Aṣāḍhās to Vaiśvānarī. The 1916 translator flags 124.53/58 as corrupt and his rendering as &#x27;tentative only&#x27;. Varāhamihira&#x27;s Bṛhat Saṃhitā 9 gives yet another arrangement — a genuine Purāṇa-vs-Siddhānta divergence, not a copying slip. In Bhāgavata 5.23.5 it is placed on the back (pṛṣṭha) of the Śiśumāra."}]}, {"id": "mrigavithi", "cat": "star-road", "dev": "मृगवीथी", "dev_short": "मृगवीथी", "iast": "Mṛgavīthī", "modern": {"common_name": "the Deer-road", "bayer": "—", "constellation": "Libra/Scorpius (Jyeṣṭhā, Viśākhā, Maitra = Anurādhā)"}, "conf": "likely", "see_also": ["margas"], "label": "मृगवीथी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["jyeshtha", "vishakha", "anuradha"], "galacticL": null, "plotnote": null, "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.59", "shloka": "ज्येष्ठा विशाखा मैत्रञ्च मृगवीथी तथोच्यते।। १२४.५८ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Jyeṣṭhā, Viśākhā and Maitra — that is called Mṛgavīthī.", "translator": "Literal rendering by the compiler", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "Second vīthī of the southern (Vaiśvānara) mārga, Matsya 124.59. maitra = the asterism of Mitra, i.e. Anurādhā."}]}, {"id": "vaishvanari", "cat": "star-road", "dev": "वैश्वानरी", "dev_short": "वैश्वानरी", "iast": "Vaiśvānarī", "modern": {"common_name": "the road of Vaiśvānara (Fire)", "bayer": "—", "constellation": "Scorpius/Sagittarius (Mūla, Pūrva- and Uttara-āṣāḍhā)"}, "conf": "disputed", "see_also": ["ajavithi", "margas"], "label": "वैश्वानरी", "kind": "road", "ra": null, "dec": null, "mag": null, "road": ["mula", "purva-ashadha", "uttara-ashadha"], "galacticL": null, "plotnote": "Matsya 124.59 gives Vaiśvānarī the same three asterisms that 124.53 gives Ajavīthī, so the two roads are drawn on top of each other here. The contradiction is the text&#x27;s, not the chart&#x27;s.", "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.59", "shloka": "मूलं पूर्वोत्तराषाढ़े वीथी वैश्वानरी भवेत्।। १२४.५८ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "Mūla and the two Aṣāḍhās — that road would be Vaiśvānarī.", "translator": "Literal rendering by the compiler", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.274264"], "notes": "Southernmost vīthī, Matsya 124.59. Directly contradicts Matsya 124.53, which gives the same three asterisms to Ajavīthī. The 1916 translator marks both verses corrupt and his rendering &#x27;tentative only&#x27;."}]}, {"id": "margas", "cat": "star-road", "dev": "ऐरावत / जरद्गव / वैश्वानर (मार्गाः)", "dev_short": "ऐरावत", "iast": "Airāvata / Jaradgava / Vaiśvānara (the three mārgas)", "modern": {"common_name": "the three great celestial belts — northern, middle, southern", "bayer": "—", "constellation": "the three latitude-bands of the ecliptic, each subdivided into three vīthīs"}, "conf": "likely", "see_also": ["nagavithi", "gajavithi", "airavati", "arshabhi", "govithi", "jaradgava", "ajavithi", "mrigavithi", "vaishvanari"], "label": "ऐरावत", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "Three latitude belts, each holding three vīthīs — a framing structure rather than a place. The nine roads themselves are drawn on the chart.", "refs": [{"text": "Purāṇas", "citation": "Matsya Purāṇa 124.52; Vaiśvānara-patha also at Viṣṇu Purāṇa 2.8.85 and Vāyu Purāṇa 50.208", "shloka": "स्थानं जरद्‌गवं मध्ये तथैरावतमुत्तरम्। वैश्वानरं दक्षिणतो निर्दिष्टमिह तत्त्वतः।। १२४.५१ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/मत्स्यपुराणम्/अध्यायः_१२४"], "translation": "...the path (Márga) of the sun and other planets amongst the lunar asterisms is divided into three portions or Avasht́hánas, northern, southern, and central, called severally Airávata, Járadgava (Ajagava, Matsya P.), and Vaiswánara.", "translator": "H.H. Wilson (1840; public domain), note 21 to VP 2.8", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "The framing structure of the whole system: Airāvata = the northern belt, Jaradgava = the middle, Vaiśvānara = the southern; each contains three vīthīs, three nakṣatras apiece, 27 in all. This is what makes Viṣṇu P. 2.8.85 coherent — the Pitṛyāṇa can be both &#x27;south of Ajavīthī&#x27; and &#x27;outside the Vaiśvānara path&#x27; because Ajavīthī is a sub-road of the Vaiśvānara belt. Vaiśvānara-patha is thus a real, textually attested Purāṇic sky-region name."}]}, {"id": "pitryana-devayana", "cat": "star-road", "dev": "पितृयाण / देवयान", "dev_short": "पितृयाण", "iast": "Pitṛyāṇa / Devayāna", "modern": {"common_name": "the Road of the Fathers / the Road of the Gods — two celestial bands defined by star markers", "bayer": "—", "constellation": "Pitṛyāṇa: north of Canopus and south of Ajavīthī. Devayāna: north of Nāgavīthī (Aries/Taurus) and south of Ursa Major"}, "conf": "likely", "see_also": ["agastya", "ajavithi", "nagavithi", "saptarshi"], "label": "पितृयाण", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "Two bands defined by their boundary markers (Agastya and Ajavīthī; Nāgavīthī and the Saptarṣi) rather than by stars of their own.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.8.85 and 2.8.90; Vāyu Purāṇa 50.208 and 50.216; Matsya Purāṇa 124.97; Brahmāṇḍa Purāṇa 1,21.168-169", "shloka": "उत्तरं [य]दगस्त्यस्य अजवीथ्याश्च दक्षिणम् । पितृयानः स वै पन्था वैश्वानरपथाद्बहिः ॥ ८५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_८"], "translation": "On the north of Agastya, and south of the line of the Goat, exterior to the Vaiswánara path, lies the road of the Pitris. / The path of the gods lies to the north of the solar sphere, north of the Nágavithi, and south of the seven Rishis.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "Valuable for a star database because these are defined ASTRONOMICALLY, by named stellar boundary markers rather than by myth: Agastya (Canopus) and Ajavīthī bound the Pitṛyāṇa; Nāgavīthī and the Saptarṣis bound the Devayāna. Attested identically in three recensions."}]}, {"id": "akashaganga", "cat": "milky-way", "dev": "आकाशगङ्गा", "dev_short": "आकाशगङ्गा", "iast": "Ākāśagaṅgā", "modern": {"common_name": "the Milky Way (lit. 'sky-Ganges')", "bayer": "—", "constellation": "the galactic band"}, "conf": "likely", "see_also": ["chayapatha", "tripathaga", "shishumara"], "label": "आकाशगङ्गा", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 35.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.5 (Milky Way sense); contrast Viṣṇu Purāṇa 2.9.12, 2.9.14, 2.9.17 (celestial rain-water sense)", "shloka": "पृष्ठे त्वजवीथी आकाशगङ्गा चोदरत: ॥ ५ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "...and on the back of the Sisumara is the fore part of its right side, and in its womb is the celestial Ganges.", "translator": "J.M. Sanyal (1930s; public domain). Note that Sanyal renders udarataḥ &#x27;in its womb&#x27; and does not recognise Ajavīthī as a name.", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "In Bhāgavata 5.23.5 it lies on the belly (udara) of the Śiśumāra, placed among star-positions alongside Ajavīthī — that context makes the Milky Way reading secure. IMPORTANT CONTRAST: in Viṣṇu P. 2.9.12, 2.9.14 and 2.9.17 the same word means something else entirely — the celestial water that falls from a cloudless sky, a bath in which is &#x27;divya snāna&#x27;. So the Milky-Way sense is specifically the Bhāgavata&#x27;s. The Vāyu/Brahmāṇḍa/Matsya group does not use the word for the sky at all; its Milky Way term is chāyāpatha."}]}, {"id": "chayapatha", "cat": "milky-way", "dev": "छायापथ", "dev_short": "छायापथ", "iast": "Chāyāpatha", "modern": {"common_name": "the Milky Way (lit. 'the shadow-path')", "bayer": "—", "constellation": "the galactic band"}, "conf": "certain", "see_also": ["akashaganga", "tripathaga"], "label": "छायापथ", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 195.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Purāṇas", "citation": "Vāyu Purāṇa 47.28; Brahmāṇḍa Purāṇa 1,18.29; Matsya Purāṇa 121.29", "shloka": "दिविच्छायापथो यस्तु अनुनक्षत्रमण्डलम् । दृश्यते भास्वरो रात्रौ देवी त्रिपथगा तु सा ।। ४७.२८ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_४७"], "translation": "The shadow-path in the sky that runs along the circle of the nakṣatras, seen shining at night — she is the goddess Tripathagā.", "translator": "Literal rendering by the compiler; no public-domain published translation of this verse was located", "trans_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_४७"], "notes": "The clearest, least ambiguous Milky Way attestation in the whole Purāṇic corpus, and the term the Vāyu/Brahmāṇḍa/Matsya group actually uses: &#x27;the shadow-path in the sky that runs ALONG THE CIRCLE OF THE NAKṢATRAS, seen shining at night — that is the goddess Tripathagā.&#x27; Three independent witnesses. The description (a luminous band following the asterism-circle, visible at night) admits no other referent."}]}, {"id": "tripathaga", "cat": "milky-way", "dev": "त्रिपथगा", "dev_short": "त्रिपथगा", "iast": "Tripathagā", "modern": {"common_name": "the Milky Way, as the 'three-path-goer' (the Gaṅgā of the three worlds)", "bayer": "—", "constellation": "the galactic band"}, "conf": "certain", "see_also": ["akashaganga", "chayapatha"], "label": "त्रिपथगा", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 300.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Purāṇas", "citation": "Vāyu Purāṇa 47.28; Brahmāṇḍa Purāṇa 1,18.29; Matsya Purāṇa 121.29-30", "shloka": "दिविच्छायापथो यस्तु अनुनक्षत्रमण्डलम् । दृश्यते भास्वरो रात्रौ देवी त्रिपथगा तु सा ।। ४७.२८ ।।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_४७"], "translation": "...seen shining at night — she is the goddess Tripathagā.", "translator": "Literal rendering by the compiler", "trans_links": ["https://sa.wikisource.org/wiki/वायुपुराणम्/पूर्वार्धम्/अध्यायः_४७"], "notes": "Not a separate object but the identification supplied by the same verse: the chāyāpatha IS Tripathagā, i.e. the celestial Gaṅgā. This is the Purāṇic equation of the Milky Way with the sky-river, stated rather than inferred. Distinct from Mandākinī, which in these same texts is always a terrestrial Himalayan river and never a sky-object."}]}, {"id": "mandakini", "cat": "milky-way", "dev": "मन्दाकिनी", "dev_short": "मन्दाकिनी", "iast": "Mandākinī", "modern": {"common_name": "Milky Way", "bayer": "—", "constellation": "—"}, "conf": "likely", "see_also": ["akashaganga", "chayapatha", "tripathaga", "viyadganga", "svarnadi", "suradirghika"], "label": "मन्दाकिनी", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 80.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.1.116 (Svarga-varga)", "shloka": "मन्दाकिनी वियद्गङ्गा स्वर्णदी सुरदीर्घिका ॥ १.१.११६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The river of heaven.&#x27; Footnote: &#x27;The Ganges of the sky, suggested probably by the milky-way.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "First of four synonyms Amarasiṃha gives for the celestial river. Colebrooke&#x27;s own footnote reads that this is &#x27;The Ganges of the sky, suggested probably by the milky-way&#x27; — the equation is explicit in the earliest public-domain scholarship on the text. NOTE the contrast with the Purāṇic layer already on file, where Mandākinī is always a terrestrial Himalayan river and the Milky Way word is chāyāpatha."}]}, {"id": "viyadganga", "cat": "milky-way", "dev": "वियद्गङ्गा", "dev_short": "वियद्गङ्गा", "iast": "Viyadgaṅgā", "modern": {"common_name": "Milky Way", "bayer": "—", "constellation": "—"}, "conf": "likely", "see_also": ["mandakini", "akashaganga"], "label": "वियद्गङ्गा", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 135.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.1.116 (Svarga-varga)", "shloka": "मन्दाकिनी वियद्गङ्गा स्वर्णदी सुरदीर्घिका ॥ १.१.११६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The river of heaven.&#x27; Footnote: &#x27;The Ganges of the sky, suggested probably by the milky-way.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "&#x27;Ganges of the firmament&#x27; (viyat). Second synonym in the same verse. Note the form is viyad-, not the vyoma- that secondary literature often reports."}]}, {"id": "svarnadi", "cat": "milky-way", "dev": "स्वर्णदी", "dev_short": "स्वर्णदी", "iast": "Svarnadī", "modern": {"common_name": "Milky Way", "bayer": "—", "constellation": "—"}, "conf": "likely", "see_also": ["mandakini", "akashaganga"], "label": "स्वर्णदी", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 250.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.1.116 (Svarga-varga)", "shloka": "मन्दाकिनी वियद्गङ्गा स्वर्णदी सुरदीर्घिका ॥ १.१.११६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The river of heaven.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "&#x27;River of heaven&#x27;. Third synonym in the same verse. The correct segmentation is svar+nadī (&#x27;heaven-river&#x27;), not svarṇa+dī (&#x27;gold-&#x27;)."}]}, {"id": "suradirghika", "cat": "milky-way", "dev": "सुरदीर्घिका", "dev_short": "सुरदीर्घिका", "iast": "Suradīrghikā", "modern": {"common_name": "Milky Way", "bayer": "—", "constellation": "—"}, "conf": "disputed", "see_also": ["mandakini", "akashaganga"], "label": "सुरदीर्घिका", "kind": "galactic", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": 340.0, "plotnote": "Pinned to the galactic equator, computed from the J2000 galactic pole. The band is where the Milky Way actually runs; the exact point along it is chosen only to place the label.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.1.116 (Svarga-varga)", "shloka": "मन्दाकिनी वियद्गङ्गा स्वर्णदी सुरदीर्घिका ॥ १.१.११६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;The river of heaven.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "&#x27;The gods&#x27; long water-course&#x27;. Fourth synonym in the same verse, and the one whose astronomical reference is weakest — it need mean no more than a celestial watercourse in the abstract."}]}, {"id": "vishnupada", "cat": "sky-region", "dev": "विष्णुपद", "dev_short": "विष्णुपद", "iast": "Viṣṇupada", "modern": {"common_name": "'the step of Viṣṇu' — the third and highest region of the sky, where Dhruva stands", "bayer": "—", "constellation": "the circumpolar region"}, "conf": "disputed", "see_also": ["dhruva", "saptarshi"], "label": "विष्णुपद", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "The zone above the Saptarṣi containing the pole — a region, not a star.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.8.98; Matsya Purāṇa 124.112; Brahmāṇḍa Purāṇa 1,21.176; Vāyu Purāṇa 50.221", "shloka": "ऊर्ध्वोत्तरमृषिभ्यस्तु ध्रुवो यत्र व्यवस्थितः । एतद्विष्णुपदं दिव्यं तृतीयं व्योम्नि भासुरम् ॥ ९८ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/विष्णुपुराणम्/द्वितीयांशः/अध्यायः_८"], "translation": "The space between the seven Rishis and Dhruva, the third region of the sky, is the splendid celestial path of Vishńu (Vishńupada).", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp066.htm"], "notes": "A named sky-REGION rather than a star: the zone above the Saptarṣis (Ursa Major) containing the pole. Attested in four recensions in near-identical wording. Homonym caution: Viṣṇupada is also a lake on Mt. Niṣadha (Matsya 121, Brahmāṇḍa 1,18.67)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.2.169 (Vyoma-varga)", "shloka": "वियद्विष्णुपदं वा तु पुंस्याकाशविहायसी ॥ १.२.१६९ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "Listed by Colebrooke under &#x27;The sky&#x27;.", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "IMPORTANT CORRECTIVE to the Purāṇic entry already on file: in the classical thesaurus viṣṇupada is simply a synonym of vyoman / ākāśa, &#x27;the sky&#x27;, not the circumpolar station the Purāṇas make of it. The lexicon therefore does NOT support treating Viṣṇupada as a star or a specific sky-region."}]}, {"id": "medhi", "cat": "sky-region", "dev": "मेढी / मेढीभूत", "dev_short": "मेढी", "iast": "Meḍhī / Meḍhībhūta", "modern": {"common_name": "'the threshing-post' — the celestial pole as the pivot to which the sky is tethered", "bayer": "—", "constellation": "the north celestial pole"}, "conf": "certain", "see_also": ["dhruva"], "label": "मेढी", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "The pole itself, as the post the sky is tethered to — a concept, not a separate star.", "refs": [{"text": "Purāṇas", "citation": "Bhāgavata Purāṇa 5.23.3; Matsya Purāṇa 125.5 and 127.27; Brahmāṇḍa Purāṇa 1,22.6 and 1,23.106; Vāyu Purāṇa 52.97; cf. Viṣṇu Purāṇa 2.7.10", "shloka": "यथा मेढीस्तम्भ आक्रमणपशव: संयोजितास्त्रिभिस्त्रिभि: सवनैर्यथास्थानं मण्डलानि चरन्त्येवं भगणा ग्रहादय एतस्मिन्नन्तर्बहिर्योगेन कालचक्र आयोजिता ध्रुवमेवावलम्ब्य ... ॥ ३ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/bhagp/bhp_05u.htm"], "translation": "Just as oxes, fastened to a post fixed in the centre of a threshing floor, leaving their own station, go round at shorter, middle or longer distances, — similarly fixed on the inside and outside of the circle of time, stars and planets exist, supporting themselves, on Dhruva.", "translator": "J.M. Sanyal (1930s; public domain); cf. Wilson on VP 2.7.10: &#x27;Dhruva (the pole-star), the pivot or axis of the whole planetary circle.&#x27;", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.187346"], "notes": "A technical term for the pole, built on a vivid agricultural image: as oxen tied to a central post tread out grain in circles, so the stars circle Dhruva. Bhāgavata 5.23.3 develops the simile at length (meḍhīstambha, &#x27;the post&#x27;, with the ākramaṇa-paśavaḥ, treading cattle); the Matsya/Brahmāṇḍa/Vāyu group uses meḍhībhūta as an epithet of Dhruva directly."}]}, {"id": "pravaha", "cat": "sky-region", "dev": "प्रवह", "dev_short": "प्रवह", "iast": "Pravaha", "modern": {"common_name": "the wind that carries the stars around the pole", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": [], "label": "प्रवह", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "The wind that turns the sky: the Purāṇic name for diurnal rotation, not an object in it.", "refs": [{"text": "Purāṇas", "citation": "Viṣṇu Purāṇa 2.12.28; Matsya Purāṇa 127.18; Brahmāṇḍa Purāṇa 1,23.98; Vāyu Purāṇa 52.89; Kūrma Purāṇa 1,41.27", "shloka": "yasmāj jyotīṃṣi vahati pravahas tena sa smṛtaḥ // ViP_2,12.28 //", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/3_purana/vipce_pu.htm"], "translation": "The air, which is called Pravaha, is so termed because it bears along the planets, which turn round, like a disc of fire, driven by the aerial wheel.", "translator": "H.H. Wilson (1840; public domain)", "trans_links": ["https://www.sacred-texts.com/hin/vp/vp070.htm"], "notes": "Not a star but the named mechanism of diurnal rotation, and the text supplies its own etymology: &#x27;because it bears (vahati) the lights, it is called Pravaha.&#x27; Included because it is the Purāṇic term for what modern astronomy calls the apparent rotation of the celestial sphere."}]}, {"id": "tarapatha", "cat": "sky-region", "dev": "तारापथः", "dev_short": "तारापथः", "iast": "Tārāpatha", "modern": {"common_name": "the firmament ('star-road')", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["chayapatha"], "label": "तारापथः", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "The Amarakośa&#x27;s word for the sky as the star-bearing region — a place, not a thing in it.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.2.171 (Vyoma-varga)", "shloka": "तारापथोऽन्तरिक्षं च मेघाध्वा च महाबिलम् ॥ १.२.१७१ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "Listed by Colebrooke under &#x27;The sky&#x27; (Book I, Ch. I, Sect. II).", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "NOT a star: the Vyoma-varga lists tārāpatha among synonyms of the sky, alongside antarikṣa, meghādhvan and mahābila. Recorded because it is the lexicon&#x27;s own term for the star-bearing region, and because it is easily confused with the Milky-Way words Chāyāpatha and Tripathagā already on file."}]}, {"id": "nakshatra-generic", "cat": "star-word", "dev": "नक्षत्रम्", "dev_short": "नक्षत्रम्", "iast": "Nakṣatra", "modern": {"common_name": "star / asterism (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["bha", "tara", "taraka", "udu", "dhishnya", "str", "rksha"], "label": "नक्षत्रम्", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.217 (Dig-varga); Nirukta 3.20", "shloka": "नक्षत्रमृक्षं भं तारा तारकाप्युडु वा स्त्रियाम् ॥ १.३.२१७ ॥ — cf. निरुक्त ३.२०: नक्षत्राणि नक्षतेर्गतिकर्मणः । नेमानि क्षत्राणि इति च ब्राह्मणम् ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;A star.&#x27; — Nirukta: &#x27;Naksatra (stars) is derived from (the root) nakṣ, meaning to go. There is also a Brahmana passage: These are not gold (na-kṣatrāṇi).&#x27;", "translator": "H.T. Colebrooke (1808); Lakshman Sarup (1921) for the Nirukta", "trans_links": ["https://archive.org/download/nighantuniruktao00yaskuoft/nighantuniruktao00yaskuoft_djvu.txt"], "notes": "Head-word of the six-fold synonym set for &#x27;star&#x27;. The lexicon treats nakṣatra, ṛkṣa, bha, tārā, tārakā and uḍu as fully interchangeable — which is why the separate entries for Ṛkṣāḥ and the rest form one lexical family. Yāska&#x27;s Nirukta 3.20 supplies the oldest etymology: from the root nakṣ &#x27;to go&#x27;, with the alternative Brāhmaṇa pun na imāni kṣatrāṇi."}]}, {"id": "bha", "cat": "star-word", "dev": "भम्", "dev_short": "भम्", "iast": "Bha", "modern": {"common_name": "star / asterism (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic"], "label": "भम्", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.217 (Dig-varga)", "shloka": "नक्षत्रमृक्षं भं तारा तारकाप्युडु वा स्त्रियाम् ॥ १.३.२१७ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;A star.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "The technical monosyllable used throughout siddhāntic astronomy for a nakshatra — bha-gaṇa (the asterism-circle), bha-cakra, bha-bheda, and the bhagrahayuti chapter-titles of Brahmagupta and Bhāskara. Amarakośa records it twice: as a synonym of &#x27;star&#x27; here, and in the Nānārtha-varga among the senses of dhiṣṇya and of dhruva."}]}, {"id": "tara", "cat": "star-word", "dev": "तारा", "dev_short": "तारा", "iast": "Tārā", "modern": {"common_name": "star (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic", "taraka"], "label": "तारा", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.217 (Dig-varga)", "shloka": "नक्षत्रमृक्षं भं तारा तारकाप्युडु वा स्त्रियाम् ॥ १.३.२१७ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;A star.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "The commonest classical word for a single star, and the element in the compound yoga-tārā (&#x27;junction star&#x27;) on which the whole nakshatra-identification enterprise rests."}]}, {"id": "taraka", "cat": "star-word", "dev": "तारका", "dev_short": "तारका", "iast": "Tārakā", "modern": {"common_name": "star (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic", "tara"], "label": "तारका", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.217 (Dig-varga); Arthaśāstra 9.4.26", "shloka": "नक्षत्रमृक्षं भं तारा तारकाप्युडु वा स्त्रियाम् ॥ १.३.२१७ ॥ — cf. (IAST) nakṣatram ati pṛcchantaṃ bālam artho &#x27;tivartate / artho hy arthasya nakṣatraṃ kiṃ kariṣyanti tārakāḥ // kaz09.4.26", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;A star.&#x27; — Arthaśāstra: &#x27;Wealth passes by the childish man who keeps asking about the asterism; for wealth is the asterism of wealth — what will the stars do?&#x27;", "translator": "H.T. Colebrooke (1808); the Arthaśāstra line rendered literally by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_kauTilya-arthazAstra.txt"], "notes": "Diminutive of tārā, and the word the Atharvaveda uses of Vicṛtau (tārake, &#x27;the two stars&#x27;) and Amarakośa of the Ilvalāḥ. Kauṭilya uses it in the sharpest ancient Indian statement against astral determinism, Arthaśāstra 9.4.26: &#x27;wealth is the asterism of wealth — what will the stars do?&#x27; (kiṃ kariṣyanti tārakāḥ)."}]}, {"id": "udu", "cat": "star-word", "dev": "उडु", "dev_short": "उडु", "iast": "Uḍu", "modern": {"common_name": "star / lunar mansion (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic"], "label": "उडु", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.217 (Dig-varga)", "shloka": "नक्षत्रमृक्षं भं तारा तारकाप्युडु वा स्त्रियाम् ॥ १.३.२१७ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;A star.&#x27;", "translator": "H.T. Colebrooke (1808)", "trans_links": ["https://archive.org/download/AmaraKosha/amara_english_colebrook_djvu.txt"], "notes": "Sixth member of the synonym set; Amarakośa notes it is optionally feminine (vā striyām). The base of uḍu-pati and uḍu-rāja, &#x27;lord of the asterisms&#x27; = the moon. Distinct from uḍupa &#x27;raft&#x27;, which the same lexicon records separately."}]}, {"id": "dhishnya", "cat": "star-word", "dev": "धिष्ण्यम्", "dev_short": "धिष्ण्यम्", "iast": "Dhiṣṇya", "modern": {"common_name": "asterism / star-station (generic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic"], "label": "धिष्ण्यम्", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 3.3.671 (Nānārtha-varga)", "shloka": "धिष्ण्यं स्थाने गृहे भेऽग्नौ भाग्यं कर्म शुभाशुभम् ॥ ३.३.६७१ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/तृतीयकाण्डम्"], "translation": "Literal rendering: &#x27;Dhiṣṇya [means] a place, a house, an asterism (bha), fire; bhāgya [means] deed, good or ill.&#x27;", "translator": "Literal rendering by the compiler (Colebrooke&#x27;s Nānārtha page is illegible in the available scan)", "trans_links": ["https://sa.wikisource.org/wiki/अमरकोशः/तृतीयकाण्डम्"], "notes": "The Nānārtha-varga lists four senses: &#x27;place&#x27;, &#x27;house&#x27;, bha (= asterism), &#x27;fire&#x27;. The semantic chain place &gt; station &gt; asterism is the Vedic dhiṣṇya (fire-hearth) applied to the lunar mansions, and is the lexicographical warrant for reading dhiṣṇya as a star-word in kāvya."}]}, {"id": "str", "cat": "star-word", "dev": "स्तृभिः", "dev_short": "स्तृभिः", "iast": "Stṛbhiḥ (stem stṛ)", "modern": {"common_name": "the stars (generic, Vedic)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic", "rksha"], "label": "स्तृभिः", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A word for &#x27;star&#x27; rather than the name of one. Kept in the database because the vocabulary is itself evidence — tārā is the element in yoga-tārā, &#x27;junction star&#x27;, on which every identification here depends.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Nirukta 3.20 (on Nighaṇṭu 3)", "shloka": "ऋक्षाः स्तृभिरिति नक्षत्राणाम् । ... स्तृभिस्तीर्णानीव ख्यायन्ते । ... पश्यन्तो द्यामिव स्तृभिः ।", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/निरुक्तशास्त्रम्/तृतीयोध्यायः"], "translation": "&#x27;Rksāh and strbhih are (synonyms) of stars.&#x27; ... &#x27;Strbhih (stars) appear to be scattered (in the sky).&#x27; ... &#x27;Looking at the sky with stars, as it were.&#x27;", "translator": "Lakshman Sarup (1921)", "trans_links": ["https://archive.org/download/nighantuniruktao00yaskuoft/nighantuniruktao00yaskuoft_djvu.txt"], "notes": "The oldest Sanskrit word for &#x27;stars&#x27;, and the one the Nighaṇṭu pairs with ṛkṣāḥ. Yāska derives it from stṛ &#x27;to scatter/strew&#x27; — &#x27;they appear as if strewn&#x27;. Cognate with Greek astēr, Latin stella, English star. Attested at RV 4.7.3, quoted by Yāska."}]}, {"id": "yogatara-catalog", "cat": "collective", "dev": "अश्विन्यादीनां साभिजितां योगताराः", "dev_short": "अश्विन्यादीनां साभिजितां योगताराः", "iast": "Aśvinyādi yogatārāḥ (sābhijit)", "modern": {"common_name": "collective catalog of 28 junction stars", "bayer": "various", "constellation": "various (zodiacal belt and beyond)"}, "conf": "likely", "see_also": [], "label": "अश्विन्यादीनां साभिजितां योगताराः", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A catalog of all 28 junction stars as a set (Bhāskara&#x27;s dhruva/śara table) — not a single point.", "refs": [{"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra vv.1-6; cf. Golādhyāya, Dṛkkarmavāsanā v.12", "shloka": "अष्टौ नखा गजगुणाः खशरास्त्रिषट्काः सप्तर्तवस्त्रिनव चाङ्गदशोऽष्टकाष्ठाः । गोऽकस्तथाद्रिमनवः शरबाणचन्द्राः खात्यष्टयस्त्रिधृतयो नवनन्दचन्द्राः ।।१।। अर्काधिनो जिनयमा नवबाहुदस्राः कब्ध्यश्चिनो जलधितत्त्वमिताश्च भागाः । षटयश्विनश्वपवनोत्कृतयोऽष्ट्रभानिखाडूश्विनी नखगुणा रसदन्तसंख्याः ॥२॥ सप्तामराः खमिति भध्रुवका निरुक्ता दृकर्मणायनभवेन सहाश्विधिष्ण्यात् । ब्रह्माग्निभधुवलवा रदलितिकोना मैत्रन्द्रयोद्वर्यधिपभस्य च सेषुलिसाः ॥३॥ [vv.1-3, dhruvakas; verbatim from unproofread OCR — several word-numerals visibly garbled] … दिशोऽकश्च सार्धाब्धयः सार्धवेदा दशेशा रसाः खं स्वराः खं च सूर्याः । त्रिचन्द्राः कुचन्द्रा विपादौ च दस्रौ तुरङ्गाग्नयः सत्रिभागं च रूपम् ॥४॥ विपादं द्वयं सार्थरामाश्च सार्धा गजाः सत्रिभागेषवो मार्गणाश्च । द्विषष्टिः खरामाश्च षड्वर्गसंख्यास्त्रिभागो जिना उत्कृतिः खं च भानाम् ॥५॥ निरुक्ताः स्फुटा योगताराशरांशास्त्रय ब्रह्मधिष्ण्याद्विशाखादिषट्कम् । करो वारुणं त्वाष्ट्रभं सार्पमेषां शरा दक्षिणा उत्तराः शेषभानाम् ।॥६॥ [vv.4-6, śaras]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/346", "https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/348"], "translation": "No public-domain translation of these Gaṇitādhyāya verses exists online. Bhāskara&#x27;s own conception of this catalog is however translated in the public-domain 1861 rendering of Golādhyāya, Dṛkkarma-vāsanā v.12: &#x27;12. As the constellations are fixed their latitudes as given in the books of these curly [read: early] astronomers are the bpasuat-b&#x27;aras [read: spashta-śaras], i.e. tho reduced values of the latitudes so as to render them fit to be added to or subtracted from the declination; and tho dhkuvas [read: dhruvas] or longitude of these constellations are given, after being corrected by tho ayana drtkkakma [read: drikkarma] so as to suit those corrected latitudes that is, the star will appear to rise at the equator at the same time with longitude found by the correction.&#x27; [verbatim from OCR of the 1861 edition, bracketed restorations of obvious OCR errors added]", "translator": "Lancelot Wilkinson, revised by Bapu Deva Sastri (1861), public domain (for Golādhyāya IX.12); Gaṇitādhyāya vv.1-6 values paraphrased from Arkasomayaji.", "trans_links": ["https://archive.org/details/in.ernet.dli.2015.46927"], "notes": "Bhāskara gives the polar longitudes (vv.1-3) and rectified latitudes (vv.4-6) of all 28 yogatārās in bhūtasaṅkhyā word-numerals, stating (bhāṣya) that Kṛttikā and Rohiṇī are to be diminished by 32&#x27; and Viśākhā, Anurādhā, Jyeṣṭhā increased by 5&#x27;: &#x27;कृत्तिकारोहिणीनक्षत्रयोद्वत्रिशत्कलोनाः । विशाखानुराधाज्येष्ठानां कलापञ्चकेनाधिका ध्रुवकभागा वेदितव्याः&#x27; (sa.wikisource p.347). Per Arkasomayaji the base values are Brahmagupta&#x27;s, copied also by Śrīpati. Standard traditional identifications for the brightest members, as printed in the public-domain 1861 volume (Sūrya Siddhānta portion, pp.63-68): Svātī = Arcturus, Citrā = Spica, Jyeṣṭhā = Antares, Punarvasu = β Geminorum, Rohiṇī = Aldebaran (α Tauri), Maghā = Regulus, Kṛttikā = Pleiades (η Tauri), Hasta = δ Corvi, Śravaṇa = α Aquilae, Dhaniṣṭhā = α Delphini, Viśākhā = α Librae, Aśvinī = α(β) Arietis, Revatī = ζ Piscium. Individual per-star numeric values in the online OCR tables are too corrupted to transcribe reliably."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Brāhmasphuṭasiddhānta, Bhagrahayutyadhikāra 3–9; Pañcasiddhāntikā XIV.34–38", "shloka": "सौम्या दशकं विषया याम्याः शरदशभवा रसाः सौम्याः । खं सप्तदक्षिणाः खं सौम्याः सूर्यत्रयोदशकाः ॥ ५ ॥ दक्षिणतो भवयमलाः सप्तत्रिंशदुदगंशका याम्याम् । अध्यर्धत्रिचतुष्कार्धनवमसप्त्यंशविषयशराः ॥ ६ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://archive.org/download/Brahmasphutasiddhanta/Brahmasphutasiddhanta_djvu.txt"], "translation": "No public-domain translation of the BSS chapter exists; these verses encode the polar latitudes of the 27 junction-stars in bhūtasaṅkhyā word-numerals with the direction attached (saumya = north, yāmya = south). For the Pañcasiddhāntikā, Thibaut renders XIV.34–37: &#x27;34. (The junction-star) of krittika is at the end of the sixth degree (of the nakshatra), and three and a half hastas to the north of the ecliptic; that of Rohiṇī is at the end of the eighth degree, and five and a half hastas to the south... 37. Of Chitrā (the yogatara is) at seven and a half degrees, three hastas to the south.&#x27;", "translator": "Paraphrase by the compiler for the BSS; G. Thibaut &amp; Sudhakara Dvivedi (1889) for the Pañcasiddhāntikā", "trans_links": ["https://archive.org/download/wg1078/WG1078-1889%20-The%20Panchasiddhantika%20-%20The%20Astronomical%20Work%20Of%20Varaha%20Mihira_djvu.txt"], "notes": "THIS IS THE TABLE BHĀSKARA COPIED — and the edition&#x27;s commentary says so outright: &#x27;these very dhruvāṃśas of Aśvinī and the rest were read out by Bhāskara too, in his own Bhagrahayutyadhikāra.&#x27; BSS 10.3–4 give the polar longitudes as degrees within a sign (Aśvinī 8° Aries, Bharaṇī 20° Aries, Kṛttikā 8° Taurus less 32&#x27;, Rohiṇī 20° Taurus less 32&#x27;, Mṛgaśīrṣa 13° Gemini, Ārdrā 7° Gemini, Punarvasu 3° Cancer, Puṣya 16° Cancer, Āśleṣā 18° Cancer, Maghā 9° Leo, P. Phalgunī 27° Leo, U. Phalgunī 5° Virgo, Hasta 20° Virgo, Citrā 3° Libra, Svātī 19° Libra…); 10.5–7 give the latitudes and 10.8–9 the minute-corrections. Only 27 are tabulated. Burgess: &#x27;With it, so far as the longitude is concerned, exactly accord the Brahma-Siddhanta, as reported by Colebrooke, and the Khanda-Kataka, as reported by al-Biruni... but the latitudes of the Khanda-Kataka often vary considerably from both.&#x27; SEPARATELY, the Pañcasiddhāntikā gives coordinates for only SEVEN yogatārās (XIV.34–37: Kṛttikā, Rohiṇī, Punarvasu, Puṣya, Āśleṣā, Maghā, Citrā), in hastas rather than degrees, and they diverge widely from the Sūrya Siddhānta&#x27;s; Thibaut: &#x27;Why Varāha Mihira should have confined himself to stating the longitudes and latitudes of seven junction stars only, remains unaccounted for. Possibly the Manuscripts are defective just at that place.&#x27;"}]}, {"id": "dakshayanyah", "cat": "collective", "dev": "दाक्षायिण्यः", "dev_short": "दाक्षायिण्यः", "iast": "Dākṣāyaṇyaḥ", "modern": {"common_name": "the 27 lunar mansions collectively", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-generic"], "label": "दाक्षायिण्यः", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A collective name for all 27 nakshatras — &#x27;the daughters of Dakṣa&#x27;.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Amarakośa 1.3.218 (Dig-varga)", "shloka": "दाक्षायिण्योऽश्विनीत्यादितारा अश्वयुगश्विनी ॥ १.३.२१८ ॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अमरकोशः/प्रथमकाण्डम्"], "translation": "&#x27;Asterisms.&#x27; Footnote: on of a Citraśikhaṇḍin&#x27; (i.e. of Aṅgiras, one of the seven)."}]}, {"id": "ashtavimshati-nakshatrani", "cat": "collective", "dev": "अष्टाविंशतिनक्षत्राणि", "dev_short": "अष्टाविंशतिनक्षत्राणि", "iast": "Aṣṭāviṃśati-nakṣatrāṇi", "modern": {"common_name": "the 28-fold nakshatra circle (Buddhist)", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["nakshatra-catur-dvarika"], "label": "अष्टाविंशतिनक्षत्राणि", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "The Buddhist 28-fold list as a set; its per-asterism star-counts and figures are recorded on each nakshatra&#x27;s own entry.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 46 (Mukhopadhyaya ed.)", "shloka": "kṛttikā rohiṇī mṛgaśirā ārdrā punarvasuḥ puṣyaḥ aśleṣā maghā pūrvaphalgunī uttaraphalgunī hastā citrā svātī viśākhā anurādhā jyeṣṭhā mūlā pūrvāṣāḍhā uttarāṣāḍhā abhijit śravaṇā dhaniṣṭhā śatabhiṣā pūrvabhādrapadā uttarabhādrapadā revatī aśvinī bharaṇī / ity etāni bhoḥ puṣkarasārinn aṣṭāviṃśati-nakṣatrāṇi/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;Kṛttikā, Rohiṇī, Mṛgaśirā, Ārdrā, Punarvasu, Puṣya, Aśleṣā, Maghā, Pūrvaphalgunī, Uttaraphalgunī, Hastā, Citrā, Svātī, Viśākhā, Anurādhā, Jyeṣṭhā, Mūlā, Pūrvāṣāḍhā, Uttarāṣāḍhā, Abhijit, Śravaṇā, Dhaniṣṭhā, Śatabhiṣā, Pūrvabhādrapadā, Uttarabhādrapadā, Revatī, Aśvinī, Bharaṇī — these, sir Puṣkarasārin, are the twenty-eight nakshatras.&#x27;", "translator": "Literal rendering by the compiler (no public-domain translation of this chapter exists; Cowell &amp; Neil 1886 is an edition without translation)", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "The Buddhist canonical list, enumerated from Kṛttikā (not Aśvinī) and explicitly counted as 28 with Abhijit included — the same archaic starting-point as the Vedic lists on file. This is the frame for the star-count and figure data that the same chapter supplies for every asterism, and which is recorded on each nakshatra&#x27;s own entry."}]}, {"id": "nakshatra-catur-dvarika", "cat": "collective", "dev": "चतुर्द्वारिकाणि नक्षत्राणि", "dev_short": "चतुर्द्वारिकाणि नक्षत्राणि", "iast": "Catur-dvārikāṇi nakṣatrāṇi", "modern": {"common_name": "the 28 nakshatras in four gate-groups of seven", "bayer": "—", "constellation": "—"}, "conf": "certain", "see_also": ["ashtavimshati-nakshatrani"], "label": "चतुर्द्वारिकाणि नक्षत्राणि", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "A structural scheme — the 28 asterisms in four gate-groups of seven, one per direction — rather than a place in the sky.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), pp. 47–52; Mahāmāyūrī-vidyārājñī (Takubo ed. pp. 50–52)", "shloka": "amīṣāṃ bhoḥ puṣkarasārin saptānāṃ nakṣatrāṇāṃ pūrva-dvārikāṇāṃ kṛttikā prathamā nāmāśleṣā paścimā nāma/ ... dakṣiṇa-dvārikāṇāṃ maghā prathamā nāma viśākhā paścimā nāma/ ... paścimadvārikāṇāṃ ... anurādhā prathamā nāma śravaṇā paścimā nāma/ ... uttara-dvārikāṇāṃ dhaniṣṭhā prathamā nāma bharaṇī paścimā nāma/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_mahAmAyUrIvidyArAjJI.txt"], "translation": "Literal rendering (Mahāmāyūrī): &#x27;Kṛttikā and Rohiṇī, Mṛgaśiras, Ārdrā, Punarvasu, Puṣya endowed with good fortune, and Aśleṣā is the seventh. These seven asterisms are stationed at the eastern gate; they guard and protect the eastern quarter.&#x27; ... &#x27;The twenty-eight asterisms stand seven by seven in the [four] directions.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_mahAmAyUrIvidyArAjJI.txt"], "notes": "A structural scheme attested independently in two Buddhist texts: the 28 are divided into four sevens &#x27;stationed at the gates&#x27; of the four directions — Kṛttikā–Aśleṣā (east), Maghā–Viśākhā (south), Anurādhā–Śravaṇā (west), Dhaniṣṭhā–Bharaṇī (north). The Mahāmāyūrī makes each seven the guardian of its quarter. Note the boundaries fall between Aśleṣā/Maghā and between Śravaṇā/Dhaniṣṭhā, i.e. near the old solstitial colures — the same division the Vedāṅga Jyotiṣa&#x27;s Śraviṣṭhā/Sārpa solstices imply."}]}, {"id": "taragraha", "cat": "collective", "dev": "ताराग्रहाः", "dev_short": "ताराग्रहाः", "iast": "Tārāgrahāḥ", "modern": {"common_name": "the five star-planets", "bayer": "Mercury, Venus, Mars, Jupiter, Saturn", "constellation": "—"}, "conf": "certain", "see_also": ["tara"], "label": "ताराग्रहाः", "kind": "figure", "ra": null, "dec": null, "mag": null, "road": null, "galacticL": null, "plotnote": "&#x27;The star-seizers&#x27;: the five planets, which move and so cannot be charted at fixed points.", "refs": [{"text": "Lexicons, Nirukta & Buddhist", "citation": "Mahāmāyūrī-vidyārājñī (Takubo ed. p. 52)", "shloka": "aṣṭāviṃśati nakṣatrāḥ saptasapta diśi sthitāḥ. tārāgrahās tathā pañca rāhuketuś ca saptamaḥ, mahātejo mahābalo maharddhikā mahātapāḥ. sūryacandramasau caiva saptatriṃśad anūnakāḥ,", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_mahAmAyUrIvidyArAjJI.txt"], "translation": "Literal rendering: &#x27;The twenty-eight asterisms stand seven by seven in the directions; likewise the five star-planets, and Rāhu-Ketu as the seventh — of great splendour, great strength, great power, great austerity; and the sun and moon: thirty-seven, none lacking.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_mahAmAyUrIvidyArAjJI.txt"], "notes": "&#x27;The star-seizers&#x27; — the technical term distinguishing the five planets from the luminaries. Recorded because it shows tārā being used of planets as well as fixed stars, a distinction this database should keep explicit. The same passage counts thirty-seven bodies in all: 28 nakshatras + 5 tārāgrahas + Rāhu + Ketu + sun + moon."}]}], "about": "<p>Every mark on this chart is an entry in a hand-built database of star names drawn from primary Sanskrit texts, spanning roughly 1500 BCE to 1150 CE. Positions are modern J2000 coordinates for the star each verse is understood to name; marker size grows with apparent brightness.</p><p><b>How to read the marks.</b> Filled circles and diamonds are single stars. Dashed rings are asterisms — groups of stars, plotted at the group's position. Dashed gold lines are the Purāṇic <i>star-roads</i> (vīthī), each drawn through its own three nakshatras. The soft band is the Milky Way, computed as the galactic equator from the J2000 galactic pole; the three Sanskrit names for it sit on that band.</p><p><b>What is deliberately not plotted.</b> The Purāṇas name many positions on the body of the Śiśumāra, the celestial porpoise, but never say which visible star any of them is. Those names are in the Index rather than pinned to a guess — every limb-to-star chart in circulation is modern reconstruction. The same goes for named sky-regions (Viṣṇupada, the mārgas) and for Bhāskara's collective star-catalog.</p><p><b>What the texts actually give.</b> The Vedic texts name asterisms and deities but never coordinates; the siddhāntas give a position for one junction star (yogatārā) per nakshatra. Modern equations rest on those siddhāntic positions — chiefly Burgess's 1860 analysis of the Sūrya Siddhānta — and on continuous tradition. The <i>confidence</i> badge on each entry records where that chain is firm and where scholars disagree.</p><p><b>Two findings worth stating plainly.</b> The Āryabhaṭīya names no individual stars at all — verified against both W.E. Clark's 1930 translation and the full Sanskrit text — so it contributes nothing here. And the Ṛgveda names almost none: an exhaustive search of the Aufrecht text yields only the Bears (ṛkṣāḥ), the archaic Aghā and Arjunī of the wedding hymn, and Tiṣya twice. Its Agastya is always the sage, never Canopus.</p><p><b>Sources.</b> Sanskrit copied verbatim from Sanskrit Wikisource and GRETIL; translations are public-domain (Burgess 1860, Iyer 1884, Keith 1914/1920, Eggeling 1882, Whitney 1905, Griffith 1896, Oldenberg 1886, Wilson 1840, Colebrooke 1805, Sanyal 1930s, Wilkinson &amp; Sastri 1861). Copyrighted translations are paraphrased and cited, never quoted. Where no published translation exists, the rendering is labelled as the compiler's own.</p><p>Full database with every caveat, and the Śiśumāra mapping table: <code>docs/star-names/</code> in the repository (README.md and star-names.json).</p>"};
