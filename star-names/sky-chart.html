<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanskrit Star Names — Sky Chart</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1e;
    --panel: #121a30;
    --panel-t: rgba(16, 23, 43, 0.88);
    --ink: #e9eef8;
    --ink-2: #9aa6c0;
    --ink-3: #5d6a88;
    --line: #232f4d;
    --grid: #1b2540;
    --grid-strong: #263454;
    --c-nakshatra: #c98500;
    --c-individual: #3987e5;
    --c-saptarshi: #d55181;
    --c-vedic: #008300;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --deva: "Noto Sans Devanagari", "Devanagari MT", "Mangal", var(--sans);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  #app { position: fixed; inset: 0; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 20;
    max-width: min(430px, calc(100vw - 32px));
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  #hud h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  #hud h1 .dev { font-family: var(--deva); font-weight: 600; }
  #hud .sub {
    color: var(--ink-2);
    font-size: 11.5px;
    margin-top: 3px;
    line-height: 1.45;
  }
  #legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3.5px 10px 3.5px 7px;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color 120ms, color 120ms, opacity 120ms;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip:focus-visible, button:focus-visible, .marker:focus-visible { outline: 2px solid var(--c-individual); outline-offset: 2px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .dot.diamond { border-radius: 2px; transform: rotate(45deg) scale(0.92); }
  .chip .dot.ring { background: transparent !important; border: 1.6px solid; }
  .chip.off { opacity: 0.38; }
  .chip.off .dot { background: var(--ink-3) !important; }
  .chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #tools .chip { padding: 3.5px 10px; }
  #tools .chip.active { border-color: var(--ink-2); color: var(--ink); }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: absolute; z-index: 30; pointer-events: none;
    background: var(--panel-t);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 11px;
    max-width: 260px;
    opacity: 0; transition: opacity 90ms;
    box-shadow: 0 6px 22px rgba(0,0,0,0.5);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tdev { font-family: var(--deva); font-size: 16px; line-height: 1.3; }
  #tooltip .tiast { color: var(--ink-2); font-size: 11.5px; font-style: italic; }
  #tooltip .tmod { font-size: 12px; margin-top: 3px; }
  #tooltip .tmore { color: var(--ink-3); font-size: 10.5px; margin-top: 3px; }
  #tooltip .cat { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---------- drawer ---------- */
  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(430px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    transform: translateX(102%);
    transition: transform 200ms ease;
    display: flex; flex-direction: column;
    box-shadow: -12px 0 40px rgba(0,0,0,0.5);
  }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #drawer { transition: none; }
    #tooltip { transition: none; }
  }
  #drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    flex: none;
  }
  #drawer header .htitle { font-family: var(--serif); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  #drawer header button {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  #drawer header button:hover { color: var(--ink); border-color: var(--ink-3); }
  #drawer .body { overflow-y: auto; padding: 4px 16px 28px; }

  .entry { padding: 14px 0 18px; }
  .entry + .entry { border-top: 1px solid var(--line); }
  .entry h2 { font-family: var(--deva); font-size: 26px; font-weight: 600; line-height: 1.25; }
  .entry .iast { color: var(--ink-2); font-style: italic; font-size: 14px; }
  .entry .modline { margin-top: 8px; font-size: 13.5px; }
  .entry .modline b { font-weight: 600; }
  .entry .modline .sep { color: var(--ink-3); padding: 0 5px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .badge {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    border-radius: 4px; padding: 2.5px 7px; border: 1px solid var(--line); color: var(--ink-2);
  }
  .badge.cat { border: none; color: #0a0f1e; font-weight: 600; }
  .badge.conf-disputed { border-style: dashed; }
  .plotnote { margin-top: 8px; color: var(--ink-3); font-size: 11.5px; font-style: italic; }
  .ref { margin-top: 14px; }
  .ref .cite { font-weight: 600; font-size: 13px; }
  .ref .links { margin: 2px 0 6px; font-size: 11.5px; }
  .ref .links a { color: var(--c-individual); text-decoration: none; }
  .ref .links a:hover { text-decoration: underline; }
  .ref .links .lsep { color: var(--ink-3); padding: 0 4px; }
  .shloka {
    font-family: var(--deva);
    font-size: 14.5px; line-height: 1.85;
    background: rgba(201, 133, 0, 0.06);
    border-left: 2px solid var(--c-nakshatra);
    border-radius: 0 6px 6px 0;
    padding: 9px 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  /* Buddhist Sanskrit is edited in IAST; the Devanagari face has nothing to set. */
  .shloka.roman { font-family: inherit; font-size: 13px; line-height: 1.7; }
  /* Stands where a verse would, for sources that have none (al-Bīrūnī's Arabic). */
  .noshloka {
    font-size: 12px; line-height: 1.6; color: var(--ink-3); font-style: italic;
    border-left: 2px dashed var(--ink-3);
    border-radius: 0 6px 6px 0;
    padding: 8px 12px;
  }
  .trans { margin-top: 7px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); font-style: italic; }
  .transby { margin-top: 3px; font-size: 11px; color: var(--ink-3); }
  .ref details { margin-top: 6px; }
  .ref summary { font-size: 11px; color: var(--ink-3); cursor: pointer; letter-spacing: 0.04em; }
  .ref details p { font-size: 11.5px; color: var(--ink-2); line-height: 1.55; margin-top: 5px; }
  .seealso { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seealso .lbl { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; }

  /* index list */
  .ix-cat { margin-top: 14px; }
  .ix-cat h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .ix-cat h3 .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ix-row {
    display: flex; align-items: baseline; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 5px 4px; border-radius: 6px;
    font-family: var(--sans); color: var(--ink);
  }
  .ix-row:hover { background: rgba(255,255,255,0.05); }
  .ix-row .dev { font-family: var(--deva); font-size: 14.5px; }
  .ix-row .im { color: var(--ink-3); font-size: 11.5px; margin-left: auto; text-align: right; }
  .about p { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; margin-top: 10px; }
  .about p b { color: var(--ink); }
  .about a { color: var(--c-individual); text-decoration: none; }
  .about a:hover { text-decoration: underline; }

  /* credits */
  #credits {
    position: absolute; right: 16px; bottom: 6px; z-index: 10;
    font-size: 10px; color: var(--ink-3);
    text-align: right; pointer-events: none; line-height: 1.4;
  }

  /* svg text */
  .axis-lab { fill: var(--ink-3); font-size: 10.5px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .line-lab { fill: var(--ink-3); font-size: 10px; font-family: var(--sans); letter-spacing: 0.06em; }
  .star-lab {
    font-family: var(--deva); font-size: 11px;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .road-lab {
    font-family: var(--deva); font-size: 10px; opacity: 0.9;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
    pointer-events: none;
  }
  .marker { cursor: pointer; }

  @media (max-width: 700px) {
    #hud { max-width: calc(100vw - 24px); left: 12px; top: 10px; padding: 9px 10px 7px; }
    #hud .sub { display: none; }
    #hud h1 { font-size: 15px; }
    #credits { display: none; }
    /* keep the legend to one scrollable row instead of seven stacked ones */
    #legend {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #legend::-webkit-scrollbar { display: none; }
    #legend .chip { flex: 0 0 auto; font-size: 11px; padding: 3px 8px; }
    #legend .chip .n { display: none; }
  }
</style>

<div id="app">
  <svg id="sky" role="img" aria-label="Sky chart of Sanskrit star names on a rectangular right-ascension / declination grid"></svg>

  <header id="hud">
    <h1><span class="dev">तारानामानि</span> · Sanskrit Star Names, Charted</h1>
    <div class="sub" id="subline"></div>
    <div id="legend" role="group" aria-label="Category filters"></div>
    <div id="tools">
      <button class="chip active" id="btn-labels" aria-pressed="true">Labels</button>
      <button class="chip" id="btn-index">Index</button>
      <button class="chip" id="btn-about">About &amp; caveats</button>
    </div>
  </header>

  <div id="tooltip" role="status"></div>

  <aside id="drawer" aria-hidden="true">
    <header>
      <span class="htitle" id="drawer-title">Details</span>
      <button id="drawer-close" aria-label="Close panel">✕</button>
    </header>
    <div class="body" id="drawer-body"></div>
  </aside>

  <footer id="credits">
    J2000 positions · marker size ∝ apparent brightness · equirectangular RA/Dec grid<br>
    Sanskrit: sa.wikisource.org &amp; GRETIL · translations: Burgess 1860, Iyer 1884, Keith, Eggeling, Whitney, Oldenberg
  </footer>
</div>

.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, HORSE&#x27;S-HEAD-shaped (turagaśīrṣa-saṃsthāna), deity Gandharva, gotra Maitrāyāṇīya. Two stars in a horse&#x27;s head = β and γ Arietis, exactly the pair Burgess argued for against Colebrooke&#x27;s α Arietis, and matching Colebrooke&#x27;s own &#x27;The head of Aries&#x27; for Amarakośa. NOTE the deity Gandharva where the Brahmanical lists have the Aśvins."}]}, {"id": "bharani", "cat": "nakshatra", "dev": "भरणी", "dev_short": "भरणी", "iast": "Bharaṇī", "modern": {"common_name": "35 Arietis (Musca Borealis)", "bayer": "35 Arietis", "constellation": "Aries"}, "conf": "disputed", "see_also": [], "label": "भरणी", "kind": "star", "ra": 40.86, "dec": 27.71, "mag": 4.66, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Group = 35, 39, 41 Arietis (obsolete Musca Borealis). Burgess: the &#x27;southern&#x27; designation is ambiguous; 41 Ari (brighter, nearer ecliptic) &#x27;would seem more likely&#x27;, but &#x27;the defined position, however, agrees better with 35&#x27;, which he adopts. Many modern lists prefer 41 Arietis."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 51", "shloka": "bharaṇī-nakṣatraṃ tritāraṃ bhaga-saṃsthānaṃ triṃśan-muhūrta-yogaṃ tila-taṇḍūlāhāraṃ yamadaivataṃ bhārgavīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Bharaṇī asterism has three stars, is shaped like the bhaga, has a thirty-muhūrta conjunction, sesame and rice for its food, Yama for its deity, Bhārgavīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, bhaga-shaped (the female pudendum, i.e. a triangle), deity Yama, gotra Bhārgavīya. Three stars in a triangle = 35, 39, 41 Arietis — which settles that the asterism is the whole triad and makes Burgess&#x27;s agonising over which one is the yogatārā a question about the junction-star only. The bhaga figure explains the alternative name Apabharaṇī and the Yama/death associations."}]}, {"id": "krittika", "cat": "nakshatra", "dev": "कृत्तिका", "dev_short": "कृत्तिका", "iast": "Kṛttikā", "modern": {"common_name": "Alcyone (Pleiades)", "bayer": "η Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": ["krittika-seven"], "label": "कृत्तिका", "kind": "star", "ra": 56.87, "dec": 24.11, "mag": 2.87, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: if &#x27;southern&#x27; (v. 18) were strict it would be Atlas (27 Tau) or Merope (23 Tau), but &#x27;the defined position agrees best with Alcyone, nor can we hesitate to regard this as actually the junction-star&#x27;."}, {"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "कृत्तिका नक्षत्रम् अग्निर् देवताऽग्ने रुचः स्थ प्रजापतेर् धातुः सोमस्यर्चे त्वा रुचे त्वा द्युते त्वा भासे त्वा ज्योतिषे त्वा रोहिणी नक्षत्रम् प्रजापतिर् देवता मृगशीर्षं नक्षत्रꣳ सोमो देवताऽऽर्द्रा नक्षत्रꣳ रुद्रो देवता पुनर्वसू नक्षत्रम् अदितिर् देवता तिष्यो नक्षत्रम् बृहस्पतिर् देवताऽऽश्रेषा नक्षत्रꣳ सर्पा देवता मघा नक्षत्रम् पितरो देवता", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "(Thou art) Krttikas, the Naksatra, Agni, the deity; ye are the radiances of Agni, of Prajapati, of the creator, of Soma; to the Re thee, to radiance thee, to the shining thee, to the blaze thee, to the light thee. (Thou art) Rohini the Naksatra, Prajapati the deity; Mrgaçirsa the Naksatra, Soma the deity; Ardra the Naksatra, Rudra the deity; the two Punarvasus the Naksatra, Aditi the deity; Tisya the Naksatra, Brhaspati the deity; the Açresas the Naksatra, the serpents the deity; the Maghas the Naksatra, the fathers the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "Heads the oldest nakshatra list; deity Agni. Universally identified with the Pleiades. Eggeling and Whitney both gloss Krittikas = Pleiades. Also attested TB 1.5.1.1 (&#x27;agneḥ kṛttikāḥ&#x27;), TB 3.1.1.1, ŚB 2.1.2.1-5, AV 19.7.2."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.3", "shloka": "एता ह वै प्राच्यै दिशो न च्यवन्ते । सर्वाणि ह वा अन्यानि नक्षत्राणि प्राच्यै दिशश्च्यवन्ते तत्प्राच्यामेवास्यैतद्दिश्याहितौ भवतस्तस्मात्कृत्तिकास्वादधीत - २.१.२.३", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "And again, they do not move away from the eastern quarter, whilst the other asterisms do move from the eastern quarter. Thus his (two fires) are established in the eastern quarter: for this reason he may set up his fires under the Krittikas.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "The famous archaeoastronomical passage: the Krittikas &#x27;do not swerve from the eastern quarter&#x27;. The Pleiades rose due east (on the celestial equator) c. 3000-2500 BCE, which S.B. Dikshit (1895) used to date the ŚB; the dating argument (not the star identification) is disputed, since &#x27;not swerving from the east&#x27; may be an approximation. ŚB 2.1.2.2 also notes they are the most numerous asterism (other nakshatras have 1-4 stars)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47; verse form p. 81", "shloka": "kṛttikā bhoḥ puṣkarasārin nakṣatraṃ ṣaṭtāraṃ kṣura-saṃsthānaṃ triṃśan-muhūrta-yogaṃ dadhyāhāram agnidaivataṃ vaiśyāyanīyaṃ gotreṇa/ ... ṣaṭtārāṃ kṛttikāṃ vidyād āśrayaṃ tāsu kārayet/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;Kṛttikā, sir Puṣkarasārin, is a nakshatra of six stars, razor-shaped, with a thirty-muhūrta conjunction, curds for its food, Agni for its deity, Vaiśyāyanīya by gotra.&#x27; / &#x27;One should know Kṛttikā as six-starred; under it one should build a dwelling.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "SIX stars, razor-shaped (kṣura-saṃsthāna), deity Agni, gotra Vaiśyāyanīya. The count of six bears directly on the seven individually-named Kṛttikās already on file: the Buddhist tradition counts six visible Pleiades, matching the widespread &#x27;lost Pleiad&#x27; motif. The verse recension of the same chapter repeats it: ṣaṭtārāṃ kṛttikāṃ vidyāt."}]}, {"id": "rohini", "cat": "nakshatra", "dev": "रोहिणी", "dev_short": "रोहिणी", "iast": "Rohiṇī", "modern": {"common_name": "Aldebaran", "bayer": "α Tauri", "constellation": "Taurus"}, "conf": "certain", "see_also": [], "label": "रोहिणी", "kind": "star", "ra": 68.98, "dec": 16.51, "mag": 0.85, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (also 8.13)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the Hyades group (ε, δ, γ, ν, α Tauri); α &#x27;the most easterly (v. 19) and the brightest of the group — being the brilliant star of the first magnitude known as Aldebaran — is the junction-star&#x27;. Verse 8.13 concerns splitting Rohiṇī&#x27;s wain (śakaṭa)."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.6", "shloka": "रोहिण्यामग्नी आदधीत । रोहिण्यां ह वै प्रजापतिः प्रजाकामोऽग्नी आदधे स प्रजा असृजत ता अस्य प्रजाः सृष्टा एकरूपा उपस्तब्धास्तस्थू रोहिण्य इवैव तद्वै रोहिण्यै रोहिणीत्वं बहुर्हैव प्रजया पशुभिर्भवति य एवं विद्वान्रोहिण्यामाधत्ते - २.१.२.६", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "He may also set up his fires under (the asterism of) Rohini. For under Rohini it was that Pragapati, when desirous of progeny (or creatures), set up his fires. He created beings, and the creatures produced by him remained invariable and constant, like (red) cows (rohini): hence the cow-like nature of Rohini. Rich in cattle and offspring therefore he becomes whosoever, knowing this, sets up his fires under Rohini.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "&#x27;The red one&#x27;, deity Prajāpati; universally identified with the bright red star Aldebaran. Also TS 4.4.10.1, TB 1.5.1.1, TB 3.1.1.1-2 (&#x27;rohiṇī devy udagāt purastāt&#x27; - the goddess Rohini has risen in the east), AV 19.7.2, and AB 3.33 where the female deer (rohit) of the Prajāpati myth is Rohiṇī."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47; cf. Amarakośa 1.3.227", "shloka": "rohiṇī-nakṣatraṃ pañca-tārakaṃ śakaṭākṛti-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ mṛgamāṃsāhāraṃ prajāpati-daivataṃ bhāradvājaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Rohiṇī asterism has five stars, is shaped like a wagon, has a forty-five-muhūrta conjunction, venison for its food, Prajāpati for its deity, Bhāradvāja by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FIVE stars, wagon-shaped (śakaṭākṛti-saṃsthāna), deity Prajāpati, gotra Bhāradvāja. The five-star wagon is the Hyades V (α, θ¹, γ, δ, ε Tauri) — strong corroboration of the cluster reading, and of the śakaṭa (&#x27;wain&#x27;) that Sūrya Siddhānta 8.13 speaks of splitting. Colebrooke independently glosses Amarakośa&#x27;s rauhiṇeya = Mercury with &#x27;Budha, son of Soma (or the moon) by Rohini (or the Hyades)&#x27;, the earliest public-domain equation of Rohiṇī with the cluster rather than Aldebaran alone."}]}, {"id": "mrigashirsha", "cat": "nakshatra", "dev": "मृगशीर्ष", "dev_short": "मृगशीर्ष", "iast": "Mṛgaśīrṣa", "modern": {"common_name": "Meissa", "bayer": "λ Orionis", "constellation": "Orion"}, "conf": "certain", "see_also": ["invaka", "mriga"], "label": "मृगशीर्ष", "kind": "star", "ra": 83.78, "dec": 9.93, "mag": 3.39, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the faint cluster in Orion&#x27;s head, λ φ¹ φ² Orionis; the northern (v. 16), λ Orionis, is the junction-star, &#x27;although the Hindu measurement... is far from accurate, especially as regards its latitude&#x27;."}, {"text": "Vedic corpus", "citation": "Śatapatha Brāhmaṇa 2.1.2.8-9", "shloka": "मृगशीर्षेऽग्नी आदधीत । एतद्वै प्रजापतेः शिरो यन्मृगशीर्षं श्रीर्वै शिरः श्रीर्हि वै शिरस्तस्माद्योऽर्धस्य श्रेष्ठो भवत्यसावमुष्यार्धस्य शिर इत्याहुः श्रियं ह गच्छति य एवं विद्वान्मृगशीर्ष आधत्ते - २.१.२.८ अथ यस्मान्ना मृगशीर्ष आदधीत । प्रजापतेर्वा एतच्छरीरं यत्र वा एनं तदावेध्यंस्तदिषुणा त्रिकाण्डेनेत्याहुः स एतच्छरीरमजहाद्वास्तु वै शरीरमयज्ञियं निर्वीर्यं तस्मान्न मृगशीर्ष आदधीत - २.१.२.९", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/शतपथब्राह्मणम्/काण्डम्_२/अध्यायः_१/ब्राह्मण_२"], "translation": "He may also set up his fires under (the asterism of) Mrigasirsha. For Mrigasirsha, indeed, is the head of Pragapati; and the head (siras) means excellence (sri)... On the other hand (it is argued) why one should not set up his fire under Mrigasirsha. The latter, indeed, is Pragapati&#x27;s body. Now, when they (the gods) on that occasion pierced him with what is called &#x27;the three-knotted arrow,&#x27; he abandoned that body, for the body is a mere relic (or dwelling, vastu), unholy and sapless. He should therefore not set up his fires under Mrigasirsha.", "translator": "Julius Eggeling, SBE vol. 12 (1882)", "trans_links": ["https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm", "https://web.archive.org/web/20210506123309/https://www.sacred-texts.com/hin/sbr/sbe12/sbe1241.htm"], "notes": "&#x27;The deer&#x27;s head&#x27; = the compact triangle of faint stars forming Orion&#x27;s head, chief star λ Orionis. The ŚB explicitly makes it &#x27;the head of Prajapati&#x27;, whose body (Orion) was pierced by the three-jointed arrow (Orion&#x27;s belt) - see ŚB 2.1.2.9 and AB 3.33. Also TS 4.4.10.1 (deity Soma), AV 19.7.2 (mṛgaśiraḥ), TB 1.5.1.1 (called Invakā)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47; cf. Amarakośa 1.3.221", "shloka": "mṛgaśirā-nakṣatraṃ tritāraṃ mṛgaśīrṣa-saṃsthānaṃ triṃśan muhūrta-yogaṃ phalamūlāhāraṃ soma-daivataṃ mṛgāyaṇīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Mṛgaśirā asterism has three stars, is shaped like a deer&#x27;s head, has a thirty-muhūrta conjunction, fruits and roots for its food, Soma for its deity, Mṛgāyaṇīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, deer&#x27;s-head-shaped (mṛgaśīrṣa-saṃsthāna), deity Soma, gotra Mṛgāyaṇīya — i.e. exactly the group Amarakośa calls the Ilvalāḥ, λ/φ¹/φ² Orionis. The Amarakośa also records three name-forms (Mṛgaśīrṣa, Mṛgaśiras, Āgrahāyaṇī), which Colebrooke glosses simply &#x27;Orion&#x27;."}]}, {"id": "ardra", "cat": "nakshatra", "dev": "आर्द्रा", "dev_short": "आर्द्रा", "iast": "Ārdrā", "modern": {"common_name": "Betelgeuse", "bayer": "α Orionis", "constellation": "Orion"}, "conf": "disputed", "see_also": ["bahu"], "label": "आर्द्रा", "kind": "star", "ra": 88.79, "dec": 7.41, "mag": 0.45, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.2, 8.6)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8; single-star asterism covered by the position sequence (8.2, 8.6) and the sthūla rule (8.19). Burgess: &#x27;impossible not to regard... α Orionis as the one here meant&#x27;, despite &#x27;very grave errors in the definition of its position&#x27;; the only star nearly matching the stated position is 135 Tauri (6th mag)."}, {"text": "Vedic corpus", "citation": "Taittirīya Saṃhitā 4.4.10.1", "shloka": "मृगशीर्षं नक्षत्रꣳ सोमो देवताऽऽर्द्रा नक्षत्रꣳ रुद्रो देवता", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/तैत्तिरीयसंहिता(विस्वरः"], "translation": "Mrgaçirsa the Naksatra, Soma the deity; Ardra the Naksatra, Rudra the deity.", "translator": "A.B. Keith, The Veda of the Black Yajus School (1914)", "trans_links": ["https://www.sacred-texts.com/hin/yv/yv04.htm", "https://web.archive.org/web/20210301091213/https://www.sacred-texts.com/hin/yv/yv04.htm"], "notes": "&#x27;The moist one&#x27;, deity Rudra. Standard identification is Betelgeuse (the bright reddish star adjoining Mṛgaśīrṣa in the ecliptic sequence); a minority of older scholars (e.g. Weber) proposed Sirius because of the Rudra connection. The Taittirīya Brāhmaṇa (1.5.1.1) substitutes the dual name Bāhū &#x27;the two Arms (of Rudra)&#x27;. Also AV 19.7.2, TB 3.1.1.3 (&#x27;ārdrayā rudraḥ prathamānaḥ eti&#x27;)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47", "shloka": "ārdra-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ pañca-daśa-muhūrta-yogaṃ sarpirmaṇḍāhāraṃ sūrya-daivataṃ hārītītāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Ārdrā asterism has one star, is shaped like a forehead-mark, has a fifteen-muhūrta conjunction, clarified-butter cream for its food, Sūrya for its deity, Hārītītāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped (a forehead-mark, i.e. a single point), deity Sūrya, gotra Hārītītāyanīya. The single-star count supports Betelgeuse over any multi-star reading. NOTE the deity: Sūrya, not the Rudra of the Brahmanical lists — a genuine Buddhist divergence, and one that weakens the Rudra-based argument sometimes used to identify Ārdrā with Sirius."}]}, {"id": "punarvasu", "cat": "nakshatra", "dev": "पुनर्वसु", "dev_short": "पुनर्वसु", "iast": "Punarvasu", "modern": {"common_name": "Pollux", "bayer": "β Geminorum", "constellation": "Gemini"}, "conf": "certain", "see_also": [], "label": "पुनर्वसु", "kind": "star", "ra": 116.33, "dec": 28.03, "mag": 1.14, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;the two bright stars in the heads of the Twins, or α and β Geminorum, and the latter (1.2) is the junction-star&#x27; (the eastern, per v. 19)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47", "shloka": "punarvasu-nakṣatraṃ dvitāraṃ pada-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ madh[u]āhāram aditidaivataṃ vāśiṣṭhaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Punarvasu asterism has two stars, is foot-shaped, has a forty-five-muhūrta conjunction, honey for its food, Aditi for its deity, Vāśiṣṭha by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, foot-shaped (pada-saṃsthāna), deity Aditi, gotra Vāśiṣṭha. Two stars = Castor and Pollux, confirming both the dual name and the Aditi lordship of the Vedic lists on file."}]}, {"id": "pushya", "cat": "nakshatra", "dev": "पुष्य", "dev_short": "पुष्य", "iast": "Puṣya", "modern": {"common_name": "Asellus Australis", "bayer": "δ Cancri", "constellation": "Cancer"}, "conf": "likely", "see_also": ["tishya"], "label": "पुष्य", "kind": "star", "ra": 131.17, "dec": 18.15, "mag": 3.94, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the middle of three (with γ and θ Cancri) is the junction-star, &#x27;shown by the position assigned to it to be δ Cancri (4)&#x27;; hypothetically, under the arrow figure alone, θ Cancri could be meant."}, {"text": "Vedic corpus", "citation": "Atharvaveda (Śaunaka) 19.7 (nakṣatra hymn, esp. v. 2)", "shloka": "चित्राणि साकं दिवि रोचनानि सरीसृपाणि भुवने जवानि । तुर्मिशं सुमतिमिच्छमानो अहानि गीर्भिः सपर्यामि नाकम् ॥१॥ सुहवमग्ने कृत्तिका रोहिणी चास्तु भद्रं मृगशिरः शमार्द्रा । पुनर्वसू सूनृता चारु पुष्यो भानुराश्लेषा अयनं मघा मे ॥२॥ पुण्यं पूर्वा फल्गुन्यौ चात्र हस्तश्चित्रा शिवा स्वाति सुखो मे अस्तु । राधे विशाखे सुहवानुराधा ज्येष्ठा सुनक्षत्रमरिष्ट मूलम् ॥३॥ अन्नं पूर्वा रासतां मे अषाढा ऊर्जं देव्युत्तरा आ वहन्तु । अभिजिन् मे रासतां पुण्यमेव श्रवणः श्रविष्ठाः कुर्वतां सुपुष्टिम् ॥४॥ आ मे महच्छतभिषग्वरीय आ मे द्वया प्रोष्ठपदा सुशर्म । आ रेवती चाश्वयुजौ भगं म आ मे रयिं भरण्य आ वहन्तु ॥५॥", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/अथर्ववेदः/काण्डं_१९/सूक्तम्_००७"], "translation": "1. Seeking favor of the twenty-eight-fold (?) wondrous ones, shining in the sky together, ever-moving, hasting in the creation (bhuvana), I worship (sapary) with songs the days, the firmament (naka). 2. Easy of invocation for me [be] the Krittikas and Rohini; be Mriga-çiras excellent, [and] Ardra healthful (çam); be the two Punarvasus pleasantness, Pushya what is agreeable, the Açleshas light (bhanu), the Maghas progress (ayana) [for me]. ... 5. Let Çatabhishaj [bring] to me what is great widely; let the double Proshthapadas [bring] to me good protection (suçarman); let Revati and the two Açvayuj [bring] fortune to me; let the Bharanis bring to me wealth.", "translator": "W.D. Whitney, Atharva-Veda Samhita, HOS 8 (1905), p. 907", "trans_links": ["https://archive.org/details/atharvavedasamhi02whituoft", "https://archive.org/download/atharvavedasamhi02whituoft/atharvavedasamhi02whituoft_djvu.txt"], "notes": "AV nakshatra hymn, verse 2; the AV series begins with the Krittikas (Pleiades) like the TS but comprises 28 asterisms including Abhijit (Vega). Whitney emends the corrupt turmiśaṁ of AV 19.7.1 to aṣṭāviṅśáṁ &#x27;twenty-eight-fold&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47", "shloka": "puṣya-nakṣatraṃ tritāraṃ vardhamāna-saṃsthānaṃ triśan-muhūrta-yogaṃ madhu-maṇḍāhāraṃ bṛhaspati-daivatam aupamanyavīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Puṣya asterism has three stars, is shaped like a vardhamāna, has a thirty-muhūrta conjunction, honey-cream for its food, Bṛhaspati for its deity, Aupamanyavīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, vardhamāna-shaped (an auspicious &#x27;growing&#x27; diagram), deity Bṛhaspati, gotra Aupamanyavīya. Three stars = δ, γ, θ Cancri; matches Colebrooke&#x27;s &#x27;Stars in Cancer&#x27; for the Amarakośa&#x27;s Puṣya/Sidhya/Tiṣya trio."}]}, {"id": "ashlesha", "cat": "nakshatra", "dev": "आश्लेषा", "dev_short": "आश्लेषा", "iast": "Āśleṣā", "modern": {"common_name": "Ashlesha", "bayer": "ε Hydrae", "constellation": "Hydra"}, "conf": "disputed", "see_also": ["sarpa"], "label": "आश्लेषा", "kind": "star", "ra": 130.8, "dec": 6.42, "mag": 3.38, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Colebrooke pointed to α Cancri; Burgess rejects this (&#x27;α Cancri is not the eastern member of any group of five stars&#x27;) and places the asterism in the circular group in Hydra&#x27;s head, &#x27;and ε Hydrae, its brightest star... is the junction-star&#x27;, while conceding the latitude error is &#x27;very considerable&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 46–47", "shloka": "aśleṣā-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ pañca-daśa-muhūrta-yogaṃ pāyasa-bhojanaṃ sarpa-daivataṃ maitrāyaṇīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Aśleṣā asterism has one star, is shaped like a forehead-mark, has a fifteen-muhūrta conjunction, milk-rice for its food, Sarpa for its deity, Maitrāyaṇīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped, deity Sarpa (the Serpent), gotra Maitrāyaṇīya. The single-star count conflicts with the later five- or six-star Āśleṣā of the siddhāntas and supports taking the yogatārā (ε Hydrae) as the whole asterism in the older reckoning — which is some support for Burgess against Colebrooke&#x27;s α Cancri. The Sarpa deity matches Sārpa already on file."}]}, {"id": "magha", "cat": "nakshatra", "dev": "मघा", "dev_short": "मघा", "iast": "Maghā", "modern": {"common_name": "Regulus", "bayer": "α Leonis", "constellation": "Leo"}, "conf": "certain", "see_also": ["agha"], "label": "मघा", "kind": "star", "ra": 152.09, "dec": 11.97, "mag": 1.36, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: of the Sickle group, &#x27;the star α Leonis, or Regulus, the most brilliant of the group, is the junction-star, and its position is defined with unusual precision&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 47–48", "shloka": "maghā-nakṣatraṃ pañca-tāraṃ nadī-kubja-saṃsthānaṃ triśan-muhūrta-yogaṃ tila-kṛsarāhāraṃ pitṛdaivataṃ piṅgalāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Maghā asterism has five stars, is shaped like the bend of a river, has a thirty-muhūrta conjunction, sesame-and-rice gruel for its food, the Fathers for its deity, Piṅgalāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FIVE stars, shaped like a river-bend (nadī-kubja-saṃsthāna), deity Pitṛ (the Fathers), gotra Piṅgalāyanīya. Five stars in a curve = the Sickle of Leo (α, η, γ, ζ, μ Leonis). The Pitṛ deity confirms the Aghā/Maghā-of-the-Fathers association on file."}]}, {"id": "purva-phalguni", "cat": "nakshatra", "dev": "पूर्वफल्गुनी", "dev_short": "पूर्वफल्गुनी", "iast": "Pūrva-Phalgunī", "modern": {"common_name": "Zosma", "bayer": "δ Leonis", "constellation": "Leo"}, "conf": "likely", "see_also": ["arjuni"], "label": "पूर्वफल्गुनी", "kind": "star", "ra": 168.53, "dec": 20.52, "mag": 2.56, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: of the pair δ and θ Leonis, &#x27;the first group is, then, clearly identifiable as δ and θ Leonis, the former and brighter being the distinctive star&#x27;; he notes the Siddhānta-Śiromaṇi and Graha-Lāghava data may instead point to θ Leonis (the southern)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 47–48", "shloka": "pūrvaphalgunī-nakṣatraṃ dvitāraṃ padaka-saṃsthānaṃ triśan muhūrta-yogaṃ vilvabhojanaṃ bhavadevataṃ gautamīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Pūrvaphalgunī asterism has two stars, is padaka-shaped, has a thirty-muhūrta conjunction, bilva fruit for its food, Bhava for its deity, Gautamīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, padaka-shaped (like a small pendant), deity Bhava, gotra Gautamīya. Two stars = δ and θ Leonis, which supports Burgess&#x27;s pair against the alternatives. NOTE the deity Bhava (a Rudra-name) where the Brahmanical lists have Bhaga."}]}, {"id": "uttara-phalguni", "cat": "nakshatra", "dev": "उत्तरफल्गुनी", "dev_short": "उत्तरफल्गुनी", "iast": "Uttara-Phalgunī", "modern": {"common_name": "Denebola", "bayer": "β Leonis", "constellation": "Leo"}, "conf": "certain", "see_also": ["arjuni"], "label": "उत्तरफल्गुनी", "kind": "star", "ra": 177.26, "dec": 14.57, "mag": 2.11, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;In the latter group, the junction-star is evidently β Leonis&#x27;; the text&#x27;s calling it &#x27;northern&#x27; he regards &#x27;as simply an error&#x27; of the describers."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 47–48", "shloka": "uttaraphalgunī-nakṣatraṃ dvitāraṃ padaka-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ godhūmamatsyāhāram aryamādaivataṃ kauśikaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Uttaraphalgunī asterism has two stars, is padaka-shaped, has a forty-five-muhūrta conjunction, wheat and fish for its food, Aryamā for its deity, Kauśika by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, padaka-shaped, deity Aryamā, gotra Kauśika. Two stars = β and 93 Leonis; the Aryamā lordship agrees with the Vedic lists."}]}, {"id": "hasta", "cat": "nakshatra", "dev": "हस्त", "dev_short": "हस्त", "iast": "Hasta", "modern": {"common_name": "Gienah", "bayer": "γ Corvi", "constellation": "Corvus"}, "conf": "disputed", "see_also": [], "label": "हस्त", "kind": "star", "ra": 183.95, "dec": -17.54, "mag": 2.59, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.17", "shloka": "पश्चिमोत्तरताराया द्वितीया पश्चिमे स्थिता / हस्तस्य योगतारा सा श्रविष्ठायाश् च पश्चिमा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "17. That which is the western northern star, being the second situated westward, that is the junction-star of Hasta; of Çravishtha it is the western:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Five stars of Corvus. Burgess: v. 17&#x27;s special description is &#x27;quite hard to understand and apply: we regard it as most probable... that γ (3) is the star intended: the defined position... would point rather to δ (3)&#x27;. Colebrooke gave &#x27;γ or δ Corvi&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 47–48; cf. Amarakośa 3.3.464", "shloka": "hasta-nakṣatraṃ pañca-tāraṃ hasta-saṃsthānaṃ triṃśan-muhūrta-yogaṃ śyāmākabhojanaṃ sūrya-daivataṃ kāśyapaṃ gotreṇa/ — cf. अमरकोश ३.३.४६४: हस्तौ तु पाणिनक्षत्रे मरुतौ पवनामरौ ॥", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Hasta asterism has five stars, is hand-shaped, has a thirty-muhūrta conjunction, śyāmāka millet for its food, Sūrya for its deity, Kāśyapa by gotra.&#x27; — Amarakośa: &#x27;Hasta [means] the hand and the asterism.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FIVE stars, hand-shaped (hasta-saṃsthāna), deity Sūrya, gotra Kāśyapa — the clearest possible confirmation of the Corvus identification and of the name&#x27;s literal sense, and it settles that the asterism is the whole five-star figure whatever the yogatārā. The Amarakośa&#x27;s Nānārtha-varga separately records that hasta has exactly two senses, &#x27;hand&#x27; and &#x27;the asterism&#x27;."}]}, {"id": "chitra", "cat": "nakshatra", "dev": "चित्रा", "dev_short": "चित्रा", "iast": "Citrā", "modern": {"common_name": "Spica", "bayer": "α Virginis", "constellation": "Virgo"}, "conf": "certain", "see_also": [], "label": "चित्रा", "kind": "star", "ra": 201.3, "dec": -11.16, "mag": 0.98, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (named in 8.21)", "shloka": "अपाम्वत्सस् तु चित्राया उत्तरे +अम्शैस् तु पञ्चभिः / बृहत् किञ्चिद् अतो भागैर् आपः षड्भिस् तथोत्तरे //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "21. Apamvatsa is five degrees north from Citra: somewhat greater than it, as also six degrees to the north of it, is Apas.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;This is the beautiful star of the first magnitude α Virginis, or Spica, constituting an asterism by itself.&#x27; Named again in 8.21 as the reference star for Apāṃvatsa."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 47–48", "shloka": "citrā-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ triṃśan-muhūrta-yogaṃ mudgakṛsaraghṛta-pūpāhāraṃ tvaṣṭṛdaivataṃ kātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Citrā asterism has one star, is shaped like a forehead-mark, has a thirty-muhūrta conjunction, mung-gruel and ghee-cakes for its food, Tvaṣṭṛ for its deity, Kātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped, deity Tvaṣṭṛ, gotra Kātyāyanīya. The single-star count is decisive for Spica; the Tvaṣṭṛ lordship agrees with the Vedic lists."}]}, {"id": "svati", "cat": "nakshatra", "dev": "स्वाती", "dev_short": "स्वाती", "iast": "Svātī", "modern": {"common_name": "Arcturus", "bayer": "α Boötis", "constellation": "Boötes"}, "conf": "certain", "see_also": ["nishtya"], "label": "स्वाती", "kind": "star", "ra": 213.92, "dec": 19.18, "mag": -0.05, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19 (positions 8.2, 8.7)", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Not individually named in ch. 8 (single-star asterism; sthūla rule 8.19; positions 8.2/8.7). Burgess: &#x27;The star intended is plainly α Bootis, or Arcturus&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 48", "shloka": "svātī-nakṣatram eka-tāraṃ tilaka-saṃsthānaṃ pañca-daśa-muhūrta-yogaṃ mudgakṛsaraphalāhāraṃ vāyudaivataṃ kātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Svātī asterism has one star, is shaped like a forehead-mark, has a fifteen-muhūrta conjunction, mung-gruel and fruit for its food, Vāyu for its deity, Kātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "ONE star, tilaka-shaped, deity Vāyu, gotra Kātyāyanīya. Single-star count decisive for Arcturus; the Vāyu lordship agrees with the Vedic lists and with Niṣṭya already on file."}]}, {"id": "vishakha", "cat": "nakshatra", "dev": "विशाखा", "dev_short": "विशाखा", "iast": "Viśākhā", "modern": {"common_name": "ι Librae", "bayer": "ι Librae", "constellation": "Libra"}, "conf": "disputed", "see_also": [], "label": "विशाखा", "kind": "star", "ra": 222.72, "dec": -19.79, "mag": 4.54, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;the identification of Viçakha [is] in some respects more doubtful than that of any other asterism in the series&#x27;; the defined position identifies the junction-star with faint ι Librae, though he believes the asterism &#x27;was originally composed of the two stars α and β Librae&#x27;. Colebrooke suggested o or χ Librae; modern lists often use α Librae (Zubenelgenubi)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 48", "shloka": "viśākhā-nakṣatraṃ dvitāraṃ viṣāṇa-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ tila-puṣpāhāram indrāgnidaivataṃ śāṃkhāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Viśākhā asterism has two stars, is horn-shaped, has a forty-five-muhūrta conjunction, sesame and flowers for its food, Indra-and-Agni for its deity, Śāṃkhāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "TWO stars, horn-shaped (viṣāṇa-saṃsthāna), deity Indrāgni, gotra Śāṃkhāyanīya. This bears directly on the most doubtful identification in the whole series: the two-star count sides with the &#x27;ancient authors&#x27; whom Colebrooke cites against the later four-star reckoning, and the horn figure fits the two scale-stars α and β Librae — i.e. it supports Burgess&#x27;s own belief that the asterism &#x27;was originally composed of α and β Librae&#x27; rather than the faint ι Librae his coordinates forced on him."}]}, {"id": "anuradha", "cat": "nakshatra", "dev": "अनुराधा", "dev_short": "अनुराधा", "iast": "Anurādhā", "modern": {"common_name": "Dschubba", "bayer": "δ Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": [], "label": "अनुराधा", "kind": "star", "ra": 240.08, "dec": -22.62, "mag": 2.29, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the row β, δ, π Scorpionis, &#x27;δ (2.3) being the junction-star&#x27; (the middle, per v. 18)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "anurādhā-nakṣatraṃ catustāraṃ ratnābalī-saṃsthānaṃ triśan-muhūrta-yogaṃ surāmāṃsāhāraṃ mitradaivatam ālaṃbāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Anurādhā asterism has four stars, is shaped like a string of jewels, has a thirty-muhūrta conjunction, liquor and meat for its food, Mitra for its deity, Ālaṃbāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FOUR stars, shaped like a string of jewels (ratnāvalī-saṃsthāna), deity Mitra, gotra Ālaṃbāyanīya. The jewel-string of four fits β, δ, π, ρ Scorpii. Mitra lordship agrees with the Vedic lists and with the siddhāntic epithet Maitra."}]}, {"id": "jyeshtha", "cat": "nakshatra", "dev": "ज्येष्ठा", "dev_short": "ज्येष्ठा", "iast": "Jyeṣṭhā", "modern": {"common_name": "Antares", "bayer": "α Scorpii", "constellation": "Scorpius"}, "conf": "certain", "see_also": ["rohini-indra"], "label": "ज्येष्ठा", "kind": "star", "ra": 247.35, "dec": -26.43, "mag": 1.06, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the central of three (with σ and τ Scorpionis) is &#x27;the brilliant star of the first magnitude α Scorpionis, or Antares&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "jyeṣṭhā-nakṣatraṃ tritāraṃ yavamadhya-saṃsthānaṃ pañca-daśa-muhūrta-yogaṃ śāliyavāgubhojanam indradaivataṃ dīrghakātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Jyeṣṭhā asterism has three stars, is shaped like the middle of a barleycorn, has a fifteen-muhūrta conjunction, rice gruel for its food, Indra for its deity, Dīrghakātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, shaped like a barleycorn&#x27;s middle (yavamadhya-saṃsthāna, a lens/fusiform figure), deity Indra, gotra Dīrghakātyāyanīya. Three stars in a fusiform = σ, α, τ Scorpii, exactly Burgess&#x27;s group. Indra lordship agrees with the Vedic lists and with Jyeṣṭhaghnī already on file."}]}, {"id": "mula", "cat": "nakshatra", "dev": "मूल", "dev_short": "मूल", "iast": "Mūla", "modern": {"common_name": "Shaula", "bayer": "λ Scorpii", "constellation": "Scorpius"}, "conf": "likely", "see_also": ["vichritau", "mulabarhana"], "label": "मूल", "kind": "star", "ra": 263.4, "dec": -37.1, "mag": 1.62, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.19", "shloka": "रोहिण्यादित्यमूलानाम् प्राची सार्पस्य चैव हि / यथा प्रत्यवशेषाणाम् स्थूला स्याद् योगतारका //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "19. Of Rohini, Punarvasu (aditya), and Mula, it is the eastern, and so also of Açlesha (sarpa): in the case of each of the others, the junction-star (yogataraka) is the great (sthula) one.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Stars of the Scorpion&#x27;s tail. Burgess: &#x27;if, as seems probable, λ is the star pointed out by the definition of position&#x27;, the &#x27;eastern&#x27; designation is strictly true only of the pair λ and ν (the Vedic vicṛtāu); ι, κ, and θ lie farther east."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "mūla-nakṣatraṃ saptatāraṃ vṛścika-saṃsthānaṃ triśan-muhūrta-yogaṃ mūlaphalāhāraṃ nairṛtidaivataṃ kātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Mūla asterism has seven stars, is shaped like a scorpion, has a thirty-muhūrta conjunction, roots and fruits for its food, Nairṛti for its deity, Kātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "SEVEN stars, SCORPION-SHAPED (vṛścika-saṃsthāna), deity Nairṛti, gotra Kātyāyanīya. This is the strongest single confirmation in the whole chapter, because the text names the constellation-figure outright — seven stars in the Scorpion&#x27;s sting-curve. It corroborates Vicṛtau and Mūlabarhaṇa already on file, and Colebrooke independently glosses Sanskrit mūla in the Nānārtha section as &#x27;an asterism (the Scorpion&#x27;s tail)&#x27;."}]}, {"id": "purva-ashadha", "cat": "nakshatra", "dev": "पूर्वाषाढा", "dev_short": "पूर्वाषाढा", "iast": "Pūrvāṣāḍhā", "modern": {"common_name": "Kaus Media", "bayer": "δ Sagittarii", "constellation": "Sagittarius"}, "conf": "certain", "see_also": [], "label": "पूर्वाषाढा", "kind": "star", "ra": 275.25, "dec": -29.83, "mag": 2.7, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16 (also 8.4)", "shloka": "फाल्गुन्योर् भाद्रपदयोस् तथैवाषाढयोर् द्वयोः / विशाखाश्विनिसौम्यानाम् योगतारोत्तरा स्मृता //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "16. Of the two Phalgunis, the two Bhadrapadas, and likewise the two Ashadhas, of Viçakha, Açvini, and Mrgaçirsha (saumya), the junction-star (yogatara) is stated to be the northern (uttara):", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The former group must comprise δ (3.4) and ε (3.2) Sagittarii, the former being the junction-star; this is shown by the... comparison of positions&#x27;. Called āpya (of the Waters) in 8.4."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "pūrvāṣāḍhā-nakṣatraṃ catustāraṃ govikrama-saṃsthānaṃ triśan-muhūrta-yogaṃ nyagrodhakaṣāyāhāraṃ toyadaivataṃ darbhakātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Pūrvāṣāḍhā asterism has four stars, is shaped like a cow&#x27;s stride, has a thirty-muhūrta conjunction, banyan decoction for its food, the Waters for its deity, Darbhakātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FOUR stars, shaped like a cow&#x27;s stride (govikrama-saṃsthāna), deity Toya (&#x27;the Waters&#x27; = Āpas), gotra Darbhakātyāyanīya. The Toya deity is the Buddhist form of the āpya lordship the Sūrya Siddhānta uses. The paired cow-stride/elephant-stride figures for the two Āṣāḍhās are a Buddhist speciality."}]}, {"id": "uttara-ashadha", "cat": "nakshatra", "dev": "उत्तराषाढा", "dev_short": "उत्तराषाढा", "iast": "Uttarāṣāḍhā", "modern": {"common_name": "Nunki", "bayer": "σ Sagittarii", "constellation": "Sagittarius"}, "conf": "likely", "see_also": [], "label": "उत्तराषाढा", "kind": "star", "ra": 283.82, "dec": -26.3, "mag": 2.05, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.16 (also 8.4)", "shloka": "मनवो +अथ रसा वेदा वैश्वम् आप्यार्धभोगगम् / आप्यस्यैवाभिजित् प्रान्ते वैश्वान्ते श्रवणस्थितिः /", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "4. Fourteen, six, four: Uttara-Ashadha (vaiçva) is at the middle of the portion (bhoga) of Purva-Ashadha (apya); Abhijit, likewise, is at the end of Purva-Ashadha; the position of Çravana is at the end of Uttara-Ashadha;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;its northern and junction-star can be no other than σ (2.3)... notwithstanding the error in the Hindu determination of its latitude, which led Colebrooke to regard τ (4.3) as the star intended&#x27;. Called vaiśva (of the Viśve Devāḥ) in 8.4."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "uttarāṣāḍhā-nakṣatraṃ catustāraṃ gajavikrama-saṃsthānaṃ pañca-catvāriṃśan-muhūrta-yogaṃ madhu-lājāhāraṃ viśva-daivataṃ maudgalāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Uttarāṣāḍhā asterism has four stars, is shaped like an elephant&#x27;s stride, has a forty-five-muhūrta conjunction, honey and parched grain for its food, the All-Gods for its deity, Maudgalāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "FOUR stars, shaped like an elephant&#x27;s stride (gajavikrama-saṃsthāna), deity Viśva (the Viśve Devāḥ), gotra Maudgalāyanīya. The Viśvadeva lordship agrees with the Vedic lists and with the Sūrya Siddhānta&#x27;s vaiśva."}]}, {"id": "abhijit", "cat": "nakshatra", "dev": "अभिजित्", "dev_short": "अभिजित्", "iast": "Abhijit", "modern": {"common_name": "Vega", "bayer": "α Lyrae", "constellation": "Lyra"}, "conf": "certain", "see_also": [], "label": "अभिजित्", "kind": "star", "ra": 279.23, "dec": 38.78, "mag": 0.03, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.4", "shloka": "मनवो +अथ रसा वेदा वैश्वम् आप्यार्धभोगगम् / आप्यस्यैवाभिजित् प्रान्ते वैश्वान्ते श्रवणस्थितिः /", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "4. Fourteen, six, four: Uttara-Ashadha (vaiçva) is at the middle of the portion (bhoga) of Purva-Ashadha (apya); Abhijit, likewise, is at the end of Purva-Ashadha; the position of Çravana is at the end of Uttara-Ashadha;", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: &#x27;The position assigned to its junction-star, which is described as the brightest... in a group of three, identifies it with α Lyrae or Vega, a star which is exceeded in brilliancy by only one or two others in the heavens&#x27; (triangle with ε and ζ Lyrae)."}, {"text": "Siddhānta Śiromaṇi", "citation": "Siddhānta Śiromaṇi, Grahagaṇitādhyāya, Bhagrahayutyadhikāra vv.1-6 with Vāsanābhāṣya; Vāsanābhāṣya on v.16", "shloka": "यस्य स्फुटा क्रान्तिरुदक् च यत्र लम्बाधिका तत्र सदोदितं तत् । न दृश्यते तत् खलु यस्य याम्या भं लुब्धकः कुम्भभवो ग्रहो वा ।।१६।। — with Bhāskara&#x27;s own bhāṣya: &#x27;यत्र द्विपश्चाशदधिकाः पलांशास्तत्राभिजित् सदोदितमेव&#x27; [verbatim from unproofread OCR; द्विपञ्चाशद् expected]", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/पृष्ठम्:सिद्धान्तशिरोमणिः.djvu/351"], "translation": "[own rendering, no PD translation exists] (v.16) A star whose true declination is north and exceeds the co-latitude is ever-visible there; one whose declination is south (by that amount) is never seen — be it Lubdhaka, the pot-born (Agastya), or even a planet. (Bhāṣya) Where the degrees of latitude exceed 52, Abhijit is ever-risen (circumpolar).", "translator": "Own literal rendering (clearly marked), checked against Arkasomayaji&#x27;s paraphrase (&#x27;where the latitude is greater than 52°, there Abhijit is always above the horizon&#x27;).", "trans_links": ["https://archive.org/details/SiddhantaSiromaniGanitadhyaya"], "notes": "Included by Bhāskara among the 28 asterisms whose dhruvas he lists (Vāsanābhāṣya on vv.1-3: &#x27;अष्टौ नखा इत्यादयोऽश्विन्यादीनां साभिजितां ध्रुवभागा वेदितव्याः&#x27; — the dhruvas of Aśvinī etc. together with Abhijit). Its śara is 62° north (largest in the list, per the Bhagrahayuti latitude table), matching Vega&#x27;s ecliptic latitude of about +61.7°. Bhāskara&#x27;s Vāsanābhāṣya on v.16 makes it circumpolar above latitude 52°. The 1861 PD volume identifies &#x27;Abhijit (α Lyrae)&#x27; (pp.63, 68)."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, pp. 49–51; cf. Sūryaprajñapti as reported by Thibaut (1880), pp. 186–188", "shloka": "abhijin-nakṣatraṃ tritāraṃ gośīrsa-saṃsthānaṃ ṣaṇ-muhūrta-yogaṃ vāyuāhāraṃ brahma-daivataṃ brahmāvatīyaṃ gotreṇa/ ... eko +abhijit ṣaṇ-muhūrta-yogaḥ/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Abhijit asterism has three stars, is shaped like a cow&#x27;s head, has a six-muhūrta conjunction, air for its food, Brahmā for its deity, Brahmāvatīya by gotra.&#x27; ... &#x27;One alone, Abhijit, has a six-muhūrta conjunction.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, cow&#x27;s-head-shaped (gośīrṣa-saṃsthāna), deity Brahmā, gotra Brahmāvatīya — and uniquely a SIX-muhūrta conjunction where every other asterism has 15, 30 or 45. The text singles this out again a page later: &#x27;one alone, Abhijit, has a six-muhūrta conjunction&#x27;. Three stars in a cow&#x27;s-head = α, ε, ζ Lyrae, matching Burgess&#x27;s triangle. The anomalously small extent is precisely the peculiarity behind Abhijit&#x27;s later expulsion from the 27-fold scheme — and the Jain canon independently makes Abhijit a class of its own with a 9 4/67-muhūrta conjunction (Thibaut 1880: &#x27;There is no special name for the extent of Abhijit&#x27;)."}, {"text": "Later siddhāntas & al-Bīrūnī", "citation": "Sūrya Siddhānta 9.12, 9.18 and 13.8", "shloka": "अभिजिद् ब्रह्महृदयम् स्वातीवैष्णववासवाः / अहिर्बुध्न्यम् उदक्स्थत्वान् न लुप्यन्ते ऽर्करश्मिभिः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_उदयास्ताधिकारः"], "translation": "18. Abhijit, Brahmahrdaya, Svati, Çravana (vāishnava), Çravishtha (vāsava), and Uttara-Bhādrapadā (ahirbudhnya), owing to their northern situation, are not extinguished by the sun&#x27;s rays.", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Named at SS 9.12 (13° class) and heading the SS 9.18 list of stars never obscured by the sun; also at SS 13.8 among the stars needing day-circles on the armillary sphere. Al-Bīrūnī&#x27;s independent lists give al-Nasr al-Wāqiʿ (Vega) in both positions, and his nakshatra table assigns Abhijit polar longitude 265° and 62° north latitude."}]}, {"id": "shravana", "cat": "nakshatra", "dev": "श्रवण", "dev_short": "श्रवण", "iast": "Śravaṇa", "modern": {"common_name": "Altair", "bayer": "α Aquilae", "constellation": "Aquila"}, "conf": "certain", "see_also": ["ashvattha"], "label": "श्रवण", "kind": "star", "ra": 297.7, "dec": 8.87, "mag": 0.76, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.18 (also 8.4)", "shloka": "ज्येष्ठाश्रवणमैत्राणाम् बार्हस्पत्यस्य मध्यमा / भरण्याग्नेयपित्र्याणाम् रेवत्याश् चैव दक्षिणा //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "18. Of Jyeshtha, Çravana, Anuradha (maitra), and Pushya (barhaspatya), it is the middle star: of Bharani, Krttika (agneya), and Magha (pitrya), and likewise of Revati, it is the southern:", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: three stars &#x27;in the back and neck of the Eagle, namely α, γ, and β Aquilae; α, the determinative [middle star, v. 18], is a star of the first to second magnitude&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 49", "shloka": "śravaṇā-nakṣatraṃ tritāraṃ yavamadhya-saṃsthānaṃ triṃśan-muhūrta-yogaṃ pakṣimāṃsāhāraṃ viṣṇudaivataṃ kātyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Śravaṇā asterism has three stars, is shaped like the middle of a barleycorn, has a thirty-muhūrta conjunction, birds&#x27; flesh for its food, Viṣṇu for its deity, Kātyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "notes": "THREE stars, barleycorn-middle-shaped (yavamadhya-saṃsthāna), deity Viṣṇu, gotra Kātyāyanīya. Three stars in a fusiform = β, α, γ Aquilae, exactly Burgess&#x27;s group. Viṣṇu lordship agrees with the Vedic lists and with the siddhāntic epithet Vaiṣṇava."}]}, {"id": "dhanishtha", "cat": "nakshatra", "dev": "श्रविष्ठा", "dev_short": "श्रविष्ठा", "iast": "Śraviṣṭhā (Dhaniṣṭhā)", "modern": {"common_name": "Rotanev", "bayer": "β Delphini", "constellation": "Delphinus"}, "conf": "certain", "see_also": [], "label": "श्रविष्ठा", "kind": "star", "ra": 309.4, "dec": 14.6, "mag": 3.63, "road": null, "galacticL": null, "plotnote": null, "refs": [{"text": "Sūrya Siddhānta", "citation": "Sūrya Siddhānta 8.17 (also 8.5)", "shloka": "त्रिचतुः पादयोः सन्धौ श्रविष्ठा श्रवणस्य तु / स्वभोगतो वियन् नागाः षट्कृतिर् यमलाश्विनः //", "shloka_script": "devanagari", "shloka_note": null, "shloka_links": ["https://sa.wikisource.org/wiki/सूर्यसिद्धान्त_भग्रहयुत्यधिकारः"], "translation": "5. Çravishtha, on the other hand, is at the point of connection of the third and fourth quarters (pada) of Çravana: then, in their own portions, eighty, thirty-six, twenty-two,", "translator": "E. Burgess (1860)", "trans_links": ["https://archive.org/download/jstor-592174/592174_djvu.txt"], "notes": "Burgess: the diamond in the Dolphin&#x27;s head, β α γ δ Delphini; &#x27;The junction-star, which is the western (v. 17), is β&#x27;."}, {"text": "Lexicons, Nirukta & Buddhist", "citation": "Śārdūlakarṇāvadāna (Divyāvadāna 33), nakṣatra-vaṃśa, p. 50", "shloka": "dhaniṣṭhā-nakṣatraṃ catustāraṃ śakuna-saṃsthānaṃ triṃśan-muhūrta-yogaṃ kulatthapūpāhāraṃ vasudaivataṃ kauṇḍinyāyanīyaṃ gotreṇa/", "shloka_script": "iast", "shloka_note": null, "shloka_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintext/sa_zArdUlakarNAvadAna.txt"], "translation": "Literal rendering: &#x27;The Dhaniṣṭhā asterism has four stars, is shaped like a bird, has a thirty-muhūrta conjunction, horse-gram cakes for its food, the Vasus for its deity, Kauṇḍinyāyanīya by gotra.&#x27;", "translator": "Literal rendering by the compiler", "trans_links": ["https://gretil.sub.uni-goettingen.de/gretil/corpustei/transformations/plaintex
