"}, {"language": "Urdu", "region": "Urdu, from Persian", "name_native": "گردانك", "name_roman": "gardānak", "literal_meaning": "diminutive of gardān 'turner, that which turns'", "register": "vernacular", "confidence": "certain", "usage_note": "Named for their function: the two stars that swing round the pole and point to it.", "quote": "P گردانك gardānak (gardān+dim. aff. ak = S. क), s.f. The pointers (two stars in the Great Bear).", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. gardānak, p. 903", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=903", "notes": "Also Shakespear (1834), p. 1441, in the same words. Identification as Dubhe and Merak is the standard sense of 'the Pointers' and is not stated by Platts."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "سہا", "name_roman": "suhā", "literal_meaning": "'the forgotten one' (from Arabic sahw 'to be forgetful, to be overlooked')", "register": "vernacular", "confidence": "certain", "usage_note": "The Arabic naked-eye test star, the faint companion of Mizar, taken into Urdu with its etymology intact - it is 'the one you overlook'. This is the exact functional counterpart of Sanskrit Arundhatī, likewise the tiny companion pointed out as a test.", "quote": "A سہا suhā (v.n. fr. سہو 'to be forgetful,' &c.), s.m. A small dim star in the tail of Ursa Major.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. suhā, p. 704", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=704", "notes": "Fallon, p. 799, s.v. su'hā, has the same: '(Ast.) The small star in the tail of the Great Bear.' The Sanskrit-side link is arundhati (Alcor)."}, {"language": "Chhattisgarhi", "region": "Chhattisgarh (Dhuri caste, rice-parchers)", "name_native": null, "name_roman": "[no vernacular form printed] 'a cot with three thieves tied to it'", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "The thieves came to steal the cot, which belonged to an old woman, but God caught them and tied them down there for ever.", "quote": "They think that the constellation of the Great Bear is a cot with three thieves tied to it. The thieves came to steal the cot, which belonged to an old woman, but God caught them and tied them down there for ever", "citation": "Russell & Hiralal, The Tribes and Castes of the Central Provinces of India (1916), vol. II, article 'Dhuri', p. 529", "source_url": "https://archive.org/download/in.ernet.dli.2015.175422/2015.175422.The-Tribes-And-Castes-Of-The-Central-Provinces-Of-India-Vol-ii_djvu.txt", "notes": "Register folk, not tribal: the Dhuri are a Chhattisgarhi caste of rice-parchers, not an Adivasi community, and Russell prints no vernacular words — hence the bracketed name_roman. Included because it is the earliest printed attestation of the cot and three thieves, 1916, decades before the Gond fieldwork and independent of Grignard and Campbell, and because it shows the figure circulating outside the tribal communities too."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "झुमका / جهمکا", "name_roman": "jhumkā (sāt sahelyoṅ kā jhūmkā)", "literal_meaning": "'the bell-shaped ear-drop'; in full 'the ear-drop of the seven girl-friends'", "register": "folk", "confidence": "certain", "usage_note": "jhumkā is the pendant cluster of an ear-ring; applied to the sky it names both the Bear and the Pleiades, which is a genuine ambiguity in the sources and not a slip - Platts gives both senses in one entry. The full phrase sāt sahelyoṅ kā jhūmkā ('the seven girl-friends') fixes it on the Bear.", "quote": "H جهمکا झुमका jhum'kā, jhūmkā , n. m. 1. A cluster; a bunch of flowers or fruit. 2. The bell-shaped pendant of an earring. 3. (sāt sahelyoṅ kā jhūmkā) Charles's wain; Ursa major. 4. A flower; Gloriosa superba.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. jhum'kā, p. 499", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=499", "notes": "Independently confirmed for Urdu from the Panjab: L. Whyte King's list gives 'Urdu; jhamakkā, a cluster' for the Great and Lesser Bear, with the editor R. C. Temple adding '[This last is more commonly sāt sahelion ké jhamkā, the cluster of seven maidens.]' - Panjab Notes and Queries, vol. II (Feb. 1885), note 521, p. 84. Platts, p. 407, lists the same word for 'Charles's Wain, Ursa Major; the Pleiades'."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Khatale and Bagale", "literal_meaning": "cot and bedstead", "register": "folk", "confidence": "certain", "usage_note": "the four bowl-stars are a cot with a man asleep on it; the three handle-stars are thieves", "quote": "The seven stars of the Great Bear are sometimes known as Khatale and Bagale. Four are thought to be a cot with a man asleep thereon, and the other three are thieves.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 64", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n66", "notes": "The fullest telling of the cot-figure I found anywhere: not just a bed, but an occupied bed with three thieves creeping up on it. These are the same two words Molesworth records as खाटलें and बाजलें (1857, p. 202), but Enthoven prints them in roman only, in italic and WITHOUT diacritics — no Devanagari appears anywhere in the book — so name_native is left null here rather than back-supplied from Molesworth. Enthoven gives no community and no district for this name; the book is compiled from questionnaire returns and attributions in its sky chapter are regional at best."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "खाटलें", "name_roman": "khāṭalēṃ", "literal_meaning": "a small bedstead, a cot", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "खाटलें khāṭalēm n (Dim. of खाट) A small bedstead or cot. 2 Charles's wain, the Bear. खाटल्यावर जाणें To commit incest (esp. with the mother).", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. खाटलें, p. 202", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%96%E0%A4%BE%E0%A4%9F%E0%A4%B2%E0%A5%87%E0%A4%82&searchhws=yes&matchtype=exact", "notes": "The cot-figure: the Dipper's bowl is the frame of a string bed and the handle its legs or its trailing cords. This is the classic Indian vernacular alternative to the Seven Sages, and Marathi has it plainly. Contrast the bier-figure reported for other Indian languages: Molesworth's entries for 'bier' (ओकटें, ओखटें, किरडी) contain no astronomical sense at all."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "खाटलें", "name_roman": "khāṭalēṃ", "literal_meaning": "a small bedstead, a cot", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "खाटलें khāṭalēm — न. १ लहान बाज; खाट. २ (कुण.) सप्तऋषी (आकाशांतील तारकापुंज, त्यांच्या आकृतीवरून). ३ बैलगाडी. ४ बाडबिछाना. [खाट]", "citation": "Y. R. Date et al., Maharashtra Sabdakosa (Poona, 1932-38), s.v. खाटलें, p. 863", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/marathi_query.py?qs=%E0%A4%96%E0%A4%BE%E0%A4%9F%E0%A4%B2%E0%A5%87%E0%A4%82&searchhws=yes&matchtype=exact", "notes": "Date confirms Molesworth and adds the reason — 'from their shape' — and a third sense, बैलगाडी 'bullock-cart', which is a second vehicle-figure for the same group and the exact counterpart of English Charles's Wain. Date tags both खाटलें and खाटलेंबाजलें '(कुण.)'; I could not verify the expansion of that abbreviation, as DSAL's front matter for the Maharashtra Sabdakosa is an un-OCRed image PDF. It is most plausibly कुणबी, the cultivator dialect, which would make the register agricultural."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "खाटलें बाजलें", "name_roman": "khāṭalēṃ bājalēṃ", "literal_meaning": "cot-and-bedstead", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "खाटलें khāṭalēm, बाजलें bājalēm n A vulgar term for Ursa Major, Charles's wain. 2 A term for the squares or divisions upon (female) garments.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. खाटलें बाजलें, p. 202", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%96%E0%A4%BE%E0%A4%9F%E0%A4%B2%E0%A5%87%E0%A4%82%20%E0%A4%AC%E0%A4%BE%E0%A4%9C%E0%A4%B2%E0%A5%87%E0%A4%82&searchhws=yes&matchtype=exact", "notes": "Reduplicated compound of two words for a string bed. Molesworth's 'vulgar' is a register label, not a judgement of obscenity — it marks the word as of the common people as against the learned सप्तऋषि."}, {"language": "Odia", "region": "Sambalpur (western Odisha)", "name_native": "ବାଜ୍ଖଟ୍", "name_roman": "Bāj-khaṭ", "literal_meaning": "'the bier' — the bamboo bedstead on which a corpse is carried to the burning-ground", "register": "folk", "confidence": "certain", "usage_note": "Sense 1 of the same headword is the object itself. The Big Dipper as a bier is a real folk figure and reads the asterism the way Hindi khaṭolā and Arabic na'sh do — as a funeral cot, the four bowl stars the frame and the three handle stars the mourners.", "quote": "ବାଜ୍ଖଟ୍— Bāj-khaṭ ପ୍ରାଦେ. (ସମ୍ବଲପୁର) ବି— 1। ମୁର୍ଦାର ବୁହା ଖଟିଆ; କୋକେଇ—1. A bamboo bedstead or stretcher for carrying a corpse. 2। ସପ୍ତର୍ଷିମଣ୍ଡଳ (ତାରାପୁଞ୍ଜ)—2. The Great Bear (group of stars).", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ବାଜ୍ଖଟ୍ Bāj-khaṭ, p. 5484", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AC%E0%AC%BE%E0%AC%9C%E0%AD%8D%E0%AC%96%E0%AC%9F%E0%AD%8D&searchhws=yes&matchtype=exact", "notes": "The bier reading is my gloss on the two senses standing in one entry; Praharaj does not spell out the connection. The parallel with Hindi khaṭolā 'small cot', which Praharaj himself cites for the same group at p. 4095, supports it."}, {"language": "Punjabi", "region": "Jhang District, western Punjab", "name_native": null, "name_roman": "palang-pāwe", "literal_meaning": "'the legs of the bedstead'", "register": "folk", "confidence": "certain", "usage_note": "The Punjabi version cuts the asterism in two and names the halves separately - the four bowl stars as the four legs of a charpoy, the three handle stars as a net. Dames notes the identical Balochi usage khaṭ-phāḍhagh, 'the legs of the bedstead'.", "quote": "Panjabi: As in Balochi the four stars are called palang-pāwe, the legs of the bedstead. The three stars are called trangar, the net. This is the usage of the Jhang District.", "citation": "M. Longworth Dames, 'Names for the Great Bear', Panjab Notes and Queries, vol. II (Feb. 1885), note 522, p. 84", "source_url": "https://archive.org/details/pnq_v2", "notes": "Quoted with the OCR's evident misreadings of long vowels normalised only in the diacritics; wording and word-order are Dames's. Roman only in the source, so name_native is null."}, {"language": "Punjabi", "region": "Multan and Dera Ghazi Khan (Multani/Saraiki); Jhang District", "name_native": null, "name_roman": "traṅgar (traṅgaṛ)", "literal_meaning": "'a wide-meshed net for carrying straw or fodder on pack animals'", "register": "folk", "confidence": "certain", "usage_note": "A working object of the western Punjab plains - the loose net slung over a camel or donkey to carry straw - read into the sky. O'Brien makes it the whole Bear; Dames restricts it to the three handle stars and adds that the same word names the upper part of Orion, so it is a shape-word, not a fixed constellation name.", "quote": "TRANGAR, s. m. - 1, a net of large meshes in which straw, grass, leaves, &c., are packed, to be loaded on camels, horses or donkeys; 2, the Great Bear constellation.", "citation": "E. O'Brien, Glossary of the Multani Language compared with Punjábi and Sindhi (Lahore, 1881), s.v. trangar, p. 62", "source_url": "https://archive.org/details/glossarymultani00obrgoog", "notes": "Dames, Panjab Notes and Queries, vol. II, note 522, p. 84: 'O'Brien, Multání Glossary, s. v. trangar, gives trangar as the name of the Great Bear, but I believe it refers only to the three stars. The upper part of Orion is also called trangar.' The Orion application is entered separately."}, {"language": "Tamil", "region": "Puducherry", "name_native": "பெரியகரடி", "name_roman": "periya-karaṭi", "literal_meaning": "big bear", "register": "folk", "confidence": "certain", "usage_note": "A LATE CALQUE, not indigenous: the European 'Great Bear' translated word for word into Tamil, recorded by the Lexicon's Supplement and marked 'Pond.', i.e. current at Pondicherry. Recorded here precisely so that it is not mistaken for old Tamil sky-lore.", "quote": "பெரியகரடி periya-karaṭi , n. < பெரு-மை +. The Great Bear; சப்தரிஷிமண்டலம். Pond.", "citation": "Tamil Lexicon Supplement (University of Madras, 1939), s.v. பெரியகரடி, p. S372, marked Pond.", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AA%E0%AF%86%E0%AE%B0%E0%AE%BF%E0%AE%AF%E0%AE%95%E0%AE%B0%E0%AE%9F%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "Its pair சின்னக்கரடி ciṉṉa-k-karaṭi, 'The constellation Little Bear; ஒரு நக்ஷத்திரத்தொகுதி. Pond.' (Supplement p. S280), confirms the pattern: a bear-pair is a European constellation scheme, and the Tamil tradition otherwise counts these stars as seven ṛṣis or simply as eḻumīṉ 'the seven stars'. The French colonial context of Pondicherry is the obvious channel; the Lexicon does not say so and neither do I."}, {"language": "Urdu", "region": "marked dakh. (Deccani) by Shakespear on Harris's authority; unmarked in Platts and Fallon", "name_native": "پلنگ تين چور", "name_roman": "palang tīn ćor", "literal_meaning": "'the bedstead and three thieves'", "register": "folk", "confidence": "certain", "usage_note": "The single best folk name in the whole file: the four-star bowl is a charpoy and the three handle stars are thieves creeping up on it. R. C. Temple (Panjab Notes and Queries II.83) thought the image reached Hindustani from Turki, where the Qazaq name is likewise 'the seven thieves' who try to steal a horse from the Little Bear.", "quote": "پلنگ تين چور palang tīn chor (bedstead and three thieves), Charlesʼs wain (dakh. Harris).", "citation": "John Shakespear, A Dictionary, Hindustani and English, 3rd ed. (London, 1834), s.v. palang, p. 1949", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/shakespear_query.py?page=1949", "notes": "Shakespear alone prints the phrase in the Urdu script. Platts, p. 268, s.v. palang (पलंग / پلنگ): 'palang tīn ćor, s.m. \"The bed and three thieves,\" Charles's wain' - unmarked, i.e. northern too. Fallon, p. 366, adds the gloss 'S. सप्तऋषि', equating it with the saptarṣi."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Kalher, Kalir, Kalhad; Muvir Kaler", "literal_meaning": "thieves; three thieves", "register": "tribal", "confidence": "certain", "usage_note": "The three who mean to steal the old woman's cot the moment she sleeps. In one village the three are instead Poyi, a nobleman, his wife Poyatar and his kotwal, moving towards their salvation.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Muvir is 'three'. The variant with the nobleman comes from a single village and is kept because it shows the figure being re-read locally."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Katul; Sedona Katul", "literal_meaning": "a cot; the old woman's cot", "register": "tribal", "confidence": "certain", "usage_note": "The four bowl stars are a cot whose four legs are of gold, silver, inferior silver and copper, counted anticlockwise. The old woman must never fall asleep, because thieves are waiting to take the cot; and if she sleeps — that is, if the Dipper sets — the world ends. Saptarshi is the reference point from which the Gonds locate everything else in the sky.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The 'she must not sleep' clause encodes circumpolarity, which held at this latitude until roughly 1000 BCE; the authors note this themselves and it should be read as their inference."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "khaṭī-pāwā bīnkō (the three outside stars: ḍhālbar)", "literal_meaning": "the cot-feet constellation; thieves", "register": "tribal", "confidence": "certain", "usage_note": "The quadrangle is the bed; the three stars outside it are ḍhālbar, thieves, after the bedstead.", "quote": "Khaṭī-pāwā binko, lit. the cot-feet constellation, i. e. the Great Bear (or rather, the quadrangle in the Great Bear — the three outside stars being called ḍhālbar, or thieves) of the aforesaid bedstead.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. khaṭī, p. 415 (thief: s.v. ḍhālbās, p. 403)", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "The single most widely shared indigenous figure in this compilation: cot plus three thieves, attested independently in Kurukh (Dravidian), Santali (Munda), Gondi (Dravidian) and among the Chhattisgarhi Dhuri. Grignard prints the plural ḍhālbar; his headword is ḍhālbās, 'a thief'."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "topoḍ-akan parkom ipilko (printed 'topagara parkom ipilko')", "literal_meaning": "the bier stars", "register": "tribal", "confidence": "certain", "usage_note": "The cot doubles as the bier that carries a corpse to the grave; after the burial one side of the frame is broken and the bed left at the burial ground. The watchman on the threshing floor, waking cold before dawn, sees the broken frame in the north, and in Alioth and Mizar the mourners walking away from the grave.", "quote": "The quadrangle with these sad associations is called topagara parkom ipilko, the bier stars.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "The first element is printed topagara/topogara in the two scans and could not be checked against its own alphabetical entry, since Encyclopaedia Mundarica vols. IX, XI and XIV-XVI are not on the Internet Archive; the reading of the first word is therefore unresolved and only 'the bier stars' is secure. Note how far this is from Saptarṣi — the same four stars, an entirely different mood."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Buḍhi parkom ipil", "literal_meaning": "the old woman's cot star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Buḍhi parkom ipil. The four chief stars in the body of the \"Great Bear.\"", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Buḍhi parkom ipil, p. 79", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Campbell's neighbouring entries fix the elements: 'Budhi. An old woman'; parkom is the string cot. The same figure — an old woman's cot with the three handle stars as thieves — is recorded independently for Kurukh (khaṭī-pāwā bīnkō with ḍhālbar), for Gondi (Sedona Katul with Kalher) and for the Chhattisgarhi Dhuri (Russell 1916). Campbell does not name the three trailing stars."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Katikālmin", "literal_meaning": null, "register": "tribal", "confidence": "likely", "usage_note": null, "quote": "A constellation of seven stars is called Katikālmin. From the description it appeared to be the Great Bear. This constellation was not visible, but when I made a drawing of its seven chief stars, it was at once recognised as Katikālmin.", "citation": "Rivers, The Todas (1906), p. 594", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "Rivers' method — he drew the seven stars and had the drawing named — is unusually good practice for 1906 and is why this is graded likely rather than disputed. He gives no meaning for the name. Alone among the traditions here, the Toda Ursa Major is not a cot."}, {"language": "Assamese", "region": "Assam", "name_native": "অৰুন্ধতী", "name_roman": "arundhatī", "literal_meaning": "the wife of the sage Vasiṣṭha", "register": "sanskritic", "confidence": "disputed", "usage_note": "Recorded here for its error, which is instructive. The Assamese definition is correct — Arundhatī is among the seven stars called the Saptarṣimaṇḍala, and Assamese brides are shown her at the wedding as the type of the faithful wife, and a person within six months of death cannot see her. The English gloss appended to it, 'the morning star; one of the pleiades', is wrong on both counts.", "quote": "…কৰ্দ্দম ঋষিৰ কন্যা আৰু বশিষ্ঠৰ ভাৰ্য্যা; [এওঁ সতী-ধৰ্ম্মত থকাৰ কাৰণে স্বামীৰে সৈতে স্বৰ্গৰ 'সপ্তৰ্ষিমণ্ডল বোলা তৰা সাতোটাৰ মাজত আছে বুলি ভবা হয়; হিন্দু ছোবালীক বিয়াৰ সময়ত এই নক্ষত্ৰক মহাসতী বুলি দেখুওবা ৰীতি আছে]; পৰমায়ু শেষ হ'লে অৰুন্ধতী দেখা নেপায় বুলি কয়; wife of the sage Vȧśiṣṭha; the morning star; one of the pleiades.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. অৰুন্ধতী arundhatī, p. 48", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%85%E0%A7%B0%E0%A7%81%E0%A6%A8%E0%A7%8D%E0%A6%A7%E0%A6%A4%E0%A7%80&searchhws=yes&matchtype=exact", "notes": "HOMONYM/ERROR WARNING. The English 'the morning star; one of the pleiades' contradicts the Assamese text of the same entry and every other source in this file. The Odia parallel is exact and correct: Praharaj (p. 570, and p. 54 s.v. ଅକ୍ଷମାଳା) makes Arundhatī the small star beside the 6th star of the Great Bear, i.e. Alcor, and preserves the Suśruta belief that one who will die within six months cannot see her. The Pleiades confusion has a traceable cause, given in Praharaj p. 4095: the other six ṛṣi-wives, unlike Arundhatī, were driven from their husbands' sides and became the Kṛttikās."}, {"language": "Bengali", "region": "Bengal", "name_native": "সপ্তর্ষি (সপ্তর্ষিমণ্ডল)", "name_roman": "saptarṣi (saptarṣi-maṇḍala)", "literal_meaning": "'the seven sages'", "register": "sanskritic", "confidence": "certain", "usage_note": "Biswas is the source that shows the modern Bengali equation of the group with the English 'Plough' as well as the Great Bear.", "quote": "~র্ষি n. the seven great ancient sages of India; (astr.) the Plough; (astr.) the Great Bear, the Ursa Major (also সপ্তর্ষিমন্ডল).", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. সপ্ত sapta, sub-lemma ~র্ষি, p. 981", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%B8%E0%A6%AA%E0%A7%8D%E0%A6%A4&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Bengali", "region": "Bengal", "name_native": "ঋক্ষমণ্ডল", "name_roman": "ṛkṣa-maṇḍala", "literal_meaning": "'the bear-circle'", "register": "sanskritic", "confidence": "certain", "usage_note": "Bengali keeps the old Vedic ṛkṣa 'bear ~ star' ambiguity live in a single dictionary entry: the headword is glossed 'the bear; a star; a constellation', and the compound is the Great Bear.", "quote": "ঋক্ষ r̥kṣa n. (for. the bear; a star; a constellation. ~মণ্ডল n. (astr.) The Saptarshi, the Great Bear. ~রাজ, ঋক্ষেশ n. the moon (when personified).", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. ঋক্ষ r̥kṣa, sub-lemma ~মণ্ডল, p. 176", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%8B%E0%A6%95%E0%A7%8D%E0%A6%B7&searchhws=yes&matchtype=exact", "notes": "'(for.' in the printed text is a truncated bracket in the DSAL transcription; the sense is unaffected."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "सप्त / سپت", "name_roman": "sapt-r̤ishi (sapt-rikh)", "literal_meaning": "'the seven sages'", "register": "sanskritic", "confidence": "certain", "usage_note": "The inherited Sanskrit name, retained unchanged; Platts and Fallon both file it as the standard learned equivalent of 'Charles's Wain'. Individual members keep their Sanskrit names in Hindi too: Platts s.v. marīćī (p. 1027) and vaśishṭh (p. 1194) each identify the sage with one of the seven stars.", "quote": "The seven great saint-sages of the Hindūs; the seven principal stars in the constellation of Ursa Major (supposed to represent the seven sages), Charles's Wain", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. sapta, p. 634", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=634", "notes": "Recorded to mark the sanskritic layer explicitly; the analytic interest is in the folk names that compete with it."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಅರುನ್ಧತಿ", "name_roman": "arundhati", "literal_meaning": null, "register": "sanskritic", "confidence": "likely", "usage_note": null, "quote": "ಅರುನ್ಧತಿ arundhati. -ತೀ N. of the wife of Vasiṣṭha. (Ch. v. 8; Mr. 258; Bp. 4, 30; 11, 40; J. 13, 40). 2, N. of a star (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಅರುನ್ಧತಿ arundhati, p. 102", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=102", "notes": "Kittel does not identify the star, so the modern_star here is supplied from the Sanskrit database rather than from him; hence 'likely'. He does not repeat Brown's 'in the Pleiades' error."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಚಿತ್ರಶಿಖಣ್ಡಿ", "name_roman": "citraśikhaṇḍi", "literal_meaning": "having bright crests", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಚಿತ್ರಶಿಖಣ್ಡಿ citra-śikhaṇḍi. having bright crests. 2, the saptarṣis or seven great ṛiṣis (Marīci, Atri, etc.) as represented in the seven principal stars of the constellation of ursa major (ಋಷಿಯರ್ Mr. 39); the constellaiion itself.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಚಿತ್ರಶಿಖಣ್ಡಿ citraśikhaṇḍi, p. 646", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=646", "notes": "COGNATE PAIR with Brown's Telugu చిత్రశిఖండి (p. 415), glossed identically. Both languages take the name over unchanged from Sanskrit."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಸಪ್ತರ್ಷಿ", "name_roman": "saptarṣi", "literal_meaning": "the seven sages", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಸಪ್ತರ್ಷಿ sapta-ṛiṣi. = ಸಪ್ತಋಷಿ. the seven great ṛiṣis: Marīci, Atri, Aṅgiras, Pulastya, Pulaha, Kratu, and Vasiṣṭha … 2, the constellation Ursa major (the seven stars of which are supposed to be the seven great ṛiṣis, ಚಿತ್ರಶಿಖಣ್ಡಿ, ಋಷಿಯರ್ Mr. 39).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಸಪ್ತರ್ಷಿ saptarṣi, p. 1579", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1579", "notes": "Kittel's Kannada gloss ಋಷಿಯರ್ ṛṣiyar 'the sages' (with the Kannada plural) is the closest thing to a vernacular form, and it is still the Sanskrit noun. No Dravidian name for the Dipper is recorded."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "സപ്തര്‍ഷികള്‍", "name_roman": "saptarṣikaḷ", "literal_meaning": "'the seven sages'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "സപ്തര്‍ഷികള്‍ Ursa Major (& സപ്ത ഋഷികള്‍ Bhg.)", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. സപ്തം saptam, p. 1036 (sub-entry സപ്തര്‍ഷികള്‍); the seven are named s.v. ഋഷി, p. 154", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=1036", "notes": "Gundert's list of the seven under ഋഷി (p. 154) is Kaśyapa, Atri, Vasiṣṭha, Viśvāmitra, Gautama, Jamadagni, Bharadvāja — the Purāṇic set, not the Bṛhat Saṃhitā set used in the Sanskrit database. Sanskrit word with a native Malayalam plural in -kaḷ. No vernacular Malayalam name for the Great Bear turned up in any source searched."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Arundhati", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Konkan death-divination: a person who cannot make out the pole star will die within six months, and some substitute Arundhatī for the pole star", "quote": "On the authority of the Mahakala Nirvan Tantra, some people in the Konkan believe that a person who cannot get a view of the pole-star will die within six months ; while others substitute the Arundhati star for the pole-star and determine the duration of life of a diseased person by the same process.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 68", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n70", "notes": "The scan splits 'Tantra' as 'T antra'; the quote gives the printed reading. A Konkan-attributed use, and the only place in this whole compilation where a specific region is attached to a star belief in Enthoven. Compare, on the same page, the parallel omen taken from 'the dimmest star of the Great Bear group' — which is Alcor again, under a description rather than a name."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "अरुंधती", "name_roman": "arundhatī", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "अरुंधती arundhatī f S A small star in Ursa major, the wife of वशिष्टऋषि.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. अरुंधती, p. 43", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%85%E0%A4%B0%E0%A5%81%E0%A4%82%E0%A4%A7%E0%A4%A4%E0%A5%80&searchhws=yes&matchtype=exact", "notes": "Marathi keeps the Sanskrit name and the Vasiṣṭha-Arundhatī marriage association. No vernacular name for Alcor surfaced in any of the four Marathi dictionaries searched."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "सप्तऋषि", "name_roman": "saptaṛṣi", "literal_meaning": "the seven sages", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "सप्तऋषि saptar̥ṣi m pl (S) The seven saints of the Brahmarshi order, contemporary with each Manu. The names of the several series differ; the names of the saints of the present Manwantara are कश्यप, अत्रि, भरद्वाज, विश्वामित्र, गौतम, जमदग्नि, वशिष्ठ, or, according to other authority, मरीचि, अत्रि, अंगिरस, पुलस्ति or स्त्या, पुलह, क्रतु, वशिष्ठ. These form, in astronomy, the asterism of Ursa major.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. सप्तऋषि, p. 820", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B8%E0%A4%AA%E0%A5%8D%E0%A4%A4%E0%A4%8B%E0%A4%B7%E0%A4%BF&searchhws=yes&matchtype=exact", "notes": "The learned name, marked S, standing alongside the folk खाटलें. Both are current; the split is one of register, not of region."}, {"language": "Marathi", "region": "Dharwar district (Deshasth Brahman community, Marathi-speaking)", "name_native": null, "name_roman": "the seven seers", "literal_meaning": null, "register": "sanskritic", "confidence": "disputed", "usage_note": "worshipped as seven cocoanuts by elderly women, married and widowed, on Ṛṣipañcamī, the bright fifth of Bhādrapada", "quote": "On this day elderly women, whether married or widows, worship seven cocoanuts, calling them the seven seers Agasti, Angirasa, Atri, Bhrigu, Kashyap, Vasishth, and Vishvamitra, the seven chief stars in the Great Bear which have power to cleanse from sin.", "citation": "Gazetteer of the Bombay Presidency, Vol. XXII: Dharwar (Bombay: Government Central Press, 1884), p. 71", "source_url": "https://archive.org/details/wbsl.15453", "notes": "The archive.org scan garbles two words of the quoted sentence — it prints 'muarricd' for 'married' and 'Vishvdmitra' for 'Vishvámitra'; the readings given are the printed ones. Confidence 'disputed' because of the LIST, not the identification of the group. This roster of seven ṛṣis for the Big Dipper — Agasti, Aṅgirasa, Atri, Bhṛgu, Kaśyapa, Vasiṣṭha, Viśvāmitra — matches neither of the two lists Molesworth gives s.v. सप्तऋषि (p. 820), and it puts AGASTI, who is normally Canopus in the far south, among the seven northern stars. Local ritual practice has evidently reshuffled the sages; no per-star mapping can be recovered from it."}, {"language": "Odia", "region": "Odisha", "name_native": "ଅକ୍ଷମାଳା", "name_roman": "Akshamāḻā", "literal_meaning": "'the rosary, the string of beads'", "register": "sanskritic", "confidence": "certain", "usage_note": "A second name for Arundhatī, and Praharaj gives the reason: the Saptarṣimaṇḍala encircles her like a rosary.", "quote": "3। ବଶିଷ୍ଠପତ୍ନୀ ଅରୁନ୍ଧତୀ —3. A name of the wife of sage Baṡishṭha. 4। ସପ୍ତର୍ଷିମଣ୍ଡଳର ପୁଚ୍ଛସ୍ଥ ମଧ୍ୟ ନକ୍ଷତ୍ର ବା 6ଷ୍ଠୀ ନକ୍ଷତ୍ର ପାଖରେ ଥିବା କ୍ଷୁଦ୍ର ତାରକା —4. Alcor; the small star near the 6th star of the constellation, Great Bear. [ଦ୍ର—ସପ୍ତର୍ଷିମଣ୍ଡଳ ଅରୁନ୍ଧତୀ ନକ୍ଷତ୍ରକୁ ମାଳାକାରରେ ବେଢ଼ିଥିବାରୁ ଅରୁନ୍ଧତୀର ଏହି ନାମ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଅକ୍ଷମାଳା Akshamāḻā, p. 54", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%85%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%AE%E0%AC%BE%E0%AC%B3%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Odia", "region": "Odisha", "name_native": "ଧ୍ରୁବ ଦର୍ଶକ", "name_roman": "Dhruba darṡaka", "literal_meaning": "'the Dhruva-shower', that which points out the pole star", "register": "sanskritic", "confidence": "certain", "usage_note": "A functional name, and one the same dictionary explains: extend the line joining the two stars at the head of the group and it passes beside Dhruvatārā. Sense 2 of the same word is the mariner's compass.", "quote": "ଧ୍ରୁବ ଦର୍ଶକ— Dhruba darṡaka ସଂ. ବି— 1। ସପ୍ତର୍ଷିମଣ୍ଡଳ —1. The constellation of the Ursa Major; the Great Bear. [ଦ୍ର—ଏହି ମଣ୍ଡଳର ମୁଣ୍ଡରେ ଥିବା ଦୁଇ ତାରାର ସଂଯୋଜକ ରେଖାକୁ ବଢ଼ାଇଲେ ତାହା ଧ୍ରୁବତାରା ପାଖ ଦେଇ ଯାଏ।] 2। ଜାହାଜିଆମାନଙ୍କର ଦିଗ୍ବାରଣ ଯନ୍ତ୍ର— 2. The mariner's compass.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଧ୍ରୁବ ଦର୍ଶକ Dhruba darṡaka, p. 4069", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A7%E0%AD%8D%E0%AC%B0%E0%AD%81%E0%AC%AC%20%E0%AC%A6%E0%AC%B0%E0%AD%8D%E0%AC%B6%E0%AC%95&searchhws=yes&matchtype=exact", "notes": "At p. 4095 Praharaj glosses the English term directly: 'ଏ ଦୁଇ ତାରାକୁ The Pointers (ଧ୍ରୁବତାରାର ପ୍ରଦର୍ଶକ ବା ଧ୍ରୁବଦର୍ଶକ) ବୋଲାଯାଏ' — so the word may be a calque on the English Pointers rather than an inherited name."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "අරුන්දති", "name_roman": "arundati", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Invoked by the bridegroom at marriage as the model wife (Carter, p. 61).", "quote": "[Slw. P. Sk. arundhatī.]", "citation": "Jayatilaka (ed.), A Dictionary of the Sinhalese Language (Royal Asiatic Society, Ceylon Branch, 1935– ), s.v. අරුන්දති arundati, p. 641", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/jayatilaka_query.py?qs=Alcor&matchtype=default", "notes": "Jayatilaka identifies the star modernly — Arundhatī as Alcor, and අරුන්ධතීනාථ arundhatī-nātha, 'the husband of Arundhatī, i.e. Vasiṣṭha', as Mizar (both p. 641). This matches the Sanskrit database exactly. WARNING for anyone using Carter: at p. 61 he glosses Arundhatī as 'Pleiades, හත්දින්න, (or one of the stars thereof)', which is wrong; Jayatilaka corrects it. Only the etymology bracket is quoted here because the surrounding Jayatilaka text is a long citation apparatus."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "ඍෂියා", "name_roman": "r̥ṣiyā", "literal_meaning": "'sage, ṛṣi'", "register": "sanskritic", "confidence": "certain", "usage_note": "The living Sinhala reference to the Dipper is to the seven sages, not to a bear.", "quote": "ඍෂියා r̥ṣiyā , n. H. saint or sage, sp. one of seven of exalted rank; in ast. the seven form the const. Ursa Major.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. ඍෂියා r̥ṣiyā, p. 132", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=Ursa&matchtype=default", "notes": "The bear names in Carter are not vernacular at all but his own English-to-Sinhalese calques, and he flags them: සප්තර්ෂිය saptarṣiya 'const. Ursa Major, see Ursa, E. S.' (p. 651) and සප්ත·මූනී·චාරය 'Charles's-wain. E. S.' (p. 651), where 'E. S.' means Carter is citing his own English-Sinhalese volume. මහා·භල්ලී·රාශිය 'great bear' (p. 487) and ක්‍ෂුද්‍ර භල්ලී රාශිය 'ursa minor' (p. 195) are Sanskrit-built calques of the English. Carter also has චිත්‍ර·ශඛණ්‍ඩිනයෝ (p. 232), 'seven sages, represented by the seven stars of the Great Bear' — the Citraśikhaṇḍinaḥ of the Sanskrit database."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "சாலினி", "name_roman": "cāliṉi", "literal_meaning": null, "register": "sanskritic", "confidence": "likely", "usage_note": "A name for Arundhatī used in one of the most striking sky-passages in the Caṅkam corpus: of the seven women dwelling by the shining banyan in the northern quarter, one — the divine star Cāliṉi — abstains, and the other six partake, and so become the Pleiades who bear Murugan.", "quote": "வடவயின், விளங்கு ஆல், உறை எழு மகளிருள்\nகடவுள் ஒரு மீன் சாலினி ஒழிய,\nஅறுவர் மற்றையோரும் அந் நிலை அயின்றனர்;", "citation": "Paripāṭal 5, ll. 43-45; Project Madurai e-text PM 0087", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0087.html", "notes": "The Tamil Lexicon (s.v. சாலினி¹ sense 2, vol. III p. 1391) gives 'Wife of Vasiṣṭha. See அருந்ததி' and cites this exact line as பரிபா. 5, 44. It derives the word from Sanskrit śālinī. HOMONYM: சாலினி¹ sense 1 is a woman oracle possessed by a spirit (quoted from Cilappatikāram 12, 7), சாலினி² is a gourd and சாலினி³ a toddy-seller; only sense 2 is astronomical. Note the passage's own phrase கடவுள் ஒரு மீன், 'the one divine star' — Tamil mīṉ used of Arundhatī directly. Winslow s.v. சாலி also records 'A name of Arundhati … supposed to have become one of the stars in Ursa Major' (1862, p. 441). Confidence 'likely': the identification of Cāliṉi with Arundhatī rests on the commentarial tradition reported by the Lexicon rather than on anything in the verse itself."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "అరుంధతి", "name_roman": "arundhati", "literal_meaning": null, "register": "sanskritic", "confidence": "disputed", "usage_note": "Wedding ritual: the bridegroom invokes her and the star is pointed out to the couple.", "quote": "అరుంధతి … A star in the Pleiades. A marriage ceremonies అరుంధతి is invoked by the bridegroom as a pattern of conjugal excellence and the star in the Pleiades which represents the wife of Vasishtha is pointed out to the bridal pair.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. అరుంధతి arundhati, p. 81", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=81", "notes": "IDENTIFICATION CONFLICT, flagged rather than resolved, and Brown turns out to be defensible. The standard identification, and the one in the Sanskrit database (db id 'arundhati'), is Alcor beside Mizar in Ursa Major, since Arundhatī is Vasiṣṭha's wife and Vasiṣṭha is Mizar. But the marriage mantra Thurston prints (Castes and Tribes, vol. I, 'Brahman', p. 289) puts her in the Pleiades in the same breath as in Ursa Major: the couple are 'shown Druva and Arundathi (the pole star and Ursa major)', and the verse then addresses 'she, Arundathi, who stands first among the six Krithikas (Pleiads), may she the eighth one, who leads the conjunction of the (moon with the) six Krithikas … Thou art the pillar of the stars.' Brown's 'a star in the Pleiades' is therefore reporting the ritual text, not blundering. Thurston elsewhere has south Indian officiants calling Arundhatī the pole star outright — vol. I p. 143 (Balija, 'they gaze at the pole-star (Arundati)'), vol. III p. 238 (Kāpu), vol. VII p. 179 (Toreya) and p. 307 (Valluvan) — which is a third, distinct popular equation. All three circulate; none is corrected here."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "చిత్రశిఖండి", "name_roman": "citra-śikhaṇḍi", "literal_meaning": "the bright-crested ones", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "చిత్రశిఖండి chitra-ṣikhanḍi. n. The constellation called the Great Bear.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. చిత్రము chitramu, p. 415", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=415", "notes": "COGNATE PAIR: Kittel has the identical entry in Kannada, ಚಿತ್ರಶಿಖಣ್ಡಿ (p. 646), also glossed as Ursa Major. Both are Sanskrit tatsamas; the db has the same name under 'citrashikhandin'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "సప్తర్షులు", "name_roman": "saptarṣulu", "literal_meaning": "the seven sages", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "సప్తర్షులు means (1.) the \"seven sages,\" viz., మరీచి, అత్రి, అంగీరుడు, పులస్త్యుడు, పులహుడు, క్రతువు, వసిష్ఠుడు; (or) కశ్యపుడు, అత్రి, భరద్వాజుడు, విశ్వామిత్రుడు, గౌతముడు, జమదగ్ని, వసిష్ఠుడు; (2) the constellation of the Great Bear.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ఋషి ṛishi, p. 178", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=178", "notes": "NEGATIVE FINDING attached here: neither Brown nor Kittel records any Dravidian name for the Big Dipper — no plough, no cart, no bier, no seven sisters. Both give only saptarṣi and citraśikhaṇḍi. Searches of Brown and Kittel for 'Great Bear', 'Ursa', 'seven stars', 'plough' and 'wain' turned up nothing vernacular. This is the largest gap in the vernacular sky of both languages."}]}, {"key": "pleiades", "title": "The Pleiades", "kind": "cluster", "ra": 56.87, "dec": 24.11, "modern_star": {"common_name": "the Pleiades", "bayer": "M45, η Tauri (Alcyone)", "constellation": "Taurus"}, "sanskrit_db_id": "krittika", "names": [{"language": "Assamese", "region": "Assam", "name_native": "মণ্ডল", "name_roman": "maṇḍala", "literal_meaning": "'the circle, the ring'", "register": "vernacular", "confidence": "likely", "usage_note": "Sense 7 of the polysemous headword মণ্ডল: 'the seven stars clustered near the sign Taurus'. Using the bare word maṇḍala, with no qualifier, for the Pleiades is an Assamese usage; Bengali and Odia both require a compound (কৃত্তিকা / କାର୍ତ୍ତିକପୁଞ୍ଜ).", "quote": "7। বৱষ ৰাশিৰ ওচৰত থোপা বান্ধি থকা সাতোটা তৰা; the Pleiades.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. মণ্ডল maṇḍala, sense 7, p. 735", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%AE%E0%A6%A3%E0%A7%8D%E0%A6%A1%E0%A6%B2&searchhws=yes&matchtype=exact", "notes": "'বৱষ' is DSAL OCR for বৃষ 'Taurus'. Graded 'likely' rather than 'certain' only because the sense is one of eight in a crowded entry and is not separately illustrated."}, {"language": "Odia", "region": "Odisha", "name_native": "କାର୍ତ୍ତିକପୁଞ୍ଜ (କାର୍ତ୍ତିକପୁଞ୍ଜା)", "name_roman": "Kārttikapun̄ja", "literal_meaning": "'the Kārttika cluster'", "register": "vernacular", "confidence": "certain", "usage_note": "Marked ଦେ. (deśī), i.e. a native formation, not a tatsama: Odia has built its own compound on Kṛttikā rather than borrowing the Sanskrit name outright. Praharaj illustrates it with a ḍhaga (proverb): 'you pointed out the Kārttika cluster and I pointed out a gourd; whatever thief has got into my house, let him go out in front of me.'", "quote": "କାର୍ତ୍ତିକପୁଞ୍ଜ— Kārttikapun̄ja ଦେ. ବି—(ସଂ. କୃତ୍ତିକା ଓ ପୁଞ୍ଜ) କୃତ୍ତିକା ନକ୍ଷତ୍ରପୁଞ୍ଜ— The constellation of the Pleiades. ତୁ ଦେଖାଇଲୁ କାର୍ତ୍ତିକ ପୁଞ୍ଜା ମୁଁ ଦେଖେଇଲି ଲାଉ; ମୋ ଘରେ ଯେଉଁ ଚୋର ପଶିଛି ସେ ମୋହରି ଆଗରେ ଯାଉ। ଢଗ।", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. କାର୍ତ୍ତିକପୁଞ୍ଜ Kārttikapun̄ja, p. 1538", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%95%E0%AC%BE%E0%AC%B0%E0%AD%8D%E0%AC%A4%E0%AD%8D%E0%AC%A4%E0%AC%BF%E0%AC%95%E0%AC%AA%E0%AD%81%E0%AC%9E%E0%AD%8D%E0%AC%9C&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "හත්·දින්න", "name_roman": "hat·dinna", "literal_meaning": "'seven-produced' — හත් hat 'seven' (the inherited numeral, beside Sanskritic සත්) + දින්න, which Carter derives from දිනි 'produced'", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "හත්·දින්න hat·dinna , n. (දින්න fr. දිනි produced), the const. Pleiads. Pleiades, කැතිනැකත.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. හත්·දින්න hat·dinna, p. 713", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=Pleiades&matchtype=default", "notes": "The single clearest case in Sinhala of a sky-object that got a native name rather than a loan — and Carter parses it for us, so the etymology is the source's, not the compiler's. It coexists with the Eḷu loan කැති නැකත, to which Carter cross-refers it in both directions (p. 169, p. 713), and with the Sanskrit tatsama කෘත්තිකා (p. 182). Clough 1892 has it too, without gloss beyond the identification: 'Haddinna, s. the Pleiades' (p. 723). Jayatilaka cross-refers to it from ක්‍රිටික kriṭika, 'N. given to seven stars in the constellation Taurus; Pleiades', p. 3497."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "அறுமீன்", "name_roman": "aṟu-mīṉ", "literal_meaning": "six-star, the six stars", "register": "vernacular", "confidence": "certain", "usage_note": "The indigenous Tamil name of the Pleiades, formed from ஆறு āṟu 'six' + mīṉ 'star', and attested in the Caṅkam corpus. It is the Tamil counting-name, independent of the Sanskrit Kṛttikā, though the Lexicon glosses it with கார்த்திகை.", "quote": "கண்டிசின் வாழியோ குறுமகள் நுந்தை\nஅறுமீன் பயந்த அறம் செய் திங்கள்", "citation": "Naṟṟiṇai 202, ll. 8-9 (Pālai, by Pālai Pāṭiya Peruṅkaṭuṅkō); Project Madurai e-text PM 0296", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0296.html", "notes": "The Tamil Lexicon (s.v. அறுமீன், vol. I p. 181, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%85%E0%AE%B1%E0%AF%81%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact) defines it 'Pleiades, as containing six stars; கார்த்திகை. (பிங்.)', citing the Piṅkala Nikaṇṭu. The Naṟṟiṇai line joins the six stars to the moon — the Kārttikai full moon — and belongs to the Murugan birth-cycle: the Lexicon's அறுமீன்காதலன் aṟumīṉ-kātalaṉ (p. 181) is Skanda 'as one brought up by the goddesses of the Pleiades'. Winslow, s.v. அறு, gives the same word as 'The pleiades regarded as six stars being the third lunar constellation of the Hindus' and marks it '(p.)', poetical."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "அறுவாய்", "name_roman": "aṟu-vāy", "literal_meaning": "six-part, six-mouthed", "register": "vernacular", "confidence": "certain", "usage_note": "A third Tamil counting-name for the Pleiades, from the same numeral ஆறு.", "quote": "அறுவாய்² aṟu-vāy , n. < ஆறு³ +. The third nakṣatra, as consisting of six stars; கார்த்திகை. அறுவாய் நிறைந்த மதிப்புறத் தோவென (கல்லா. 90, 9).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. அறுவாய்², vol. I p. 182; quoting Kallāṭam 90, 9", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%85%E0%AE%B1%E0%AF%81%E0%AE%B5%E0%AE%BE%E0%AE%AF%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "HOMONYM: அறுவாய்¹ on the previous page, from அறு- 'to cut', means 'opening in a cut or wound' and 'vacant gap, as of the moon in its waxing phases' — and it is quoted from Tirukkuṟaḷ 1117 with the same collocation அறுவாய் நிறைந்த as the astronomical entry. The two senses can only be separated by context; here the moon is 'filled' beside the six stars."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "எரிநாள்", "name_roman": "eri-nāḷ", "literal_meaning": "fire-star, the star of fire", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil translation, not a borrowing: the Sanskrit Āgneya 'belonging to Agni' rendered with the native Tamil words எரி 'fire' and நாள் 'asterism'.", "quote": "எரிநாள் eri-nāḷ , n. < எரி +. The third nakṣatra. See கார்த்திகை. (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. எரிநாள், vol. I p. 531, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%8E%E0%AE%B0%E0%AE%BF%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Beside it the Lexicon has the half-borrowed அங்கிநாள் aṅki-nāḷ (p. 22, < Skt. agni + Tamil nāḷ), 'the third nakṣatra' and also 'the thirteenth', and கனலிநாள் kaṉali-nāḷ (p. 836), 'fire-star' for the 13th. The Sanskrit database entry 'agneya' warns that Āgneya is Kṛttikā and not the star Agni; the same warning applies to eri-nāḷ."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "இறால்", "name_roman": "iṟāl", "literal_meaning": null, "register": "vernacular", "confidence": "likely", "usage_note": "A Tamil name of the Pleiades recorded by the Tivākaram, of obscure motivation.", "quote": "இறால் iṟāl , n. prob. இறு¹-. 1. Shrimp, prawn, macroura; மீன்வகை. (பிங்.) 2. Bluish seer-fish, Cybium commersonii; வெள்ளிறால். 3. The third nakṣatra. See கார்த்திகை. (திவா.) 4. Bull; எருது. (பிங்.) 5. Honeycomb; தேன்கூடு.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. இறால் sense 3, vol. I p. 363, citing the Tivākaram", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%87%E0%AE%B1%E0%AE%BE%E0%AE%B2%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "HOMONYM, and a bad one: the same headword is 'shrimp', 'seer-fish', 'bull' and 'honeycomb'. Only the Tivākaram-sourced sense 3 is astronomical. Winslow independently records the sense — 'The third lunar mansion, the pleiades, கார்த்திகைநாள்' (1862, p. 113) — which is why it is kept, but the motivation of the name is unrecoverable and no literary attestation in the astronomical sense was found. Confidence 'likely' reflects the identification's dependence on two dictionaries with no verse behind them."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "ஆறாமீன்", "name_roman": "āṟā-mīṉ", "literal_meaning": "six-star (variant of aṟu-mīṉ)", "register": "vernacular", "confidence": "certain", "usage_note": "A second form of the counting-name, and the one that carries the seamen's compound below.", "quote": "ஆறாமீன் āṟā-mīṉ , n. < id. + id. +. Pleiades, as containing six stars; கார்த்திகை.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஆறாமீன், vol. I p. 259", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%86%E0%AE%B1%E0%AE%BE%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Tamil tradition consistently counts six Pleiads, not seven as in the Sanskrit Kṛttikāḥ; hence the six presiding goddesses of கார்த்திகைத்தேவிமார் (p. 880) and வாகுலை (p. 3574)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "కత్తెర", "name_roman": "kattera", "literal_meaning": "scissors", "register": "vernacular", "confidence": "certain", "usage_note": "The Pleiades period as the farmer and almanac-user knows it; Brown attaches the solar season directly to the word.", "quote": "కత్తెర [Tel.] n. Scissors. The constellation or sign called కృత్తిక. The period of time when the sun is between the signs భరణి, రోహిణి and కృత్తిక. … కత్తెరయెండ kattera-yeṇḍa. n. Fierce heat.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. కత్తెర kattera, p. 238", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=238", "notes": "The cutting figure survives from Sanskrit kṛt- 'to cut' but is re-lexicalised on the native word kattera 'scissors'. The derived kattera-yeṇḍa 'fierce heat' shows the name doing seasonal work: the Kṛttikā period is the hot season in the Telugu country."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "మంగలకత్తిరూపు", "name_roman": "mangala-katti-rūpu", "literal_meaning": "shaped like a barber's razor", "register": "vernacular", "confidence": "certain", "usage_note": "A second, purely descriptive Telugu name for the Pleiades, from the shape of the cluster.", "quote": "మంగల [Tel.] n. The barber caste. మంగలకత్తి mangala-katti. n. A razor, క్షురము. మంగలకత్తిరూపు the constellation called కృత్తికానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. మంగల mangala, p. 937", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=937", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. With kattera 'scissors' this makes two independent Telugu names for the Pleiades built on a cutting-blade image."}, {"language": "Urdu", "region": "Urdu, from Persian", "name_native": "پروين", "name_roman": "parvīn", "literal_meaning": "Persian name of the Pleiades", "register": "vernacular", "confidence": "certain", "usage_note": "The Persian counterpart of s̤uraiyā, equally at home in Urdu and equally common as a woman's name.", "quote": "P پروين parvīn , s.m. The Pleiades.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. parvīn, p. 258", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=258", "notes": "Also Fallon, p. 356, and Shakespear, p. 406. Panjab Notes and Queries II.521 (p. 84) records the Panjab Persian usage as 'Parvin or Paran'."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "ثريا", "name_roman": "s̤uraiyā", "literal_meaning": "diminutive of Arabic tharwā 'abundance'", "register": "vernacular", "confidence": "certain", "usage_note": "The central Arabic star name naturalised in Urdu, also as a woman's given name. The extended form ʻaqd-i-s̤uraiyā, 'the necklace of the Thurayyā', is what Fallon offers as the Arabic equivalent of Hindi guchchā tārā.", "quote": "A ثريا s̤uraiyā (from ثرو), s.m. The Pleiades ( = ʻaqd-i-s̤uraiyā).", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. s̤uraiyā, p. 368", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=368", "notes": "Platts prints no Devanagari for Arabic-origin headwords, so only the Urdu script is given. Also Fallon, p. 461 ('surai'yā, aqd-i-suraīyā ... The Pleiades (jhumkā)'), and Shakespear, p. 599. A Panjab list of Arabic/Persian sky names (Panjab Notes and Queries, vol. II, note 521, p. 84) gives it as 'Ssvayyá' [Thurayyā], 'diminutive of suru, plentiful, rich'."}, {"language": "Hindi", "region": "Oudh (Awadh), eastern United Provinces", "name_native": null, "name_roman": "(the seven sisters - no name recorded)", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "An aetiological tale rather than a name: the seventh sister is left out of the sharing of a sesame seed and so sits a little apart in the sky. Recorded from Sitapur. It explains a naked-eye fact - the cluster's outlier - and shows that the 'seven sisters' reading of the Pleiades is independently present in Awadhi village lore alongside the Sanskrit six Kṛttikās.", "quote": "The Pleiades were seven sisters. It happened on a day that one of them found a seed of the til (sesamum). She divided it among six, the seventh sat behind her and was forgotten. That is how she takes her place just a little apart from the others in the sky.", "citation": "G. H. Roberts, 'Oudh - The Pleiades - Popular astronomy', Indian Notes and Queries [late Panjab Notes and Queries], vol. IV (1886-87), note 566", "source_url": "https://archive.org/details/inq_pnq_v4", "notes": "No vernacular name is given in the note, hence name_roman is descriptive. Cited by note number, the standard locator for this journal."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": null, "name_roman": "baććē-wālī murġī", "literal_meaning": "'the hen with chickens'", "register": "folk", "confidence": "certain", "usage_note": "The commonest folk image for the cluster across Eurasia; here attached to the ordinary Hindi word for a young of any creature. Platts prints the compound in roman only, under the Devanagari/Urdu headword बच्चा / بچا.", "quote": "baćće-wālī murg̠ī, s.f. lit. 'Hen with chickens'; the Pleiades.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. baććā, p. 135", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=135", "notes": "name_native is left null because Platts gives no script form for the compound itself. Fallon, p. 230, s.v. bachchah, likewise glosses it only as 'The constellation of the Pleiades'. The expanded form with gagan is entered separately."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "गिचपिचिया / گچپچيا", "name_roman": "gić-pićiyā", "literal_meaning": "'crowded/squeezed together' (variant of kac-pac)", "register": "folk", "confidence": "certain", "usage_note": "A phonetic doublet of kaćpaćiyā with initial g-; the two forms sit on different pages of Platts and evidently belong to different speech areas, though he marks neither.", "quote": "H گچپچيا गिचपिचिया gić-pićiyā [gic-pić = gać-pać, q.v.+Prk. इओ = S. इकः], s.m. The Pleiades.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. gić-pićiyā, p. 898", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=898", "notes": "Also in Shakespear (1834), s.v. gich-pichiyā, p. 1436, printed there in the Urdu script only: گچ پچيا."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": null, "name_roman": "guććhā tārā", "literal_meaning": "'the cluster star'", "register": "folk", "confidence": "certain", "usage_note": "guććhā is the ordinary word for a bunch of flowers or fruit, a tassel, a skein; the Pleiades are simply 'the bunch'. Fallon gives the Arabic ʻaqd-i-suraiyā ('the necklace of the Thurayyā') as its equivalent, showing the two layers translating each other.", "quote": "guććhā tārā, s.m. The Pleiades", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. guććhā, p. 898", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=898", "notes": "Headword printed by Platts as गुच्छा / کچها. Fallon, p. 991, s.v. guch'chhā: 'guchchā tārā; A. aqd-i-suraiyā. (Ast.) Pleiades.' The compound itself is printed in roman by both, hence name_native null."}, {"language": "Hindi", "region": "Hindustani generally (Fallon's dictionary is explicitly one of spoken idiom)", "name_native": "कचबचिया / کچ بچيا", "name_roman": "kachbach'iyā", "literal_meaning": "'the jumbled ones' (kac-bac, variant of kac-pac)", "register": "folk", "confidence": "certain", "usage_note": "Fallon's spelling with -b- suggests contamination from bacca 'child/young one', which is also the base of the competing 'hen and chickens' name for the same cluster.", "quote": "H کچ بچيا कचबचिया kachbach'iyā , n. m. The Pleiades.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. kachbach'iyā, p. 917", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=917", "notes": "Competing form; see kaćpaćiyā and gić-pićiyā."}, {"language": "Hindi", "region": "Hindustani generally; recorded without regional restriction by Platts, Fallon and Shakespear", "name_native": "कचपचिया / کچپچيا", "name_roman": "kaćpaćiyā", "literal_meaning": "'crowded together'", "register": "folk", "confidence": "certain", "usage_note": "Built on the Hindi echo-compound kac-pac 'jumbled, crowded together' with the agent suffix -iyā; it is a descriptive nickname for the huddled cluster, not a reflex of Kṛttikā. Still current: McGregor, Oxford Hindi-English Dictionary (1993), p. 155, has कचपचिया नक्षत्र and Braj/Awadhi कचपची.", "quote": "H کچپچيا कचपचिया kaćpaćiyā [kaćpać, q.v.+iyā = S. इकः], s.m. lit. 'Crowded together'; the Pleiades.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. kaćpaćiyā, p. 818", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=818", "notes": "Platts prints both Devanagari and the Urdu script (Nastaʿlīq in the original type); both are given above in that order. Corroborated by Shakespear, A Dictionary, Hindustani and English (1834), s.v. kachpach-iyā, p. 1327, and by Fallon's variant kachbach'iyā (separate entry)."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Gadli", "literal_meaning": null, "register": "folk", "confidence": "likely", "usage_note": "used to predict the rise and fall of the cotton market", "quote": "The Rohini and Krittika constellations, popularly known as Gadli, are supposed to indicate the rise and fall in the cotton-market.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 68", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n70", "notes": "A single folk name covering two adjacent asterisms — Aldebaran with the Hyades, and the Pleiades — i.e. roughly the head of Taurus. Confidence 'likely' rather than 'certain' because Enthoven names the pair but does not say where the group's boundaries fall, and gives no etymology; I could not establish the meaning of Gadli from any dictionary consulted (it is not in Molesworth, Vaze, Tulpule or Date under गडली, गाडली or गादली). Roman only, no script printed. The cotton-market use points to Gujarat or Khandesh, but Enthoven does not say so and I have not assumed it."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "विंचू", "name_roman": "viñcū", "literal_meaning": "scorpion", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "विंचू viñcū m (वृश्र्चिक S or بچھو H) A scorpion. 2 The Pleiades. From the fancied resemblance to a scorpion. 3 A common term for the bits of cord which, in stringing a bedstead &c., are attached to the ends of the lines used in the work.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. विंचू, p. 756", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B5%E0%A4%BF%E0%A4%82%E0%A4%9A%E0%A5%82&searchhws=yes&matchtype=exact", "notes": "The single most striking non-Sanskrit sky-name in Marathi lexicography: the Pleiades seen as a SCORPION, not as the Kṛttikās. Independently confirmed by Date's Maharashtra Sabdakosa (p. 2824), which glosses sense 2 as 'कृत्तिकानक्षत्र (विंचवाच्या आकारावरून)' — 'the Kṛttikā nakṣatra, from the shape of a scorpion'. Note the homonym trap: विंचू is also the ordinary word for Scorpius/scorpion, so a bare attestation of विंचू in a text is NOT evidence for the Pleiades."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "विंचू", "name_roman": "viñcū", "literal_meaning": "scorpion", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "विंचू viñcū — पु. १ एक अष्टपाद विषारी प्राणी. हा नांगींने दंश करतो. (अप.) विचुः विचु; इचु. २ कृत्तिकानक्षत्र (विंचवाच्या आकारावरून).", "citation": "Y. R. Date et al., Maharashtra Sabdakosa (Poona, 1932-38), s.v. विंचू, p. 2824", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/marathi_query.py?qs=%E0%A4%B5%E0%A4%BF%E0%A4%82%E0%A4%9A%E0%A5%82&searchhws=yes&matchtype=exact", "notes": "Second, independent attestation of the scorpion-figure for the Pleiades, seventy-five years after Molesworth. Retrieved through DSAL's combined Marathi search (marathi_query.py), because the standalone date_query.py endpoint returns empty pages."}, {"language": "Odia", "region": "Sambalpur (western Odisha)", "name_native": "କଠଲା ତାରା", "name_roman": "Kaṭhalā tārā", "literal_meaning": "'the mallet star' — Praharaj glosses kaṭhalā in this phrase as ବଢ଼େଇର ମୁଗୁର, the carpenter's mallet", "register": "folk", "confidence": "certain", "usage_note": "Given as the Sambalpuri name in Praharaj's systematic note on Kṛttikā, immediately after the general Odia name. The shape is argued for in the same entry: joining the six stars gives 'the shape of a dagger, or of a carpenter's wooden mallet'.", "quote": "ଆକାର ଓ ତାରକା ସଂଖ୍ୟା—6 ଟି ତାରା; ଏମାନଙ୍କୁ ଯୋଗ କଲେ ଗୋଟିଏ କଟାର ବା ବଢ଼େଇର କାଠମୁଗୁରାର ଆକାର ହେବ … ଓଡ଼ିଆ ବା ଦେଶୀୟନାମ—କାର୍ତ୍ତିକପୁଞ୍ଜା; ସମ୍ବଲପୁରୀ ନାମ କଠଲା ତାରା (କଠଲା=ବଢ଼େଇର ମୁଗୁର)। ପାଶ୍ଚାତ୍ୟ ନାମ—ଇଂ—Hen and chickens; the Pleides.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note on the 3rd asterism କୃତ୍ତିକା, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "Praharaj's own headword କଠଲା (p. 1245) gives a different sense — a railed wooden seat strapped on an elephant — and does not record 'mallet'. The mallet gloss exists only here, inside the parenthesis, and is presumably the Sambalpuri sense. Worth flagging: a reader working from the headword alone would misread the star-name as 'the howdah-seat star'."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "නැකැත්·කෙළිය", "name_roman": "nækæt·keḷiya", "literal_meaning": "'star-play' (Carter's own gloss)", "register": "folk", "confidence": "certain", "usage_note": "A festival at the full moon of Il (October–November) — the month in which the full moon stands near the Pleiades. Clough spells out the astronomy: 'when the moon is full near the Pleiades in the month ඉල් මස il-masa, (October-November)'.", "quote": "නැකැත්·කෙළිය nækæt·keḷiya , n. lit. star-play: a festival observed at full moon in ඉල්මස (Oct.-Nov.).", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. නැකැත්·කෙළිය nækæt·keḷiya, p. 322; Clough, A Sinhalese-English Dictionary (1892), s.v. Nakat-keliya, p. 273", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=star-play&matchtype=default", "notes": "The folk layer: an asterism doing calendrical work in village life rather than in an almanac. Structurally the counterpart of the Malayalam Tiruvātira and of the Kārttika full-moon reckoning; Jayatilaka's කාර්ත්තිකමාසය (p. 2916) makes the same Pleiades-full-moon definition for the month."}, {"language": "Tamil", "region": "Tamil Nadu (coast)", "name_native": "ஆறாமீனறவோட்டு", "name_roman": "āṟā-mīṉ-aṟa-v-ōṭṭu", "literal_meaning": "the running-through of the six stars", "register": "folk", "confidence": "certain", "usage_note": "A SEAMEN'S TERM — the clearest surviving trace in the lexica of Tamil coastal star-reckoning. The Pleiades segment of the zodiac marks the season of dangerous weather for boats.", "quote": "ஆறாமீனறவோட்டு āṟā-mīṉ-aṟa-v-ōṭṭu , n. < id. +. Passage of the sun through the segment of the Zodiac occupied by Pleiades, regarded by seamen as a period when rough weather is to be anticipated; கார்த்திகையில் சூரியன் பிரவேசிக்குங்காலம். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஆறாமீனறவோட்டு, vol. I p. 259, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%86%E0%AE%B1%E0%AE%BE%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AE%B1%E0%AE%B5%E0%AF%8B%E0%AE%9F%E0%AF%8D%E0%AE%9F%E0%AF%81&searchhws=yes&matchtype=exact", "notes": "Winslow's own entry, s.v. ஆறு, is independent confirmation: 'The transit of the sun through the pleiades, regarded by seamen, as a critical or disastrous season, when rough weather is to be looked for' (A Comprehensive Tamil and English Dictionary, 1862, p. 76, https://dsal.uchicago.edu/cgi-bin/app/winslow_query.py?qs=Pleiades&matchtype=default). The season is the north-east monsoon; compare ஐப்பசிக்குழப்பம் below."}, {"language": "Urdu", "region": "marked dakh. (Deccani) by Shakespear; unmarked in Platts and Fallon, so also northern", "name_native": "گگن کي بچي والي مرغي", "name_roman": "gagaṇ ke bachche wālī murġhī", "literal_meaning": "'the hen and chickens of the sky'", "register": "folk", "confidence": "certain", "usage_note": "The fuller form of the preceding, with gagan 'sky' prefixed. Shakespear's dakh. tag is a genuine regional flag: several of these furniture-and-farmyard sky names reach him through Deccani Urdu.", "quote": "گگن کي بچي والي مرغي gagaṇ ke bachche wālī murg̠ẖ-ī (dakh.) The pleiades.", "citation": "John Shakespear, A Dictionary, Hindustani and English, 3rd ed. (London, 1834), s.v. gagaṇ, p. 1451", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/shakespear_query.py?page=1451", "notes": "Shakespear prints the Urdu script only. Platts, p. 910, gives the same phrase in roman under गगण / گگن without any regional mark: 'gagaṇ-ke baćće-wālī murg̠ī, \"The hen and chickens of the sky,\" the Pleiades'; Fallon, p. 1001, has it under gag'an."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Kutpari, Mogari, Mongari, Thengari, Mundari", "literal_meaning": "a bat — the wooden bat used to beat grain out of the husk", "register": "tribal", "confidence": "likely", "usage_note": null, "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The authors record several of these names as identifying either the Pleiades or Taurus depending on the village, so the identification is graded likely. A grain-beating implement thrown at the sky is the same class of object as the Mundari mallet."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "lohrā-capuā bīnkō; capuā bīnkō; pārkī bīnkō", "literal_meaning": "the blacksmith's-bellows constellation", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Lohrā-capuā bīnkō, name of a constellation also called pārkī bīnkō.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. bīnkō, p. 85; s.v. capuā, p. 128; s.v. lohrā, p. 465", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "Three entries agree that the bellows constellation is the Pleiades (s.v. capuā: 'Capuā-binko, the constellation of the Pleiades'). pārkī, given as a synonym, is elsewhere in Grignard a kind of dove — whether the same word is meant is not stated and is not assumed here."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "cuṭu rapa ipilko", "literal_meaning": "the mouse-roasting stars", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "cuṭu rapa ipilko sbst., ltly., the mouse roasting stars, i.e. the Pleiades.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. III, s.v. cuṭu rapa ipilko, col. 937", "source_url": "https://archive.org/download/in.ernet.dli.2015.14921/2015.14921.Encyclopedia-Mundarica-Vol-iii-1930_djvu.txt", "notes": "A second Mundari name for the cluster, attaching it to the mice of the Orion tableau rather than to the mallet. Hoffmann does not mention it in the long ipil article; it comes from the alphabetical entry."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "muṅgaru ipilko (moṅgaru ipilko)", "literal_meaning": "the wooden-mallet stars", "register": "tribal", "confidence": "certain", "usage_note": "The mallet the ploughman flung at a dove on her nest, aimed too high; it fell where the Pleiades are. In a second version heard south of Ranchi it is Siṅgboṅga who was chiselling a yoke and a plough to teach men to plough, and who threw the mallet at the dove.", "quote": "(6) moṅgaru ipilko, the wooden mallet flung by the ploughman, the Pleiads. These are a cluster of seven stars of which six are visible to the naked eye; but the Mundas have sharp eyes ... The man who pointed them out to us, saw seven of them", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Confirms Bodding's Santali gloss that the Pleiades are 'the mallet of the arar lalakko'. Hoffmann adds Ovid's quae septem dici, sex tamen esse solent, and notes his informant counted seven."}, {"language": "Nicobarese", "region": "Central Nicobars (Nancowry group)", "name_native": null, "name_roman": "tā-yan", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "tā-yan, Pleiades.", "citation": "Man, A Dictionary of the Central Nicobarese Language (1889), Nicobarese-English p. 207 s.v. tā-yan; English-Nicobarese p. 71 s.v. Pleiades", "source_url": "https://archive.org/download/adictionarycent00mangoog/adictionarycent00mangoog_djvu.txt", "notes": "Entered in both halves of the dictionary. Man gives no story and no calendrical use, and no other constellation name appears anywhere in the volume."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Sorenko", "literal_meaning": "the Soren people (a Santal sept name in the animate plural)", "register": "tribal", "confidence": "certain", "usage_note": "The totem of the Soren sept; the position of the cluster before dawn is used to tell the time of night. Campbell's illustrative sentence asks in which quarter of the sky the Pleiades stand at dawn.", "quote": "Sorenko. The Pleiades, or seven stars in Taurus. The Pleiad is the totem of the Soren sept of Santals. Netar Sorenko do okare aligaakokana? Just now where (in what part of the heavens) are the Pleiades at dawn?", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Sorenko, p. 594", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "One of the twelve Santal septs is Soren; the cluster and the sept share the name, so the Pleiades are a clan totem rather than a calendrical mansion. Nothing in Campbell's entry derives from the nakshatra system."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "sɘren (ipil), sɘrenko", "literal_meaning": "the Soren stars", "register": "tribal", "confidence": "certain", "usage_note": "Used to tell the hour of the night: 'the Pleiades have reached half down the western sky' marks roughly the position the sun holds at 3 p.m. Bodding also records the figure that joins the Pleiades to Orion: the cluster is the mallet belonging to the arar lalak.", "quote": "s.ko do arar lalakko reak murgar kantakoa, the Pleiades are the mallet of the arar lalakko (three small stars near the belt of Orion)", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. sɘren (ipil), p. 352", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "Bodding's headword is printed with a h
