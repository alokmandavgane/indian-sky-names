ooked vowel that the DjVu OCR renders as 'sgren'; the reading sɘren follows Campbell's Sorenko and the sept name Soren. The mallet-and-yoke figure is the one Hoffmann records at length for Mundari (muṅgaru ipilko), which is strong mutual confirmation across two independent lexicographers."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Kadsht", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": "Held to be six stars, not seven: Kadsht had six men and Keirt only one, and Keirt broke the leg of one of the six, so that five now stand close together and one lags behind. Because of that quarrel the god ruled that Kadsht and Keirt must never be in the sky together. At one funeral the setting of Kadsht and the appearance of Keirt was the sign that the azaramkedr might begin.", "quote": "The Pleiades are called Kadsht and the constellation is believed to be composed of six stars.", "citation": "Rivers, The Todas (1906), ch. XXIV 'Constellations and Stars', pp. 593-594", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "One of very few traditions anywhere that counts the cluster as six rather than seven and has a story for the missing one."}, {"language": "Bengali", "region": "Bengal (Calcutta/Serampore lexicography)", "name_native": "সপ্তর্ষি", "name_roman": "saptarṣi", "literal_meaning": "'the seven sages'", "register": "sanskritic", "confidence": "disputed", "usage_note": "Recorded as a divergence, not as a name to be used. Ram Comul Sen renders the English headword Pleiades by সপ্তর্ষি, which in every other source in this file — Bengali, Assamese and Odia alike — is Ursa Major.", "quote": "Pleiades বা Pleiads, n. s. Lat. Gr. সপ্তর্ষি।", "citation": "Ram Comul Sen, A Dictionary in English and Bengalee, vol. 2, Serampore, 1834, s.v. Pleiades, p. 168", "source_url": "https://archive.org/download/in.ernet.dli.2015.195645/page/n174_w2400.jpg", "notes": "Read directly from the page image. The error is worth keeping for the same reason as the Assamese অৰুন্ধতী entry: it is a recurring one, and it has a cause. Both the Pleiades and the Big Dipper are seven-star groups, and Purāṇic myth ties them — six of the seven ṛṣis' wives were driven from their husbands' sides and became the Kṛttikās (Praharaj p. 4095). A lexicographer reaching for 'the seven' can land on either. The correct Bengali is কৃত্তিকা, which Mendies's Companion to Johnson's Dictionary (1876) glosses simply 'the Pleiades; Karttika's nurse'."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "बहुला / بہلا", "name_roman": "bahulā", "literal_meaning": "'the abundant/dense ones'", "register": "sanskritic", "confidence": "certain", "usage_note": "Platts classes it H (Hindi), from Sanskrit bahulāḥ, an old alternative name for the Kṛttikās; his adjectival entry bahul (p. 190) even preserves the sense 'born under the Pleiades'.", "quote": "H بہلا बहुला bahulā [S. बहुलास्], s.m. The Pleiades; name of a people.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. bahulā, p. 190", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=190", "notes": "Links to the Sanskrit database entry bahula (Bahulā, alias of Kṛttikā)."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಅಗ್ನಿದೇವೆ", "name_roman": "agnidēve", "literal_meaning": "she whose deity is Agni", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಅಗ್ನಿದೇವೆ agni-dēve. the third lunar mansion, the Pleiades.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಅಗ್ನಿದೇವೆ agnidēve, p. 16", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=16", "notes": "The deity-name type, Sanskrit."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "കാര്‍ത്തിക", "name_roman": "kārttika", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Weather proverb: കാര്‍ത്തിക കഴിഞ്ഞാല്‍ മഴയില്ല, 'once Kārttika is past there is no more rain' — the Pleiades period marking the end of the north-east monsoon.", "quote": "കാര്‍ത്തിക kār‍ttika kārtiγa S. ( കൃത്തിക ) The 3d constellation, the Pleiades; the 3rd day of the lunar month. കാര്‍ത്തികം = വൃശ്ചികം Oct. — Nov. കാര്‍ത്തിക ക ഴിഞ്ഞാല്‍ മഴയില്ല prov.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. കാര്‍ത്തിക kārttika, p. 240", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%95%E0%B4%BE%E0%B4%B0%E0%B5%8D%E2%80%8D%E0%B4%A4%E0%B5%8D%E0%B4%A4%E0%B4%BF%E0%B4%95&searchhws=yes&matchtype=exact", "notes": "Gundert also records the Sanskrit form കൃത്തിക in Malayalam with the six-nurse legend, s.v. കൃത്തം p. 289: 'കൃത്തിക the 6 Pleiades ആറു കൃ. മാരും മുല നല്കി KR.' — 'the six Kṛttikās gave suck', to Kārttikeya. Malayalam has no attested native counting-name for the cluster of the Tamil aṟumīn 'six stars' type; the proverb is the vernacular layer."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "काथ्या", "name_roman": "kāthyā", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "काथ्या kāthyā f pl R The pleiades.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. काथ्या, p. 154", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%95%E0%A4%BE%E0%A4%A5%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Aspirated doublet of कात्या, same Rajapur/southern-Konkan currency; Date p. 678 likewise marks it (राजा.). Homonym warning: काथ्या is also the everyday Marathi word for coir rope (Berntsen p. 23), and Molesworth carries the two as separate headwords on the same page."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "कात्या", "name_roman": "kātyā", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "कात्या kātyā f pl R The pleiades. Commonly कृत्तिका.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. कात्या, p. 154", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%95%E0%A4%BE%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Molesworth's mark R means, per his own preface (p. xvi), 'that the city and province of Rajapur and the country southwards are the seat especially of the currency of the word' — i.e. this is a southern-Konkan form, the Marathi of the Ratnagiri coast bordering the Konkani area. Date (p. 677) gives the derivation कृत्तिका > कृत्तिआ > कात्या, so this is a tadbhava of the Sanskrit name rather than an independent formation — hence 'sanskritic', but it is a REGIONAL sanskritic form, not the tatsama कृत्तिका."}, {"language": "Marathi", "region": "Rajapur / southern Konkan", "name_native": "कात्या", "name_roman": "kātyā", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "कात्याचा पाऊस — the rain that falls under the Kṛttikā nakṣatra", "quote": "कात्या kātyā — स्त्री. (अव.) (राजा.) कृत्तिका नक्षत्र [कृत्तिका -कृत्तिआ-कात्या] ॰चा पाऊस -पु. कृत्तिका नक्षत्राचा पाऊस.", "citation": "Y. R. Date et al., Maharashtra Sabdakosa (Poona, 1932-38), s.v. कात्या, p. 677", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/marathi_query.py?qs=%E0%A4%95%E0%A4%BE%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Date marks the word (राजा.) = Rajapur, agreeing with Molesworth's R, and supplies both the etymology and the agricultural derivative कात्याचा पाऊस, 'the Kṛttikā rain'."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "कृत्तिका", "name_roman": "kṛttikā", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "कृत्तिका kṛttikā f (S) The third of the lunar mansions, Pleiades.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. कृत्तिका, p. 179", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%95%E0%A5%83%E0%A4%A4%E0%A5%8D%E0%A4%A4%E0%A4%BF%E0%A4%95%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "The tatsama, marked (S) by Molesworth. Representative of the borrowed nakṣatra set as a whole — see summary_findings; the remaining twenty-six are not itemised here."}, {"language": "Punjabi", "region": "Punjab", "name_native": "ਕਿਰ੍ਹਕਟੀ", "name_roman": "kirhkaṭí", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "A strongly Punjabised reflex of Kṛttikā. The dictionary's second sense - a jewel in a nose-ring - repeats exactly the double life of Hindi jhumkā (ear-drop / star-cluster) and of bhalkā (morning star / gold star on a nose-ring): the same ornament vocabulary is used for both the sky and the face.", "quote": "KIRHKAṬÍ ਕਿਰ੍ਹਕਟੀ s. f. The Pleiades; a jewel in a nose ring.", "citation": "Bhai Maya Singh, The Panjabi Dictionary (Lahore, 1895), s.v. kirhkaṭí, p. 617", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/singh_query.py?page=617", "notes": "Gurmukhi as printed. This is the only Punjabi Pleiades name found in Maya Singh."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "බහුලාව", "name_roman": "bahulāva", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "බහුලාව bahulāva , n. indigo, නිල් අවරි; cardamoms, එන් සාල් Pleiades, කැතිනැකත.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. බහුලාව bahulāva, p. 444", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=Pleiades&matchtype=default", "notes": "Sanskrit Bahulā, which the Sanskrit database carries as an Amarakośa synonym of Kṛttikā; Sinhala kept it, with the same indigo/cardamom homonyms Sanskrit has. Clough p. 418 likewise: 'Bahulá, s. indigo ... Pleiades; cow.'"}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "කැති නැකත", "name_roman": "kæti nækata", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The ordinary name of the third asterism, and the one that fixes the month Il: Jayatilaka quotes 'käti-nakat lada hil-masa', 'in the month of il when the constellation Pleiades has dawned'.", "quote": "(astro.) N. of one of the twenty-seven asterisms; constellation Pleiades: AbhdhSn 62 (p. 10); Ruv 635 ... [Cf. Sk. kṛttikā + nakṣatra.]", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. කැති නැකත kæti nækata, p. 169; and Jayatilaka (ed.), A Dictionary of the Sinhalese Language (Royal Asiatic Society, Ceylon Branch, 1935– ), s.v. කැතිනකත käti-nakata, p. 2994", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/jayatilaka_query.py?qs=Pleiades&matchtype=default", "notes": "Jayatilaka's etymology bracket settles the register: kṛttikā + nakṣatra, both loans, in Sinhala phonology. A trap to avoid: කැති kæti is separately the plural of කැත්ත 'billhook' (Carter p. 168), so the compound is homophonous with 'billhook asterism'; no source proposes that etymology and it should not be recorded as a literal meaning."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "கார்த்திகை", "name_roman": "kārttikai", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit Kṛttikā in Tamil phonology — asterism, month, and the lamp-festival of the Kārttikai full moon in one word, and by far the most alive of the Sanskritic star-names in Tamil.", "quote": "கார்த்திகை kārttikai , n. < kṛttikā. 1. The constellation Pleiades, part of mēṭa-rāci and iṭapa-rāci; ஒரு நட்சத்திரம். (திவா.) 2. cf. kārttika. The eighth month of the Indian calendar; ஒரு மாதம். (சைவச. ஆசாரி. 79.) … 4. cf. kārttika. The full-moon day in the month of Kārttikai when every house is beautifully lit with lamps; கார்த்திகைமாதத்தில் வீடுதோறும் விளக்கேற்றிக் கொண்டாடும் பூர்ணிமை நாள்.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. கார்த்திகை, vol. II p. 880", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%95%E0%AE%BE%E0%AE%B0%E0%AF%8D%E0%AE%A4%E0%AF%8D%E0%AE%A4%E0%AE%BF%E0%AE%95%E0%AF%88&searchhws=yes&matchtype=exact", "notes": "The lamp-festival is independently visible in the Caṅkam corpus: Naṭṭār's commentary on Akanāṉūṟu identifies the crowd of women raising lamps in a simile as the கார்த்திகை festival (Project Madurai PM 0490_01, https://www.projectmadurai.org/pm_etexts/utf8/pmuni0490_01.html). The Lexicon also has திருக்கார்த்திகை (p. 1897), 'a festival celebrated in the month of Kārttikai on the day when the moon is in conjunction with Pleiades'."}, {"language": "Tamil", "region": "Jaffna, Sri Lanka", "name_native": "வாகுலை", "name_roman": "vākulai", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit Vahulā (cf. Bahulā, a Sanskrit name of the Pleiades) in Tamil form, recorded from the Yāḻppāṇa Akarāti, the Jaffna Tamil dictionary.", "quote": "வாகுலை vākulai , n. < Vahulā. The six presiding female deities of the Pleiades; அறு மீனாகிய கார்த்திகைப்பெண்கள். (யாழ். அக.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. வாகுலை, vol. VI p. 3574, citing the Yāḻppāṇa Akarāti", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%BE%E0%AE%95%E0%AF%81%E0%AE%B2%E0%AF%88&searchhws=yes&matchtype=exact", "notes": "The Lexicon's Tamil paraphrase uses அறுமீன் — 'the Kārttikai women who are the six stars' — so the Sanskritic name is defined by the vernacular one. Compare கார்த்திகைத்தேவிமார் (p. 880) and கார்த்திகைப்பெண்கள் (p. 880), the Tamil equivalents."}]}, {"key": "comet", "title": "Comets", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "comet", "bayer": null, "constellation": null}, "sanskrit_db_id": null, "names": [{"language": "Assamese", "region": "Upper Assam (Sibsagar)", "name_native": "নেজাল তৰা", "name_roman": "nejāl tarā", "literal_meaning": "'tailed star' — Bronson's Assamese gloss spells it out, নেজ লগা তৰা, 'a star with a tail attached'", "register": "vernacular", "confidence": "likely", "usage_note": "The 1867 attestation of the word the Candrakanta Abhidhana still carries in 1962 (p. 562), which makes it the best-dated vernacular star-word in this file. Bronson's neighbouring entries give the Assamese meteor vocabulary too: উল্কাপাত at p. 72 is glossed with পপিয়া তৰা, and ধুমকেতু at p. 308 is glossed as a meteor rather than a comet.", "quote": "নেজাল তৰা, s. নেজ লগা তৰা বিসেস, a comet.", "citation": "M. Bronson, A Dictionary in Assamese and English, Sibsagor: American Baptist Mission Press, 1867, s.v. নেজাল তৰা, p. 327", "source_url": "https://archive.org/download/dictionaryinassa00bronrich/page/n338_w1600.jpg", "notes": "Graded likely, not certain, on a point of method: unlike the ভোটাতৰা entry I did not myself read this page image, and Bronson's Assamese cannot be checked against the OCR. The English gloss 'a comet' is confirmed present in the OCR at the corresponding point, and the Assamese form agrees exactly with the Candrakanta Abhidhana's নেজাল তৰা (p. 562). Also note Bronson p. 72, where the Assamese vernacular for a meteor is পপিয়া তৰা — the same word the Candrakanta prints as পপীয়া তৰা."}, {"language": "Assamese", "region": "Assam", "name_native": "নেজাল তৰা", "name_roman": "nejāla tarā", "literal_meaning": "'tailed star'", "register": "vernacular", "confidence": "certain", "usage_note": "Glossed by the tatsama ধূমকেতু. The same 'tail-star' formation is the ordinary Odia word (ଲଞ୍ଜା ତାରା lañjā tārā, ଲାଙ୍ଗୁଡ଼ା ତାରା lāṅguṛā tārā, in this file); Praharaj's synonym column prints a Bengali cognate against it as well.", "quote": "নেজাল তৰা nejāla, tarā বি. ধূমকেতু; এবিধ তৰা; a comet.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. নেজাল তৰা nejāla tarā, p. 562", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%A8%E0%A7%87%E0%A6%9C%E0%A6%BE%E0%A6%B2%20%E0%A6%A4%E0%A7%B0%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": "Attested in Assamese as early as 1867: Bronson, A Dictionary in Assamese and English, p. 327, 'নেজাল তৰা, s. নেজ লগা তৰা বিসেস, a comet' (separate entry in this file). The tail-star formation is pan-eastern — Odia ଲଞ୍ଜା ତାରା and ଲାଙ୍ଗୁଡ଼ା ତାରା, Kurukh jhal binkō. Hoffmann's guess that the tail-word for a comet was 'first coined by Missionaries' (Encyclopaedia Mundarica VII, p. 1923) cannot hold for Indo-Aryan given this 1867 attestation and the Odia poetic citation from Rādhānātha."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಬಾಲಚಿಕ್ಕಿ", "name_roman": "bāla-cikki", "literal_meaning": "the tail star", "register": "vernacular", "confidence": "certain", "usage_note": "Also ಬಾಲಚುಕ್ಕೆ bāla-cukke. The colloquial Kannada word.", "quote": "— ಬಾಲಚಿಕ್ಕಿ. a comet (My.; ಧೂಮಕೇತು G.). … — ಬಾಲಚುಕ್ಕೆ. = ಬಾಲಚಿಕ್ಕಿ. (My.; Te. ವಾಲುಚುಕ್ಕೆ, the planet Venus, ಶುಕ್ರ).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಬಾಲ bāla, p. 1173", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1173", "notes": "COGNATE PAIR with Telugu తోకచుక్క tōka-cukka. Note the trap in the same line: the Telugu compound Kittel cites as a parallel, vālu-cukke, does NOT mean comet — it is Venus (cf. Brown's చుక్కవాలు, p. 449). Kannada bāla and Telugu vālu are the same word 'tail', but the two languages built different objects out of it."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "വാല്‍മീന്‍", "name_roman": "vālmīn", "literal_meaning": "'tail-star' (വാല്‍ tail + മീന്‍ star)", "register": "vernacular", "confidence": "certain", "usage_note": "Gundert marks it V1 (Visscher/older vocabularies), i.e. attested in the earlier Malabar word-lists rather than only in literature.", "quote": "വാല്‍നക്ഷത്രം, വാല്‍മീന്‍ a comet V1.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. വാല്‍ vāl, p. 938", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%B5%E0%B4%BE%E0%B4%B2%E0%B5%8D%E2%80%8D&searchhws=yes&matchtype=exact", "notes": "Printed together with the hybrid വാല്‍നക്ഷത്രം (native വാല്‍ + Sanskrit നക്ഷത്രം), which is the form that has survived into modern standard Malayalam; വാല്‍മീന്‍ is the fully native member of the pair."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "വാല്‍നക്ഷത്രം", "name_roman": "vālnakṣatram", "literal_meaning": "'tail-star' (native വാല്‍ 'tail' + Sanskrit नक्षत्र)", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "വാല്‍നക്ഷത്രം, വാല്‍മീന്‍ a comet V1.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. വാല്‍ vāl, p. 938", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%B5%E0%B4%BE%E0%B4%B2%E0%B5%8D%E2%80%8D&searchhws=yes&matchtype=exact", "notes": "Hybrid coinage: the compound is formed in Malayalam (Sanskrit uses ധൂമകേതു, केतु, not *पुच्छनक्षत्र), so it counts as vernacular formation even though the head noun is a loan. This is the ordinary word for comet in Malayalam today."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "शेंडेनक्षत्र", "name_roman": "śēṇḍēnakṣatra", "literal_meaning": "the topknot star / crested asterism", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "शेंडेनक्षत्र śēṇḍēnakṣatra, शेंड्येंनक्षत्र śēṇḍyēnnakṣatra n (शेंडी & नक्षत्र. A star with a crest or plume.) A comet.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. शेंडेनक्षत्र, p. 799", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B6%E0%A5%87%E0%A4%82%E0%A4%A1%E0%A5%87%E0%A4%A8%E0%A4%95%E0%A5%8D%E0%A4%B7%E0%A4%A4%E0%A5%8D%E0%A4%B0&searchhws=yes&matchtype=default", "notes": "A Marathi compound on शेंडी, the tuft of hair left at tonsure — the comet as a star wearing the Hindu topknot. The Sanskrit धूमकेतु (Molesworth p. 443, marked S) sits beside it. Molesworth also records at शेंडी sense 3 'the tail of a comet'."}, {"language": "Odia", "region": "Odisha", "name_native": "ଲଞ୍ଜା ତାରା", "name_roman": "Lan̄jā tārā", "literal_meaning": "'tail-star'; Praharaj adds the reason — 'because it has a line of light in it like a tail'", "register": "vernacular", "confidence": "certain", "usage_note": "Marked ଦେ. and illustrated from Rādhānātha Rāya's Yayāti. Variants and near-synonyms fill the same semantic field: ରଞ୍ଜା ତରା Rañjā tarā (p. 6955), ଲାଙ୍ଗୁଡ଼ା ତାରା Lāṅguṛā tārā (p. 7342), ନକ୍ଷତ୍ର ଲଞ୍ଜା Nakshatra lañjā (p. 4096), and ଲଞ୍ଜା alone (p. 7277).", "quote": "ଲଞ୍ଜା ତାରା— Lan̄jā tārā ଦେ. ବି — (ସଂ. ଲଞ୍ଜ+ତାରା)—(ଏଥିରେ ଲାଞ୍ଜ ପରି ଗୁଡ଼ିଏ ଆଲୋକ ରେଖା ଥିବାରୁ)— ଧୂମକେତୁ — Comet. [ଉ—ସ୍କନ୍ଧେ ମହାଶୂଳ ଲଞ୍ଜାତାରା କି ସେ ନାଶିବାକୁ ବୈରି କୁଳ। ରାଧାନାଥ. ଯଯାତି।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଲଞ୍ଜା ତାରା Lan̄jā tārā, p. 7277", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%B2%E0%AC%9E%E0%AD%8D%E0%AC%9C%E0%AC%BE%20%E0%AC%A4%E0%AC%BE%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "The tail-star formation is pan-eastern: Assamese নেজাল তৰা nejāla tarā (this file), and Praharaj's own synonym column gives Bengali and Hindi cognates against the Odia headwords. The Bengali cognate is printed inconsistently in the DSAL transcription (লেজেতারা at one duplicate headword, নেজান তারা at the other), so I have not made a Bengali entry from it."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "දුම්·කෙහෙලිය", "name_roman": "dum·keheliya", "literal_meaning": "'smoke-banner' (දුම් dum 'smoke' + කෙහෙලි keheli 'banner, trophy of victory')", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "දුම්·කෙහෙලිය dum·keheliya , n. comet, වල්ගාතරුව; fire, ගින්න.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. දුම්·කෙහෙලිය dum·keheliya, p. 292", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=comet&matchtype=default", "notes": "A morpheme-for-morpheme Sinhala rendering of Sanskrit dhūma-ketu 'smoke-bannered', which Carter also carries unchanged as ධූම·කේතුව (p. 311). The same word in two registers on facing pages. Carter's cross-reference here uses the fully native වල්ගාතරුව valgā-taruva, while his own headword at p. 568 is the hybrid වල්ගා·තාරකාව valgā·tārakāva, 'tailed-star, viz. comet'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "புகைக்கொடி", "name_roman": "pukai-k-koṭi", "literal_meaning": "smoke-banner, streamer of smoke", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil formation for a comet, from the Cilappatikāram's list of portents; the metaphor is a banner or creeper of smoke rather than a tailed star.", "quote": "புகைக்கொடி pukai-k-koṭi , n. < id. +. Comet; தூமகேது. புகைக்கொடி தோன்றினும் (சிலப். 20, 102, அரும்.).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. புகைக்கொடி, vol. V p. 2743; quoting the aruñcolpporuḷ on Cilappatikāram 20, 102", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AA%E0%AF%81%E0%AE%95%E0%AF%88%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AF%8A%E0%AE%9F%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "Its twin is கனற்கொடி kaṉaṟ-koṭi 'fire-banner' (Supplement p. S211, quoting Takkayākapparaṇi 457), also 'comet'. The Takkayākapparaṇi commentary at that same verse yields a small Tamil vocabulary of comet-types — அராளகி arāḷaki, அவ்வியக்தி avviyakti, அவீசி avīci (Supplement pp. S062, S071, S076), each glossed 'a kind of comet' — a classification the Lexicon does not further explain and which is not pursued here."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வால்மீன்", "name_roman": "vāl-mīṉ", "literal_meaning": "tail-star", "register": "vernacular", "confidence": "certain", "usage_note": "The living Tamil word for a comet, formed on vāl 'tail' + mīṉ 'star'; வால்நட்சத்திரம் vāl-naṭcattiram is the same compound with the Sanskrit word for star, and is the commoner modern form.", "quote": "வால்மீன் vāl-mīṉ , n. < வால்² + மீன்¹. See வால்நட்சத்திரம். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. வால்மீன், vol. VI p. 3616, marked (W.) after Winslow; and s.v. வான்மீன்², p. 3626, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%BE%E0%AE%B2%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "HOMONYM CAUTION: the variant spelling வான்மீன்² vāṉ-mīṉ (p. 3626) is also 'comet' — the Lexicon derives it from வால் 'tail', not from வான் 'sky' — and sits immediately beside வான்மீன்¹ vāṉ-mīṉ 'star' from வான் 'sky'. Two identical spellings, opposite senses, one page. The head entry வால்நட்சத்திரம் is at p. 3615. Also in the family: வானட்சத்திரம் (p. 3626, Yāḻppāṇa Akarāti) and பாலநக்ஷத்திரம் (p. 2629)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "దుమగతికేతు", "name_roman": "duma-gati-kētu", "literal_meaning": null, "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "దుమగతికేతు [Tel.] n. A star portending ill-luck. A comet, ధూమకేతువు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. దుమగతికేతు duma-gati-kētu, p. 602", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=602", "notes": "Brown marks it [Tel.] although it is visibly a Telugu-ised remaking of Sanskrit dhūmaketu (duma < dhūma 'smoke'). Registered vernacular on Brown's own labelling, with the caveat that the material is Sanskrit."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "తోకచుక్క", "name_roman": "tōka-cukka", "literal_meaning": "the tailed star", "register": "vernacular", "confidence": "certain", "usage_note": "The ordinary Telugu word for a comet, still current.", "quote": "తోకచుక్క tōka-ṭsukka. n. A comet: a star with a tail. ధూమకేతువు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. తోక tōka, p. 563", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=563", "notes": "COGNATE PAIR: Kannada ಬಾಲಚಿಕ್ಕಿ bālacikki / ಬಾಲಚುಕ್ಕೆ bālacukke, also 'tail-star' (Kittel p. 1173). Two languages, the same compound, built from different native words for 'tail' (Te. tōka, Ka. bāla). Sanskrit uses dhūmaketu 'smoke-bannered', a different image; both dictionaries gloss the vernacular word with it."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ಬಾಲನಕ್ಷತ್ರ", "name_roman": "bālanakṣatra", "literal_meaning": "'tail-star'", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "ಬಾಲನಕ್ಷತ್ರ balanakṣatra, s. A comet.", "citation": "Männer, Tuḷu–English Dictionary (1886), s.v. ಬಾಲನಕ್ಷತ್ರ bālanakṣatra, p. 481", "source_url": "https://archive.org/download/tuluenglishdicti00mnrich/tuluenglishdicti00mnrich_djvu.txt", "notes": "Hybrid on the Malayalam വാല്‍നക്ഷത്രം pattern: native 'tail' plus Sanskrit nakṣatra. Männer's English→Tulu volume gives the same word (spelt ಬೀಲನಕ್ಷತ್ರ, p. 75) alongside Sanskrit ಧೂಮಕೇತು dhūmakētu, which he also carries under ಧೂಮ 'smoke' (Tulu→English p. 337). Marked 'likely' on the transliteration, which comes from a garbled OCR line confirmed only in outline against the page."}, {"language": "Bengali", "region": "Bengal (marked গ্রা◦, colloquial)", "name_native": "ঝাঁটাতারা", "name_roman": "jhām̐ṭātārā", "literal_meaning": "'the broom star' — Dāsa's own bracket says 'because it is shaped like a broom'", "register": "folk", "confidence": "certain", "usage_note": "The Bengali folk comet-word, standing beside the learned ধূমকেতু, whose definition in the same dictionary (p. 1147) also reaches for the broom: 'a luminous body whose rays are shaped like a jhāṛu'.", "quote": "ঝাঁটাতারা jhām̐ṭātārā [গ্রা◦। ঝাঁটার আকার বলিয়া] বি, ধুমকেতু।", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. ঝাঁটাতারা jhām̐ṭātārā, p. 882", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=882", "notes": "Register folk on the dictionary's own authority: গ্রা◦ = গ্রাম্য, rustic/colloquial. Compare the eastern 'tail-star' words — Assamese নেজাল তৰা, Odia ଲଞ୍ଜା ତାରା / ଲାଙ୍ଗୁଡ଼ା ତାରା — all in this file. Bengali has reached for a different household object. Corroborated from outside lexicography: Lal Behari Day, Bengal Peasant Life, ch. VIII 'The Village Astrologer', p. 61 (ed. of 1916), reports a village astrologer's reputation made by predicting famine and pestilence \"from the appearance in the heavens of a 'fiery broomstick,' as the people called the comet\" — the English of the same figure, with no Bengali form printed. And the Mundas of Chota Nagpur call a comet jonọ ipil, the broom star (this file)."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "झाड़ू / جهاڙو", "name_roman": "jhāṛū", "literal_meaning": "'a broom, a besom'", "register": "folk", "confidence": "certain", "usage_note": "A comet is simply a broom in the sky. The word is otherwise heavily charged in domestic usage - Fallon records the women's curse 'may the broom sweep through your house' - which suits the omen value comets carried.", "quote": "H جهاڙو झाड़ू jhāṛū [rt. of jhāṛnā 'to sweep,'+ū = Prk. इडओ = S. (इ)तृ+कः], s.m. A broom, a besom, a whisk; — a comet", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. jhāṛū, p. 400", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=400", "notes": "Also Fallon, p. 493, and Shakespear (1834), p. 653: 'A besom, broom, a comet.'"}, {"language": "Hindi", "region": "Hindustani generally; the tail-star form marked dakh. (Deccani) by Shakespear", "name_native": "केत / کيت", "name_roman": "ket (dum kā tārā)", "literal_meaning": "'tail star'", "register": "folk", "confidence": "certain", "usage_note": "ket is the vernacular reduction of Sanskrit Ketu, the descending node and mythic tail; Fallon parses the word for his readers as 'lit. tail star', which is a folk etymology but tells us how it was heard. The transparent Hindustani phrase dum kā tārā says the same thing outright.", "quote": "H کيت केत ket; Sant. chanḍbol ipil , (lit. tail star), n. m. S. केतु A comet.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. ket, p. 980", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=980", "notes": "Shakespear (1834), p. 1996: 'دم کا تارا dum kā tārā, s. (dakh.) A comet (Harris)' - printed in the Urdu script and marked Deccani, like palang tīn cor. Platts (p. 526) has dum for a comet and (p. 527) the Persian sitāra-i-dumbāla-dār, 'a star having a tail'. Modern standard Hindi has पुच्छल तारा (McGregor 1993, p. 635)."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "കുറക്കൊള്ളി", "name_roman": "kuṟakkoḷḷi", "literal_meaning": "'defect-firebrand' (കുറ want, defect, blemish + കൊള്ളി firebrand)", "register": "folk", "confidence": "disputed", "usage_note": "An omen-word: Gundert glosses it 'a threatening meteor' and quotes a line meaning 'suddenly from the sky, the ku[ṟakkoḷḷi]'.", "quote": "കുറക്കൊള്ളി a threatening meteor, comet (?) ആകാശത്തില്‍ നിന്നുടന്‍ കു. Sk.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. കുറ kuṟa, p. 270", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%95%E0%B5%81%E0%B4%B1&searchhws=yes&matchtype=exact", "notes": "Gundert's own question mark: he is unsure whether the referent is a meteor or a comet. Registered here as disputed for that reason. The first element കുറ 'defect, blemish, disgrace' makes it an ill-omen term rather than a neutral astronomical label."}, {"language": "Punjabi", "region": "Punjab (contributed from Ambala by Chaina Mall)", "name_native": null, "name_roman": "puchhalwālā tārā / dumdār sitārā", "literal_meaning": "'the tailed star' (Indic and Perso-Arabic versions of the same phrase)", "register": "folk", "confidence": "certain", "usage_note": "Both layers side by side in one sentence, with an attached practice: on the appearance of a comet subscriptions were raised and Brahmans and mendicants fed, because a comet foretold epidemic or famine.", "quote": "All over the Panjab people of all sorts dread the appearance of a puchhalwálá tárá, or dumdár sitárá, or tailed star; i. e., comet, as foreboding evil to the country in the shape of epidemic or famine.", "citation": "Chaina Mall, 'Panjab - Comets', Indian Notes and Queries, vol. IV (1886-87), note 424", "source_url": "https://archive.org/details/inq_pnq_v4", "notes": "Roman only in the source. Quoted with OCR noise in the diacritics normalised."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Kayshar, Kaysaar; Bahari, Bohari; Jhadani, Jhadu; Bhimal Saat", "literal_meaning": "a broom; Bhimal's sword", "register": "tribal", "confidence": "certain", "usage_note": "A comet is the weapon of the great god Bhimal Pen, used to cleanse the sins of the world, and is therefore a good omen — the gods are sweeping away or cutting down the evil. In some villages Kayshar names the Pleiades instead.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The broom reading is shared with Mundari joṅg ipil and Kurukh calkī bīnkō. That the same word sometimes names the Pleiades and sometimes a comet is recorded by the authors and left unresolved."}, {"language": "Khasi", "region": "Khasi and Jaintia hills, Meghalaya", "name_native": null, "name_roman": "'lur-dih-duma", "literal_meaning": "the tobacco-smoking star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "'lur-dih-duma, u, n. the comet.", "citation": "Nissor Singh, Khasi-English Dictionary (1906), s.v. 'lur-dih-duma, p. 120", "source_url": "https://archive.org/download/khasienglishdict00singrich/khasienglishdict00singrich_djvu.txt", "notes": "dih is 'to drink', used of smoking, and duma 'tobacco', both in the same dictionary — the comet is the star with a pipe. The only figurative star name Khasi yielded, and quite unlike the broom that the Munda, Kurukh and Gondi languages all use."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "calkī bīnkō; jhāl-bīnkō, jhālī-bīnkō", "literal_meaning": "the broom star", "register": "tribal", "confidence": "certain", "usage_note": "The appearance of a comet is read as an omen: 'a comet has appeared; we may have this year a famine as well as a plenteous crop.'", "quote": "Calkī S. 1. A special kind of grass, from which the Indian broom is made ... Calkī-bīnkō, comet.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. calkī, p. 123; s.v. bīnkō, p. 85", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": null}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "joṅg ipil", "literal_meaning": "broom star", "register": "tribal", "confidence": "certain", "usage_note": "Comets portend public calamities. The name is from joṅg, the broom the Mundas sweep their houses with.", "quote": "They see a striking resemblance between them and the brooms, joṅg, with which they sweep their houses. A comet is therefore called joṅg ipil.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Hoffmann adds that caḍlom ipil, 'tail star', is also heard but 'seems to have been first coined by Missionaries'. Campbell's independent Santali Candbol ipil suggests otherwise. The broom image is shared with Kurukh (calkī bīnkō) and Gondi (kayshar, jhāḍani, bahārī)."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Candbol ipil", "literal_meaning": "tail star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Candbol ipil. A comet.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Candbol ipil, p. 89", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "candbol is 'a tail' in Campbell (cf. 'Candbol tuthagetaea. His tail is short'). Hoffmann thought the matching Mundari caḍlom ipil 'tail star' was coined by missionaries; Campbell's independent Santali entry weakens that, though both men worked in mission circles."}, {"language": "Bengali", "region": "Bengal", "name_native": "কবন্ধ", "name_roman": "kabandha", "literal_meaning": "'a headless trunk; a headless goblin'", "register": "sanskritic", "confidence": "certain", "usage_note": "Beside the ordinary ধূমকেতু dhūmaketu (p. 544). The comet as a decapitated body is the same figure as the Rāhu/Ketu myth, and Biswas's entry runs the three senses together.", "quote": "কবন্ধ kabandha n. a headless or truncated body; a headless or truncated goblin; the ascending node, the descending node; a comet.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. কবন্ধ kabandha, p. 202", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%95%E0%A6%AC%E0%A6%A8%E0%A7%8D%E0%A6%A7&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಧೂಮಕೇತು", "name_roman": "dhūmakētu", "literal_meaning": "whose banner is smoke", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಧೂಮಕೇತು dhūma-kētu. whose sign is smoke : agni, fire (ಪಾವಕ, ಅಗ್ನಿ Nn. 33; ಸಪ್ತಾರ್ಚಿ Mr. 489). 2, a meteor, a falling star; a very portentous object; a comet (ಮಹೋತ್ಪಾದ, ಮಹೋತ್ಪಾತ 33; ಮಹೋತ್ಪಾತ 489).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಧೂಮಕೇತು dhūmakētu, p. 875", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=875", "notes": "The learned counterpart of bāla-cikki, and the word both dictionaries use to gloss the vernacular one."}, {"language": "Konkani", "region": "South Kanara / Mangalore", "name_native": null, "name_roman": "dumaket", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "marked (H. K.), i.e. a Hindu Konkani word", "quote": "Comet, s. dumaket, -ta, n.", "citation": "A. F. X. Maffei, An English-Konkani Dictionary (Mangalore: Basel Mission Press, 1883), s.v. Comet, p. 73", "source_url": "https://archive.org/details/anenglishkonkan00bygoog", "notes": "Sanskrit dhūmaketu in Konkani phonology. Maffei's (H. K.) tag — rendered '{U, K.}' by the scan — is his mark for vocabulary belonging to Hindu rather than Christian Konkani speakers, and it recurs on the Milky Way name dudavat and on Planet (p. 344, 'graha'). Konkani here simply has no separate Christian-register word, which is itself informative about how thin the sky vocabulary of this dictionary is."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ധൂമകേതു", "name_roman": "dhūmakētu", "literal_meaning": "'having smoke for its banner'", "register": "sanskritic", "confidence": "certain", "usage_note": "Gundert's citation is about the direction of its rising: 'ധൂ. പടിഞ്ഞാറു ഉദിക്ക' — the comet rises in the west (from Brahmāṇḍapurāṇam), an omen datum.", "quote": "ധൂമകേതു having smoke for a sign (= fire); a comet ധൂ. പടിഞ്ഞാറു ഉദിക്ക Brhmd.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ധൂമം dhūmam, p. 521", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%A7%E0%B5%82%E0%B4%AE%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "The learned counterpart of വാല്‍മീന്‍. Gundert also records, s.v. വൈദ്യം p. 998, that 'some call a comet വൈധൃതി' — vaidhṛti, otherwise the name of an astrological yoga."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "தூமம்", "name_roman": "tūmam", "literal_meaning": "smoke (< Skt. dhūma)", "register": "sanskritic", "confidence": "certain", "usage_note": "The Caṅkam word for a comet as a portent, in the Puṟanāṉūṟu omen-triad beside Saturn and Venus.", "quote": "6. See தூமகேது. தூமந் தோன்றினும் (புறநா. 117).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. தூமம் sense 6, vol. IV p. 2018; quoting Puṟanāṉūṟu 117", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A4%E0%AF%82%E0%AE%AE%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Puṟanāṉūṟu 117 line was verified independently in the Project Madurai e-text (PM 0057, https://www.projectmadurai.org/pm_etexts/utf8/pmuni0057.html): 'மைம் மீன் புகையினும், தூமம் தோன்றினும்,'. HOMONYM: the same headword's senses 1-5 are smoke, perfume, censer, an astrological term, and a potter's kiln; sense 6 alone is the comet. The full form is தூமகேது tūma-kētu (p. 2018), 'Comet, one of four karantuṟaikōḷ' — 'the four hidden-and-appearing bodies', a Tamil classification of transient sky-objects."}]}, {"key": "venus-morning", "title": "Venus as morning star", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Venus", "bayer": null, "constellation": null}, "sanskrit_db_id": null, "names": [{"language": "Assamese", "region": "Upper Assam (Sibsagar)", "name_native": "ভোটাতৰা", "name_roman": "bhoṭātarā", "literal_meaning": "'the big star' — the Assamese gloss opens বৰ তৰা, 'great star'", "register": "vernacular", "confidence": "certain", "usage_note": "This fills the one gap the modern Assamese dictionary leaves: the Candrakanta Abhidhana has পুবঁতী তৰা for Venus as morning star but NO evening-star word at all. Bronson has both — the main entry gives the evening star, and the Addenda at the back of the volume add the morning star to the same headword.", "quote": "ভোটাতৰা, s. বৰ তৰা, চাইউঁৰিয়া সকত তৰা, a large star, Venus, the evening star.", "citation": "M. Bronson, A Dictionary in Assamese and English, Sibsagor: American Baptist Mission Press, 1867, s.v. ভোটাতৰা, p. 439 (with Addenda, p. 608)", "source_url": "https://archive.org/download/dictionaryinassa00bronrich/page/n450_w1600.jpg", "notes": "Transcribed by me directly from the page image linked above; the archive.org OCR of Bronson's Assamese fount is unusable noise and cannot be relied on for any headword in this dictionary. The second Assamese word in the gloss, চাইউঁৰিয়া, is legible but its sense is not clear to me and I have not guessed at it. The folio number is the scan's pagination (leaf n450). The Addenda entry, reported in the same scan, reads 'ভোটাতৰা, s. add …, also the morning star' — i.e. Bronson corrected himself, reaching the same conclusion Praharaj states for Odia, that the two apparitions are one body."}, {"language": "Assamese", "region": "Assam", "name_native": "পুবঁতী-তৰা", "name_roman": "pubantī-tarā", "literal_meaning": "'the dawn star' (pubā 'to dawn, to break — of night')", "register": "vernacular", "confidence": "certain", "usage_note": "Given inside the entry for শুক্ৰ as the Assamese equivalent of the tatsama planet-name. This is the Assamese member of the eastern set of 'dawn-star' words for Venus — cf. Odia ପାହାନ୍ତି ତାରା pāhānti tārā and ପୁଆଁ ତରା puāñ tarā in this file.", "quote": "শুক্ৰ śukra [সং.] বি. ভৱগু মুনিৰ পুতেক-দৈত্য-গুৰু; the preceptor of the Asuras. 2। ছয় সংখ্যাৰ গ্ৰহৰ নাম; পুবঁতী- তৰা; Venus, the morning star. 3। শুকুৰবাৰ Friday.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. শুক্ৰ śukra, p. 843", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%B6%E0%A7%81%E0%A6%95%E0%A7%8D%E0%A7%B0&searchhws=yes&matchtype=exact", "notes": "'ভৱগু' is DSAL OCR for ভৃগু. The dictionary has no entry for an evening-star word; that gap is recorded in summary_findings."}, {"language": "Kodava", "region": "Kodagu (Coorg)", "name_native": null, "name_roman": "boḷḷi mi·nï", "literal_meaning": "'silver star' / 'white star' — boḷḷi 'silver' (< Dravidian *veḷ 'white') + mi·nï 'star' (< Dravidian *mīn)", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "Koḍ. ... boḷḷi silver ... boḷḷi mi·nï morning star", "citation": "Burrow & Emeneau, A Dravidian Etymological Dictionary, entry 5496(a), Kodagu section (DSAL p. 499)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/burrow_query.py?page=499", "notes": "The single most valuable Kodava find: a fully native Dravidian name for Venus, built from two inherited roots. It is also the ONLY place in DEDR where Kodagu mi·nï 'star' appears at all — DEDR 4876, the *mīn entry, gives Kodagu only 'minn- to lighten, flicker' and gives Tulu no star word whatever, though it gives 'Ma. mīn star' and 'Ta. mīṉ star'. So Kodagu has kept the ancient Dravidian word for star only inside this one compound. DEDR romanizes only; no script is printed, so name_native is null. Burrow & Emeneau's 2nd edition (1984) is in copyright; the entry is quoted here as raw lexical data, minimally, for attestation."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "പെരുമീന്‍", "name_roman": "perumīn", "literal_meaning": "'great star' (പെരു- big, great + മീന്‍ star)", "register": "vernacular", "confidence": "certain", "usage_note": "Specifically the morning apparition of Venus.", "quote": "പെരുമീന്‍ 1. the morning star, Venus Vl. 2. the large sheat-fish B.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. പെരുക്കുക perukkuka, p. 701 (sub-entry പെരുമീന്‍)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%AA%E0%B5%86%E0%B4%B0%E0%B5%81%E0%B4%95%E0%B5%8D%E0%B4%95%E0%B5%81%E0%B4%95%2C+%E0%B4%A4%E0%B5%8D%E0%B4%A4%E0%B5%81&searchhws=yes&matchtype=exact", "notes": "The two senses in the single entry — 'morning star' and 'the large sheat-fish' — are the മീന്‍ homonymy in miniature. Malayalam thus distinguishes the morning star lexically (പെരുമീന്‍, കൊററി) from Venus generally (വെള്ളി, വെണ്മീന്‍); Gundert records no separate evening-star word."}, {"language": "Odia", "region": "Odisha", "name_native": "କୁଆତରା", "name_roman": "Kuātarā", "literal_meaning": "a worn-down form of kāvya-tārā, 'the star of Kāvya' — Kāvya/Uśanas being Śukra, the preceptor of the asuras", "register": "vernacular", "confidence": "certain", "usage_note": "Marked ଦେ., with the Sanskrit etymon given. Defined by the watch: the bright body that rises in the east with one prahara of night still to go.", "quote": "କୁଆତରା— Kuātarā ଦେ. ବି. (ସଂ. କାବ୍ୟତାରା)— ପ୍ରଭାତ ହେବା ପୂର୍ବରୁ ରାତ୍ରି ଏକ ପ୍ରହର ଥାଇ ଯେଉଁ ଉଜ୍ଜ୍ୱଳ ଜ୍ୟୋତିଷ୍କ ପୂର୍ବଦିଗରେ ଉଦିତ ହୁଏ; ଶୁକ୍ରଗ୍ରହ—The morning star; Venus.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. କୁଆତରା Kuātarā, p. 1613", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%95%E0%AD%81%E0%AC%86%E0%AC%A4%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "The tatsama it descends from is also in the dictionary: କାବ୍ୟତାରକା Kābytārakā, p. 1511, 'The morning star; Venus'. Odia thus has the same word twice, once learned and once worn down."}, {"language": "Odia", "region": "Odisha", "name_native": "ପାହାନ୍ତି ତାରା", "name_roman": "Pāhānti tārā", "literal_meaning": "'the daybreak star'", "register": "vernacular", "confidence": "certain", "usage_note": "The general Odia term, and the one Praharaj uses to define all the others. His note is unusually careful: the morning star is NOT one body — at different times of year Mars, Jupiter, Venus and Saturn rise before dawn in the east, but Venus is the brightest of them and Jupiter next.", "quote": "The morning star; the shining star seen in the eastern sky before dawn. [ଦ୍ର—ଏହା ଗୋଟିଏ ନୁହେଁ, ବର୍ଷର ଭିନ୍ନ ଭିନ୍ନ ସମୟରେ ଭିନ୍ନ ଭିନ୍ନ ଗ୍ରହ ଯଥା—ମଙ୍ଗଳ, ବୃହସ୍ପତି, ଶୁକ୍ର ଓ ଶନି ପାହାନ୍ତିଆ ସମୟରେ ପୂର୍ବଦିଗରୁ ଉଅଁନ୍ତି—କିନ୍ତୁ ସମସ୍ତଙ୍କ ମଧ୍ୟରେ ଶୁକ୍ର ଉଜ୍ଜ୍ୱଳତମ ଓ ତା ପରେ ବୃହସ୍ପତି।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ପାହାନ୍ତି ତାରା Pāhānti tārā, p. 4814", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AA%E0%AC%BE%E0%AC%B9%E0%AC%BE%E0%AC%A8%E0%AD%8D%E0%AC%A4%E0%AC%BF%20%E0%AC%A4%E0%AC%BE%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "This is the correct lexicographic position and it is worth flagging against the rest of this group: 'morning star' in Odia is a functional description, and only usually Venus. The doublet ପୁଆଁ ତରା Puāñ tarā (p. 4877, ଦେ., from ପ୍ରଭାତୀ ତାରା) is the worn-down form."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "දවහත්·තරුව", "name_roman": "davahat·taruva", "literal_meaning": "'day-star' (Carter's own gloss)", "register": "vernacular", "confidence": "disputed", "usage_note": null, "quote": "දවහත්·තරුව davahat·taruva , n. day-star, morning star, Venus, පහන්තාරකාව.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. දවහත්·තරුව davahat·taruva, p. 278", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=morning%20star&matchtype=default", "notes": "Carter makes it the morning star; Jayatilaka quotes it in a classical simile as the EVENING star — 'tārā-gaṇayan kerehi arundhatī davahat-taru sē diliyeyi', s.v. අරුන්දති, p. 641. Clough (p. 236) lists it with no gloss at all: 'Dawahat-taruwa, s. star so called.' The word is certainly attested and certainly native; which apparition of Venus it names is not settled by the sources, hence 'disputed'."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "පහන් තරුව / පහන්·තාරකාව", "name_roman": "pahan taruva / pahan·tārakāva", "literal_meaning": "'dawn-star' — Carter's adjacent headword is 'පහන් pahan , a. pert. to light or morning' (p. 371)", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "පහන් තරුව, පහන්·තාරකාව pahan taruva, pahan·tārakāva , n. morning star, Venus, Lucifer, සිකුරුතරුව.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. පහන් තරුව pahan taruva, p. 371", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=morning%20star&matchtype=default", "notes": "The doublet පහන් තරුව / පහන් තාරකාව shows the two registers side by side in one headword: native තරුව taruva against Sanskrit තාරකා tārakā. Jayatilaka attests the native form in running text s.v. අස්තඞ්ගමය (p. 947)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வைகுறுமீன்", "name_roman": "vaikuṟu-mīṉ", "literal_meaning": "daybreak-star (vaikuṟu 'to become dawn')", "register": "vernacular", "confidence": "certain", "usage_note": "The Caṅkam name for the morning star. In Akanāṉūṟu 17 the last silk-cotton blossoms scattered by the wind along a desert road are compared to it.", "quote": "வைகுறு மீனிற் றோன்று", "citation": "Akanāṉūṟu 17 (Pālai); text and commentary of Na. Mu. Vēṅkaṭacāmi Nāṭṭār, Project Madurai e-text PM 0490_01", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0490_01.html", "notes": "Nāṭṭār's gloss in the same e-text reads 'வைகுறு மீனில் தோன்றும் - விடியற்காலத்தே வானத்தே காணப்படுகின்ற மீன் போன்று தோன்றுதற்கிடனான' — 'appearing like the star seen in the sky at dawn'. The Tamil Lexicon (s.v. வைகுறுமீன், vol. VI p. 3850) defines it 'Morning star; விடிவெள்ளி' and cites this line as அகநா. 17. Note that the verse itself says only 'the dawn star'; the equation with Venus specifically is the lexicographers'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வெடி", "name_roman": "veṭi", "literal_meaning": null, "register": "vernacular", "confidence": "likely", "usage_note": "A nikaṇṭu word for the morning star, recorded from the Piṅkala Nikaṇṭu.", "quote": "வெடி⁴ veṭi , n. < வெடி³-. Venus, as the morning star; விடிவெள்ளி. (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. வெடி⁴, vol. VI p. 3773, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AF%86%E0%AE%9F%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "SEVERE HOMONYM: வெடி² on the same page runs to nineteen senses — explosion, noise, thunder, gun, fireworks, fissure, hate, ruin, fear, incense, perfume, stench, toddy, a dice-play cant term, and (marked Nāñ.) 'big lie'. வெடி⁴ 'Venus' is a separate headword with a separate etymology, attested only in a lexicographical work, with no literary quotation. Confidence 'likely' on that account. Also on the same page வெடி⁵ = 'open plain'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "விடிவெள்ளி", "name_roman": "viṭi-veḷḷi", "literal_meaning": "dawn-white, the white one of daybreak", "register": "vernacular", "confidence": "certain", "usage_note": "The everyday modern Tamil name of the morning star, and the word the Lexicon uses to define all the others.", "quote": "விடிவெள்ளி viṭi-veḷḷi , n. < விடி² +. Venus, as the morning star; பின்னிரவில் தோன்றுஞ் சுக்கிரன். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. விடிவெள்ளி, vol. VI p. 3659, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%BF%E0%AE%9F%E0%AE%BF%E0%AE%B5%E0%AF%86%E0%AE%B3%E0%AF%8D%E0%AE%B3%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "Its poetic doublet is விடிமீன் viṭi-mīṉ 'dawn-star' (p. 3658, quoting Kallāṭam 17, 12, 'விடிமீன் முளைத்த தரளம்'), and its morning/evening pair is காலைவெள்ளி kālai-veḷḷi 'morning-white' (p. 900) against மாலைவெள்ளி mālai-veḷḷi 'evening-white' (p. 3179). All four are Tamil formations on veḷḷi."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "వేగుచుక్క", "name_roman": "vēgu-cukka", "literal_meaning": "the dawn star", "register": "vernacular", "confidence": "certain", "usage_note": "Also వేగురుచుక్క vēguru-cukka and వేకువచుక్క vēkuva-cukka. The standard Telugu name.", "quote": "వేగుచుక్క, వేగురు చుక్క or వేకువచుక్క vēga-ṭsukka. n. The morning star, the planet Venus, శక్రుడు, వేగుజాము vēgu-dzāmu. n. The morning watch. రాత్రి నాలుగవజాము, వేకువజాము తెల్లవారుజాము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. వేగు vēgu, p. 1226", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1226", "notes": "Independently attested from the Kannada side: Kittel cites it under ಬಯ್ಗು baygu (p. 1143) as 'Te. ವೇಗುಜುಕ್ಕೆ, the morning star', in a comparative note on Dravidian *vaikV- 'to dawn'. Brown's Telugu gloss శక్రుడు is a misprint for శుక్రుడు (Śukra = Venus)."}, {"language": "Bengali", "region": "Bengal", "name_native": "পোয়াতে-তারা", "name_roman": "poẏāte-tārā", "literal_meaning": "'the dawning star' — Dāsa derives it from প্রভাতিয়া prabhātiyā, 'of the dawn'", "register": "folk", "confidence": "certain", "usage_note": "Illustrated from a work Dāsa abbreviates গ্রহ-নক্ষত্র ('Planets and Stars'): 'have you seen the poẏāte-tārā, or śuk-tārā?' — the citation itself glossing the folk word with the standard one.", "quote": "পোয়াতে-তারা poẏāte-tārā [প্রভাতিয়া >] বি, শুকতারা। \"তোমরা পা◦ তা◦ বা শুক তারাকে দেখিয়াছ কি?\"-গ্রহ-নক্ষত্র।", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. পোয়াতে-তারা poẏāte-tārā, p. 1386", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=1386", "notes": "This is the Bengali member of the eastern 'dawn-star' set: Assamese পুবঁতী তৰা, Odia ପାହାନ୍ତି ତାରା and ପୁଆଁ ତରା (the last also from প্রভাতী তারা). All four are independent worn-down reflexes of a 'dawn' word plus 'star'. DSAL's headword index encodes this lemma's য় as U+09DF."}, {"language": "Hindi", "region": "eastern Hindi belt (Fallon marks the sense 'morning star' E., the nose-ring sense W.)", "name_native": "भलका / بهلکا", "name_roman": "bhalkā", "literal_meaning": "'daybreak'", "register": "folk", "confidence": "certain", "usage_note": "The same word means both 'the morning star' and 'a gold star or patch fixed on a nose-ring' - the ornament/star doubling seen also in jhumkā and in Punjabi kirhkaṭī.", "quote": "H بهلکا भलका bhalkā , s.m. Dawn of day, morning ( = bhor); the morning star (syn. bhurkā); a gold star or patch fixed on a nose-ring.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. bhalkā, p. 191", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=191", "notes": "The regional split is Fallon's, p. 300: '1. (E). The morning star (bhurkā). 2. A gold star hanging in a nose-ring. W.'"}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "भुरका / بهرکا", "name_roman": "bhurkā", "literal_meaning": "'the dawn one' (Platts derives it from S. vyuṣṭa 'daybreak'; cf. Hindi bhor 'dawn')", "register": "folk", "confidence": "certain", "usage_note": "A purely vernacular formation on the word for daybreak, with no Sanskrit or Persian star name behind it.", "quote": "H بهرکا भुरका bhurkā [S. व्युष्ट+कः], s.m. The morning star (cf. bhor).", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. bhurkā, p. 186", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=186", "notes": "Also Fallon, p. 304, s.v. bhur'kā. Platts's identification is 'the morning star' without naming Venus; the equation with Venus is secured by his own ujāle-kā tārā entry and by Fallon's."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": null, "name_roman": "ujāle-kā tārā", "literal_meaning": "'the star of the daylight'", "register": "folk", "confidence": "certain", "usage_note": "Named from the watch it belongs to: Platts's preceding sub-entry is ujāle-kā pahrā, 'the morning watch, the watch which begins at dawn'. The star is the one that stands in that watch.", "quote": "ujāle-kā tārā, s.m. The morning star, the planet Venus.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. ujālā, p. 23", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=23", "notes": "Headword printed as उजाला / اجالا; compound in roman only. Fallon, p. 37, s.v. ujā'lā, has the same."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "കൊററി", "name_roman": "koṟṟi", "literal_meaning": null, "register": "folk", "confidence": "likely", "usage_note": "North Malabar dialect (Gundert's 'No.' = Northern). Used with the verb of rising: കൊററി ഉദിച്ചു 'the morning star has risen' — the phrase of a rural day beginning.", "quote": "കൊററി (T. the goddess Durga) l. a young one. — a ewe; a stork. So. MC. ... 3. morning- star, കൊററി ഉദിച്ചു No.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. കൊററം koṟṟam, p. 309 (sub-entry കൊററി, sense 3)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%95%E0%B5%8A%E0%B4%B1%E0%B4%B1%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "Marked 'likely' because Gundert says only 'morning star', without naming the body; the morning star is normally Venus but Jupiter and Mercury are so called too. The headword's other senses (Tamil Koṟṟavai, the war-goddess; a young animal; a stork) leave the motivation for the star sense unrecovered. This is the most purely local item in the Malayalam set — a North Malabar word with no Sanskrit counterpart at all."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "बैलमाऱ्या", "name_roman": "bailamāṟyā", "literal_meaning": "bullock-killer", "register": "folk", "confidence": "certain", "usage_note": "a caravan name: travellers who start their cattle on the false dawn Jupiter announces", "quote": "बैलमाऱ्या bailamāṟyā m (Bullock-killer.) A name amongst the वाणी & कुणबी classes for the planet Jupiter. (Because the rising of this planet being sometimes mistaken for that of Venus, and the dawn thus being judged to be approaching, travelers start off their cattle to encounter, it may be, long darkness with all its troubles and accidents).", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. बैलमाऱ्या, p. 592", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AC%E0%A5%88%E0%A4%B2%E0%A4%AE%E0%A4%BE%E0%A4%B1%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "A planet, not a star, but the best single specimen of Deccan folk sky-knowledge in Molesworth: attributed to named communities (Vāṇī traders and Kuṇbī cultivators), grounded in a practical error — confusing Jupiter's heliacal rising with Venus as morning star — and named for its cost in dead bullocks."}, {"language": "Odia", "region": "Odisha", "name_native": "ଖଚୁଆ ତରା", "name_roman": "Khachuā tarā", "literal_meaning": "'the tale-telling star', from khaca, an account or report", "register": "folk", "confidence": "certain", "usage_note": "The best piece of sky-lore in Praharaj. Because the star is seen sometimes before dawn and sometimes for a watch after nightfall, people believe it goes ahead to Yama and reports the doings of the people of this world.", "quote": "ଖଚୁଆ ତରା— Khachuā tarā ଦେ. ବି— ପାହାନ୍ତିଆ ତାରା— Morning Star. [ଦ୍ର—ଏ ତାରା କେତେକ ମାସ ରାତି ନ ପାହୁଣୁ ଓ କେତେକ ମାସ ରାତି ପହରକ ପର୍ଯ୍ୟନ୍ତ ଦେଖାଯିବାରୁ ଲୋକ ବିଶ୍ୱାସ ଯେ ଏ ପୃଥିବୀର ଲୋକଙ୍କ ନାମରେ ଯମ ଆଗରେ ଯାଇ ଖଚ କହେ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଖଚୁଆ ତରା Khachuā tarā, p. 1890", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%96%E0%AC%9A%E0%AD%81%E0%AC%86%20%E0%AC%A4%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "Note what the folk belief is doing: it is an explanation of Venus's alternation between morning and evening apparitions — the star is absent because it has gone to Yama's court to file its report. The literal meaning given here is my reading of khaca 'account, report' as used in the note itself."}, {"language": "Odia", "region": "Garjat (the Odisha princely states)", "name_native": "ଫୁକିଆ (ଫୁକିଆତରା)", "name_roman": "Phukiā (Phukiātarā)", "literal_meaning": "uncertain; Praharaj gives no derivation", "register": "folk", "confidence": "certain", "usage_note": "Marked ପ୍ରାଦେ. (ଗଡ଼ଜାତ), provincial to the Garjat states. Defined by the clock and by the work it starts: the star that rises at 4 a.m., with the example sentence 'when Phukiā rises the fisherwomen begin husking chuṛā (flattened rice)'.", "quote": "ଫୁକିଆ— Phukiā (ଫୁକିଆତରା—ଅନ୍ୟରୂପ) ପ୍ରାଦେ. (ଗଡ଼ଜାତ) ବି— ରାତି 4 ଟା ବେଳେ ଉଦିତ ହେବ ପାହାନ୍ତିଆ ତାରା; ଶୁକ୍ର ଗ୍ରହ— Morning star; the planet Venus rising in the early morning. (ଯଥା—ଫୁକିଆ ଉଠିଲେ କେଉଟୁଣିମାନେ ଚୁଡ଼ାକୁଟା ଆରମ୍ଭ କରନ୍ତି।)", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଫୁକିଆ Phukiā, p. 5239", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AB%E0%AD%81%E0%AC%95%E0%AC%BF%E0%AC%86&searchhws=yes&matchtype=exact", "notes": "A working-day marker rather than an agricultural-calendar marker: the star tells the hour, not the season. Paired with ଫୁକିଆ, note that the Sambalpuri name for the EVENING star is also a fisher word — କେଉଁଟି ତାରା, from keuṭa, the fisher caste."}, {"language": "Punjabi", "region": "Punjab (contributed from Kasur by Ghulam Hussain Khan)", "name_native": null, "name_roman": "Tapt Tārā", "literal_meaning": "glossed by the contributor as 'the Galloping Star'", "register": "folk", "confidence": "likely", "usage_note": "Named for motion: Venus visibly shifts against the stars faster than any other bright object, and the name records the observation.", "quote": "A common name for the planet Venus or the Morning Star is in the Panjab Tapt Tárá, the Galloping Star, from its quick movement.", "citation": "Ghulam Hussain Khan, 'Panjab - Name for Venus - The Morning Star', Indian Notes and Queries, vol. IV (1886-87), note 363", "source_url": "https://archive.org/details/inq_pnq_v4", "notes": "confidence likely: the first element is uncertain in the scanned type (Tapt / Ṭapaṭ) and the contributor's gloss 'galloping' does not obviously match Sanskrit tapta 'heated'; no script form is printed."}, {"language": "Tamil", "region": "Nāñcilnāṭu (Kanniyakumari district)", "name_native": "சொக்கவெள்ளி", "name_roman": "cokka-veḷḷi", "literal_meaning": "pure/refined silver; hence the morning star", "register": "folk", "confidence": "certain", "usage_note": "A FOLK USE with a practical function: the Lexicon's illustrative sentence is a traveller's, 'The morning star has risen, so let us set out.' Marked Nāñ., i.e. the Nāñcilnāṭu dialect of the far south.", "quote": "சொக்கவெள்ளி cokka-veḷḷi , n. < சொக்கம்¹ +. 1. [K. cokkabeḷḷi, Tu. cokkaboḷḷi.] See சொக்கக்கட்டிவெள்ளி. Colloq. 2. Morning star; விடிவெள்ளி. சொக்கவெள்ளி உதயமாகிவிட்டதாற் புறப்படுவோம். Nāñ.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. சொக்கவெள்ளி sense 2, vol. III p. 1646, marked Nāñ.", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%9A%E0%AF%8A%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AE%B5%E0%AF%86%E0%AE%B3%E0%AF%8D%E0%AE%B3%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "HOMONYM within the entry: sense 1, marked Colloq. and with Kannada and Tulu cognates, is refined silver bullion. The metal sense and the planet sense are the same metaphor running in two directions, which is exactly the veḷḷi trap. The star sense is fixed by the illustrative sentence — one does not set out on a journey because bullion has risen."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Jevan Sukum (Jevan Tara, Dohan Chandani); Pahat Sukum (Pahat Sukir, Pahat Tara)", "literal_meaning": "the dinner star; the dawn star", "register": "tribal", "confidence": "certain", "usage_note": "Jevan is the meal: the star that rises in the east in the evening and says it is time to eat, also the star that says it is time to milk the cow. Pahat Sukum stands overhead at 4 a.m. and says it is time to start work.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The authors note that Gond informants recognise the evening and morning stars as the same body, which implies a working notion of a planet; but apart from Venus they identified no other moving star."}, {"language": "Ho", "region": "Kolhan, Singhbhum, Jharkhand", "name_native": null, "name_roman": "aṅgo ipil (printed 'ango ipil', 'anyo ipil')", "literal_meaning": "the dawn star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "anyo ipil (n. a.) morning star", "citation": "Burrows, Ho Grammar, with Vocabulary (1915), English-Ho vocabulary s.v. 'morning star', and Ho-English vocabulary s.v. anyo ipil", "source_url": "https://archive.org/download/hogrammarwithvoc00burruoft/hogrammarwithvoc00burruoft_djvu.txt", "notes": "Directly cognate with Mundari aṅgo ipil. Burrows' scan carries no usable page numbers in its OCR, so the citation is by headword only. Ho is the one Munda language of the three for which no dictionary on Hoffmann's or Bodding's scale exists, and Burrows records no constellation names at all."}, {"language": "Khasi", "region": "Khasi and Jaintia hills, Meghalaya", "name_native": null, "name_roman": "'lur-shai", "literal_meaning": "the light star, the bright star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "'lur-shai, u, n. the morning star.", "citation": "Nissor Singh, Khasi-English Dictionary (1906), s.v. 'lur-shai, p. 120", "source_url": "https://archive.org/download/khasienglishdict00singrich/khasienglishdict00singrich_djvu.txt", "notes": "shai is 'light, bright' in the same dictionary."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "bijj-bīnkō (morning); ḍhurti-bīnkō (evening); bhurkā", "literal_meaning": "the dawn star; the dusk star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "bhurkā s. The star Venus. Bhurkā-bīnkō. — Syn. Bijj-bīnkō (morning star), ḍhurti-bīnkō (evening star.)", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. bijj-bīnkō, p. 82; s.v. bhurkā, p. 114; s.v. bīnkō, p. 85", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "bijj- is the same element as bijj-ghaṛī 'dawn, peep of day' and bijjnā 'to dawn'. bhurkā is cognate with the Mundari Sadan loan burka ipil (< Hindi bhor kā tārā)."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "Lugu ipil, mahara ipil, gaikohaṛ ipil", "literal_meaning": "Lugu's star; the cowherd's star", "register": "tribal", "confidence": "certain", "usage_note": "Lugu is the cowherd in Siṅgboṅga's service, and is visible only when, like the maharas on earth, he drives the cattle out a little before dawn.", "quote": "Lugu ipil or mahara ipil is no other than the Morning star.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Cross-entered at vol. V col. 1357: 'gaikohaṛ-ipil syn. of mahara ipil'. Hoffmann observes that the Mundas make no distinction between stars and planets and never noticed that planets do not twinkle."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "aṅgo ipil", "literal_meaning": "the dawn star", "register": "tribal", "confidence": "certain", "usage_note": "The star that heralds dawn; aṅgo-dipli is 'at dawn, at daybreak'.", "quote": "aṅgo-ipil syn. of burkaipil, sbst., the morning star, i. e., Mars, Saturn, Jupiter and Venus when they happen to rise a little before dawn.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. I, s.v. aṅgo-ipil", "source_url": "https://archive.org/download/dli.ernet.14919/14919-Encyclopedia%20Mundarica%20Vol-i%20%281950%29_djvu.txt", "notes": "Hoffmann's ipil article gives two further names for the morning star: burka ipil, which he says is a corruption of Hindi bhor kā tārā and so a Sadan loan, and a compound meaning 'the star which drives home the thieves, warning them that the light of day is coming', whose Mundari form is too badly OCR'd in both scans to record — its first element is evidently kumbuṛu, 'thief'."}, {"language": "Nicobarese", "region": "Car Nicobar", "name_native": null, "name_roman": "mi-sa-ha", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "mi-sa-ha, the morning Star.", "citation": "Whitehead, Dictionary of the Car-Nicobarese Language (1925), s.v. mi-sa-ha", "source_url": "https://archive.org/download/dictionaryofcarn0000whit/dictionaryofcarn0000whit_djvu.txt", "notes": "Cognate with Man's Central Nicobarese mu-shāha, from an independent dictionary of a different island and a different Nicobarese language. Whitehead also has mi-letü-chö, 'a certain star; perhaps the morning star', cross-referred to Sa-nim-pi-radi, 'the evening star'; he identifies neither, and they are recorded here only in this note."}, {"language": "Nicobarese", "region": "Central Nicobars (Nancowry group)", "name_native": null, "name_roman": "mu-shāha", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Morning-star, mu-shāha.", "citation": "Man, A Dictionary of the Central Nicobarese Language (1889), English-Nicobarese p. 60 s.v. Morning-star; also p. 90 s.v. Star", "source_url": "https://archive.org/download/adictionarycent00mangoog/adictionarycent00mangoog_djvu.txt", "notes": "Man also gives an evening-star and a falling-star term at p. 90, but both are too badly OCR'd in the Internet Archive scan to record."}]}, {"key": "orion", "title": "Orion", "kind": "figure", "ra": 83.0, "dec": 1.0, "modern_star": {"common_name": "Orion", "bayer": null, "constellation": "Orion"}, "sanskrit_db_id": "mriga", "names": [{"language": "Assamese", "region": "Assam", "name_native": "কালপুৰুষ", "name_roman": "kālapuruṣa", "literal_meaning": "'the man of Kāla / of Death'", "register": "vernacular", "confidence": "certain", "usage_note": "Assamese has the same Orion-figure as Bengali and Odia. What is distinctively Assamese is the reckoning: the dictionary defines the figure as 'the group containing seven very bright stars' (সাতোটা অতি উজ্জ্বল নক্ষত্ৰ থকা ৰাশি), i.e. Orion counted as seven bright stars rather than by its parts.", "quote": "কালপুৰুষ kālapuruṣa বি. সুৰুতি ব্ৰহ্মৰ্ষিৰ ভেশ ধৰি ৰামচন্দ্ৰক স্বৰ্গলৈ নিবলৈ অহা এজন পুৰুষৰ নাম … 2। সাতোটা অতি উজ্জ্বল নক্ষত্ৰ থকা ৰাশি; the constellation Orion. 3। মৱত্যু-দেবতা।", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. কালপুৰুষ kālapuruṣa, p. 210", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%95%E0%A6%BE%E0%A6%B2%E0%A6%AA%E0%A7%81%E0%A7%B0%E0%A7%81%E0%A6%B7&searchhws=yes&matchtype=exact", "notes": "The DSAL transcription of this dictionary renders the Assamese vowel sign ৃ as ৱ throughout (মৱত্যু for মৃত্যু, কৱত্তিকা for কৃত্তিকা). The headword কালপুৰুষ itself is unaffected. In sense 1 the Assamese tradition additionally identifies Kālapuruṣa as the figure who came in the guise of the brahmarṣi Suruti to take Rāmacandra to heaven — a Rāmāyaṇa episode, not the Yama-messenger of the Bengali and Odia dictionaries."}, {"language": "Bengali", "region": "Bengal", "name_native": "কালপুরুষ", "name_roman": "kālapuruṣa", "literal_meaning": "Dāsa parses it 'Kāla (= Yama), his puruṣa (= assistant)', a genitive tatpuruṣa; but his second sense reads Kāla as TIME — 'the star-cluster that measures kāla, i.e. the rains and the other seasons'", "register": "vernacular", "confidence": "certain", "usage_note": "The second and better Bengali source for the prize word. Dāsa gives the alternative name অগ্রহায়ণী Agrahāyaṇī, and appends an English note describing the belt: 'one of the constellations containing seven very bright stars, three of which in a straight line, form Orion's belt'.", "quote": "কালপুরুষ kālapuruṣa [কাল (যম) তার পুরুষ (সহকারী)-6 তৎ] বি, যমকিঙ্কর; যমের ভৃত্য। 2 পুরুষাকৃতি নক্ষত্রপুঞ্জ; কাল- (বর্ষাদি ঋতু) পরিমাপক নক্ষত্রপুঞ্জ; ইহার নামান্তর অগ্রহায়ণী the constellation Orion […] 3 শুভাশুভ জ্ঞাতার্থে জন্মলগ্নাদি কল্পিত দ্বাদশ রাশি।", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. কালপুরুষ kālapuruṣa, p. 512", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=512", "notes": "This entry settles the 'Time-man' question: Bengali lexicography itself reads kāla BOTH ways, as Death in the etymology and as season-time in the astronomical sense — 'the cluster by which the seasons are measured'. The seven-bright-star count in the English note is the same reckoning the Assamese dictionary gives (Candrakanta p. 210), and the alternative name Agrahāyaṇī is the same one Praharaj gives for Odia (p. 1552). The three dictionaries are describing one eastern tradition."}, {"language": "Bengali", "region": "Bengal (standard literary Bengali)", "name_native": "কালপুরুষ", "name_roman": "kālapuruṣa (Kālpuruṣ)", "literal_meaning": "'the man of Kāla' — Kāla being both Time and Death (Yama); hence 'the Time-man / the black man', Yama's envoy", "register": "vernacular", "confidence": "certain", "usage_note": "The ordinary modern Bengali word for Orion; it is the name under which the figure is taught in Bengali schoolbooks and popular astronomy, and it has no counterpart in the Sanskrit star-lists, where Orion is Mṛga/Prajāpati and only its parts (Mṛgaśiras, Ārdrā, Iṣus trikāṇḍā) are named.", "quote": "কালপুরুষ kālapuruṣa n. (myth.) an attendant or envoy of Yama, the god of death; (astr.) the Orion.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. কালপুরুষ kālapuruṣa, p. 231", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%95%E0%A6%BE%E0%A6%B2%E0%A6%AA%E0%A7%81%E0%A6%B0%E0%A7%81%E0%A6%B7&searchhws=yes&matchtype=exact", "notes": "This is the flagship entry for this database: a constellation figure named in the modern eastern NIA languages and not inherited as a constellation name from Sanskrit. In Sanskrit, kālapuruṣa is (a) Yama's black-bodied messenger and (b) in jyotiṣa the 'zodiacal man' on whose body the twelve rāśis are laid out; neither is the const
