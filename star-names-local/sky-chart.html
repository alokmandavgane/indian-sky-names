డ్ల చుక్క", "name_roman": "podariṇḍla cukka", "literal_meaning": "the star of the bowers", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "పొదరిల్లు po ar-illu. (పొదరు+ఇల్లు.) n. A bower or arbour. నికుంజము. పొదరు Same as పొద. పొదరిండ్ల చుక్క the constellation called పునర్వసు నక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పొద poda, p. 813", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=813", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. podaru-illu is 'bush-house, arbour'; the plural genitive gives 'star of the arbours'. Motivation unexplained by Brown."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పొట్లపూచుక్క", "name_roman": "poṭla-pū-cukka", "literal_meaning": "the snake-gourd-flower star", "register": "vernacular", "confidence": "certain", "usage_note": "The month name is formed from the same base: poṭla-pū-rikka-nela = Pauṣa.", "quote": "పొట్ల [Tel. lit: that which has spots. పొడలుకలది. cf. Tamil పొడలంగాయ.] n. The snake gourd, Momordica charantia. … పొట్లపూచుక్క poṭla-pū-ṭsukka. n. The constellation called పుష్యమి, పొట్లపూరిక్క నెల the month called పుష్యమాసము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పొట్ల poṭla, p. 809", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=809", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. Brown spells the star with -cukka and the month with -rikka in the same line, which shows the two star-words were freely interchangeable in these compounds."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "రిక్క", "name_roman": "rikka", "literal_meaning": null, "register": "vernacular", "confidence": "certain", "usage_note": "The other native Telugu star-word, used almost exclusively as the second element of compound asterism names (baṇḍi-rikka, tāṭi-rikka, nīṭi-rikka …). Rarer than cukka as a free word.", "quote": "రిక్క [Tel.] n. A star. నక్షత్రము. A constellation, a lunar mansion. A peculiar noise made in driving cattle. పశువులను తోలునపుడు చేయు ధ్వని. A pustule, weal, blister. బొబ్బ.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. రిక్క rikka, p. 1085", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1085", "notes": "sanskrit_db_id deliberately left null. rikka descends from Sanskrit ṛkṣa through a Middle-Indic rikkha, but the only ṛkṣa entry in the Sanskrit database (id 'rksha') is the Vedic asterism = Ursa Major, which is not what Telugu rikka means. HOMONYM: Brown's same headword also covers a cattle-driving call and a blister."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "సప్పపుచుక్క", "name_roman": "sappapu-cukka", "literal_meaning": "the serpent's star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "సప్పము [from Skt. సర్పము.] n. A serpent. సప్పపుచుక్క sappapu-ṭsukka. n. The star called అశ్లేష.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. సప్పము sappamu, p. 1304", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1304", "notes": "A calque on the presiding deity rather than on the name: Āśleṣā's devatā is the Sarpas, and the db has the Vedic alias 'sarpa' for exactly this asterism. sappamu is the tadbhava of sarpa, so the name is half-Sanskrit; registered 'vernacular' because the compound itself is Telugu."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "సాముకంటిచుక్క", "name_roman": "sāmu-kaṇṭi-cukka", "literal_meaning": null, "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "సాముకంటిచుక్క sāmu-kanṭi-ṭsukka. n. The name of a constellation called పుబ్బా or పూర్వఫల్గునీనక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. సాము sāmu, p. 1331", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1331", "notes": "Literal meaning uncertain and therefore left null rather than guessed: Brown's headword సాము carries three unrelated senses on the same page ('a half', 'bodily exercise / fencing'), and he does not say which underlies the star-name. kaṇṭi is 'eye'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "సోకుచుక్క", "name_roman": "sōku-cukka", "literal_meaning": "the demon's star", "register": "vernacular", "confidence": "certain", "usage_note": "Mūla is the most inauspicious of the mansions in popular Telugu reckoning, and the name says so.", "quote": "సోకు [Tel.] v. n. To touch, come in contact with. … To be possessed by a demon, to be affected by the evil influence of stars or demons, గ్రహమావేశించు. … n. … An evil spirit, a demon, రాక్షసుడు, పిశాచము. … సోకుచుక్క the constellation called మూలనక్షత్రము. … సోకులరేడు sōkularēḍu. n. The regent of the S. W. region నైరృతి, మూలరేడు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. సోకు sōku, p. 1366", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1366", "notes": "Internally consistent and self-verifying: Mūla's presiding deity is Nirṛti, and Brown's own next-but-one sub-entry glosses సోకులరేడు 'lord of the demons' as నైరృతి / మూలరేడు 'lord of Mūla'. So the Telugu name is a calque on the deity, made with the native word sōku 'evil spirit'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "తొలురిక్క", "name_roman": "tolu-rikka", "literal_meaning": "the first star", "register": "vernacular", "confidence": "certain", "usage_note": "Names the mansion by its position at the head of the list.", "quote": "తొలురిక్క the first constellation, i.e., Asvini. తొలువేలుపు the first god, i.e., Brahma సురజ్యేష్ఠుడు", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. తొలుత toluta, p. 562", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=562", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has."}, {"language": "Hindi", "region": "eastern Hindi belt - Bhojpuri and Awadhi districts; Fallon's proverbs are marked Bhoj.", "name_native": "हथिया / ﮩتيا", "name_roman": "hathiyā", "literal_meaning": "'the hand' (vernacular reflex of Sanskrit hasta)", "register": "folk", "confidence": "certain", "usage_note": "The single most important star name in Hindi-belt village life: not an object to look at but a rain season to reckon by. Grierson notes it is the longest of the asterisms, sixteen lunar days, and that cultivators said the rains used to end in Swati but now end in Hathiya. It is personified as Hathi rāni, 'Queen Hathiya', who announces herself by thunder.", "quote": "ﮩتيا हथिया hath'iyā, hasth , n. m. S. हस्त The 13th mansion of the moon; Corvus. 1. Hathiyā barse tīn hot haiṅ, shakkar, shālī, māsh, Hathiyā barse tīn jāt haiṅ, tillī, kodo, kapās.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. hath'iyā, p. 1197", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=1197", "notes": "Fallon translates: 'When in the thirteenth mansion rain doth fall / Rice, sugarcane, and pulse, these three thrive all, / But cotton, kodo, sesamum, all three / The rains destroy beyond all remedy.' Grierson, Bihar Peasant Life (1885), §1082 p. 271 and §1084 p. 273, and §1090 pp. 281-82 for the Queen Hathiya couplet: 'Maggha lagáwe ghaggha, swáti láwas tati, / Kahtari Hathi rani, ham hun awat hati.' Platts, p. 1219, adds the second sense 'the end (or breaking up) of the rains'."}, {"language": "Hindi", "region": "Bihar (Bhojpuri/Magahi); the same forms in Fallon for Hindustani generally", "name_native": null, "name_roman": "nakhat / nachhattr / nichhattr", "literal_meaning": "vernacular reflexes of Sanskrit nakṣatra", "register": "folk", "confidence": "certain", "usage_note": "The word survives in the countryside as a unit of the farming year, not of astronomy: twenty-seven unequal periods, each governing a specific operation, ranging from about thirteen lunar days in the dry months to sixteen for Hathiya. Grierson's list of their vernacular names - Rohni, Mirgsira, Aradra, Punarbas, Pukh, Maggha, Purba/Utra Phaguni, Hast or Hathiya, Chitra, Bināti or Siwāti, Bisākha, Anurādha, Jeshtha, Mul, Purba Khārh, Utra Khārh - is the vernacular register of the whole nakṣatra series in one place.", "quote": "Besides the above, another important division of the year must be noticed, — that into lunar asterisms (nakhat, nachhattr, or nichhattr). There are 27 of these in each year ... Each asterism is not of equal length. The longest is hathiya, which is 16 lunar days. ... Every agricultural operation commences in a certain asterism, and so it is necessary to know when they occur.", "citation": "G. A. Grierson, Bihar Peasant Life (Calcutta, 1885), §1082, p. 271, with the table of asterisms pp. 272-73", "source_url": "https://archive.org/details/cu31924072688025", "notes": "Grierson prints each name in Devanagari beside the transliteration, but the Devanagari is unrecoverable from the scanned text, so name_native is left null. Fallon, p. 1157, s.v. nichhat'tar, nachhattar (नछत्तर), gives the same generic word for Hindustani; Platts, p. 1148, notes the tatsama nakshatra with the vernacular naććhattar and 'corr. H. निक्षत्र nikshatr'."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಹುಬ್ಬೆ", "name_roman": "hubbe", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "AGRICULTURAL. Kittel prints two Kannada proverbs on the Hubbe rains under the headword — the whole entry is quoted below.", "quote": "ಹುಬ್ಬೆ hubbe. = ಉಬ್ಬೆ, ಪುಬ್ಬೆ. Tbh. of ಪೂರ್ವೆ. the eleventh Nakṣatra. (Śmd. 356; C.). ಹುಬ್ಬೇ ಮಳೆ ಗುಬ್ಬೀ ತಲೆ ನೆನೆಯುವುದಿಲ್ಲ. - ಹುಬ್ಬೇ ಮೞೆ ಅಬ್ಬೇ ಹಾಲು (Prv.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಹುಬ್ಬೆ hubbe, p. 1745", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1745", "notes": "The name itself is a tadbhava of Pūrvā and so sanskritic in origin, but it is entered here as folk because what Kittel actually records is proverbial rain-lore, not the almanac term: the first proverb says the Hubbe rain will not wet even a sparrow's head, the second calls it a mother's milk — the two verdicts sitting side by side, as proverbs about weather do. COGNATE PAIR with Telugu పుబ్బ pubba (Brown p. 774), the identical worn form."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಮಖೆ", "name_roman": "makhe", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "AGRICULTURAL. Also ಮಘೆ maghe (p. 1256), which carries a second rain proverb.", "quote": "ಮಖೆ makhe. = ಮಘೆ. (My.). the tenth nakṣatra. ಮಖೆಮೞೆ ಆದರೆ ಮೊಗ ತೊಳೆಯುವದಕ್ಕೆ ಆಗದೇ? (Prv.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಮಖೆ makhe, p. 1254", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1254", "notes": "Second Kannada rain-star proverb: if the Makhe rain falls, will it not do at least to wash one's face with? — i.e. the Maghā rain is slight. Kittel's parallel headword ಮಘೆ (p. 1256) prints ಮಘೇ ನೀರು ಮೊಗೇಲಿಡು !, on the same theme. Together with Hubbe these show that in Kannada the rain-lore attaches to the tadbhava asterism names themselves, where Telugu instead built a separate word, kārte, for the solar period."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "वळवा", "name_roman": "vaḷavā", "literal_meaning": "the turned ones", "register": "folk", "confidence": "likely", "usage_note": "वळवाचा पाऊस, the late-monsoon rain that comes from the east", "quote": "वळवा vaḷavā f pl (वळणें To turn. The wind and rain having turned and begun to come from the east.) A term for those nakshatras of the rainy months which follow पूर्वा. वळवाचा पाऊस The rain which falls under those nakshatras: also, figuratively, a person of whom there is no calculating whither he will turn.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. वळवा, p. 740", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B5%E0%A4%B3%E0%A4%B5%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "A vernacular label for a BLOCK of asterisms rather than a single one — Molesworth defines it only as 'those which follow पूर्वा', so it cannot be pinned to particular stars. Left with no sanskrit_db_id and no modern star for that reason. Still current in Marathi as वळवाचा पाऊस for pre- and post-monsoon thundershowers."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "वाफ", "name_roman": "vāpha", "literal_meaning": "the fit state of the ground for sowing; hence the sowing season", "register": "folk", "confidence": "certain", "usage_note": "the sowing seasons are named by asterism: मृगाची-हत्तीची-चित्राची-कृत्तिकेची-रोहिणीची वाफ", "quote": "वाफ vāpha f (वाप S) The fit state of the ground for sowing (see वापसा): also, by meton., the season or fit time for sowing; as मृगाची-हत्तीची-चित्राची-कृत्तिकेची-रोहिणीची वाफ.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. वाफ, p. 748", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B5%E0%A4%BE%E0%A4%AB&searchhws=yes&matchtype=exact", "notes": "Not a star-name but the frame that makes the star-names matter: the Marathi cultivator's sowing calendar is indexed by asterism — the Mṛga, Hasta, Citrā, Kṛttikā and Rohiṇī 'vāphs'. Note that हत्तीची वाफ uses the folk elephant-form of Hasta, not हस्त."}, {"language": "Telugu", "region": "Bellary district, Deccan (Kannada- and Telugu-speaking Lingāyat cultivators)", "name_native": null, "name_roman": "Rohini Karte (and the rest of the 27 kārte)", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "AGRICULTURAL. Which crop is sown on which asterism's rain, and which asterism must not bring wind or lightning. Recorded for Lingāyat cultivators of Bellary.", "quote": "Rain in Rohini Karte (one of the twenty-seven asterisms in which rain falls) is good for sowing, and that in Mrugasira and Ardra appropriate. These three asterisms are suited for sowing cholam. Showers in Punarvasu, Pushya, and Aslesha are suitable for sowing korra, saju and savi. Rain in Pubba and Wuttara is favourable to cotton, korra and horse gram, and that in Hasta and Chitta to wheat, cholam, Bengal gram and kusumulu (oil-seed). … In Magha, weeding, either by the hand or by bullocks, should not be done. Wind should not blow in Wuttara. … There should be no lightning flashes in Swati. … Rain in Visakha destroys worms, and is good for pulses. Rain in Anuradha spoils them.", "citation": "Thurston, E. (assisted by K. Rangachari), Castes and Tribes of Southern India (Madras: Government Press, 1909), vol. IV, article 'Lingāyat', p. 290", "source_url": "https://archive.org/download/castestribesofso04thuriala/castestribesofso04thuriala_djvu.txt", "notes": "name_native is null: Thurston prints these romanised only, and back-transliterating into Telugu or Kannada script would be inventing evidence — the district is bilingual and the informants were Lingāyats of Bellary, so it is not even certain which script would be right. The forms are the vernacular ones (Pubba, Wuttara, Chitta), not the Sanskrit ones. This passage is the best single demonstration that the nakṣatra list in the Deccan is a working agricultural instrument rather than a borrowed literary ornament."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "అసిలేరు", "name_roman": "asilēru", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "Brown labels the register himself.", "quote": "అసిలేరు [Tel.] n. A vulgar name for అశ్లేష the ninth lunar mansion.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. అసిలేరు asilēru, p. 103", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=103", "notes": "The only place in either dictionary where the compiler explicitly grades a star-name for register. 'Vulgar' in Brown's usage means colloquial/rustic, hence 'folk' here. A worn-down popular form of Āśleṣā, not a new coinage."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "బరణిచుక్క", "name_roman": "baraṇi-cukka", "literal_meaning": "the casket star", "register": "folk", "confidence": "likely", "usage_note": "The Sanskrit name Bharaṇī has been reshaped in Telugu onto the native word baraṇi 'casket, jewel-box', and Brown enters the asterism under that word.", "quote": "బరణి … A casket, small jewel-case, snuff box, pill box. కటాటము. పాచికలబరిణ a dice-box. బరణిచుక్క or భరణి bharaṇi-ṭsukka. n. The second lunar mansion consisting of three stars in a triangle.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. బరణి baraṇi, p. 873", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=873", "notes": "A folk-etymological reshaping rather than an independent formation: registered 'folk' for that reason. Brown's separate Sanskrit headword భరణి (p. 924) gives the same gloss, 'three stars in a triangle'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పునాస", "name_roman": "punāsa", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "AGRICULTURAL. The asterism name has become the name of a crop: the early, inferior grain crop of the year sown in the Punarvasu period.", "quote": "పునాస or పునాసలు [from Skt. పునర్వసు, the name of a star or constellation.] n. The first crop of the year which consists of grain of an inferior kind, కొర్రలు, బొబ్బర్లు మొదలగు ధాన్యము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పునాస punāsa, p. 773", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=773", "notes": "Registered 'folk' because the word has left the sky entirely: in ordinary Telugu punāsa is a kind of harvest, and Brown has to supply the etymology to explain that it is a star at all. The clearest single instance in either language of a star-name naturalised into the agricultural vocabulary."}, {"language": "Gujarati", "region": "Gujarat", "name_native": null, "name_roman": "Kritika, Rohini, Arudra, Mragshir, Revti", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "each asterism carries a dated window and a rain omen: e.g. only a drizzle while the moon is in Kṛttikā (8-21 May) means partial failure of the rains", "quote": "The year will be one of partial failure of rain if there is only a drizzle during the time the moon remains in the Kritika star chamber.", "citation": "Gazetteer of the Bombay Presidency, Vol. IX Part I: Gujarát Population, Hindus (Bombay: Government Central Press, 1901), pp. 352-353", "source_url": "https://archive.org/details/in.ernet.dli.2015.281420", "notes": "The Gujarati shapes of the asterism names as the Gazetteer romanises them — Kritika, Rohini, Arudra, Mragshir, Revti — with the Gazetteer's own rendering of nakṣatra as 'star chamber'. Every one is the Sanskrit name in Gujarati phonology; not a single independent Gujarati star-name appears in this chapter or in the volume's separate 'Stars' section (pp. 405-406), which treats stars generically as divine beings, records saying 'Shiv Shiv' at the sight of a meteor, and the showing of the pole star to a newly married couple. Roman only; no Gujarati script is printed anywhere in the Gazetteer."}, {"language": "Gujarati", "region": "Ahmedabad district, Gujarat", "name_native": null, "name_roman": "nakshatra", "literal_meaning": "lunar mansion", "register": "sanskritic", "confidence": "certain", "usage_note": "rain in mṛg is believed to breed insects; rain in punarvasu to breed a stalk-borer in the millets", "quote": "With reference to this, as in all the ordinary affairs of life, the cultivators pay great attention to the nakshatras, or twenty-seven lunar mansions of the Hindu zodiac.", "citation": "Gazetteer of the Bombay Presidency, Vol. IV: Ahmedabad (Bombay: Government Central Press, 1879), p. 61", "source_url": "https://archive.org/details/wbsl.19319", "notes": "The clearest statement that Gujarati cultivators use the Sanskrit twenty-seven, unrenamed. The passage continues (OCR damaged, reading from context): rain during 'the mrig nakshatra which commences on the 5th June' preludes an abundance of insects, and rain in 'the punarvasu nakshatra which commences fourteen or fifteen days afterwards' brings a tiny animal generated inside the millet stalk. Compare the Marathi position, where exactly this cultivators' weather-lore produced a parallel set of NEW names (उंदऱ्या, अडवण्या, म्हातारा …). Gujarat, on this evidence, kept the Sanskrit names and attached the lore to them directly."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಭರಣಿ", "name_roman": "bharaṇi", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಭರಣಿ bharaṇi. = ಬರಣಿ. a china jar or vase. 2, the second nakṣatra (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಭರಣಿ bharaṇi, p. 1237", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1237", "notes": "COGNATE PAIR, and the same folk etymology in both languages: Kittel equates ಭರಣಿ with ಬರಣಿ 'a china jar or vase', exactly as Brown enters the Telugu asterism under బరణి 'a casket, jewel-case'. The container reading of Bharaṇī is therefore a shared Deccan vernacular development, not a Telugu quirk."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಚಿತ್ತೆ", "name_roman": "citte", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The naturalised Kannada form; Kittel's tatsama headword ಚಿತ್ರೆ citre (p. 647) is the one that carries the identification 'spica virginis'.", "quote": "ಚಿತ್ತೆ citte. Tbh. of ಚಿತ್ರೆ. the fourteenth lunar mansion. (C.; Te.). [ಚಿತ್ತೆಯ ಸರಿಯನ್ತೆಱಗಿ ಪೋದುದಮರ ಸಮಾಜಂ Ap. 14, 147].", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಚಿತ್ತೆ citte, p. 646", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=646", "notes": "REPRESENTATIVE FORM for the tadbhava series. Kittel marks it 'C.; Te.', i.e. common Kannada and shared with Telugu — and indeed Brown has చిత్త citta (p. 414) for the same mansion. The pair citte/citta is a good specimen of the shared Deccan vernacular shape of the nakṣatra list."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಧನಿಷ್ಠೆ", "name_roman": "dhaniṣṭhe", "literal_meaning": "the very rich one", "register": "sanskritic", "confidence": "certain", "usage_note": "Kittel notes the mansion is held unlucky and prints a proverb on it.", "quote": "ಧನಿಷ್ಠೆ dhaniṣṭhe. (a very rich female); the twenty-third lunar mansion, (considered to be connected with ill-luck). ಅರಸನಿಗೂ ಧನಿಷ್ಠೆ, ನನಗೂ ಧನಿಷ್ಠೆ (Prv.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಧನಿಷ್ಠೆ dhaniṣṭhe, p. 868", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=868", "notes": "The proverb — Dhaniṣṭhā for the king and Dhaniṣṭhā for me too — turns on the mansion's ill luck falling on rich and poor alike. Compare the Telugu vernacular name for the same mansion, మద్దెలరూపురిక్క 'the drum-shaped star'; Kannada keeps the Sanskrit name and attaches the folklore to it instead."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ನಕ್ಷತ್ರ", "name_roman": "nakṣatra", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The almanac and horoscope word; Kittel glosses it with the two Dravidian words, ಅಱಿಲ್ and ಮೀನ್.", "quote": "ನಕ್ಷತ್ರ nakṣatra. a star. (ಅಱಿಲ್, ಮೀನ್ Kk. 80). 2, a constellation, an asterism in the moon's path, a lunar mansion, of which 27 (or 28) are enumerated and regarded as the wives of the moon and daughters of Dakṣa. 3, the number 27 (ಇಪ್ಪತ್ತೇೞ್ Mr. 348).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ನಕ್ಷತ್ರ nakṣatra, p. 879", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=879", "notes": "This entry is the source for the summary statement that Kannada carries the full 27-fold nakṣatra system: Kittel gives all 27 as separate headwords in Kannada phonological shape."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "അശ്വതി, ഭരണി, കാര്‍ത്തിക, രോഹിണി, മകയിരം, തിരുവാതിര, പുണര്‍തം, പൂയം, ആയില്യം, മകം, പൂരം, ഉത്രം, അത്തം, ചിത്ര, ചോതി, വിശാഖം, അനുഴം, തൃക്കേട്ട, മൂലം, പൂരാടം, ഉത്രാടം, തിരുവോണം, അവിട്ടം, ചതയം, പൂരുരുട്ടാതി, ഉത്രട്ടാതി, ഇരവതി", "name_roman": "aśvati, bharaṇi, kārttika, rōhiṇi, makayiram, tiruvātira, puṇartam, pūyam, āyilyam, makam, pūram, utram, attam, citra, cōti, viśākham, anuḻam, tṛkkēṭṭa, mūlam, pūrāṭam, utrāṭam, tiruvōṇam, aviṭṭam, catayam, pūruruṭṭāti, utraṭṭāti, iravati", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Malayalam uses the full 27-nakshatra series and it still governs birth-star reckoning, name-giving, marriage-matching and festival dates. Gundert's ജന്മനക്ഷത്രം is 'the asterism, under which one is born' (p. 403), and അനുജന്മനക്ഷത്രം 'the 10th and 19th asterisms after the ജന്മനക്ഷത്രം' (p. 28) shows the derived reckoning already lexicalised in 1872.", "quote": "നക്ഷത്രം ... 2. a lunar asterism (27 or 28), of which 2¼ are counted upon one month", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.vv. അശ്വതി p. 64, ഭരം (ഭരണി) p. 759, കാര്‍ത്തിക p. 240, രോഹം (രോഹിണി) p. 889, മകയിരം p. 769, ആതിര p. 79, പുണര്‍ (പുണര്‍തം) p. 673, ആയിലിയം p. 85, മകം p. 769, ഉത്രം (also ഉത്രാടം, ഉത്രട്ടാതി) p. 129, അത്തം p. 22, ചിത്ര p. 361, ചോതി p. 396, വിശരി (വിശാഖ) p. 961, അനുഴം p. 27, കേട്ട p. 293, മൂലം p. 853, പൂരണം (പൂരാടം) p. 693, ഓണം p. 184 / തിരുവോണം p. 459, അവിട്ടം p. 62, ചതയം p. 343, ഇരവതി p. 109", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=524", "notes": "Recorded as one entry, deliberately, because these are the Sanskrit names in Malayalam phonology and are not the point of this compilation. Gundert marks most of them 'Tdbh.' (tadbhava) and several 'T. M.' (common Tamil-Malayalam), i.e. inherited through the southern tradition rather than freshly borrowed: അത്തം < hasta, ഇരവതി < revatī, ഓണം < śrāvaṇa, ചോതി < svātī, ചതയം < śatabhiṣaj, അവിട്ടം < śraviṣṭhā, മകം < maghā, അനുഴം < anurādhā. Gundert's star identifications, where he gives them, are mostly the standard ones; two are odd — അത്തം 'Coma Berenices' (p. 22; Hasta is standardly in Corvus) and അനുഴം 'Lupus and scorpion's head' (p. 27) — and should not be relied on."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "നക്ഷത്രം", "name_roman": "nakṣatram", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Also the everyday word for a person's birth-star: ജന്മനക്ഷത്രം, 'the asterism under which one is born' (Gundert s.v. ജന്മം, p. 403).", "quote": "നക്ഷത്രം nakṣatram nakšatram S. ( നക്ഷ് to come up). 1. A star, (vu. നച്ചത്രം, നസ്ക്യേതിരം ), ശൂലാ ഗ്രേ ന'ങ്ങള്‍ എണ്ണിക്കൊള്‍ക PT. 2. a lunar asterism (27 or 28), of which 2¼ are counted upon one month", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. നക്ഷത്രം nakṣatram, p. 524", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=524", "notes": "The vulgar forms Gundert records in parentheses — നച്ചത്രം naccatram and നസ്ക്യേതിരം naskyētiram — are the register point in miniature: the Sanskrit word ground down by ordinary Malayalam mouths. നാള്‍ nāḷ 'day' is the common colloquial substitute for the birth-star."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "नक्षत्र", "name_roman": "nakṣatra", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "नक्षत्रासारखा, 'brilliant as a constellation'; नक्षत्र पडणें (हातावर) 'to have itching hands, be given to thieving'", "quote": "नक्षत्र nakṣatra n (S) A star. 2 An asterism in the moon's path; a lunar mansion. Twenty-seven are enumerated; viz. अश्विनी, भरणी, कृत्तिका, रोहिणी, मृग or मृगशीर्ष, आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा (or असाळका), मघा, पूर्वा, उत्तरा, हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा, मूल, पूर्वाषाढा, उत्तराषाढा, श्रवण, धनिष्ठा, शततारका, पूर्वाभाद्रपदा, उत्तराभाद्रपदा, रेवती, अभिजित्.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. नक्षत्र, p. 454", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A8%E0%A4%95%E0%A5%8D%E0%A4%B7%E0%A4%A4%E0%A5%8D%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "This is the entry that settles the framing question for Marathi: the standard twenty-seven are taken over wholesale from Sanskrit, with only light Marathi phonology (आश्लेषा 'or असाळका', पूर्वा/उत्तरा for the Phalgunīs, मृग for मृगशीर्ष). The interesting Marathi material is not here but in the cultivators' renamings recorded above."}, {"language": "Punjabi", "region": "Punjab", "name_native": "ਮੱਘਾ", "name_roman": "magghá", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Punjabi phonology on the Sanskrit name, with the gemination characteristic of the language. Maya Singh's first sense - a small earthen water-and-buttermilk pot - is a homonym, and shows the star name sitting inside ordinary domestic vocabulary.", "quote": "MAGGHÁ ਮੱਘਾ s. m. A small earthen vessel used for holding water and butter milk; the fifteenth of the twenty-seven (according to later reckoning twenty-eight) lunar mansions known to Hindu Astrology.", "citation": "Bhai Maya Singh, The Panjabi Dictionary (Lahore, 1895), s.v. magghá, p. 695", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/singh_query.py?page=695", "notes": "Maya Singh's ordinal 'fifteenth' counts from Śraviṣṭhā/Dhaniṣṭhā, as in his own list s.v. nachhattar; in the Aśvinī-first order Maghā is the tenth. In Bihar the same asterism appears as Maggha in the rain proverbs (Grierson 1885, p. 281)."}, {"language": "Punjabi", "region": "Punjab", "name_native": "ਨਛੱਤ੍", "name_roman": "nachhattar", "literal_meaning": "Punjabi reflex of Sanskrit nakṣatra", "register": "sanskritic", "confidence": "certain", "usage_note": "Maya Singh prints the complete list of the twenty-seven (twenty-eight with Abhijit) under this headword in their Sanskrit forms, and notes that the Punjabi month names Māgh, Phaggun, Chet, Vaisākh, Jeth, Hār, Sāwan, Bhādroṅ, Assū, Kattak, Magar and Poh are derived from them. This is the entry that licenses the statement that Punjabi simply takes over the Sanskrit twenty-seven.", "quote": "NACHHATTAR ਨਛੱਤ੍ s. m. Corrupted from the Sanskrit word Nakshatra. A star, a horoscope; a lunar mansion or constellation in the moon's path; an asterism ... The names of various months are derived from these Nachhattars, thus Magh, Phaggun, Chet, Vaisakh, Jeth, Har, Sawan, Bhadron, Assu, Kattak, Magar and Poh.", "citation": "Bhai Maya Singh, The Panjabi Dictionary (Lahore, 1895), s.v. nachhattar, p. 786", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/singh_query.py?page=786", "notes": "This one entry stands for the whole Sanskrit twenty-seven in Punjabi; they are deliberately not itemised here."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "අස්විද, බෙරණය, කැති නැකත, රෙහෙණ, මුවසිරස, අදේ, පුනාවස, පුසේ·නැකත, අස්ලිස, මා·නැකත, පුවපල්, උතුරුපල්ගුන, හත, සිත, සාය, විසා·නැකත, අනුර, දෙට, මුළ, පුව·සළ, උතුරු සළය, සුවණය, දෙනට, සිය·වස, පුවපුටුපේ, උතුරු පුටුපය, රේවතිය", "name_roman": "asvida, beraṇaya, kæti nækata, reheṇa, muvasirasa, adē, punāvasa, pusē-nækata, aslisa, mā-nækata, puvapal, uturupalguna, hata, sita, sāya, visā-nækata, anura, deṭa, muḷa, puva-saḷa, uturu saḷaya, suvaṇaya, denaṭa, siya-vasa, puvapuṭupē, uturu puṭupaya, rēvatiya", "literal_meaning": null, "register": "sanskritic", "confidence": "likely", "usage_note": "These are the working names of the Sinhala almanac and of nekata reckoning — the choice of auspicious moments that still governs Sri Lankan New Year observances, first ploughing, and the naming of children.", "quote": "අස්විද asvida , n . E. of අශ්විනි .", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.vv. අස්විද p. 84, බෙරණය p. 454, කැති නැකත p. 169, රෙහෙණ p. 542, අදේ p. 25, පුසේ·නැකත p. 400, අස්ලිස p. 83, මා·නැකත p. 491, උතුරුපල්ගුන p. 116, හත p. 713, සාය p. 673, විසා·නැකත p. 604, අනුර p. 37, දෙට p. 297, මුළ p. 507, පුව·සළ p. 399, උතුරු සළය p. 117, සුවණය p. 694, දෙනට p. 297, සිය·වස p. 682, පුවපුටුපේ p. 399, උතුරු පුටුපය p. 116, රේවතිය p. 542; Clough (1892) s.vv. Muwa-sirasa p. 493, Punáwasa p. 364, Puwapal p. 368", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=%E0%B6%85%E0%B7%83%E0%B7%8A%E0%B7%80%E0%B7%92%E0%B6%AF&matchtype=default&searchhws=yes", "notes": "THE COMPARATIVE RESULT. Every one of the twenty-seven is a Sanskrit/Pali name in Sinhala phonology, and the dictionaries say so themselves rather than leaving it to inference: Carter's formula is literally 'X, n. E. of Y' — Eḷu of — as at අස්විද 'E. of අශ්විනි' (p. 84), දෙනට 'E. of ධනිෂ්ඨ' (p. 297), බෙරණය 'E. of භරණිය' (p. 454), අස්ලිස 'E. of අශේල්ෂාව' (p. 83); Clough's independent formula is 'Elu form of', as at 'Punáwasa ... Elu form of පුනර්වසු' (p. 364) and 'Má-nekat ... Elu form of මඝා maghá' (p. 479). Sinhala replaced NONE of them. Its native coinages — hat-dinna for the Pleiades, ahas-gaṅga for the Milky Way, irabaṭu-taruva and pahan-taruva for Venus, dum-keheliya for a comet, uḷu and taruva for 'star' — all lie OUTSIDE the nakshatra list, in the everyday sky. The one apparent exception is Carter's parse of සිය·වས as '(සිය 100 වස stars)' (p. 682), a native numeral compound for Śatabhiṣaj 'the hundred physicians', and the half-calque මුවසිරස 'deer's head'. Marked 'likely' rather than 'certain' because the numbering is not consistent across sources — Carter counts anura 17th and svāti 15th, Clough counts visākhā 16th, and Carter is internally inconsistent about the 20th/21st (pp. 399, 403, 118). No number has been silently normalised. Sita (Citrā) is the weakest link: it appears in the sources only as Sanskrit චිත්‍තාව, not as an attested Eḷu headword."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "නැකත", "name_roman": "nækata", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The everyday Sinhala word for the asterisms and for astrological time-reckoning generally; it is what the almanac and the nekatiyā (astrologer) work with.", "quote": "නැකත nækata , n. star, තරුව; planet, ග්‍රහතාරකාව; lunar mansion or asterism in the moon's path: see නක්‍ෂත්‍රය.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. නැකත nækata, p. 322", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=star%2C%20%E0%B6%AD%E0%B6%BB%E0%B7%94%E0%B7%80&matchtype=default", "notes": "The Eḷu (Sinhala-phonology) reflex of Sanskrit nakṣatra / Pali nakkhatta, beside the learned tatsama නක්‍ෂත්‍රය nakṣatraya (p. 312). Exactly parallel to Malayalam നക്ഷത്രം ~ vulgar നച്ചത്രം. Clough p. 305: 'Nekata, s. star in general, planet; asterism in the moon's path or lunar mansion, of which twenty eight distinct in name, figure, and number, are enumerated in Sinhalese astronomy.'"}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "நட்சத்திரம்", "name_roman": "naṭcattiram", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "THE COMPACT RECORD OF THE SANSKRITIC LAYER. This one entry carries the canonical Tamil forms of all 27 nakshatras as the Tamil Lexicon prints them, so that the rest of this file can be spent on names that are not Sanskrit.", "quote": "2. (Astron.) Lunar constellation, 27 in number, viz., acuviṉi, paraṇi, kārttikai, urōkiṇi, mirukacīriṭam, tiruvātirai, puṉarpūcam, pūcam, āyiliyam, makam, pūram, uttiram, astam, cittirai, cuvāti, vicākam, aṉuṣam, kēṭṭai, mūlam, pūrāṭam, uttirāṭam, tiruvōṇam, aviṭṭam, cataiyam, pūraṭṭāti, uttiraṭṭāti, irēvati; அசுவனி, பரணி, கார்த்திகை, உரோகிணி, மிருகசீரிடம், திருவாதிரை, புனர்பூசம், பூசம், ஆயிலியம், மகம், பூரம், உத்திரம், அஸ்தம், சித்திரை, சுவாதி, விசாகம், அனுஷம், கேட்டை, மூலம், பூராடம், உத்திராடம், திருவோணம், அவிட்டம், சதையம், பூரட்டாதி, உத்திரட்டாதி, இரேவதி என்னும் இருபத்தேழு நாண்மீன்.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. நட்சத்திரம் sense 2, vol. IV p. 2135", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AE%9F%E0%AF%8D%E0%AE%9A%E0%AE%A4%E0%AF%8D%E0%AE%A4%E0%AE%BF%E0%AE%B0%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Each of these is the corresponding Sanskrit nakshatra name in Tamil phonology, and each maps one-to-one onto an id in the Sanskrit database: acuviṉi = ashvini, paraṇi = bharani, kārttikai = krittika, urōkiṇi = rohini, mirukacīriṭam = mrigashirsha, tiruvātirai = ardra, puṉarpūcam = punarvasu, pūcam = pushya, āyiliyam = ashlesha, makam = magha, pūram = purva-phalguni, uttiram = uttara-phalguni, astam = hasta, cittirai = chitra, cuvāti = svati, vicākam = vishakha, aṉuṣam = anuradha, kēṭṭai = jyeshtha, mūlam = mula, pūrāṭam = purva-ashadha, uttirāṭam = uttara-ashadha, tiruvōṇam = shravana, aviṭṭam = dhanishtha, cataiyam = shatabhishaj, pūraṭṭāti = purva-bhadrapada, uttiraṭṭāti = uttara-bhadrapada, irēvati = revati. The Lexicon's own Tamil paraphrase calls them 'the twenty-seven nāṇmīṉ', i.e. it defines the Sanskrit term with the vernacular one. Individual Tamil entries elsewhere in the Lexicon locate several of them on the modern sky: அத்தம்⁸ attam 'the 13th nakṣatra, the constellation Corvus' (p. 65), அவிட்டம் aviṭṭam 'the 23rd nakṣatra, the constellation Dolphin' (p. 157), உரோகிணி urōkiṇi 'the 4th nakṣatra, Hyades, part of Taurus' (p. 453), திருவோணம் tiruvōṇam 'the 22nd nakṣatra, constellation of Aquila' (p. 1922), உத்தரட்டாதி uttaraṭṭāti 'the 26th nakṣatra, part of the constellations of Pegasus and Andromeda' (p. 407), திருவாதிரை tiruvātirai 'the 6th nakṣatra, part of Orion' (p. 1917), கேட்டை kēṭṭai 'the 18th nakṣatra, part of Scorpio' (p. 1092), அனுஷம் aṉuṣam 'the 17th nakṣatra, part of Scorpio' (p. 197), சித்திரை cittirai 'the 14th nakṣatra, part of Virgo' (p. 1391)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "నక్షత్రము", "name_roman": "nakṣatramu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The almanac word. Brown glosses it back into the vernacular with చుక్క, which is the neatest single demonstration that the two registers are in use side by side.", "quote": "నక్షత్రము [Skt.] n. A star. చుక్క. A constellation. The name of any one of the twenty lunar mansions. అశ్విని మొదలగు నక్షత్రములు. … నక్షత్రేశుడు lit: the lord of the stars, i.e., the moon. చుక్కలరేడు. … నక్షత్రవీధి nakshatra-vīdhi. n. The Milky Way.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. నక్షత్రము nakshatramu, p. 628", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=628", "notes": "'twenty' is a misprint in Brown for twenty-seven. Note that Brown twice supplies a vernacular equivalent for a Sanskrit compound (nakṣatra = cukka; nakṣatreśuḍu = cukkala-rēḍu)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పుబ్బ", "name_roman": "pubba", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The everyday Telugu form of the name, marked [Tel.] by Brown against the tatsama పూర్వఫల్గుని.", "quote": "పుబ్బ [Tel.] n. The name of the eleventh lunar mansion.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పుబ్బ pubba, p. 774", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=774", "notes": "COGNATE PAIR: Kannada has the identical worn form ಪುಬ್ಬೆ pubbe / ಹುಬ್ಬೆ hubbe, which Kittel derives 'Tbh. of ಪೂರ್ವೆ' (p. 1053, 1745). Sanskritic in origin, but the shape is the shared Deccan vernacular one, and Brown flags it [Tel.] for that reason."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ఉడువు", "name_roman": "uḍuvu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Poetic register only.", "quote": "ఉడువు … A lunar mansion, a star. నక్షత్రము. ఉడుపతి or ఉడుపుడు uḍu-pati n: The lord of the stars, i.e., the moon చంద్రుదు. ఊడుగణము uḍu-gaṇamu. n. A constellation. ఉడువీధి. The heavens. ఉడుతతి uḍu-tati. n. The constellations.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ఉడువు uḍuvu, p. 153", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=153", "notes": "Telugu uḍuvu = Sanskrit uḍu with the Telugu nominative suffix."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ನಕ್ಷತ್ರ", "name_roman": "nakṣatra", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ನಕ್ಷತ್ರ nakṣatra, s. A star, planet. 2. a constellation or lunar mansion.", "citation": "Männer, Tuḷu–English Dictionary (1886), s.v. ನಕ್ಷತ್ರ nakṣatra, p. 348", "source_url": "https://archive.org/download/tuluenglishdicti00mnrich/tuluenglishdicti00mnrich_djvu.txt", "notes": "Tulu takes the whole learned apparatus straight from Sanskrit as tatsamas, without the Eḷu-style phonological reshaping Sinhala applies or the tadbhava reduction Malayalam applies: ತಾರ tāra (p. 278), ಉಡು uḍu (p. 67), ಜ್ಯೋತಿ jyoti (p. 255), ಕೃತಿಕೆ kṛtikè 'the Pleiades' (p. 157), ಮೃಗಶಿರ mṛgaśira 'head of Orion' (p. 560), ಸ್ವಾತಿ svāti 'Arcturus' (p. 668), ಶುಕ್ರ śukra 'Venus' (p. 618), ಧ್ರುವನಕ್ಷತ್ರ dhruvanakṣatra 'pole star' (English→Tulu p. 406), and the individual nakṣatra names. Männer's 'Star' entry in the English→Tulu volume (p. 537) heads the list with native ಬೊಳ್ಳಿ boḷḷi and then gives ನಕ್ಷತ್ರ, ತಾರ, ಉಡು."}]}, {"key": "unplaced-figure", "title": "Figures with no secure modern identification", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "the stars", "bayer": null, "constellation": null}, "sanskrit_db_id": null, "names": [{"language": "Sinhala", "region": "Sri Lanka", "name_native": "තරු·වැළ", "name_roman": "taru·væḷa", "literal_meaning": "'string of stars'", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "තරු·වැළ taru·væḷa , n. cluster or string of stars, constellaion.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. තරු·වැළ taru·væḷa, p. 253", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=cluster%20of%20stars&matchtype=default", "notes": "'constellaion' as printed. Beside it Carter has තරු·පොකුර taru·pokura 'cluster of stars, asterism' and the native උළු කැන uḷu kæna, against the Sanskrit තාරකා·පංක්තිය tārakā·paṅktiya (p. 256). Sinhala thus has three native words for 'constellation' where Malayalam has none and must use നക്ഷത്രം."}, {"language": "Hindi", "region": "Upper India (North-Western Provinces and Oudh)", "name_native": null, "name_roman": "(the stars as kine, the moon their shepherd)", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "Not a name but a cosmology, transmitted by women to children, and the closest thing in this material to a systematic non-Sanskritic picture of the night sky.", "quote": "Native women are very fond of telling their children that the stars are kine and the moon their shepherd.", "citation": "W. Crooke, 'Kine as Stars', North Indian Notes and Queries, vol. IV (1894-95), note 279", "source_url": "https://archive.org/details/ninq_v4", "notes": "Crooke repeats it in The Popular Religion and Folk-lore of Northern India (1896), I. 25. No vernacular wording is recorded, so name_roman is descriptive."}, {"language": "Kodava", "region": "Kodagu (Coorg)", "name_native": null, "name_roman": "Gulika (also Mrityu Gulika)", "literal_meaning": null, "register": "folk", "confidence": "unidentified", "usage_note": "Every Coorg house owed it an annual sacrifice — fowls, coconuts and a little brandy at a stone laid at the foot of a tree with milky juice. A second Gulika, Mṛtyu Gulika 'the Gulika of death', was worshipped where deaths in a family were frequent.", "quote": "This is an invisible constellation or star, belonging both to the order of planets and to that of the zodiacal stars. It is, as the people say, a son of S'ani or Saturn. No mortal eye sees it. The astrologer only knows the Gulika and its power, especially over the sick.", "citation": "Rice, Mysore and Coorg: A Gazetteer, vol. III (Bangalore, 1878), 'Gulika', p. 263; also Richter, Gazetteer of Coorg (1870), pp. 165–167", "source_url": "https://archive.org/download/cu31924071131605/cu31924071131605_djvu.txt", "notes": "Unidentified by definition — the sources insist the object is invisible. The name is the Sanskrit astrological Gulika (Māndi), the shadowy 'son of Saturn' of Indian horoscopy, so the word is a loan; what is Coorg-specific is that it received a household blood sacrifice at a stone under a tree. Included as the only Kodava sky-cult recorded in the public-domain gazetteers. Richter's independent testimony that Coorg horoscopy at marriage was 'evidently an innovation' suggests this cult sat outside, and predated, the Brahmanical astrology later grafted on."}, {"language": "Andamanese", "region": "North Andaman (Aka-Cari, Aka-Jeru)", "name_native": null, "name_roman": "Catlo (the larger stars); Katan (the smaller)", "literal_meaning": "a finely marked beetle; the common fire-fly", "register": "tribal", "confidence": "certain", "usage_note": "The sun is the wife of the moon and the stars are their children; the big children are named for a beetle and the little ones for the firefly.", "quote": "their children the stars are Catlo, the larger ones, and Katan the smaller. Catlo is the name of a species of finely marked beetle, and katan is the name of the common fire-fly. Individual stars or constellations are not recognized.", "citation": "Radcliffe-Brown, The Andaman Islanders (1922), ch. IV, p. 141", "source_url": "https://archive.org/download/andamanislanders00radc/andamanislanders00radc_djvu.txt", "notes": "A first-class negative: the North Andamanese sort the stars by brightness into two named kinds of luminous insect and name no individual star at all. Radcliffe-Brown warns at the head of the same chapter that flatly contradictory statements are given by the same informant and both believed — a caution on the chapter as a whole, not on this sentence."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Irukna Mara, Irukmara", "literal_meaning": "the mahua tree", "register": "tribal", "confidence": "unidentified", "usage_note": "Its appearance at 3 a.m. marks the season for collecting mahua flowers (Madhuca longifolia).", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. No modern identification is offered by the authors. A pure work-calendar star: it says when to go out and gather."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Khala", "literal_meaning": "the grain-crushing circle", "register": "tribal", "confidence": "unidentified", "usage_note": "The animal-powered threshing floor, where a bullock walks a circle round a centre post — a bright star at the centre with fainter ones around it.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Placed against the tail of Scorpius in the paper's summary table but described in the village notes as lying next to Tipan; the authors do not resolve this and neither does this entry."}, {"language": "Khasi", "region": "Khasi and Jaintia hills, Meghalaya", "name_native": null, "name_roman": "'lur-mangkara; mangkara", "literal_meaning": null, "register": "tribal", "confidence": "unidentified", "usage_note": null, "quote": "'lur-mangkara, u, n. the brightest star.", "citation": "Nissor Singh, Khasi-English Dictionary (1906), s.v. 'lur-mangkara, p. 120; s.v. Mangkara, p. 127", "source_url": "https://archive.org/download/khasienglishdict00singrich/khasienglishdict00singrich_djvu.txt", "notes": "Entered twice by Nissor Singh but never identified with a particular star. Whether mangkara is connected with Sanskrit makara is not stated in the dictionary and is not assumed here."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "mugrā (sense 2)", "literal_meaning": "a mallet", "register": "tribal", "confidence": "unidentified", "usage_note": null, "quote": null, "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. mugrā, sense 2", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "Grignard's second sense of mugrā 'a mallet' is 'Name of a constellation', followed by a Kurukh name that the Internet Archive scan renders unreadably (printed 'Ahi^ta-binko'); the page number is likewise lost in that stretch of bad OCR, so no quote is given. Flagged rather than dropped, because Mundari names the Pleiades muṅgaru ipilko, 'the mallet stars', and Santali says the Pleiades are the mallet of the yoke — a Kurukh mallet constellation is very likely the same figure, but this could not be verified."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Kaemaiya", "literal_meaning": null, "register": "tribal", "confidence": "unidentified", "usage_note": null, "quote": "Kaemaiya. A constellation so named.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Kaemaiya, p. 289", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Recorded deliberately. Campbell gives no identification and cross-refers only to kaumau 'to make a loud noise'. Nothing in Bodding vol. V or in Hoffmann answers to it. An honest gap rather than a guess."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Sin boṅga reak hopon ko (the sun-god's children)", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": "Cosmological frame rather than a star name: the sun-god is male, his wife is the moon, and the stars are their children.", "quote": "Sin boṅga, is male, his wife being Aindą condo, the moon, the stars being their children. (Muṇḍari sin boṅga.)", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. Sin boṅga, p. 283", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "name_roman here is a descriptive phrase, not a lexical headword; the entry is included because this belief is what licenses the shooting-star-as-excrement idiom in both Santali and Mundari. Bodding adds that the old gurus say the Santals have confused Sin boṅga with God, 'whose name they have forgotten'."}, {"language": "Telugu", "region": "Vizagapatam Agency hills (Konda Dora)", "name_native": null, "name_roman": "Chukkamusti", "literal_meaning": "star-…", "register": "tribal", "confidence": "certain", "usage_note": "The office, not the object: among the hill Konda Doras the Chukkamusti fixes the day and the hour of a wedding.", "quote": "On an auspicious day fixed by the Chukkamusti (star-gazer), the bride is conducted to the home of the bridegroom. … On the same day, or the following morning, at a time settled by the Chukkamusti, the bridegroom, under the direction of a caste elder, ties the sathamanam (marriage badge) on the bride's neck.", "citation": "Thurston, E. (assisted by K. Rangachari), Castes and Tribes of Southern India (Madras: Government Press, 1909), vol. III, article 'Konda Dora', p. 352", "source_url": "https://archive.org/download/castestribesofso03thuriala/castestribesofso03thuriala_djvu.txt", "notes": "name_native is null — Thurston romanises only, and the second element is not securely identifiable (musti 'fist' is the obvious candidate but Thurston does not analyse it), so no Telugu spelling is supplied here. The first element is unmistakably cukka 'star'. This is the clearest tribal-register attestation of the word found: cukka doing astronomical work outside both the Sanskrit almanac and the plains dictionary."}, {"language": "Telugu", "region": "Telugu country (Uppu Yerukala / Korava)", "name_native": null, "name_roman": "Sukka", "literal_meaning": "star", "register": "tribal", "confidence": "likely", "usage_note": "One of the intiperu (house/sept names) given by Uppu Yerukalas; the list also contains Bandi 'cart' and Thoka 'tail'.", "quote": "As examples of intiperu, or exogamous septs, the following, which were given by Uppu Yerukalas, may be cited: — … Dasari, Vaishnavite mendicant. Sukka, star. Kampa, bush of thorns. Avula, cows. Thoka, tail. Kanaga (Pongamia glabra). Bandi, cart.", "citation": "Thurston, E. (assisted by K. Rangachari), Castes and Tribes of Southern India (Madras: Government Press, 1909), vol. III, article 'Korava (Yerukala)', p. 452", "source_url": "https://archive.org/download/castestribesofso03thuriala/castestribesofso03thuriala_djvu.txt", "notes": "name_native null: Thurston romanises only. Sukka is the Yerukala form of Telugu cukka. Confidence 'likely' rather than certain because the sept name may equally reflect the 'dot/mark' sense; Thurston's own gloss is 'star', which is what is recorded. Not a name for any particular object."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Keirt", "literal_meaning": null, "register": "tribal", "confidence": "unidentified", "usage_note": "Feared above all after childbirth; its evil influence is keirtpudrtviti, and the whole seclusion-hut procedure is designed to avert it. Said to be always near the sun, and never in the same part of the sky as the Pleiades.", "quote": "I think it most probable that this mysterious inhabitant of the sky is not a star at all, but a being allied to the Hindu Ketu.", "citation": "Rivers, The Todas (1906), pp. 593-594 (and ch. XIV, pp. 269, 326)", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "Recorded precisely because it resists identification. Rivers could get no one to point it out and no account of where in the sky it stands, and concludes it is probably Ketu under a Badaga name — yet at one funeral its 'appearance' was used as a timing signal, which he admits looks like a real body. Left unidentified."}]}, {"key": "aldebaran", "title": "Aldebaran", "kind": "star", "ra": 68.98, "dec": 16.51, "modern_star": {"common_name": "Aldebaran", "bayer": "α Tauri", "constellation": "Taurus"}, "sanskrit_db_id": "rohini", "names": [{"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "బండిరిక్క", "name_roman": "baṇḍi-rikka", "literal_meaning": "the cart star", "register": "vernacular", "confidence": "certain", "usage_note": "Named from the V of the Hyades, seen as a bullock cart.", "quote": "బండి [Tel.] n. A cart, gig, carriage, coach, waggon, శకటము. … బండిమొగ్గరము banḍi-moggaramu. n. A certain military evolution called శకటవ్యూహము, which is shaped like a cart. బండిరిక్క banḍi-rikka. n. The star called రోహిణి.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. బండి banḍi, p. 864", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=864", "notes": "The single best Telugu-Sanskrit correspondence in this file. The Sanskrit database has the same figure under 'rohini-shakata' (Rohiṇī-śakaṭa / Prājāpatya śakaṭa, 'the Wain of Rohiṇī' = the Hyades V with Aldebaran). Brown's Telugu word for it is baṇḍi, the ordinary Dravidian word for a bullock cart, not a rendering of śakaṭa; his own gloss for the military formation śakaṭa-vyūha on the same line shows he knew the two words were equivalents. Telugu preserved the cart independently."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Medi; Kotela", "literal_meaning": "Kotela: the bat used to beat grain out of the husk", "register": "tribal", "confidence": "disputed", "usage_note": "Medi is described as a bright star at the centre of a ring of fainter ones, likened to the set-up for crushing grain with a bullock (khala). It rises between 9 and 10 pm in the season from Kartik to Maho.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The authors themselves say the constellation association of Medi is unclear, and that Kotela is 'most probably the Pleiades (but it could be Taurus)'. Recorded as disputed rather than forced."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "jarom ipilkiŋ", "literal_meaning": "the two egg stars", "register": "tribal", "confidence": "likely", "usage_note": "The two eggs left in the dove's nest. Hoffmann remarks that there are never more than two eggs in a dove's nest, which is why the dual is right.", "quote": "(8) jarom ipilkiŋ, the two eggs in the dove's nest, two small stars of the fourth magnitude close together, North of Aldebaran, E. S. E. of the Pleiads.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "No Bayer letters given by Hoffmann; none supplied here."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "putam ipil", "literal_meaning": "the dove star", "register": "tribal", "confidence": "certain", "usage_note": "The dove flushed off her nest by the ploughman's mallet, which alighted a little way off to wait until the enemy had gone.", "quote": "(7) putam ipil, the dove started from her nest, Aldebaran, one of the Hyades, the star counted ninth in brightness.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Santali potam is the imperial pigeon (Campbell). Hoffmann uses this entry to correct M.B. Bhaduri's paper in Man in India, which had taken his informant's rohṛa — the name of a beetle that appears for two or three days at the end of May — for Hindi Rohiṇī, i.e. Aldebaran."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "tudrvalmokh (with a companion star)", "literal_meaning": "the young of the tūdrval bird", "register": "tribal", "confidence": "likely", "usage_note": "A bird with young was left by its mother while she went for food; a snake climbed the tree, and the nestlings called to Kudursami, who took them up into the sky. The tūdrval still sings 'Kudursami trrrrrrr'. In another version the bird had offended Swami, who took its young as a punishment.", "quote": "The name of the bird was tūdrval, and so one star is called tudrvalmokh.", "citation": "Rivers, The Todas (1906), p. 595", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "Rivers names a pair; the second name is printed 'Tidiishti' in both Internet Archive scans and could not be resolved, so it is not given here. The Bayer letters are Rivers' own conjecture ('probably γ and ε Tauri'). He considers the story a recent acquisition from Indian folk-tale — worth weighing against the fact that the same bird-and-nestlings figure turns up in Santali, Mundari and Gondi at other stars."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "രോഹിണി", "name_roman": "rōhiṇi", "literal_meaning": "'the red one'", "register": "sanskritic", "confidence": "certain", "usage_note": "Aṣṭamirōhiṇi, the eighth lunar day falling in Rohiṇi in the month Ciṅṅam, is Kṛṣṇa's birthday and a fast day in Kerala.", "quote": "the 4th Nakšatra, with Aldebaran ചിങ്ങമാം മാസ വും അഷ്ടമിരോ. നാള്‍ Bhg. CG. K/?/šṇa's birthday.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. രോഹം rōham, p. 889 (sub-entry രോഹിണി)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=889", "notes": null}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Rohini", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "thunder in Rohiṇī portends a Boterun — seventy-two days without rain; lightning from a clear sky in the same asterism causes Rohini-tap, 'the burning heat of Rohiṇī'", "quote": "Thunder during the Rohini nakshatra is a bad omen : it foreshadows either a famine, or a Boterun, i. e. complete cessation of rains for seventy-two days, after the thunder-claps are heard.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 78", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n80", "notes": "Boterun and Rohini-tap are both vernacular formations built on the asterism name; Rohini-tap is Rohiṇī + ताप 'burning heat'. The archive.org OCR mangles both words (it prints 'seventy-t wo' and 'Rohini-t^azf' where the italic type sits); the readings given here follow the printed page. On the same page Enthoven adds the counterpart for Hasta: 'Thunder or lightning in the Hasta nakshatra foretells good harvests and a prosperous year.'"}, {"language": "Marathi", "region": "Maharashtra", "name_native": "शकट", "name_roman": "śakaṭa", "literal_meaning": "a cart", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "शकट śakaṭa m (S) A cart. 2 The figure of a cart formed by the five stars composing the fourth lunar asterism. 3 fig. A clog, a person or business that hangs on and impedes.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. शकट, p. 779", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B6%E0%A4%95%E0%A4%9F&searchhws=yes&matchtype=exact", "notes": "Marked S, so this is the Sanskrit रोहिणीशकट carried over, not a Marathi invention; but Molesworth's 'five stars' makes it a genuine star-figure statement and it is the only Marathi name I found for the Hyades. Molesworth also carries शकटभेद (p. 779), 'Division of the cart-form asterism called रोहिणी by the moon or a planet passing through it' — the classic Rohiṇī-śakaṭa-bheda omen."}, {"language": "Odia", "region": "Odisha", "name_native": "ରୋହିଣୀ ଶକଟ", "name_roman": "Rohiṇī ṡakaṭa", "literal_meaning": "'Rohiṇī's cart'", "register": "sanskritic", "confidence": "certain", "usage_note": "Given as the Odia or native name of the 4th asterism. The omen attached to it is recorded in the same note: when the moon is seen to pierce the Rohiṇī-cart, calamity is feared.", "quote": "5 ଗୋଟି ତାରା, ଏ 5 ତାରାକୁ ଯୋଗକଲେ ଗୋଟିଏ ସମଦ୍ୱିବାହୁ ତ୍ରିଭୁଜ ବା ଶଗଡ଼ଦଣ୍ଡାର ଆକାର ହେବ। ଓଡ଼ିଆ ବା ଦେଶୀୟ ନାମ—ରୋହିଣୀ ଶକଟ। ପାଶ୍ଚାତ୍ୟ ନାମ—Hyades. … ଚନ୍ଦ୍ର ଯେବେ ରୋହିଣୀ— ଶକଟକୁ ଭେଦ କରିବାର ଦେଖାଯାଏ ତେବେ ଅନିଷ୍ଟ ଆଶଙ୍କା କରାଯାଏ।", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note on the 4th asterism ରୋହିଣୀ, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "The shape word ଶଗଡ଼ଦଣ୍ଡା śagaṛa-daṇḍā (the pole/shaft of a bullock cart) is Odia, and is what makes the Sanskrit śakaṭa figure legible to an Odia reader."}, {"language": "Punjabi", "region": "Punjab", "name_native": "ਰੋਹਣੀ", "name_roman": "rohṉí", "literal_meaning": "'the red one' (Sanskrit rohiṇī)", "register": "sanskritic", "confidence": "certain", "usage_note": "Attached to a Punjabi weather proverb, which is what makes it more than a transliteration: the brighter Rohṇī shows on the eleventh of the dark half of Sāwan, the better the harvest.", "quote": "ROHṈÍ ਰੋਹਣੀ s. m. The fourth lunar mansion, which comprises Aldebaran and four other stars in Taurus:—Sáwaṉ badí ekádsí, joṭhí rohṉí hoe, etá samá parakhye maṉ báṇchhat phal hoi.", "citation": "Bhai Maya Singh, The Panjabi Dictionary (Lahore, 1895), s.v. rohṉí, p. 971", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/singh_query.py?page=971", "notes": "Maya Singh translates: 'Understand that the more the star Rohṇí shows on the eleventh dark half of Sáwaṉ, the more there will be produce to delight your heart.—Prov.' The 'four other stars in Taurus' are the Hyades; cf. Sanskrit database entry rohini-shakata, the Wain of Rohiṇī."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "ruhni", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Not used by Santals as a star at all but as the sowing week: the 13th of Jeṭ and the six days following. Paddy, maize, pumpkins and beans sown in Ruhni are said to come up strong. A cow-dung streak is drawn round the house wall on the first day to keep snakes off, and the ojha begins teaching his disciples.", "quote": "ruhni, n. The 13th day of the month of jeṭ and the following six days, in all seven days ... The ruhni is considered the proper and lucky time for sowing paddy, also Indian corn and pumpkins, beans, etc.", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. ruhni, p. 133", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "Flagged sanskritic because the word is Rohiṇī and Bodding says so, adding the Puranic genealogy from his own reading. What is interesting is the direction of the borrowing: the nakshatra has entered Santali as an agricultural week, not as a star. No Santal informant in Bodding identifies ruhni with Aldebaran."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "சகடம்", "name_roman": "cakaṭam", "literal_meaning": "cart, wagon", "register": "sanskritic", "confidence": "certain", "usage_note": "The V of the Hyades seen as a bullock-cart. Sanskrit śakaṭa in Tamil form, but the figure itself is the shared South Asian one; the Tamil Lexicon lists the asterism sense among the ordinary cart senses without comment.", "quote": "சகடம்¹ cakaṭam , n. < šakaṭa. 1. Cart, wheeled conveyance drawn by cattle, carriage, chariot; வண்டி. … 4. The 4th nakṣatra. See உரோகிணி. (பிங்.) 5. Wheel; சக்கரம்.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. சகடம்¹ sense 4, vol. III p. 1255, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%9A%E0%AE%95%E0%AE%9F%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Corresponds directly to the Sanskrit-database entry rohini-shakata, 'the Wain of Rohiṇī'. HOMONYM: five separate சகடம் headwords — a large drum, a sparrow, a cup, and a carambola tree — of which only சகடம்¹ sense 4 is astronomical. The purely Tamil name for the same asterism is வயமீன் vaya-mīṉ (p. 3496), which the Lexicon derives only tentatively ('prob. வயம்⁵ + மீன்¹') and glosses 'The fourth nakṣatra; உரோகணி'."}]}, {"key": "orions-belt", "title": "Orion's Belt", "kind": "figure", "ra": 84.05, "dec": -1.2, "modern_star": {"common_name": "Orion's Belt (Mintaka, Alnilam, Alnitak)", "bayer": "δ, ε, ζ Orionis", "constellation": "Orion"}, "sanskrit_db_id": "ishus-trikanda", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "तिकांडें", "name_roman": "tikāṇḍēṃ", "literal_meaning": "the three-shafted (thing)", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "तिकांडें tikāṇḍēm n तिकांड्या m The three stars composing the belt of Orion, the arrow of Shiva. See लुब्धक.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. तिकांडें, p. 378", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A4%E0%A4%BF%E0%A4%95%E0%A4%BE%E0%A4%82%E0%A4%A1%E0%A5%87%E0%A4%82&searchhws=yes&matchtype=exact", "notes": "A Marathi (Prakritic ति-, not Sanskrit त्रि-) formation on कांड 'shaft, arrow-joint'. It answers the Vedic इषुस् त्रिकाण्डा, 'the three-jointed arrow', but the phonology is vernacular, so it is not simply the Sanskrit word in Marathi dress."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "त्रिकांड्या", "name_roman": "trikāṇḍyā", "literal_meaning": "having three shafts/arrows", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "त्रिकांड्या trikāṇḍyā a (त्रि & कांड Arrow.) The belt of Orion as composed of three stars forming the three कांड or arrows of Shiva. See under लुब्धक.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. त्रिकांड्या, p. 391", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A4%E0%A5%8D%E0%A4%B0%E0%A4%BF%E0%A4%95%E0%A4%BE%E0%A4%82%E0%A4%A1%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Semi-sanskritised variant of तिकांडें, with the Sanskrit numeral त्रि restored. Molesworth's own etymological bracket makes the composition explicit."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഞേങ്ങോല്‍", "name_roman": "ñēṅṅōl", "literal_meaning": "'plough-shaft' (the beam of a plough)", "register": "folk", "confidence": "disputed", "usage_note": "An agricultural time-marker. Gundert: it rises in the month of Dhanu (mid-December to mid-January) about an hour after sunset, and its rising tells the cultivator when to do ചക്രം ചവിട്ടുക — 'to clear a ricefield of water preparatory to sowing' (Gundert s.v. ചക്രം, p. 340).", "quote": "ഞേങ്ങോല്‍ ñēṅṅō̄l‍ ńēṇṇōl (T. ഞാഞ്ചില്‍ , M. നേ ഞ്ഞില്‍ , Te. നാഗില്‍ , C. നേഗില്‍ , Tu. നായര്‍ ) 1.Plough-shaft ... 3. a constellation മുഴക്കോല്‍ rising in Dhanu an hour aftor sunset & indicating the time for treading the wheel previous to sowing (see ചക്രം ചവിട്ടുക ).", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഞേങ്ങോല്‍ ñēṅṅōl, p. 413 (sense 3)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%9E%E0%B5%87%E0%B4%99%E0%B5%8D%E0%B4%99%E0%B5%8B%E0%B4%B2%E0%B5%8D%E2%80%8D&searchhws=yes&matchtype=exact", "notes": "The single most valuable item here: a Malayalam constellation named from a farm implement, defined by its use rather than by any Sanskrit asterism, and cross-referenced by Gundert to a second implement-name, മുഴക്കോല്‍ 'measuring-rod' (p. 846). A short straight row of stars is what both names describe. Orion's Belt fits the stated datum well — in mid-December it clears the eastern horizon roughly an hour after sunset — but Gundert names no stars and no other source consulted repeats the identification, so it is left disputed. Note also that Gundert's Tulu cognate for the implement is നായര്‍ nāyar, not a star word."}, {"language": "Odia", "region": "Sambalpur (western Odisha)", "name_native": "ନଙ୍ଗଲ ଜୁଡ଼ା", "name_roman": "Naṅgal juṟḍ̠ā", "literal_meaning": "'the yoked plough' — naṅgal is the western-Odia form of laṅgaḻa, a plough", "register": "folk", "confidence": "certain", "usage_note": "THE agricultural entry in this file. Praharaj's note: the Khaṛiās of Sambalpur do not yoke the plough — that is, do not begin the paddy sowing — until this asterism has risen, which is to say not before the month of Baiśākha; and it is for that reason that the cluster is called Naṅgal-juṛā.", "quote": "ନଙ୍ଗଲ ଜୁଡ଼ା— Naṅgal juṟḍ̠ā ପ୍ରାଦେ. (ସମ୍ବଲପୁର) ବି— ତାରାପୁଞ୍ଜବିଶେଷ; ଇଲ୍ୱଳା ନକ୍ଷତ୍ର (କାଳପୁରୁଷର କଟିବନ୍ଧନ)— The belt of Orion (a constellation). [ଦ୍ର—ସମ୍ବଲପୁରର ଖଡ଼ିଆମାନେ ଏ ନକ୍ଷତ୍ରର ଉଦୟ ନ ହେଲେ (ବୈଶାଖ ମାସ ନ ହେଲେ) ଲଙ୍ଗଳ ଯୋଚନ୍ତି ନାହିଁ ଅର୍ଥାତ୍ ଧାନବୁଣାବୁଣି କାମ କରନ୍ତି ନାହିଁ । ଏଣୁ ଏ ନକ୍ଷତ୍ର ପୁଞ୍ଜକୁ 'ନଙ୍ଗଲଜୁଡ଼ା' ବୋଲାଯାଏ ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନଙ୍ଗଲ ଜୁଡ଼ା Naṅgal juṟḍ̠ā, p. 4106", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%99%E0%AD%8D%E0%AC%97%E0%AC%B2&searchhws=no&matchtype=default", "notes": "Register tagged folk rather than tribal: the WORD is marked ପ୍ରାଦେ. (ସମ୍ବଲପୁର), i.e. provincial western Odia, and it is the OBSERVANCE that Praharaj attributes to the Khaṛiā (ଖଡ଼ିଆ) community. Astronomically the note is loose — Orion's Belt is a winter object and is already setting in the evening by Baiśākha (April-May); the practical marker is presumably the belt's heliacal or seasonal disappearance rather than a rising, or the 'rising' is a morning one. I have not emended Praharaj."}, {"language": "Andamanese", "region": "South Andaman (Aka-Bea and neighbouring tribes)", "name_native": null, "name_roman": "bela-", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": "The only star or constellation in the Andamans that Man found to bear a name at all.", "quote": "Of all the stars and constellations Orion's belt alone is found to bear a name (bela-), but this is not to be wondered at, as they never venture upon any distant voyages, and do not therefore experience any necessity for studying the bearing of the various planets and constellations at different seasons", "citation": "Man, On the Aboriginal Inhabitants of the Andaman Islands (1883), § 8, p. 118", "source_url": "https://archive.org/download/b24764413/b24764413_djvu.txt", "notes": "Man's trailing hyphen is his convention for a stem requiring a prefix. His explanation — no long voyages, therefore no need of star bearings — is his own inference and should be read as such; it is at least consistent with Radcliffe-Brown's independent finding forty years later in the North Andaman."}, {"language": "Gondi", "region":
