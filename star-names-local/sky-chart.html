<title>Star Names in the Languages of India — Sky Chart</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1e; --panel: #121a30; --panel-t: rgba(16, 23, 43, 0.88);
    --ink: #e9eef8; --ink-2: #9aa6c0; --ink-3: #5d6a88;
    --line: #232f4d; --grid: #1b2540; --grid-strong: #263454;
    /* validated dark-surface categorical palette: all six checks pass on #0a0f1e */
    --c-star: #c98500; --c-cluster: #3987e5; --c-figure: #d55181; --c-diffuse: #008300;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --indic: "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Kannada",
             "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya",
             "Noto Sans Gurmukhi", "Noto Sans Sinhala", "Noto Nastaliq Urdu", var(--sans);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  #hud {
    position: absolute; top: 14px; left: 16px; z-index: 20;
    max-width: min(470px, calc(100vw - 32px));
    background: var(--panel-t); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  #hud h1 { font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: .02em; text-wrap: balance; }
  #hud .sub { color: var(--ink-2); font-size: 11.5px; margin-top: 3px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; align-items: center; }
  .rowlab { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 3.5px 10px 3.5px 7px; cursor: pointer; font-family: var(--sans);
    transition: border-color 120ms, color 120ms, opacity 120ms;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip:focus-visible, button:focus-visible, select:focus-visible, .marker:focus-visible {
    outline: 2px solid var(--c-cluster); outline-offset: 2px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .dot.sq { border-radius: 2px; transform: rotate(45deg) scale(.92); }
  .chip.off { opacity: .38; }
  .chip.off .dot { background: var(--ink-3) !important; }
  .chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chip.active { border-color: var(--ink-2); color: var(--ink); }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 9px; font-size: 11px; font-family: var(--sans); cursor: pointer;
  }

  #tooltip {
    position: absolute; z-index: 30; pointer-events: none; background: var(--panel-t);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; max-width: 280px;
    opacity: 0; transition: opacity 90ms; box-shadow: 0 6px 22px rgba(0,0,0,.5);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt { font-family: var(--serif); font-size: 14px; }
  #tooltip .tn { color: var(--ink-2); font-size: 11.5px; margin-top: 3px; }
  #tooltip .tx { font-family: var(--indic); font-size: 13px; margin-top: 4px; line-height: 1.5; }

  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 40; width: min(460px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform 200ms ease;
    display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,.5);
  }
  #drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { #drawer, #tooltip { transition: none; } }
  #drawer header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  #drawer header .htitle { font-family: var(--serif); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  #drawer header button { background: none; border: 1px solid var(--line); color: var(--ink-2); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; }
  #drawer header button:hover { color: var(--ink); border-color: var(--ink-3); }
  #drawer .body { overflow-y: auto; padding: 4px 16px 28px; }

  .objhead { padding: 14px 0 6px; }
  .objhead h2 { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .objhead .mod { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
  .objhead .cnt { color: var(--ink-3); font-size: 11.5px; margin-top: 6px; }
  .nm { padding: 12px 0; border-top: 1px solid var(--line); }
  .nm .lang { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .nm .native { font-family: var(--indic); font-size: 21px; line-height: 1.4; margin-top: 2px; }
  .nm .roman { font-style: italic; font-size: 14px; color: var(--ink); margin-top: 1px; }
  .nm .lit { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .nm .use { font-size: 12px; color: var(--ink-2); margin-top: 5px; line-height: 1.55; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .badge { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; border: 1px solid var(--line); color: var(--ink-2); }
  .badge.reg-vernacular { border-color: #3987e5; color: #8fc0f5; }
  .badge.reg-folk { border-color: #c98500; color: #e5b45c; }
  .badge.reg-tribal { border-color: #d55181; color: #eaa0bd; }
  .badge.reg-sanskritic { border-color: var(--line); }
  .badge.conf-disputed { border-style: dashed; }
  .badge.conf-unidentified { border-style: dotted; opacity: .8; }
  .q { font-size: 12px; line-height: 1.6; color: var(--ink-2); border-left: 2px solid var(--line); padding: 4px 0 4px 10px; margin-top: 8px; font-family: var(--indic); }
  .cite { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .cite a { color: var(--c-cluster); text-decoration: none; }
  .cite a:hover { text-decoration: underline; }
  .nq { font-size: 11.5px; color: var(--ink-3); font-style: italic; margin-top: 8px; }
  .notes { font-size: 11px; color: var(--ink-3); line-height: 1.5; margin-top: 6px; }

  .ix-row { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer; padding: 6px 4px; border-radius: 6px;
    font-family: var(--sans); color: var(--ink); }
  .ix-row:hover { background: rgba(255,255,255,.05); }
  .ix-row .im { color: var(--ink-3); font-size: 11.5px; margin-left: auto; }
  .ix-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-top: 16px; }
  .about p { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; margin-top: 10px; }
  .about p b { color: var(--ink); }

  #credits { position: absolute; right: 16px; bottom: 6px; z-index: 10; font-size: 10px;
    color: var(--ink-3); text-align: right; pointer-events: none; line-height: 1.4; }
  .axis-lab { fill: var(--ink-3); font-size: 10.5px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .obj-lab { font-family: var(--sans); font-size: 11px; paint-order: stroke; stroke: var(--bg);
    stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  .marker { cursor: pointer; }

  @media (max-width: 700px) {
    #hud { max-width: calc(100vw - 24px); left: 12px; top: 10px; padding: 9px 10px 7px; }
    #hud .sub, #credits { display: none; }
    #hud h1 { font-size: 15px; }
    .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .row .chip { flex: 0 0 auto; }
  }
</style>

const DB = {"objects": [{"key": "milky-way", "title": "The Milky Way", "kind": "diffuse", "ra": null, "dec": null, "modern_star": {"common_name": "the Milky Way", "bayer": null, "constellation": null}, "sanskrit_db_id": "akashaganga", "names": [{"language": "Bengali", "region": "Bengal", "name_native": "দুধপথ", "name_roman": "dudh-patha", "literal_meaning": "'the milk-road'", "register": "vernacular", "confidence": "certain", "usage_note": "Listed by Dāsa among the Bengali synonyms of ছায়াপথ, and again under হরিতালী (p. 2133). This is the one indigenous eastern name for the galaxy that agrees with the European one, and Dāsa gives it without comment beside আকাশগঙ্গা and যমের জাঙ্গাল.", "quote": "̃পথ [ছায়া (জ্যোতিঃ) পথ (পথ সদৃশ বলিয়া] বি, জ্যোতিশ্চক্রের মধ্যস্হিত পথের ন্যায় দৃশ্যমান অর্দ্ধমণ্ডলাকার নক্ষত্রপুঞ্জ; আকাশগঙ্গা; দুধপথ; যমের জাঙ্গাল।", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. ছায়া chāẏā, sub-lemma ̃পথ, p. 812", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=812", "notes": "Whether দুধপথ is a nineteenth-century calque on 'Milky Way' or older is not settled by this entry; Dāsa gives no etymology and no citation for it. It is absent from Biswas. Treat as possibly a translation."}, {"language": "Bengali", "region": "Bengal", "name_native": "যমজাঙ্গাল", "name_roman": "yama-jāṅgāla", "literal_meaning": "'Yama's jāṅgāl' — a jāṅgāl is a raised earthen causeway or embankment across flooded land", "register": "vernacular", "confidence": "certain", "usage_note": "Sub-lemma ~জাঙ্গাল under the headword যম (Yama, god of death). The image is of the galaxy as the raised road on which the dead travel — the deltaic-Bengal counterpart of the Odia hātidaṇḍā and Assamese hātīpaṭi 'elephant-track' (both in this file).", "quote": "~জাঙ্গাল n. the Milky Way, the Galaxy.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. যম yama (2), sub-lemma ~জাঙ্গাল, p. 890", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%AF%E0%A6%AE&searchhws=yes&matchtype=exact", "notes": "জাঙ্গাল is a Bengali (not Sanskrit) word for an embankment/raised road; the compound is therefore formed in Bengali even though its first member is the Sanskrit theonym. Note the Bengali word for the Milky Way that everyone knows, ছায়াপথ, is a separate sanskritic entry here."}, {"language": "Bengali", "region": "Bengal", "name_native": "যমের জাঙ্গাল (যমজাঙ্গাল)", "name_roman": "yamer jāṅgāl (yama-jāṅgāla)", "literal_meaning": "'Yama's causeway'", "register": "vernacular", "confidence": "certain", "usage_note": "The second, independent attestation of the name — Dāsa lists it among the synonyms of ছায়াপথ (p. 812) and again as a sub-headword under যম (p. 1811), where it is equated with আকাশগঙ্গা, সোমধারা, দেবপথ and ছায়াপথ.", "quote": "̃জাঙ্গাল -বি, আকাশগঙ্গা; নভোমণ্ডলস্হিত সোমধারা; দেবপথ বা ছায়াপথ the milky way.", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. যম yama, sub-lemma ̃জাঙ্গাল, p. 1811", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=1811", "notes": "Three independent Bengali dictionaries carry it: Dāsa here and at p. 812, Biswas's Samsad Bengali-English at p. 890 (যমজাঙ্গাল), and Biswas's Bengali-Bengali Saṃsada Bāṅgālā Abhidhāna, 7th ed. 2004, p. 305, which lists 'আকাশগঙ্গা, যমের জাঙ্গাল, milky way' under ছায়াপথ. The genitive form যমের জাঙ্গাল is the spoken one."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಬಾನ್ದೊಱೆ", "name_roman": "bāndoṟe", "literal_meaning": "the sky-river", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "— ಬಾನ್ದೊಱೆ. - ತೊಱೆ. the celestial Ganges [ಬಾನ್ದೊಱೆಯನೆ ಪೊತ್ತು ಗೌರಿಗೆ ಕವಲ್ದೊಱೆಗೆಯ್ಸಿದಂ Pb. 7, 75]; (Bp. 17, 11).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಬಾನ್ bān 3, p. 1169", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1169", "notes": "The Kannada calque nearest to Sanskrit Ākāśagaṅgā, but made of Dravidian material throughout. Kittel's ಬಾನ್ 3 entry also lists the sky-road synonyms ಮೀನ್ವಟ್ಟೆ and ಅಱಿಲ್ವಟ್ಟೆ, which is why the star-road words are entered separately above."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಬಾಂಗಡಲ್", "name_roman": "bāṅgaḍal", "literal_meaning": "the sky-sea", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "— ಬಾಂಗಡಲ್. -ಕಡಲ್. the sky-sea : the celestial Ganges (Rśv. 10, 82; Śśv. 3, 3).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಬಾಂ- bām-, p. 1166", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1166", "notes": "Third member of the Kannada set bān-kaḍal 'sky-sea' / bān-keṟe 'sky-tank' / bān-toṟe 'sky-river' (the last at Kittel p. 1169, glossed 'the celestial Ganges'). All three are Dravidian compounds on bān 'sky' with a different body of water; Kittel equates the sea and river forms with the celestial Ganges, i.e. with Ākāśagaṅgā."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಬಾಂಗೆಱೆ", "name_roman": "bāṅgeṟe", "literal_meaning": "the sky-tank", "register": "vernacular", "confidence": "likely", "usage_note": "A Dravidian figure for the galaxy: not a river but an irrigation tank, the standing water of the Karnataka countryside.", "quote": "ಬಾಂ- bāṅ. ಬಾಙ್-. = ಬಾನ್ 3, etc. the sky. — ಬಾಂಗಡಲ್. -ಕಡಲ್. the sky-sea : the celestial Ganges (Rśv. 10, 82; Śśv. 3, 3). — ಬಾಂಗೆಱೆ. - ಕೆಱೆ. the sky-tank (Rśv. 12, 12; V. 3, 14).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಬಾಂ- bām-, p. 1166", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1166", "notes": "The best genuinely indigenous Kannada sky-figure found. Both elements are Dravidian (bān 'sky', keṟe 'tank'). Confidence 'likely' rather than certain only because Kittel's ಬಾಂ- entry glosses it literally as 'sky-tank' without saying Milky Way; the equation with the galaxy comes from his ಆಕಾಶಗಂಗೆ entry (p. 146), where bāṅgeṟe is given as the Kannada equivalent. His illustrative citation from the Rājaśekhara-vilāsa makes the sense plain — ಬಾಂಗೆಱೆಯೊಳ್ ಮೀಂಗಳ್ … ಮುೞುಗುವನ್ತೆ ಅಡಂಗಿದುವು, the stars vanished as though fishes were diving in the sky-tank (Kittel s.v. ಅಡಂಗು, p. 32), which turns on mīn meaning both fish and star."}, {"language": "Konkani", "region": "South Kanara / Mangalore", "name_native": null, "name_roman": "molbamārog", "literal_meaning": "the road that is on the sky", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "Galaxy, s. molbamarog, -rga, m. =l. the road (which is) on the sky", "citation": "A. F. X. Maffei, An English-Konkani Dictionary (Mangalore: Basel Mission Press, 1883), s.v. Galaxy, pp. 201-202", "source_url": "https://archive.org/details/anenglishkonkan00bygoog", "notes": "The best indigenous find in the whole Konkani/Gujarati side of this compilation: the Milky Way as a ROAD, with Maffei supplying his own literal gloss ('=l.' is his abbreviation for 'literal, i.e. translation'). Built on molab 'sky, firmament' (Maffei p. 184, s.v. Firmament: 'molab, -lba, n.; antral, -la, n.; akas, -sa, n.') + mārog 'road'. This is exactly what the Marathi dictionaries do NOT have — Molesworth's eight Milky Way names are all Sanskrit rivers of heaven. Maffei prints roman only in the English-Konkani half (the Konkani-English half uses Kannada script), so no Devanagari is supplied here. The Google scan prints Maffei's abbreviation '=l.' (his mark for 'literal, i.e. translation') as '=1.' and drops the running head into the middle of the entry, which runs across a page break; and the same entry adds two further forms — see the sibling entries for dudavat and for Maffei's explicit denial of Akāsagaṅgā."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "අහස් ගඟ", "name_roman": "ahas gan̆ga", "literal_meaning": "'sky-river' (අහස ahasa 'sky' + ගඟ gan̆ga 'river')", "register": "vernacular", "confidence": "certain", "usage_note": "Carter attaches the Kailāsa origin-myth to it; Clough glosses it only 'the celestial river' and does not connect it to the galaxy at all.", "quote": "අහස් ගඟ ahas gan̆ga , n. celestial river, supposed to issue from the foot of mount කෛලාස; the milky-way.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. අහස් ගඟ ahas gan̆ga, p. 84", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=Milky%20Way&matchtype=default", "notes": "Native in form, borrowed in concept: both morphemes are ordinary Sinhala, but Jayatilaka's etymology bracket at අහස්ගඟ (p. 978) reads '[Cf. P. ākāsa-gaṅgā, Sk. ākāśa-gaṅgā]', so it is a morpheme-for-morpheme calque of the Pali/Sanskrit compound — exactly the same compound the Malayalam ആകാശഗംഗ takes over unchanged. Sinhala translated it; Malayalam borrowed it. Carter's synonym list, all loans or hybrids, is අඹුරු නිය am̆buru niya (p. 58), නාග·විථිය nāga·vithiya (p. 319, 'the path of Indra's elephant Airāvata'), බාරුසීගඟ bārusīgan̆ga (p. 446), මන්‍දා·කිනිය man‍dā·kiniya (p. 479), සුර·සිඳුව sura·sin̆duva (p. 692) and ස්වර්නදිය svarnadiya (p. 711)."}, {"language": "Tamil", "region": "Jaffna, Sri Lanka", "name_native": "மணலக்கம்பம்", "name_roman": "maṇalakkampam", "literal_meaning": null, "register": "vernacular", "confidence": "likely", "usage_note": "An opaque Tamil name for the galaxy recorded only from the Yāḻppāṇa Akarāti; the Lexicon itself will not commit to an etymology.", "quote": "மணலக்கம்பம் maṇalakkampam , n. perh. மணல் + lakṣa + பம். The Milky Way; பால்வீதிமண்டலம். (யாழ். அக.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மணலக்கம்பம், vol. V p. 3038, citing the Yāḻppāṇa Akarāti", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AE%A3%E0%AE%B2%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AE%AE%E0%AF%8D%E0%AE%AA%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Lexicon's etymology is prefixed 'perh.' and parses it as maṇal 'sand' + Skt. lakṣa 'lakh' + an unexplained -pam — i.e. something like 'a hundred thousand grains of sand', which would be a fine name for the Milky Way but is expressly a guess. Recorded with the guess flagged as the Lexicon flags it. Confidence 'likely' for the referent (the definition is unambiguous), not for the etymology."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மாசு", "name_roman": "mācu", "literal_meaning": "stain, spot, blemish", "register": "vernacular", "confidence": "certain", "usage_note": "A TAMIL NAME WITH NO SANSKRIT MODEL: the galaxy as a smudge on the sky, not as a celestial river. Every Sanskrit name for the Milky Way is a Ganges-metaphor; this one is not.", "quote": "மாசு¹ mācu , n. … 1. Spot; மறு. … 2. Stain, taint, tarnish; அழுக்கு. … 5. Blackness; கருமை. … 7. Cloud; மேகம். (பிங்.) … 11. The Milky Way; பால்வீதிமண்டலம். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மாசு¹ sense 11, vol. V p. 3147, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AE%BE%E0%AE%9A%E0%AF%81&searchhws=yes&matchtype=exact", "notes": "HOMONYM-HEAVY: eighteen senses on one headword, including ordure, bile, phlegm, afterbirth and a film in the eye. Only sense 11 is astronomical, and it is Winslow's; Winslow's own entry reads 'The galaxy, or milky way, பால்வீதிமண்டலம்' (1862, p. 859, https://dsal.uchicago.edu/cgi-bin/app/winslow_query.py?qs=Milky+Way&matchtype=default). No literary attestation in the astronomical sense was found, but the sense is confirmed by the compound pūrāṭa-mācu below. sanskrit_db_id given as the Milky Way entry akashaganga on referent identity only — the name itself has no Sanskrit counterpart."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "பால்வீதிமண்டலம்", "name_roman": "pāl-vīti-maṇṭalam", "literal_meaning": "the milk-street region", "register": "vernacular", "confidence": "certain", "usage_note": "The standard Tamil astronomical term, and the word by which the Lexicon defines every other Milky Way name. The Lexicon marks it '(Astron.)' and glosses it with the Latin via lactea.", "quote": "பால்வீதிமண்டலம் pāl-vīti-maṇṭalam , n. < id. + வீதி +. (Astron.) Milky Way, via lactea; வானத்தின் ஒருபுறமாக நீளத்தோன்றும் நட்சத்திரத்திரளின் ஒளி. (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. பால்வீதிமண்டலம், vol. V p. 2628, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AA%E0%AE%BE%E0%AE%B2%E0%AF%8D%E0%AE%B5%E0%AF%80%E0%AE%A4%E0%AE%BF%E0%AE%AE%E0%AE%A3%E0%AF%8D%E0%AE%9F%E0%AE%B2%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The elements pāl 'milk' and maṇṭalam are Tamil and Sanskrit respectively, vīti < Skt. vīthī 'street'; the compound as a whole is a Tamil formation. Because the Lexicon glosses it with via lactea and attributes it to Winslow, a European calque cannot be ruled out — but the Tamil definition, 'the light of the mass of stars appearing lengthwise along one side of the sky', is descriptive rather than mythological, unlike the Sanskrit names. No literary attestation found."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "பூராடமாசு", "name_roman": "pūrāṭa-mācu", "literal_meaning": "the Pūrāṭam stain — the smudge at the twentieth asterism", "register": "vernacular", "confidence": "certain", "usage_note": "The galaxy named for the part of the zodiac where it is brightest. Pūrāṭam is Pūrvāṣāḍhā, in Sagittarius — which is where the Milky Way's central bulge lies. The name is an accurate piece of sky-description.", "quote": "பூராடமாசு pūrāṭa-mācu , n. < id. +. Galaxy, the Milky Way; பால்வீதிமண்டலம். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. பூராடமாசு, vol. V p. 2847, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AA%E0%AF%82%E0%AE%B0%E0%AE%BE%E0%AE%9F%E0%AE%AE%E0%AE%BE%E0%AE%9A%E0%AF%81&searchhws=yes&matchtype=exact", "notes": "Winslow's own entry, s.v. பூராடம் (1862, p. 808), reads 'பூராடமாசு, s. The galaxy or milky way, பால்வீதிமண்டலம்; (adopted.)' — his '(adopted)' means the term is taken up rather than native to his colloquial register. That the Milky Way should be named for Pūrvāṣāḍhā rather than for any other asterism is not accidental and is not, as far as this compilation found, paralleled in Sanskrit."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పాలపుంత", "name_roman": "pāla-punta", "literal_meaning": "the milk track", "register": "vernacular", "confidence": "certain", "usage_note": "Also పాలబాట pāla-bāṭa 'the milk road' and పాలవెల్లి pāla-velli.", "quote": "పాలబాట, పాలపుంత pālabāṭa, pālapunta paalabaaTa, paalapunta n. astron. milky way.", "citation": "Gwynn, J. P. L., A Telugu-English Dictionary (Delhi: Oxford University Press, 1991), s.v. పాలబాట, పాలపుంత pālabāṭa, pālapunta, p. 331", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gwynn_query.py?page=331", "notes": "Gwynn 1991 is a copyrighted modern dictionary; the quote is limited to the bare lexical gloss and nothing is taken from his discussion. The name is not in Brown (1903), so on the evidence assembled here the milk-image Telugu names cannot be pushed back into the nineteenth century — that is a dating limit, not a claim that they are recent. Kannada solves the same problem with a different figure entirely: ಬಾಂಗೆಱೆ 'sky-tank'."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ನಕ್ಷತ್ರೊಳಿ ಸಾಲ್", "name_roman": "nakṣatroḷi sāl", "literal_meaning": "'row/line of stars' (ಸಾಲ್ sāl 'row, line', native Dravidian)", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "Galaxy, s. ಆಕಾಶಗಂಗೆ, ನಕ್ಷತ್ರೊಳಿ ಸಾಲ್.", "citation": "Männer, English–Tuḷu Dictionary (1888), s.v. Galaxy, p. 208", "source_url": "https://archive.org/download/tuluenglishengli02mnuoft/page/n215_w1400.jpg", "notes": "A descriptive Tulu phrase set beside the Sanskrit ಆಕಾಶಗಂಗೆ ākāśagaṅge 'sky-Ganges' — the same compound Malayalam and Sinhala both have. Marked 'likely' because a lexicographer's English-to-Tulu equivalent may be his own rendering rather than a current name; Männer gives no citation or usage. Only the second element is Sanskrit."}, {"language": "Urdu", "region": "Urdu, from Persian", "name_native": "کـﮩکشاں", "name_roman": "kahkashāṅ", "literal_meaning": "'the straw-drag' - kāh 'straw' + kashān 'dragging'", "register": "vernacular", "confidence": "certain", "usage_note": "The Persian image: the sky is streaked where someone dragged a bundle of straw across it. Fallon prints the Hindi equivalent akkās gaṅgā on the same line, which is exactly the two-layer situation this file is built to show. The image is shared with Arabic ṭarīqu't-tabn, 'the road of straw'.", "quote": "P کـﮩکشاں kahkashāṅ'; H. akkās gaṅgā; Sant. panjar, ḍahar , n. f. The milky way.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. kahkashāṅ', p. 970", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=970", "notes": "Platts files it under kāh, p. 808: 'kāh-kashān, s.m. The milky-way, galaxy'. Shakespear (1834) has it twice, pp. 1311 and 1408. Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 25, glosses it 'the dragging of a bundle of straw through the sky'. The Santali forms in Fallon's line are not claimed here."}, {"language": "Assamese", "region": "Assam", "name_native": "হাতীপটি", "name_roman": "hātīpaṭi", "literal_meaning": "'elephant-track' — the beaten path elephants make through jungle", "register": "folk", "confidence": "certain", "usage_note": "The primary sense in the dictionary is the literal jungle elephant-track; the galaxy is sense 2. Exactly the same metaphor, with the same primary sense, is the recorded Odia name — ହାତିଦଣ୍ଡା hātidaṇḍā (Praharaj p. 4095, and Sambalpuri ହାଁଥିଧରସା p. 9036). This is the strongest vernacular isogloss in this file.", "quote": "হাতীপটি hātīpaṭi বি. হাৰিৰ মাজৰ হাতীয়ে চলাচল কৰা বাট; a track of elephant in jungle. 2। আকাশত ওলোবা সৰু সৰু তৰাৰ শাৰী; অজৰীথি; the milky way.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. হাতীপটি hātīpaṭi, p. 908", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%B9%E0%A6%BE%E0%A6%A4%E0%A7%80%E0%A6%AA%E0%A6%9F%E0%A6%BF&searchhws=yes&matchtype=exact", "notes": "'হাৰিৰ' and 'অজৰীথি' in the DSAL text are OCR for হাবিৰ (jungle) and অজবীথি; the entry cross-refers to the অজবীথি lemma at p. 10, which is glossed 'হাতীপটি; ছায়াপথ; milky-way'."}, {"language": "Chhattisgarhi", "region": "Chhattisgarh (Dhuri caste, rice-parchers)", "name_native": null, "name_roman": "Gajvīthi (named elsewhere in the same work)", "literal_meaning": "the track of the elephant", "register": "folk", "confidence": "certain", "usage_note": "The path by which the elephant of the heavens passes from south to north to feed on young bamboo shoots, of which he is very fond.", "quote": "the milky way is the path by which the elephant of the heavens passes from south to north to feed on the young bamboo shoots, of which he is very fond", "citation": "Russell & Hiralal, The Tribes and Castes of the Central Provinces of India (1916), vol. II, article 'Dhuri', p. 529", "source_url": "https://archive.org/download/in.ernet.dli.2015.175422/2015.175422.The-Tribes-And-Castes-Of-The-Central-Provinces-Of-India-Vol-ii_djvu.txt", "notes": "Russell gives the name Gajvīthi, 'the track of the elephant', at vol. II p. 124 under Bania, and the Dhuri belief at p. 529 without a name; the two are joined here and the join is flagged. Gajavīthi is Sanskrit, so this is a sanskritic name carried in folk belief — but the elephant is doing exactly the job the Munda cattle and the Gond wild animals do."}, {"language": "Hindi", "region": "Punjab and northern India (contributed to a Panjab journal)", "name_native": null, "name_roman": "Bhagwān kī Kachahrī", "literal_meaning": "'God's court-house'", "register": "folk", "confidence": "certain", "usage_note": "The colonial district court transposed to the sky - kachahrī is the ordinary word for a magistrate's court. Crooke picked this name up from the same source and reprinted it.", "quote": "Hindi : Akás Gangá ... Bhagwán kí Kachahrí, God's Court.", "citation": "L. Whyte King, 'Names for the Milky Way', Panjab Notes and Queries, vol. II (Dec. 1884), note 308", "source_url": "https://archive.org/details/pnq_v2", "notes": "Quoted as printed apart from OCR noise in the diacritics. Repeated by Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 25: 'The Hindu calls it Akash Ganga or the heavenly Ganges, Bhagwan ki kachahri or the Court of God, Swarga-duari or the door of Paradise.' Cited by note number, the standard locator for this journal."}, {"language": "Hindi", "region": "northern India", "name_native": null, "name_roman": "Sufed Bādhī", "literal_meaning": "'the white garland'", "register": "folk", "confidence": "likely", "usage_note": "Printed in the original note as 'Supesh Bidhi, the way of fate' and corrected by the contributor himself in a later note - a good example of why the correction slip matters.", "quote": "In notes 306 and 308, Vol. II, are some important misprints which are hereby corrected. ... 'Akás Gangá, the bed of the Ganges,' should be Akás Gangá, the Heavenly Ganges. 'Supesh Bidhi, the way of fate,' should be Sufed Badhi, the white garland.", "citation": "L. Whyte King, 'Names for heavenly objects', Panjab Notes and Queries, vol. II (Feb. 1885), note 523, p. 84 (correcting note 308)", "source_url": "https://archive.org/details/pnq_v2", "notes": "confidence likely: the corrected form is attested only in this correction slip and its exact Hindi shape (bādhī? bāṛhī?) cannot be checked against a script form."}, {"language": "Hindi", "region": "northern India", "name_native": null, "name_roman": "Surg Dwārī", "literal_meaning": "'the gate of heaven'", "register": "folk", "confidence": "certain", "usage_note": "svarga 'heaven' + dvārī 'gateway', in vernacular shape. Crooke gives the same as Swarga-duari, 'the door of Paradise'.", "quote": "Surg Dwárí, the Gate of Heaven: Hindi.", "citation": "R. C. Temple, 'Name for the Milky Way', Panjab Notes and Queries, vol. II (Mar. 1885), note 610, p. 102", "source_url": "https://archive.org/details/pnq_v2", "notes": "Corroborated by Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 25-26."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "هتهيا کي راه", "name_roman": "hathiyā kī rāh", "literal_meaning": "'the road of Hathiyā (the Hasta asterism)'", "register": "folk", "confidence": "certain", "usage_note": "The same 'road' image, but named for hathiyā, the thirteenth lunar mansion - the hand-shaped asterism in Corvus which in the Hindi belt is above all the season of the closing rains. A sky-road named after a calendar station, not after a bright star.", "quote": "هتهيا hath-iyā हस्त s. m. 1. The 13th mansion of the moon, Corvus. 2. The breaking up of the rains. هتهيا کي راه hathiyā kī rāh, The milky way.", "citation": "John Shakespear, A Dictionary, Hindustani and English, 3rd ed. (London, 1834), s.v. hath-iyā, p. 1851", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/shakespear_query.py?page=1851", "notes": "Shakespear prints the Urdu script for both headword and compound; Platts, p. 1219, has it in roman under हथिया / هتهيا. Still recorded by McGregor, Oxford Hindi-English Dictionary (1993), p. 1057, s.v. हथिया."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": null, "name_roman": "hāthī kī rāh", "literal_meaning": "'the elephant's road'", "register": "folk", "confidence": "certain", "usage_note": "A folk name that answers to the Sanskrit Gajavīthī, 'the elephant's course' - Platts records gaj-vīthī for the Milky Way as well (p. 898) - but here it is built from the ordinary Hindi word hāthī, not from Sanskrit gaja.", "quote": "hāthī-kī rāh, s.f. The galaxy or milky way (syn. ākāś-gaṅgā)", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. hāthī, p. 1215", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=1215", "notes": "Headword printed by Platts as हाथी / هاتهي; the compound in roman only. Fallon, p. 1193, s.v. hāth'ī: 'hāthī kī rāh, akkās Gaṅgā, n. f. The milky way.'"}, {"language": "Konkani", "region": "South Kanara / Mangalore", "name_native": null, "name_roman": "dudavat", "literal_meaning": "milk-road (conjectural: dudh 'milk' + vāṭ 'way')", "register": "folk", "confidence": "likely", "usage_note": "marked (H. K.) — Maffei's abbreviation for a word used especially by Hindu Konkans, as against the Christian Konkani of Mangalore", "quote": "dudavat, -te, f. (H. K.)", "citation": "A. F. X. Maffei, An English-Konkani Dictionary (Mangalore: Basel Mission Press, 1883), s.v. Galaxy, p. 202", "source_url": "https://archive.org/details/anenglishkonkan00bygoog", "notes": "A second, community-specific Konkani name for the Milky Way, given in the same entry as molbamārog. Maffei supplies no gloss; the reading 'milk-road' is my conjecture from dudh + vāṭ and is flagged as such — it would be an independent calque on the same idea as Latin via lactea rather than a borrowing from it. Confidence 'likely' covers both the OCR of the form (the scan renders the H.K. mark as '{B. K.}') and the etymology; the identification of the object is explicit and certain. The Konkani-English half of the volume carries what appears to be the same word under a Kannada-script headword glossed 'Galaxy, milky way', marked n.u. = not used."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Kavadgantak", "literal_meaning": null, "register": "folk", "confidence": "likely", "usage_note": null, "quote": "The Milky Way is known as the Akashganga, Vastupurush, and Kavadgantak.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 72", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n74", "notes": "SPELLING CONFLICT within the source: the body text on p. 72 prints Kavadgantak; the book's own index (p. 361) prints Kavadghantak. Both forms are Enthoven's. The first element is very likely कावड kāvaḍ, the shoulder-yoke with a water-pot hung at each end — which would make the Milky Way a carrying-pole across the sky, a figure that would be independent of the Gaṅgā tradition — but Enthoven gives no gloss and I have not found the word in a dictionary, so the etymology is my conjecture and is flagged as such. Confidence 'likely' refers to the name's form, not to the identification of the object, which is explicit."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Vastupurush", "literal_meaning": "the Vāstu-puruṣa, the cosmic man of the building site", "register": "folk", "confidence": "certain", "usage_note": null, "quote": "The Milky Way is known as the Akashganga, Vastupurush, and Kavadgantak.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 72", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n74", "notes": "This corrects what the Marathi dictionaries alone would suggest. Molesworth, Vaze, Tulpule and Date give ONLY Sanskrit river-of-heaven compounds for the Milky Way; Enthoven's ethnography turns up two names that are not rivers at all. Vastupurush is the recumbent cosmic man pegged out under a building plot in Indian architectural ritual — the galaxy read as that figure stretched across the sky."}, {"language": "Odia", "region": "Odisha", "name_native": "ହାତିଦଣ୍ଡା", "name_roman": "Hātidaṇḍā", "literal_meaning": "'the elephant-road' — the trampled lane elephants drive through jungle", "register": "folk", "confidence": "certain", "usage_note": "Given by Praharaj as THE Odia name of the galaxy, in square brackets after the Sanskrit, Latin and Greek names, at the end of his article on the Chāyāpatha. The literal sense is described in detail under the headword ହାତି (p. 9088): these lanes run for hundreds of kos, about twenty feet wide and twenty feet high, so cleanly stripped that they look swept.", "quote": "ସଂ. ନାମ—ସୋମଧାରା, ଦେବପଥ, ନଭଃସରିତ୍, ଆକାଶ ଗଙ୍ଗା, ହରିତାଳୀ। ଇଂ. ନାମ—The milky way; galaxy. ଲାଟିନ୍—Via Lactea. ଗ୍ରୀକ୍—Galaxis. [ଓଡ଼ିଆନାମ—ହାତିଦଣ୍ଡା ]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note item 63 ଛାୟା ପଥ, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "The exact counterpart of Assamese হাতীপটি hātīpaṭi (this file). Two dictionaries compiled independently in Cuttack and Gauhati record the same jungle metaphor for the galaxy in two languages — good evidence that it is a genuine eastern-Indian folk name and not a lexicographer's invention."}, {"language": "Odia", "region": "Sambalpur (western Odisha)", "name_native": "ହାଁଥିଧରସା (ହାଥି ଧର୍ସା)", "name_roman": "Hāñthi dharasā (Hāti dhar-sā)", "literal_meaning": "'elephant-track'", "register": "folk", "confidence": "certain", "usage_note": "The Sambalpuri form of the same name, entered twice with the same two senses in the same order — jungle elephant-track, then the galaxy.", "quote": "ହାଁଥିଧରସା— Hāñthi dharasā ପ୍ରାଦେ (ସମ୍ବଲପୁର) ବି— 1। ହାତୀଦଣ୍ଡା; ଜଙ୍ଗଲରେ ହାତୀମାନଙ୍କ ପଥ—1. Elephant-track in jungles. 2। ଛୟାପଥ—2. The milky way.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ହାଁଥିଧରସା Hāñthi dharasā, p. 9036", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%B9%E0%AC%BE%E0%AC%81%E0%AC%A5%E0%AC%BF%E0%AC%A7%E0%AC%B0%E0%AC%B8%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "Duplicated at p. 9096 as ହାଥି ଧର୍ସା Hāti dhar-sā, same marking, same two senses. 'ଛୟାପଥ' at p. 9036 is a misprint for ଛାୟାପଥ."}, {"language": "Punjabi", "region": "Multan and Dera Ghazi Khan (Multani/Saraiki, western Punjab)", "name_native": null, "name_roman": "Berā dā Ghās", "literal_meaning": "'the boat's track/fodder' - glossed by the contributor as 'The Path of (Noah's) Boat'", "register": "folk", "confidence": "likely", "usage_note": "A Muslim-inflected version of the straw image: the Ark is dragged across the sky and leaves a wake. beṛā is the ordinary Punjabi word for a raft or boat; ghās, 'grass/fodder', keeps the Persian straw connection alive under a Qur'anic story.", "quote": "In Multání or Derawál the Milky Way is called Berá dá Ghas, The Path of (Noah's) Boat.", "citation": "A. Jukes, 'Name for the Milky Way', Panjab Notes and Queries, vol. II (Aug. 1885), note 1027, p. 194", "source_url": "https://archive.org/details/pnq_v2", "notes": "confidence likely because the literal analysis of ghās here is the compiler's; the contributor gives only the free translation. Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 26, repeats it as Panjabi: 'to the Panjabi it is known as Bera da ghas or the path of Noah's Ark'."}, {"language": "Andamanese", "region": "South Andaman (Aka-Bea and neighbouring tribes)", "name_native": null, "name_roman": "ig-yádowa-", "literal_meaning": null, "register": "tribal", "confidence": "likely", "usage_note": "Poetically described as the road used by the mòrowin-, the spirits Man renders 'angels'.", "quote": "Their astronomical observations have, however, extended to the discovery of the milky way, which they call ig-yádowa-, and poetically describe as the road used by the angels (mòrowin-).", "citation": "Man, On the Aboriginal Inhabitants of the Andaman Islands (1883), § 8, p. 118", "source_url": "https://archive.org/download/b24764413/b24764413_djvu.txt", "notes": "The two Internet Archive scans of Man's paper print the name as 'ig-ydiowa-' and 'ig-gdlovrt-'; ig-yádowa- is the best reconstruction from them and the reading is unresolved pending a clean copy. The gloss 'road of the spirits' is secure and matches the road-reading of the galaxy found right across the Munda, Kurukh and Gond areas."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Sagur, Sagarpath, Dhor Sari, Murana Sagur, Pandhan, Hari, Sadak, Marg, Rasta", "literal_meaning": "the road; the path of the animals", "register": "tribal", "confidence": "certain", "usage_note": "Understood as the great path of animal migration.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Several of these words are Marathi or Hindi for 'road' (rasta, sadak, marg), which the authors note; Dhor Sari and Murana Sagur carry the animal-path sense. Same reading as Mundari gaiko hora and Kurukh gāy-chour bīnkō."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "gāy-chour bīnkō", "literal_meaning": "the cattle-track constellation", "register": "tribal", "confidence": "certain", "usage_note": "chour is the broad way for the cattle, from the skirts of the village up to the main road.", "quote": "chour S. The broad way for the cattle, from the skirts of the village up to the main road. Gāy-chour, the milky way.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. gāy, p. 256; s.v. chour, p. 166", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": null}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "gaiko hora, gaiko hor, gaikoiḍ, caṭar", "literal_meaning": "the cattle road", "register": "tribal", "confidence": "certain", "usage_note": "The village cattle-road along which the herd is driven out a little before dawn and led back at night. Siṅgboṅga's cattle are driven along it by Lugu, his cowherd.", "quote": "gaiko hor, gaiko hora sbst., the milky way : gaiko horare kub hupuri hupuri ipilko menakoa, in the milky way there are a great number of small stars.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. V, s.v. gaiko hor / gaiko hora, col. 1356; the account at vol. VII s.v. ipil, col. 1923", "source_url": "https://archive.org/download/in.ernet.dli.2015.14925/2015.14925.Encyclopedia-Mundarica-Vol-v-1932_djvu.txt", "notes": "caṭar is the Sadani word for the village main road, haṭia the Mundari. Kurukh has the same image (gāy-chour bīnkō, the cattle-track) and Gondi likewise (Dhor Sari, the path of the animals) — a shared central-Indian reading of the galaxy that owes nothing to Ākāśagangā."}, {"language": "Nicobarese", "region": "Central Nicobars (Nancowry group)", "name_native": null, "name_roman": "dāk-oal-kalahoiya; oal-kalahoiya", "literal_meaning": "river in the sky", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "dāk-oal-kalahoiya, Milky way (lit. river in the sky).", "citation": "Man, A Dictionary of the Central Nicobarese Language (1889), s.v. kalahoiya, p. 155; s.v. oal-kalahoiya, p. 125", "source_url": "https://archive.org/download/adictionarycent00mangoog/adictionarycent00mangoog_djvu.txt", "notes": "kalahoiya is 'sky, heaven' in the same entry, which also gives keam-kalahoiya and chang-kalahoiya for the horizon. The Nicobarese are the one seafaring community here, and they alone read the galaxy as water rather than as a road — the same image as Sanskrit Ākāśagangā, arrived at independently."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Hat dahar", "literal_meaning": "the market road", "register": "tribal", "confidence": "certain", "usage_note": "The Milky Way as the road people walk to the weekly hāṭ.", "quote": "Hat dahar. Panjar dahar. The Milky-way.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Hat dahar / Panjar dahar, p. 223", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "hāṭ is the periodic village market, dahar the road. A road-of-traffic image, like the Mundari 'cattle road' and the Gondi 'path of the animals', and quite unlike Sanskrit Ākāśagangā, a river."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Panjar dahar", "literal_meaning": "the rib road", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Panjar dahar. The Milky-way.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Panjar dahar, p. 473 (also given s.v. Hat dahar, p. 223)", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Given twice by Campbell, under Hat dahar and under Panjar 'a rib, the part of the body in which the ribs are'. The literal reading 'rib road' follows that headword, but Campbell does not gloss the compound."}, {"language": "Bengali", "region": "Bengal", "name_native": "অজবীথি", "name_roman": "ajabīthi", "literal_meaning": "'the goat-road'", "register": "sanskritic", "confidence": "disputed", "usage_note": "Marked '(rare)'. This is a semantic shift, not an inheritance: in the Sanskrit sources Ajavīthī is one of the nine vīthīs, a three-nakṣatra segment of the ecliptic belt (see sanskrit_db_id ajavithi), never the galaxy. Both Biswas for Bengali and the Chandrakanta Abhidhana for Assamese gloss it 'Milky Way', so the shift is shared across the eastern lexicographic tradition.", "quote": "অজবীথি ajabīthi n. (rare) a chariot for gods; the Milky Way, the Galaxy.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. অজবীথি ajabīthi, p. 12", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%85%E0%A6%9C%E0%A6%AC%E0%A7%80%E0%A6%A5%E0%A6%BF&searchhws=yes&matchtype=exact", "notes": "Flagged disputed because the identification is the lexicographers', and it contradicts the Sanskrit astronomical meaning of the word. The Assamese entry (Chandrakanta p. 10) keeps BOTH readings side by side: it glosses ajabīthi as হাতীপটি / ছায়াপথ 'milky way' and then, in the Assamese definition, correctly describes it as one of the three roads of the sun, moon and planets containing Mūlā, Pūrvāṣāḍhā and Uttarāṣāḍhā."}, {"language": "Bengali", "region": "Bengal", "name_native": "ছায়াপথ", "name_roman": "chāyā-patha", "literal_meaning": "'the shadow-path'", "register": "sanskritic", "confidence": "certain", "usage_note": "The ordinary modern Bengali word for the galaxy, and the one used in Bengali popular science.", "quote": "~পথ n. galaxy, the Milky Way.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. ছায়া chāẏā, sub-lemma ~পথ, p. 379", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?page=379", "notes": null}, {"language": "Bengali", "region": "Bengal", "name_native": "হরিতালী, হরিতালিকা", "name_roman": "haritālī, haritālikā", "literal_meaning": "uncertain; the word's other senses are the bright-fourth of Bhādra and dūrvā grass", "register": "sanskritic", "confidence": "likely", "usage_note": "Defined by its orientation: 'a white line running north-and-south across the path of the sky'. Praharaj's Odia entries for the same word (pp. 8972-8973) define it the same way and with the same orientation clause, and list it among the Sanskrit names of the Chāyāpatha at p. 4095.", "quote": "হ̑রিতালী, হ̑রিতালিকা haritālī, haritālikā [সং] বি, আকাশমার্গে উত্তরদক্ষিণব্যাপী শ্বেত রেখা; ছায়াপথ; আকাশগঙ্গা; দুধপথ the milky-way.", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. হরিতালী, হরিতালিকা haritālī, haritālikā, p. 2133", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=2133", "notes": "A real cross-language link: Bengali and Odia lexicography independently carry Haritālī as a Milky Way word with an orientation clause, and neither cites a Sanskrit source. Both mark it সং./ସଂ. I have found it in no Sanskrit lexicon, so sanskrit_db_id is null and confidence is likely, not certain. Dāsa's ̑ marks are his own vowel-length diacritics, reproduced as DSAL prints them."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "आकास / آکاس", "name_roman": "ākāś-gaṅgā (akkās gaṅgā)", "literal_meaning": "'the sky-Ganges'", "register": "sanskritic", "confidence": "certain", "usage_note": "The Sanskrit name carried into Hindi with a vernacular first member (akkās for ākāśa). Recorded here because every other Milky Way name in this file is explicitly glossed against it - it is the reference point the folk names are measured from.", "quote": "ākāś-gangā, s.f. The milky way (syn. kahkashāṅ)", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. ākās, p. 64", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=64", "notes": "Compound printed in roman under the headword आकास / آکاس. Links to the Sanskrit database entry akashaganga."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಆಕಾಶಗಂಗೆ", "name_roman": "ākāśagaṅge", "literal_meaning": "the sky-Ganges", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಆಕಾಶಗಂಗೆ ākāśa-gaṅge. the celestial Ganges, the milky way (ಬಾಂಗೆಱೆ G.; My.). 2, a cascade (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಆಕಾಶಗಂಗೆ ākāśagaṅge, p. 146", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=146", "notes": "The entry is worth having chiefly for its parenthesis: Kittel gives the Kannada equivalent ಬಾಂಗೆಱೆ from the nighaṇṭu he abbreviates G., which is how the vernacular name is reached. Same db id as Sanskrit Ākāśagaṅgā."}, {"language": "Konkani", "region": "South Kanara / Mangalore", "name_native": null, "name_roman": "Akāsagaṅgā", "literal_meaning": "the sky-Ganges", "register": "sanskritic", "confidence": "certain", "usage_note": "Maffei marks it Mr. Cn. — Marathi and Canarese — and says it is not used in Konkani", "quote": "Mr. Cn., but not used in Konk.", "citation": "A. F. X. Maffei, An English-Konkani Dictionary (Mangalore: Basel Mission Press, 1883), s.v. Galaxy, p. 202", "source_url": "https://archive.org/details/anenglishkonkan00bygoog", "notes": "A NEGATIVE attestation, and the reason it is worth an entry: Maffei lists the pan-Indian Sanskrit name Ākāśagaṅgā only to rule it out of Konkani, tagging it as Marathi and Canarese. Konkani, on his evidence, calls the Milky Way a road and not a river — the opposite of the Marathi position. The form of the headword itself is badly OCR'd in the Google scan, which prints it as 'Eikagag&tiga' and the following words as 'bui nol used in Konk.'; the roman spelling of the headword given here is the standard one and not a transcription, and the quote gives the printed reading of Maffei's note. Marathi's Ākāśagaṅgā is db id 'akashaganga'."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "സുരവാഹിനി", "name_roman": "suravāhini", "literal_meaning": "'the river of the gods'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "സുരവാഹിനി the milky way AR.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. സുര sura, p. 1060", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=1060", "notes": "Cited from Adhyātma Rāmāyaṇam (Malayalam). Not among the Milky Way synonyms collected in the Sanskrit database, which has Suradīrghikā and Svarnadī but not Suravāhinī — a Kerala-side addition to the Sanskrit synonym list."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ആകാശഗംഗ", "name_roman": "ākāśagaṅga", "literal_meaning": "'the sky-Ganges'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ആകാശഗംഗ milky way Bhg 5.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ആകാശം ākāśam, p. 70", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%86%E0%B4%95%E0%B4%BE%E0%B4%B6%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "Cited from the Malayalam Bhāgavata. Gundert repeats it s.v. ഗം gam, p. 328: 'Also ആകാശ ഗംഗ the milky way.'"}, {"language": "Marathi", "region": "Maharashtra", "name_native": "मंदाकिनी", "name_roman": "mandākinī", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "मंदाकिनी mandākinī f S मंदाकिनीओघ m (Poetry) The current or stream of the celestial Ganges. The Galaxy or milky way. Ex. नीळ गगनावरी सुंदर मंदाकिनीवोघ दिसे शुभ्र.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. मंदाकिनी, p. 629", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A4%82%E0%A4%A6%E0%A4%BE%E0%A4%95%E0%A4%BF%E0%A4%A8%E0%A5%80&searchhws=yes&matchtype=exact", "notes": "Molesworth's example line — 'on the blue sky the beautiful stream of the Mandākinī shows white' — is from Marathi poetry, marking this as the literary register."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "आकाशगंगा", "name_roman": "ākāśagaṅgā", "literal_meaning": "the sky-Ganges", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "आकाशगंगा ākāśagaṅgā f (S) आकाशनदी f (S) The Ganges or river of the sky, the galaxy or milky way.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. आकाशगंगा, p. 61", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%86%E0%A4%95%E0%A4%BE%E0%A4%B6%E0%A4%97%E0%A4%82%E0%A4%97%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Every Milky Way name in Molesworth is a Sanskrit river-of-heaven compound — आकाशगंगा, आकाशनदी, देवनदी, मंदाकिनी, वियद्गंगा, सुरनदी, स्वर्गंगा, स्वर्नदी — and all are marked S. Not one folk name (no road, no path, no scattered grain) appears in any of the four Marathi dictionaries. This is a clean negative result."}, {"language": "Odia", "region": "Odisha", "name_native": "ହରିତାଳୀ (ହରିତାଳିକା)", "name_roman": "Haritāḻī (Haritāḻikā)", "literal_meaning": "uncertain; the word's other senses are the Bhādra festival day and the sharp edge of a sword", "register": "sanskritic", "confidence": "likely", "usage_note": "Notable for its orientation clause, which none of the other Milky Way words in this file carry: the galaxy AS IT RUNS FROM SOUTH TO NORTH ACROSS THE SKY. Praharaj lists Haritāḻī among the Sanskrit names of the Chāyāpatha at p. 4095.", "quote": "The milky way in the sky extending north to south. 3। ଭାଦ୍ର ଶୁକ୍ଳ ଚତୁର୍ଥୀ (ମତାନ୍ତରରେ ଶୁକ୍ଳତୃତୀୟା)—3. The 4th day of the bright fortnight of Bhādra (or, according to some, the 3rd day.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ହରିତାଳୀ Haritāḻī, p. 8973", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%B9%E0%AC%B0%E0%AC%BF%E0%AC%A4%E0%AC%BE%E0%AC%B3%E0%AD%80&searchhws=yes&matchtype=exact", "notes": "Praharaj's three entries disagree with each other on direction: ହରିତାଳିକା p. 8972 and ହରିତାଲିକା p. 8973 both say 'extending from the south to the north', ହରିତାଳୀ p. 8973 says 'north to south'. Same thing, said twice, carelessly. I have not found the word as a Milky Way name in any Sanskrit lexicon, so the 'ସଂ. ନାମ' label at p. 4095 should be treated with reserve — hence sanskrit_db_id null."}, {"language": "Tamil", "region": "Jaffna, Sri Lanka", "name_native": "நாகவீதி", "name_roman": "nāka-vīti", "literal_meaning": "serpent-street", "register": "sanskritic", "confidence": "disputed", "usage_note": "A SEMANTIC DIVERGENCE worth recording. The word is Sanskrit Nāgavīthī, but in Tamil lexicography it denotes the Milky Way, whereas in the Sanskrit tradition Nāgavīthī is one of the nine star-roads (vīthī) of the ecliptic belt, not the galaxy at all.", "quote": "நாகவீதி nāka-vīti , n. < nāka + vīthī. Milky Way; பால்வீதிமண்டலம். (யாழ். அக.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. நாகவீதி, vol. IV p. 2200, citing the Yāḻppāṇa Akarāti", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AE%BE%E0%AE%95%E0%AE%B5%E0%AF%80%E0%AE%A4%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "Marked disputed because the Tamil gloss contradicts the Sanskrit database entry 'nagavithi' (the Serpent-road, northernmost of the nine star-roads, a segment of the ecliptic belt). Either the Yāḻppāṇa Akarāti has confused vīthī 'road' with the pāl-vīti 'milk-street' of the galaxy, or a genuine Tamil re-application has occurred. The Lexicon's நட்சத்திரவீதி naṭcattira-vīti (p. 2135) shows the same slide, glossing it both '1. Moon's path in the zodiac' and '2. The Milky Way'. A caution for anyone joining the two databases on this id."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "ஆகாசகங்கை", "name_roman": "ākāca-kaṅkai", "literal_meaning": "sky-Ganges", "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit Ākāśagaṅgā in Tamil phonology; the whole Ganges-in-the-sky family enters Tamil intact.", "quote": "*ஆகாசகங்கை ākāca-kaṅkai , n. < id. +. 1. The celestial Ganges; மந்தாகினி. 2. The Milky Way; பால்வீதிமண்டலம்.", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஆகாசகங்கை, vol. I p. 205", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%86%E0%AE%95%E0%AE%BE%E0%AE%9A%E0%AE%95%E0%AE%99%E0%AF%8D%E0%AE%95%E0%AF%88&searchhws=yes&matchtype=exact", "notes": "Its Tamil companions in the same family are மந்தாகினி mantākiṉi (p. 3066, = Skt. Mandākinī, Sanskrit-database id mandakini), விண்டுநதி viṇṭu-nati 'Viṣṇu's river' (p. 3664, from the Yāḻppāṇa Akarāti), அமராபகை amarāpakai (Supplement p. S051, quoted from the Cintāmaṇi commentary) and சித்தகங்கை citta-kaṅkai 'the Siddhas' Ganges' (Supplement p. S274)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "నక్షత్రవీధి", "name_roman": "nakṣatra-vīdhi", "literal_meaning": "the street of the asterisms", "register": "sanskritic", "confidence": "likely", "usage_note": null, "quote": "నక్షత్రవీధి nakshatra-vīdhi. n. The Milky Way.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. నక్షత్రము nakshatramu, p. 628", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=628", "notes": "Brown gives only this Sanskrit compound for the Milky Way; his ఆకాశగంగ (p. 107) he glosses merely 'the river of heaven'. The vernacular Telugu names for the galaxy (pāla-punta etc.) are recorded only in the twentieth-century dictionaries — see the Gwynn entry."}]}, {"key": "ursa-major", "title": "Ursa Major (the Big Dipper)", "kind": "figure", "ra": 165.5, "dec": 55.5, "modern_star": {"common_name": "circumpolar figure — glossed 'the Big Bear' but described as a lizard-shaped chain ending at Polaris", "bayer": null, "constellation": "Ursa Minor / Draco / Ursa Major"}, "sanskrit_db_id": "saptarshi", "names": [{"language": "Assamese", "region": "Assam", "name_native": "গোধিকা", "name_roman": "godhikā", "literal_meaning": "'the iguana / monitor lizard' (Assamese গুঁই guñi)", "register": "vernacular", "confidence": "disputed", "usage_note": "A genuine Assamese sky-figure, and an old one: the dictionary supports it with a line from the Kīrttana (the Kīrttana-ghoṣā of Śaṅkaradeva, 16th c.) — 'গোধিকাৰ পুছ ভাগে দেখিয় অদ্যাপি', 'even today it is seen at the tail-end of the Godhikā'.", "quote": "গোধিকা godhikā [সং.] বি. গুঁই; the iguana. 2। আকাশৰ উত্তৰ ফালে গুঁইৰ আকৱতিৰ নিচিনা হৈ শাৰী পাতি থকা কেতেবোৰ তৰা [তাৰ নেজৰ মূৰত ধ্ৰুব তৰা আছে।]; যেনে-\"গোধিকাৰ পুছ ভাগে দেখিয় অদ্যাপি\" (কীৰ্ত্তন); a number of stars in the north forming the figure of an iguana at the tail of which is situated the pole star; the \"Big Bear\" constellation.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. গোধিকা godhikā, p. 308", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%97%E0%A7%8B%E0%A6%A7%E0%A6%BF%E0%A6%95%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": "The identification is internally inconsistent and I have graded it accordingly. The Assamese description — a row of stars in the north shaped like a monitor lizard, WITH DHRUVA AT THE TIP OF ITS TAIL — is the Purāṇic Śiśumāra, the circumpolar porpoise/reptile figure whose tail-tip is the pole star (Ursa Minor with Draco), not Ursa Major, whose stars are nowhere near the pole. The dictionary's own English gloss nevertheless says 'the Big Bear constellation'. I record the Assamese as printed and reject the English equation. Linked to shishumara on that reasoning; 'আকৱতিৰ' is DSAL OCR for আকৃতিৰ."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "रीछ / ريچهـ", "name_roman": "baṛā rīchh / chhoṭā rīchh", "literal_meaning": "'the big bear' / 'the little bear'", "register": "vernacular", "confidence": "certain", "usage_note": "A calque, almost certainly of Arabic ad-dubb al-akbar / al-aṣghar rather than of English, since Fallon himself glosses sapt-rishī with 'A. dub-i-asgar'. The word rīchh is the inherited Indo-Aryan reflex of Sanskrit ṛkṣa, which in Sanskrit already meant both 'bear' and 'star' - so the calque lands on a word that was etymologically waiting for it.", "quote": "H ريچهـ रीछ rīchh; E. bhālū , n. m. S. ऋक्ष Pr. richchho. A bear. Baṛā rīchh; Sant. buṛhī parkom, Ursa major. Chhoṭā rīchh. Ursa minor.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. rīchh, p. 722", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=722", "notes": "Fallon repeats the equation at p. 703, s.v. rish'ī: 'sapt-rishī; H. baṛā rīchh; A. dub-i-asgar. lit. the seven saints. (Ast.) Ursamajor; Charles's Wain.' R. C. Temple reprints Fallon's data in Panjab Notes and Queries, vol. II, note 83, p. 13. Fallon's 'Sant. buṛhī parkom' is a Santali (Munda, not Indo-Aryan) form and is not claimed here."}, {"language": "Odia", "region": "Odisha", "name_native": "ସାତଭାଇୟା", "name_roman": "Sātabhāiyā", "literal_meaning": "'the seven brothers'", "register": "vernacular", "confidence": "certain", "usage_note": "Given as THE Odia or native name of the group in Praharaj's systematic note, against Hindi ଖଟୋଲା khaṭolā (a cot). The seven ṛṣis have become seven brothers.", "quote": "ଆକାର ଓ ତାରକା ସଂଖ୍ୟା—ଏ ତାରା 7ଟିକୁ ଯୋଗ କଲେ ଗୋଟିଏ ବେଣ୍ଟଲଗା କରଚୂଲି ପରି ହେବ। ଓଡ଼ିଆ ବା ଦେଶୀୟ ନାମ—ଓଡ଼ିଆ ସାତଭାଇୟା, ହିନ୍ଦି, ଖଟୋଲା। ପାଶ୍ଚାତ୍ୟ ନାମ—The Great Bear; the plough; charle's wain; the waggon; the Butcher's cleaver;", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note item 29 ସପ୍ତର୍ଷିମଣ୍ଡଳ, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "The shape metaphor in the same sentence is Odia too: joining the seven gives 'a karacūli with a handle', a long-handled ladle or scoop — independently the same idea as the English Dipper."}, {"language": "Punjabi", "region": "Punjab", "name_native": null, "name_roman": "haftwarang", "literal_meaning": "'the seven ...' (Persian, from Avestan haptōiringa)", "register": "vernacular", "confidence": "likely", "usage_note": "The Iranian name of the Bear, reported in the Panjab beside the Arabic ones; Dames follows Max Müller in equating it etymologically with Sanskrit saptarṣi.", "quote": "Persian. Haftwarang, from the Zend Haftoiring, which is equivalent, according to Max Müller, to the Sanskrit Saptarshi.", "citation": "M. Longworth Dames, 'Names for the Great Bear', Panjab Notes and Queries, vol. II (Feb. 1885), note 522, p. 84", "source_url": "https://archive.org/details/pnq_v2", "notes": "Reported as Persian in Panjab use rather than as a Punjabi word; register is vernacular in the sense used here (Perso-Arabic astronomical vocabulary current in the region). Roman only in the source."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "செம்மீன்", "name_roman": "cem-mīṉ", "literal_meaning": "red star", "register": "vernacular", "confidence": "disputed", "usage_note": "One Tamil name with three competing referents in the Caṅkam corpus itself. In Patiṟṟuppattu 31 it is a chaste woman's exemplar 'foremost among the women who move in the sky', i.e. Arundhatī among the ṛṣis' wives; in Puṟanāṉūṟu 60 it is a red star twinkling in the high sky.", "quote": "விசும்புவழங்கு மகளிர் உள்ளும் சிறந்த\nசெம்மீன் அனையள்நின் தொல்நகர்ச் செல்வி", "citation": "Patiṟṟuppattu 31, ll. 26-28 (Fourth Ten, by Kāppiyāṟṟuk Kāppiyaṉār); Project Madurai e-text PM 0038", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0038.html", "notes": "IDENTIFICATION GENUINELY DISPUTED, and the Tamil Lexicon itself records all three readings under one headword (s.v. செம்மீன், vol. III p. 1598, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%9A%E0%AF%86%E0%AE%AE%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact): '1. The star Arundhati … (பதிற்றுப். 31, 28). 2. Mars; செவ்வாய். செம்மீ னிமைக்கு மாக விசும்பின் (புறநா. 60, 2). 3. The 6th nakṣatra. See திருவாதிரை. (புறநா. 60, 2, உரை.)' — i.e. the Puṟanāṉūṟu line is read as Mars by the Lexicon and as Ārdrā (Betelgeuse) by the old commentary on the same line. The Puṟanāṉūṟu 60 context, verified at PM 0057, is 'முந்நீர் நாப்பண் திமில்சுடர் போலச், / செம்மீன் இமைக்கும் மாக விசும்பின்' — 'in the high sky where the red star twinkles like a fishing-boat's lamp in mid-ocean'. All three candidates (Mars, Betelgeuse, Antares by colour) are red; Arundhatī is not, which is why sense 1 is best explained as the fixed epithet transferred. HOMONYM: sense 4 of the same headword is a sperm whale. sanskrit_db_id given as arundhati for the Patiṟṟuppattu sense; for the Puṟanāṉūṟu sense the candidates are the planet Mars (no Sanskrit-database entry) or 'ardra'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "சிறுமீன்", "name_roman": "ciṟu-mīṉ", "literal_meaning": "small star", "register": "vernacular", "confidence": "likely", "usage_note": "The strongest Caṅkam identification of Arundhatī, because the poet gives the star's position as well as its name: 'the small star that shines in the northern quarter of the great good sky'.", "quote": "பெருநல் வானத்து வடவயின் விளங்குஞ்\nசிறுமீன் புரையுங் கற்பி னறுநுதல்", "citation": "Perumpāṇāṟṟuppaṭai ll. 302-303 (by Kaṭiyalūr Uruttiraṅkaṇṇaṉār); Project Madurai e-text PM 0069", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0069.html", "notes": "The Tamil Lexicon (s.v. சிறுமீன், vol. III p. 1463) gives '1. The star Arundhati; அருந்ததி' and cites this line as பெரும்பாண். 303. HOMONYM: sense 2 of the same headword is 'Loach', a fish — சிறுமீன் is equally 'small fish'; here the preceding line 'in the northern quarter of the great sky' excludes it. Confidence 'likely' rather than 'certain' because 'the small star in the north' is a description that fits Alcor best but is not a proper name pinning it."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "சுடர்ச்சக்கரம்", "name_roman": "cuṭar-c-cakkaram", "literal_meaning": "wheel of light", "register": "vernacular", "confidence": "likely", "usage_note": "A Tamil formation for the Great Bear conceived as the turning polar wheel; the commentary passage quoted makes it the reference circle against which the planets' positions are described.", "quote": "சுடர்ச்சக்கரம் cuṭar-c-cakkaram , n. < id. +. The Great Bear, polar circle; துருவசக்கரம். சுடர்ச்சக்கரத்தைப் பொருந்திவரும் ஆதித்தன் முதலாக வருங் கோட்களது நிலைமையை (பரிபா. 19, 46, உரை).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. சுடர்ச்சக்கரம், vol. III p. 1502; quoting the commentary on Paripāṭal 19, 46", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%9A%E0%AF%81%E0%AE%9F%E0%AE%B0%E0%AF%8D%E0%AE%9A%E0%AF%8D%E0%AE%9A%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AE%B0%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Lexicon equates it with துருவசக்கரம் turuva-cakkaram (p. 1984), 'The wheel of Dhruva, turning the heavens and causing the diurnal motions', whose sense 2 is likewise 'Ursa major'. The name therefore hovers between the Bear itself and the whole polar circle it turns on; confidence 'likely' for the identification with Ursa Major specifically."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "எழுமீன்", "name_roman": "eḻu-mīṉ", "literal_meaning": "seven-star, the seven stars", "register": "vernacular", "confidence": "certain", "usage_note": "The indigenous Tamil name of the Great Bear, from ஏழு ēḻu 'seven'. The Naṟṟiṇai simile — white sea-crows settling on the dark sea like the Seven Stars in a clear sky, 'in the manner of hands folded in worship' — shows the asterism was both named and venerated in Caṅkam Tamil.", "quote": "மை அற விளங்கிய மணி நிற விசும்பில்\nகைதொழும் மரபின் எழு மீன் போல", "citation": "Naṟṟiṇai 231, ll. 1-2 (Neytal, by Iḷanākaṉār); Project Madurai e-text PM 0296", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0296.html", "notes": "The Tamil Lexicon (s.v. எழுமீன், vol. I p. 544, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%8E%E0%AE%B4%E0%AF%81%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact) defines it 'The seven principal stars of Ursa Major, Charles's Wain; சப்தரிஷிமண்டலம்' and cites this exact line as நற். 231. The Sanskritic equivalent in Tamil is சத்தரிஷிமண்டலம் catta-riṣi-maṇṭalam (p. 1249), 'Ursa major or the Great Bear, the seven chief stars of which are personified as saptaṛṣi', and ஸப்தர்ஷிமண்டலம் (p. 3905)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "உத்தரமீன்", "name_roman": "uttara-mīṉ", "literal_meaning": "northern star (Skt. uttara 'north' + Tamil mīṉ)", "register": "vernacular", "confidence": "certain", "usage_note": "A hybrid of the same idea as vaṭa-mīṉ, with the Sanskrit word for north. The Lexicon's definition is unusually precise about which star is meant.", "quote": "*உத்தரமீன் uttara-mīṉ , n. < id. +. The star Arundhati in Ursa Major, the smaller of the two in Mizar, the central star in the tail; அருந்ததி நக்ஷத்திரம். உத்தரமீனின் கொண்கன் (சேதுபு. துத்தம. 6).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. உத்தரமீன், vol. I p. 408; quoting Cētupurāṇam, Tuttamai 6", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%89%E0%AE%A4%E0%AF%8D%E0%AE%A4%E0%AE%B0%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "'The smaller of the two in Mizar, the central star in the tail' is an unambiguous description of Alcor beside Mizar, ζ Ursae Majoris. This is the one Tamil entry that fixes Arundhatī on the sky beyond doubt, and it retro-justifies the identification of vaṭamīṉ and ciṟumīṉ. Beside it the Lexicon has குலமீன் kula-mīṉ 'clan-star' = Arundhatī (p. 1023, quoting Kallāṭam 73, 1)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வடமீன்", "name_roman": "vaṭa-mīṉ", "literal_meaning": "northern star", "register": "vernacular", "confidence": "disputed", "usage_note": "The standard Caṅkam figure for a wife's chastity — 'the lady of gentle words whose chastity is like the northern star'. The comparison is to a star that never leaves its place.", "quote": "வடமீன் புரையுங் கற்பின், மடமொழி,", "citation": "Puṟanāṉūṟu 122, l. 8 (by Kapilar, on Malaiyamāṉ Tirumuṭikkāri); Project Madurai e-text PM 0057", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0057.html", "notes": "IDENTIFICATION DISPUTED. The Tamil Lexicon (s.v. வடமீன், vol. VI p. 3474, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%9F%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact) reads it as Arundhatī — its sense 1 refers to அருந்ததி sense 2, 'the scarcely visible star Alcor of the great Bear', and sense 2 to Arundhatī the wife of Vasiṣṭha — and cites this line. Winslow agrees: 'வடமீன், s. A small star in Ursa Major, as அருந்ததி' (1862, p. 912). But the name means simply 'northern star', and the chastity-simile would work as well for the pole star; readers who take வடமீன் as Dhruva are not obviously wrong, and the Lexicon itself glosses அருந்ததி only as 'the scarcely visible star Alcor'. Kalittokai 2 has the same formula independently — 'வடமீன் போல் தொழுது ஏத்த வயங்கிய கற்பினாள்' (PM 0221) — and there the star is worshipped, which again fits either. Marked disputed for that reason."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ಹೊರಸಿನ್ಟ ನಕ್ಷತ್ರೊಳಿ ಕೂಟ", "name_roman": "horasinṭa nakṣatroḷi kūṭa", "literal_meaning": "'the star-cluster of the cot' — ಹೊರಸು horasu 'a cot, a couch' (Kittel, Kannada-English Dictionary, p. 1771) + genitive + ನಕ್ಷತ್ರ nakṣatra 'star' + ಕೂಟ kūṭa 'assembly, cluster'", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "Ursa, ಕರೊಡಿ; —major ಹೊರಸಿನ್ಟ ನಕ್ಷತ್ರೊಳಿ ಕೂಟ, ಸಪ್ತರ್ಷಿಗಳು.", "citation": "Männer, English–Tuḷu Dictionary (Basel Mission Press, 1888), s.v. Ursa, p. 617", "source_url": "https://archive.org/download/tuluenglishengli02mnuoft/page/n624_w2400.jpg", "notes": "The one indigenous constellation IMAGE recovered for either Tulu or Kodava: the Big Dipper seen as a cot or bedstead, not as a bear and not as seven sages. Männer's first gloss ಕರೊಡಿ karoḍi is simply the animal 'bear', and his alternative ಸಪ್ತರ್ಷಿಗಳು saptarṣigaḷu is the Sanskrit 'Seven Ṛṣis'. TRANSLITERATION CAVEAT: the conjunct in ಹೊರಸಿನ್_ is not fully legible even at 2400px — the subscript could be ṭa or sa — so the genitive is given as -nṭa on morphological grounds and the reading should be checked against the printed book. Note also that horasu is not a headword in Männer's Tulu→English direction, so the word is printed here but nowhere defined by him."}, {"language": "Urdu", "region": "Urdu, from Arabic; reported as the usual name among educated Muslims in the Panjab", "name_native": "بنات", "name_roman": "banātu'n-naʻsh", "literal_meaning": "'the daughters of the bier'", "register": "vernacular", "confidence": "certain", "usage_note": "The classical Arabic reading: four stars form the naʻsh, a bier, and the three ahead of it are the mourning daughters. Structurally identical to palang tīn ćor - four stars of furniture, three figures at them - which is why the two coexist so easily.", "quote": "banātuʼn-naʻsh, s.m. The constellation of the Greater or Lesser Bear (consisting of seven stars, four of which are conceived to bear the resemblance of a naʻsh or bier, and the remaining three to be the banāt or daughters preceding it).", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. banāt, p. 168", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=168", "notes": "name_native gives only the headword بنات as Platts prints it; the compound itself he gives in roman. M. Longworth Dames, Panjab Notes and Queries, vol. II (Feb. 1885), note 522, p. 84: 'Educated Musalmans in the Panjáb generally use the name Bindtu'n-na'sh and not Dubb-i-Akbar' [OCR: Bināt-]. He adds that on his informant's usage dubb-i-akbar means the four stars and dubb-i-aṣghar the three, not the Little Bear.
