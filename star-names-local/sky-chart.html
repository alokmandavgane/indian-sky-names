ellation Orion. The transfer of the name to Orion is shared by Bengali, Odia and Assamese (see the Odia and Assamese entries here) and is therefore an eastern-Indian innovation, not a Bengali one alone. Praharaj's Odia entry preserves the 'black-bodied' gloss that Biswas's English shortens to 'attendant or envoy of Yama'."}, {"language": "Odia", "region": "Odisha", "name_native": "କାଳପୁରୁଷ", "name_roman": "Kāḻapurusha", "literal_meaning": "'the man of Kāla / Death' — Praharaj's gloss makes the body black: 'the black bodied hideous messenger of the God of Death'", "register": "vernacular", "confidence": "certain", "usage_note": "The Odia entry is the one that preserves the colour term the Bengali dictionary drops, and it also anatomises the figure: head = Mṛgaśirā, one shoulder = Ārdrā, waist-belt = the three stars Ilwaḻā; another name Agrahāyaṇī.", "quote": "କାଳପୁରୁଷ— Kāḻapurusha ସଂ. ବି— 1। କୃଷ୍ଣବର୍ଣ୍ଣ ଶରୀରବିଶିଷ୍ଟ ବିକଟାକାର ଯମଙ୍କ କିଙ୍କର… — 1. The black bodied hideous messenger of the God of Death who comes to dying people with J̄ama's order to take them. 2। ଯମ—2. The God of Death. 3। ପୁରୁଷାକୃତ ନକ୍ଷତ୍ରପୁଞ୍ଜ— 3. The constellation Orion. [ଦ୍ର—ଏହାର ମସ୍ତକ ମୃଗଶିରା ଓ ଗୋଟିଏ ଖୁଆମୁଣ୍ଡି ଆର୍ଦ୍ରା; ଏହାର କଟିବନ୍ଧ ଇଲ୍ୱଳା ତାରକାତ୍ରୟ। ଏହାର ଅନ୍ଯ ନାମ ଅଗ୍ରହାୟଣୀ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. କାଳପୁରୁଷ Kāḻapurusha, p. 1552", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%95%E0%AC%BE%E0%AC%B3%E0%AC%AA%E0%AD%81%E0%AC%B0%E0%AD%81%E0%AC%B7&searchhws=yes&matchtype=exact", "notes": "Praharaj marks the headword ସଂ. (Sanskrit) — that is a statement about the morphemes, not about the constellation sense, which is sense 3 and has no Sanskrit precedent. Sense 4 is the jyotiṣa 'zodiacal man', the genuinely Sanskrit meaning, and Praharaj keeps the two apart."}, {"language": "Odia", "region": "Odisha", "name_native": "କାଳପୁରୁଷର ଡାହାଣ ଖୁଆ ମୁଣ୍ଡି", "name_roman": "Kāḻapurushara ḍāhāṇa khuā muṇḍi", "literal_meaning": "'the knob of Kālapuruṣa's right shoulder'", "register": "vernacular", "confidence": "certain", "usage_note": "Given as the Odia or native name of Ārdrā — that is, the sixth nakṣatra is identified for an Odia reader not by a Sanskrit epithet but by its place on the Kālapuruṣa figure. The same note names Mṛgaśirā 'ଓଡ଼ିଆ ବା ଦେଶୀୟ ନାମ—କାଳପୁରୁଷର ମୁଣ୍ଡ', the head of Kālapuruṣa.", "quote": "ଆକାର ଓ ତାରକା ସଂଖ୍ୟା—ଗୋଟିଏ ହଳଦିଆ ଉଜ୍ଜ୍ୱଳ ତାରା। ଓଡ଼ିଆ ବା ଦେଶୀୟ ନାମ—କାଳପୁରୁଷର ଡାହାଣ ଖୁଆ ମୁଣ୍ଡ। ପାଶ୍ଚାତ୍ୟ ନାମ—Betelgeus.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note on the 6th asterism ଆର୍ଦ୍ରା, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "This is the analytically important point about Odia: the Kālapuruṣa figure is not an ornament added on top of the nakṣatra system, it is the frame the nakṣatras of that part of the sky are described BY."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மும்மீன்", "name_roman": "mu-m-mīṉ", "literal_meaning": "three-star, the three stars", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil counting-name, from மூ 'three', for the asterism the Sanskrit tradition calls 'the deer's head'. Recorded by the Tivākaram, the oldest surviving Tamil glossary.", "quote": "மும்மீன் mu-m-mīṉ , n. < id. + மீன்¹. The fifth nakṣatra. See மிருகசீருடம். (திவா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மும்மீன், vol. V p. 3272, citing the Tivākaram", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AF%81%E0%AE%AE%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "CAUTION against a natural misreading: 'three stars' in Orion suggests the Belt to a modern eye, but the fifth nakṣatra is the head-group λ, φ¹, φ² Orionis, and the Tamil Lexicon refers the word to மிருகசீருடம் (p. 3201, < Skt. mṛga-śīrṣa). Winslow independently describes the mansion as 'containing three stars in Orion, and figured by an antelope's head' (1862, s.v. மிருகம், p. 869) — the same three stars, the head not the belt. NEGATIVE FINDING: no Tamil name for Orion's Belt as a separate figure was found in either lexicon. The Lexicon's other name for the fifth nakṣatra is மதிநாள் mati-nāḷ 'moon-star' (p. 3057, Piṅkala Nikaṇṭu), Soma being its presiding deity."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "జాబిలిరిక్క", "name_roman": "jābili-rikka", "literal_meaning": "the moon's star", "register": "vernacular", "confidence": "certain", "usage_note": "Built on jābili, the native Telugu word for the moon.", "quote": "జాబిల్లి or జాబిలి [Tel. జాను+పిల్లి, i.e., చెవులపిల్లి.] n. The moon. చంద్రుడు. … జాబిలిరిక్క the constellation called మృగశీర్ష.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. జాబిల్లి ḍzābilli, p. 481", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=481", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. Motivation uncertain: possibly because Mṛgaśiras is the mansion in which the moon's month Mārgaśīrṣa is full, or from the deer that the Sanskrit name and the Telugu word for the moon (jābili, glossed by Brown from the hare in the moon) share."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పగడపురిక్క", "name_roman": "pagaḍapu-rikka", "literal_meaning": "the coral star", "register": "vernacular", "confidence": "certain", "usage_note": "A colour name.", "quote": "పగడపు జిట్ట n. A kind of bird. పక్షివిశేషము. పగడపురిక్క pagaḍapu-rikka. n. The constellation called అర్ద్రానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పగడపు జిట్ట pagaḍapu-jiṭṭa, p. 695", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=695", "notes": "This is a genuine observational name and not a translation of anything Sanskrit. Ārdrā is Betelgeuse, one of the two reddest bright stars in the sky, and pagaḍamu is coral, i.e. red. Brown corroborates the equation coral = bright star at మెరుగు p. 1031, where merugu-rikka is glossed both 'Coral' and 'A bright star'."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "جبار", "name_roman": "jabbār", "literal_meaning": "'the giant, the mighty one'", "register": "vernacular", "confidence": "certain", "usage_note": "Arabic al-jabbār, the giant - one of the two Arabic names of Orion that Urdu inherits. Platts files it in the same entry as the divine epithet 'Omnipotent', which is how the word is otherwise met in Urdu.", "quote": "A جبار jabbār (superl. or intens. fr. جبر), adj. & s.m. Omnipotent, mighty; — a conqueror; a revenger; a tall palm tree; Orion.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. jabbār, p. 375", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=375", "notes": "Also Shakespear (1834), p. 611. The Panjab list in Panjab Notes and Queries II.521 (p. 84) gives 'Orion. Arabic: An-nasaq, the row; al Jabbár, the giant.'"}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "جوزا", "name_roman": "jauzā", "literal_meaning": "Arabic al-jawzāʼ", "register": "vernacular", "confidence": "certain", "usage_note": "In Urdu jauzā covers both the zodiac sign Gemini and the constellation Orion - the classical Arabic ambiguity carried over whole. Fallon (p. 1072) gives it as the Arabic equivalent of Hindi mithun, Gemini.", "quote": "A جوزا jauzā , s.m. The sign Gemini; — Orion.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. jauzā, p. 397", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=397", "notes": "Also Shakespear (1834), p. 647, in identical terms."}, {"language": "Chhattisgarhi", "region": "Chhattisgarh (Dhuri caste, rice-parchers)", "name_native": null, "name_roman": "[no vernacular form printed] 'the plough left by one of the Pandava brothers'", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": null, "quote": "Orion is the plough left by one of the Pandava brothers after he had finished tilling the heavens.", "citation": "Russell & Hiralal, The Tribes and Castes of the Central Provinces of India (1916), vol. II, article 'Dhuri', p. 529", "source_url": "https://archive.org/download/in.ernet.dli.2015.175422/2015.175422.The-Tribes-And-Castes-Of-The-Central-Provinces-Of-India-Vol-ii_djvu.txt", "notes": "The plough reading of Orion again, here fused with epic material — the ploughman is a Pandava. Russell gives no Chhattisgarhi word."}, {"language": "Hindi", "region": "North-Western Provinces (Mirzapur/Saharanpur region; recorded by Pandit Ram Gharib Chaube for Crooke's journal)", "name_native": null, "name_roman": "harinā-harin", "literal_meaning": "'the stag and the hind'", "register": "folk", "confidence": "disputed", "usage_note": "A children's sky-name taught by mothers, with a Brahmā-and-Purvacitti pursuit myth attached in which Śiva takes the form of the Ārdrā asterism to help the hind. The living folk survival of the Vedic Mṛga/Prajāpati story, still located in Orion.", "quote": "Hindu mothers teach their children to point to the sky as they say these stars are the Stag and the Hind. Near them is a constellation which looks like a hunter armed with a bow and arrows.", "citation": "Pandit Ram Gharib Chaube, 'The Harina Harin Stars', North Indian Notes and Queries, vol. V (1895-96), note 517", "source_url": "https://archive.org/details/ninq_v5", "notes": "confidence disputed: the note names no individual stars. The location in Orion is secured by the myth's use of the Ārdrā asterism (Betelgeuse) as Śiva's form; on the Sanskrit precedent the 'hunter with a bow and arrows' would be the Belt-as-arrow with Sirius as Mṛgavyādha the hunter, but the note does not say so, and no vernacular name for that figure is given."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಆರಿದ್ರ", "name_roman": "āridra", "literal_meaning": null, "register": "folk", "confidence": "certain", "usage_note": "SEASONAL. The Ārdrā period is July-August in Kittel's reckoning, and an insect is named from it.", "quote": "ಆರಿದ್ರ āridra. Tbh. of ಆರ್ದ್ರೆ. the sixth lunar mansion (My.; Mhr. ಆರದ್ರಾ. -ಆರಿದ್ರಪುಱು. the insect called lady-bird or maybug, so called because it appears in July and August, which season is called Ārdre (Te. ಆರುದ್ರೆಪುರುಗು, ಆರ್ದ್ರೆ; R.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಆರಿದ್ರ āridra, p. 168", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=168", "notes": "The clearest Kannada case of a nakṣatra name in ordinary rural use: the ladybird is the 'Ārdrā-worm' because it comes out in the Ārdrā rains. Kittel gives the Telugu equivalent ఆరుద్రపురుగు in the same breath, so the usage is shared across both languages — a genuine Telugu/Kannada folk pair. Registered folk rather than sanskritic because the reference is to the season, not the star."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "मृगशितळाई", "name_roman": "mṛgaśitaḷāī", "literal_meaning": "the Mṛga-coolness", "register": "folk", "confidence": "certain", "usage_note": "the damp chill at the break of the monsoon, under the Mṛga rains", "quote": "मृगशितळाई mṛgaśitaḷāī, मृगशितळी mṛgaśitaḷī f The dampness and chilliness of weather that prevails at the beginning of the monsoon, during the falling of the rain of the मृगनक्षत्र.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. मृगशितळाई, p. 663", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A5%83%E0%A4%97%E0%A4%B6%E0%A4%BF%E0%A4%A4%E0%A4%B3%E0%A4%BE%E0%A4%88&searchhws=yes&matchtype=default", "notes": "A weather-word built on a star-name — Marathi formation on मृग + शीतळ."}, {"language": "Odia", "region": "Odisha (rustic/colloquial)", "name_native": "ଅଦ୍ରାବଳି", "name_roman": "Adrābaḻi", "literal_meaning": "'the Ārdrā-row' — the string of stars containing Ārdrā", "register": "folk", "confidence": "certain", "usage_note": "Marked ଗ୍ରା. (grāmya, rustic). The variants ଆର୍ଦ୍ରାବଳି Ārdrābaḻi (p. 814, marked ଦେ. deśī, sense 4 'The constellation of orion') and ଅରାବଳି Arābaḻī (p. 564, ଦେ. 'ଆର୍ଦ୍ରାବଳି; କାଳପୁରୁଷ ନକ୍ଷତ୍ରପୁଞ୍ଜ — The constellation of Orion') give the same word at three degrees of erosion.", "quote": "ଅଦ୍ରାବଳି— Adrābaḻi ଗ୍ରା. ବି. (ସଂ. ଆର୍ଦ୍ରା)— … 3। (ସଂ. ଆର୍ଦ୍ରା+ଆବଳି)—ଆର୍ଦ୍ରାନକ୍ଷତ୍ର ସମନ୍ୱିତ କାଳପୁରୁଷ ନାମକ ନକ୍ଷତ୍ର ପୁଞ୍ଜ — 3. The constellation of Orion. ପୂର୍ବେ ଅଦ୍ରାବଳୀ ପଶ୍ଚିମେ ରୋଇ / ନାଥ ବୋଲେ ପୁତାରେ ନିଶ୍ଚେ ଯିବ ଧୋଇ। ଡାକବଚନ।", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଅଦ୍ରାବଳି Adrābaḻi, p. 236", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%85%E0%AC%A6%E0%AD%8D%E0%AC%B0%E0%AC%BE%E0%AC%AC%E0%AC%B3%E0%AC%BF&searchhws=yes&matchtype=exact", "notes": "CAUTION ON THE PROVERB. The Ḍākabacana couplet appended here ('Adrābaḻī in the east, Roi in the west — Nātha says, my son, it will surely be washed away') is printed by Praharaj under THREE different headwords, and under two of them the word means a RAINBOW, not Orion: ଆର୍ଦାବଳି p. 813 (ଗ୍ରା., 'ଇନ୍ଦ୍ରଧନୁ — Rainbow') and ଆର୍ଦ୍ରାବଳି p. 814 sense 1 ('Rainbow'), and ରୋଇ is itself a straight rainbow (see ଋଜୁରୋହିତ p. 1080). The couplet is therefore a rain-prognostic about rainbows east and west; it is NOT evidence that Orion was an agricultural marker. I record it because Praharaj attached it to the Orion sense, and I flag the attachment as wrong."}, {"language": "Punjabi", "region": "Jhang District and Multan, western Punjab", "name_native": null, "name_roman": "traṅgar", "literal_meaning": "'the wide-meshed pack-net'", "register": "folk", "confidence": "disputed", "usage_note": "The same net-word applied to a second star-group. Which part of Orion is meant is not specified beyond 'the upper part', so the identification is deliberately loose here.", "quote": "The upper part of Orion is also called trangar.", "citation": "M. Longworth Dames, 'Names for the Great Bear', Panjab Notes and Queries, vol. II (Feb. 1885), note 522, p. 84", "source_url": "https://archive.org/details/pnq_v2", "notes": "confidence disputed because 'the upper part of Orion' is not resolved to named stars; it may be the shoulders (Betelgeuse-Bellatrix) with the head, or the whole quadrilateral read as a net."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Topli, Topali", "literal_meaning": "a basket", "register": "tribal", "confidence": "disputed", "usage_note": "The basket of seed used for sowing the fields that Tipan has ploughed.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Placed at Lepus in some villages and at γ and β Orionis in others."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "cuṭu gutu'keḍ ipil", "literal_meaning": "the one who has spitted the mice", "register": "tribal", "confidence": "likely", "usage_note": "The ploughman's small son, who has skewered the two mice on a splinter of bamboo to roast them; the three stars lie on a straight line.", "quote": "cuṭu gutu'keḍ ipil sbst., the star which holds the pinned mice, the harder and more southern of the three stars in Orion's dagger.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. III, s.v. cuṭu gutu'keḍ ipil, col. 936", "source_url": "https://archive.org/download/in.ernet.dli.2015.14921/2015.14921.Encyclopedia-Mundarica-Vol-iii-1930_djvu.txt", "notes": "'harder' in the scan is an OCR corruption, most probably for 'harder to see' or 'larger'."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "cuṭu ipilkiŋ", "literal_meaning": "the two mice stars", "register": "tribal", "confidence": "likely", "usage_note": "Mice turned up by the ploughshare in the tableau; roasted mice are a much-coveted delicacy.", "quote": "cuṭu ipilkiŋ, sbst., the two mice stars, the two smaller stars visible in Orion's dagger.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. III, s.v. cuṭu ipilkiŋ, col. 936; also vol. VII s.v. ipil col. 1920", "source_url": "https://archive.org/download/in.ernet.dli.2015.14921/2015.14921.Encyclopedia-Mundarica-Vol-iii-1930_djvu.txt", "notes": "The dual suffix -kiŋ is grammatical: exactly two stars. Hoffmann calls them fifth-magnitude stars 'in Orion's dagger'; he gives no Bayer letters and none are supplied here."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "nahel ipil", "literal_meaning": "the plough star", "register": "tribal", "confidence": "likely", "usage_note": "In the version heard in villages south of Ranchi, where the belt is the yoke Siṅgboṅga was chiselling, the plough itself is Rigel.", "quote": "the yoke is represented by the three Kings (the three stars in Orion's belt), and the plough, nahel ipil, by Rigel.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Printed 'naVal ipil' in the better of the two scans; nahel is the ordinary Mundari and Santali word for a plough and the gloss 'the plough' is Hoffmann's own, so the reading is secure enough to record."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "siṭan ipil", "literal_meaning": "the ploughing star", "register": "tribal", "confidence": "certain", "usage_note": "Rigel is the ploughman himself, standing a little behind his team; Hoffmann notes the four stars form an elongated isosceles triangle with Rigel at the apex, which is what suggested the ploughman's stance.", "quote": "sitan-ipil sbst., the ploughing star, i.e., Rigel. Sitan ipilko, the ploughing stars, i.e., the group formed by the ploughman Rigel and his team, the three stars in Orion's belt (araṛd ipilko).", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Quoted from the separate headword at Encyclopaedia Mundarica vol. XIII col. 4011 (https://archive.org/download/dli.ernet.14932/), which confirms the reading given in the ipil article."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Pŏdimīn", "literal_meaning": "porcupine star", "register": "tribal", "confidence": "certain", "usage_note": "The sword stars are a porcupine, and the three stars of the belt are trying to escape from it.", "quote": "A group of stars called Pŏdimīn, or porcupine star, corresponds to the stars in the sword of Orion. They are regarded as a porcupine from which the three stars of the belt are trying to escape.", "citation": "Rivers, The Todas (1906), p. 594", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "Two Internet Archive scans print the name as 'Pbdimin' and 'PbdimiUy'; the reading Pŏdimīn is supported by Katikālmin, where -mīn is evidently 'star', and by Rivers' own glossary, which gives podi for the porcupine (p. 267) and mul for its quills. Note that this reverses the Munda and Gondi reading of the same region of sky: for them the belt is a plough or a yoke and the sword is mice or a hunter's kill."}, {"language": "Bengali", "region": "Bengal", "name_native": "ইলবলা (also ইলবকা)", "name_roman": "ilabalā (ilabakā)", "literal_meaning": "Ilvala, the asura brother of Vātāpi", "register": "sanskritic", "confidence": "certain", "usage_note": "Haughton marks both as feminine and 'used in the plural only' — the Vedic plural Ilvalāḥ preserved intact in a Bengali dictionary of 1833.", "quote": "ইলবকা s. (f. used in the plural only) Stars in the head of Orion. See ইলবলা. — ইলবলা s. (f. used in the plural only) Stars in the head of Orion.", "citation": "Sir Graves Champney Haughton, A Dictionary, Bengáli and Sanskrit, explained in English, London: printed by J. L. Cox and Son, 1833, s.v. ইলবকা / ইলবলা, p. 419", "source_url": "https://archive.org/download/dictionarybengal1687haug/page/leaf252_w2400.jpg", "notes": "THE POINT OF THIS ENTRY IS THE CONTRAST. Bengali keeps Ilvalā where Sanskrit had it, on Orion's HEAD (compare the Sanskrit database entry ilvala, from the Taittirīya tradition). Odia has moved the same word down to Orion's BELT — Praharaj s.v. ଇଲ୍ୱଳା p. 876, and again at pp. 1552 and 4106. Two neighbouring languages, one inherited word, two different asterisms. Transcribed from the page image, which I read directly: Haughton's fount cuts র as ৰ throughout, and the headwords are printed with plain ব, ইলবকা / ইলবলা, not the conjunct ল্ব of the Odia form."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಇಲ್ವಲೆಗಳ್", "name_roman": "ilvalegaḷ", "literal_meaning": null, "register": "sanskritic", "confidence": "likely", "usage_note": null, "quote": "ಇಲ್ವಲೆಗಳ್ ilvalegaḷ. (Sk. ಇಲ್ವಲಾಃ). the five stars in Orion's head.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಇಲ್ವಲೆಗಳ್ ilvalegaḷ, p. 206", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=206", "notes": "The Sanskrit Ilvalāḥ / Invakāḥ with the Kannada plural -gaḷ, which is why the register is sanskritic but the form is Kannada. Kittel says five stars; the Vedic and later tradition, and the Sanskrit database entries 'ilvala' and 'invaka', give three (λ, φ¹, φ² Orionis). The discrepancy is recorded, not resolved; modern_star follows the standard three-star identification."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಆಗ್ರಹಾಯಣಿ", "name_roman": "āgrahāyaṇi", "literal_meaning": "she who begins the year", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಆಗ್ರಹಾಯಣಿ āgrahāyaṇi. N. of a lunar mansion, Mṛigaśiras (Orion).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಆಗ್ರಹಾಯಣಿ āgrahāyaṇi, p. 151", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=151", "notes": "The one place either dictionary names Orion as a constellation rather than a mansion, and it does so through a Sanskrit word. Neither Brown nor Kittel has any vernacular Orion or Orion's-Belt name; searches for 'Orion', 'three stars' and 'belt' in both dictionaries returned nothing indigenous. A significant negative finding."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": null, "name_roman": "Tiruvatira (Ardra star)", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Ethnographic confirmation that the asterism, not merely the festival name, is what Kerala reckons by: Thurston lists it among the Nambūtiri Brahman observances of the year, fixed to the month of Dhanu, preceded by seven days of pre-dawn bathing and kept as a night vigil by husband and wife.", "quote": "(5) Tiruvatira or Ardra star. — In the month of Dhanu. This is a day of universal festivity and rejoicing.", "citation": "Thurston & Rangachari, Castes and Tribes of Southern India (Madras, 1909), vol. V, s.v. Nambutiri Brahman, pp. 194–195", "source_url": "https://archive.org/download/castestribesofso05thuruoft/castestribesofso05thuruoft_djvu.txt", "notes": "Thurston romanizes only; no Malayalam script is printed, so name_native is left null. Across all seven volumes of Thurston, searched electronically, no Malayalam vernacular star name appears at all: the words Pleiades, Orion, Canopus, Sirius, Arcturus, pole star and Milky Way do not occur once in the whole work."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഇന്വകകള്‍", "name_roman": "invakakaḷ", "literal_meaning": null, "register": "sanskritic", "confidence": "likely", "usage_note": null, "quote": "ഇന്വകകള്‍ invakakaḷ‍ invaγaγaḷ Tdbh. ഇല്വക S. 5 Stars in the head of Orion.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഇന്വകകള്‍ invakakaḷ, p. 108", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%87%E0%B4%A8%E0%B5%8D%E0%B4%B5%E0%B4%95%E0%B4%95%E0%B4%B3%E0%B5%8D%E2%80%8D&searchhws=yes&matchtype=exact", "notes": "A striking survival: Gundert marks it a tadbhava of Sanskrit ilvakā (Vedic Ilvalāḥ / Invakāḥ, the old name of Mṛgaśiras), a word that is archaic even in Sanskrit. Malayalam keeps it with a native plural in -kaḷ. Gundert's count of five differs from the three or five usually given for the Vedic asterism; 'likely' rather than 'certain' for that reason."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "മകയിരം", "name_roman": "makayiram", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "മകയിരം makayiram maγairam & മകയിര്യം (S. മൃഗ ശീര്‍ഷം). The 5th constellation, head of Orion. മകീരം മുന്നല്‍ നടന്ന കന്നിയില്‍ (astrol.).", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. മകയിരം makayiram, p. 769", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%AE%E0%B4%95%E0%B4%AF%E0%B4%BF%E0%B4%B0%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "A heavy phonological reshaping of mṛgaśīrṣa — mṛga- → maka-, -śīrṣa → -yiram — with a further contracted form മകീരം makīram quoted from an astrological text. Malayalam thus names Orion's head twice over, here and at ഇന്വകകള്‍."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ആതിര / തിരുവാതിര", "name_roman": "ātira / tiruvātira", "literal_meaning": "തിരു- is the honorific 'sacred, holy'", "register": "sanskritic", "confidence": "likely", "usage_note": "The most socially prominent asterism in Kerala. Tiruvātira in Dhanu is a women's festival of Śiva; the Tiruvātira ñāṟṟu at the start of Mithunam is the planting period at the burst of the south-west monsoon (Gundert s.v. ഞാറു, p. 412).", "quote": "ആതിര ātira āδira T. M. & തിരുവാതിര (S. ആ ര്‍ദ്രാ ) The 6th Asterism, star in Gemini.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ആതിര ātira, p. 79", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%86%E0%B4%A4%E0%B4%BF%E0%B4%B0&searchhws=yes&matchtype=exact", "notes": "Gundert marks it 'T. M.', i.e. shared Tamil-Malayalam, not a fresh Sanskrit loan; and he places the star in Gemini, where Ārdrā is standardly Betelgeuse in Orion. The Kerala school's own texts put Ārdrā at Betelgeuse, so Gundert's 'Gemini' is treated here as loose — hence 'likely'. Thurston's account of the Nāyars (Castes and Tribes of Southern India, vol. V) heads the festival section 'Tiruvatira or Ardra star', confirming the asterism identification outside the dictionary."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Mrig", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "reaches the zenith at midnight on a fixed day, which is how the lunar months are named", "quote": "The constellation of Mrig consists of seven stars, four like the legs of a cot and three others under them in a line.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 64", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n66", "notes": "IMPORTANT CAUTION for anyone reading cot-figures across Indian languages: on this one page Enthoven applies the cot image to TWO different groups — Orion here, and the Great Bear eight lines later. A bare report that 'the cot' is a folk constellation therefore does not identify a star group by itself. The seven stars of Mrig here are evidently the Belt plus the four corner stars of Orion (Betelgeuse, Bellatrix, Saiph, Rigel), which is not the classical Mṛgaśīrṣa (the three faint stars of the deer's head, λ φ¹ φ² Orionis) — the folk figure has absorbed the whole of Orion."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "मृग", "name_roman": "mṛga", "literal_meaning": "deer, antelope", "register": "sanskritic", "confidence": "certain", "usage_note": "Pr. मृगाचे अधीं पेरावें आणि बोंबेचे अधीं पळावें — 'sow before Mṛg, run before the shout'; the onset of the monsoon in Maharashtra is dated to this asterism", "quote": "मृग mṛga m (S) A deer, an antelope. 2 The fifth नक्षत्र or lunar mansion: also the rain that falls under it. Pr. मृगाचे अधीं पेरावें आणि बोंबेचे अधीं पळावें.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. मृग, p. 663", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A5%83%E0%A4%97&searchhws=yes&matchtype=exact", "notes": "The name is Sanskrit; the USE is thoroughly vernacular. मृग is the single most important star-word in the Marathi agricultural calendar — the official revenue year मृगसाल and the Deccan फसलीसाल both begin with it (Molesworth, s.v. मृगसाल p. 663 and फसलीसाल p. 550), and Molesworth's derivatives मृगबार, मृगशितळाई and मृगाचा किडा all key crop, weather and insect to it."}, {"language": "Odia", "region": "Odisha", "name_native": "ମୟୂରତୁଣ୍ଡ", "name_roman": "Mayūratuṇḍa", "literal_meaning": "'the peacock's beak'", "register": "sanskritic", "confidence": "likely", "usage_note": "Stars 9-13 of Praharaj's Orion diagram, identified in the same entry as σ, 42, θ, ι and υ Orionis and as 'Orion's dagger'.", "quote": "9। 10।11।12।13 ମୟୂରତୁଣ୍ଡ … 9. 10 11. 12. 13 Orion's dagger", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note item 36 କାଳପୁରୁଷ ପୁଞ୍ଜ, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "I have not traced Mayūratuṇḍa as a star-name in any Sanskrit text; it may be Praharaj's own tradition or his own coinage for the western 'dagger'. Graded likely for that reason. Rigel is ବାଣରାଜ Bāṇarāja 'king Bāṇa' in the same list — the father of Uṣā, so the whole southern half of the figure is read as the Uṣā-Aniruddha story."}, {"language": "Odia", "region": "Odisha", "name_native": "ସୌମ୍ୟ", "name_roman": "Sa̲u̲mya", "literal_meaning": "'belonging to Soma'", "register": "sanskritic", "confidence": "likely", "usage_note": "Praharaj counts five stars on the top of the figure where the Sanskrit sources count three.", "quote": "A name given to the 5 stars (in plural) situate on the top of the Orion constellation; the Orion's head.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ସୌମ୍ୟ Sa̲u̲mya, p. 8756", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%B8%E0%AD%8C%E0%AC%AE%E0%AD%8D%E0%AD%9F&searchhws=yes&matchtype=exact", "notes": "Linked to the Sanskrit database entry saumya (= Meissa / Mṛgaśīrṣa). The feminine ସୌମ୍ୟା at the same page is glossed 'The Orion's head (constellation)'. The count of five rather than three is Praharaj's."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": null, "name_roman": "Muwa-sirasa (muvasirasa)", "literal_meaning": "'deer's head' — Clough parses it, 'මුව and සිරස head'", "register": "sanskritic", "confidence": "likely", "usage_note": null, "quote": "Muwa-sirasa, s. (මුව and සිරස head) fifth lunar asterism, figured by the head of a deer; Elu form of මෘගශිරස mriga-siras, which see.", "citation": "Clough, A Sinhalese-English Dictionary (Colombo, 1892), s.v. Muwa-sirasa, p. 493", "source_url": "https://archive.org/stream/sinhaleseenglish00clourich/sinhaleseenglish00clourich_djvu.txt", "notes": "Half-translated rather than merely sound-shifted: the first element මුව muva 'deer' is inherited Sinhala (Clough p. 492: 'Muwa, s. deer ... Elu form of'), the second සිරස sirasa is Sanskrit śiras. Clough's own tag is 'Elu form', so it is filed here as sanskritic, but it is the nearest the nakshatra list comes to a native re-coinage. Clough's djvu.txt OCR of the Sinhala script is unusable, so name_native is left null: only Clough's romanization is recorded. Carter uses the same word inside definitions (ආග්‍රහායර්‍ණය, p. 87, 'the const. Orion, මුවසිරස') but does not carry it as a headword."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "திருவாதிரை", "name_roman": "tiru-v-ātirai", "literal_meaning": "holy Ātirai (Skt. ārdrā), with the Tamil honorific tiru-", "register": "sanskritic", "confidence": "certain", "usage_note": "The only Tamil word the Lexicon's English side returns for a search on 'Orion'. It is the Sanskrit Ārdrā with the Tamil honorific prefixed, and it carries a Śaiva festival and a girl's pre-marriage rite with it.", "quote": "திருவாதிரை tiru-v-ātirai , n. < id. + ārdrā. 1. The 6th nakṣatra, part of Orion; ஆறாவது நட்சத்திரம். (பிங்.) 2. A festival in the month of Mārkaḻi. See ஆருத்திராதரிசனம். 3. A special ceremony observed on the day of āruttirā-taricaṉam before a girl's marriage when she is given a bath and decorated … Nāṭ. Cheṭṭi. (E. T. v, 264.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. திருவாதிரை, vol. IV p. 1917, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A4%E0%AE%BF%E0%AE%B0%E0%AF%81%E0%AE%B5%E0%AE%BE%E0%AE%A4%E0%AE%BF%E0%AE%B0%E0%AF%88&searchhws=yes&matchtype=exact", "notes": "ETHNOGRAPHIC CROSS-REFERENCE: sense 3 is sourced by the Lexicon to 'E. T. v, 264' — Edgar Thurston, Castes and Tribes of Southern India, vol. V — and attributed to the Nāṭṭukkōṭṭai Chettis. This is the Tamil Lexicon itself citing the ethnography, and is the only place in this compilation where a star-derived Tamil term is anchored to a named community practice. Sense 2 is the Mārkaḻi Ārudrā-darśana festival. See also the disputed reading of செம்மீன் above, where an old commentary makes Puṟanāṉūṟu 60's 'red star' this asterism."}]}, {"key": "meteor", "title": "Meteors and shooting stars", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "meteor", "bayer": null, "constellation": null}, "sanskrit_db_id": "tara", "names": [{"language": "Bengali", "region": "Bengal (stated by the dictionary to be the usage of 'this country')", "name_native": "নক্ষত্রপাত", "name_roman": "nakṣatra-pāta", "literal_meaning": "'star-fall'", "register": "vernacular", "confidence": "certain", "usage_note": "Recorded because of the explicit statement of regional usage in the parenthesis: 'in this country a meteor-fall is called nakṣatrapāta'. The same entry supplies the colloquial Bengali pronunciations of নক্ষত্র — নোক্খোত্তোর, নখতর, নোখতা.", "quote": "̃পাত [নক্ষত্র-পাত (পতন), 6তৎ] ক্রি-বি, ভূতলে নক্ষত্রের পতন (এ দেশে উল্কাপাতকে নক্ষত্রপাত বলে)। 2 [কাব্যা- লঙ্কারে] নক্ষত্রের আকাশ হতে পতনের ন্যায় উচ্চপদ হতে মানী ব্যক্তির অধঃপতন; মহাত্মার দেহপাত।", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. নক্ষত্র nakṣatra, sub-lemma ̃পাত, p. 1157", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=1157", "notes": "The second sense is a figure of speech in living use — the death of a great man, illustrated from what the newspapers wrote on Keshab Chandra Sen's death: 'today a star has fallen'."}, {"language": "Bengali", "region": "Bengal", "name_native": "তারাপতন, তারাপাত", "name_roman": "tārā-patana, tārā-pāta", "literal_meaning": "'star-fall'", "register": "vernacular", "confidence": "certain", "usage_note": "Sub-lemmas under তারা. The learned word উল্কা ulkā is at p. 172 ('an aerolite or aerolith, a shooting star, a meteor'); তারাপতন is the transparent Bengali compound beside it.", "quote": "~পতন, ~পাত n. the fall of a meteor. ~পথ n. the stellar course; the sky, the welkin. … ~মণ্ডল n. the stellar region or orbit; a constellation.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. তারা tārā, sub-lemmas ~পতন, ~পাত, p. 458", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%A4%E0%A6%BE%E0%A6%B0%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "കൊളളിമീന്‍", "name_roman": "koḷḷimīn", "literal_meaning": "'firebrand-star' (കൊളളി firebrand + മീന്‍ star)", "register": "vernacular", "confidence": "certain", "usage_note": "Used with the verb വീഴുക 'to fall': കൊളളിമീന്‍ വീഴുക 'a meteor falls'. Gundert also records അശനിക്കൊളളിമീന്‍ 'thunderbolt-firebrand-star' from Kṛṣṇagāthā, in a list of portents alongside earthquake.", "quote": "കൊളളിമിന്നല്‍ lightning. കൊളളിമീന്‍ വീഴുക meteor.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. കൊളളി koḷḷi, p. 310 (also s.v. മീന്‍, p. 822)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%95%E0%B5%8A%E0%B4%B3%E0%B4%B3%E0%B4%BF&searchhws=yes&matchtype=exact", "notes": "Wholly native: both elements are Dravidian, and the same compound type recurs in കൊളളിമിന്നല്‍ 'lightning' and കൊളളിയന്‍ 'a demon with a torch, ignis fatuus'. Malayalam therefore has a native meteor word beside the Sanskrit ഉല്ക."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "अस्मानतारा", "name_roman": "asmānatārā", "literal_meaning": "sky-star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "अस्मानतारा asmānatārā m (آسمان کا تارا H) A star. 2 A falling star, a meteor. v तुट. 3 A term of praise for a very fine horse, or accomplished rider, writer, singer, musician &c.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. अस्मानतारा, p. 56", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%85%E0%A4%B8%E0%A5%8D%E0%A4%AE%E0%A4%BE%E0%A4%A8%E0%A4%A4%E0%A4%BE%E0%A4%B0%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "A Persian-via-Hindustani loan, āsmān kā tārā, naturalised in Marathi — vernacular in the sense of not Sanskrit, but the source is Indo-Persian, not indigenous. Molesworth prints the Persian original in Arabic script."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "விண்வீழ்கொள்ளி", "name_roman": "viṇ-vīḻ-koḷḷi", "literal_meaning": "sky-falling firebrand", "register": "vernacular", "confidence": "certain", "usage_note": "The standard Tamil term for a meteor, and the word the Lexicon uses to define the Sanskrit uṟkam and tūmakētu. Entirely Tamil in its elements.", "quote": "விண்வீழ்கொள்ளி viṇ-vīḻ-koḷḷi , n. < விண்¹ + வீழ்- +. Meteor; shooting star; விண்ணினின்று விழும் நட்சத்திரம்போன்ற சுடர். (சூடா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. விண்வீழ்கொள்ளி, vol. VI p. 3666, citing the Cūṭāmaṇi Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%BF%E0%AE%A3%E0%AF%8D%E0%AE%B5%E0%AF%80%E0%AE%B4%E0%AF%8D%E0%AE%95%E0%AF%8A%E0%AE%B3%E0%AF%8D%E0%AE%B3%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "The Tamil definition is careful — 'a light like a star, falling from the sky' — i.e. Tamil lexicography distinguishes the meteor from a star proper. The Sanskrit-derived equivalents in Tamil are உற்கம் uṟkam (p. 478, < ulkā) and ஆகாசபலம் ākāca-palam (p. 205)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வீழ்மீன்", "name_roman": "vīḻ-mīṉ", "literal_meaning": "falling star", "register": "vernacular", "confidence": "certain", "usage_note": "The -mīṉ form of the same idea, and the one attested in the commentary tradition on the Tolkāppiyam.", "quote": "வீழ்மீன் vīḻ-mīṉ , n. < id. + மீன்¹. Meteor; விண்வீழ்கொள்ளி. (தொல். பொ. 91, உரை.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. வீழ்மீன், vol. VI p. 3762; quoting the commentary on Tolkāppiyam, Poruḷatikāram 91", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AF%80%E0%AE%B4%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The variant விழுமீன்¹ viḻu-mīṉ (p. 3723) is glossed 'Meteor. See வீழ்மீன்' — and immediately beside it விழுமீன்² is the hilsa fish, one more mīṉ homonym. The citation is to the commentary on the Tolkāppiyam, not to the sūtra itself: the mūlam of the Tolkāppiyam names no sky-object, as recorded in summary_findings."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ಆಕಾಶೊಡ್ಡು ಬೂರ್ದಿ ಕಲ್ಲ್", "name_roman": "ākāśoḍḍu būrdi kallụ", "literal_meaning": "'the stone that fell from the sky'", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "Meteorite, Meteorolite, s. ಆಕಾಶೊಡ್ಡು ಬೂರ್ದಿ ಕಲ್ಲ್.", "citation": "Männer, English–Tuḷu Dictionary (1888), s.v. Meteorite, p. 327", "source_url": "https://archive.org/download/tuluenglishengli02mnuoft/page/n334_w1400.jpg", "notes": "A descriptive Tulu phrase rather than a name — everything but ಆಕಾಶ ākāśa 'sky' is native. Compare the Sinhala තරුගල tarugala 'star-stone', which is also only a gloss and not a headword. Männer's word for the phenomenon itself is Sanskrit: ಉಲ್ಕಾಪಾತ ulkāpāta, 'The falling of meteors, which is considered a bad sign. 2. an omen' (Tulu→English p. 74)."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "شہاب", "name_roman": "shihāb (vulg. shahāb)", "literal_meaning": "'a firebrand, a flame'", "register": "vernacular", "confidence": "certain", "usage_note": "Qur'anic in origin - the shihāb thāqib hurled at eavesdropping jinn. Crooke found the word alive as a name for eerie lights in Rohilkhand and western Oudh, where the Shahaba over battlefield burial-grounds is a phantom army.", "quote": "A شہاب shihāb, vulg. shahāb (v.n. fr. شہب 'to be or become gray,' &c.), s.m. Flame (of fire); a firebrand; a brightly-shining star; a shooting or falling star; a meteor.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. shihāb, p. 738", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=738", "notes": "Fallon (p. 104) gives 'A. shahāb-i-sāqib' as the Arabic for Hindi ākās agan golā. For the will-o'-the-wisp sense see Crooke, The Popular Religion and Folk-lore of Northern India (1896), II. 198."}, {"language": "Assamese", "region": "Assam", "name_native": "পপীয়া-তৰা", "name_roman": "papīẏā-tarā", "literal_meaning": "'the sinful star' (পপীয়া < Skt. pāpa 'sin')", "register": "folk", "confidence": "certain", "usage_note": "The everyday Assamese word: the dictionary's own definition of উল্কা ulkā (p. 140) ends by equating it with পপীয়া তৰা. A meteor is bad luck made visible, and the name says so.", "quote": "পপীয়া papīẏā [সং. পাপ] বিণ. পাপী; অধৰ্ম্মী; sinful. পপীয়া-তৰা বি. উল্কা; a meteor; a shooting-star.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. পপীয়া papīẏā, sub-lemma পপীয়া-তৰা, p. 575", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%AA%E0%A6%AA%E0%A7%80%E0%A7%9F%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": "The DSAL headword index encodes this lemma's য় with the precomposed BENGALI LETTER YYA (U+09DF); the source_url above uses that encoding, and a query typed with য + nukta returns nothing. The lemma is also absent from DSAL's page-level browse of p. 575. Also attested a century earlier, in the same spelling minus the long ī: Bronson (1867), p. 72, glosses উল্কাপাত with পপিয়া তৰা. Bronson's Assamese can only be read off the page images; the archive.org OCR of this dictionary's script is noise."}, {"language": "Bengali", "region": "Bengal", "name_native": "তারা খসা", "name_roman": "tārā khasā", "literal_meaning": "'a star slipping loose'", "register": "folk", "confidence": "certain", "usage_note": "Dāsa defines the Sanskrit উল্কাপাত by this ordinary Bengali phrase and by nothing else.", "quote": "̃পাত -বি, তারা খসা। ̃পিণ্ড-বি, উল্কাশ্ম meteor.", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. উল্কা ulkā, sub-lemma ̃পাত, p. 349", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=349", "notes": "খসা is the verb used of a thing coming unfastened and slipping down; the same verb is used of a miscarriage (গা খসা). Bengali has no 'falling' in the phrase, only 'coming loose'."}, {"language": "Hindi", "region": "Hindustani generally", "name_native": null, "name_roman": "ākās-agan-golā", "literal_meaning": "'sky-fire-ball'", "register": "folk", "confidence": "certain", "usage_note": "A three-word descriptive compound, entirely vernacular in its material. Beside it Platts records the simple idiom tārā ṭūṭnā, 'a star to shoot' (p. 304), and the Hindi luk (p. 958, from S. ulkā) 'a fiery phenomenon in the sky; meteor; falling star'.", "quote": "ākās-agan-gola, s.m. Meteor, shooting-star", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. ākās, p. 64", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=64", "notes": "Compound in roman only. On the beliefs attached: Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 82, reports that a falling star means a great man's soul is passing through the air, and that people thrust five fingers into their mouths to keep their own souls from joining it."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ఆదోకపాటు", "name_roman": "ādōka-pāṭu", "literal_meaning": "falling like a cow's tail", "register": "folk", "confidence": "certain", "usage_note": "Not a name for a body but the idiom for the motion: a meteor falls 'cow-tail-wise', i.e. slanting and tapering.", "quote": "ఆదోకగా [Tel. ఆవు+తోక] adv. Like a cow's tail. Slanting, in a slanting form, taperingly; conical, pyramidical A. iii. 30. నక్షత్రము ఆదోకపాటుగా పడుచున్నది the shooting star passes in a slanting direction.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ఆదోకగా ādōka-gā, p. 114", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=114", "notes": "Included because it is a genuinely observational vernacular usage rather than a nomenclature item; the head-word is ādōka-gā, and ādōka-pāṭu is the form in the illustrative sentence. Brown's etymology āvu + tōka 'cow + tail' is printed in the entry."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Sukum, Sukir, Huko, Tara; Sukum Pelkta, Huko Pelkat, Tara Urungta", "literal_meaning": "star; star excreta", "register": "tribal", "confidence": "certain", "usage_note": "Meteors are the excrement of the stars, or in some villages souls falling back from their holy places in the sky.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The star-excrement idiom is shared verbatim with Santali (ipil ic') and Mundari (ipilko ic'), across a Dravidian/Munda language boundary."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "chir'u bīnkō; cherkā bīnkō", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Chir'u. Chir'u binko, shooting star", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. chir'u, p. 164; s.v. bīnkō, p. 85", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "Kurukh does not share the Munda 'star excrement' idiom for meteors; Grignard's other phrase is simply 'there, a star is shooting'."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "ipilko ic'", "literal_meaning": "the excrements of the stars", "register": "tribal", "confidence": "certain", "usage_note": "Most noticeable about the middle of November, when the threshing floors are made and must be watched at night. 'Tonight the stars have many evacuations.'", "quote": "They call them ipilko ic', the excrements of the stars! ... Remember that the stars are living beings, the children of the moon.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": null}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Ipil ic'", "literal_meaning": "star excrement", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Ipil ic'kedae. The star voided excrement. (A shooting star is regarded as the excrement of another star.)", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Ic', p. 244", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "The identical explanation is recorded for Mundari (ipilko ic', Hoffmann) and for Gondi (sukum pelkta, Vahia & Halkare). It follows from the belief that the stars are living beings."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಉಲ್ಕಾಪಾತ", "name_roman": "ulkāpāta", "literal_meaning": "the falling of a firebrand", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಉಲ್ಕಾಪಾತ ulkā-pāta. falling of a star, meteor-shoot. (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಉಲ್ಕಾಪಾತ ulkāpāta, p. 257", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=257", "notes": "No vernacular Kannada meteor word surfaced. Telugu, by contrast, has the folk idiom ādōka-pāṭu 'falling cow-tail-wise' (Brown p. 114)."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഉല്ക", "name_roman": "ulka", "literal_meaning": "'firebrand'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ഉല്ക ulka ulγa S. Meteor, firebrand.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഉല്ക ulka, p. 144", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%89%E0%B4%B2%E0%B5%8D%E0%B4%95&searchhws=yes&matchtype=exact", "notes": "Exactly parallel in sense to native കൊളളിമീന്‍ / കൊളളി — both languages built the meteor word on 'firebrand'."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "तारा", "name_roman": "tārā", "literal_meaning": "star", "register": "sanskritic", "confidence": "certain", "usage_note": "तारे तुटणें, 'the stars break off', is the Marathi idiom for meteors", "quote": "तारा tārā m S A star. 2 The pupil of the eye. 3 A meteor, a falling star. v तुट. 4 A firework, a kind of rocket.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. तारा, p. 377", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A4%E0%A4%BE%E0%A4%B0%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "The Sanskrit word, but Molesworth's idiom तारे तुटणें is Marathi and shows the vernacular conception of a meteor as a star snapping loose."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "උල්කාව", "name_roman": "ulkāva", "literal_meaning": "'firebrand'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "උල්කාව ulkāva , n. flame, firebrand, විලක්කුව, උල්පන් දම; meteor.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. උල්කාව ulkāva, p. 128; Jayatilaka (ed.), A Dictionary of the Sinhalese Language (Royal Asiatic Society, Ceylon Branch, 1935– ), s.v. උල්කාව ulkāva, p. 1909", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=meteor&matchtype=default", "notes": "Sanskrit ulkā, the same word Malayalam has as ഉല്ക, and with the same 'firebrand' base sense. The native counterpart survives only as a gloss, not a headword: Carter's උල්කා ගල 'meteorite' (p. 128) is glossed with Sinhala තරුගල tarugala, literally 'star-stone', which is not itself a Carter headword. Carter also records the omen term දික්·හදාය dik·hadāya, 'fiery meteor, regarded as one of the five evil omens of the sky' (p. 284)."}]}, {"key": "star-generic", "title": "'Star' as a word", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "—", "bayer": "—", "constellation": "—"}, "sanskrit_db_id": "tara", "names": [{"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಅಱಿಲ್", "name_roman": "aṟil", "literal_meaning": null, "register": "vernacular", "confidence": "certain", "usage_note": "A second, purely Dravidian, classical Kannada star-word; obsolete in the modern language and known mainly from the old lexicons Kittel cites.", "quote": "ಅಱಿಲ್ ar̤il. 1. = ಅಱಲು. a star (ನಕ್ಷತ್ರ Śmd. II; ಮೀನ್, ತಾರಗೆ, ನಕ್ಷತ್ರ Kk. 10 b.; ಮೀನ್, ನಕ್ಷತ್ರ 80; ಮೀನ್, ತಾರೆಗೆ, ತಾರೆ, ತಾರಕೆ Śm. 16. 106). -ಅಱಿಲ್ವಟ್ಟೆ. -ಬಟ್ಟೆ the star-road: the sky (ಮೀನ್ವಟ್ಟೆ etc., ಆಕಾಶ Kk. 12; ಅಮ್ಬರ, ಬಾನ್, ಎಲರ್ವಟ್ಟೆ, ಆಗಸ, ಸಗ್ಗಿಗವಟ್ಟೆ Śm. 14).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಅಱಿಲ್ aṟil 1, p. 105", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=105", "notes": "HOMONYM: Kittel's very next headword ಅಱಿಲ್ 2 is 'mud, clay'. The compound aṟil-vaṭṭe 'star-road = sky' is the Kannada twin of Telugu cukkala-teruvu."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಚಿಕ್ಕಿ", "name_roman": "cikki", "literal_meaning": "spot, speck, dot", "register": "vernacular", "confidence": "certain", "usage_note": "The colloquial modern Kannada word (also ಚುಕ್ಕಿ cukki, ಚುಕ್ಕೆ cukke, ಚಿಕ್ಕೆ cikke), cognate with Telugu cukka.", "quote": "ಚಿಕ್ಕಿ cikki. 2. = ಚಿಕ್ಕೆ, ಚುಕ್ಕಿ, ಚುಕ್ಕೆ. a spot, a speck, a dot, as that of a cat, of a leopard, of a horse, of a cloth, etc. (C.). 2, a star (C.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಚಿಕ್ಕಿ cikki 2, p. 643", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=643", "notes": "COGNATE PAIR with Telugu చుక్క cukka, and with the same dot/star polysemy in both languages. Kittel's parallel entry ಚುಕ್ಕೆ cukke (p. 653) reads 'a small mark, a dot, etc. (My.; Te.; T. ಚುಕ್ಕೈ, a star)' — i.e. he marks the star sense as Tamil and Telugu, the dot sense as the Kannada default."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಮೀನ್", "name_roman": "mīn", "literal_meaning": "fish", "register": "vernacular", "confidence": "certain", "usage_note": "The classical Kannada word for a star is the word for a fish. Kittel's own guess at the motivation is printed in the entry.", "quote": "ಮೀನ್ mīn. 2. (= ಮೀನ್ 1, a fish of the sky-ocean ?). = ಮೀಮ್ 2. a star (ನಕ್ಷತ್ರ Śmd. II; ತಾರಗೆ Ct. I, 46; ಅಱಿಲ್, ತಾರಗೆ, ನಕ್ಷತ್ರ Kk. 10b; ಅಱಿಲ್, ನಕ್ಷತ್ರ 80; ಅಱಿಲ್, ತಾರಗೆ, ತಾರೆ Śm. 16; ಭಗಣ 99 …) 2, glittering … — ಮೀನ್ಗಳೆಱೆಯ. -ಎಱೆಯ. the moon … — ಮೀನ್ವಟ್ಟೆ. -ಬಟ್ಟೆ. the sky (ಆಕಾಶ Kk. 12).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಮೀನ್ mīn 2, p. 1328", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1328", "notes": "The most important non-Sanskrit sky-word in Kannada. It is the same mīn that Tamil uses for star, and it has no Sanskrit counterpart at all — the Sanskrit db id given is only the semantic equivalent nakṣatra, which is how Kittel's Kannada nighaṇṭu sources gloss it. Telugu kept mīnu strictly as 'fish': Brown p. 996 gives no astronomical sense for it except in the compound mīnu-rūpu-rikka (Revatī)."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "മീന്‍", "name_roman": "mīn", "literal_meaning": "'fish'; also 'that which glitters' (Gundert derives it from മിന്‍ 'to glitter')", "register": "vernacular", "confidence": "certain", "usage_note": "The inherited Dravidian word for a star. It is the productive element in the vernacular sky vocabulary: കൊളളിമീന്‍ meteor, വാല്‍മീന്‍ comet, വെണ്മീന്‍/വെഴ്മീന്‍/പെരുമീന്‍ Venus.", "quote": "മീന്‍ mīn‍ mīǹ 5. (VN. of മിന്‍ ) glittering, sparkling. 1. A fish ... 2. a star. മീ. വീഴുക a meteor.", "citation": "Gundert, A Malayalam and English Dictionary (Mangalore, 1872), s.v. മീന്‍ mīn, p. 822", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%AE%E0%B5%80%E0%B4%A8%E0%B5%8D%E2%80%8D&searchhws=yes&matchtype=exact", "notes": "Homonymy of 'fish' and 'star' is pan-Dravidian and is the semantic engine behind almost every native Malayalam sky-name below. Gundert's own etymology ties both senses to മിന്‍ 'glitter', so the star sense need not be metaphorical from the fish."}, {"language": "Odia", "region": "Odisha", "name_native": "ତରା / ତାରା", "name_roman": "tarā / tārā", "literal_meaning": "'star'", "register": "vernacular", "confidence": "certain", "usage_note": "Odia distinguishes the worn-down ତରା tarā, which is what all the folk compounds in this file are built on (khachuā tarā, phukiā tarā, keuñṭi tārā, lañjā tārā), from the tatsama ତାରକା tārakā, whose second sense is 'comet' — ଲଞ୍ଜା ତାରା.", "quote": "ସଂ. ବି. ସ୍ତ୍ରୀ (ତାରକ+ସ୍ତ୍ରୀ. ଆ)— 1। ନକ୍ଷତ୍ର— 1. Star. 2। ଲଞ୍ଜା ତାରା—2. Comet. 3। ଚକ୍ଷୁର ତାରା; କନୀନିକା— 3. The pupil of the eye.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ତାରକା Tārakā, p. 3445", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A4%E0%AC%BE%E0%AC%B0%E0%AC%95%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "තරුව", "name_roman": "taruva", "literal_meaning": "also 'tree' and 'pupil of the eye'", "register": "vernacular", "confidence": "certain", "usage_note": "The productive native element in the Sinhala sky vocabulary: පහන් තරුව morning star, ඉරබටු තරුව evening star, කළමුනිදුතරුව Canopus, වල්ගාතරුව comet, තරුගල 'star-stone' meteorite.", "quote": "තරුව taruva , n. tree, ගහ; star, තාරකාව; pupil of the eye, කළු ඉංගිරියාව; pl. තරු.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. තරුව taruva, p. 253", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=star%2C%20%E0%B6%AD%E0%B6%BB%E0%B7%94%E0%B7%80&matchtype=default", "notes": "Sinhala's answer to Malayalam മീന്‍: the inherited word that does the compounding work while the Sanskrit synonym තාරකා tārakā stays learned. Carter's native constellation words are built on it — තරු·වැළ taru·væḷa 'cluster or string of stars, constellation' and තරු·පොකුර taru·pokura 'cluster of stars, asterism' (both p. 253)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மீன்", "name_roman": "mīṉ", "literal_meaning": "'the shining one', from miṉṉu- 'to flash, glitter'", "register": "vernacular", "confidence": "certain", "usage_note": "The ordinary Tamil word for star from the Caṅkam period to the present, and the base of nearly every indigenous Tamil star-name. Winslow adds the colloquial மீன் முளைத்திருக்கிறது 'stars appear', marked 'Vulgar usage', and the proverb மதியை மீன் சூழ்ந்ததுபோல 'as the stars surround the moon'.", "quote": "மீன்¹ mīṉ , n. < மின்னு-. [K. mīn.] 1. Star; நட்சத்திரம். பதியிற் கலங்கிய மீன் (குறள், 1116).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மீன்¹, vol. VI p. 3214; quoting Tirukkuṟaḷ 1116", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "HOMONYM, the central one for this file. The Lexicon prints two separate headwords on the same page: மீன்¹ mīṉ 'star', derived from the Tamil verb மின்னு- 'to flash', and மீன்² mīṉ 'fish; Pisces of the zodiac; shark', which it derives from Sanskrit mīna. Burrow and Emeneau keep them apart on the same principle but treat both as Dravidian: DEDR 4876 gives Ta. miṉ 'flash, glitter, lightning' … mīṉ 'star', with Ma. mīn, Ko. mi·n, To. mi·n, Ka. mīn, Kur. bīnkō, Malt. bínḍke 'star'; DEDR 4885 gives Ta. mīṉ 'fish' with cognates in every Dravidian branch, i.e. the fish-word is not a Sanskrit loan either. The two are homophones of independent Dravidian origin. Every -mīṉ entry below therefore needs its astronomical sense shown from context, and the fish sense excluded; the Lexicon's own definitions do that here. Verified at https://dsal.uchicago.edu/cgi-bin/app/burrow_query.py?page=435 and .../burrow_query.py?page=436. Senses 2 and 3 of மீன்¹ also make the bare word a name for the 14th nakṣatra (Cittirai) and the 13th (Attam)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "விண்மீன்", "name_roman": "viṇ-mīṉ", "literal_meaning": "sky-star", "register": "vernacular", "confidence": "certain", "usage_note": "The standard modern Tamil word for a star, distinguishing it unambiguously from mīṉ 'fish'. The Lexicon records the colloquial contraction விம்மீன் vimmīṉ, marked 'Loc.'", "quote": "விண்மீன் viṇ-mīṉ , n. < id. + மீன்¹. Star; நட்சத்திரம். (சூடா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. விண்மீன், vol. VI p. 3665, citing the Cūṭāmaṇi Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AE%BF%E0%AE%A3%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Parallel formations with the same sense: வான்மீன்¹ vāṉ-mīṉ 'heaven-star' (p. 3626, from the aruñcolpporuḷ commentary on Puṟanāṉūṟu) and மோட்டுமீன் mōṭṭu-mīṉ (p. 3383, citing Cīvakacintāmaṇi 2325). வான்மீன்¹ must not be confused with வான்மீன்² = வால்மீன் 'comet' on the same page — the difference is வான் 'sky' against வால் 'tail'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "చుక్క", "name_roman": "cukka", "literal_meaning": "dot, spot, drop", "register": "vernacular", "confidence": "certain", "usage_note": "The ordinary Telugu word for a star, and the second element of most of the language's own star-names (X-cukka). Brown lists the astronomical sense third, after 'mark' and 'drop'.", "quote": "చుక్క [Tel.] n. Any small mark; a dot or spot: a drop, a small quantity of liquid. బొట్టు. The round mark (తిలకము) worn on the forehead by Hindus. A star, నక్షత్రము. The planet Venus, శుక్రుడు. A pip on the dice or cards. A comet. తోకచుక్క.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. చుక్క ṭsukka, p. 449", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=449", "notes": "HOMONYM WARNING. cukka is 'dot / spot / drop' before it is 'star', and in ordinary Telugu prose the non-astronomical sense is far commoner (cukka-boṭṭu 'forehead mark', cukkani 'rudder'). Brown's entry is quoted at length precisely because the string 'A star, నక్షత్రము. The planet Venus, శుక్రుడు' inside it is what fixes the astronomical sense. Kannada ಚುಕ್ಕೆ cukke / ಚಿಕ್ಕಿ cikki is the exact cognate and carries the same ambiguity."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "మెరుగురిక్క", "name_roman": "merugu-rikka", "literal_meaning": "the shining star", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "మెరుగురిక్క or మెరుగుడురిక్క merugu-rikka. n. Coral. పగడము. A bright star, కాంతిగలచుక్క.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. మెరుగు merugu, p. 1031", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1031", "notes": "Not an identified object. Recorded because it corroborates pagaḍapu-rikka (Ārdrā, 'the coral star'): Brown here has one word meaning both 'coral' and 'a bright star', which shows that in Telugu the coral image and stellar brilliance were interchangeable."}, {"language": "Urdu", "region": "Urdu, from Persian", "name_native": "ستاره", "name_roman": "sitāra", "literal_meaning": "'star'; by extension 'fortune, destiny'", "register": "vernacular", "confidence": "certain", "usage_note": "The Persian counterpart of tārā, cognate with it through Indo-Iranian - Platts gives the etymology explicitly. It carries the fortune-telling vocabulary: sitāra-shinās 'astrologer', sitāra chamaknā 'for one's star to shine'. Alongside it Urdu has Arabic najm and kaukab and Persian aḵẖtar, all glossed simply 'a star; constellation'.", "quote": "P ستاره sitāra [Pārsī śtār, śtāra; Pehl. śtār, śtārak; Zend śtare; S. स्तर्], s.m. A star; fortune, fate, destiny ... sitāre-o-burj, s.m. The constellations and the fixed stars.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. sitāra, p. 637", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=637", "notes": "aḵẖtar at Platts p. 29, najm at p. 1125, kaukab at p. 863; burj, 'a sign of the zodiac; asterism, constellation', at p. 145, and in Punjabi as ਬੁਰਜ burj (Maya Singh 1895, p. 174)."}, {"language": "Ho", "region": "Kolhan, Singhbhum, Jharkhand", "name_native": null, "name_roman": "ipil (dual ipilkiŋ, plural ipilko)", "literal_meaning": "star", "register": "tribal", "confidence": "certain", "usage_note": "Burrows uses the word as his paradigm for the animate noun class, alongside 'man'.", "quote": "ipil - a star, ipilking - two stars, ipilko - three or more stars ; but daru - one or more trees", "citation": "Burrows, Ho Grammar, with Vocabulary (1915), on the animate and inanimate noun classes", "source_url": "https://archive.org/download/hogrammarwithvoc00burruoft/hogrammarwithvoc00burruoft_djvu.txt", "notes": "Included because it is grammatical evidence for the belief the ethnographers record separately: in Ho, as in Mundari and Santali, stars belong to the animate class along with people and animals, while trees do not. The dual in the Mundari star names (cuṭu ipilkiŋ, jarom ipilkiŋ) is the same category at work."}, {"language": "Khasi", "region": "Khasi and Jaintia hills, Meghalaya", "name_native": null, "name_roman": "khlur (abbreviated 'lur)", "literal_meaning": "star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Khlur, u, n. a star.", "citation": "Nissor Singh, Khasi-English Dictionary (1906), s.v. Khlur, p. 33; s.v. 'lur, p. 120", "source_url": "https://archive.org/download/khasienglishdict00singrich/khasienglishdict00singrich_djvu.txt", "notes": null}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "bīnkō", "literal_meaning": "star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "bīnkō S. star.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. bīnkō, p. 85", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": null}, {"language": "Hindi", "region": "Hindustani generally", "name_native": "तारा / تارا", "name_roman": "tārā", "literal_meaning": "'star'; also 'the pupil of the eye'", "register": "sanskritic", "confidence": "certain", "usage_note": "The workhorse word, and the base of most compound names in this file (guććhā tārā, quṭbī tārā, ujāle-kā tārā, dhurū tārā, dum kā tārā, tapt tārā). Platts's sub-entries are a small ethnography in themselves: tārā ṭūṭnā 'a star to shoot', tāre ginnā 'to count the stars, to get no sleep', tāroṅ-kī chān 'daybreak', din-ko tāre dikhānā 'to show one stars by daylight, to beat severely'.", "quote": "H تارا तारा tārā [S. तार (for स्तार)+कं; and S. तारा fem.], s.m. A star; planet; falling star, meteor; the pupil of the eye", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. tārā, p. 304", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=304", "notes": "Punjabi ਤਾਰਾ tárá, 'A star', in Maya Singh (1895), p. 1106."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ತಾರಗೆ", "name_roman": "tārage", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Tadbhava of tārakā, thoroughly naturalised; forms the compound tārage-vaṭṭe 'the starry path, the sky'.", "quote": "ತಾರಗೆ tārage. Tbh. of ತಾರಕೆ. a star (ಮೀನ್ Ct. I, 46; ತಾರಕಿ II, 13; ಮೀನ್, ಅಱಿಲ್, ನಕ್ಷತ್ರ Kk. 10b; ಮೀನ್, ಅಱಿಲ್, ತಾರೆ Śm. 16 …). 2, one of the lunar mansions (ಮೃಗ, ನಕ್ಷತ್ರ Nn. 81). 3, another lunar mansion (ಪುಷ್ಯ, ನಕ್ಷತ್ರಭೇದ 130). -ತಾರಗೆಯಾಳ್ಮ. -ಆಳ್ಮ. the moon (Śm. 15). -ತಾರಗೆವಟ್ಟೆ. -ಬಟ್ಟೆ. the starry path, the sky (ಆಗಸ Śmd. II; Kk. 88).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ತಾರಗೆ tārage, p. 752", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=752", "notes": "Kittel records that some nighaṇṭus use ತಾರಗೆ as a name for particular nakṣatras — Mṛgaśiras in one, Puṣya in another. Those secondary uses are unusual and are not treated here as separate entries."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಉಡು", "name_roman": "uḍu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಉಡು uḍu. a star. 2, water. (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಉಡು uḍu 6, p. 225", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=225", "notes": "HOMONYM: Kittel has six headwords ಉಡು on this page — 'to wrap round the waist', 'the waist', 'iguana' and so on. Only the sixth is the star."}, {"language": "Konkani", "region": "South Kanara / Mangalore", "name_native": null, "name_roman": "neketru", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "Star, s, neketru, -ra, «., pr. fg.", "citation": "A. F. X. Maffei, An English-Konkani Dictionary (Mangalore: Basel Mission Press, 1883), s.v. Star, p. 455", "source_url": "https://archive.org/details/anenglishkonkan00bygoog", "notes": "Sanskrit nakṣatra in Konkani phonology, the ordinary word for a star. The '«' is an OCR artefact for 'n.' (neuter); 'pr. fg.' is Maffei's mark for a word used both properly and figuratively. Maffei's entry for Constellation (p. 85) is built on the same stem: 'Constellation, s. neketra[ñ]chi ras' — nakṣatra + rāśi — where the scan garbles the genitive plural."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "தாரகை", "name_roman": "tārakai", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit tārakā in Tamil form; the collective தாராகணம் tārā-kaṇam and தாரகாகணம் tārakā-kaṇam are the Tamil terms for a constellation or star-cluster.", "quote": "தாரகை¹ tārakai , n. < tārakā. 1. Star; நட்சத்திரம். நாப்பண்வண் டாரகைபோல் (திருக்கோ. 116). 2. Apple of the eye; கண்மணி. (யாழ். அக.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. தாரகை¹, vol. III p. 1843; quoting Tirukkōvaiyār 116", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A4%E0%AE%BE%E0%AE%B0%E0%AE%95%E0%AF%88&searchhws=yes&matchtype=exact", "notes": "HOMONYM: sense 2 is 'apple of the eye', and தாரகை² is 'earth'. For 'constellation, cluster of stars' the Lexicon gives தாராகணம் (p. 1844, quoting Nāṉmukaṉ Tiruvantāti 63) and தாரகாகணம் (p. 1843)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "உடு", "name_roman": "uṭu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit uḍu in Tamil phonology, a learned word of the nikaṇṭus rather than of speech. Winslow glosses it simply 'A star, விண்மீன்'.", "quote": "* உடு³ uṭu , n. < uḍu. Star; நட்சத்திரம். (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. உடு³, vol. I p. 399, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%89%E0%AE%9F%E0%AF%81&searchhws=yes&matchtype=exact", "notes": "HOMONYM warning: the Lexicon prints six உடு headwords on the same page — 'ditch, moat', 'goat, sheep' (< huḍu), 'arrow, arrow-head, feather of an arrow, boatman's pole' (< huḍa), and a tree. Only உடு³ is astronomical, and the Lexicon marks it with an asterisk as a Sanskrit loan."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "తార", "name_roman": "tāra", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The learned word beside native cukka; the derivative tārā-pathamu 'starry path' is the standard Telugu word for the firmament.", "quote": "తార [Skt.] n. A star. నక్షత్రము. The pupil of the eye, కనుగ్రుడ్డు, కనీనిక. … తారాపథము tārā-pathamu. n. The starry path, i.e., the firmament. ఆకాశము. తారావళి tārā-vaḷi. n. A constellation, or set of stars. The starry firmament.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. తార tāra, p. 523", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=523", "notes": "Telugu tārā-pathamu is the direct counterpart of Sanskrit tārāpatha (db id 'tarapatha'). Brown flags the word [Skt.], i.e. tatsama."}]}, {"key": "venus", "title": "Venus", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Venus", "bayer": null, "constellation": null}, "sanskrit_db_id": "tara", "names": [{"language": "Bengali", "region": "Bengal", "name_native": "শুকতারা", "name_roman": "śukatārā (Śuktārā)", "literal_meaning": "'Śukra-star' — a worn-down compound of Śukra (Venus) + tārā (star)", "register": "vernacular", "confidence": "certain", "usage_note": "Biswas glosses it 'the vesper', i.e. the EVENING star, although in ordinary Bengali speech শুকতারা is most often the MORNING star and সন্ধ্যাতারা the evening one. Praharaj, listing Bengali equivalents for his Odia headwords, prints শুকতারা against BOTH ପାହାନ୍ତି ତାରା (morning) and ପହରିକିଆ ତାରା (evening). The divergence is real and old; the underlying object is the same planet.", "quote": "শুকতারা śukatārā n. the vesper; (astr.) Venus.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. শুকতারা śukatārā, p. 950", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%B6%E0%A7%81%E0%A6%95%E0%A6%A4%E0%A6%BE%E0%A6%B0%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": "Contrast the tatsama শুক্র śukra at the same page, glossed '(astr.) the Venus; the vesper'. শুকতারা is the tadbhava household form."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಬೆಳ್ಳಿ", "name_roman": "beḷḷi", "literal_meaning": "silver", "register": "vernacular", "confidence": "certain", "usage_note": "The everyday Kannada name for Venus is simply the word for silver.", "quote": "ಬೆಳ್ಳಿ beḷḷi. the white metal: silver … Tu. ಬೊಳ್ಳಿ; T., M. ವೆಳ್ಳಿ, ಬೆಳ್ಳೈ ವೆಳ್ಳೆ; Te. ವೆಲ್ಲೆ, ವೆಣ್ಡಿ). … 2, the planet Venus (My.; T., M. ವೆಳ್ಳಿ).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಬೆಳ್ಳಿ beḷḷi, p. 1217", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1217", "notes": "The most clearly Dravidian planet-name in this file: Kittel's own comparative note shows the star sense is shared with Tamil and Malayalam veḷḷi. Telugu, per Kittel's same note, kept only the metal sense
