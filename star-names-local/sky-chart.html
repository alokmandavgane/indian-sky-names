 (వెల్లి / వెండి) and names Venus instead with vēgu-cukka or with reflexes of Śukra. So this is a Dravidian sky-word that Kannada kept and Telugu lost — the mirror image of the mīn case."}, {"language": "Kodava", "region": "Kodagu (Coorg)", "name_native": "ಬೊಳ್ಳಿಳಾಚೆ", "name_roman": "boḷḷiáche", "literal_meaning": "'Venus-day' (boḷḷi + ಆಚೆ áche 'a day')", "register": "vernacular", "confidence": "likely", "usage_note": "The Kodava weekday name, in a list where Sunday and Monday are likewise built on native words for sun and moon while Tuesday, Wednesday, Thursday and Saturday are Sanskrit planet-names.", "quote": "ನಾರಾಚೆ nárắche, Sunday. ತಿಂಗಳಾಚೆ tingaḷáche, Monday. ಚೊವುಳಚೆ chovuáche, Tuesday. ಪೊದನಾಚೆ podanáche, Wednesday. ಬೇಳಾಚೆ béḷáche, Thursday. ಬೊಳ್ಳಿಳಾಚೆ boḷḷiáche, Friday. ಚನಿಳಚೆ chaniáche, Saturday.", "citation": "Cole, An Elementary Grammar of the Coorg Language (Bangalore, 1867), 'Days', p. 136", "source_url": "https://archive.org/download/CoorgGrammar/Coorg%20Grammar_djvu.txt", "notes": "Cole glosses the first two names himself — nárắche from nárayaṇa 'a name of the deity used also for the sun', tingaḷáche from tingaḷu 'the moon' — but does not gloss boḷḷi; the Venus sense comes from DEDR 5496, where every close cognate (Ta. veḷḷi, Ka. beḷḷi, To. piḷy, Ko. veyḷ) means 'silver, Venus, Friday' together. Marked 'likely' for that inferential step and because the OCR of Cole's Kannada is poor: the romanizations are Cole's own, the script as reconstructed from the scan. Cole's grammar contains NO Kodava word for 'star' anywhere, including its vocabulary (pp. 51–71)."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "വെള്ളി", "name_roman": "veḷḷi", "literal_meaning": "'silver'", "register": "vernacular", "confidence": "certain", "usage_note": "Simultaneously 'silver', 'Venus' and 'Friday' — the planet names the weekday, as in വെള്ളിയാഴ്ച Friday, which Gundert notes is the day 'when women & cows must not journey'.", "quote": "വെള്ളി veḷḷi veḷḷi T. M. C. (Tu. boḷḷi, Te. veṇḍi). 1. Silver ... 2. Venus; Friday = ശൂക്രന്‍.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. വെള്ളി veḷḷi, p. 987", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%B5%E0%B5%86%E0%B4%B3%E0%B5%8D%E0%B4%B3%E0%B4%BF&searchhws=yes&matchtype=exact", "notes": "Gundert gives the Dravidian cognate set in the same line — Tamil/Malayalam/Kannada veḷḷi, Tulu boḷḷi, Telugu veṇḍi — establishing the word as inherited, not borrowed. The 'silver' → 'Venus' → 'Friday' chain is independent of Sanskrit śukra, which Malayalam also has (ശുക്രന്‍, p. 1017) as a learned doublet. Gundert's line is evidence for the Tulu form boḷḷi in the sense 'silver'; he does not there assign Tulu the planet sense."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "വെണ്മീന്‍", "name_roman": "veṇmīn", "literal_meaning": "'white star' (വെണ്‍ white + മീന്‍ star)", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "വെണ്മീന്‍ V2. Venus = വെള്ളി .", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. വെണ്‍ veṇ, p. 981", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=981", "notes": "A second native Venus name, transparently 'the white star', marked V2 (an older Malabar vocabulary). Gundert prints a further variant വെഴ്മീന്‍ veḻmīn at the end of the വെള്ളി article, p. 987: 'വെഴ്മീന്‍ = വെള്ളി 2., V1.'"}, {"language": "Marathi", "region": "Maharashtra", "name_native": "चटकचांदणें", "name_roman": "caṭakacāndaṇēṃ", "literal_meaning": "brilliant moonlight", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "चटकचांदणें caṭakacāndaṇēm n Bright moon-shine. 2 Applied often to the shining of Venus.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. चटकचांदणें, p. 268", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%9A%E0%A4%9F%E0%A4%95%E0%A4%9A%E0%A4%BE%E0%A4%82%E0%A4%A6%E0%A4%A3%E0%A5%87%E0%A4%82&searchhws=yes&matchtype=exact", "notes": "The nearest Marathi comes to a distinct name for Venus as an object of ordinary observation. Note what is NOT in Molesworth: no morning-star or evening-star name at all. A full-text search of the dictionary for 'morning star' and 'evening star' returns nothing; Venus appears only as the planet शुक्र (p. 795), its corrupt form सूक (p. 865, 'Corr. of शुक्र S'), and the technical rising/setting vocabulary पूर्वोदय, पश्चिमास्त etc."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வெள்ளி", "name_roman": "veḷḷi", "literal_meaning": "the white one, the silver one (from veṇ-mai 'whiteness')", "register": "vernacular", "confidence": "certain", "usage_note": "THE central Caṅkam sky-word. Venus quitting its proper station and moving to the southern quarter is the standard Tamil omen of drought and failed kingship; Puṟanāṉūṟu 35 makes the good king's land yield even so.", "quote": "அலங்குகதிர்க் கனலி நால்வயின் தோன்றினும்,\nஇலங்குகதிர் வெள்ளி தென்புலம் படரினும்,", "citation": "Puṟanāṉūṟu 35, ll. 6-7 (by Veḷḷaikkuṭi Nākaṉār, on Cōḻaṉ Kuḷamuṟṟattut Tuñciya Kiḷḷivaḷavaṉ); Project Madurai e-text PM 0057", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0057.html", "notes": "HOMONYM, and one the discipline requires flagging. The Tamil Lexicon (s.v. வெள்ளி¹, vol. VI p. 3794, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%B5%E0%AF%86%E0%AE%B3%E0%AF%8D%E0%AE%B3%E0%AE%BF&searchhws=yes&matchtype=exact) prints ten senses on one headword: '1. Whiteness … 2. Silver, Argentum … 3. A silver coin … 4. Star; நட்சத்திரம் … 5. The planet Venus; சுக்கிரனென்னுங் கோள். இலங்கு கதிர் வெள்ளி தென்புலம் படரினும் (புறநா. 35) … 6. Śukra, the priest of the Asuras … 7. Friday … 9. Ignorance … 10. Semen virile.' Sense 1 is itself quoted from Puṟanāṉūṟu 41 and sense 7 from Cilappatikāram, so the word is ambiguous within the same corpus; the astronomical sense here is fixed by இலங்குகதிர் 'bright-rayed' and by the parallel with கனலி, the sun, in the preceding line. The Lexicon's ஊதுவாரம் (p. 496) makes the pun explicit: 'the Tamil word veḷḷi connoting the metal silver as well as the planet Venus'. Two further Puṟanāṉūṟu attestations of the same omen were verified in the same e-text: 388, l. 1 'வெள்ளி தென்புலத்து உறைய, விளைவயல் / பள்ளம், வாடிய பயன்இல் காலை' (Venus dwelling in the south, the fields withered), and 397, l. 1 'வெள்ளியும் இருவிசும்பு ஏர்தரும்' (Venus rising in the dark sky at dawn). No Sanskrit-database counterpart: the planets are not individually in that database."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "வெண்மீன்", "name_roman": "veṇ-mīṉ", "literal_meaning": "white star", "register": "vernacular", "confidence": "certain", "usage_note": "The opening words of Paṭṭiṉappālai, and the same drought-omen as veḷḷi: 'even if the blameless-famed shining white star should turn from its quarter and go south'.", "quote": "வசையில்புகழ் வயங்குவெண்மீன்\nதிசைதிரிந்து தெற்கேகினும்", "citation": "Paṭṭiṉappālai ll. 1-2 (by Kaṭiyalūr Uruttiraṅkaṇṇaṉār); Project Madurai e-text PM 0077", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0077.html", "notes": "Nacciṉārkkiṉiyar's commentary on these lines glosses the phrase unambiguously: 'வயங்கு வெண்மீன் திசை திரிந்து தெற்கு ஏகினும் - விளங்குகின்ற வெள்ளியாகியமீன் தான் நிற்றற்குரிய வடதிசையினில்லாமல் தென்றிசைக்கண்ணே போகினும்' — 'the shining star that is Veḷḷi, even if it goes to the south instead of standing in its proper northern quarter' (U. Vē. Cāminātaiyar's edition, Project Madurai PM 0479, https://www.projectmadurai.org/pm_etexts/utf8/pmuni0479.html). The Tamil Lexicon (s.v. வெண்மீன், vol. VI p. 3782) glosses it 'Venus; சுக்கிரன்' and cites the line as பட்டினப். 14; the Project Madurai text and Nacciṉārkkiṉiyar's own numbering both place it at ll. 1-2, i.e. the poem's opening couplet, so the Lexicon's line-number appears to follow a different edition or is an error. Recorded as an edition discrepancy rather than silently corrected."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ಬೊಳ್ಳಿ", "name_roman": "boḷḷi", "literal_meaning": "'silver' — from the Dravidian root *veḷ 'white'", "register": "vernacular", "confidence": "certain", "usage_note": "The ordinary Tulu word for a star; also 'silver', 'three annas' and 'a gray ox'.", "quote": "ಬೊಳ್ಳಿ bolli, s. A star. 2. silver. 3. three annas. 4. a gray ox. —ನೂಲು silver thread or girdle.", "citation": "Männer, Tuḷu–English Dictionary (Mangalore, Basel Mission Press, 1886), s.v. ಬೊಳ್ಳಿ boḷḷi, p. 502", "source_url": "https://archive.org/download/tuluenglishdicti00mnrich/tuluenglishdicti00mnrich_djvu.txt", "notes": "THE Tulu star-word, and the only native one. Burrow & Emeneau confirm it independently at DEDR 5496(a), whose Tulu section lists boḷḷi in the senses 'star, silver' among the reflexes of *veḷ 'white' (DSAL p. 499). The cognate set — Ta. veḷḷi 'silver, star, planet Venus, Friday', Ka. beḷḷi 'silver, planet Venus', To. piḷy, Ko. veyḷ, Ma. വെള്ളി — makes 'silver / Venus / Friday' a single inherited Dravidian complex, and Tulu belongs to it. Männer's romanization is 'bolli'; the printed Kannada script has the retroflex ḷ. The OCR of the Kannada in Männer is unusable, so the script here was read from the page image."}, {"language": "Urdu", "region": "Urdu, from Persian/Arabic", "name_native": "زهره", "name_roman": "zǒhra", "literal_meaning": "'the shining one'", "register": "vernacular", "confidence": "certain", "usage_note": "The standard Urdu name of the planet, from the same root as the compliment zǒhra-rū, 'Venus-faced'. Its Persian doublet is nāhīd (Platts p. 1120, from Avestan Anāhitā), and the Persian poets' irreverent name for it, lūlī-i-falak, 'heaven's dancing-girl', is also in Platts (p. 970).", "quote": "P زهره zǒhra (for A. زهرة zǒharat, v.n. fr. زهر 'to shine,' &c.), s.f. (m. ?), The planet Venus: — zǒhra-rū, adj. Like Venus in countenance.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. zǒhra, p. 619", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=619", "notes": "The Panjab list in Panjab Notes and Queries II.521 (p. 84) confirms the split usage: 'Evening Star. Arabic: Zuhrah (evening); náhid, girl with swelling breasts. Persian: Lúlí-i-falak, heaven's fille de joie.'"}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "చుక్కవాలు", "name_roman": "cukka-vālu", "literal_meaning": null, "register": "folk", "confidence": "likely", "usage_note": "Travel omen: a journey begun with this star facing you will go badly.", "quote": "చుక్కవాలు ṭsukka-vālu. n. An evil planet or unlucky star. Particularly of Venus (ఛ?ుక్క, i.e., శుక్రః) for the Hindus believe that every journey will turn out ill if on setting out this star faces them.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. చుక్క ṭsukka, p. 449", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=449", "notes": "Brown's parenthesis is garbled in the DSAL text ('ఛ?ుక్క'); the point he is making is that cukka here is a reshaping of Śukra. Compare Kittel s.v. ಬಾಲ (p. 1173), who cites 'Te. ವಾಲುಚುಕ್ಕೆ, the planet Venus, ಶುಕ್ರ' — the same compound with the elements reversed. Brown's own related sub-entry చుక్కయెదురు 'a star full in front' names the same omen."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Pili", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "The Todas know Venus, which they call Pili, and they also speak of the \"morning star.\"", "citation": "Rivers, The Todas (1906), p. 593", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": null}, {"language": "Hindi", "region": "Hindustani generally; the proverb marked Hin. (Hindu usage) by Fallon", "name_native": "सूक / سوک", "name_roman": "sūk (also suk)", "literal_meaning": "vernacular reflex of Sanskrit Śukra", "register": "sanskritic", "confidence": "certain", "usage_note": "A tadbhava, not a tatsama: Prakrit sukko > Hindi sūk, which also names Friday. Fallon attaches a working rule to it - nothing auspicious is begun while Venus is set (i.e. during its heliocentric conjunction), a piece of practical astrology still observed at weddings.", "quote": "H سوک सूक sūk; E. sukh; A. zohrā , n. m. S. शुक्र The planet Venus. Sūk ḍūbe shubh kāraj nahīṅ karte. Hin. When Venus sets no work should be done.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. sūk, p. 794", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=794", "notes": "Platts has both suk (p. 663) and sūk (p. 699), each 'The planet Venus; — Friday'. Maya Singh, The Panjabi Dictionary (1895), p. 1075, gives Punjabi ਸੂਕ súk and p. 1076 ਸੁੱਕਰ sukkar for the same planet."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಚುಕ್ಕಿ", "name_roman": "cukki", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "A trap for the unwary: Kittel has two homographic headwords ಚುಕ್ಕಿ. The one meaning 'star/dot' is Dravidian; this one, meaning the planet Venus, is a tadbhava of Sanskrit Śukra.", "quote": "ಚುಕ್ಕಿ cukki. Tbh. of ಶುಕ್ರ. Śukra, the planet Venus and the preceptor of the daityas or rākṣasas (My.; ರಕ್ಕಸರ ಓಜ, ಅಸುರ ಗುರು Si. 17). see Prv. s. ತುರುಕ. -ಚುಕ್ಕಿಗುವರ. -ಕುವರ. a son or pupil of Śukra: a daitya", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಚುಕ್ಕಿ cukki 2, p. 653", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=653", "notes": "HOMONYM WARNING, and the reason this database tags register rather than assuming it. Kannada ಚುಕ್ಕಿ cukki 'star' (Dravidian, = Telugu cukka) and ಚುಕ್ಕಿ cukki 'Venus' (< Skt. Śukra) are separate words that fell together. Kittel keeps them as separate numbered headwords on the same page; the Sanskrit-derived one must NOT be counted as a vernacular Venus name. The genuinely vernacular Kannada Venus name is ಬೆಳ್ಳಿ beḷḷi, entered separately."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "Sukura and Sukurani; lagan ipilkiŋ, logon ipilkiŋ", "literal_meaning": "Sukra and Sukrani; the two stars that fix the marriage date", "register": "sanskritic", "confidence": "likely", "usage_note": "In the Hasada country and the Karra police subdivision their close conjunction is read by animists as a very favourable omen for marriages contracted in that month or year — the stars are said to be loving and kissing each other. Elsewhere in Nagpur they are unknown, as is the logon-tol ceremony itself.", "quote": "two stars, Sukura and Sukurani, also called lagan ipilkiŋ, logon ipilkiŋ, which are an evident loan from the Sadans or the Hinduized aborigines, and present the only little touch of astrology discoverable in the star lore of the Mundas", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Flagged sanskritic on Hoffmann's own analysis. He notes that Sukrani exists in no Hindu system: for the Mundas she is whatever bright star or planet happens to sit near Venus in a given year. This is the only astrology Hoffmann found in the whole of Munda sky-lore, and he is emphatic that the Munda 'neither knows, nor cares to know, what a horoscope is'."}]}, {"key": "pole-star", "title": "The pole star", "kind": "star", "ra": 37.95, "dec": 89.26, "modern_star": {"common_name": "Polaris (the pole star)", "bayer": "α Ursae Minoris", "constellation": "Ursa Minor"}, "sanskrit_db_id": "dhruva", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "मेढ", "name_roman": "mēḍha", "literal_meaning": "a forked stake used as a post", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "मेढ mēḍha f A forked stake. Used as a post. Hence a short post generally whether forked or not. Pr. हातीं लागली चेड आणि धर मांडवाची मेढ. 2 The polar star.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. मेढ, p. 664", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A5%87%E0%A4%A2&searchhws=yes&matchtype=exact", "notes": "The best vernacular find for the pole star: an ordinary farmyard word — the forked post that holds up a booth — used for Polaris, the peg the sky is pinned to. It answers the Sanskrit मेढी 'threshing-post' as an image of the pole, but मेढ is the live Marathi noun and Molesworth marks it with no S. Corroborated independently by Vaze (1911), p. 464: 'मेढ mēḍha f A forked stake. The polar star.'"}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "جدي", "name_roman": "jadī", "literal_meaning": "'the kid, the young he-goat'", "register": "vernacular", "confidence": "certain", "usage_note": "The Arabic al-jady, the same word as the zodiac sign Capricorn, used for the pole star itself - a name that pins the star rather than the constellation.", "quote": "A جدي jadī , s.m. A kid; a young he-goat; the sign Capricorn; the star a of Ursa minor, the pole-star.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. jadī, p. 378", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=378", "notes": "Platts's next entry, جدي judai, is the diminutive, glossed simply 'The pole-star'."}, {"language": "Urdu", "region": "Urdu, from Arabic/Persian", "name_native": "قطبي", "name_roman": "quṭbī tārā", "literal_meaning": "'the polar star'", "register": "vernacular", "confidence": "certain", "usage_note": "A hybrid: Arabic quṭb 'pivot, pole' with the Indic word tārā 'star'. The naked Arabic quṭb alone is also used for the pole star (Platts p. 792; Fallon p. 888).", "quote": "P قطبي qut̤bī (rel. n. fr. qut̤b), adj. Of or relating to the north pole; polar: — qut̤bī tārā, s.m. The polar star.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. quṭbī, p. 792", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=792", "notes": "Platts prints only the headword قطبي in script; the compound is roman. Still standard modern Hindi/Urdu (McGregor 1993, p. 204, s.v. क़ुतुब)."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಧ್ರುವಪಾಶ", "name_roman": "dhruvapāśa", "literal_meaning": "the pole-star rope", "register": "folk", "confidence": "certain", "usage_note": "COSMOLOGY. The earth is held up by a rope tied to the pole star.", "quote": "ಧ್ರುವಪಾಶ dhruva-pāśa. the rope by which the earth is suspended from the polar star (My.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಧ್ರುವಪಾಶ dhruvapāśa, p. 877", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=877", "notes": "Registered folk because it is a popular cosmological belief rather than a name for anything, and because Kittel sources it to the Mysore colloquial (My.). It is the Kannada version of the pan-Indian image the Sanskrit database has as meḍhī / medhībhūta, 'the threshing-post to which the sky is tethered' (db id 'medhi') — but reversed: here it is the earth that hangs from the sky."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "मेढेमत", "name_roman": "mēḍhēmata", "literal_meaning": "the doctrine of the pole-star", "register": "folk", "confidence": "certain", "usage_note": "the name of a non-Brahman astrological sect and of its practitioners (मेढेजोशी)", "quote": "मेढेमत mēḍhēmata n (मेढ Polar star, मत Dogma or sect.) A persuasion or an order or a set of tenets and notions amongst the Shúdra-people. Founded upon certain astrological calculations proceeding upon the North star. Hence मेढेजोशी or डौरीजोशी.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. मेढेमत, p. 665", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A5%87%E0%A4%A2%E0%A5%87%E0%A4%AE%E0%A4%A4&searchhws=yes&matchtype=exact", "notes": "Not a star-name but the strongest evidence that मेढ 'pole star' was a living, socially embedded word: a whole non-Brahman divinatory tradition, and a caste-title of village astrologers, is named from it."}, {"language": "Bengali", "region": "Bengal", "name_native": "ধ্রুব", "name_roman": "dhruba", "literal_meaning": "'the fixed one'", "register": "sanskritic", "confidence": "certain", "usage_note": "The entry keeps both the Purāṇic prince and the star in one lemma, and the adjectival sense 'sure, certain, fixed' alongside them.", "quote": "ধ্রুব dhruba n. (myth.) a prince famous for his incomparable devotion to God Hari (হরি); the Pole Star, the Polaris, the North Star, the cynosure, ☐ a. sure, certain; fixed; firm, deep-seated (ধ্রুববিশ্বাস); constant; actual, real (ধ্রুব সত্য).", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. ধ্রুব dhruba, p. 548", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%A7%E0%A7%8D%E0%A6%B0%E0%A7%81%E0%A6%AC&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Dhruva Tara; Mout Tara", "literal_meaning": "Dhruva's star; the umbilical star", "register": "sanskritic", "confidence": "disputed", "usage_note": null, "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Reported in only three of fifteen villages and under a Sanskrit name, which the authors read as a late addition; several villages denied that any such star exists, and one placed it rising at 4 a.m., which Polaris does not do. A useful counterweight to the assumption that every Indian community orients by the pole star — the Mundas ignore it too, and Hoffmann says so explicitly."}, {"language": "Hindi", "region": "Hindustani generally; the ritual is reported for Punjabi Hindus", "name_native": "धुरू / دهرو", "name_roman": "dhurū tārā (dhruv-tārā)", "literal_meaning": "'the fixed star'", "register": "sanskritic", "confidence": "certain", "usage_note": "Fallon's headword form dhurū is the vernacular reduction of Sanskrit dhruva, and he equates it directly with Arabic quṭb - the two layers glossing each other on one line. Ethnographically the star carries a vow: a Punjabi Hindu who salutes Dhrū for forty nights with his turban round his neck is said to learn of his death forty days in advance and to be joined to Dhrū's world after it.", "quote": "H دهرو धुरू dhur'ū; A. qutb , n. m. S. ध्रुव Pole (of the earth). Dhurū tārā. The polar star.", "citation": "S. W. Fallon, A New Hindustani-English Dictionary (Banaras/London, 1879), s.v. dhur'ū, p. 656", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/fallon_query.py?page=656", "notes": "The forty-night vow: Chaina Mall, 'Pole Star - Dhru', Panjab Notes and Queries, vol. II, note 735. Platts, p. 543, gives the tatsama dhruv / dhruv-tārā. The Dhruva legend as told in the North-Western Provinces is summarised by Crooke, The Popular Religion and Folk-lore of Northern India (1896), I. 24-25."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಔತ್ತಾನಪಾದಿ", "name_roman": "auttānapādi", "literal_meaning": "son of Uttānapāda", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಔತ್ತಾನಪಾದಿ auttānapādi. (fr. ಉತ್ತಾನಪಾದ). N. of Dhruva, grandson of the first Manu. 2, the polar star.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಔತ್ತಾನಪಾದಿ auttānapādi, p. 344", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=344", "notes": "Kittel's separate headword ಉತ್ತಾನಪಾದ (p. 230) is glossed 'N. of a star in the little bear', i.e. he distinguishes the father-star from the son-star; the Sanskrit database keeps the same pair ('uttanapada' as a Śiśumāra position, 'auttanapadi' as the pole)."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಧ್ರುವ", "name_roman": "dhruva", "literal_meaning": "fixed, immovable", "register": "sanskritic", "confidence": "certain", "usage_note": "Also ಧ್ರುವನಕ್ಷತ್ರ dhruva-nakṣatra, same page.", "quote": "ಧ್ರುವ dhruva. = ದರುವು, ಧೃವ. fixed, firm, fast, immovable … 3, the polar star; the north pole. 4, the trunk of a lopped tree; a post, stake. 5, a wooden roller used in an oil-mill …", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಧ್ರುವ dhruva, p. 877", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=877", "notes": "HOMONYM: senses 4 and 5 (post, stake, oil-mill roller) are the ordinary Kannada uses; only sense 3 is the star. The shared image of the pole as a fixed post is the same one behind the Sanskrit meḍhī 'threshing-post' in the db."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ധ്രുവം / ധ്രുവന്‍", "name_roman": "dhruvam / dhruvan", "literal_meaning": "'the fixed one'", "register": "sanskritic", "confidence": "certain", "usage_note": "ധ്രുവം കൂട്ടുക is a technical phrase 'to make an astrological calculation'.", "quote": "ധ്രുവം dhruvam dhruvam S. ( ധൃ ) 1. Fixed, abiding; sure ... 3. the polar star ധ്രുവത്തിന്‍റെ പേര്‍ ജലജോയം astrol. ധ്രുവം കൂട്ടുക B. to make an astrological calculation. ധ്രുവന്‍ 1. the polar-star, personified", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ധ്രുവം dhruvam, p. 523", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=523", "notes": "Purely Sanskrit; Gundert records no Dravidian pole-star name for Malayalam. (Thurston, Castes and Tribes of Southern India, vol. I p. 108, records a Dravidian one for the Nilgiri Badagas — 'Aranjoti (the pole-star)', shown to the couple at a wedding — but Badaga is outside this compilation.) The astrological gloss ജലജോയം is obscure."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "ध्रुव", "name_roman": "dhruva", "literal_meaning": "fixed, immovable", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ध्रुव dhruva m (S) The polar star; also the north pole. 2 The twelfth of the twenty-seven astronomical Yog. 3 The introductory stanza of a song.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. ध्रुव, p. 446", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A7%E0%A5%8D%E0%A4%B0%E0%A5%81%E0%A4%B5&searchhws=yes&matchtype=exact", "notes": "The tatsama, and the ordinary modern word (Berntsen, Marathi Teaching Materials, p. 74: 'ध्रुव m. 1. the north star. 2. pole.')."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "धुरु", "name_roman": "dhuru", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "धुरु dhuru m An officer employed in the customs. 2 A caste or an individual of it. 3 (Corr. from ध्रुव S) The polar star.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. धुरु, p. 442", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A7%E0%A5%81%E0%A4%B0%E0%A5%81&searchhws=yes&matchtype=exact", "notes": "The Marathi tadbhava of ध्रुव. Attested far earlier than Molesworth: Tulpule & Feldhaus, A Dictionary of Old Marathi, p. 358, s.v. धुरु, cite it from 13th-14th-century texts — 'ना ना ते केवळ धुरुमंडळ: प्रकाशरूप तेजाची झळाळ RS. 1920; कां ढळे धुरु । उनमळौ पडे मेरु UH. 1652' — so the vernacular form has roughly seven centuries of continuous use."}, {"language": "Odia", "region": "Odisha", "name_native": "ସୌମ୍ୟ ଧ୍ରୁବ / ଯାମ୍ୟ ଧ୍ରୁବ", "name_roman": "Sa̲u̲mya dhruba / J̄āmya dhruba", "literal_meaning": "'the northern Dhruva' and 'the southern (Yama's) Dhruva'", "register": "sanskritic", "confidence": "certain", "usage_note": "A pair coined to hold a fact European astronomy supplied: there are two poles, and only the northern one is visible from India. For the southern, Praharaj records the working substitute — since we cannot see it, the southernmost bright star of the Triśaṅku group above the south pole point is taken to be the south pole star.", "quote": "ଯାମ୍ୟ ଧ୍ରୁବ— J̄āmya dhruba … ବି— ଦକ୍ଷଣ ମେରୁ ଉପରେ ଥିବା ଧ୍ରୁବ ତାରା— The pole star on the south pole. [ଦ୍ର—ଏ ତାରାକୁ ଆମ୍ଭେମାନେ ଦେଖି ପାରୁ ନାହିଁ ବୋଲି ଦକ୍ଷିଣ ଧ୍ରୁବ ବିନ୍ଦୁର ଉପରକୁ ଥିବା ତ୍ରିଶଙ୍କୁ ମଣ୍ଡଳର ଦକ୍ଷିଣତମ ଉଜ୍ଜ୍ୱଳ ତାରାକୁ ଦକ୍ଷିଣ ଧ୍ରୁବ ତାରା ବୋଲି ଧରାଯାଏ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଯାମ୍ୟ ଧ୍ରୁବ J̄āmya dhruba, p. 6820", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AF%E0%AC%BE%E0%AC%AE%E0%AD%8D%E0%AD%9F%20%E0%AC%A7%E0%AD%8D%E0%AC%B0%E0%AD%81%E0%AC%AC&searchhws=yes&matchtype=exact", "notes": "The Triśaṅku group is in the Sanskrit database (id trishanku) as the king fixed head-downward in the southern sky; Praharaj is using it as a real region of sky with a determinable southernmost member. ସୌମ୍ୟ ଧ୍ରୁବ is at p. 8756, ଧ୍ରୁବ ତାରା at p. 4068, ଉତ୍ତରଧ୍ରୁବ at p. 947."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "ධ්‍රැව·තාරකාව", "name_roman": "dh‍ræva·tārakāva", "literal_meaning": "'the fixed star'", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ධ්‍රැව·තාරකාව dh‍ræva·tārakāva , n. the pole star.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. ධ්‍රැව·තාරකාව dh‍ræva·tārakāva, p. 312", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=pole%20star&matchtype=default", "notes": "Sinhala kept the Sanskrit word entire and coined nothing native for the pole star — the same result as Malayalam ധ്രുവം. Carter's other pole-star names are all Sanskrit too: ධ්‍රැවය (p. 312), උත්තර ධ්‍රැව තාරකාව (p. 117), ග්‍රහා·ධාරයා 'sustainer of the planets and stars' (p. 222), ජ්‍යෝතී·රථය (p. 245), නක්‍ෂත්‍ර·නාභිය 'star-navel' (p. 312). Clough p. 272 has 'Druwa, s. polar star or north pole itself'. A search for a native form returned nothing in any of the three dictionaries."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "துருவம்", "name_roman": "turuvam", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "Sanskrit Dhruva in Tamil phonology. No indigenous Tamil name for the pole star was found in either the Tamil Lexicon or Winslow — every Tamil term for it is built on this loan.", "quote": "Pole Star; துருவநட்சத்திரம். (W.) 5. The pole of any great circle of the sphere, especially the celestial poles; பூசக்கர முனை. (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. துருவம் sense 4, vol. IV p. 1984, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A4%E0%AF%81%E0%AE%B0%E0%AF%81%E0%AE%B5%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "NEGATIVE FINDING recorded here: searching the English side of the Lexicon for 'pole star' returns only Sanskrit-derived compounds — சிம்சுமாரசக்கரம் cimcumāra-cakkaram (p. 1422, < Śiṃśumāra, the Sanskrit celestial porpoise), துருவபதம், துருவமண்டலம், துருவன் 'the son of King Uttānapāda believed to have become the pole-star', நட்சத்திரநேமி — and no Tamil formation at all. The Śiṃśumāra figure enters Tamil too: சிம்சுமாரப்ரஜாபதி (Supplement p. S276), 'the region of the Pole Star beyond the nakṣatra-pada', quoted from a Vaiṣṇava commentary."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ధ్రువనక్షత్రము", "name_roman": "dhruva-nakṣatramu", "literal_meaning": "the fixed star", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ధ్రువుడు or ధ్రువనక్షత్రము dhruvuḍu. n. The name of the North Pole: the Pole Star.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ధ్రువుడు dhruvuḍu, p. 626", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=626", "notes": "No vernacular Telugu pole-star name is recorded by Brown; the Sanskrit name is used unaltered. Note the DSAL headword for this page is misprinted as ధ్యానము. Same situation in Kannada (ಧ್ರುವ, Kittel p. 877)."}]}, {"key": "canopus", "title": "Canopus", "kind": "star", "ra": 95.99, "dec": -52.7, "modern_star": {"common_name": "Canopus", "bayer": "α Carinae", "constellation": "Carina"}, "sanskrit_db_id": "agastya", "names": [{"language": "Sinhala", "region": "Sri Lanka", "name_native": "කළමුනිදුතරුව", "name_roman": "kaḷamunin̆du-taruva", "literal_meaning": null, "register": "vernacular", "confidence": "certain", "usage_note": "Attested in the classical poem Sasadāvata: the rising of this star is what makes turbid water run clear. That belief — Agastya's heliacal rising as the moment water purifies — is the same one Sanskrit attaches to Agastya, but here it is carried by a Sinhala word.", "quote": "කළමුනිදුතරුව kaḷamunin̆du-taruva , s., a brilliant star that dawns in the southern sky, the star canopus of which the sage Agasti is supposed to be the regent: vimal kärä sihil kaḷamunin̆du taru nän̆gīmen by the rising of the star canopus making water purified, Sas 82.", "citation": "Jayatilaka (ed.), A Dictionary of the Sinhalese Language (Royal Asiatic Society, Ceylon Branch, 1935– ), s.v. කළමුනිදුතරුව kaḷamunin̆du-taruva, p. 2536", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/jayatilaka_query.py?qs=canopus&matchtype=default", "notes": "A Jayatilaka-only find; Carter has no such headword and gives only the Sanskrit personal name (අගස්ති, p. 6: 'a rishi so named ... is the regent of the star Canopus'), as does Clough. The final element තරුව taruva is the native Sinhala word for star. Jayatilaka's separate entry අගති agati (p. 41) records the water-purifying belief again."}, {"language": "Tamil", "region": "Tamil Nadu (Potiyil/Podigai hills)", "name_native": "பொதியில் முனிவன்", "name_roman": "potiyil muṉivaṉ", "literal_meaning": "the sage of the Potiyil hill", "register": "vernacular", "confidence": "likely", "usage_note": "A TAMIL LOCALISATION of the Canopus-sage: Agastya named not by his Sanskrit name but by the southern Tamil mountain he is said to dwell on. The verse describes him cleaving the high ridge and reaching Gemini — the star's heliacal position in a datable sky-description.", "quote": "பொதியில் முனிவன் புரை வரைக் கீறி\nமிதுனம் அடைய, விரி கதிர் வேனில்", "citation": "Paripāṭal 11, ll. 11-12 (by Nallantuvaṉār); Project Madurai e-text PM 0087", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0087.html", "notes": "The identification with Canopus is the commentary's, not the verse's: the Tamil Lexicon s.v. அகத்தியன் quotes the urai on this very line (பரிபா. 11, 11, உரை) as 'the star called Akattiyaṉ, passing beyond its high station, joining Gemini'. The mūlam text quoted here is verified independently at Project Madurai. The whole of Paripāṭal 11, ll. 1-12 is a sky-description with Venus in Aries (உருகெழு வெள்ளி வந்து ஏற்றியல் சேர, l. 4) and other planetary placements, so a star is what is meant. Confidence 'likely' because the epithet 'sage of Potiyil' names Agastya, and only the commentary makes Agastya the star here. The Lexicon's own headword பொதியில் (vol. V) gives only 'public hall' and the mountain, not the star, so this name is not lexicalised as an astronomical term."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "سہيل", "name_roman": "suhail (corr. suhel)", "literal_meaning": "Arabic Suhayl, diminutive-form of sahl 'level, easy'", "register": "vernacular", "confidence": "certain", "usage_note": "The second-brightest star and, like Agastya, a low southern star whose heliacal rising is a season marker. It has entered Hindi verse: McGregor records सुहेल suhel as Avadhi for Canopus.", "quote": "A سہيل suhail , corr. suhel (v.n. dim. form fr. سہل; see sahl), s.m. The star Canopus.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. suhail, p. 707", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=707", "notes": "COMPETING IDENTIFICATION: Fallon, p. 801, s.v. suhail', suhel, glosses it 'The dog star', i.e. Sirius. That is an error - Platts (1884), Shakespear (1834, p. 1131) and Fallon's own entry at p. 115 (s.v. agas'ti, 'The star Canopus; Argo Navis (A. suhail...)') all make it Canopus. Recorded here because it is the only place in these dictionaries where Sirius is even approached."}, {"language": "Hindi", "region": "Bihar (Bhojpuri- and Magahi-speaking districts); the couplet is ascribed to the peasant weather-prophet Ghāgh", "name_native": null, "name_roman": "agast", "literal_meaning": "vernacular contraction of Agastya", "register": "folk", "confidence": "certain", "usage_note": "Not a learned citation but a farmer's calendar marker: the heliacal rising of Canopus, paired with the flowering of kās grass, announces that the rains are over. This is the Sanskrit Agastya name doing agricultural work in a peasant couplet.", "quote": "Uge agast ban phule kás, / Ab náhin barkha ke as. — The appearance of the star Canopus and the flowering of the kás grass in the forest are signs of the end of the rains.", "citation": "G. A. Grierson, Bihar Peasant Life (Calcutta, 1885), §1091, p. 283", "source_url": "https://archive.org/details/cu31924072688025", "notes": "Grierson prints the couplet in Devanagari above the transliteration; the Devanagari is badly mangled in the scanned text, so only his transliteration and translation are quoted and name_native is left null."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "jilu-atiŋ ipil", "literal_meaning": "the star under which the game grazes", "register": "tribal", "confidence": "certain", "usage_note": "Deer are believed to graze only while this star is above the horizon — a hunter's star, from the days when the forests were denser and game was an important part of the daily food.", "quote": "jilu-atiŋ-ipil sbst., Canopus. Game is believed to graze only whilst this star is above the horizon.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. jilu-atiŋ ipil, col. 2065; the story at cols. 1920-1921", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "jilu now means game in general in Mundari; Hoffmann notes its Santali cognate jel is still restricted to deer. Sanskrit Agastya is the same star but an entirely unrelated figure, the sage."}, {"language": "Bengali", "region": "Bengal", "name_native": "অগস্ত্য", "name_roman": "agastya", "literal_meaning": "the sage Agastya", "register": "sanskritic", "confidence": "certain", "usage_note": "The entry carries into modern Bengali the Agastya-yātrā observance keyed to the star's heliacal rising in Bhādra.", "quote": "অগস্ত্য agastya n. a mythological sage of India; (astrol.) the Canopus. ~যাত্রা n. the first day of the month of Bhadra (ভাদ্র) when the sage Agastya asked the bending Vindhyas to wait till he came back and he never came back (this day has since been regarded by the Hindus as extremely inauspicious to set out on a journey…)", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. অগস্ত্য agastya, p. 6", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%85%E0%A6%97%E0%A6%B8%E0%A7%8D%E0%A6%A4%E0%A7%8D%E0%A6%AF&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಅಗಸ್ತ್ಯ", "name_roman": "agastya", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಅಗಸ್ತ್ಯ agastya. N. of a ṛiṣi (= ಅಗಸ್ತಿ No. 1; Bp. 19, 26). 2, the star Canopus or its regent. 3, = ಅಗಸೆ 1, q. v.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಅಗಸ್ತ್ಯ agastya, p. 12", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=12", "notes": "Also ಅಗಸ್ತಿ agasti (p. 12), 'the regent of the star Canopus'. As in Telugu, no vernacular name."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "അഗസ്തി", "name_roman": "agasti", "literal_meaning": "the sage Agastya", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "അഗസ്തി agasti agasti S. 1. = അഗസ്സ്യന്‍ N. pr. A Rishi celebrated for passing the Vindhya mountains and leading the Brahmans into the Deccan. 2. the star Canopus.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. അഗസ്തി agasti, p. 6", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%85%E0%B4%97%E0%B4%B8%E0%B5%8D%E0%B4%A4%E0%B4%BF&searchhws=yes&matchtype=exact", "notes": "Marked S. (Sanskrit) by Gundert, with the sage-legend intact. No native Malayalam name for Canopus is recorded, though it is a conspicuous southern star from Kerala's latitude."}, {"language": "Marathi", "region": "Bombay Presidency (Deccan and Konkan)", "name_native": null, "name_roman": "Agastya", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "a heliacal-rising marker: every Brahman must worship it within seven days of its first appearance, on pain of seven months' pollution", "quote": "Every Brahman must offer arghyas to, and worship, the Agastya constellation, in a hut of Darbha (Eragrostis cynosuroides) and Kasada (Cassia occidentalis) within seven days from the date of its appearance.", "citation": "R. E. Enthoven, The Folklore of Bombay (Oxford: Clarendon Press, 1924), p. 67", "source_url": "https://archive.org/details/folkloreofbombay00reen/page/n69", "notes": "The name is Sanskrit but the practice is the point: Canopus is used as a seasonal marker, its heliacal rising in the Deccan falling in late August or early September and closing the first half of the monsoon. The archive.org OCR renders the name 'Agasiya'; the printed page reads Agastya."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "अगस्ति", "name_roman": "agasti", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "अगस्ति agasti m (S) The name of a saint. He is the Regent of the star Canopus. 2 The star Canopus. 3 Applied appellatively to a Glutton or great eater: because the saint अगस्ति swallowed up the ocean.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. अगस्ति, p. 7", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%85%E0%A4%97%E0%A4%B8%E0%A5%8D%E0%A4%A4%E0%A4%BF&searchhws=yes&matchtype=exact", "notes": "Purely Sanskritic; no vernacular Marathi name for Canopus turned up in Molesworth, Vaze, Tulpule or Date, even though Canopus is conspicuous from the Deccan in winter."}, {"language": "Odia", "region": "Odisha", "name_native": "ଅଗସ୍ତି", "name_roman": "Agasti", "literal_meaning": "the sage Agastya", "register": "sanskritic", "confidence": "certain", "usage_note": "The seasonal function is the whole point of the Odia entry: the star rises in śarat, and because river water clears in śarat, Hindus take the rising of Agasti to be the CAUSE of the clearing. The companion entry ଅଗସ୍ତ୍ୟୋଦୟ (p. 75) dates it to the 7th of Bhādra and glosses it as the beginning of Indian autumn.", "quote": "2। ଦକ୍ଷିଣାକାଶର ଉଜ୍ଜଳ ନକ୍ଷତ୍ରବିଶେଷ— A bright star in the southern sky; Canopus; Argus Alpha; Argo Navis. [ଦ୍ର—ଏହା ଶରତ୍କାଳରେ ଉଦିତ ହୁଏ; ଶରତ୍କାଳରେ ନଦ୍ୟାଦିର ଜଳ ନିର୍ମଳ ହେବାରୁ ଅଗସ୍ତି ନକ୍ଷତ୍ରର ଉଦୟକୁ ଜଳର ନିର୍ମଳତାର କାରଣ ବୋଲି ହିନ୍ଦୁମାନେ ବିଶ୍ୱାସ କରନ୍ତି।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଅଗସ୍ତି Agasti, p. 74", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%85%E0%AC%97%E0%AC%B8%E0%AD%8D%E0%AC%A4%E0%AC%BF&searchhws=yes&matchtype=exact", "notes": "Praharaj adds at p. 4095 that Canopus was the southern pole star 14,000 years ago — a precession calculation, and a sign that this dictionary is drawing on European positional astronomy as well as on jyotiṣa."}, {"language": "Odia", "region": "Odisha", "name_native": "ଲୋପାମୁଦ୍ରା", "name_roman": "Lopā mudrā", "literal_meaning": "Lopāmudrā, wife of the sage Agastya", "register": "sanskritic", "confidence": "unidentified", "usage_note": "Recorded twice: as a headword, and in the Canopus note at p. 4095 ('the small star to its south-east is Agastya's wife Lopāmudrā').", "quote": "2। ଅଗସ୍ତି ନାମକ ତାରାର ଦକ୍ଷିଣ ପୂର୍ବ ପାଖରେ ଅବସ୍ଥିତ ଏକ କ୍ଷୁଦ୍ର ତାରା (ହି. ଶ.) (ନକ୍ଷତ୍ର ତଳେ ନୋଟ ଦେଖ) —2. A small star to the south east of Canopus (star).", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଲୋପା ମୁଦ୍ରା Lopā mudrā, p. 7452", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%B2%E0%AD%8B%E0%AC%AA%E0%AC%BE%20%E0%AC%AE%E0%AD%81%E0%AC%A6%E0%AD%8D%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "DELIBERATELY LEFT UNIDENTIFIED. No candidate is named and 'small star south-east of Canopus' does not resolve: the plausible naked-eye options in that direction are several. sanskrit_db_id is null on purpose — the Sanskrit database's lopamudravallabha is 'Lopāmudrā's beloved', i.e. Agastya, i.e. CANOPUS ITSELF, a different star from this one. Recording them as the same entry would be an error. Praharaj credits the sense to the Hindī Śabdasāgara (ହି. ଶ.), so it may not be independently Odia."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "அகத்தியன்", "name_roman": "akattiyaṉ", "literal_meaning": "Agastya (the sage), in Tamil form", "register": "sanskritic", "confidence": "certain", "usage_note": "The Tamil form of Agastya, both the sage credited with the first Tamil grammar and the star of which he is the regent. The Lexicon's quotation is from the commentary on Paripāṭal and calls it plainly 'the star named Agastiyaṉ'.", "quote": "2. The star Canopus, of which Agastya is the regent; அகஸ்திய நக்ஷத்திரம். அகத்திய னென்னு மீன் உயர்ந்த தன்னிடத்தைக் கடந்து மிதுனத்தைப் பொருந்த (பரிபா. 11, 11, உரை).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. அகத்தியன் sense 2, vol. I p. 10; quoting the commentary on Paripāṭal 11, 11", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%85%E0%AE%95%E0%AE%A4%E0%AF%8D%E0%AE%A4%E0%AE%BF%E0%AE%AF%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Lexicon also has the fully Sanskritic அகஸ்தியநட்சத்திரம் (p. 16), 'The star Canopus'. The commentary phrase அகத்தியன் என்னும் மீன் — 'the star called Akattiyaṉ' — again uses the Tamil word mīṉ for a named star."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "అగస్త్యనక్షత్రము", "name_roman": "agastya-nakṣatramu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The heliacal rising (agastyōdayamu) is an almanac event in the Telugu country.", "quote": "అగస్త్యశాకము the leaves of a leguminous tree which are dressed and eaten, అనిసెచెట్టు; అగస్త్యనక్షత్రము the star Canopus. అగస్త్యచారము the cource of Canopus. అగస్త్యాదయము the rise of Canopus.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. అగస్త్యుడు agastyuḍu, p. 24", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=24", "notes": "No vernacular name for Canopus in either dictionary — the Sanskrit sage-name is used in both languages (Kannada ಅಗಸ್ತ್ಯ, Kittel p. 12). Given the star's importance in the southern sky this is a real negative finding."}]}, {"key": "lunar-mansion", "title": "The lunar mansions as a system", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Gienah", "bayer": "γ Corvi", "constellation": "Corvus"}, "sanskrit_db_id": "nakshatra-generic", "names": [{"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "നാള്‍", "name_roman": "nāḷ", "literal_meaning": "'day'", "register": "vernacular", "confidence": "certain", "usage_note": "The everyday Malayalam word for a person's birth-star, and the one that does the social work: Gundert's illustrative phrase is നാളും പൊരുത്തവും നോക്കി നിശ്ചയിക്ക, 'to settle [a marriage] after examining the nāḷ and the compatibility'. He also records the classification of the asterisms as ആണ്‍നാള്‍ 'male nāḷ' and പെണ്‍നാള്‍ 'female nāḷ' (cf. s.v. പെണ്‍, p. 699), and മുന്നാള്‍ 'the 3rd asterism from that of the nativity' (s.v. മുന്‍, p. 837).", "quote": "നാള്‍ nāḷ‍ nāḷ T. M. ... 1. A day of 24 hours ... 2. the astrological day & the നക്ഷത്രം that governs it ( ആണ്‍നാ., പെണ്‍നാ . etc.). നാളും പൊരുത്ത വും നോക്കി നിശ്ചയിക്ക Anach. (for marriage).", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. നാള്‍ nāḷ, p. 547 (sense 2)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?page=547", "notes": "The register point of the whole Malayalam set: the twenty-seven asterisms are Sanskrit, but the word Malayalam actually uses for them in daily speech is the inherited Dravidian nāḷ 'day' — the same word as Tamil nāḷ. Sanskrit നക്ഷത്രം is the learned register; നാള്‍ is the lived one. Gundert marks it 'T. M.' with Kannada and Telugu cognates."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "ஐம்மீன்", "name_roman": "ai-m-mīṉ", "literal_meaning": "five-star, the five stars", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil counting-name from ஐ 'five', and the Lexicon states the reason: the asterism has five principal stars — the quadrilateral of Corvus with its fifth.", "quote": "ஐம்மீன் ai-m-mīṉ , n. < id. +. 1. The 13th nakṣatra, so called because of its five principal stars. See அத்தம்⁸. (பிங்.) 2. The fourth nakṣatra. See உரோகிணி. (வீமேசுர. 15.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஐம்மீன், vol. I p. 579, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%90%E0%AE%AE%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Sense 2, 'the fourth nakṣatra' = Rohiṇī, comes from a different source and reflects the five bright Hyades; the Lexicon prints both without adjudicating, so the counting-name is genuinely ambiguous between two five-star groups. Its calque-twin is கைம்மீன் kai-m-mīṉ 'hand-star' (p. 1112, Tivākaram), a straight Tamil translation of Sanskrit hasta 'hand'. The Lexicon locates the thirteenth s.v. அத்தம்⁸ (p. 65) as 'the constellation Corvus'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "கடைமீன்", "name_roman": "kaṭai-mīṉ", "literal_meaning": "last star, the star at the end", "register": "vernacular", "confidence": "certain", "usage_note": "A positional Tamil name — Revatī named simply as the last of the twenty-seven. It pairs with ātimīṉ and talaināḷ, 'first star', for Aśvinī.", "quote": "கடைமீன் kaṭai-mīṉ , n. < id. +. The 27th nakṣatra from its being the last of the asterisms. See இரேவதி. (திவா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. கடைமீன், vol. II p. 680, citing the Tivākaram", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%95%E0%AE%9F%E0%AF%88%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Its -nāḷ counterpart is கடைநாள் kaṭai-nāḷ (p. 679, Cūṭāmaṇi Nikaṇṭu), sense 4, 'the 27th nakṣatra, from its being the last asterism' — whose senses 1-3 are 'the last day', 'the day of one's death' and 'the last day of the world', a homonym worth noting. Further Tamil names for the same asterism: பெருநாள் peru-nāḷ (p. 2877) and புருடநாள் puruṭa-nāḷ (p. 2775); the Sanskritic one is இரவிநாள் iravi-nāḷ 'sun-star' (p. 316)."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "காற்றுமுந்துநாள்", "name_roman": "kāṟṟu-muntu-nāḷ", "literal_meaning": "the star that the wind-star precedes", "register": "vernacular", "confidence": "certain", "usage_note": "THE PUREST VERNACULAR FORMATION IN THIS FILE. Viśākhā is named neither by its deity nor by its shape but purely by its place in the Tamil sequence — the asterism that comes after kāṟṟiṉāḷ. Nothing in Sanskrit corresponds.", "quote": "காற்றுமுந்துநாள் kāṟṟu-muntu-nāḷ , n. < id. +. Višākha, the 16th nakṣatra, as succeeding kāṟṟiṉāḷ; காற்றைத் தேவதையாகக்கொண்ட சுவாதியை முற்பட்டநாளாகவுடைய விசாகநட்சத்திரம். (சூடா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. காற்றுமுந்துநாள், vol. II p. 909, citing the Cūṭāmaṇi Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%95%E0%AE%BE%E0%AE%B1%E0%AF%8D%E0%AE%B1%E0%AF%81%E0%AE%AE%E0%AF%81%E0%AE%A8%E0%AF%8D%E0%AE%A4%E0%AF%81%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Printed immediately after காற்றினாள் on the same Lexicon page, which is how the relation is meant to be read. The formation presupposes a fixed Tamil ordering of the asterisms in which position alone can name a star — evidence that the Tamil nakshatra sequence was learned as a Tamil list, not merely translated item by item."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மகவெண்மீன்", "name_roman": "maka-veṇ-mīṉ", "literal_meaning": "the Magha white-star", "register": "vernacular", "confidence": "certain", "usage_note": "THE ONE INDIGENOUS CONSTELLATION-FIGURE recovered by this compilation. Nacciṉārkkiṉiyar, glossing this compound, says the Magha asterism 'has the shape of a bent yoke' — the Sickle of Leo seen as a crooked ox-yoke, which is why the poet uses it as a simile for the curving bank of a temple tank.", "quote": "(கு -பு) மகவெண்மீன் - மகநக்ஷத்திரம்; அது முடநுகம்போன்ற வடிவமுடையதாதலின், கரைக்கு உவமையாயிற்று.", "citation": "Paṭṭiṉappālai ll. 34-35, with Nacciṉārkkiṉiyar's commentary (ed. U. Vē. Cāminātaiyar); Project Madurai e-text PM 0479", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0479.html", "notes": "The mūlam lines were verified separately in the plain e-text (PM 0077, https://www.projectmadurai.org/pm_etexts/utf8/pmuni0077.html): 'மழைநீங்கிய மாவிசும்பின் / மதிசேர்ந்த மகவெண்மீன்' — 'in the great sky from which the rain has withdrawn, the Magha white-star joined to the moon'. Nacciṉārkkiṉiyar's running gloss on ll. 34-38 renders it 'மதியைச் சேர்ந்த மகமாகிய வெள்ளியமீனினது வடிவு' — 'the shape of the white star that is Magha, joined to the moon'. முடநுகம் muṭa-nukam is 'bent yoke'. The Sickle of Leo — α, η, γ, ζ, μ, ε Leonis — does form a hooked line answering to a yoke, and the figure is not the Sanskrit one (Sanskrit Maghā is a house or a whip). The compound is not a Tamil Lexicon headword; it exists only in this text and its commentary, which is why the citation is literary rather than lexicographical. HOMONYM caution: வெண்மீன் alone means Venus (see above); here மக- fixes it as the asterism."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மருத்துவநாள்", "name_roman": "maruttuva-nāḷ", "literal_meaning": "physician-star, the star of the physicians", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil TRANSLATION of the deity rather than a borrowing of the name: the Aśvins are the physicians of the gods, and Tamil renders them with the native word maruttuvar 'physicians'.", "quote": "மருத்துவநாள் maruttuva-nāḷ , n. < மருத்துவர் +. The first nakṣatra; அச்சுவினி நாள். (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மருத்துவநாள், vol. V p. 3092, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AE%B0%E0%AF%81%E0%AE%A4%E0%AF%8D%E0%AE%A4%E0%AF%81%E0%AE%B5%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The same asterism also has the positional Tamil names தலைநாள் talai-nāḷ 'head-day, first star' (p. 1780, Piṅkala Nikaṇṭu) and ஆதிமீன் āti-mīṉ 'first star' (p. 229, quoting Cētupurāṇam, Kantamātaṉa 17: 'ஆதிமீன் றோணி யீறு'), and the fully Sanskritic ஐப்பசி (see the month entry). The Sanskrit-database counterpart naming the same idea is 'ashvinidaivata'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மாரிநாள்", "name_roman": "māri-nāḷ", "literal_meaning": "rain-star, the star of the rains", "register": "vernacular", "confidence": "likely", "usage_note": "An AGRICULTURAL star-name: the twelfth asterism named for the rain. It is the only asterism in the Lexicon named for a season rather than a deity, a shape or a number.", "quote": "மாரிநாள் māri-nāḷ , n. < மாரி¹ +. The 12th nakṣatra. See உத்தரம்². (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மாரிநாள், vol. V p. 3173, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AE%BE%E0%AE%B0%E0%AE%BF%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Lexicon gives no reason for the name, so the agricultural reading is an inference from the transparent meaning of māri 'rain, rainy season' — flagged as such, and confidence set to 'likely' for that reason. The same asterism's other Tamil names are கதிர்நாள் katir-nāḷ (p. 713) and செங்கதிர்நாள் ceṅ-katir-nāḷ (p. 1578), both 'sun-ray star', which the Lexicon does explain: 'whose presiding deity is the Sun'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "நடுநாள்", "name_roman": "naṭu-nāḷ", "literal_meaning": "the middle star", "register": "vernacular", "confidence": "certain", "usage_note": "A TAMIL NAME WITH NO SANSKRIT MODEL: Citrā named purely by its position, the fourteenth of twenty-seven, the exact midpoint of the series. Nothing about the deity or the appearance enters into it.", "quote": "நடுநாள் naṭu-nāḷ , n. < id. +. 1. Midday; நண்பகல். 2. Midnight; இடையாமம். பழவிறன் மூதூர் பாயல்கொ ணடுநாள் (மணி. 7, 63). 3. The 14th nakṣatra. See சித்திரை. (சூடா.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. நடுநாள் sense 3, vol. IV p. 2143, citing the Cūṭāmaṇi Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AE%9F%E0%AF%81%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "HOMONYM: senses 1 and 2 of the same word are 'midday' and 'midnight' — 'the middle of the day' and 'the middle asterism' share one form, and the Maṇimēkalai citation belongs to the midnight sense. The pun is presumably deliberate on the nikaṇṭu-maker's part. The bare word மீன் mīṉ is also given for this asterism (s.v. மீன்¹ sense 2), as is நெய்வான்மீன் ney-vāṉ-mīṉ (p. 2343, Tivākaram), whose first element is opaque."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "நாள்", "name_roman": "nāḷ", "literal_meaning": "day", "register": "vernacular", "confidence": "certain", "usage_note": "The commonest Tamil term for a lunar asterism, and the second element of the whole -nāḷ class of Tamil asterism-names recorded below. The semantic bridge is the day named by the asterism the moon is in.", "quote": "7. Lunar asterism; நட்சத்திரம். திங்களு நாளு முந்துகிளந் தன்ன (தொல். எழுத். 286).", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. நாள் sense 7, vol. IV p. 2232; quoting Tolkāppiyam, Eḻuttatikāram 286", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Tolkāppiyam line quoted — 'as when the moon and the nāḷ were mentioned before' — puts the sense in the oldest surviving Tamil grammar. Sense 8 extends it to the lunar day, the period of the moon's passage through one asterism."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "நாண்மீன்", "name_roman": "nāṇ-mīṉ", "literal_meaning": "day-star", "register": "vernacular", "confidence": "certain", "usage_note": "The Caṅkam term for the lunar mansions collectively, explicitly opposed by the Lexicon to கோண்மீன் kōṇmīṉ 'planet'. The Kalittokai image is of the moon ringed by the asterisms.", "quote": "நாள்மீன் வாய் சூழ்ந்த மதி போல், மிடை மிசைப்", "citation": "Kalittokai 104, l. 27 (Neytaṟkali); Project Madurai e-text PM 0221", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0221.html", "notes": "The Project Madurai text prints நாள்மீன்; the Tamil Lexicon headword is நாண்மீன் (nasal assimilation) and cites this same line as கலித். 104, 27, glossing 'The lunar asterism; அசுவதி முதலிய நட்சத்திரப்பொது' (s.v. நாண்மீன், vol. IV p. 2212, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AE%BE%E0%AE%A3%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact). The Lexicon also uses நாண்மீன் in its own Tamil definition of நட்சத்திரம், 'the twenty-seven nāṇmīṉ'."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "நீர்நாள்", "name_roman": "nīr-nāḷ", "literal_meaning": "water-star, the star of the waters", "register": "vernacular", "confidence": "certain", "usage_note": "A Tamil translation of the deity — Pūrvāṣāḍhā's presiding power is the Waters (Āpas) — with the native word nīr.", "quote": "நீர்நாள் nīr-nāḷ , n. < id. +. The 20th nakṣatra. See பூராடம். (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. நீர்நாள், vol. IV p. 2303, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%A8%E0%AF%80%E0%AE%B0%E0%AF%8D%E0%AE%A8%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Tamil deity-translation habit runs right through: கடல் kaṭal 'sea' is given as the 24th nakṣatra Catayam, 'so called from Varuṇa the Sea-god being the deity of the constellation' (p. 660); அசுரநாள் acura-nāḷ is Mūlam (p. 33); தருமநாள் taruma-nāḷ is Paraṇi (p. 1770); மித்திரநாள் mittira-nāḷ is Anuṭam (p. 3198); விசுவநாள் vicuva-nāḷ is Uttirāṭam (p. 3646); குருநாள் kuru-nāḷ and சுரர்குருநாள் curar-kuru-nāḷ 'the star of the gods' preceptor' are Pūcam (pp. 1017, 1526); அதிதிநாள் atiti-nāḷ is Puṉarpūcam (p. 74); பகவதிநாள் pakavati-nāḷ is Pūram (p. 2382); இசைநாள் icai-nāḷ is Pūraṭṭāti and Uttiraṭṭāti (p. 273)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "గుర్రపుచుక్క", "name_roman": "gurrapu-cukka", "literal_meaning": "the horse's star", "register": "vernacular", "confidence": "certain", "usage_note": "A translation, not a borrowing: the Sanskrit name is 'the two horsemen', and Telugu renders the horse with its own word gurramu.", "quote": "గుర్రపు వాసము gurrapu-vāsamu. n. A prop in the roof of a house. గుర్రపుచుక్క a certain star అశ్వినీనక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. గుర్రము gurramu, p. 381", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=381", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. Here the calque is transparent: Aśvinī 'the Aśvins, horsemen' → gurrapu-cukka 'horse star'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "జన్నపుచుక్క", "name_roman": "jannapu-cukka", "literal_meaning": "the sacrifice star", "register": "vernacular", "confidence": "certain", "usage_note": "A ritual-calendar name: the asterism at whose appearance the yajñas fall due.", "quote": "జన్నము [from Skt. యజ్ఞము.] n. A sacrifice, a ceremony, in which oblations are presented. యజ్ఞము, వేలిమి. జన్నపుచుక్క a star or constellation on whose appearance sacrifices (యజ్ఞములు) are to be performed. మఘానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. జన్నము ḍzannamu, p. 476", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=476", "notes": "Second Telugu name for Maghā. jannamu is the tadbhava of yajña; the compound is Telugu. Note that Maghā is also called Makha in Sanskrit, and makha means 'sacrifice' — so this name may be a re-motivation of that variant rather than an independent observation."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "జోడువేల్పులరిక్క", "name_roman": "jōḍu-vēlpula-rikka", "literal_meaning": "the star of the paired gods", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "జోడు [Tel.] n. A pair, or couple, a pair of shoes or sandals. Junction, conjunction. … జోడువేల్పులరిక్క the double star called విశాఖ.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. జోడు ḍzōḍu, p. 485", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=485", "notes": "A calque on the deity: Viśākhā's devatā is the dual Indrāgnī, and vēlpu is the native Telugu word for a god. Second Telugu name for the same mansion, built on the dual deity where kummara-sāre-cukka is built on the shape."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "కొనరిక్క", "name_roman": "kona-rikka", "literal_meaning": "the end star, the last star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "కొన [Tel.] n. The end, extremity, termination, point, tip. చివర. … adj. Last. కొనవాడు the last man. … కొనరిక్క a certain constellation: రేవతీనక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. కొన kona, p. 319", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=319", "notes": "The positional counterpart of tolu-rikka 'the first star' (Aśvinī). The pair tolu-rikka / kona-rikka brackets the whole vernacular list and shows it was handled as an ordered sequence in Telugu, not just borrowed name by name."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "కుమ్మరసారెచుక్క", "name_roman": "kummara-sāre-cukka", "literal_meaning": "the potter's-wheel star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "కుమ్మర [Tel.] n. The potter's caste. … కుమ్మరసాన, or కుమ్మరసారె kummara-sāna n. A potter's wheel. కుమ్మరసారె చుక్క kummara-sārc-ṭsukka. n. The The name on the constellation called విశాఖానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. కుమ్మర kummara, p. 296", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=296", "notes": "A shape name with no Sanskrit model: Viśākhā means 'forked/branched'. The Telugu sees a potter's wheel. Brown's line has two typographical faults ('sārc' for sāre, 'The The name on the constellation'), reproduced verbatim above."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "కార్తె", "name_roman": "kārte", "literal_meaning": null, "register": "vernacular", "confidence": "certain", "usage_note": "AGRICULTURAL. The unit of the Deccan farming calendar: the roughly thirteen days the sun spends in each of the 27 asterisms. Brown marks it [Tel.], not [Skt.].", "quote": "కార్తె [Tel.] n. The particular constellation out of the 27, in which the Sun happens to be. ఇరువైయేడు కార్తెలు అనగా అశ్విని మొదలైన నక్షత్రములలో సూర్యుడు ఉండే దినాలు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. కార్తె kārte, p. 276", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=276", "notes": "The single most consequential vernacular sky-word in either language, because sowing, weeding and harvest are timed by it. The word is the Telugu/Kannada Deccan development of Sanskrit kārttika; Kittel has no ಕಾರ್ತೆ headword, but the same system is documented for Kannada-speaking Bellary by Thurston (entered separately). Telugu also compounds it directly with an asterism name: svāti-karti (Brown p. 1384)."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "మద్దెలరూపురిక్క", "name_roman": "maddela-rūpu-rikka", "literal_meaning": "the drum-shaped star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "మద్దెల [from Skt. మృదంగ.] n. A small drum. మృదంగము. మద్దెలరూపురిక్క maddela-rūpu-rikka. n. A constellation called ధనిష్ఠానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. మద్దెల maddela, p. 955", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=955", "notes": "A shape name that agrees with the pan-Indian iconography of Dhaniṣṭhā as a drum, but built with the Telugu word maddela (< mṛdaṅga) and the Telugu formant -rūpu-rikka 'shaped star'. Compare mīnu-rūpu-rikka for Revatī below: -rūpu-rikka is a productive Telugu pattern for shape-named asterisms."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ముక్కంటిచుక్క", "name_roman": "mukkaṇṭi-cukka", "literal_meaning": "the three-eyed one's star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "ముక్కంటి [Tel. from ముక్కన్ను (మూడు + కన్ను.] n. The three-eyed one; a title of Siva. త్రినేత్రుడు, త్రిలోచనుడు. ముక్కంటిచుక్క muk-kanṭi-ṭsukka. n. A constellation called ఉత్తరభద్రపద.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ముక్కంటి muk-kanṭi, p. 999", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=999", "notes": "A calque on the deity: Uttara-Bhādrapadā's devatā is Ahirbudhnya, identified with Śiva/Rudra. mukkaṇṭi is a wholly Dravidian formation (mūḍu 'three' + kannu 'eye')."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ముప్పదిరెంటి గుంపు", "name_roman": "muppadi-reṇṭi gumpu", "literal_meaning": "the group of thirty-two", "register": "vernacular", "confidence": "certain", "usage_note": "A star-count name: Revatī is reckoned at 32 stars.", "quote": "ముప్పది [Tel. మూడు + పది.] n. Thirty. త్రింశత్. ముప్పదిరెంటి గుంపు an epithet applied to a lunar mansion called రేవతీనక్షత్రము", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ముప్పది mup-padi, p. 1013", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1013", "notes": "Third Telugu name for Revatī, and the only star-count name in the vernacular set. The figure 32 for Revatī is the standard Indian one."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ముత్తెపురిక్క", "name_roman": "muttepu-rikka", "literal_meaning": "the pearl star", "register": "vernacular", "confidence": "likely", "usage_note": "The month Caitra is named from it: muttepu-rikka-nela.", "quote": "ముత్తెము, ముత్తియము or ముత్యము [from Skt. మౌక్తికము.] n. A pearl. … ముత్తెపురిక్క నెల muttepu-rikka-nela. n. An epithet applied to the month, చైత్రమాసము. ముత్తెపుసవతు muttepu-savatu. n. The lunar mansion called చిత్రానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ముత్తెము muttemu, p. 1008", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1008", "notes": "A colour/brilliance name and an excellent one — Spica is the brightest star of Virgo and is white. Brown gives the star itself as ముత్తెపుసవతు muttepu-savatu (savatu 'co-wife'), and only the month as muttepu-rikka-nela; the star-name muttepu-rikka is inferred from the month form. Both are recorded here under the -rikka form with the savatu variant quoted."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "మీనురూపురిక్క", "name_roman": "mīnu-rūpu-rikka", "literal_meaning": "the fish-shaped star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "మీను [Tel. A Drav: word common to all South Indian languages.] n. A fish. చేప. మీనురూపురిక్క a constellation called రేవతీ నక్షత్రము. plu. మీలు. మీనము mīnamu. [borrowed by Skt. from the Drav. languages.] n. A fish, మత్స్యము. The sign Pisces. మీనరాశి.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. మీను mīnu, p. 996", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=996", "notes": "The one place Telugu mīnu touches the sky. Brown's headnote — 'A Drav: word common to all South Indian languages' — is the same word that in Kannada means 'star' outright (ಮೀನ್, Kittel p. 1328). Here Telugu uses it only for the shape of Revatī, i.e. Pisces. That contrast, mīn = 'star' in Kannada but only 'fish' in Telugu, is one of the sharper Telugu/Kannada differences in this file."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "నీటిరిక్క", "name_roman": "nīṭi-rikka", "literal_meaning": "the water star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "నీటియిక్క nīṭi-yikka. n. A jewel worn on the breast of Vishṇu. కాస్తుభము. నీటిరిక్క nīṭi-rikka. n. The constellation called పూర్వాషాఢా నక్షత్రము. నీటిరేడు or నీటిరాయుడు nīṭi-rēḍu. n. Varuna, the god of the Ocean. నీటిరేనిరిక్క nīṭi-rēni-rikka. n. The constellation called శతభిత్తు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. నీరు nīru, p. 670", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=670", "notes": "A calque on the deity: Pūrvāṣāḍhā's devatā is Āpas, the Waters. The db has the parallel Sanskrit individual-star entry 'apas'. Note that Brown gives the water-king's star (nīṭi-rēni-rikka = Śatabhiṣaj, deity Varuṇa) in the very next line, so the two water-mansions are systematically distinguished in Telugu by 'water' vs 'water-king'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "నీటిరేనిరిక్క", "name_roman": "nīṭi-rēni-rikka", "literal_meaning": "the water-king's star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "నీటిరేడు or నీటిరాయుడు nīṭi-rēḍu. n. Varuna, the god of the Ocean. నీటిరేనిరిక్క nīṭi-rēni-rikka. n. The constellation called శతభిత్తు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. నీరు nīru, p. 670", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=670", "notes": "A calque on the deity Varuṇa, using the native compound nīṭi-rēḍu 'king of the waters' which Brown himself defines two words earlier. The db has the Sanskrit aliases 'varuna-shatabhishaj' and 'pracetas-shatabhishaj' for the same equation. Note Brown's spelling శతభిత్తు for Śatabhiṣaj — the popular Telugu form."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పెతరులచుక్క", "name_roman": "petarula-cukka", "literal_meaning": "the ancestors' star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "పెతరులు [from Skt. పితృలు.] n. plu. Forefathers or ancestors. పితృదేవతలు. పెతరులసామి the lord of the ancestors, i.e., Yama, యముడు. పెతరులచుక్క the constellation called మఘానక్షత్రము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. పెతరులు petarulu, p. 793", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=793", "notes": "A calque on the presiding deity: Maghā's devatā is the Pitṛs, and petarulu is the Telugu tadbhava of pitṛ. The Telugu name is thus semantically transparent where the Sanskrit Maghā ('the bounties') is not."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "పొదరిం
