 "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Naagarda, Nangar, Nangal, Nangir", "literal_meaning": "the plough", "register": "tribal", "confidence": "certain", "usage_note": "Belt plus sword read as a plough; with Taurus, Orion's eastern shoulder, Lepus and Sirius it makes a whole farming scene.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The same reading of Orion as a plough as Kurukh ugtā-pagṛī bīnkō, and as the Mundari tableau in which the belt is the yoke and Rigel the ploughman."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Tipan", "literal_meaning": null, "register": "tribal", "confidence": "certain", "usage_note": "Its arrival in the early night sky signals the farming season; when Tipan appears at sunset the monsoon is coming.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported."}, {"language": "Kurukh", "region": "Chota Nagpur plateau (Oraon country), Jharkhand", "name_native": null, "name_roman": "ugtā-pagṛī bīnkō", "literal_meaning": "the plough constellation", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Ugtā-pagṛī, the plough. — Ugtā-pagṛī bīnkō, constellation of Orion.", "citation": "Grignard, An Oraon-English Dictionary (1924), s.v. ugtā, p. 684; also s.v. bīnkō, p. 85", "source_url": "https://archive.org/download/in.ernet.dli.2015.211105/2015.211105.Tome-Ii_djvu.txt", "notes": "Grignard's long entry s.v. ugtā describes the parts of the Oraon plough in detail, so the metaphor is documented from the implement upwards. The same reading of Orion as Gondi Nangar/Nangal and, at one remove, the Mundari ploughing tableau."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "araṛ ipilko", "literal_meaning": "the yoke stars", "register": "tribal", "confidence": "certain", "usage_note": "Part of a ploughing tableau: the middle star is the plough itself and the two outer ones the team of bullocks. Hoffmann's informants also used the group to tell the hour — 'ararako hasurtana, Orion is on the western horizon'.", "quote": "(1) araṛd ipilko, the yoke stars, the three stars in Orion's belt. The middle one is supposed to represent the plough; and the two others, the team of bullocks", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Printed 'arard-' in the scan; Hoffmann's retroflex ṛ with a subscript dot is regularly OCR'd as 'rd'. Cognate with Santali arar (Campbell). Cross-referenced at vol. XIII col. 4011 s.v. sitan-ipil and at vol. VI s.v. hasur and hāre."}, {"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "siṭan ipilko", "literal_meaning": "the ploughing stars", "register": "tribal", "confidence": "certain", "usage_note": "The arrival of this group in the evening sky is the sign for the farming season.", "quote": "(3) sitan ipilko, the ploughing stars, the group formed by these four stars.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": null}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Arar (ipilko)", "literal_meaning": "the yoke", "register": "tribal", "confidence": "certain", "usage_note": "Its rising is announced as an event: 'the Yoke constellation has risen'. The same word is the ordinary word for a yoke of oxen (miṭ arar sadom).", "quote": "Arar. The Yoke constellation, being the three stars in Orion's belt. Arar ipilko rakaḥtakana. The Yoke constellation has risen.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Arar, p. 19", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Sanskrit names no asterism for the belt alone — Mṛgaśīrṣa and Invakāḥ are the stars of Orion's head — so there is no Sanskrit counterpart to link. The identical figure is Mundari araṛ ipilko (Hoffmann)."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "arar lalak (arar lalakko)", "literal_meaning": "the yoke that shows itself off", "register": "tribal", "confidence": "disputed", "usage_note": "Named only inside Bodding's entry for the Pleiades, as the thing to which the Pleiades-mallet belongs.", "quote": "the arar lalakko (three small stars near the belt of Orion)", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. sɘren (ipil), p. 352", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "Bodding glosses the group as 'three small stars NEAR the belt', which read strictly points at the sword of Orion; Campbell's arar is unambiguously the belt. Recorded separately rather than merged because the discrepancy is real. lalak is in Campbell 'to show off, as one showing what he can do in dancing'."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "शर", "name_roman": "śara", "literal_meaning": "arrow", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "शर śara m S An arrow. 2 The arrow of Shiva, i. e. the three stars composing the belt of Orion. See under लुब्धक. 3 Distance from the Ecliptic, celestial latitude. 4 The versed sine.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. शर, p. 782", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B6%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "Marked S. Included because it is the hinge of the Śiva-hunter myth that Molesworth spells out under लुब्धक, in which the Belt is the arrow, Orion/Mṛga the buck, and Sirius the hunter."}, {"language": "Odia", "region": "Odisha", "name_native": "ଇଲ୍ୱଳା", "name_roman": "Ilwaḻā", "literal_meaning": "Ilvala, the asura brother of Vātāpi killed by Agastya", "register": "sanskritic", "confidence": "certain", "usage_note": "Praharaj supports it with a line of Rādhānātha Rāya's Yayāti: 'these three forms appear in one line, like Ilwaḻā in the sky'.", "quote": "ଇଲ୍ୱଳା— Ilwaḻā ସଂ. ବି— କାଳପୁରୁଷ ନକ୍ଷତ୍ରପୁଞ୍ଜର କଟିଦେଶରେ ଥିବା ତିନିଟି ତାରା The Orion's belt. (ନକ୍ଷତ୍ର ତଳେ ନୋଟ ଦେଖ) ଏ ତିନିମୂର୍ତ୍ତି ଏକ ରେଖାରେ ଦିଶଇ ଇଳ୍ୱଳା ଯଥା ଆକାଶେ। —ରାଧାନାଥ, ଯଯାତି।", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ଇଲ୍ୱଳା Ilwaḻā, p. 876", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%87%E0%AC%B2%E0%AD%8D%E0%AD%B1%E0%AC%B3%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "Sanskrit Ilvalāḥ is a name of the stars of Orion's HEAD (see sanskrit database id ilvala, from the Taittirīya tradition); Odia has moved the name down the figure to the BELT. That shift is worth recording: the two databases hold the same word against two different asterisms, and the Odia use is consistent across Praharaj (here, at ନଙ୍ଗଲ ଜୁଡ଼ା p. 4106, and at କାଳପୁରୁଷ p. 1552)."}, {"language": "Odia", "region": "Odisha", "name_native": "ଉଷା, ଅନିରୁଦ୍ଧ, ଚିତ୍ରଲେଖା", "name_roman": "Uṣā, Aniruddha, Citralekhā", "literal_meaning": "Uṣā daughter of king Bāṇa, her husband Aniruddha, and her companion Citralekhā", "register": "sanskritic", "confidence": "certain", "usage_note": "From Praharaj's long systematic note on the Kālapuruṣa group (item 36 under the headword ନକ୍ଷତ୍ର), which numbers 21 stars of Orion and gives each a name. Stars 6, 7, 8 are Uṣā, Aniruddha and Citralekhā individually and 'ଇଷୁ ତ୍ରିକାଣ୍ଡ ବା ପାଶୁପତ ବାଣ' (the three-jointed arrow, or the Pāśupata shaft) collectively.", "quote": "5 କାର୍ତ୍ତିକେୟ, 6 ଉଷା, 7 ଅନିରୁଦ୍ଧ 8 ଚିତ୍ରଲେଖା; 6। 7। 8 ଇଷୁ ତ୍ରିକାଣ୍ଡ ବା ପାଶୁପତ ବାଣ, 9। 10।11।12।13 ମୟୂରତୁଣ୍ଡ, 14 କାର୍ତ୍ତବୀର୍ଯ୍ୟ 15 ବାଣରାଜ 16 ଠାରୁ 21 କାଳପୁରୁଷର ଧନୁ। … —English Orion; 1, 2, 3, Orion's head, 4 Betelgeux, 5 Bellatrix, 6 Al Nitak, 7 Al Nilam, 8 Mintaka 6.7.8 Orion's belt. 9. 10 11. 12. 13 Orion's dagger, 14 Saiph, 15 Rigel, 16. 17. 18. 19. 20. 21 Orion's bow.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note item 36 କାଳପୁରୁଷ ପୁଞ୍ଜ, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "The Uṣā-Aniruddha-Citralekhā naming of the three belt stars is not in the Sanskrit database and I have found it in no Sanskrit source; it belongs to the Odia astronomical tradition Praharaj is codifying. Bellatrix as Kārttikeya and Saiph as Kārtavīrya likewise."}]}, {"key": "venus-evening", "title": "Venus as evening star", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Venus", "bayer": null, "constellation": null}, "sanskrit_db_id": null, "names": [{"language": "Bengali", "region": "Bengal", "name_native": "সন্ধ্যাতারা", "name_roman": "sandhyā-tārā", "literal_meaning": "'evening star'", "register": "vernacular", "confidence": "certain", "usage_note": "Sub-lemma ~তারা under the headword সন্ধ্যা. The learned doublet সান্ধ্যতারা / সান্ধ্যতারকা is at p. 1005.", "quote": "~তারা n. the evening star, the Vesper.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. সন্ধ্যা sandhyā, sub-lemma ~তারা, p. 979", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%B8%E0%A6%A8%E0%A7%8D%E0%A6%A7%E0%A7%8D%E0%A6%AF%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Bengali", "region": "Bengal", "name_native": "সাঁঝের তারা", "name_roman": "sāñjher tārā", "literal_meaning": "'the star of dusk' (sāñjh, the colloquial Bengali for evening)", "register": "vernacular", "confidence": "certain", "usage_note": "Given by Dāsa as the plain Bengali equivalent of the learned সান্ধ্যতারা, alongside শুক্রতারা.", "quote": "সান্ধ্য sāndhya [সন্ধ্যা + অ (ভবার্থে)] বিণ, সায়ংকালীন। 2 সন্ধ্যাসম্বন্ধীয়। ̃তারা -সাঁঝের তারা; শুক্রতারা evening star; vesper.", "citation": "Jñānendramohana Dāsa, Bāṅgālā Bhāṣāra Abhidhāna, 2nd rev. ed., Kalikātā: Indian Publishing House [bhūmikā 1937] (DSAL digital ed.), s.v. সান্ধ্য sāndhya, sub-lemma ̃তারা, p. 2046", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/dasa_query.py?page=2046", "notes": null}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಸಂಜೆದಾರಕಿ", "name_roman": "sañje-tāraki", "literal_meaning": "the evening star", "register": "vernacular", "confidence": "certain", "usage_note": "Kittel's citation (J. 26,5) is to the Jaimini Bhārata, i.e. it is a literary attestation.", "quote": "ಸಂಜೆ sañje. = ಚಂಜೆ, ಸನ್ದೆ. Tbh. of ಸನ್ಧ್ಯೆ. evening. … — ಸಂಜೆದಾರಕಿ. -ತಾರಕಿ. an evening-star (J. 26, 5).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಸಂಜೆ sañje, p. 1564", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1564", "notes": "A Kannada compound of two naturalised words (sañje < sandhyā, tāraki < tārakā), so the material is Sanskrit but the formation is not. Kittel does not identify the body; on the evidence it is Venus, but he says only 'an evening-star', so no Bayer designation is asserted. No corresponding Kannada morning-star compound is recorded — for the morning star Kittel cites Telugu, not Kannada (s.v. ಬಯ್ಗು, p. 1143)."}, {"language": "Odia", "region": "Odisha", "name_native": "ପହରିକିଆ ତାରା", "name_roman": "Paharikiā tārā", "literal_meaning": "'the one-watch star' — the star that lasts a prahara", "register": "vernacular", "confidence": "certain", "usage_note": "The general Odia evening-star word. Praharaj's note insists that it is not a star at all but a planet, and the same body as the morning star.", "quote": "ପହରିକିଆ ତାରା— Paharikiā tārā … ଦେ. ବି— ରାତି ପ୍ରହରକଠାରେ ପଶ୍ଚିମରେ ବୁଡ଼ିଯିବା ଶୁକ୍ର ଗ୍ରହ… —The Evening star; the Hesperus; Venus. [ଦ୍ର—ଏହି ପହରିକିଆ ତାରା ପ୍ରକୃତରେ ତାରା ନୁହେଁ; ଏହା ଗୋଟିଏ ଗ୍ରହ ଓ ଏହା ପୁଣି ପାହାନ୍ତି ତରା ରୂପେ କେତେଦିନ ପାହାନ୍ତିଆରେ ପୂର୍ବ ଦିଗରେ ଦେଖାଯାଏ।]", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ପହରିକିଆ ତାରା Paharikiā tārā, p. 4687", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AA%E0%AC%B9%E0%AC%B0%E0%AC%BF%E0%AC%95%E0%AC%BF%E0%AC%86%20%E0%AC%A4%E0%AC%BE%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "Praharaj's synonym column prints the Bengali equivalent of this Odia evening-star headword as শুকতারা (OCR'd on DSAL as 'ত্তকতারা'), and prints the same Bengali word against the MORNING-star headword ପୁଆଁ ତରା at p. 4877 (OCR'd 'গুকতারা'). That is direct cross-language evidence for the Bengali morning/evening ambiguity flagged in the শুকতারা entry."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "ඉරබටු තරුව", "name_roman": "irabaṭu-taruva", "literal_meaning": "'star after sunset' — Jayatilaka's own gloss; ඉරබටු ira-baṭu 'sunset' from ඉර ira, the inherited Sinhala word for the sun", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "ඉරබටු තරුව irabaṭu1-taruva , s., (lit. star after sunset) evening star, planet Venus: LṃkVrṇ 2-9; Sāmdrkś 13-24; Ākāś 17-15; MāBhū 4-10.", "citation": "Jayatilaka (ed.), A Dictionary of the Sinhalese Language (Royal Asiatic Society, Ceylon Branch, 1935– ), s.v. ඉරබටු තරුව irabaṭu-taruva, p. 1505", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/jayatilaka_query.py?qs=evening%20star&matchtype=default", "notes": "Wholly native. Carter has it only as the Sinhala gloss inside Sanskrit headwords — පශ්චිම·තරුව paścima·taruva 'evening star, ඉරබටු තාරකාව' (p. 368) and සන්‍ධ්‍යා·තාරකාව (p. 648) — and prints the variant හිර·බටු hira·baṭu, 'sunset, as හිරබටුතරුව, sunset star, evening star' (p. 724). Sinhala therefore lexicalises the morning and evening apparitions separately with two native compounds, as Malayalam does with പെരുമീന്‍/കൊററി."}, {"language": "Tamil", "region": "Tamil Nadu", "name_native": "மாலைவெள்ளி", "name_roman": "mālai-veḷḷi", "literal_meaning": "evening-white", "register": "vernacular", "confidence": "certain", "usage_note": "The evening-star half of the Tamil pair; the morning half is viṭiveḷḷi / kālaiveḷḷi.", "quote": "மாலைவெள்ளி mālai-veḷḷi , n. < id. +. Venus, when it appears as the evening star; அந்தியிற்றோன்றும் சுக்கிரன். (W.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. மாலைவெள்ளி, vol. V p. 3179, marked (W.) after Winslow", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AE%BE%E0%AE%B2%E0%AF%88%E0%AE%B5%E0%AF%86%E0%AE%B3%E0%AF%8D%E0%AE%B3%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "Only two Tamil words for the evening star are in the Lexicon: this one and the Sanskrit-based அந்திநட்சத்திரம் anti-naṭcattiram (p. 83), 'Evening star; மாலைவெள்ளி'. The morning star, by contrast, has at least eight Tamil names — an asymmetry worth noting: the Tamil sky-vocabulary is a dawn vocabulary."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": "ತಂಜದ ಬೊಳ್ಳಿ", "name_roman": "tanjada boḷḷi", "literal_meaning": "'the star of evening' (ತಂಜ tanja 'evening, sunset, night' + genitive -ದ -da + ಬೊಳ್ಳಿ boḷḷi 'star')", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "ತಂಜ tanja, s. Evening, sunset, night. —ದ ಬೊಳ್ಳಿ the evening star.", "citation": "Männer, Tuḷu–English Dictionary (1886), s.v. ತಂಜ tanja, p. 262 (sub-entry)", "source_url": "https://archive.org/download/tuluenglishdicti00mnrich/page/n279_w1400.jpg", "notes": "Read directly from the page scan of p. 262; Männer's dash convention repeats the headword, so the full compound is ತಂಜದ ಬೊಳ್ಳಿ. Wholly native. Note the split with Kodava: Tulu lexicalises Venus as the EVENING star, Kodagu as the MORNING star, both on the same *veḷ root. Männer's Tulu→English volume has no entry for 'morning star' at all."}, {"language": "Odia", "region": "Sambalpur (western Odisha)", "name_native": "କେଉଁଟି ତାରା", "name_roman": "Keuñṭi tārā", "literal_meaning": "'the fisherwoman's star' — keuṭa/keuṇṭa is the fisher caste", "register": "folk", "confidence": "certain", "usage_note": "A caste-and-labour name for a planet: the star that goes down in the west a watch into the night, which Praharaj identifies flatly as Venus.", "quote": "କେଉଁଟି ତାରା— Keuñṭi tārā ପ୍ରାଦେ. (ସମ୍ବଲପୁର) ବି— ପହରିକିଆ ତାରା; ପଶ୍ଚିମାକାଶରେ ରାତି ପହରକଠାରେ ବୁଡ଼ିବା ଜ୍ୟୋତିଷ୍କ (ଏହାହିଁ ଶୁକ୍ର ଅଟେ।)—Evening Star.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. କେଉଁଟି ତାରା Keuñṭi tārā, p. 1740", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%95%E0%AD%87%E0%AC%89%E0%AC%81%E0%AC%9F%E0%AC%BF%20%E0%AC%A4%E0%AC%BE%E0%AC%B0%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "The 'fisherwoman' reading of keuñṭi is mine, from the caste name; Praharaj does not gloss it. It pairs with ଫୁକିଆ at p. 5239, whose example sentence is also about fisherwomen — so in western and princely Odisha both apparitions of Venus are named from the fishing household's working day."}, {"language": "Khasi", "region": "Khasi and Jaintia hills, Meghalaya", "name_native": null, "name_roman": "'lur-miet", "literal_meaning": "the night star", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "'lur-miet, u, n. the evening star.", "citation": "Nissor Singh, Khasi-English Dictionary (1906), s.v. 'lur-miet, p. 120", "source_url": "https://archive.org/download/khasienglishdict00singrich/khasienglishdict00singrich_djvu.txt", "notes": "miet is 'night'."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "sukąr, sukro, sukur ipil", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "sukro, n. The planet Venus as an evening star. (H. sukr; only in books.)", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. sukąr, sukro, sukur ipil, c. pp. 370-372", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "Bodding's parenthesis '(only in books)' is the point of the entry: the Sanskrit/Hindi planet name is attested in Santali print but not in Santal speech. He marks Sani 'the planet Saturn' the same way. This is the clearest statement in any of these dictionaries that the graha system did not take."}]}, {"key": "sirius", "title": "Sirius", "kind": "star", "ra": 101.29, "dec": -16.72, "modern_star": {"common_name": "Sirius", "bayer": "α Canis Majoris", "constellation": "Canis Major"}, "sanskrit_db_id": "lubdhaka", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "लोभी", "name_roman": "lōbhī", "literal_meaning": "greedy one", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "लोभी lōbhī m (Popular form of लुब्धक S) Sirius or the Dog-star.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. लोभी, p. 725", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B2%E0%A5%8B%E0%A4%AD%E0%A5%80&searchhws=yes&matchtype=exact", "notes": "A folk-etymological reshaping: लुब्धक 'hunter' is pulled onto the everyday Marathi word लोभी 'greedy, covetous'. Molesworth's phrase 'Popular form' is the register signal."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Purad (Hola); Mes", "literal_meaning": "a bird; its eggs", "register": "tribal", "confidence": "unidentified", "usage_note": "Orion throws a stone — the Pleiades — at the bird, so that the hunter can take the eggs. The survey does not record whether he hit it.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Recorded in only one or two villages and never pinned to particular stars; the authors note the geometrical awkwardness that Purad lies east of Orion, so the stone would have to curve. The same bird-nest-and-thrown-object figure is what Hoffmann records for Mundari at Aldebaran and the Pleiades, and Campbell for Santali in Lyra. Three independent recorders, three parts of the sky, one story."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Tiva", "literal_meaning": "the stool a farmer stands on to winnow", "register": "tribal", "confidence": "disputed", "usage_note": "The implement from which grain is dropped into the wind so that the husk blows away.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported."}, {"language": "Toda", "region": "Nilgiri hills, Tamil Nadu", "name_native": null, "name_roman": "Ishtkati", "literal_meaning": null, "register": "tribal", "confidence": "likely", "usage_note": "Corresponds to the Badaga etukadichi, 'bull deceiving': a Badaga once saw a star so bright he took it for the morning star and let his bulls out of the pen; when day did not come he said, let the star be called etukadichi.", "quote": "A single star called Ishtkati is almost certainly Sirius.", "citation": "Rivers, The Todas (1906), pp. 594-595", "source_url": "https://archive.org/download/todas00rivegoog/todas00rivegoog_djvu.txt", "notes": "Rivers is careful: Jupiter was pointed out to him as Ishtkati at first and he rejects that. The story attached is a Badaga one and Rivers treats the name as borrowed."}, {"language": "Bengali", "region": "Bengal", "name_native": "লুব্ধক", "name_roman": "lubdhaka", "literal_meaning": "'the hunter, the fowler' (also 'greedy one')", "register": "sanskritic", "confidence": "certain", "usage_note": "The Sanskrit star-name surviving unaltered in the modern Bengali lexicon, with its hunter etymology still transparent in the same entry.", "quote": "লুব্ধক n. a hunter; a fowler; a lecher; (astr.) the Sirius, the Dogstar.", "citation": "Sailendra Biswas, Samsad Bengali-English Dictionary, 3rd ed., Calcutta: Sahitya Samsad, 2000 (DSAL digital ed.), s.v. লুব্ধ lubdha, sub-entry লুব্ধক, p. 930", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/biswas-bengali_query.py?qs=%E0%A6%B2%E0%A7%81%E0%A6%AC%E0%A7%8D%E0%A6%A7&searchhws=yes&matchtype=exact", "notes": null}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಲುಬ್ಧಕ", "name_roman": "lubdhaka", "literal_meaning": "the hunter", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಲುಬ್ಧಕ lubdhaka. a greedy or avaricious man, a miser (ಕೃಪಣ, ದೀನ Nn. 127). 2, a huntsman (ಶಾಬರ, ಕಿರಾತ 127; ಕಣ್ಟಕ, ಬೇಡ Nn. 39). 3, the sixth (or eighth, My.). nakṣatra or lunar mansion (ಆರ್ದ್ರೆ, ಆರ್ದ್ರಾನಕ್ಷತ್ರ 127; ಆರ್ದ್ರೆ, ಪುಷ್ಯ Mr. 39). 4, the star Sirius.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಲುಬ್ಧಕ lubdhaka, p. 1440", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1440", "notes": "HOMONYM WARNING, and an important one: in Kannada lexicography Lubdhaka is primarily the name of the mansion Ārdrā (Betelgeuse), and only in Kittel's fourth sense the star Sirius. The Sanskrit database keeps these apart as 'lubdhaka' (Sirius) and 'ardra' (Betelgeuse). Anyone reading a Kannada nighaṇṭu gloss ಲುಬ್ಧಕ = ಆರ್ದ್ರೆ as meaning Sirius would go wrong. Brown records no Sirius name in Telugu at all."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "लुब्धक", "name_roman": "lubdhaka", "literal_meaning": "hunter", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "लुब्धक lubdhaka m S A hunter. 2 Hence (Shiva having transformed himself into a hunter in order to shoot an arrow, viz. the three stars of the belt of Orion, at Brahmá transformed into a buck and pursuing his own daughter metamorphosed into a doe) The hunter, i.e. Sirius or dog-star.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. लुब्धक, p. 721", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B2%E0%A5%81%E0%A4%AC%E0%A5%8D%E0%A4%A7%E0%A4%95&searchhws=yes&matchtype=exact", "notes": "The fullest 19th-century Marathi statement of the Prajāpati-as-buck myth. Note the local twist: it is Śiva, not Rudra as such, who takes the hunter's form."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "व्याध", "name_roman": "vyādha", "literal_meaning": "huntsman", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "व्याध vyādha m S A hunter or huntsman. Hence the star Sirius. See लुब्धक.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. व्याध, p. 777", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B5%E0%A5%8D%E0%A4%AF%E0%A4%BE%E0%A4%A7&searchhws=yes&matchtype=exact", "notes": "Shortened from मृगव्याध. Still current in modern Marathi as व्याध for Sirius / Canis Major."}, {"language": "Odia", "region": "Odisha", "name_native": "ପ୍ରଶ୍ୱା", "name_roman": "Praṡwā", "literal_meaning": "uncertain; Praharaj marks it ସଂ. and offers no derivation", "register": "sanskritic", "confidence": "likely", "usage_note": "Praharaj identifies it flatly with Lubdhaka and with α Canis Majoris, and uses it as a fixed point elsewhere — Canopus is located 'in the southern sky, south of Praśwā' (p. 4095).", "quote": "ପ୍ରଶ୍ୱା— Praṡwā ସଂ. ବି.— ପୁନର୍ବସୁ ନକ୍ଷତ୍ର ପୁଞ୍ଜର ଉଜ୍ଜ୍ୱଳତମ ତାରା, ଏହାର ଅନ୍ୟ ନାମ ଲୁବ୍ଧକ (ନକ୍ଷତ୍ର ତଳେ ନୋଟ ଦେଖ)— The Dogstar; sirius; Alpha Canis Majoris.", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ପ୍ରଶ୍ୱା Praṡwā, p. 5131", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%AA%E0%AD%8D%E0%AC%B0%E0%AC%B6%E0%AD%8D%E0%AD%B1%E0%AC%BE&searchhws=yes&matchtype=exact", "notes": "Graded likely because of an internal problem: Praharaj calls Praśwā 'the brightest star of the Punarvasu group', and his Punarvasu diagram at p. 4095 is a six-star bow running from Castor and Pollux through Procyon to Sirius — i.e. he has stretched Punarvasu across three modern constellations. The identification with Sirius is nevertheless explicit and repeated. The word does not appear in the Sanskrit database and I have not traced it to a Sanskrit source."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "සාරමේය·තාරකාව", "name_roman": "sāramēya·tārakāva", "literal_meaning": "'the dog star' (Sanskrit sārameya 'canine, son of Saramā')", "register": "sanskritic", "confidence": "disputed", "usage_note": null, "quote": "සාරමේය·තාරකාව sāramēya·tārakāva , n. dog star, Sirius, ඒ නම්වූ තරුව.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. සාරමේය·තාරකාව sāramēya·tārakāva, p. 674", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=dog%20star&matchtype=default", "notes": "Recorded as a negative in disguise. Carter's Sinhala gloss ඒ නම්වූ තරුව means 'the star of that name' — he had no Sinhala word to give, so he coined a Sanskrit calque of the English 'dog star' and admitted as much in the gloss. Jayatilaka returns 'No results' for Sirius, and the word Sirius does not occur once in Clough 1892. There is no attested vernacular Sinhala name for the brightest star in the sky."}]}, {"key": "arcturus", "title": "Arcturus", "kind": "star", "ra": 213.92, "dec": 19.18, "modern_star": {"common_name": "Arcturus", "bayer": "α Boötis", "constellation": "Boötes"}, "sanskrit_db_id": "svati", "names": [{"language": "Tamil", "region": "Tamil Nadu", "name_native": "காற்றினாள்", "name_roman": "kāṟṟiṉāḷ", "literal_meaning": "the wind's star (kāṟṟu 'wind' + nāḷ)", "register": "vernacular", "confidence": "certain", "usage_note": "The only Tamil word the Lexicon's English side returns for a search on 'Arcturus'. A Tamil translation of the Sanskrit Vāyavya: the Wind-god's asterism, rendered with the ordinary Tamil word for wind.", "quote": "காற்றினாள் kāṟṟiṉāḷ , n. < id. + நாள். Svātī, the 15th nakṣatra, as having Wind-god for its presiding deity, Arcturus; வாயுவைத் தேவதையாகக் கொண்ட சுவாதிநாள். (பிங்.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. காற்றினாள், vol. II p. 909, citing the Piṅkala Nikaṇṭu", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%95%E0%AE%BE%E0%AE%B1%E0%AF%8D%E0%AE%B1%E0%AE%BF%E0%AE%A9%E0%AE%BE%E0%AE%B3%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "The Lexicon spells out the modern identification, 'Arcturus', which the Sanskrit database also gives for Svātī. Its half-borrowed rival is அனிலநாள் aṉila-nāḷ (p. 191, < Skt. anila 'wind' + Tamil nāḷ, Tivākaram). The corresponding Sanskrit-database entry is pavana-svati, 'Pavana / Anila / Vāyavya'."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "కరువలిరిక్క", "name_roman": "karuvali-rikka", "literal_meaning": "the wind star", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "కరువలి [Tel.] n. Wind, air. గాలి, వాయువు. కరువలిపట్టి Bhīma or Hanuman. కరువలిరిక్క The Star Arcturus, స్వాతీ నక్షత్రము. కరువలివిందు Fire అగ్ని, వాయుసఖుడు.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. కరువలి karuvali, p. 252", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=252", "notes": "A calque on the deity — Svāti's devatā is Vāyu — with the native Telugu word karuvali for wind. Compare the Sanskrit aliases in the db under 'pavana-svati' (Pavana / Anila / Vāyavya), which do exactly the same thing in Sanskrit. One of the few places where Brown gives the modern identification himself ('The Star Arcturus')."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "दडप्या", "name_roman": "daḍapyā", "literal_meaning": "the pressers-down", "register": "folk", "confidence": "certain", "usage_note": "so called because this rain flattens the standing crop", "quote": "दडप्या daḍapyā f pl (दडपणें) A term for the स्वातीनक्षत्र and for the rain which falls under it. Because this rain presses down the crops.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. दडप्या, p. 400", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A6%E0%A4%A1%E0%A4%AA%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "From दडपणें 'to press down'. Sits in flat contradiction to the learned lore under स्वाती, where the same rain is the auspicious one that makes pearls — a good illustration of how far the cultivators' sky is from the śāstric one."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "స్వాతికర్తి", "name_roman": "svāti-karti", "literal_meaning": "the Svāti solar period", "register": "folk", "confidence": "certain", "usage_note": "AGRICULTURAL/SEASONAL. The kārte of Svāti, thirteen days of the sun in October-November; and the pearl-oyster belief attached to it.", "quote": "స్వాతి [Skt.] n. Arcturus, the fifteenth lunar asterism. చిత్తకు అవలలినక్షత్రము, పదిహేనో నక్షత్రము. స్వాతికర్తి the fifteenth counstellation in which the sun happens to be for thirteen days in the month of October or November. స్వాతి చిప్పలు the oysters that gaps expecting drops of rain in Swāti.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. స్వాతి svāti, p. 1384", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=1384", "notes": "svāti-cippalu, 'the oysters that gape expecting drops of rain in Svāti', is the Telugu form of the pan-Indian belief that a raindrop falling in Svāti becomes a pearl. Registered folk because kārte and the oyster proverb belong to the popular almanac, not the śāstra."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಸ್ವಾತಿ", "name_roman": "svāti", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The naturalised Kannada form is ಸಾತಿ sāti (p. 1613, 'Tbh. of ಸ್ವಾತಿ').", "quote": "ಸ್ವಾತಿ svāti. = ಸಾತಿ 1. an auspicious constellation; the star Arcturus as forming the fifteenth lunar asterism.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಸ್ವಾತಿ svāti, p. 1692", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1692", "notes": "Compare Telugu, which has both this and a fully vernacular name for the same star, కరువలిరిక్క 'the wind star'. Kannada has only the borrowed name — a clean instance of the asymmetry this file is trying to document."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ചോതി", "name_roman": "cōti", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ചോതി cō̄taി čōδi 1. Tdbh., സ്വാതി The 15th lunar asterism, Arcturus. 2. Tdbh. ജ്യോതിസ്സ് light പരമചോതി Anj.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ചോതി cōti, p. 396", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%9A%E0%B5%8B%E0%B4%A4%E0%B4%BF&searchhws=yes&matchtype=exact", "notes": "Two different Sanskrit words, svāti and jyotis, have fallen together as ചോതി in Malayalam — a good illustration of what tadbhava reduction costs. Gundert confirms the star sense again s.v. സ്വസാ, p. 1074: 'Arcturus, ചോതി.'"}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "ස්වාති", "name_roman": "svāti", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ස්වාති svāti , n. (සු well, අත් to go constantly), the star Arcturus, which is the fifteenth lunar asterism.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. ස්වාති svāti, p. 711", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=Arcturus&matchtype=default", "notes": "Carter's parenthetical parse is a Sanskrit folk-etymology, not Sinhala morphology. The Eḷu form is සාය sāya (p. 673), which Carter glosses first as 'evening' and then as 'the star Arcturus'; Clough has the same double sense at 'Sá' (p. 675). Jayatilaka has no Arcturus entry."}]}, {"key": "antares", "title": "Antares", "kind": "star", "ra": 247.35, "dec": -26.43, "modern_star": {"common_name": "Antares", "bayer": "α Scorpii", "constellation": "Scorpius"}, "sanskrit_db_id": "jyeshtha", "names": [{"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "తాటిరిక్క", "name_roman": "tāṭi-rikka", "literal_meaning": "the palmyra star", "register": "vernacular", "confidence": "certain", "usage_note": "The month Jyeṣṭha is named from it: tāṭi-rikka-nela.", "quote": "తాటి or తాడి [Tel. Infl. of తాడు.] adj. Belonging to the palmyra tree. … తాటిరిక్క the constellation called జ్యేష్ఠా. తాటిరిక్కనెల the month called జ్యేష్ఠి మాసము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. తాటి tāṭi, p. 521", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=521", "notes": "This is one of a complete set of Telugu descriptive names for the lunar mansions that Brown records piecemeal under their first elements. They are formed X-cukka / X-rikka ('X-star') or X-rūpu-rikka ('X-shaped star'), and are entirely independent of the Sanskrit names, which Telugu also has. Motivation not stated by Brown; the palmyra fruits in Jyeṣṭha in the Telugu country, which is the likeliest link, but this is inference and is not asserted here."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "अडवण्या", "name_roman": "aḍavaṇyā", "literal_meaning": "the obstructors / hinderers", "register": "folk", "confidence": "certain", "usage_note": "names both the asterism and the rain that falls under it", "quote": "अडवण्या aḍavaṇyā f pl (अडविणें) A term for ज्येष्ठानक्षत्र and for the rain which falls under it.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. अडवण्या, p. 17", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%85%E0%A4%A1%E0%A4%B5%E0%A4%A3%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "One of a set of Marathi cultivators' names in which a nakṣatra is renamed for what its rains DO to the crop. From अडविणें 'to obstruct'. Molesworth carries a second, homophonous headword अडवण्या 'that obstructs or hinders' immediately after, confirming the derivation."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Argom", "literal_meaning": "a clod-crusher, a harrow without teeth", "register": "tribal", "confidence": "likely", "usage_note": "A farming implement seen in the sky: three stars in a line with a fourth at the apex.", "quote": "Argom. A constellation so named. It is part of the constellation Scorpio, and is composed of 4 stars, three of which are in line, and the other at the apex of the triangle. The star at the apex is Antares, or cor scorpii, a star of 1st. magnitude.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Argom, p. 20", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Deliberately not equated with Jyeṣṭhā: the nakshatra is Antares with σ and τ Sco, whereas Argom is a four-star harrow whose apex happens to be Antares. Campbell's separate homonym entry Argom 'a clod crusher, a harrow without teeth' fixes the literal sense."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಜೇಟೆ", "name_roman": "jēṭe", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಜೇಟೆ jēṭe. = ಜೆಷ್ಟೆ. Tbh. of ಜ್ಯೇಷ್ಠೆ (Śmd. 370).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಜೇಟೆ jēṭe, p. 696", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=696", "notes": "REPRESENTATIVE FORM. Compare Telugu జెష్ట jeṣṭa (Brown p. 469), which Brown says has drifted from 'elder sister' to 'a plague, a pest, gibberish' — the same tadbhava, but in Telugu it has left the sky and become an insult. Kittel's tatsama ಜ್ಯೇಷ್ಠೆ (p. 701) is the astronomical one: 'the eighteenth lunar mansion, being a part of scorpio'."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "കേട്ട / തൃക്കേട്ട", "name_roman": "kēṭṭa / tṛkkēṭṭa", "literal_meaning": "തൃ- (< തിരു) is the honorific 'sacred'", "register": "sanskritic", "confidence": "certain", "usage_note": "Tṛkkēṭṭa is one of the inauspicious birth-stars in Kerala reckoning; Gundert lists it under ഗണ്ഡാന്തം (p. 329), the perilous junctions of the asterism cycle.", "quote": "കേട്ട kēṭṭa kēṭṭa തൃക്കേട്ട T. M. (Tdbh., ജ്യേഷ്ഠ; ചേ ട്ട Pandora) The 18th lunar asterism in Scorpion.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. കേട്ട kēṭṭa, p. 293", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%95%E0%B5%87%E0%B4%9F%E0%B5%8D%E0%B4%9F&searchhws=yes&matchtype=exact", "notes": "Gundert's parenthesis '(ചേട്ട Pandora)' refers to Cēṭṭā/Jyeṣṭhā the goddess of misfortune, whom he likens to Pandora — the asterism and the ill-luck goddess share the name. Gundert gives no separate name for Antares as a star apart from the asterism."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "දෙට, දෙටු", "name_roman": "deṭa, deṭu", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "දෙට, දෙටු deṭa, deṭu , a . E. of ජ්‍යේෂ්ඨ .", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. දෙට, දෙටු deṭa, deṭu, p. 297", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=%E0%B6%AF%E0%B7%99%E0%B6%A7&matchtype=default&searchhws=yes", "notes": "Carter's 'E. of' = 'Eḷu form of' (verified against Carter's own abbreviation key), i.e. Sanskrit jyeṣṭha in Sinhala phonology. Clough anchors the asterism to the sky: 'Jyeshthá ... the eighteenth, comprising three stars of which one is [α] Scorpionis figured by a ring or earring' (p. 196). Antares itself has no independent Sinhala name — Jayatilaka's only entry is the twentieth-century English loanword අන්ටරේස් anṭarēs, '[lw. Eng. Antares]' (p. 317)."}]}, {"key": "season-marker", "title": "Seasonal and agricultural star-markers", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "unidentified — see ഞേങ്ങോല്‍", "bayer": null, "constellation": null}, "sanskrit_db_id": "ashvayuj", "names": [{"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഞാററുവേലി", "name_roman": "ñāṟṟuvēli", "literal_meaning": "'the ñāṟṟu times' (variant ഞാററുവാല)", "register": "vernacular", "confidence": "likely", "usage_note": "The days within an asterism-period that are fixed on for transplanting rice.", "quote": "ഞാററുവാല , — വേലി V1. days fixed upon for transplanting.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഞാറു ñāṟu, p. 412 (sub-entries ഞാററുവാല, ഞാററുവേലി)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%9E%E0%B4%BE%E0%B4%B1%E0%B5%81&searchhws=yes&matchtype=exact", "notes": "This is Gundert's printing of the word that modern Malayalam writes ഞാറ്റുവേല ñāṟṟuvēla, the name of the twenty-seven asterism rain-periods. Marked 'likely' because Gundert prints വേലി (with retroflex l and final i) rather than വേല, and glosses it only as 'days fixed upon for transplanting'; whether the two are the same word or a near-homophone is not settled by this entry alone."}, {"language": "Tulu", "region": "South Canara (Tulu Nadu)", "name_native": null, "name_roman": "Paggu, Besha, Kártél, Áte, Sóna, Nirnala, Bóntel, Járde, Perárde, Puyintél, Máyi, Suggi", "literal_meaning": null, "register": "vernacular", "confidence": "certain", "usage_note": "These, and not any star, are what Tulu cultivation runs on: Sturrock states that all the operations of cultivation are regulated by the solar months, which alone are well known to the cultivating classes in Tuluva proper, while written leases follow the lunar reckoning because they are drawn up in Kannada by Brahmins.", "quote": "…there are Tulu names for the solar, but not for the luni-solar months, thus— Sanskrit. Tulu. Mésha. Paggu. Vrishabha. Besha. Mithuna. Kártél. Karkataca. Áte. Sinha. Sóna. Kanya. Nirnala. Tulá. Bóntel. Vrischika. Járde. Dhanus. Perárde. Makara. Puyintél. Kumbha. Máyi. Mína. Suggi.", "citation": "Sturrock, Madras District Manuals: South Canara, vol. I (Madras, 1894), p. 216", "source_url": "https://archive.org/download/dli.ministry.08447/GR386_djvu.txt", "notes": "Included because it is the negative answer to the agricultural-star question for Tulu, stated positively. Where Malayalam divides the year by twenty-seven asterism-periods (ñāṟṟuveḷa) and names each after a star, Tulu divides it by twelve solar months with wholly native names that are not star-names at all. Sturrock romanizes only; no Kannada script is printed, so name_native is null. The quote is from the archive.org OCR and its accents are as OCR'd."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "മുഴക്കോല്‍", "name_roman": "muḻakkōl", "literal_meaning": "'cubit-rod, measuring rod' (മുഴം a cubit + കോല്‍ rod) — the carpenter's 24-finger measure", "register": "folk", "confidence": "disputed", "usage_note": "Second name of the same asterism as ഞേങ്ങോല്‍; the agricultural use is given at that entry.", "quote": "മുഴക്കോല്‍ CS. 1. ആശാരിക്കോല്‍ carpenter's rod of 24 വിരല്‍ . 2. the constellation ഞെ ങ്ങോല്‍ .", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. മുഴം muḻam, p. 846 (sub-entry മുഴക്കോല്‍, sense 2)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%AE%E0%B5%81%E0%B4%B4%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "Both Malayalam names for this asterism are craftsmen's straight-edges — a plough-beam and a carpenter's rule. That two independent entries in Gundert cross-reference each other rules out a printing slip."}, {"language": "Tamil", "region": "Tamil Nadu (coast)", "name_native": "ஐப்பசிக்குழப்பம்", "name_roman": "aippaci-k-kuḻappam", "literal_meaning": "the Aippaci turmoil", "register": "folk", "confidence": "certain", "usage_note": "A WEATHER TERM keyed to an asterism-named month — the practical end of the Tamil star-calendar, matching āṟāmīṉ-aṟavōṭṭu among the seamen.", "quote": "ஐப்பசிக்குழப்பம் aippaci-k-kuḻappam , n. < ஐப்பசி +. Rough weather at the setting in of the north-east monsoon in October; ஐப்பசிமாதத்தில் தோன்றுகிற புயல். (J.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஐப்பசிக்குழப்பம், vol. I p. 578, marked (J.)", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%90%E0%AE%AA%E0%AF%8D%E0%AE%AA%E0%AE%9A%E0%AE%BF%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AF%81%E0%AE%B4%E0%AE%AA%E0%AF%8D%E0%AE%AA%E0%AE%AE%E0%AF%8D&searchhws=yes&matchtype=exact", "notes": "Aippaci and the Pleiades passage of āṟāmīṉ-aṟavōṭṭu mark the same weather from two directions — the month named for the first asterism and the sun's transit of the third. Together they are the whole of the agricultural and maritime star-calendar recoverable from these lexica; nothing more specific (sowing-stars, harvest-stars, named navigation stars) was found in the Tamil Lexicon, Winslow, or in Thurston's Castes and Tribes of Southern India."}]}, {"key": "vega", "title": "Vega", "kind": "star", "ra": 279.23, "dec": 38.78, "modern_star": {"common_name": "Vega", "bayer": "α Lyrae", "constellation": "Lyra"}, "sanskrit_db_id": "abhijit", "names": [{"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "نسر", "name_roman": "nasru'l-wāqiʻ", "literal_meaning": "'the falling vulture'", "register": "vernacular", "confidence": "likely", "usage_note": "The Arabic name that gives English 'Vega'. Its pair, nasru'ṭ-ṭāʼir 'the flying eagle', is Altair; Platts calls the dual nasrain 'the constellations of the Eagle and the Lyre'.", "quote": "A نسر nasr , s.m. A vulture; — an eagle: — nasruʼt̤-t̤āʼir, or nasr-ě-t̤āʼir, s.m. 'The flying eagle,' the constellation of the Eagle: — nasruʼl-wāqěʻ, s.m. 'The falling vulture,' the constellation of the Lyre.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. nasr, p. 1138", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_query.py?page=1138", "notes": "confidence likely rather than certain because Platts glosses the terms as constellations (Lyra, Aquila) whereas in Arabic usage they name the bright stars Vega and Altair. name_native gives the headword نسر only; the compounds are printed in roman."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Bele kombro", "literal_meaning": "the egg thief", "register": "tribal", "confidence": "likely", "usage_note": "Part of a Santal figure in Lyra: two small stars are a pigeon's eggs and the bright star beside them is the thief that comes for them.", "quote": "Bele kombro. The egg stealer, a star so called, probably Vega.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Bele kombro, p. 51", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "Campbell himself hedges ('probably Vega'), so the identification is his and is graded likely. The compound is transparent from his own entries: 'Bele. An egg', and kombro 'thief'. The final syllable of kombro is illegible in both Internet Archive scans (printed 'kombroio' and 'kombroiii')."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "Potam bele", "literal_meaning": "the imperial pigeon's eggs", "register": "tribal", "confidence": "certain", "usage_note": null, "quote": "Potam bele. Epsilon Lyrae, two small stars very close to each other, near Vega, in the constellation Lyra.", "citation": "Campbell, A Santali-English Dictionary (1899), s.v. Potam bele, p. 512", "source_url": "https://archive.org/download/cu31924096339464/cu31924096339464_djvu.txt", "notes": "potam is the imperial pigeon, Carpophaga sylvatica (Campbell s.v.), bele an egg. The bird-and-eggs motif recurs across the whole set with different stars attached: Mundari puts the dove at Aldebaran with two egg stars beside it, Gondi puts Purad and Mes east of Sirius. Santali is the only one that also supplies the thief."}, {"language": "Sinhala", "region": "Sri Lanka", "name_native": "අභි ජිත්", "name_roman": "abhi jit", "literal_meaning": null, "register": "sanskritic", "confidence": "certain", "usage_note": "The intercalated 28th asterism, squeezed between the 21st and 22nd.", "quote": "අභි ජිත් abhi jit , n. a lunar asterism or three stars between the 21st and 22nd lunar asterisms.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. අභි ජිත් abhi jit, p. 50", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=between%20the%2021st&matchtype=default", "notes": "Sinhala inherited the 27/28 ambiguity along with the system: Carter's own නක්‍ෂත්‍රය entry speaks of 28 asterisms (p. 312) and Clough of 'twenty-eight in the moon's path' (p. 273), while the enumerated Eḷu list runs to 27. Jayatilaka makes the identification explicit at අබිජිත් abijit (p. 462), 'this is identified with vēgā, the brightest star in the constellation'."}]}, {"key": "constellation", "title": "'Constellation' as a word", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "any close cluster of stars", "bayer": null, "constellation": null}, "sanskrit_db_id": "tara", "names": [{"language": "Sinhala", "region": "Sri Lanka", "name_native": "උළු", "name_roman": "uḷu", "literal_meaning": "also 'tiles'", "register": "vernacular", "confidence": "certain", "usage_note": "Compounds: උළු කැන uḷu kæna 'cluster of stars, constellation' (p. 130); උළිඳු uḷin̆du and උළු රජ uḷu raja, which Carter parses as 'උළු star, ඉඳු lord' — 'Star-lord, Star-king', an epithet of the moon (p. 130).", "quote": "උළු uḷu , n . tiles; star.", "citation": "Carter, A Sinhalese-English Dictionary (Colombo, 1924), s.v. උළු uḷu, p. 130", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/carter_query.py?qs=%E0%B6%8B%E0%B7%85%E0%B7%94&matchtype=default&searchhws=yes", "notes": "An old native word for 'star', productive in poetic compounds but displaced in ordinary use by තරුව taruva and the Eḷu loan නැකත nækata."}, {"language": "Assamese", "region": "Assam", "name_native": "কুকুৰবাহী তৰা", "name_roman": "kukurabāhī tarā", "literal_meaning": "uncertain; 'the kukurabāhī stars' — most plausibly kukurā 'fowl' + bāhī 'nest, roost', i.e. a brood of stars, matching the second Assamese word for the same thing, থুপিতৰা 'clustered stars'", "register": "folk", "confidence": "unidentified", "usage_note": "The living Assamese word for a star-cluster, and the word the dictionary itself uses to define সপ্তৰ্ষি-মণ্ডল at p. 859 ('একলগে থকা এজাক কুকুৰ-বাহী তৰা', 'a flock of kukurabāhī stars together'). Its synonym থুপিতৰা thupi-tarā is at p. 483.", "quote": "কুকুৰবাহী তৰা kukurabāhī, tarā বি. খোপা বান্ধি ওচৰা-উচৰি হৈ-থকা সৰু সৰু তৰাৰ জাক বা জুম; থুপিতৰা; a constellation.", "citation": "Candrakanta Abhidhana (Assamese-Assamese-English), 2nd ed., Guwahati: Guwahati Bisbabidyalaya for the Assam Sahitya Sabha, 1962 (DSAL digital ed.), s.v. কুকুৰবাহী তৰা kukurabāhī tarā, p. 216", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/candrakanta_query.py?qs=%E0%A6%95%E0%A7%81%E0%A6%95%E0%A7%81%E0%A7%B0%E0%A6%AC%E0%A6%BE%E0%A6%B9%E0%A7%80%20%E0%A6%A4%E0%A7%B0%E0%A6%BE&searchhws=yes&matchtype=exact", "notes": "Confidence 'unidentified' refers to the sky object, not the word: the dictionary defines it generically, and does not tie it to any one cluster. I have deliberately NOT read it as the Pleiades, even though 'hen and chickens' is a standard European name for that cluster and Praharaj gives 'Hen and chickens' among the western names of Kṛttikā (p. 4095); the Assamese entry does not say so. The literal meaning is my reading of the compound and is marked as such."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಋಕ್ಷ", "name_roman": "ṛkṣa", "literal_meaning": "bear", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಋಕ್ಷ ṛikṣa. = ರುಕ್ಷ 2. a bear. 2, a star; a constellation, a lunar mansion. 3, the plant Bignonia indica (ದಿಣ್ಡಲಮರ G.). 4, N. of a mountain.", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಋಕ್ಷ r̥kṣa, p. 269", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=269", "notes": "Kittel preserves the Sanskrit bear/star polysemy intact. Telugu రిక్క rikka is the Middle-Indic descendant of the same word, but by Brown's time it means simply 'star' and has lost the bear."}]}, {"key": "scorpius", "title": "Scorpius", "kind": "figure", "ra": 245.0, "dec": -26.0, "modern_star": {"common_name": "Shaula and the Scorpion's sting", "bayer": "λ Scorpii and the ε–υ chain", "constellation": "Scorpius"}, "sanskrit_db_id": "mula", "names": [{"language": "Odia", "region": "Odisha", "name_native": "ମୂଳା ଶଙ୍ଖ", "name_roman": "Mūḻā ṡaṅkha", "literal_meaning": "'the Mūlā conch'", "register": "vernacular", "confidence": "certain", "usage_note": "Given as the Odia or native name of the 19th asterism, whose eleven stars Praharaj describes as a pair of dogs. The Odia figure for the whole Scorpius region is spelled out in the Jyeṣṭhā note: joining the stars of Anurādhā, Jyeṣṭhā and Mūlā gives a crab-scorpion (କଙ୍କଡ଼ାବିଛା) with its tail curled up — head Anurādhā, back Jyeṣṭhā, tail Mūlā.", "quote": "8 ଓ 9 ଚିହ୍ନିତ ତାରା ଦ୍ୱାରା ଯମଙ୍କର 2 ଟି କୁକୁର ବା ସାରମେୟ ଯୁଗଳ। ଓଡ଼ିଆ ବା ଦେଶୀୟ ନାମ—ମୂଳା ଶଙ୍ଖ। ପାଶ୍ଚାତ୍ୟ ନାମ—Scorpion's tail … ମନ୍ତବ୍ୟ—ଅନୁରାଧା, ଜ୍ୟେଷ୍ଠା ଓ ମୂଳା ନକ୍ଷତ୍ରର ତାରାମାନଙ୍କୁ କଳ୍ପନାଦ୍ୱାରା ଯୋଗ କଲେ ଲାଞ୍ଜକୁ ଉପରକୁ ଗୁଡ଼ାଇ କରି ଟେକିଥିବା ଗୋଟିଏ କଙ୍କଡ଼ାବିଛା ପରି ହେବ। ଏ ବିଛାର ମୁଣ୍ଡ ଅନୁରାଧା, ପିଠି ଜ୍ୟେଷ୍ଠା ଓ ଲାଙ୍ଗୁଡ଼ ମୂଳା।", "citation": "G. C. Praharaj, Purnnachandra Ordia Bhashakosha: a lexicon of the Oriya language, Cuttack: Utkal Sahitya Press, 1931-1940 (DSAL digital ed.), s.v. ନକ୍ଷତ୍ର Nakshatra, note on the 19th asterism ମୂଳା, p. 4095", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/praharaj_query.py?qs=%E0%AC%A8%E0%AC%95%E0%AD%8D%E0%AC%B7%E0%AC%A4%E0%AD%8D%E0%AC%B0&searchhws=yes&matchtype=exact", "notes": "Mūla's nine stars are λ (Shaula) and υ (Lesath) Scorpii and the chain ε, μ, ζ, η, θ, ι, κ, which Praharaj also reads as Yama's two dogs (stars 8 and 9). The Antares note in the same article identifies Jyeṣṭhā's three stars as σ, α (Antares) and τ Scorpii and calls Antares 'like a burning fire'; Antares itself has no separate Odia name in this dictionary."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "बडवण्या", "name_roman": "baḍavaṇyā", "literal_meaning": "beaters, mallets", "register": "folk", "confidence": "certain", "usage_note": "named from the heaviness of the rain", "quote": "बडवण्या baḍavaṇyā f pl of बडवणी (Beaters, malls.) A term, from its heaviness, for the rain which falls under मूळमहानक्षत्र.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. बडवण्या, p. 562", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AC%E0%A4%A1%E0%A4%B5%E0%A4%A3%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Molesworth glosses the term as belonging primarily to the rain rather than the asterism; the asterism is named मूळमहानक्षत्र, 'the great Mūla asterism'."}, {"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Michu; Vinchu", "literal_meaning": "the scorpion", "register": "tribal", "confidence": "likely", "usage_note": "Michu is held responsible for producing the corpse that appears in Leo.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Vinchu is the Marathi word, Michu is given as the Gondi. The scorpion reading agrees with Sanskrit Vṛścika and with Greek, but the story attached — that the scorpion's bite causes the death whose funeral is played out in Leo and Virgo — is found in neither."}]}, {"key": "moon", "title": "The Moon", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "the Moon", "bayer": "—", "constellation": "—"}, "sanskrit_db_id": null, "names": [{"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಮೀನ್ಗಳೆಱೆಯ", "name_roman": "mīngaḷeṟeya", "literal_meaning": "lord of the stars/fishes", "register": "vernacular", "confidence": "certain", "usage_note": "Also ತಾರಗೆಯಾಳ್ಮ tārageyāḷma, same sense, Kittel p. 752.", "quote": "— ಮೀನ್ಗಳೆಱೆಯ. -ಎಱೆಯ. the moon (ಚನ್ದಿರ, etc., ಶಶಿ Kk. 44).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಮೀನ್ mīn 2, p. 1328", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1328", "notes": "COGNATE PAIR with Telugu చుక్కలరేడు cukkala-rēḍu 'king of the stars = the moon' (Brown p. 449). The kenning is shared with Sanskrit (nakṣatreśa, uḍupati — Brown glosses both with the Telugu compound), but the Kannada and Telugu words are built entirely from Dravidian material, and the Kannada one puns on mīn 'fish'."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "चांदणी", "name_roman": "cāndaṇī", "literal_meaning": "little moon (from चंद्र)", "register": "vernacular", "confidence": "certain", "usage_note": "the word is the ordinary one in weather and night-sky talk; Molesworth records under it a belief in a malign 'blast from the stars'", "quote": "चांदणी cāndaṇī f A star. 2 An awning. 3 An ornament (like राखडी, but smaller) for the head of women. 4 A blast from the stars. Supposed to fall on horses if they are uncovered (i. e. without the Jhúl, or some rag or clout) whilst eating their grain. v पड, मार, हाण. 5 An inauspicious mark of the horse,—a white spot on the forehead.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. चांदणी, p. 277", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%9A%E0%A4%BE%E0%A4%82%E0%A4%A6%E0%A4%A3%E0%A5%80&searchhws=yes&matchtype=exact", "notes": "The everyday Marathi word for a star, formed on चंद्र 'moon' and unmarked by Molesworth, i.e. not treated as a Sanskrit loan; तारा and नक्षत्र are both marked S. Sense 4 records a genuine piece of Deccan folk belief — a malign 'blast from the stars' that strikes uncovered horses at their feed. The same entry ends with the proverb चांदण्यांत निजती आणि माडीची हवा पाहती, of one who sleeps under the stars but looks for the breeze of an upper storey."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "చుక్కలరేడు", "name_roman": "cukkala-rēḍu", "literal_meaning": "king of the stars", "register": "vernacular", "confidence": "certain", "usage_note": "Given by Brown twice — under cukka and as the vernacular gloss of Sanskrit nakṣatreśuḍu.", "quote": "చుక్కలతెరువు the sky ఆకాశము. చుక్కలరేడు the moon.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. చుక్క ṭsukka, p. 449", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=449", "notes": "COGNATE PAIR with Kannada ಮೀನ್ಗಳೆಱೆಯ mīngaḷeṟeya 'the moon' (lit. lord of the stars/fishes, Kittel p. 1328) and ತಾರಗೆಯಾಳ್ಮ tārageyāḷma (Kittel p. 752). The kenning 'lord of stars' is shared with Sanskrit but the words are Dravidian throughout."}]}, {"key": "sun", "title": "The Sun", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Denebola", "bayer": "β Leonis", "constellation": "Leo"}, "sanskrit_db_id": "uttara-phalguni", "names": [{"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഞാററുതല", "name_roman": "ñāṟṟutala", "literal_meaning": "'the head/beginning of the ñāṟṟu' — ñāṟṟu being both 'rice seedling' and the sun's station", "register": "vernacular", "confidence": "certain", "usage_note": "The Kerala farming calendar: the solar year is divided into stretches during which the sun stands in one asterism, each stretch named after that asterism and each carrying its own agricultural prescription. Gundert's worked example is തിരുവാതിരഞാററുതല, the Ārdrā period at the start of Mithunam (mid-June), 'best time for planting' — the onset of the south-west monsoon.", "quote": "ഞാററുതല (2) the time of a constellation f. i. തിരു വാതിരഞാ . in the beginning of Mithuna, best time for planting. അത്തംഞാ . feast in Kanni.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഞാറു ñāṟu, p. 412; and s.v. തല tala, p. 436", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%9E%E0%B4%BE%E0%B4%B1%E0%B5%81&searchhws=yes&matchtype=exact", "notes": "Gundert defines the unit precisely under തല, p. 436: 'a point of time, as the influence of a star, the rule of an asterism (= 13 4/9 days) തിരുവാതിര ഞാററു തല' — 13 4/9 days being 365.25 ÷ 27. He also gives ഞാററുനില and ഞാററുവട്ടം as further names of the same thing, and under ഞായറു (p. 411) the underlying definition തിരുവാതിരഞായററു നില, 'the sun's position in a constellation'. This is the ñāṟṟuveḷa scheme, attested in the standard dictionary of 1872 and still in farming use."}, {"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "ప్రొద్దురిక్క", "name_roman": "proddu-rikka", "literal_meaning": "the sun star", "register": "vernacular", "confidence": "certain", "usage_note": "The month Phālguna is named from it in the same vernacular shape: proddu-rikka-nela.", "quote": "ప్రొద్దు or పొద్దు [Tel.] n. The sun, సూర్యుడు. … ప్రొద్దురిక్క proddu-rikka. n. A constellation called ఉత్తరఫల్లునీనక్షత్రము. ప్రొద్దురిక్క నెల proddu-rikka-nela. n. A name of the Telugu month called ఫాల్గుణమాసము.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. ప్రొద్దు proddu, p. 856", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=856", "notes": "A calque on the deity: Uttara-Phalgunī's devatā is Aryaman, an Āditya, i.e. a sun-god. proddu is the ordinary Dravidian word for sun/daytime. The fact that Telugu also names the whole month from it (proddu-rikka-nela = Phālguna) shows the vernacular nomenclature was a working calendar, not a poetic ornament."}, {"language": "Santali", "region": "Santal Parganas, Jharkhand / adjoining Bengal and Odisha", "name_native": null, "name_roman": "sin ipil", "literal_meaning": "sun-star, day-star", "register": "tribal", "confidence": "unidentified", "usage_note": null, "quote": "sin ipil, n. The day-star (v. sub ipil).", "citation": "Bodding, A Santal Dictionary, vol. V (1936), s.v. sin ipil, p. 284", "source_url": "https://archive.org/download/in.ernet.dli.2015.31960/2015.31960.A-Santal-Dictionary--Vol5_djvu.txt", "notes": "Bodding refers the reader to the article ipil in an earlier volume; only vol. V of the Santal Dictionary is on the Internet Archive, so the identification could not be checked. 'Day-star' would most naturally be the morning star, but the sun itself is sin cando in the neighbouring entry, so the sense is not settled here."}]}, {"key": "zodiac", "title": "The zodiac", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "—", "bayer": "—", "constellation": "Scorpius"}, "sanskrit_db_id": null, "names": [{"language": "Telugu", "region": "Telugu country (Madras Presidency: Coastal Andhra, Rayalaseema, Telangana)", "name_native": "తేలురాశి", "name_roman": "tēlu-rāsi", "literal_meaning": "the scorpion sign", "register": "vernacular", "confidence": "certain", "usage_note": null, "quote": "తేలు [Tel.] n. A scorpion. తేలుమీను. a sort of fish. తేలురాసి tēlu-vāsi. n. The constellation Scorpio. వృశ్చికరాశi.", "citation": "Brown, C. P., A Telugu-English Dictionary, new ed., thoroughly revised and brought up to date (Madras: Society for Promoting Christian Knowledge, 1903), s.v. తేలు tēlu, p. 554", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/brown_query.py?page=554", "notes": "A zodiacal sign, not a nakṣatra, so no db id. Included because it is a rare case of a vernacular Telugu word (tēlu 'scorpion') replacing the Sanskrit element (vṛścika) in a calendrical term. Brown's romanisation 'tēlu-vāsi' is a misprint for tēlu-rāsi."}, {"language": "Kannada", "region": "Karnataka (Mysore, Canara, Deccan)", "name_native": "ಭಗಣ", "name_roman": "bhagaṇa", "literal_meaning": "the troop of stars", "register": "sanskritic", "confidence": "certain", "usage_note": null, "quote": "ಭಗಣ bha-gaṇa. the whole multitude of stars or constellations (ದ್ವಿಜ, ನಕ್ಷತ್ರಂಗಳ್ Nn. 36; ನಕ್ಷತ್ರಂಗಳ್ 40; ಮೀನ್ Śm. 99); the zodiac. 2, N. of a metrical foot (Ch.).", "citation": "Kittel, F., A Kannaḍa-English Dictionary (orig. Mangalore: Basel Mission, 1894); cited from the revised and enlarged edition, [Madras] University of Madras, 1968-71, as keyed for DSAL, s.v. ಭಗಣ bhagaṇa, p. 1234", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/kittel_query.py?page=1234", "notes": "Included for the parenthesis: the Kannada nighaṇṭu Śabdamaṇidarpaṇa glosses the Sanskrit collective bhagaṇa simply with ಮೀನ್, 'fish/star'. Brown has the same word in Telugu, భగణము (p. 922), 'An assemblage of stars'. HOMONYM: also a metrical foot in both languages."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ഭഗണം", "name_roman": "bhagaṇam", "literal_meaning": "'the troop of stars' (ഭം a star + ഗണം troop)", "register": "sanskritic", "confidence": "certain", "usage_note": "A technical term of Kerala astronomy: ഭഗണം also means a complete revolution, and ഭഗണഭൂദിനങ്ങള്‍ 'revolutions and civil days in a caturyuga' is quoted from a Malayalam gaṇita text.", "quote": "ഭഗണം bhagaṇam bhaġaṇam S. ( ഭം a star, fr. ഭാ ). The host of stars, zodiac; also = 1/12 രാശി (astr.). ചതുര്‍യ്യുഗത്തിങ്കലേ ഭഗണഭൂദിനങ്ങള്‍, തികഞ്ഞ ഭ'ങ്ങള്‍ ഉളവാകും Gan.", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ഭഗണം bhagaṇam, p. 756", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%AD%E0%B4%97%E0%B4%A3%E0%B4%82&searchhws=yes&matchtype=exact", "notes": "Gundert's citation 'Gan.' is a Malayalam mathematical/astronomical work — direct lexical evidence that the technical vocabulary of the Kerala school passed into the general language. Note also ഭഗണന്‍ 'an astrologer' in the same entry."}]}, {"key": "ursa-minor", "title": "Ursa Minor", "kind": "figure", "ra": 240.0, "dec": 77.0, "modern_star": {"common_name": "Ursa Minor", "bayer": "α–η Ursae Minoris", "constellation": "Ursa Minor"}, "sanskrit_db_id": "rksha", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "ध्रुवमत्स्य", "name_roman": "dhruvamatsya", "literal_meaning": "the pole-fish", "register": "vernacular", "confidence": "likely", "usage_note": null, "quote": "॰मत्स्य -पु. (ज्यो.) लघुऋक्ष किंवा लघुऋक्षांतील दोन मुख्य तार्‍यांपैकीं एक. दुसरा मुख्य तारा ध्रुव होय.", "citation": "Y. R. Date et al., Maharashtra Sabdakosa (Poona, 1932-38), s.v. ध्रुव (compound ॰मत्स्य), p. 1770", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/marathi_query.py?qs=%E0%A4%A7%E0%A5%8D%E0%A4%B0%E0%A5%81%E0%A4%B5&searchhws=yes&matchtype=exact", "notes": "A 20th-century Marathi constellation vocabulary rather than village usage: Date's own supporting quotation is from a teacher-training manual listing ध्रुवमत्स्य beside सप्तर्षि, नरतुरंगम ('man-horse' = Sagittarius) and ययाति as figures to teach children. Register 'vernacular' in the sense of Marathi-formed, but the milieu is the modern classroom, not folk tradition. Date is also internally unsure whether the word names Ursa Minor as a whole or one of its two bright stars."}, {"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "فرقدان", "name_roman": "farqadān", "literal_meaning": "'the two calves' (dual of farqad 'a calf')", "register": "vernacular", "confidence": "certain", "usage_note": "The Arabic al-farqadān, the pair that circles close to the pole. Shakespear (1834, p. 1258) muddles them as 'Two stars near the pole, the greater and lesser bears'; Platts has the identification right.", "quote": "A فرقدان farqadān , s.m. dual (of فرقد farqad, 'a calf'), Two bright stars in Ursa Minor near the pole-star.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (London, 1884), s.v. farqadān, p. 779", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/platts_q /molesworth_query.py?qs=%E0%A4%95%E0%A4%A1%E0%A4%AA%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "A COMPETING folk name for the same asterism as अंधळ्या — Citrā/Spica has at least two cultivators' names in Molesworth's Marathi, keyed to different consequences of the same rain."}, {"language": "Malayalam", "region": "Kerala (Malabar, Cochin, Travancore)", "name_native": "ചിത്ര / ചിത്തിര", "name_roman": "citra / cittira", "literal_meaning": "'the bright, variegated one'", "register": "sanskritic", "confidence": "disputed", "usage_note": null, "quote": "ചിത്ര citra čitra S. (foll.) & ചിത്തിര 1. The 14th lunar asterism (Spica virginis; mod, bright star in Bootes); the month ചൈത്രം or മേടം .", "citation": "Gundert, A Malayalam and English Dictionary (1872), s.v. ചിത്ര citra, p. 361", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/gundert_query.py?qs=%E0%B4%9A%E0%B4%BF%E0%B4%A4%E0%B5%8D%E0%B4%B0&searchhws=yes&matchtype=exact", "notes": "Gundert gives two incompatible identifications in one breath — Spica, and 'mod. bright star in Bootes' (i.e. Arcturus). The second is an error, probably contamination from ചോതി/Svātī on the facing sense; Spica is the standard identification and is what the Sanskrit database carries."}]}, {"key": "capella", "title": "Capella", "kind": "star", "ra": 79.17, "dec": 45.99, "modern_star": {"common_name": "Capella", "bayer": "α Aurigae", "constellation": "Auriga"}, "sanskrit_db_id": "brahmahridaya", "names": [{"language": "Urdu", "region": "Urdu, from Arabic", "name_native": "عيوق", "name_roman": "ʻaiyūq", "literal_meaning": "Arabic al-ʻayyūq", "register": "vernacular", "confidence": "certain", "usage_note": "One of the very few individual stars for which Platts gives a precise positional identification, down to the Bayer letter.", "quote": "A عيوق ʻaiyūq , s.m. The star Capella, the bright star (a) upon the left shoulder of Auriga.", "citation": "John T. Platts, A Dictionary of Urdu, Classical Hindi and English (Lond
