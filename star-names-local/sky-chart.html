்கள்", "citation": "Patiṟṟuppattu 59, ll. 1-2 (Sixth Ten); Project Madurai e-text PM 0038", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0038.html", "notes": "TEXTUAL NOTE: the Project Madurai e-text prints line 2 as 'மாசி நின்ற *மாகூர் திங்கள்*', the asterisks and bold flanking மாகூர் திங்கள் because that phrase is this poem's பெயர் (title-phrase), given as such in its colophon — they are editorial emphasis, not a lacuna, and the line is continuous. Line 1's '(டு)' and '(து)' are the editor's parenthesised restorations and are kept here as printed; nothing has been supplied by the compiler. The Tamil Lexicon (s.v. மாசி², vol. V p. 3147) cites this exact line as பதிற்றுப். 59, 2 and defines the word 'The 11th solar month = February-March', adding sense 2, 'The 10th nakṣatra. See மகம்²', from the commentary on Cilappatikāram 3, 123. HOMONYM: மாசி¹ on the previous page is 'mist, cloud' and 'a sea-fish', probably from மாசு."}]}, {"key": "corvus", "title": "Corvus", "kind": "figure", "ra": 183.95, "dec": -17.54, "modern_star": {"common_name": "Gienah", "bayer": "γ Corvi", "constellation": "Corvus"}, "sanskrit_db_id": "hasta", "names": [{"language": "Marathi", "region": "Satara district, Deccan", "name_native": null, "name_roman": "Hasti Nakshatra", "literal_meaning": "the Elephant asterism", "register": "folk", "confidence": "certain", "usage_note": "names the heavy westerly downpour of September, distinguished by cultivators from the regular south-west monsoon", "quote": "it is known as the fall of the Hasti Nakshatra or the Elephant Guest-house.", "citation": "Gazetteer of the Bombay Presidency, Vol. XIX: Satara (Bombay: Government Central Press, 1885), p. 19", "source_url": "https://archive.org/details/wbsl.15257", "notes": "Independent confirmation, from revenue-survey fieldwork rather than a dictionary, of the elephant reading of Hasta that Molesworth records s.v. हत्ती. The sentence quoted is preceded by: 'A heavy burst, often six inches, of westerly rain nearly always happens in September. The people do not regard this as part of the regular south-west monsoon' — that lead-in is quoted here in the printed reading rather than the scan's, which garbles it as 'A heavy bursty often six inches^ of westerly rain nearly alw^ays happens'. The Nasik volume (Vol. XVI, 1883, p. 15) has the same: the rains end 'until the Hasta Nakshatra or sign of the Elephant in the first half of October' (the scan prints 'Rasta'), and it calls the September-October rains 'the elephant showers'. Roman only; no Devanagari is printed in the Gazetteer."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "हत्ती", "name_roman": "hattī", "literal_meaning": "elephant", "register": "folk", "confidence": "certain", "usage_note": "हत्तीचें उथाण, the sultriness of the Hasta period; Pr. पडेल हत्ती तर पाडील भिंती, 'if the elephant falls it will bring down walls' — of torrential rain", "quote": "हत्ती hattī m (हस्ती S) An elephant. Pr. हत्तीबरोबर बैलाचें वारगोळें. 2 The thirteenth nakshatra or lunar mansion. Note. This asterism is properly named हस्त, being designated by a hand, not by an elephant. It is by popular understanding, howsoever extensive or established, or howsoever inclusive of the erudite or educated, that it is named हत्ती, and that it acquires references and associations as outpouring heavy rain. Pr. पडेल हत्ती तर पाडील भिंती.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. हत्ती, p. 885", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B9%E0%A4%A4%E0%A5%8D%E0%A4%A4%E0%A5%80&searchhws=yes&matchtype=exact", "notes": "A pure case of folk reanalysis, and Molesworth says so in as many words: हस्त means 'hand', but Marathi speakers — learned ones included — hear हत्ती 'elephant', and the whole weather-imagery of the asterism (an elephant's downpour, walls knocked flat) follows from the mishearing. This is the answer to 'what does Marathi call Corvus': not a crow, an elephant. The reanalysis has entered ritual: Molesworth s.v. हस्तागौर (p. 892) describes 'the image or figure of गौरी seated upon an elephant, and worshiped whilst the sun is in हस्तनक्षत्र', and s.v. गजगौरीव्रत (p. 219) the same rite as performed when 'the sun enters the constellation of elephant'."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "हत्तीबार", "name_roman": "hattībāra", "literal_meaning": "the elephant-crop", "register": "folk", "confidence": "certain", "usage_note": "the second fruit crop of the year, ripening under Hasta", "quote": "हत्तीबार hattībāra m (Elephant-crop.) A term for the fruit-crop which ripens under हस्तनक्षत्र, i. e. the second crop. The two other crops are मृगबार & आंबेबार.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. हत्तीबार, p. 885", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%B9%E0%A4%A4%E0%A5%8D%E0%A4%A4%E0%A5%80%E0%A4%AC%E0%A4%BE%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "Shows the star-name in load-bearing agricultural use: the farming year's three fruit crops are named मृगबार, हत्तीबार and आंबेबार, two of the three after asterisms."}]}, {"key": "pegasus", "title": "Pegasus", "kind": "figure", "ra": 344.0, "dec": 20.0, "modern_star": {"common_name": "Upsilon and Tau Pegasi and neighbours", "bayer": "υ, τ Pegasi", "constellation": "Pegasus"}, "sanskrit_db_id": null, "names": [{"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "bursi ipilko", "literal_meaning": "the smouldering-fire stars", "register": "tribal", "confidence": "likely", "usage_note": "The dying embers of the fire the threshing-floor watchman keeps under his cot on cold nights. Hoffmann adds that Mundas who do not know the maraṅ parkom group transfer the seen there, viz., the Great Square delineated by Alpharatz in Andromeda, and Scheat, Markab, Algenib in Pegasus. These four stars are the maraṅ parkom ipilko, also called Siṅgboṅga gitikenteą parkom ipilko", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "parkom is the same string cot that Santali makes into the old woman's bed in Ursa Major. The Mundas run the cot image through four parts of the sky: the god's bed here, the co-wives' bed in Lupus, the bier in Ursa Major, and the watchman's pallet implied by the ember stars."}]}, {"key": "castor-pollux", "title": "Castor and Pollux", "kind": "cluster", "ra": 114.83, "dec": 29.5, "modern_star": {"common_name": "Pollux", "bayer": "β Geminorum", "constellation": "Gemini"}, "sanskrit_db_id": "punarvasu", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "म्हातारा", "name_roman": "mhātārā", "literal_meaning": "the old fellow", "register": "folk", "confidence": "certain", "usage_note": "cultivators' name for the seventh nakṣatra and its rain; paired with तरणा 'the youngster' for Puṣya", "quote": "म्हातारा mhātārā a (महत्तर S) Old, aged, advanced in years. 2 (masc because पाऊस is understood.) The old fellow. A term amongst agriculturists for पुनर्वसु the seventh nakshatra; as तरणा (The lad or youngster) is for पुष्य the eighth. Pr. म्हाताऱ्यानें केलें नांव तरण्यानें वाहविले गांव.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. म्हातारा, p. 673", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%AE%E0%A5%8D%E0%A4%B9%E0%A4%BE%E0%A4%A4%E0%A4%BE%E0%A4%B0%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "The proverb Molesworth prints — 'the old man made the name, the young man washed the village away' — is a rain proverb: Punarvasu's rain earns the reputation, Puṣya's does the damage. Confirmed by Date, p. 2554: 'पुनर्वसु नक्षत्राबद्दल शेतकरी लोक म्हणतात. तसेंच पुष्य नक्षत्राला तरणा अशी संज्ञा देतात.'"}, {"language": "Marathi", "region": "Maharashtra", "name_native": "थोरला कुंवर", "name_roman": "thōralā kuṃvara", "literal_meaning": "the elder son / the big boy", "register": "folk", "confidence": "certain", "usage_note": "cultivators' name for the seventh nakṣatra", "quote": "थोरला thōralā, कुंवर kuṃvara m (The great son or boy, the old fellow.) A term amongst agriculturists for the seventh nakshatra or पुनर्वसु. See further under तरणा.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. थोरला कुंवर, p. 398", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A5%E0%A5%8B%E0%A4%B0%E0%A4%B2%E0%A4%BE%20%E0%A4%95%E0%A5%81%E0%A4%82%E0%A4%B5%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "A second folk name for Punarvasu, from the same elder/younger pairing as म्हातारा ~ तरणा but cast as two princes rather than an old man and a youth."}]}, {"key": "praesepe", "title": "Praesepe and Cancer", "kind": "cluster", "ra": 130.1, "dec": 19.67, "modern_star": {"common_name": "Asellus Australis", "bayer": "δ Cancri", "constellation": "Cancer"}, "sanskrit_db_id": "pushya", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "धाकटा कुंवर", "name_roman": "dhākaṭā kuṃvara", "literal_meaning": "the younger son / the little boy", "register": "folk", "confidence": "certain", "usage_note": "cultivators' name for the eighth nakṣatra", "quote": "धाकटा dhākaṭā, कुंवर kuṃvara m (The lad, the youngster.) A name amongst agriculturists for पुष्य the eighth nakshatra, as म्हातारा (the old fellow) is for पुनर्वसु the seventh nakshatra.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. धाकटा कुंवर, p. 437", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A7%E0%A4%BE%E0%A4%95%E0%A4%9F%E0%A4%BE%20%E0%A4%95%E0%A5%81%E0%A4%82%E0%A4%B5%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "Completes the elder/younger prince pair with थोरला कुंवर."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "तरणा", "name_roman": "taraṇā", "literal_meaning": "the young one", "register": "folk", "confidence": "certain", "usage_note": "तरणा पाऊस, 'the youngster-rain', the rain of the eighth nakṣatra", "quote": "तरणा taraṇā a (तरूण S) Young, adult, arrived at puberty. 2 Adolescent. 3 or तरणा पाऊस m (The lad, or youngster-rain.) A name amongst agriculturists for पुष्य or the eighth नक्षत्र; as म्हातारा (The old fellow) is for पुनर्वसु the seventh नक्षत्र.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. तरणा, p. 368", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%A4%E0%A4%B0%E0%A4%A3%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "The younger member of the pair. Molesworth's own cross-references between तरणा, म्हातारा, थोरला कुंवर and धाकटा कुंवर show a coherent four-name system covering just two asterisms."}]}, {"key": "nak-vishakha", "title": "Viśākhā (ι Librae)", "kind": "star", "ra": 222.72, "dec": -19.79, "modern_star": {"common_name": "Viśākhā", "bayer": "ι Librae (with α, β Librae)", "constellation": "Libra"}, "sanskrit_db_id": "vishakha", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "उंदऱ्या", "name_roman": "undaṟyā", "literal_meaning": "the rat-ones", "register": "folk", "confidence": "certain", "usage_note": "its rain is held to bring out rats, venomous reptiles and poisonous plants", "quote": "उंदऱ्या undaṟyā f pl (उंदीर A rat.) A term for the विशाखानक्षत्र and for the rain which falls under it. Because this rain is supposed to produce or to bring abroad rats and venomous reptiles and poisonous plants very plentifully. Ex. उं॰ लागल्या, पडल्या &c. यंदा उं॰ कोरड्या गेल्या.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. उंदऱ्या, p. 95", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%89%E0%A4%82%E0%A4%A6%E0%A4%B1%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "Molesworth's usage examples — 'the undaryā have set in / have fallen', 'this year the undaryā went dry' — show the word in ordinary weather talk."}, {"language": "Marathi", "region": "Maharashtra", "name_native": "उंदऱ्यामांजऱ्या", "name_roman": "undaṟyāmāñjaṟyā", "literal_meaning": "the rats-and-cats", "register": "folk", "confidence": "certain", "usage_note": "the first pair of rains breeds vermin, the second destroys it", "quote": "उंदऱ्यामांजऱ्या undaṟyāmāñjaṟyā f pl (उंदीर Rat, & मांजर Cat.) A term for the two नक्षत्र called विशाखा & अनुराधा, and for the rain which falls under them. Because, whilst the prevalence of the first is supposed to produce rats, reptiles, and noxious plants, that of the second is supposed to destroy or remove them.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. उंदऱ्यामांजऱ्या, p. 95", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%89%E0%A4%82%E0%A4%A6%E0%A4%B1%E0%A5%8D%E0%A4%AF%E0%A4%BE%E0%A4%AE%E0%A4%BE%E0%A4%82%E0%A4%9C%E0%A4%B1%E0%A5%8D%E0%A4%AF%E0%A4%BE&searchhws=yes&matchtype=exact", "notes": "A name for a PAIR of consecutive asterisms taken as one weather unit — Viśākhā (ι Librae) and Anurādhā (δ Scorpii). The sanskrit_db_id points at Viśākhā only; the Anurādhā half corresponds to db id 'anuradha'."}]}, {"key": "planet", "title": "'Planet' as a word", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "the planets", "bayer": null, "constellation": null}, "sanskrit_db_id": "taragraha", "names": [{"language": "Tamil", "region": "Tamil Nadu", "name_native": "கோண்மீன்", "name_roman": "kōṇ-mīṉ (kōḷ-mīṉ)", "literal_meaning": "seizing-star, grasping-star (kōḷ 'seizure, planet')", "register": "vernacular", "confidence": "certain", "usage_note": "The Tamil opposition between the wandering and the fixed lights: kōṇmīṉ 'planet' against nāṇmīṉ 'lunar mansion'. The Ciṟupāṇāṟṟuppaṭai simile is of the sun ringed by planets.", "quote": "வாணிற விசும்பிற் கோண்மீன் சூழ்த்த\nவிளங்கதிர் ஞாயி றெள்ளூந் தோற்றத்து", "citation": "Ciṟupāṇāṟṟuppaṭai ll. 242-243; Project Madurai e-text PM 0064", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0064.html", "notes": "The Tamil Lexicon (s.v. கோண்மீன், vol. II p. 1181) defines it 'Planet, dist. fr. nāṇ-mīṉ; கிரகம்' and cites this exact line as சிறுபாண். 242. Kalittokai 5 sets the two words side by side in one line, 'நாளும் கோள்மீன் தகைத்தலும் தகைமே' (PM 0221), with the fuller form கோள்மீன்."}]}, {"key": "auriga", "title": "Auriga", "kind": "figure", "ra": 85.0, "dec": 42.0, "modern_star": {"common_name": "reported variously as Auriga, Cassiopeia and Sagittarius", "bayer": "α, β, γ, κ Cassiopeiae in one report", "constellation": "Auriga / Cassiopeia"}, "sanskrit_db_id": null, "names": [{"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Samdur, Samudar", "literal_meaning": "the sea", "register": "tribal", "confidence": "disputed", "usage_note": "Comes overhead at 4 a.m. in late May and is the sign that the rains are coming and farming begins. Its brightness is a forecast: bright means a good monsoon and the Gonds sow cotton and other water-hungry crops, dull means a weak one and they sow crops that need less water.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. Different villages placed Samdur in different constellations and the authors leave the identification open. The sowing rule attached to it is the most concrete piece of practical star-use anywhere in this compilation."}]}, {"key": "nak-ashvayuj", "title": "Aśvayuj (Sheratan)", "kind": "star", "ra": 28.66, "dec": 20.81, "modern_star": {"common_name": "Sheratan", "bayer": "β Arietis", "constellation": "Aries"}, "sanskrit_db_id": "ashvayuj", "names": [{"language": "Tamil", "region": "Tamil Nadu", "name_native": "ஐப்பசி", "name_roman": "aippaci", "literal_meaning": "from Skt. āśvayuj, 'joined to the Aśvins'", "register": "sanskritic", "confidence": "certain", "usage_note": "One of the twelve Tamil month-names still in daily use, all of them asterism-derived. The Lexicon records that the word also names the asterism itself.", "quote": "ஐப்பசி aippaci , n. < āšvayuj. 1. The seventh Tamil month, October-November; ஏழாவது மாதம். (உபதேசரத். 6.) 2. The first nakṣstra. See அசுவதி. (சீவக. 1770.)", "citation": "Tamil Lexicon (University of Madras, 1924-36), s.v. ஐப்பசி, vol. I p. 578; quoting Cīvakacintāmaṇi 1770", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%90%E0%AE%AA%E0%AF%8D%E0%AE%AA%E0%AE%9A%E0%AE%BF&searchhws=yes&matchtype=exact", "notes": "The Lexicon's derivations for the rest of the twelve, all verified at the same endpoint: சித்திரை Cittirai < citrā (p. 1391), வைகாசி Vaikāci < vaiśākha (p. 3849), ஆடி Āṭi < āṣāḍha (p. 219), ஆவணி Āvaṇi < śrāvaṇa (p. 249), புரட்டாசி Puraṭṭāci cf. proṣṭhapadā (p. 2769), கார்த்திகை Kārttikai < kṛttikā (p. 880), மார்கழி Mārkaḻi < mārgaśīrṣa (p. 3170), தை Tai < taiṣī (p. 2074), மாசி Māci < māgha (p. 3147), பங்குனி Paṅkuṉi < Pkt. phagguṇi < phalgunī (p. 2390). ஆனி Āṉi (p. 221) is the exception: the Lexicon gives it NO etymology at all, while recording that it also names the 19th nakṣatra (Mūlam) and the 21st (Uttirāṭam) — a gap worth flagging."}]}, {"key": "cygnus", "title": "Cygnus", "kind": "figure", "ra": 310.0, "dec": 42.0, "modern_star": {"common_name": "Delta Cygni", "bayer": "δ Cygni", "constellation": "Cygnus"}, "sanskrit_db_id": null, "names": [{"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "laṇḍae ipil", "literal_meaning": "the one who is laughing", "register": "tribal", "confidence": "disputed", "usage_note": "The third fire-thief, who cannot help laughing at the discomfiture awaiting the sleeper, and whom the others push aside for fear he will wake the man.", "quote": "The one who cannot help laughing, the laṇḍae ipil, is Delta of Cygnus.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VII, s.v. ipil, cols. 1919-1925", "source_url": "https://archive.org/download/dli.bengal.10689.20088/10689.20088_djvu.txt", "notes": "Hoffmann's own identification, and geometrically awkward: δ Cygni lies a long way from Pegasus. He says himself, of the whole attempt to place these figures near the Pleiades, that it 'is rather a failure'. Recorded with the printed identification and the doubt attached."}]}, {"key": "leo-virgo", "title": "Leo and Virgo", "kind": "figure", "ra": 180.0, "dec": 2.0, "modern_star": {"common_name": "Leo, with the procession running into Virgo", "bayer": "η, γ, α, δ, θ Leonis", "constellation": "Leo / Virgo"}, "sanskrit_db_id": null, "names": [{"language": "Gondi", "region": "Nagpur region: Chandrapur, Yavatmal, Gondia (Maharashtra), Adilabad (Telangana), Balaghat, Seoni, Mandla (Madhya Pradesh)", "name_native": null, "name_roman": "Murda; Duf; Shika; Ladavya", "literal_meaning": "the corpse; the drum-bearer; the leader of the procession; the weeping women", "register": "tribal", "confidence": "likely", "usage_note": "The body of Leo is a dead man, head at Eta Leonis, one hand at Algieba and the other at Regulus, legs at Delta and Theta Leonis. Delta Leonis is the pall-bearer, the stars of Virgo are the procession, and the whole thing moves west to east across the sky.", "quote": null, "citation": "Vahia & Halkare, 'Aspects of Gond Astronomy', Journal of Astronomical History and Heritage 16(1), 29-44 (2013); preprint arXiv:1306.2416", "source_url": "https://arxiv.org/pdf/1306.2416", "notes": "In copyright: paraphrased throughout and never quoted, per this compilation's rules, so the quote field is null. The survey covered 15 Gond villages in March 2011, with identifications checked by projecting a sky chart for the informants and later in a planetarium, which is why the modern identifications are given as reported. The most elaborate narrative constellation in the Gond material and one with no counterpart in the nakshatra system, which cuts this stretch of sky into Maghā, Pūrva- and Uttara-Phalgunī with quite different figures."}]}, {"key": "lupus", "title": "Lupus", "kind": "figure", "ra": 230.0, "dec": -45.0, "modern_star": {"common_name": "Alpha, Beta, Mu and Rho Lupi", "bayer": "α, β, μ, ρ Lupi", "constellation": "Lupus"}, "sanskrit_db_id": null, "names": [{"language": "Mundari", "region": "Chota Nagpur plateau, Ranchi district, Jharkhand", "name_native": null, "name_roman": "hirumea parkom ipilko", "literal_meaning": "the co-wives' bed stars", "register": "tribal", "confidence": "certain", "usage_note": "The bed two co-wives are fighting over — that is, the mastership of the house.", "quote": "The bed, hirumea parkom ipilko, is situated in Lupus, to the N. E. of the Southern Cross, and is represented by four stars, Alpha, Beta, Mu and Ro, which delineate a nearly equilateral parallelogram.", "citation": "Hoffmann, Encyclopaedia Mundarica, vol. VI, s.v. hirumea parkom ipilko, cols. 1751-1757", "source_url": "https://archive.org/download/in.ernet.dli.2015.14926/2015.14926.Encyclopedia-Mundarica-Vol-vi-1932_djvu.txt", "notes": "hirumea is the Mundari term for the relationship between two co-wives (vol. VI s.v.)."}]}, {"key": "nak-nakshatra-generic", "title": "Nakṣatra (star / asterism (generic))", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "—", "bayer": "—", "constellation": "—"}, "sanskrit_db_id": "nakshatra-generic", "names": [{"language": "Marathi", "region": "Maharashtra", "name_native": "अंधळें नक्षत्र", "name_roman": "andhaḷēṃ nakṣatra", "literal_meaning": "a blind asterism", "register": "folk", "confidence": "certain", "usage_note": "used in divining for lost property", "quote": "अंधळें andhaḷēm, नक्षत्र nakṣatra n A blind Nakshatra. A common term for Nakshatras, during which a thing lost is not found but after great search.", "citation": "J. T. Molesworth, A Dictionary, Marathi and English, 2nd ed. rev. and enl. (Bombay: Bombay Education Society's Press, 1857), s.v. अंधळें नक्षत्र, p. 24", "source_url": "https://dsal.uchicago.edu/cgi-bin/app/molesworth_query.py?qs=%E0%A4%85%E0%A4%82%E0%A4%A7%E0%A4%B3%E0%A5%87%E0%A4%82%20%E0%A4%A8%E0%A4%95%E0%A5%8D%E0%A4%B7%E0%A4%A4%E0%A5%8D%E0%A4%B0&searchhws=yes&matchtype=exact", "notes": "A folk-astrological class rather than a name for particular stars, hence no identification. Related to but distinct from अंधळ्या, the Citrā rain-name above."}]}, {"key": "saturn", "title": "Saturn", "kind": "figure", "ra": null, "dec": null, "modern_star": {"common_name": "Saturn", "bayer": null, "constellation": null}, "sanskrit_db_id": null, "names": [{"language": "Tamil", "region": "Tamil Nadu", "name_native": "மைம்மீன்", "name_roman": "mai-m-mīṉ", "literal_meaning": "black star (mai 'blackness, collyrium')", "register": "vernacular", "confidence": "certain", "usage_note": "Named by colour, like veṇmīṉ 'white star' for Venus and cemmīṉ 'red star'. The Puṟanāṉūṟu line stacks three portents — the black star smoking, a comet appearing, Venus running to the south — and says the good king's land is watered even so.", "quote": "மைம் மீன் புகையினும், தூமம் தோன்றினும்,\nதென் திசை மருங்கின் வெள்ளி ஓடினும்,", "citation": "Puṟanāṉūṟu 117, ll. 1-2 (by Kapilar); Project Madurai e-text PM 0057", "source_url": "https://www.projectmadurai.org/pm_etexts/utf8/pmuni0057.html", "notes": "The Tamil Lexicon (s.v. மைம்மீன், vol. V p. 3369, https://dsal.uchicago.edu/cgi-bin/app/tamil-lex_query.py?qs=%E0%AE%AE%E0%AF%88%E0%AE%AE%E0%AF%8D%E0%AE%AE%E0%AF%80%E0%AE%A9%E0%AF%8D&searchhws=yes&matchtype=exact) defines it 'The planet Saturn, as black in colour; சனி' and cites this line as புறநா. 117. This one couplet is the single richest Tamil astronomical line: it gives maimmīṉ (Saturn), tūmam (comet) and veḷḷi (Venus) in two lines, all three as omens of drought. No Sanskrit-database counterpart; the planets are not individually in that database."}]}], "languages": [["Marathi", 62], ["Tamil", 61], ["Telugu", 57], ["Kannada", 41], ["Malayalam", 36], ["Odia", 31], ["Hindi", 30], ["Mundari", 26], ["Bengali", 24], ["Sinhala", 24], ["Urdu", 20], ["Gondi", 20], ["Santali", 17], ["Assamese", 11], ["Punjabi", 11], ["Kurukh", 9], ["Tulu", 8], ["Toda", 7], ["Konkani", 5], ["Khasi", 5], ["Nicobarese", 4], ["Chhattisgarhi", 3], ["Andamanese", 3], ["Kodava", 3], ["Ho", 2], ["Gujarati", 2]], "about": "<p><b>522 names for 46 sky objects, in 26 languages.</b> What speakers of the Indian languages call a star, an asterism or a constellation — each name quoted from the dictionary or ethnography it comes from, with the page cited.</p><p><b>Marker area is the number of languages</b> that name the object, recomputed as you filter. Colour is what kind of thing it is, which does not change when you filter. The Milky Way is drawn as the galactic band rather than a point, because that is where it actually is.</p><p><b>Register is the point of the database.</b> Most Indian languages took the 27 Sanskrit nakshatra names and adapted them; a table of those adaptations would be large and nearly uninformative. The tags separate that borrowed layer from names each language built itself — 369 of 522 names are not Sanskritic. Filter to <i>tribal</i> alone to see a sky organised on entirely different principles.</p><p><b>Sources</b> are public-domain lexicography and ethnography, chiefly the Digital Dictionaries of South Asia and archive.org — Molesworth 1857, Platts 1884, Kittel, Brown 1852, Gundert 1872, the Madras Tamil Lexicon, Praharaj, Maffei 1883, Hoffmann's Encyclopaedia Mundarica, Bodding, Rivers 1906 on the Toda, Man 1883 on the Andamans. Every quotation was re-fetched and matched against its source. Where a source is still in copyright the finding is paraphrased and no quotation is shown.</p><p><b>Nothing was back-transliterated.</b> Where a source printed only a romanization, no script is given — much 19th-century Indic type survives in these scans only as unreadable OCR, and several entries were read off page images instead.</p><p>Full database, with every caveat and the negative findings: <code>docs/star-names-local/</code> in the repository. The separate Sanskrit-text database is <code>docs/star-names/</code>.</p>"};

const KIND = {
  star:    { label: "Single star",      color: "var(--c-star)",    hex: "#c98500", shape: "circle" },
  cluster: { label: "Cluster",          color: "var(--c-cluster)", hex: "#3987e5", shape: "circle" },
  figure:  { label: "Figure / group",   color: "var(--c-figure)",  hex: "#d55181", shape: "square" },
  diffuse: { label: "Milky Way",        color: "var(--c-diffuse)", hex: "#008300", shape: "circle" },
};
const REGISTERS = ["vernacular", "folk", "tribal", "sanskritic"];
const REG_HEX = { vernacular: "#3987e5", folk: "#c98500", tribal: "#d55181", sanskritic: "#8a93a8" };

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("sky");
const tip = document.getElementById("tooltip");
const drawer = document.getElementById("drawer");
const drawerBody = document.getElementById("drawer-body");
const drawerTitle = document.getElementById("drawer-title");

const state = {
  kind: { star: true, cluster: true, figure: true, diffuse: true },
  reg: { vernacular: true, folk: true, tribal: true, sanskritic: true },
  lang: "",  // "" = all
};

const MARGIN = { top: 34, right: 26, bottom: 62, left: 46 };
let PW = 0, PH = 0;
const xOf = ra => MARGIN.left + ((360 - ra) / 360) * PW;
const yOf = dec => MARGIN.top + (90 - dec) / 180 * PH;

// J2000 galactic -> equatorial, for the Milky Way band.
const NGP_RA = 192.85948 * Math.PI / 180, NGP_DEC = 27.12825 * Math.PI / 180, L_NCP = 122.93192 * Math.PI / 180;
function galToEq(lDeg, bDeg) {
  const l = lDeg * Math.PI / 180, b = bDeg * Math.PI / 180;
  const sd = Math.sin(NGP_DEC) * Math.sin(b) + Math.cos(NGP_DEC) * Math.cos(b) * Math.cos(L_NCP - l);
  const dec = Math.asin(Math.max(-1, Math.min(1, sd)));
  const y = Math.cos(b) * Math.sin(L_NCP - l);
  const x = Math.cos(NGP_DEC) * Math.sin(b) - Math.sin(NGP_DEC) * Math.cos(b) * Math.cos(L_NCP - l);
  let ra = NGP_RA + Math.atan2(y, x);
  ra = ((ra * 180 / Math.PI) % 360 + 360) % 360;
  return [ra, dec * 180 / Math.PI];
}
/** Lift the pen where a path crosses the RA seam, so nothing streaks across the chart. */
function wrapPath(pts) {
  let d = "", prev = null;
  for (const [ra, dec] of pts) {
    const x = xOf(ra), y = yOf(dec);
    if (prev !== null && Math.abs(ra - prev) > 180) d += ` M ${x.toFixed(1)} ${y.toFixed(1)}`;
    else d += (d ? " L" : "M") + ` ${x.toFixed(1)} ${y.toFixed(1)}`;
    prev = ra;
  }
  return d;
}

/** Names of an object surviving the current register + language filter. */
function visibleNames(o) {
  return o.names.filter(n => state.reg[n.register] && (!state.lang || n.language === state.lang));
}
function visibleLangCount(o) {
  return new Set(visibleNames(o).map(n => n.language)).size;
}

function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const esc = s => String(s == null ? "" : s);

function draw() {
  const W = svg.clientWidth || window.innerWidth, H = svg.clientHeight || window.innerHeight;
  PW = W - MARGIN.left - MARGIN.right;
  PH = H - MARGIN.top - MARGIN.bottom;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (PW <= 0 || PH <= 0) return;

  const gGrid = el("g", {}), gBand = el("g", {}), gMark = el("g", {}), gLab = el("g", {});

  // grid
  for (let ra = 0; ra <= 360; ra += 30) {
    const x = xOf(ra);
    gGrid.appendChild(el("line", { x1: x, y1: MARGIN.top, x2: x, y2: MARGIN.top + PH,
      stroke: ra % 90 === 0 ? "var(--grid-strong)" : "var(--grid)", "stroke-width": 1 }));
    const t = el("text", { x, y: MARGIN.top + PH + 16, "text-anchor": "middle", class: "axis-lab" });
    t.textContent = (ra / 15) % 24 + "h";
    gGrid.appendChild(t);
  }
  for (let dec = -90; dec <= 90; dec += 30) {
    const y = yOf(dec);
    gGrid.appendChild(el("line", { x1: MARGIN.left, y1: y, x2: MARGIN.left + PW, y2: y,
      stroke: dec === 0 ? "var(--grid-strong)" : "var(--grid)", "stroke-width": 1 }));
    const t = el("text", { x: MARGIN.left - 8, y: y + 3.5, "text-anchor": "end", class: "axis-lab" });
    t.textContent = (dec > 0 ? "+" : "") + dec + "°";
    gGrid.appendChild(t);
  }

  // Milky Way band, if its object survives the filter. It gets a handle on the
  // band itself: it is the most widely named object here (21 languages), so it
  // has to be clickable like everything else — a band you cannot open is a hole.
  const mw = DB.objects.find(o => o.key === "milky-way");
  const mwVisible = mw && state.kind.diffuse && visibleNames(mw).length > 0;
  if (mwVisible) {
    for (const b of [-10, 0, 10]) {
      const pts = [];
      for (let l = 0; l <= 360; l += 2) pts.push(galToEq(l, b));
      gBand.appendChild(el("path", { d: wrapPath(pts), fill: "none", stroke: KIND.diffuse.hex,
        "stroke-width": b === 0 ? 1.6 : 1, opacity: b === 0 ? 0.55 : 0.25,
        "stroke-dasharray": b === 0 ? "none" : "4 4" }));
    }
    const [mra, mdec] = galToEq(40, 0);
    mw.ra = mra; mw.dec = mdec;   // so the tooltip and hit-test find it like any other
  } else if (mw) {
    mw.ra = mw.dec = null;        // cleared, or a filtered-out band leaves a ghost handle
  }

  // marks
  const shown = DB.objects.filter(o => o.ra !== null && state.kind[o.kind] && visibleNames(o).length > 0);
  shown.sort((a, b) => visibleLangCount(b) - visibleLangCount(a));
  const maxL = Math.max(1, ...shown.map(visibleLangCount));
  const placed = [];
  for (const o of shown) {
    const n = visibleLangCount(o);
    const r = 4 + 11 * Math.sqrt(n / maxL);       // area ∝ language count
    const x = xOf(o.ra), y = yOf(o.dec), k = KIND[o.kind];
    const g = el("g", { class: "marker", tabindex: "0", role: "button",
      "data-key": o.key, "aria-label": `${o.title}, ${n} languages` });
    if (k.shape === "square") {
      g.appendChild(el("rect", { x: x - r * 0.8, y: y - r * 0.8, width: r * 1.6, height: r * 1.6,
        rx: 2, fill: k.hex, "fill-opacity": .28, stroke: k.hex, "stroke-width": 1.6 }));
    } else {
      g.appendChild(el("circle", { cx: x, cy: y, r, fill: k.hex, "fill-opacity": .28,
        stroke: k.hex, "stroke-width": 1.6 }));
    }
    g.appendChild(el("circle", { cx: x, cy: y, r: Math.max(r, 11), fill: "transparent" })); // hit target
    gMark.appendChild(g);

    // selective direct labels: only where they fit without collision
    const lx = x + r + 5, ly = y + 4;
    const box = { x: lx, y: ly - 9, w: o.title.length * 5.6, h: 13 };
    const clash = placed.some(p => !(box.x > p.x + p.w || box.x + box.w < p.x || box.y > p.y + p.h || box.y + box.h < p.y));
    if (!clash && box.x + box.w < MARGIN.left + PW && PW * PH > 190000) {
      const t = el("text", { x: lx, y: ly, class: "obj-lab", fill: "var(--ink-2)" });
      t.textContent = o.title;
      gLab.appendChild(t);
      placed.push(box);
    }
  }
  svg.appendChild(gGrid); svg.appendChild(gBand); svg.appendChild(gMark); svg.appendChild(gLab);
  updateSub(shown.length);
}

function updateSub(nShown) {
  const total = DB.objects.reduce((a, o) => a + visibleNames(o).length, 0);
  const langs = new Set();
  DB.objects.forEach(o => visibleNames(o).forEach(n => langs.add(n.language)));
  document.getElementById("subline").textContent =
    `${total} names · ${langs.size} languages · ${nShown} objects on the sky · ` +
    `${DB.objects.filter(o => o.ra === null && visibleNames(o).length).length} in the index`;
}

// ---------- HUD ----------
const legend = document.getElementById("legend");
for (const key of ["star", "cluster", "figure", "diffuse"]) {
  const k = KIND[key];
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot${k.shape === "square" ? " sq" : ""}" style="background:${k.hex}"></span>${k.label}`;
  b.onclick = () => { state.kind[key] = !state.kind[key]; b.classList.toggle("off", !state.kind[key]);
    b.setAttribute("aria-pressed", String(state.kind[key])); draw(); };
  legend.appendChild(b);
}
const regRow = document.getElementById("registers");
regRow.innerHTML = '<span class="rowlab">Register</span>';
for (const r of REGISTERS) {
  const n = DB.objects.reduce((a, o) => a + o.names.filter(x => x.register === r).length, 0);
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:${REG_HEX[r]}"></span>${r} <span class="n">${n}</span>`;
  b.onclick = () => { state.reg[r] = !state.reg[r]; b.classList.toggle("off", !state.reg[r]);
    b.setAttribute("aria-pressed", String(state.reg[r])); draw(); };
  regRow.appendChild(b);
}
const sel = document.getElementById("langsel");
sel.innerHTML = '<option value="">All languages</option>' +
  DB.languages.map(([l, n]) => `<option value="${l}">${l} (${n})</option>`).join("");
sel.onchange = () => { state.lang = sel.value; draw(); };

// ---------- interaction ----------
function objByKey(k) { return DB.objects.find(o => o.key === k); }

svg.addEventListener("mousemove", ev => {
  const g = ev.target.closest(".marker");
  if (!g) { tip.classList.remove("show"); return; }
  const o = objByKey(g.dataset.key), vs = visibleNames(o);
  const sample = vs.slice(0, 4).map(n => (n.name_native || n.name_roman)).join(" · ");
  tip.innerHTML = `<div class="tt">${esc(o.title)}</div>` +
    `<div class="tn">${visibleLangCount(o)} languages · ${vs.length} names</div>` +
    `<div class="tx">${esc(sample)}${vs.length > 4 ? " …" : ""}</div>`;
  tip.classList.add("show");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - r.width - 10) + "px";
  tip.style.top = Math.min(ev.clientY + 14, window.innerHeight - r.height - 10) + "px";
});
svg.addEventListener("mouseleave", () => tip.classList.remove("show"));

function openObject(key) {
  const o = objByKey(key), vs = visibleNames(o);
  drawerTitle.textContent = "Names";
  let h = `<div class="objhead"><h2>${esc(o.title)}</h2>`;
  if (o.modern_star && o.modern_star.common_name) {
    const m = o.modern_star;
    h += `<div class="mod">${[m.common_name, m.bayer, m.constellation].filter(x => x && x !== "—").map(esc).join(" · ")}</div>`;
  }
  h += `<div class="cnt">${visibleLangCount(o)} languages · ${vs.length} names`;
  if (o.sanskrit_db_id) h += ` · Sanskrit database: <code>${esc(o.sanskrit_db_id)}</code>`;
  h += `</div></div>`;
  for (const n of vs) {
    h += `<div class="nm"><div class="lang">${esc(n.language)}${n.region ? " · " + esc(n.region) : ""}</div>`;
    if (n.name_native) h += `<div class="native">${esc(n.name_native)}</div>`;
    h += `<div class="roman">${esc(n.name_roman)}</div>`;
    if (n.literal_meaning) h += `<div class="lit">‘${esc(n.literal_meaning)}’</div>`;
    h += `<div class="badges"><span class="badge reg-${n.register}">${n.register}</span>` +
         `<span class="badge conf-${n.confidence}">${n.confidence}</span></div>`;
    if (n.usage_note) h += `<div class="use">${esc(n.usage_note)}</div>`;
    if (n.quote) h += `<div class="q">${esc(n.quote)}</div>`;
    else h += `<div class="nq">No quotation — this source is in copyright and is paraphrased only.</div>`;
    h += `<div class="cite">${esc(n.citation)}` +
         (n.source_url ? ` · <a href="${esc(n.source_url)}" target="_blank" rel="noopener">source</a>` : "") + `</div>`;
    if (n.notes) h += `<div class="notes">${esc(n.notes)}</div>`;
    h += `</div>`;
  }
  drawerBody.innerHTML = h;
  drawerBody.scrollTop = 0;
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
}

svg.addEventListener("click", ev => {
  const g = ev.target.closest(".marker");
  if (g) openObject(g.dataset.key);
});
svg.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const g = ev.target.closest(".marker");
  if (g) { ev.preventDefault(); openObject(g.dataset.key); }
});
document.getElementById("drawer-close").onclick = () => {
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
};
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("drawer-close").click(); });

document.getElementById("btn-index").onclick = () => {
  drawerTitle.textContent = "Index";
  const onSky = DB.objects.filter(o => o.ra !== null && visibleNames(o).length);
  const off = DB.objects.filter(o => o.ra === null && visibleNames(o).length);
  const rows = list => list.map(o =>
    `<button class="ix-row" data-key="${o.key}"><span>${esc(o.title)}</span>` +
    `<span class="im">${visibleLangCount(o)} lang · ${visibleNames(o).length} names</span></button>`).join("");
  drawerBody.innerHTML =
    `<div class="ix-h">On the sky</div>${rows(onSky)}` +
    `<div class="ix-h">Not plottable — no fixed position</div>` +
    `<p class="notes">Comets, meteors, the planets and the words for “star” and “sky” have no place on a chart of fixed stars. They are recorded all the same.</p>${rows(off)}`;
  drawerBody.querySelectorAll(".ix-row").forEach(b => b.onclick = () => openObject(b.dataset.key));
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
};
document.getElementById("btn-about").onclick = () => {
  drawerTitle.textContent = "About";
  drawerBody.innerHTML = `<div class="about">${DB.about}</div>`;
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
};

window.addEventListener("resize", draw);
draw();
</script>
